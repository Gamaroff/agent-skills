# skills-config.yaml
#
# This is the consumer-side config for agent-skills *as it dogfoods itself*.
# Schema: docs/reference/configuration.md
# Architecture layout spec: docs/standards/architecture-docs.md
#
# PRD and architecture roots are configurable. The *nested* structure under
# each root is fixed:
#   ${PRD_ROOT}/{domain}/{feature}/epics/epic.{N}.{name}/stories/story.{E}.{S}.{name}/
#   ${ARCH_ROOT}/concepts/{coding-standards,tech-stack,source-tree}.md

prd:
  prdShardedLocation: docs/prd

architecture:
  architectureShardedLocation: docs/architecture

devLoadAlwaysFiles:
  - docs/architecture/concepts/coding-standards.md
  - docs/architecture/concepts/tech-stack.md
  - docs/architecture/concepts/source-tree.md

# loop-supervisor — fresh-context sequential loop runner.
# Every key is optional; these are the defaults made explicit for this repo.
loopSupervisor:
  baseBranch: develop
  roadmapPath: docs/development/project-completion-roadmap.md
  cooldownSeconds: 10
  # dashboardUrl: https://dash.internal/api/loop   # optional; --dashboard overrides
  # There is deliberately no dashboardToken key — this file is committed. The
  # token comes from --dashboard-token or $LOOP_SUPERVISOR_DASHBOARD_TOKEN.

qa: # the QA loop's diminishing-returns exit — schema: docs/reference/configuration.md
  # Test machinery in THIS repository: the eval suites, the per-skill test dirs and
  # the top-level tests/. Findings whose file: matches only these can take the
  # diminishing-returns exit (develop-pipeline-step-5-6-qa-loop.md). This was unset
  # while the reference repo dogfooded the exit it ships, so the exit designed for
  # task.110's five-cycle test-helper loop could never fire there (obs #105).
  testArtifactGlobs:
    - "evals/**"
    - "tests/**"
    - "skills/*/tests/**"
    - "shared/resources/tests/**"
