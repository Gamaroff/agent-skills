top_issues:
  - id: 'CR-1'
    severity: medium
    file: 'shared/resources/develop-pipeline-step-0-resolve-and-prepare.md'
    finding: 'The §0a lookup exclusion list misses finalise''s sprint-review-summary.md (no dotted kind segment), which carries the work item''s key; github_issue 185 returns two docs (task.37), so every finalised item now HALTs as ambiguous.'
    suggested_action: 'Exclude sprint-review-summary.md by basename in §0a and in review-pr Step 2''s filter; add a keyed sprint-review-summary.md sibling to the §0a fixture.'
    suggested_owner: dev
    status: open
  - id: 'CR-2'
    severity: medium
    file: 'skills/review-pr/SKILL.md'
    finding: 'Rung 4''s Bitbucket key search calls bb_pr_search, defined only in rung 3''s fenced block; each block is its own shell, so the call is command-not-found, prints nothing, and reads as zero candidates.'
    suggested_action: 'Define bb_pr_search in every block that calls it (or one block holding all its callers), and make a missing function or curl failure halt rather than yield empty output.'
    suggested_owner: dev
    status: open
  - id: 'CR-3'
    severity: medium
    file: 'skills/review-pr/SKILL.md'
    finding: 'The Step 0b host-check block reads KIND, TARGET_HOST, TARGET_REPO, JIRA_KEY, REMOTE_URL and TRACKER without binding any of them; run as its own shell, KIND is empty, no arm matches, and every host check passes silently. The test joins both blocks and injects REMOTE_URL/TRACKER, so it cannot see this.'
    suggested_action: 'Merge parse and host check into one block that binds REMOTE_URL itself; guard required reads with ${NAME:?}; test the block as delivered.'
    suggested_owner: dev
    status: open
  - id: 'QA-1'
    severity: medium
    file: 'skills/review-pr/scripts/parse-target.sh'
    finding: 'A target containing a newline forges extra key=value lines: $''RAPP-1\nkind=pr'' prints kind=jira then kind=pr, and Step 0b''s last-wins read binds KIND=pr (reproduced under bash and zsh, hand probe).'
    suggested_action: 'Refuse a target containing a control character (newline, CR, tab) with a named reason; add parser cases.'
    suggested_owner: dev
    status: open
  - id: 'CR-8'
    severity: low
    file: 'skills/review-pr/scripts/parse-target.sh'
    finding: 'seg_after takes the first /pull/ or /issues/ segment, so an owner or repo named issues or pull (https://github.com/org/issues/issues/5) is refused, and repo_before would report the wrong owner/repo.'
    suggested_action: 'Parse github.com paths positionally as /owner/repo/(pull|issues)/N, or take the marker''s last occurrence.'
    suggested_owner: dev
    status: open

