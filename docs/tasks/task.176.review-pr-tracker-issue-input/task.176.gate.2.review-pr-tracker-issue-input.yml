top_issues:
  - id: 'CR2-1'
    severity: high
    file: 'skills/review-pr/scripts/parse-target.sh'
    finding: 'The bitbucket.org arm calls emit_pr_from_path, which never emits repo=: https://bitbucket.org/other/repo/pull-requests/12 gives kind=pr pr=12 host=bitbucket.org. Step 0b''s owner/repo check never runs on Bitbucket, so a PR URL for another repo reviews this repo''s #12 — contrary to the CHANGELOG and the SKILL.md host-check table.'
    suggested_action: 'Read bitbucket.org web (/WS/REPO/pull-requests/N) and API (/2.0/repositories/WS/REPO/pullrequests/N) paths by position and emit repo=WS/REPO; add a halting test.'
    suggested_owner: dev
    status: open
  - id: 'CR2-2'
    severity: medium
    file: 'skills/review-pr/SKILL.md'
    finding: 'The SSH-alias / self-hosted arm of the Step 0b host check compares only the host and skips the owner/repo check, although repo_of reads git@github-work:o/r.git correctly; github.com/other/repo/pull/12 against an alias remote only warns and then reviews o/r#12.'
    suggested_action: 'In the *) arm still HALT when TARGET_REPO is set and differs from repo_of(REMOTE_URL); keep warn-only for the host comparison.'
    suggested_owner: dev
    status: open
  - id: 'CR2-3'
    severity: medium
    file: 'skills/review-pr/SKILL.md'
    finding: 'The rungs 3–4 block claims to re-bind KIND, JIRA_KEY, ISSUE_NUM and DOC_FILE but guards only KIND; an unbound DOC_FILE reads as "no document" and silently skips rung 3, and an unbound JIRA_KEY searches " in:title,body" and lists unrelated PRs.'
    suggested_action: 'Guard JIRA_KEY when KIND=jira and ISSUE_NUM when KIND=github-issue with :?; require DOC_FILE to be explicitly bound (empty means no document) with ${DOC_FILE?}.'
    suggested_owner: dev
    status: open
  - id: 'CR2-7'
    severity: low
    file: 'skills/review-pr/SKILL.md'
    finding: 'The Jira host warning reads a bare $JIRA_URL that resolve-platform.sh never binds (it reads .env only to set TRACKER), so in an .env-only setup the check is silently dead.'
    suggested_action: 'Bind JIRA_URL in the block from the environment or .env, or say the host was not checked when it is unset.'
    suggested_owner: dev
    status: open

