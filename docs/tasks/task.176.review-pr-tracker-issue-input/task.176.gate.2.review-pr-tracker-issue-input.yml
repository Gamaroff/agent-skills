status_reason: 'Cycle 1 closed all ten gate-1 findings, but the cycle-2 refute pass found that Bitbucket PR URLs never carry repo=, so the owner/repo HALT the docs claim for bitbucket.org never fires (HIGH), plus two medium clashes between cycle-1 fixes.'
