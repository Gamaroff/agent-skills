    finding: 'JIRA_URL_SEEN''s .env sed accepts only a bare JIRA_URL= line (first wins); the resolver also accepts an export prefix, strips CR and takes the last line, so an export-form .env warns "JIRA_URL is not set" and a CRLF .env warns "differs" on a matching host.'
    suggested_action: 'Parse .env with the resolver''s rules: optional export prefix, strip CR and one quote pair, trim, last assignment wins.'
    suggested_owner: dev
    status: open

