top_issues:
  - id: CR-1
    severity: medium
    file: 'shared/resources/qa-results.js'
    finding: 'A folded carried block (CR-4 fold) only survives one write: on the next write the first block stops at a #### heading or bold label inside the fold, deleting the folded links (e.g. #### Bug Reports then ### Bug Reports (2) / #### Open / - [c](c.md): write 2 drops c.md).'
    suggested_action: 'Emit the fold so it reads back inside the first block (demote/fence sub-headings and labels below the stop level, or re-emit each block whole); add a three-write test with mixed-level and bold-first blocks asserting every link survives.'
    suggested_owner: dev
    status: open
  - id: CR-2
    severity: medium
    file: 'shared/resources/qa-results.js'
    finding: 'A bold-label **Deferred Work** / **Bug Reports** block ends at the next standalone bold label, so a list grouped under sub-labels (**From cycle 2:** ...) is cut to the bare label and its items deleted on replace.'
    suggested_action: 'End a bold-label block only at a heading, a QA field line, or a QA-template label; add a regression test for a sub-labelled bold-label list.'
    suggested_owner: dev
    status: open
  - id: CR-3
    severity: medium
    file: 'shared/resources/qa-results.js'
    finding: 'With logAbove the table cut is removed, but the replacing dated-row guard uses isEntryRow (ISO dates only); non-ISO rows of a Date-headed table below the section (| 2026-01-02T10:00Z |, | 03/01/2026 |) are deleted on relocate, where origin/develop kept them.'
    suggested_action: 'Under underLog also refuse on any data row of a Date-headed table in the span (isUnparsedRow or any non-separator, non-header row).'
    suggested_owner: dev
    status: open
  - id: CR-4
    severity: medium
    file: 'shared/resources/qa-results.js'
    finding: 'trimSeparator tests RE_BREAK on lines[k - 1] with its trailing CR, so in a CRLF document a --- break plus lead-in comment before the change-log block is not peeled and both are deleted on replace; the LF document keeps them. O12 only checks for bare LFs.'
    suggested_action: 'Strip CR before every per-line regex in trimSeparator; extend O12 to assert CRLF output equals the LF output converted to CRLF.'
    suggested_owner: dev
    status: open
  - id: CR-5
    severity: medium
    file: 'tests/qa-results-corpus.test.js'
    finding: 'The write survey measures what was lost outside the section with findQaResults spans, the engine under test, so a span that wrongly grows hides its own deletions; comments, --- separators and carried-block lines are never counted.'
    suggested_action: 'Measure deletions independently of the engine, e.g. diff the multiset of lines outside the probe render and old QA field lines, including comments and carried-block bullets/links.'
    suggested_owner: dev
    status: open

