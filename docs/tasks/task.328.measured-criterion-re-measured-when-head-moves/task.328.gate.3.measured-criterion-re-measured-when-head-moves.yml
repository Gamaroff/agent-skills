    severity: medium
    file: 'skills/qa-task/SKILL.md'
    finding: 'Line 1102: "A figure the rule does not accept leaves the criterion **unverified** with re-measure". Step 3 (finalise-dod-ac-prompt.md, measured criterion) uses "re-measure" only for a figure on the wrong head or missing its load. A figure that misses the bound is FAIL, and one cited only in the implementation report fails with its own note. The same text is in skills/qa-story/SKILL.md. Checked against the source.'
    suggested_action: 'Defer the outcome to Step 3 too. Keep "re-measure" only for the head-or-M check this paragraph runs, and add a parity calibration for the overbroad wording.'
    suggested_owner: dev
    status: open
  - id: 'T328-CR3-2'
    severity: medium
    file: 'skills/qa-task/SKILL.md'
    finding: 'Line 50: record_criteria sends every `measured: true` entry to the measured-figure rule. `measured` is a regex hit for any numeric bound, and Step 3 classifies a bound a per-PR test can hold as a behaviour criterion; the preflight test pins "A heading longer than 80 characters is refused." as measured: true. Raised as advisory in cycle 2 and again in cycle 3; now promoted.'
    suggested_action: 'Say measured: true marks a candidate, and only a criterion Step 3 classifies as measured takes the measured-figure rule. Say the same in the field comment in finalise-record-preflight.js.'
    suggested_owner: dev
    status: open
  - id: 'T328-CR3-3'
    severity: low
    file: 'shared/resources/finalise-record-preflight.js'
    finding: 'Line 62: "no lower than 80%", "higher than 200 ms" and "bigger than 5 MB" read NUMERIC_BOUND false (reproduced by QA).'
    suggested_action: 'Add lower, higher and bigger to the comparative list, with a test for each.'
    suggested_owner: dev
    status: open
  - id: 'T328-CR3-4'
    severity: low
    file: 'evals/shared/tests/qa-measured-figure-parity.test.mjs'
    finding: 'Line 61: the paraphrase guard matches one exact string, so Step 3''s own sentence ("taken on the PR''s head commit, or on an earlier commit M") would pass.'
    suggested_action: 'Broaden the guard and calibrate it with Step 3''s verbatim sentence.'
    suggested_owner: dev
    status: open

