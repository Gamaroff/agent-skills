top_issues:
  - id: 'T328-QA-1'
    severity: medium
    file: 'docs/tasks/task.328.measured-criterion-re-measured-when-head-moves/task.328.measured-criterion-re-measured-when-head-moves.md'
    finding: 'Criterion 5 is back at its reviewed wording ("with five examples by path"), and it is unmet. The corpus has exactly one newly listed criterion: 375 before, 376 after, task 320 #10. The bound cannot be met by any fix, because the five examples do not exist.'
    suggested_action: 'Owner decision: approve a rewording (e.g. "every newly listed example by path, up to five") with `approved by <name>`, or accept the criterion as failed. The loop must not rewrite it.'
    suggested_owner: po
    status: open
  - id: 'T328-CR2-2'
    severity: medium
    file: 'shared/resources/finalise-record-preflight.js'
    finding: 'Line 58: the comparative branch needs a digit right after "than". "The suite is greater than or equal to 5 tests." returns NUMERIC_BOUND false and is not listed, although "greater" is one of the seven comparatives this task covers. The same miss affects "less than or equal to". Reproduced by QA (`NUMERIC_BOUND.test` → false); develop also gives false, so the class is unfinished in-scope work, not pre-existing. Synonyms the reviewer named outside the task list (bigger, higher, lower, up to) are a follow-up.'
    suggested_action: 'Allow an optional "or equal to" between "than" and the number in both the comparative and the less/more-than branches, and add a test for each with a negative control.'
    suggested_owner: dev
    status: open
  - id: 'T328-CR2-3'
    severity: medium
    file: 'skills/qa-task/SKILL.md'
    finding: 'Line 1098: the paragraph says it grades "as finalise-dod-ac-prompt.md Step 3 grades a measured figure: taken on the head commit, or on an earlier commit M ... tree-equivalent". Step 3 (finalise-dod-ac-prompt.md, measured criterion) scopes the head-or-M rule to a wall-clock bound and also requires the recorded load (`uptime`). The paraphrase applies the M rule to every measured figure and drops the load condition, so the cite-not-restate rule is broken in the direction it exists to prevent. The same text sits in skills/qa-story/SKILL.md.'
    suggested_action: 'Cite Step 3 for the whole grading rule, and keep only the delta command as the how. Do not restate which figures it covers or what it requires. Keep the parity test discriminator and add an assertion against the paraphrase.'
    suggested_owner: dev
    status: open
  - id: 'T328-CR2-4'
    severity: low
    file: 'shared/resources/finalise-record-preflight.js'
    finding: 'Line 58: "The new engine is faster than 319 was." now reads NUMERIC_BOUND true and classify gives measured: true. Develop reads false, so this is introduced by the change. An id after "than" reads as a bound.'
    suggested_action: 'Add the "faster than 319" negative control and require a unit or quantity word after the number in the comparative branch, or record why an occasional advisory false positive is acceptable.'
    suggested_owner: dev
    status: open

