coverage_gap:
  statement: >-
    T106-003's fix is proved by reproduction, NOT by a committed regression test. No harness in
    this repo executes finalise's shell blocks — Step 4b refuses them as mutating, and `node`
    and `awk` invocations are fail-closed in the snippet engine's allow-list. So this defect
    class can recur without any suite going red. Stated rather than implied: the proof is real
    but it is not durable, and the next person to edit that block has no guard.
  severity: medium
  owner: "shared/resources/qa-execute-snippets.mjs"

