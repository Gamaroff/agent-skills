top_issues:
  - id: "T106-003"
    severity: high
    file: "skills/finalise/SKILL.md"
    finding: >-
      The GAP_REPORT_BODY extraction added in cycle 2 —
      awk '/^## Definition of Done - Gaps Identified/{f=1} f' — has no stop condition, so it
      captures from the Gaps heading to end-of-file. Change Log, Progress Tracking, References
      and Notes are dragged into the posted comment, and their checkboxes are counted as gaps.
      Measured on a two-gap fixture: GAP_COUNT=5, four unrelated sections included.
    suggested_action: >-
      Bound the match to the section: set the flag after the heading and clear it at the next
      `## ` heading.
    suggested_owner: dev
    status: closed
    fixed_date: "2026-09-10"

