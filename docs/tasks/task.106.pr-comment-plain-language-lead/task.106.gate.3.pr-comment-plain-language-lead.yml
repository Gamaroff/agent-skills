process_note: >-
  Three defects, all of the same shape: the operation that fails by DOING NOTHING or doing
  something plausible-but-wrong, with no error either way. T106-001 expanded to empty;
  T106-002 skipped 4 of 11 sites while its floor passed; T106-003 over-captured and miscounted.
  The last was introduced BY the fix for the first — a fix is new code, and the least reviewed
  code in the change. This is why cycle 2 is a refute pass in this repo's qa-task doctrine, and
  why the Step 5c lens was told to hunt the defect class rather than review the diff.

