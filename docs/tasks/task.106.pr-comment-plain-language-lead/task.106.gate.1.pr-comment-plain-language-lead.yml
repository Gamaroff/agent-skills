schema: 1
task: "task.106.pr-comment-plain-language-lead"
task_title: "Pull-request summary comments open with a plain-language lead"
gate: CONCERNS
status_reason: >-
  SUPERSEDED VERDICT — this gate was first written PASS while the Step 3b diff code review
  was still running, and is corrected here. That review returned two confirmed defects: an
  unbound-variable pair at finalise site 6 that would post an empty gap body, and a capture
  bug making the new Guard C skip 4 of the 11 sites it was written to protect. Both were
  reproduced independently before being accepted. Fixed under this cycle; see gate 2.
reviewer: "QA Engineer"
updated: "2026-09-10T16:20:00Z"

top_issues:
  - id: "T106-001"
    severity: high
    file: "skills/finalise/SKILL.md"
    finding: >-
      Site 6 (Definition of Done - Gaps Identified) interpolates ${GAP_COUNT} and
      $GAP_REPORT_BODY, neither of which is bound anywhere in the file. Step 4 writes the
      gap report into the document body and leaves nothing in a variable. Both expand to
      empty, so the comment posts as a heading, a lead and a bare horizontal rule with no
      gaps beneath it — the reviewer reads "gaps identified" and is shown nothing. The
      numeric slot is dropped silently by design, so nothing errors and nothing warns.
    suggested_action: >-
      Bind both before use, following the derive-then-comment pattern every sibling site in
      this diff already uses (FIX_CYCLE in qa-fix, GATE_DECISION in qa-story/qa-task).
    suggested_owner: dev
    status: closed
    fixed_date: "2026-09-10"
  - id: "T106-002"
    severity: medium
    file: "shared/resources/tests/comment-slot-coverage.test.mjs"
    finding: >-
      The stage capture /--stage\s+([^\s\\]+)/ absorbs shell punctuation, so the
      single-line call shape $(node … --stage done) captured "done)". That is not a
      catalogue key, so both Guard C content assertions hit their hasOwnProperty guard and
      skipped the site. Four of the eleven pull-request sites were found but never checked;
      the non-vacuity floor passed regardless, because it counts sites found. A guard added
      to prevent vacuous coverage was itself vacuous for over a third of its targets.
    suggested_action: >-
      Tighten the capture to [A-Za-z0-9_-]+ and add an assertion that every collected stage
      resolves to a real catalogue key, so a skip cannot be silent.
    suggested_owner: dev
    status: closed
    fixed_date: "2026-09-10"

