  performance:
    status: PASS
    notes: >-
      No new network calls. Every lead travels in the body of a call that was already
      being made; the CLI is one local node invocation per comment. Confirmed against
      the criterion in section 9.
  reliability:
    status: PASS
    notes: >-
      All 11 call sites guard the CLI with `|| exit 1`, verified by reassembling each
      continued shell command rather than by grepping adjacent lines. The engine fails
      loudly (exit 2) on an unknown stage rather than emitting an empty lead, which
      would post a comment opening with a bare horizontal rule. Rollback plan carries
      all four subsections with a forward-fix path.
  maintainability:
    status: PASS
    notes: >-
      Three test suites extended (52 + 53 + 10). The catalogue/namespace invariants are
      held by four assertions rather than by prose. stakeholder-summary.js purity contract
      intact — the only `process.exit` match in the file is the contract sentence itself.

code_review:
  step_4b:
    status: advisory
    finding: >-
      The snippet engine fails closed on `node` as an unrecognised command, so every block
      containing a stakeholder-summary-cli.js call is refused as `mutating`. Checked against
      origin/develop in a detached worktree: runnable=0 on every file at the base too, so
      this is pre-existing and not a regression. Consistent with the existing
      tracker-comment.js invocations, which are refused identically.
    severity: low

