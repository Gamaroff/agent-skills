    notes: "Unchanged from cycle 1 and re-verified on the current tree: no interpreter on SAFE_COMMANDS; out-of-root entry rejected before import (re-proved with the top-level-sentinel fixture); inputs never reach a shell; unverifiable exits 1; declined distinct from executed-zero; timeout from spawnBudget. The cycle-1 fixes strengthened this axis rather than weakening it — an escape now forces a non-zero exit even on `engages`, closing a route by which a contained-but-escaping probe could report success."
