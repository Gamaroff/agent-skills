schema: 1
task: "task.80.security-probe-engine"
task_title: "Make a security probe runnable without widening the snippet allow-list"
gate: CONCERNS
status_reason: "All four gate-1 findings verified fixed and mutation-proved. The cycle-2 refute pass found two new MEDIUM issues, both latent and both aimed at the declared consumer: the timeout fix closed the CLI path but left the runProbeSpec API path open, and the new relative import into tests/ will crash npm run bundle the moment any skill references this module."
reviewer: "QA Engineer"
updated: "2026-09-07T10:05:00Z"

top_issues:
  - id: "TASK80-005"
    severity: medium
    file: "shared/resources/security-probe.mjs"
    finding: "TASK80-001 was fixed at the CLI only. `runProbeSpec({timeoutMs})` is still unvalidated, so the mechanism the finding named survives on the API path — demonstrated: `runProbeSpec({..., timeoutMs: NaN})` with a non-empty case list still throws the same uncaught `RangeError [ERR_OUT_OF_RANGE]`, and `timeoutMs: 0` still reaches spawnSync as 'no timeout'. This is the path that matters most: `task.81` is the declared consumer and will call the function, not the CLI."
    suggested_action: "Move the validation from `main()` into `runProbeSpec` — apply `readInt(timeoutMs, 1)` where `perCaseTimeout` is resolved (:294) and fall back to the budget when it does not parse, or throw a typed error. Keep the CLI's `return 2` on top for the argument-shaped report. Validating at the boundary the caller actually crosses is what makes the fix general rather than flag-specific."
    suggested_owner: dev
    status: open
  - id: "TASK80-006"
    severity: medium
    file: "shared/resources/security-probe.mjs"
    finding: "`import { spawnBudget, neverRan, readInt } from \"./tests/spawn-budget.mjs\"` (:46) is a production module importing from a `tests/` directory, and it breaks bundling. `bundle_skill.py`'s `JS_ESM_SIBLING_RE` captures the nested path `tests/spawn-budget.mjs` as a transitive dep, then writes it to `refs_dir / name` — i.e. `references/tests/spawn-budget.mjs` — while only `references/` is ever created. Reproduced deterministically: the write raises FileNotFoundError. It does not fire today only because no skill references this module yet; `task.81` is exactly the change that will trigger it."
    suggested_action: "Preferred: stop importing from `tests/` — move `spawnBudget`/`neverRan`/`readInt` (or just the budget resolution this module needs) into a non-test shared module, so a production file does not depend on a test helper. Alternative, and worth doing regardless because it fixes the class: `dst.parent.mkdir(parents=True, exist_ok=True)` before the write in `bundle_skill.py`. Note the second is outside task.80's scope, so if only one is taken here it should be the first."
    suggested_owner: dev
    status: open

