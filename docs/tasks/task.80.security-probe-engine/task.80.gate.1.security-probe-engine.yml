nfr_validation:
  security:
    status: PASS
    notes: "All seven §9 safety criteria independently verified, not taken on trust. (1) No interpreter on SAFE_COMMANDS — confirmed against 15 names; `eval`/`exec` appear in COMMAND_RUNNERS, which makes the classifier recurse into an argument and is stricter, not laxer. (2) Out-of-root entry rejected before import — proved with a fixture whose module top level writes a sentinel file: the file was never created. (3) Inputs never reach a shell — a case whose input is a shell-injection string produced a clean rejection and no artifact. (4) unverifiable exits 1, confirmed on two distinct unverifiable paths. (5) declined is populated and executed stays 0 on all four decline paths. (6) Timeout from spawnBudget('PROBE'), no literal; the concurrency guard's hardcoded-timeout scan is green — but see TASK80-001 for the operator-supplied path. (7) Extraction behaviour-preserving: 105 tests green including the bug.3 replay."
  performance:
    status: PASS
    notes: "One child process per case is the design and is what makes a hang attributable to one case. Measured ~35-90ms per case; the full 12-case url-authority corpus runs in ~1.0s. The probe suite adds 4.5s to a 2564-test run. No regression in the snippet path."
  reliability:
    status: CONCERNS
    notes: "Verdict logic is sound and all four branches are mutation-proved. Reliability is downgraded on the periphery: an unvalidated --timeout crashes the process (TASK80-001) and an inconsistent result shape will throw in the declared consumer (TASK80-002). Both are outside the verdict computation, which is why this is CONCERNS rather than FAIL. Rollback plan is specific, time-bounded and names its verification commands."
  maintainability:
    status: PASS
    notes: "probe-boundary-rule.md (208 lines) states the trust-class argument, the verdict derivation from `direction`, the honest v1 limits, and the SAFE_COMMANDS refusal with its reason. Both non-obvious verdict branches are documented where a maintainer will look. Prettier clean. The one accuracy defect is TASK80-004, a comment claiming broader coverage than delivered."

