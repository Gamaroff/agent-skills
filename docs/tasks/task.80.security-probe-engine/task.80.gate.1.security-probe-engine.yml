schema: 1
task: "task.80.security-probe-engine"
task_title: "Make a security probe runnable without widening the snippet allow-list"
gate: CONCERNS
status_reason: "All seven §9 safety criteria hold under independent probing and the Phase 1 extraction is genuinely behaviour-preserving. Four MEDIUM code-review findings, all in the new engine's periphery rather than its verdict logic: an unvalidated --timeout that crashes or silently disables containment, an inconsistent result shape, a sandbox escape invisible in default CLI output, and a parity-test comment claiming broader coverage than the block delivers."
reviewer: "QA Engineer"
updated: "2026-09-07T09:20:00Z"

top_issues:
  - id: "TASK80-001"
    severity: medium
    file: "shared/resources/security-probe.mjs"
    finding: "`--timeout` is unvalidated (:460 `Number(argv[++i])`). A non-numeric value, or the flag given last with no value, yields NaN, which reaches spawnSync and throws an uncaught RangeError [ERR_OUT_OF_RANGE] — a stack trace instead of the file's own documented exit 2 for a bad argument. Separately `--timeout 0` passes the `??` guard at :294 and silently disables the per-case timeout entirely, removing the containment §9 criterion 6 requires."
    suggested_action: "Validate in main(): reject a non-integer or <1 value with a message and `return 2`, matching every other bad-argument path in the same function. `spawn-budget.mjs` already ships `readInt`-style parsing with a `min` floor — reuse that rule rather than restating it."
    suggested_owner: dev
    status: open
  - id: "TASK80-002"
    severity: medium
    file: "shared/resources/security-probe.mjs"
    finding: "The result shape is inconsistent: `escapes` is present only on the success path. The `base` object (:296) omits it, so all four early returns — out-of-root decline, unknown-sink decline, zero-cases, entry-not-probeable — return an object with `escapes: undefined`. A consumer reading `result.escapes.length` throws a TypeError on exactly the paths a probe most often takes. task.81 is the declared consumer."
    suggested_action: "Add `escapes: []` to the `base` object so every return path carries the full shape. Add a test asserting the key set is identical across all five result paths."
    suggested_owner: dev
    status: open
  - id: "TASK80-003"
    severity: medium
    file: "shared/resources/security-probe.mjs"
    finding: "A sandbox escape is invisible in default CLI output. The human-readable line (:496) reports verdict, executed, passed, reproduced and declined — but never `escapes`. Running the escaping-probe fixture through the CLI prints a clean-looking line while the sentinel has fired. The escape sentinel is the last line of containment; a caller must pass --json to learn it triggered."
    suggested_action: "Append `escaped N` to the summary line whenever `result.escapes.length > 0`, and consider making an escape affect the exit code — a probe that wrote outside its sandbox is not a clean run whatever its verdict."
    suggested_owner: dev
    status: open
  - id: "TASK80-004"
    severity: medium
    file: "shared/resources/tests/qa-execute-snippets.test.mjs"
    finding: "The parity block's comment (:1793) claims 'if the extraction perturbed classification, this reds with the case id that moved', but none of the 17 enumerated cases exercises SAFE_COMMANDS membership for a destructive command. Demonstrated: adding only `rm` to SAFE_COMMANDS makes `rm README.md` classify `runnable` — a genuine fail-open — and all 105 tests across the snippet suite and the bug.3 replay eval stay green. `chmod`/`dd` are caught, but by a PRE-EXISTING test, not by anything task.80 added."
    suggested_action: "Add a case asserting a destructive command absent from SAFE_COMMANDS classifies `mutating` via the allow-list rather than only via DENY_PATTERNS (`rm README.md` has no deny pattern and is the demonstrated hole), or narrow the comment to what the block actually pins. The interpreter assertion — the task's real §9 criterion 1 — is sound and mutation-proved; only the broader claim overreaches."
    suggested_owner: dev
    status: open

