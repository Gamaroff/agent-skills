    notes: 'The deliverable IS a security boundary and it does not hold. Thirteen verified fail-open inputs; containment to the temp working copy disproven with a canary written outside it. Snippets also inherit the full parent environment including tracker credentials.'
  performance:
    status: PASS
    notes: 'Per-block timeout works; a 30s sleep is cut off. zshAvailable() spawns a subprocess per call (LOW, memoisable). No measurable impact on suite runtime.'
  reliability:
    status: CONCERNS
    notes: 'Temp directory leaks on a bad --copy. An attributed fence desynchronises extraction so the gate silently covers nothing. Unvalidated --timeout can disable hang protection.'
  maintainability:
    status: PASS
    notes: 'Clear structure, exported pure functions, comments explain why rather than what. Documentation is genuinely good — the rule doc states its reasoning and records the measurements behind it.'

