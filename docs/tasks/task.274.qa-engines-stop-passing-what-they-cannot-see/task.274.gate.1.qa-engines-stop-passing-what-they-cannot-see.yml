    finding: 'The new bash -n / zsh -n check reports a high execution-failure for the documented template block at shared/resources/probe-boundary-rule.md:748 (env -i ... <command> <candidate>): a placeholder is read as a syntax error. origin: QA execution of Step 4b.'
    suggested_action: 'Skip the syntax check for a block with an unfilled template slot; count remaining false positives over the tracked docs; add a control.'
    suggested_owner: dev
    status: open

