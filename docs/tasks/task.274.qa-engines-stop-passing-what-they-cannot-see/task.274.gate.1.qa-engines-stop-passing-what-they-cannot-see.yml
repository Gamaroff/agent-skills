    status: open
  - id: 'T274-QA-2'
    severity: high
    file: 'shared/resources/qa-execute-snippets.mjs'
    finding: 'variableArgumentToDenyListed refuses only an argument that begins with an expansion; "find docs -$A", "find docs \"-${A}\"" and "find docs -$(echo delete)" still classify runnable (controls behave; same output on base, but the task names this shape as in scope, so it is unfinished). origin: code-review CR-2, reproduced by QA.'
    suggested_action: 'Refuse any argument to these commands containing an expansion unless its first literal character is known not to be a dash; fix the false doc comment; add the three hostile blocks and two controls.'
    suggested_owner: dev
    status: open
  - id: 'T274-QA-3'
    severity: medium
