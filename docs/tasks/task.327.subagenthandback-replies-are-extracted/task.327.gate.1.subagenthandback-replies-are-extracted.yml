top_issues:
  - id: 'T327-QA-1'
    severity: medium
    file: 'shared/resources/agent-reply-block.js'
    finding: 'The --out = --transcript guard (extractUsageError and the copy in extract) compares path.resolve strings only. Reproduced by QA: extract --transcript link.jsonl --out t.jsonl, where link.jsonl is a symlink to t.jsonl, removed t.jsonl and answered transcript-not-found, exit 0. Control: the same literal path is refused with exit 2 and the file survives. Not on base (base never removed --out). Criterion 7 says the transcript is left unchanged. origin: code-review CR-1 (medium/high), reproduced by QA.'
    suggested_action: 'Compare file identity (fs.realpathSync, or stat dev+ino when both exist) in both guards, and in extract remove --out only after the transcript path is resolved (agent-id discovery included), never when it is that file. Add a symlink test.'
    suggested_owner: dev
    status: open
  - id: 'T327-QA-2'
    severity: medium
    file: 'docs/tasks/task.327.subagenthandback-replies-are-extracted/task.327.subagenthandback-replies-are-extracted.md'
    finding: 'criteria-drift.js reports criterion 7 (the --out = --transcript refusal) as added without an approver. Cause: review 1 added it as an Important fix, but its reviewed_blob was never written to the object database, so the engine fell back to the review commit, which carries only the review report and predates the fix.'
    suggested_action: 'Record the approval on criterion 7 (approved by review-task, review 1 Important fix), without changing its wording, so finalise does not fail it as an unapproved edit.'
    suggested_owner: dev
    status: open
  - id: 'T327-CI-1'
    severity: medium
    file: 'docs/tasks/task.327.subagenthandback-replies-are-extracted/task.327.implementation.1.subagenthandback-replies-are-extracted-initial-run.md'
    finding: 'CI check link-check failed on c1976c87392a (https://github.com/Gamaroff/agent-skills/actions/runs/45891985827/job/140156623122); green on develop (run 45888757219). The implementation report names the LAN test host as user@address, which the checker reads as a mailto link and gets 400.'
    suggested_action: 'Name the host without the user@address form (it is a machine-private address and belongs out of the committed report anyway), and commit the report change with the fix so the lane re-runs.'
    suggested_owner: dev
    status: open
  - id: 'T327-QA-3'
    severity: low
    file: 'shared/resources/agent-reply-block.js'
    finding: 'fs.rmSync(opts.out, { force: true }) runs unwrapped before any named answer, so a directory --out (reproduced) or an EACCES/EPERM path crashes extract with an uncaught error instead of a named reason. origin: code-review CR-2 (low/high).'
    suggested_action: 'Wrap the removal and return a named reason, or refuse a directory --out as a usage error; add a test.'
    suggested_owner: dev
    status: open

