top_issues:
  - id: CR-1
    severity: high
    file: 'shared/resources/migrate-doc-numbering.mjs'
    finding: 'revertHint restores the whole PRD root (and every touched outside file), while verify() refuses only dirty fileMap sources, so running the hint erases uncommitted edits to unmoved tracked files under the root (prd-registry.md, an already-numbered PRD) and to dirty outside files the literal pass rewrote; the nothing-to-move branch offers the same whole-root restore.'
    suggested_action: 'Refuse (dirty-path) when any path the run will edit, write or move is dirty, and limit the hint to the exact paths the run moved, edited and wrote; drop the whole-root restore from the nothing-to-move branch.'
    suggested_owner: dev
    bug_ref: 'task.203.bug.2.revert-hint-does-not-revert.md'
    status: open
  - id: CR-2
    severity: medium
    file: 'shared/resources/migrate-doc-numbering.mjs'
    finding: 'Stories keep their number under the new parent with no collision check, so a legacy story and an already-numbered one that map to one story.P.E.S pass the dry run and fail post-check with duplicate-id after the moves (reproduced in memory).'
    suggested_action: 'Collect new story ids per target epic, existing ones included, in plan/verify and raise a blocker on any collision.'
    suggested_owner: dev
    bug_ref: 'task.203.bug.5.story-number-collision-unblocked.md'
    status: open
  - id: CR-3
    severity: medium
    file: 'shared/resources/migrate-doc-numbering.mjs'
    finding: 'apply() is not wrapped: a git mv or write failure part-way throws out of run() with no payload and no revert hint, leaving a document directory split (reproduced: a move() that throws on its third call).'
    suggested_action: 'Catch errors around apply() and return post-check-failed with a revert hint built from the moves and writes already made.'
    suggested_owner: dev
    bug_ref: 'task.203.bug.6.apply-failure-strands-tree.md'
    status: open

