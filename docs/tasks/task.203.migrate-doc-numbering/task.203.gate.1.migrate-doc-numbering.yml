    finding: 'discover() adds an L3 monolith to prds but not to disc.files, so plan() builds no fileMap entry and run() answers already (reproduced in memory with --name docs/prd.md=mono).'
    suggested_action: 'Build fileMap from disc.files plus every explicit-map key (or add the monolith to disc.files), and add a test that a named monolith actually moves.'
