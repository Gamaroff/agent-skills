  - id: CR-2
    severity: medium
    file: 'shared/resources/migrate-doc-numbering.mjs'
    finding: 'The post-check-failed revert hint (git checkout -- . && git clean -fd <root>) leaves the staged git mv renames in place, discards unrelated edits, and deletes untracked files the run moved.'
    suggested_action: 'Recommend a revert from HEAD scoped to the paths the run touched, say untracked moved files must be moved back by hand, and correct the task Rollback Plan text the same way.'
    suggested_owner: dev
    bug_ref: 'task.203.bug.2.revert-hint-does-not-revert.md'
    status: open
  - id: CR-3
    severity: medium
    file: 'shared/resources/migrate-doc-numbering.mjs'
    finding: 'appendPrdRow is called only on --apply, outside any try, so no-table / bad-row / duplicate-row crash after a clean dry run, with the tree half-written (reproduced: alias header | # | Name |).'
    suggested_action: 'Build the registry text during plan/verify and turn any thrown reason into a blocker so dry-run and --check report it before the first write.'
    suggested_owner: dev
    bug_ref: 'task.203.bug.3.registry-write-throws-only-on-apply.md'
    status: open
  - id: QA-1
    severity: medium
    file: 'shared/resources/migrate-doc-numbering.mjs'
    finding: 'The engine is a refusing boundary (its header says it stops rather than guessing, and --root refuses a root outside the repository), but the decision sits inside run() behind git rev-parse, so no probe form reaches it (probes_executed 0); a hand probe shows --root "" silently taking the configured default.'
    suggested_action: 'Extract the --root resolution into an exported predicate, probe it with security-probe.mjs --sink path, and refuse an empty --root as usage.'
    suggested_owner: dev
    bug_ref: 'task.203.bug.4.boundary-not-probed.md'
    status: open

