    file: 'shared/resources/tests/zsh-flag-expansion-guard.test.mjs'
    finding: 'population() drops every path containing /references/ as a bundle copy. 81 tracked skills/*/references/*.md files carry no AUTO-GENERATED header, so they are canonical sources the guard never reads. Reproduced: a `${PIN_BRANCH:+--doc-branch "$PIN_BRANCH"}` line put in a bash fence of skills/develop-bug/references/develop-bug-step-5-6-verify-loop.md left the guard green (5/5). Control: the same line in a SKILL.md fence turns test A red (M1). The guard header and traps.md say it covers canonical sources. Origin: code-review CR-1 (medium/medium), reproduced by QA.'
    suggested_action: 'Select the population by content, not path: include a references/*.md file unless it carries the bundle AUTO-GENERATED header. Add a test that a hand-authored references file is in the population and a generated copy is not.'
    suggested_owner: dev
    status: open
  - id: 'T333-QA-2'
    severity: low
    file: 'shared/resources/tests/zsh-flag-expansion-guard.test.mjs'
    finding: 'FLAG_KEY misses whitespace after `:+`. Reproduced: `set -- ${X:+ --flag "$X"}` gives 1 argument under zsh and 2 under bash, the same defect as the caught form. The NOT CAUGHT list does not name this shape. Origin: code-review CR-3 (cleanup, low/medium), reproduced by QA.'
    suggested_action: 'Allow optional whitespace in the key (`:\+\s*["'']?-`), add the spaced shape to test D''s caught list, and keep `"${X:+ (eq ${X})}"` legal.'
    suggested_owner: dev
    status: open

