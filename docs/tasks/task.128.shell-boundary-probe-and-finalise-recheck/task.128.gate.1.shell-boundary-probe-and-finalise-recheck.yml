  - id: 'TASK-128-BUG-2'
    severity: high
    file: 'shared/resources/security-probe.mjs'
    finding: 'runShellCase never checks that entryPath exists or that bash opened it, so a missing shell: script mismatches every case (exit 127) and is scored absent with executed = cases × shells instead of the entry-not-probeable / executed 0 the JS form returns — could-not-look and control-absent resolve to one gating output (diff review CR-1, reproduced).'
