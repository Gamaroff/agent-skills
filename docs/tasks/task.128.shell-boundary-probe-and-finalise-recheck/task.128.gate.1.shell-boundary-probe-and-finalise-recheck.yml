    status: open
    bug_ref: 'task.128.bug.2.shell-entry-missing-script-scored-absent-not-declined.md'
  - id: 'TASK-128-BUG-3'
    severity: medium
    file: 'shared/resources/security-probe.mjs'
    finding: 'A NUL byte in a shell: entry passes resolveEntry and reaches spawnSync as argv, which throws ERR_INVALID_ARG_VALUE out of runProbeSpec — the JS form declines the same input; the contract says the function returns a verdict and never throws for a bad argument (security probe, path corpus null-byte case).'
    suggested_action: 'Reject a NUL in resolveEntry as bad-entry for both forms and add the null-byte shape to the shell-entry tests.'
    suggested_owner: dev
    status: open
    bug_ref: 'task.128.bug.3.nul-in-shell-entry-throws-from-runprobespec.md'
  - id: 'TASK-128-BUG-4'
    severity: medium
    file: 'shared/resources/finalise-fix-and-recheck.mjs'
    finding: 'The mutation-proved check reads mutationProof.redOnRevert === true, a boolean Step 8a instructs the agent to flip by hand, while the precondition statement requires the run that showed it to be recorded — the one evidentiary precondition is a self-report (diff review CR-3, verified).'
    suggested_action: 'Require a mutationProof.run path in the finding record; the check verifies the file exists, is non-empty and names the test failing; update the Step 8a template and the fixture GOOD finding.'
    suggested_owner: dev
    status: open
    bug_ref: 'task.128.bug.4.mutation-proved-precondition-is-a-self-reported-boolean.md'

