task_title: 'qa-next: uat-status.mjs owns the run state file, so its contract is held by tests instead of prose'
gate: CONCERNS
status_reason: 'Implementation, tests and docs match the plan (4/4 phases, 55/55 suite, 3980/3980 ci:fast, 18+3 mutants covered), but two verified MEDIUM defects: --state-init prints two indistinguishable shapes on exit 0 (fresh vs resume), and the legacy priorRuns derivation counts the run own file when runFile is null.'
reviewer: 'QA Engineer'
updated: '2026-09-24T04:56:56Z'

top_issues:
  - id: 'TASK-143-BUG-1'
    severity: medium
    file: 'skills/qa-next/scripts/uat-status.mjs'
    finding: '--state-init exits 0 both for a fresh selection (prints the --next/--item payload) and for a resume (prints the state view, which lacks id/what/items/checklists); --next never exits 5, so the race SKILL.md Step 1 names yields the wrong shape instead of HALT run-in-progress (code review CR-1, bug + high confidence).'
    suggested_action: 'Give the resume branch its own exit code or refuse --state-init when a state file exists, and document the response in SKILL.md Step 1.'
    suggested_owner: dev
    bug_ref: 'task.143.bug.1.state-init-resume-output-indistinguishable.md'
  - id: 'TASK-143-BUG-2'
    severity: medium
    file: 'skills/qa-next/scripts/uat-status.mjs'
    finding: 'stateView derives legacy priorRuns as the row priorRuns minus state.runFile, but v0.51.0 never wrote runFile, so a real v0.51.0 file at recorded/committed counts the run own file and reports/commits the run as a re-run (code review CR-2, verified against v0.51.0 SKILL.md).'
    suggested_action: 'When runFile is null and phase is recorded or later, also exclude the row Last run target; add a test with runFile null.'
    suggested_owner: dev
    bug_ref: 'task.143.bug.2.legacy-priorruns-counts-own-run-file.md'

