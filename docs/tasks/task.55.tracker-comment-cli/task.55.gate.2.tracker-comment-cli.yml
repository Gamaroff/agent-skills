cycle_1_resolution:
  - id: QA-1
    finding: 'Marker prefix collision silently suppressed whole comments'
    status: closed
    fixed_date: '2026-08-19'
    verification: 'Full self-terminating marker on GitHub; exact text-node equality on Jira. Mutation red on both sides — the Jira half needed a test through the real search path, because a helper-only assertion kept passing while the live search regressed.'
  - id: QA-2
    finding: 'A multi-word fence info string swallowed the rest of a document'
    status: closed
    fixed_date: '2026-08-19'
    verification: 'Closed twice. The first fix over-corrected and reintroduced the same class (see NEW-1); now a CommonMark predicate, regression-tested against the real 31KB document that broke.'
  - id: QA-3
    finding: 'A 4-backtick fence was closed by a 3-backtick line'
    status: closed
    fixed_date: '2026-08-19'
    verification: 'Same char, run length >= opening, no info string. Mutation red.'
  - id: QA-4
    finding: '--stage failed open on a missing value'
    status: closed
    fixed_date: '2026-08-19'
    verification: 'Every value-taking flag rejects a missing or flag-shaped value. Six argv shapes exit 2; no shipped call site is affected.'
  - id: QA-5
    finding: 'COMMENT_STAGES never consulted at runtime'
    status: closed
    fixed_date: '2026-08-19'
    verification: 'Enforced in run(). All 60 shipped --stage literals pass; none would exit 2.'
  - id: QA-6
    finding: 'The Jira branch and the post-failure path had zero tests'
    status: closed
    fixed_date: '2026-08-19'
    verification: 'getAuth accepts an injected source, which is what made the branch reachable at all. 13 Jira tests + the previously-dead postFails path.'
  - id: QA-7
    finding: 'Unpaginated marker search posted duplicates'
    status: closed
    fixed_date: '2026-08-19'
    verification: 'Jira fails closed on absent/short total; GitHub reads via gh api --paginate with a fallback that reports unverifiable rather than a zero it cannot stand behind. Both mutation red.'

cycle_2_resolution:
  - id: NEW-1
    severity: high
    finding: 'The cycle-1 fence fix let backticks into a backtick info string, so a prose line opening with an inline code span became a fence — 31,235 characters of a live task document collapsed into one code block'
    status: closed
    verification: 'RE_CODE_FENCE replaced by matchCodeFence(); the regression test renders the actual offending file, because the shape only occurs in prose nobody thought to write down. The renderer-vs-extractor parity assertion was also inverted to renderer ⊆ extractor — requiring equivalence is what pushed the renderer to over-match.'
  - id: NEW-2
    severity: medium
    finding: 'Truncation guard failed open on an absent or null total'
    status: closed
  - id: NEW-3
    severity: medium
    finding: 'Truncation detection was Jira-only; GitHub had none'
    status: closed
  - id: NEW-5
    severity: low
    finding: 'The parity allowlist exempted files by basename, so any skill could mint an exemption by filename alone (19 files were exempt on that basis)'
    status: closed
    verification: 'Exemption is now by content equality against the shared source. Exploit test: a planted file in an unrelated skill is caught.'
  - id: NEW-6
    severity: low
    finding: 'The numeric suffix was accepted on any stage while the error message promised cycle-scoped only'
    status: closed

