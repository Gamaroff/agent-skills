nfr_validation:
  security:
    status: PASS
    notes: 'No shell string carries body content — every subprocess is execFileSync with an argv array and no shell:true; the body reaches gh via stdin and Jira via JSON.stringify. Redaction confirmed to run before hashing, covering command.stdin and manual.fields. One unvalidated interpolation: a Jira issue key goes into the REST path unencoded (LOW — the key comes from local frontmatter, so self-harm rather than escalation).'
  performance:
    status: PASS
    notes: 'Additive cost is +18 GitHub / +9 Jira API calls on a 2-cycle run (3 round-trips per marked site vs 1 before). Bounded and trivial against a pipeline that already makes dozens.'
  reliability:
    status: CONCERNS
    notes: 'Every anticipated failure path returns a reason and nothing throws uncaught. But --stage fails open (QA-4), the marker search is unpaginated (QA-7), and the whole Jira branch is untested (QA-6).'
  maintainability:
    status: CONCERNS
    notes: 'The duplicated marker PREFIX is genuinely guarded by a parity assertion, but the three duplicated helper FUNCTIONS (firstLineOf, markerHtml/commentMarkerHtml, markerText/commentMarkerText) are not, so they can drift and silently stop matching. COMMENT_STAGES is documentation, not a runtime constraint (QA-5).'

