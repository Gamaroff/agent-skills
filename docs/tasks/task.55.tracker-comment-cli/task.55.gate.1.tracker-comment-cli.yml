schema: 1
task: 'task.55.tracker-comment-cli'
task_title: '[Task 55] Build the Jira comment endpoint that does not exist, and stop routing ~20 comments through prose'
gate: FAIL
status_reason: 'Two verified HIGH correctness bugs cause silent content loss: a marker prefix collision suppresses whole comments, and a multi-word code-fence info string swallows the rest of a rendered document. Both are invisible to the 1483 passing tests.'
reviewer: 'QA Engineer'
updated: '2026-08-19T14:05:00Z'

top_issues:
  - id: QA-1
    severity: high
    finding: 'Marker search matches the bare prefix as a substring, so --stage review prefix-matches an existing review-story / review-task / review-bug marker (and qa-cycle matches qa-cycle-2). Step 2 posts --stage review on the same issue review-story already marked, so the CLI reports `already` and the review comment is silently never posted.'
    suggested_action: 'Search the full delimited marker: markerHtml(stage) on GitHub (its trailing " -->" makes it unambiguous), and an exact text-node match on the Jira side rather than a substring.'
    suggested_owner: dev
    refs: ['shared/resources/tracker-comment.js:518', 'shared/resources/jira-sync.js:4728']
  - id: QA-2
    severity: high
    finding: 'RE_CODE_FENCE requires a single-token info string, so ```js title="x" is not recognised as a fence. The opening line renders as prose and the CLOSING fence is then treated as an opening one, swallowing every subsequent block into a code block. Verified: "intro / fence / code / fence / tail prose" renders as [paragraph, paragraph, codeBlock("\ntail prose")] — the tail is lost. Also puts RE_CODE_FENCE in direct disagreement with the extractor RE_FENCE, which does match that line.'
    suggested_action: 'Capture only the first token as the language and tolerate the rest of the info string; add an assertion that any line matching RE_FENCE also matches RE_CODE_FENCE.'
    suggested_owner: dev
    refs: ['shared/resources/jira-sync.js:697']
  - id: QA-3
    severity: medium
    finding: 'A 4-backtick fence is closed by a 3-backtick line — only the delimiter character is compared, never the run length. This repo uses 4-backtick fences in at least three shipped documents.'
    suggested_action: 'Require fm[1].length >= fenceDelim.length and an empty info string on the closing line.'
    suggested_owner: dev
    refs: ['shared/resources/jira-sync.js:817']
  - id: QA-4
    severity: medium
    finding: '--stage with a missing or flag-shaped value fails OPEN: opts.stage becomes undefined, the marker is dropped, and the comment posts unmarked on every resume. --issue and --body-file fail closed in the same situation.'
    suggested_action: 'Reject a missing value or one starting with "-" for every value-taking flag, as exit 2.'
    suggested_owner: dev
    refs: ['shared/resources/tracker-comment.js:252-255']
  - id: QA-5
    severity: medium
    finding: 'COMMENT_STAGES is never consulted at runtime — markerText("totally-made-up") is accepted silently. It is enforced only by a prose-scanning guard that cannot see placeholders, shell variables, or downstream consumers.'
    suggested_action: 'Validate the stage in run(), allowing the documented numeric-suffix form (qa-cycle-2), and exit 2 otherwise.'
    suggested_owner: dev
    refs: ['shared/resources/tracker-comment.js:94-106']
  - id: QA-6
    severity: medium
    finding: 'The Jira branch of the CLI (runJira, ~110 lines) and the gh post-failure path have zero tests. The stub even defines a postFails knob no test passes, so runGithub catch is dead code as far as CI is concerned. findCommentsByMarker and addComment have no test referencing them.'
    suggested_action: 'Add a fetchImpl-driven Jira test covering 0/1/2 marker matches, unreadable GET, addComment throw, and the deferred re-report; pass postFails:true in one GitHub test.'
    suggested_owner: dev
    refs: ['shared/resources/tests/tracker-comment.test.mjs']
  - id: QA-7
    severity: medium
    finding: 'Marker search is unpaginated at 100 comments on both trackers, and truncation is not detected — a marker beyond the window reads as count 0 and the CLI posts a duplicate, the exact outcome the cardinality rule exists to prevent.'
    suggested_action: 'Paginate, or treat total > maxResults as unreadable so it degrades to unverifiable rather than to a blind post.'
    suggested_owner: dev
    refs: ['shared/resources/jira-sync.js:4730', 'shared/resources/tracker-comment.js:307']

waiver:
  active: false

