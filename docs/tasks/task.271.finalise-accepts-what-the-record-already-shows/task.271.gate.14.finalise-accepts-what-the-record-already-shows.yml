task_title: 'finalise accepts what the record already shows'
gate: FAIL
status_reason: 'Cycle 13 fixed the repeated plain key, and no committed gate is wrongly refused (987 checked). The same class remains one level down: the subset parser silently drops rows it cannot read (a complex key, a row at an odd indent) and builds mappings on the prototype, so a repeated or shadowing key in those spellings is never seen. The fix is one rule: in strict mode, fail closed on any row the parser does not consume. The fourteen-gate budget is spent.'
reviewer: 'QA Engineer'
head: '91e83b8a9d7d0cc4adee0b7d4f23247a11356a40'
updated: '2026-11-08T16:45:00Z'

top_issues:
  - id: 'T271-QA-30'
    severity: medium
    file: 'shared/resources/yaml-subset.js'
    finding: 'The duplicate-key check only sees keys the parser reads. A row the parser does not consume is dropped silently, so an override in that spelling is never checked. Reproduced by hand: an approving entry followed by "? approved_by" and ": Mallory" returns matched (Pat Owner); an approving entry followed by "approved_by: Mallory" indented one space off its map returns matched. A real YAML reader sees a second approved_by overriding the approval.'
    suggested_action: 'In strict mode, throw on any row the parser skips (a row KEY_RE rejects, a row at a different indent than its mapping, a tab indent) and on a quoted key containing a backslash, so the gate is unverifiable.'
    suggested_owner: dev
    status: open
  - id: 'T271-QA-31'
    severity: low
    file: 'shared/resources/yaml-subset.js'
    finding: 'A "__proto__" key is assigned on the object, not stored as a key. Reproduced by hand: an entry with "case: c1" and its task, approver and date supplied only under "__proto__:" returns matched, because the facts are read through the prototype.'
    suggested_action: 'Reject "__proto__" (and "constructor"/"prototype") keys in strict mode, or build mappings with Object.create(null).'
    suggested_owner: dev
    status: open

