top_issues:
  - id: 'T271-QA-10'
    severity: high
    file: 'shared/resources/finalise-deferral-match.js'
    finding: 'The lead allow-list takes any text inside its bold slot, so free prose still qualifies the approval. Reproduced by the probe engine (case.bold-condition and case.bold-draft, outcome accepted): "- **only if Sam agrees**, `oc1`: deferred to task.5, approved by Sam on 2026-01-01." and "- **deferral is a draft**, ..." both return matched. Third consecutive gate with a HIGH on this file (QA-5/6, QA-9, QA-10): each cycle patched one phrasing of a text matcher over prose a pipeline writes.'
    suggested_action: 'Replace the mechanism, not the pattern: the bullet is one exact line with no optional prose slot (`<case-id>`: deferred to task.N, approved by NAME on DATE.), and NAME is compared to the configured owner list exactly, so no free text remains in the grammar.'
    suggested_owner: dev
    status: open
  - id: 'T271-QA-11'
    severity: high
    file: 'shared/resources/finalise-delta.js'
    finding: 'The blob check accepts a symlink to a file, because a mode-120000 entry is also a blob. Reproduced by the probe engine (ff.symlink-to-changed, outcome accepted) and by hand: link.test.js pointing at tests/real.test.js, which the PR changed, returns eligible. The PR-owned red reads as lying outside the diff.'
    suggested_action: 'Require the failed file to be a regular file at the head commit (git ls-tree mode 100644 or 100755), not a blob of any mode.'
    suggested_owner: dev
    status: open
  - id: 'T271-QA-12'
    severity: medium
    file: 'shared/resources/finalise-deferral-match.js'
    finding: 'The first record that matches wins and later records are ignored, so a later bullet that withdraws the deferral cannot change the answer. Reproduced by the probe engine (case.later-revocation, outcome accepted): a valid bullet followed by "- `rev-1`: deferral revoked by Pat Owner on 2026-02-01." still returns matched. A gate entry is also matched on any mention of the case id in its action text, with no negation or single-case check, so the two sources apply different strictness.'
    suggested_action: 'Answer matched only when every record that names the case, in both sources, is a valid approval by the owner; a record that names the case in any other form blocks. Give a gate entry an explicit case field and match it by equality instead of by a mention in free text.'
    suggested_owner: dev
    status: open

