top_issues:
  - id: 'T271-QA-13'
    severity: high
    file: 'shared/resources/finalise-deferral-match.js'
    finding: 'The subset YAML parser stops a map at the first more-indented row, so a block or folded scalar (action: >- or |) truncates the gate entry. Reproduced by hand: a gate entry "action: >-" whose text says the oc1 deferral was withdrawn is not a candidate, and with a valid Deferred Work bullet the CLI returns matched (exit 0). A withdrawal written in ordinary YAML is silently ignored.'
    suggested_action: 'Fail closed on the gate: scan the raw gate text for the case id and treat any future[] entry that mentions it but did not parse as a record as blocking, or return unverifiable when an entry holds a block scalar.'
    suggested_owner: dev
    status: open
  - id: 'T271-QA-14'
    severity: medium
    file: 'shared/resources/finalise-deferral-match.js'
    finding: 'cleanName strips leading and trailing underscore and asterisk characters from both the approver and the owner list. Reproduced by hand: "approved by sam_" with --approver sam returns matched, so a different identity equals the owner; the header comment claims an exact compare.'
    suggested_action: 'Strip only a matching wrapper pair of backticks or quotes, or compare the trimmed strings.'
    suggested_owner: dev
    status: open

