    status: open
  - id: 'T271-QA-25'
    severity: medium
    file: 'shared/resources/finalise-deferral-match.js'
    finding: 'Only recommendations.future[] entries are candidates. A mention of the id in recommendations.immediate[] or in a top-level key is counted as parsed, so it offsets the raw count and never blocks. Reproduced by hand: an approving future entry plus "immediate: [{action: c1 revoked}]" returns matched (exit 0), and so does a top-level "top: c1 revoked".'
    suggested_action: 'Block when a parsed mention of the id sits anywhere in the gate outside the approving future[] entry that carries it, or at least treat immediate[] entries as non-approving candidates.'
    suggested_owner: dev
    status: open

