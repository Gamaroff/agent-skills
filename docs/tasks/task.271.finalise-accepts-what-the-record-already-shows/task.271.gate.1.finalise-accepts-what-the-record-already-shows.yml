updated: '2026-11-07T19:53:56Z'

top_issues:
  - id: 'T271-QA-1'
    severity: high
    file: 'shared/resources/finalise-delta.js'
    finding: 'rerun-eligible compares raw --failed-file strings with repo-root-relative git names after stripping only a leading ./, so an absolute path (the form CI logs print), ../p/src/a.js and src/./a.js do not match a file the PR changed and the engine returns eligible (exit 0). Reproduced: with src/a.js changed by the PR, src/a.js and ./src/a.js give in-diff, while the absolute path, ../ spelling and src/./a.js give eligible.'
    suggested_action: 'Canonicalise each failed file against the workspace root (path.resolve then path.relative), refuse a path that escapes the root, and add absolute, ../ and a/./b spellings of an in-diff file as refused controls.'
    suggested_owner: dev
    status: open
  - id: 'T271-QA-2'
    severity: high
    file: 'shared/resources/finalise-delta.js'
    finding: 'A --failed-file that is still an unsubstituted {placeholder} is the single literal word, never in the PR diff, so with a docs-only delta rerun-eligible returns eligible. Reproduced with --failed-file "{failed-files}". The SKILL.md block also expands {failed-files} unquoted, so a path with spaces splits and a glob expands.'
    suggested_action: 'Make the engine refuse any --failed-file containing an unsubstituted {...} placeholder (usage error, exit 2), require the file to exist in the head tree, and change the SKILL.md block to read newline-delimited paths with while IFS= read -r.'
    suggested_owner: dev
    status: open
  - id: 'T271-QA-3'
    severity: medium
    file: 'shared/resources/finalise-deferral-match.js'
    finding: 'The approval date is checked by shape only (/^\d{4}-\d{2}-\d{2}$/), so 2026-13-45 or 0000-00-00 matches and the bogus date is rendered into the DoD line.'
    suggested_action: 'Parse with Date.UTC, require month and day to round-trip, and add an impossible-date refused control.'
    suggested_owner: dev
    status: open
  - id: 'T271-QA-4'
    severity: medium
    file: 'skills/finalise/SKILL.md'
    finding: 'The Step 3b.1 item 5a block reads the owner list with IFS=, read -r -a, which zsh rejects (bad option: -a; zsh uses -A). Run under zsh the block prints "bad option: -a", passes no --approver, and every deferral reports no-approver-configured. Reproduced under bash (matched) and zsh (no-approver-configured) from the same block.'
    suggested_action: 'Replace the array read with a portable loop over the comma-split list that works in bash and zsh, and add a test that runs the block under both shells.'
    suggested_owner: dev
    status: open

