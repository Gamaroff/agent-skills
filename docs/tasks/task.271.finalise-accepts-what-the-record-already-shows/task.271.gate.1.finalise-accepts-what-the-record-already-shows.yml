status_reason: 'Two high-confidence fail-open defects in rerun-eligible (failed-file path spellings and an unsubstituted placeholder both return eligible), plus an impossible approval date accepted by the deferral matcher and a zsh-incompatible read -a in the new Step 3b.1 5a block.'
