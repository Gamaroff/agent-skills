task_title: 'finalise accepts what the record already shows'
gate: FAIL
status_reason: 'Cycle 1 fixes verified (all four closed, mutation-proved). The refute pass and the probe engine found three new defects: the Arm 3 work-item matcher accepts a negated bullet, a bullet inside an HTML comment, and one approval for several case ids (reproduced by the probe engine, 3 of 7 cases), and rerun-eligible follows a symlinked failing test file to its target name, so a symlink the PR changed reads as outside the diff.'
reviewer: 'QA Engineer'
head: 'aec627b3526572a45d17cbc8c66824337de6d331'
updated: '2026-11-07T20:34:00Z'

top_issues:
  - id: 'T271-QA-5'
    severity: high
    file: 'shared/resources/finalise-deferral-match.js'
    finding: 'The Deferred Work bullet matcher reads the first "deferred to task.N" and the first "approved by NAME on DATE" anywhere in the bullet, with no negation or structure check. Reproduced: "NOT deferred to task.5; was not approved by Pat Owner on 2026-01-02" returns matched, task.5, Pat Owner (probe case.negated, outcome accepted). Arm 3 can accept a denial as the owner approval.'
    suggested_action: 'Match one anchored form, the whole bullet being "<case-id>[:,] deferred to task.N, approved by NAME on DATE.", and treat any other wording (a negation word, a second deferred-to or approved-by clause) as no candidate.'
    suggested_owner: dev
    status: open
  - id: 'T271-QA-6'
    severity: high
    file: 'shared/resources/finalise-deferral-match.js'
    finding: 'deferredWorkItems tracks code fences but not HTML comments, so a bullet inside a comment under ## Deferred Work is read as a live deferral (probe case.commented-out, outcome accepted); and a bullet naming several case ids gives every one of them the one approval (probe case.second-id, outcome accepted).'
    suggested_action: 'Strip HTML comments before scanning, and make the case id the bullet leading token so a bullet that names two cases yields a candidate for the first only.'
    suggested_owner: dev
    status: open
  - id: 'T271-QA-7'
    severity: medium
    file: 'shared/resources/finalise-delta.js'
    finding: 'canonicalFile resolves the final path component with realpathSync, so a failing test file that is a symlink the PR changed reduces to its target name, which is not in the PR diff, and the arm answers eligible. Reproduced: src/link.test.js (symlink, changed by the PR) pointing at an existing src/other.js returns eligible; a dangling link returns in-diff only because realpath throws.'
    suggested_action: 'Resolve symlinks in the parent directory only and keep the final component lexical, then compare to the diff names.'
    suggested_owner: dev
    status: open

