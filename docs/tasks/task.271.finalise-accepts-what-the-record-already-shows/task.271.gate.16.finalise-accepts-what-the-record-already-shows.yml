task_title: 'finalise accepts what the record already shows'
gate: FAIL
status_reason: 'Cycle 15 fixes verified. A thorough review (about 75 probes, each compared with a real YAML reader) found that the gap between the hand-rolled subset parser and real YAML is wide, not narrow: line breaks other than LF, escapes in double-quoted values, inline-value spellings of a second recommendations key, a multi-document stream, and non-YAML whitespace before a comment all let a gate match that a real YAML reader reads differently. Five of the shapes were reproduced by hand. The sixteen-gate budget is spent, and each cycle since gate 11 has closed a spelling and found another.'
reviewer: 'QA Engineer'
head: 'b749f3a97b07738d82425c232e946f49803a4f94'
updated: '2026-11-08T17:18:00Z'

top_issues:
  - id: 'T271-QA-34'
    severity: high
    file: 'shared/resources/yaml-subset.js'
    finding: 'Escapes in double-quoted values are never decoded, so a competing record written as "oc\x2d1" is invisible to the mention count and to the raw-text reconciliation. Reproduced by hand: an approving entry for oc1 plus a second entry with case "oc\x2d1", deferred_to task.9 and approved_by Mallory returns matched. The same hides a blocker in an immediate entry, a root key or a note.'
    suggested_action: 'In strict mode throw on any double-quoted value containing a backslash, as is already done for quoted keys.'
    suggested_owner: dev
    status: open
  - id: 'T271-QA-35'
    severity: high
    file: 'shared/resources/yaml-subset.js'
    finding: 'A root-level row the parser cannot read is dropped silently when it has no deeper child rows, so the duplicate-key and leftover-row checks never see it. Reproduced by hand: after an approved block, "? recommendations" with ": {future: []}", and "!!str recommendations: {future: []}", each return matched, while a real YAML reader reads future: [] (the duplicate key wins).'
    suggested_action: 'In strict mode throw on any root-mapping row that fails the key pattern once a strictUnder key is present.'
    suggested_owner: dev
    status: open
  - id: 'T271-QA-36'
    severity: high
    file: 'shared/resources/yaml-subset.js'
    finding: 'A lone CR, and NEL/LS/PS for YAML 1.1 readers, are line breaks to YAML but not to the parser, so a comment can hide whole rows. The reviewer reproduced a hidden second approved_by and a hidden second deferred_to this way; my own attempt with one lone-CR shape returned unverifiable (not reproduced by hand).'
    suggested_action: 'In strict mode refuse any text containing a lone CR, U+0085, U+2028 or U+2029.'
    suggested_owner: dev
    status: open
  - id: 'T271-QA-37'
    severity: medium
    file: 'shared/resources/yaml-subset.js'
    finding: 'The strict comment rule matches any whitespace, including NBSP and U+3000, which YAML does not treat as separating a comment. Reproduced by hand: "approved_on: 2026-01-01" followed by a non-breaking space and "# 2099-01-01" returns matched; YAML reads the whole string as the value.'
    suggested_action: 'In strict mode use space and tab only.'
    suggested_owner: dev
    status: open
  - id: 'T271-QA-38'
    severity: medium
    file: 'shared/resources/yaml-subset.js'
    finding: 'A multi-document stream is accepted: "---" rows fail the key pattern and are skipped. Reproduced by hand: an approved block followed by "---" and another mapping returns matched, where a real YAML reader refuses the stream.'
    suggested_action: 'In strict mode refuse "---" other than as the first row, "..." and "%" rows.'
    suggested_owner: dev
    status: open

