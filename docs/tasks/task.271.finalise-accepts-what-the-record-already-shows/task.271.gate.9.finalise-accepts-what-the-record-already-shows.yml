top_issues:
  - id: 'T271-QA-20'
    severity: high
    file: 'shared/resources/finalise-deferral-match.js'
    finding: 'A comment that spans lines makes the per-line section reader disagree with the item reader, which joins the lines. Reproduced by hand: an approved c1 bullet, then "x<!--", then "-->## Other", then a "+ `c1`: withdrawn, not deferred." line returns matched (exit 0). The item reader sees "x## Other", not a heading, and keeps the section open; the section reader ends the section at "## Other" and never counts the withdrawal.'
    suggested_action: 'Strip comments once, with the one rule, and find the section and count over that single visible text; count a comment that names the case as blocking separately.'
    suggested_owner: dev
    status: open
  - id: 'T271-QA-21'
    severity: high
    file: 'shared/resources/finalise-deferral-match.js'
    finding: 'taken is counted on comment-stripped item text while the raw count is taken before stripping, so a comment inside the id creates a mention that exists only after stripping and gives slack. Reproduced by hand: the bullet "- `c<!---->1`: deferred to task.5, approved by Pat Owner on 2026-01-01." followed by "+ `c1`: withdrawn, not deferred." returns matched (exit 0).'
    suggested_action: 'Count both sides over the same visible text, so an id that exists only after stripping is counted on both.'
    suggested_owner: dev
    status: open

