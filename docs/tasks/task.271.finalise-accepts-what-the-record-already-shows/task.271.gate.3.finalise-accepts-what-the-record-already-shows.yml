    file: 'shared/resources/finalise-delta.js'
    finding: 'A --failed-file that names a directory is never in the PR diff, so rerun-eligible answers eligible for it. Reproduced: with src/a.js changed by the PR, --failed-file src and --failed-file src/ both returned eligible. A second form of the same gap: with --workspace-root set to a subdirectory the name is reduced against that subdirectory while git prints toplevel-relative names, so a changed file named relative to the subdirectory reads as outside the diff.'
    suggested_action: 'Require the failed file to be a blob at the head commit (git cat-file -t head:path) and reduce names against the git toplevel; add refused controls for a directory, a missing path and a subdirectory workspace root.'
    suggested_owner: dev
    status: open
  - id: 'T271-QA-9'
    severity: high
    file: 'shared/resources/finalise-deferral-match.js'
    finding: 'The lead of a Deferred Work bullet is unconstrained prose guarded by a closed list of negation words, so any phrasing the list does not hold is accepted as the owner approval. Reproduced by the probe engine (case.conditional-lead, outcome accepted: "only if Sam agrees, deferred to task.5, approved by Pat Owner on ...") and by the reviewer ("withheld;", "If accepted, ...", "is to be deferred to ...").'
    suggested_action: 'Replace the word filter with an allow-list: the lead may be only an optional bold finding id, an optional "reproduced by", and the one backticked case id with an optional colon; any other word makes the bullet a candidate with no facts.'
    suggested_owner: dev
    status: open

