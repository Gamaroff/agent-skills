task_title: 'finalise accepts what the record already shows'
gate: FAIL
status_reason: 'Cycle 14 fixes verified (a complex key, an odd indent, a tab, an escaped key and a __proto__ key are all refused; 1088 tracked YAML files parse identically with no options). One hole remains, and it is a different class: the parser cuts a scalar at any # even when the # is glued to the text, which YAML does not treat as a comment, so a gate whose four fields all carry a glued suffix matches. The fifteen-gate budget is spent.'
reviewer: 'QA Engineer'
