top_issues:
  - id: 'T271-QA-32'
    severity: medium
    file: 'shared/resources/yaml-subset.js'
    finding: 'stripComment cuts a line at any unquoted "#", but YAML starts a comment only at a "#" preceded by whitespace. Reproduced by hand: an entry with "case: oc10#x", "deferred_to: task.5#y", "approved_by: Pat#z" and "approved_on: 2026-01-01#q", run for --case oc10 --approver Pat, returns matched. A real YAML reader sees the values oc10#x, task.5#y, Pat#z and 2026-01-01#q, so none of them approves. The raw and parsed id counts agree, so the reconciliation does not catch it.'
    suggested_action: 'In strict mode, strip a "#" only at the start of a line or after whitespace, so a glued "#" stays in the value and the facts fail their own checks.'
    suggested_owner: dev
    status: open
  - id: 'T271-QA-33'
    severity: low
    file: 'shared/resources/yaml-subset.js'
    finding: 'assertConsumed refuses only rows deeper than the block, so a row shallower than the block but still inside recommendations ends the root mapping and later rows go unread. The reviewer could not build a case where a valid record is hidden without naming the id, and the one shape I tried by hand (a bare "junk" row after the entry) returns unverifiable. Not reproduced as a wrong match.'
    suggested_action: 'In strict mode, throw when rows remain after the root mapping ends once a strictUnder key was entered.'
    suggested_owner: dev
    status: open

