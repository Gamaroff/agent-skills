top_issues:
  - id: 'CR-1'
    severity: medium
    file: 'docs/runbooks/bug-fix.md'
    finding: 'bug-fix.md:114-118 says a general bug''s registry row "mirrors every status write" and tells readers to check the row against the bug''s current status mid-run; after a reopen, /qa-fix moves the bug file Reopened -> In Progress -> Ready for QA without touching the row (develop-bug verify loop step 1 mirrors only reopened), so on cycle 2+ the row reads reopened while the file reads ready-for-qa.'
    suggested_action: 'Name the four writes develop-bug mirrors (in-progress, ready-for-qa, reopened, closed) without "every", state that qa-fix''s in-cycle writes on a reopened bug are not mirrored, and drop or qualify the mid-run check advice; record the source gap as a follow-up.'
    suggested_owner: dev
    status: open
  - id: 'CR-2'
    severity: medium
    file: 'scripts/setup-consumer.sh'
    finding: 'The diff corrected which-access.md to "approve — one batched confirmation at handover" (restricted-access.md, develop-pipeline-step-7-finalise.md), but the wizard prompt at setup-consumer.sh:360 still says approve writes are "still handed over today (ask prompt is not shipped)", configuration.md:943 says "writes still deferred today (ask prompt is task.57)", and setup-consumer.sh:2233 says /tracker-reconcile is not shipped although skills/tracker-reconcile exists.'
    suggested_action: 'Update all three to the shipped behaviour (approve: one batched confirmation at handover; /tracker-reconcile available), then grep for "not shipped", "task.57" and "still deferred" across docs/, scripts/ and shared/resources/.'
    suggested_owner: dev
    status: open
  - id: 'CR-3'
    severity: low
    file: 'scripts/setup-consumer.sh'
    finding: 'The header (cycle 1) and getting-started.md:132 say .env.example is written "always"; write_env_files returns at once when ENV_LINES is empty, which it is for GitHub+GitHub Issues (only Bitbucket and Jira add lines), so no .env.example is written there.'
    suggested_action: 'Say .env.example is written when the platform collects credentials (Bitbucket or Jira), in the header, the getting-started row 4 and the release-and-install Credentials row.'
    suggested_owner: dev
    status: open
  - id: 'QA-3'
    severity: low
    file: 'docs/runbooks/release-and-install.md'
    finding: 'The "wizard sets up" table (RUNBOOKS-22) omits the agent-links step: main() runs link_agents between write_tracker_workflow and install_hooks. Reviewer CR-5, verified by QA against main().'
    suggested_action: 'Add an "Agent links" row between tracker-workflow and Hooks, and check the table against main()''s call list.'
    suggested_owner: dev
    status: open
  - id: 'QA-4'
    severity: low
    file: 'docs/runbooks/release-and-install.md'
    finding: 'release-and-install.md:62 tells readers to skip §4 unless they passed --no-sync-develop, but release.sh (set -euo pipefail) syncs develop after pushing the tag (lines 600-604), so a merge conflict or rejected push aborts with the release out and develop unsynced. Reviewer CR-4, verified by QA against release.sh.'
    suggested_action: 'Also run §4 when --tag stopped during its "Sync develop" step.'
    suggested_owner: dev
    status: open

