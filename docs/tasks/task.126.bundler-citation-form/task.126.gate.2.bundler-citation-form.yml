top_issues:
  - id: CR-1
    severity: medium
    file: '.githooks/pre-commit'
    finding: 'Since the cycle-1 CR-3 fix, a refused commit leaves the copies its own bundle run just wrote untracked on disk. On the retry they sit in both PRE and POST, count as LEFT, and are refused, naming files the user never made. The UNSTAGED_SHARED refusal''s "stage them, then retry" now always fails its own retry. Reproduced: refused on stray.md; git add stray.md; retry refused on fresh.md, exit 1.'
    suggested_action: 'On any refusal, revert what this run changed (NEW): delete an untracked NEW copy, and restore a tracked one from the index. The retry then starts from the state the user left. Add a test that follows the printed remedy and retries.'
    suggested_owner: dev
    status: open
  - id: CR-2
    severity: medium
    file: 'skills/create-skill/scripts/bundle_skill.py'
    finding: 'expected_bytes decides "unshipped" on the reached set for prose mentions, but rewrite_md_links still uses bundled_names (needed ∪ on-disk copies). A cited document with a sibling Markdown link therefore still changes bytes when an UNREACHED copy is removed, which is the STALE-in-CI case cycle 1 claimed to close. One copy can also send the same target upstream in prose and keep it local in a link.'
    suggested_action: 'Pass the reached set to rewrite_md_links as well (the packager keeps the on-disk fallback). Extend test M with a sibling Markdown link in the cited hub.'
    suggested_owner: dev
    status: open

