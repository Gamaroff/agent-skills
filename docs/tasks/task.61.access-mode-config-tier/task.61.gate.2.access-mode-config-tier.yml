nfr_validation:
  security:
    status: PASS
    notes: >-
      Every escalation direction probed across three cycles is closed and pinned by a
      mutation-proven test. The child environment is an allowlist snapshotted at require time, so a
      repo-local `.env` can neither forge the answer nor reach the subshell as a bash startup hook —
      the freeze is what makes the widened PYTHON*/PYENV entries safe rather than a new hole. The
      fast-path over-matches the `access` word where the shell over-matches it and under-matches
      only YAML syntax, so it can no longer decide authorisation. All 7 makeHttp sites and every
      resolveAccessTracker call site are anchored to a repo root.
  performance:
    status: PASS
    notes: >-
      A repo with no `access` mention resolves in ~1 ms and spawns nothing. A repo that mentions the
      word — including in a comment — pays one ~500 ms subprocess per process, memoised. That cost
      is deliberate and documented: under-matching the word is an escalation, over-matching it is
      only slow.
  reliability:
    status: PASS
    notes: >-
      The shell seam and the JS tier now fail closed identically, and every refusal carries a
      reason — including the two paths (mktemp failure, a subshell that dies before printing) where
      the mode was refused silently. The seam is anchored against relative sourcing, CDPATH, a
      failing cd under `set -e`, and an empty BASH_SOURCE.
  maintainability:
    status: CONCERNS
    notes: >-
      One accepted residual. The "may this file declare access" question is still asked in two
      places — `mayDeclareAccess` in defer-mutation.js and `configMayRestrict` in
      jira-create-epic.js — because the latter runs on the degraded path where `defer-mutation.js`
      is unavailable by definition and so cannot import it. Both now mirror the shell's grammar
      including the explicit-key form, and the divergence is commented at both sites. Folding them
      into one export is a follow-up, not a defect.

