      declared restriction to a more permissive mode. T61-H1 is additionally arbitrary code
      execution via a .env-supplied BASH_ENV reaching a subshell the change introduced.
  performance:
    status: PASS
    notes: >-
      Measured: a repo with no access key spawns nothing (0 ms); a restricted repo pays one 527 ms
      subprocess per process, memoised thereafter. The common path is unaffected.
  reliability:
    status: CONCERNS
    notes: >-
      The shell seam fails OPEN where the JS tier fails CLOSED (T61-M1), and the two gates inside
      one jira-stage run can resolve different answers (T61-M3).
  maintainability:
    status: CONCERNS
    notes: >-
      The "does this file mention access" heuristic now exists in three places with three
      different grammars. The shell's _rp_access_may_be_declared is the reviewed one and should be
      the only one.

