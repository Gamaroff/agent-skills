top_issues:
  - id: 'TASK-92-003'
    severity: medium
    file: 'CHANGELOG.md'
    finding: >-
      The split of the 26 findings into real fixes versus annotations is wrong everywhere it is
      stated. Claimed: "11 by a real fix … and 15 by a `# shellcheck disable`". Actual, counted
      against the original 26: SC2034 15 → 3 deleted + 12 annotated; SC1007 4 → 4 annotated;
      SC2209 3 → 3 quoted; SC2211 2 → 2 fixed; SC1090 1 → annotated; SC2010 1 → fixed. That is
      **9 real fixes and 17 annotations**, and 17 is independently confirmed by counting the
      directives the branch adds. Root cause: "five string literals quoted" counted ASSIGNMENTS
      quoted (5 arms in release.sh alone, done for uniformity) rather than FINDINGS resolved (3
      SC2209). The wrong numbers appear in CHANGELOG.md:70-72, the task document's Files Summary,
      the implementation report, and the PR body.
    suggested_action: >-
      Correct to 9/17 in CHANGELOG.md, task.92.shellcheck-ci-lane.md, the implementation report and
      the PR body. Keep the distinction explicit — findings resolved, not lines edited.
    suggested_owner: dev
    status: open
  - id: 'TASK-92-004'
    severity: medium
    file: 'docs/architecture/concepts/tech-stack.md'
    finding: >-
      The § "Infrastructure and CI" paragraph was rewritten by this task specifically because it was
      stale, and the rewrite is itself inaccurate. It says "five workflows in `.github/workflows/`"
      and then names five — test, validate, shellcheck, release, docs-link-check — but there are
      **six**: `branch-policy.yml` (job `base-branch`, on `pull_request`, rejects PRs into `main`
      from a non-develop/hotfix/release head) is omitted entirely. Five was the count BEFORE this
      task added shellcheck.yml. Every other claim in the paragraph was verified correct against the
      workflow files (triggers, path-filtering, and what each runs).
    suggested_action: >-
      Say six, and name branch-policy.yml with its one-line purpose. Re-verify the count against
      `ls .github/workflows/*.yml` rather than against the pre-pass summary that predated this change.
    suggested_owner: dev
    status: open

