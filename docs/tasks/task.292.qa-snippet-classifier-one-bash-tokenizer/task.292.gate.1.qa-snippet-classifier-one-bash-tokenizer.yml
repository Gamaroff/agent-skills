    file: 'shared/resources/qa-execute-snippets.mjs'
    finding: 'The lexer reads every << in code position as a heredoc opener, so inside $[ ... ] (a left shift in bash) the lines up to a line equal to the word are hidden as heredoc body; "echo $[1<<z]", "touch /tmp/qa292-a", "z" classifies runnable and bash creates the file. Control: the $(( )) form is refused, a real heredoc stays runnable. Reviewer CR-1 (confidence high), reproduced by QA; base gives the same verdict, but the task scope says unmodelled shapes are refused. Bug report task.292.bug.1.'
    suggested_action: 'Refuse (throw) on $[ or on << inside a $[ body; add rows for $[1<<z] and $((1<<z)) with a trailing writer; add $[ and << to the differential atom sets.'
