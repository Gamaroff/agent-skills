    - action: 'T292-CR-1 (pre-existing, high/high reviewer rating): assignmentHazard only sets startupHazard, which is read only for helper-function calls, so a direct printf -v / read / test -v / [[ -v ]] / unset / [[ -eq ]] operand holding a quoted a[$(cmd)] subscript is runnable while bash runs the command (printf -v with the name text a[$(touch W)] and a value x writes). Provenance: identical verdict on develop, zero hits in the tracked corpus; command-level allow-list is task.289 scope. Needs its own task: refuse a $( or backtick inside any quoted argument of an operand-evaluating builtin.'
      refs: ['shared/resources/qa-execute-snippets.mjs']
      provenance: pre-existing
    - action: 'T292-CR-2 (pre-existing): PS4 (and PS0/PS1/PS2) are not startup-variable hazards on the direct path, and ${x@P} expands prompt escapes, so PS4 set to $(touch W) followed by set -x, or x set to $(touch W) followed by echo ${x@P}, is runnable and writes. Provenance: identical on develop, zero corpus hits (one prose mention of PS4=).'
      refs: ['shared/resources/qa-execute-snippets.mjs']
      provenance: pre-existing
    - action: 'T292-CR-3 (pre-existing): data bash later re-evaluates as arithmetic is read as inert text: x set to the quoted text a[$(touch W)], then $((x)), [[ $x -eq 1 ]], ${x:0:$x} or ${!x}, is runnable and writes. Provenance: identical on develop, zero corpus hits. Suggested direction: refuse a quoted literal holding $( or a backtick when assigned to a variable. The three findings share one cause (indirect evaluation), so one task should sweep the class.'
      refs: ['shared/resources/qa-execute-snippets.mjs']
      provenance: pre-existing
