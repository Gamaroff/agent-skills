    severity: high
    file: 'shared/resources/qa-execute-snippets.mjs'
    finding: 'commandInvocations removes arithmetic with .replace(/\$\(\([^)]*\)\)/g, " "); [^)]* stops at the first ")" so a $( ) or backtick inside $(( )) is deleted with it. "echo $((1+$(touch W)))", "x=$((1+$(touch W)))", "echo $((1+`touch W`))", the double-quoted form and the unquoted-heredoc-body form classify runnable and bash creates W. Control: "echo $((1))" runnable, "echo $((1+2)); touch W" mutating, and "echo $(( (1) + $(touch W) ))" already mutating. Same verdict on develop. Reviewer CR-1 (high), reproduced by QA. Bug report task.292.bug.2.'
    suggested_action: 'Drive arithmetic removal from the tokenizer, or refuse a $(( body holding $( or a backtick; add rows for the five shapes, a "+" atom to the arith differential set, and mutation-prove the fix.'
    suggested_owner: dev
    origin: 'code-review, reproduced by QA'
    status: open

