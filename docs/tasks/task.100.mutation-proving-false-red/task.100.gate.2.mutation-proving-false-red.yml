top_issues:
  - id: 'TASK-100-002'
    severity: medium
    file: 'shared/resources/mutation-proving.md'
    finding: "The text claims a matrix of N mutations pays N runs, so probe validation adds 2/N (40% at five, 10% at twenty). The procedure in this same document runs the suite twice per invariant — step 3 re-runs it mutated, step 5 restores and confirms green again — so an N-mutation matrix pays ~2N runs and the real overhead is ~1/N (20% at five, 5% at twenty). Every stated percentage is exactly 2x too high."
    suggested_action: "Drop the percentage arithmetic rather than re-deriving it against a denominator readers may count differently. State the count-independent form: probe validation adds two runs to a matrix that already pays about two per mutation, so it costs roughly one extra mutation's worth, at any N."
    suggested_owner: dev
    status: open
