  - id: CR6-2
    severity: low
    file: 'shared/resources/qa-read-back.js'
    finding: 'artifact() is not qa-cycle.sh''s grammar: the JS regex is unanchored (first .gate.N.) where the sed is greedy (last), and .*yml$ lacks the literal dot; task.9.gate.1.b.gate.2.yml is counted as cycle 2 by qa-cycle.sh and not found here (false "misnamed" HALT, probe case gate-twogates).'
    suggested_action: 'Anchor and make greedy with a literal extension (^.*\.gate\.([0-9]{1,9})\..*\.yml$, \.md$ for the report); add the double-segment name to the BUG-9 test loop and a test that reaches the "misnamed" branch (CR-5).'
    suggested_owner: dev
  - id: CR6-4
    severity: low
    file: 'shared/resources/qa-execute-snippets.mjs'
    finding: 'isWithin tests rel.startsWith(".."), so a child whose name begins with two dots reads as escaping: --copy-as SRC:..seed is refused (probe case copy-as.dotdot-name overblocked — a regression from cycle 5''s CR-6 switch of the DEST check onto isWithin). qa-read-back.js:213 has the same test and treats an untracked ..notes.md inside the work item as outside it.'
    suggested_action: 'rel === ".." || rel.startsWith(".." + path.sep) || path.isAbsolute(rel); have qa-read-back use the same containment test.'
    suggested_owner: dev

