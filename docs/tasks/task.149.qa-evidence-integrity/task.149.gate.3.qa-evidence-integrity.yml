    severity: low
    file: 'shared/resources/doc-links.js'
    finding: 'A final-component symlink that dangles or points outside the repository is listed by readdir, so linkState reads it untracked and the read-back stages it as resolved.'
    suggested_action: 'lstat the resolved path; for a symlink, realpath it and return outside-repo when it escapes the repository, missing when it dangles; test both.'
    suggested_owner: dev
  - id: CR3-4
    severity: low
    file: 'shared/resources/qa-execute-snippets.mjs'
    finding: 'platform-variance: tmp comes from mkdtempSync(join(tmpdir(), …)) unresolved, and os.tmpdir() returns a relative TMPDIR verbatim, so every --copy-as is refused as escaping under a relative TMPDIR.'
    suggested_action: 'Absolutise the sandbox root once (resolve(mkdtempSync(…))) and test with a relative TMPDIR.'
    suggested_owner: dev
  - id: CR3-5
    severity: low
    file: 'shared/resources/qa-execute-snippets.mjs'
    finding: 'Nothing refuses an SRC that contains the temp root under a different spelling (realpath vs tmpdir()), where cpSync could recurse into its own output (unreproduced — a reproduction would copy all of $TMPDIR).'
    suggested_action: 'realpath SRC and the temp root and refuse the pair when the temp root equals or lies beneath SRC; test with the realpath spelling of tmpdir().'
    suggested_owner: dev

