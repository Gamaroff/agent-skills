    bug_ref: 'task.149.bug.1.copy-as-symlink-escape.md'
  - id: TASK-149-BUG-2
    severity: medium
    file: 'skills/qa-task/SKILL.md'
    finding: 'Step 12b (and qa-story item 3e) assign LINKS_RC and LOG_RC and read neither; doc-links exits 1 for both untracked and missing, so the promised halt on a missing link rests on the agent reading the JSON (code review CR-1, verified).'
    suggested_action: 'Derive the decision in the block: count broken[] entries with state missing from the --json output and exit 1 on any, or when change-log --check-updated exits 1; make the population test require the halt at both sites.'
    suggested_owner: dev
    bug_ref: 'task.149.bug.2.step-12b-no-mechanical-halt.md'
  - id: CR-2
    severity: low
    file: 'shared/resources/doc-links.js'
    finding: 'state: untracked is also reported for a gitignored target that can never be committed, which the QA prose treats as not a defect while CI link-check stays red.'
    suggested_action: 'Distinguish an ignored target (git check-ignore) as its own state that the QA prose treats like missing.'
    suggested_owner: dev
  - id: CR-4
    severity: low
    file: 'skills/qa-story/SKILL.md'
    finding: 'The new 3e and Step 12b blocks read $STORY_FILE / $TASK_DIR bare; an unset input fails as a usage error from the engines rather than naming the missing binding.'
    suggested_action: 'Guard the input with ${STORY_FILE:?} / ${TASK_DIR:?} so a missing binding is named at the first line of the block.'
    suggested_owner: dev

