    file: 'shared/resources/qa-execute-snippets.mjs'
    finding: 'The --copy-as DEST check compares resolve(tmp, dest) as a string, and mkdirSync/cpSync follow a symlink --copy seeded into the working copy, so --copy-as SRC:out/sub writes outside the temp root (probe case copy-as.symlink-through accepted; also code review CR-3).'
    suggested_action: 'Check realpathSync of the deepest existing ancestor of target against realpathSync(tmp) and refuse otherwise; add a test seeding a symlink via copyFrom that asserts exit 2 and nothing written at the link target.'
