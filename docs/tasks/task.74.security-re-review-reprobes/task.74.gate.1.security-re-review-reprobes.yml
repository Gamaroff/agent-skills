task_title: 'A security re-review must re-probe, not re-read'
gate: CONCERNS
status_reason: 'All four phases complete and every success criterion met, but executing the shipped prose found one MEDIUM defect: the clause-1 trigger probe hangs when LATEST_GATE is empty, because awk with no filename falls back to reading stdin. Reproduced under both bash and zsh.'
reviewer: 'QA Engineer'
updated: '2026-09-02T09:15:00Z'

top_issues:
  - id: 'CR-1'
    severity: medium
    file: 'shared/resources/qa-re-review-scope.md'
    finding: 'The clause-1 probe hangs when $LATEST_GATE is empty — awk with no filename argument reads stdin and blocks indefinitely. LATEST_GATE is empty by construction on a first review; only the prose heading "For re-reviews" keeps the block from running then. Failure mode is an indefinite hang with no diagnostic, not an error. Reproduced under bash and zsh.'
    suggested_action: 'Guard with `[ -n "$LATEST_GATE" ] && [ -r "$LATEST_GATE" ]` and add `</dev/null` to the awk invocation so the stdin fallback can never engage. Fix in shared/resources/ and re-run `npm run bundle` — editing the bundled references/ copies alone is silently reverted. Add a regression test asserting the probe returns false rather than hanging for an empty and a nonexistent LATEST_GATE.'
    suggested_owner: dev
    status: open

