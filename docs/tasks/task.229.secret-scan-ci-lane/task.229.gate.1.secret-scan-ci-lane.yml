top_issues:
  - id: 'CR-1'
    severity: medium
    file: 'scripts/lint-secrets.sh'
    finding: 'GL_FLAGS passes --exit-code 1, and gitleaks also exits 1 on a fatal error (missing dir, bad report template: both measured rc=1). So the self-check prints "planted token caught" when the scanner crashed, and every later scan reports a crash as a found secret.'
    suggested_action: 'Use a leak exit code gitleaks never uses for errors (e.g. 99); treat only that status as a leak (or a caught plant), and report any other non-zero as a scanner error with its own message and exit 1.'
    suggested_owner: dev
    status: open
  - id: 'QA-1'
    severity: medium
    file: 'scripts/lint-secrets.sh'
    finding: 'The self-check plant is one random 24-byte base64url value, and gitleaks 8.30.1 misses 3 of 300 such values (measured via gitleaks stdin, 2026-10-22). On those runs the self-check fails and the lane goes red on a clean tree: a ~1% flake on every PR and every local npm run ci.'
    suggested_action: 'Retry the self-check with fresh plants (fail only when several independent plants are all missed), or build a plant that cannot hit the miss, and add a test case where the stub misses the first plant and catches the second.'
    suggested_owner: dev
    status: open

