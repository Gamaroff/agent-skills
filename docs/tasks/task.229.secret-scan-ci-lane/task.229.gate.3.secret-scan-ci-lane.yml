task: 'task.229.secret-scan-ci-lane'
task_title: 'Secret-scan CI lane over tracked files'
gate: CONCERNS
status_reason: 'Cycle-2 fixes hold (rules pinned, missing base fatal outside a push, shellcheck green). The unscoped safety re-probe found that a PR controls its own workflow and script, so the lane cannot be a control against a hostile author; three medium findings remain: a tracked .gitleaksignore can silence the PR-text scans, the lane and its docs do not state that limit, and the default path allowlist skips some tracked paths unannounced.'
reviewer: 'QA Engineer'
head: '98205b89abbc13db4af0bcf8ca7062f9c1623a66'
updated: '2026-10-22T19:30:30Z'

top_issues:
  - id: 'CR-1'
    severity: medium
    file: 'scripts/lint-secrets.sh'
    finding: 'GL_FLAGS does not pin --gitleaks-ignore-path, which defaults to the cwd (the repo root), so a tracked .gitleaksignore is read by every scan. Reproduced with gitleaks 8.30.1: a PR-body token fails the lane (rc 1); the same body plus a tracked .gitleaksignore holding ":generic-api-key:1" (a stdin fingerprint has no file name) prints "gitleaks: clean", rc 0. Reviewer severity high, re-rated medium by QA: 0 tracked .gitleaksignore files and 0 writers of one in scripts/, shared/resources/ or skills/*/scripts/; only a deliberate author writes a stdin fingerprint, and CR-3 shows that author controls the scanning script anyway.'
    suggested_action: 'Add --gitleaks-ignore-path pointing at an empty directory under $tmp to GL_FLAGS, as --config already is, and assert it in the pinned-rules test.'
    suggested_owner: dev
    status: open
  - id: 'CR-3'
    severity: medium
    file: '.github/workflows/secret-scan.yml'
    finding: 'On pull_request the lane runs the PR''s own workflow, package.json script and scripts/lint-secrets.sh, so the change under scan can rewrite or remove the scanner; the lane guards against accidental leaks, not a hostile PR author, and neither the script header, the workflow, CONTRIBUTING nor the CHANGELOG says so (the cycle-2 CHANGELOG line "a .gitleaks.toml committed in a PR cannot switch the scan off" overclaims).'
    suggested_action: 'State the threat model where the lane is described (script header, workflow comment, CONTRIBUTING, CHANGELOG): it catches accidental secret-shaped strings; a PR can change its own workflow and script, so it is not a control against a deliberate bypass; reword the CHANGELOG line to "by accident".'
    suggested_owner: dev
    status: open
  - id: 'CR-4'
    severity: medium
    file: 'scripts/lint-secrets.sh'
    finding: '`[extend] useDefault = true` keeps gitleaks'' global path allowlist, so a token in a tracked path it lists (node_modules/, *.svg, go.sum, package-lock.json, *.pdf and others) is never scanned, while the header and docs promise every tracked file; reported by the reviewer with gitleaks 8.30.1, and the self-check''s plant.ts cannot notice.'
    suggested_action: 'Either list the tracked paths the default allowlist skips and print them (or fail), or keep the defaults and state the skipped path classes where the lane is documented, so the contract matches what is scanned.'
    suggested_owner: dev
    status: open

