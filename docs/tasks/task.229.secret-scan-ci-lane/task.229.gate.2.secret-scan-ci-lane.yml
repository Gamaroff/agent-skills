task_title: 'Secret-scan CI lane over tracked files'
gate: FAIL
status_reason: 'Cycle-2 refute pass: a .gitleaks.toml committed in the PR silences the tree scan while the self-check (default config) still passes, so the lane can be switched off by the change it is scanning. Also a missing range base now skips the message scan on PR events, and the tracked QA probe fixture turns the shellcheck lane red.'
reviewer: 'QA Engineer'
head: '4f5477711712e788365f1d70d600ff15c51c6000'
updated: '2026-10-22T19:08:51Z'

top_issues:
  - id: 'CR-1'
    severity: high
    file: 'scripts/lint-secrets.sh'
    finding: 'GL_FLAGS carries no --config, so gitleaks loads a .gitleaks.toml from the scanned tree ($tmp/tree, i.e. any file the PR commits), while the self-check scans $tmp/selfcheck under the default rules. Reproduced with gitleaks 8.30.1: a tracked token fails the lane (rc 1); the same token plus a tracked .gitleaks.toml whose [allowlist] paths match everything prints "gitleaks: clean" and exits 0. The GITLEAKS_CONFIG env route is already caught by the self-check.'
    suggested_action: 'Pin the rules for every gitleaks call to a config the PR cannot change (write a default-extending config into $tmp and pass --config), or plant the self-check token inside the scanned tree so it runs under the same config as the real scan; add a test case where the tree carries an allow-all .gitleaks.toml.'
    suggested_owner: dev
    status: open
  - id: 'CR-2'
    severity: medium
    file: 'scripts/lint-secrets.sh'
    finding: 'The cycle-1 force-push guard (git cat-file -e on the range base) skips the commit-message scan with exit 0 whenever the base is absent, which is also the state of a shallow or mis-fetched checkout on a pull_request event; the shallow-clone error below it can no longer fire, so dropping fetch-depth: 0 would silently disable the message scan.'
    suggested_action: 'Skip only for a push-event range (pass the event in, e.g. SECRET_SCAN_EVENT) or refuse when the clone is shallow (git rev-parse --is-shallow-repository); keep a missing base on a pull_request range a hard error, with a test for each.'
    suggested_owner: dev
    status: open
  - id: 'QA2-1'
    severity: medium
    file: 'docs/tasks/task.229.secret-scan-ci-lane/task.229.qa.1.security.setup.sh'
    finding: 'The QA cycle-1 probe fixture, tracked in 4f547771, trips ShellCheck SC2034 (unused loop variable i at line 27), so the shellcheck lane is red on the PR head; npm run lint:shell reproduces it locally (rc 1). The local lint ran before the file was tracked.'
    suggested_action: 'Use `for _ in 1 2 3 4 5 6 7 8; do` in the fixture, and run npm run lint:shell after staging any new tracked shell file.'
    suggested_owner: dev
    status: open

