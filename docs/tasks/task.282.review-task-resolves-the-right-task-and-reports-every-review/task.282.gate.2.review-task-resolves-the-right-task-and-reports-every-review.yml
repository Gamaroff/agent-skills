top_issues:
  - id: 'T282-QA-4'
    severity: medium
    file: 'shared/resources/develop-pipeline-step-0-resolve-and-prepare.md'
    finding: 'The bare-number block (line 117) is introduced by this change and says to run it "from the repository root", yet invokes `bash shared/resources/resolve-bare-task.sh`, which the bundle rewrites to `bash references/resolve-bare-task.sh`. In a consumer-shaped checkout (skill copied to .agents/skills/develop-task, cwd the repository root) that prints "No such file or directory" and exits 127, so the `||` branch HALTs a plain bare number; the `.agents/skills/develop-task/references/resolve-bare-task.sh` path answers `found docs/tasks/task.5.x/task.5.x.md` for the same input. The unit test calls the script by absolute path and cannot see it. origin: code-review (CR-1, reviewer severity high, confidence high), reproduced by QA. Re-rated high to medium with a measurement: 158 other sites in canonical sources invoke a bare `references/X` and 430 use the `.agents/skills/` path, so the bare form is a repo convention that an agent resolves against the skill directory, and the failure is a HALT rather than a wrong action. Whether this block is read that way is unverified. The script header repeats the same repository-root claim.'
    suggested_action: 'Invoke the script by the `.agents/skills/{skill}/references/resolve-bare-task.sh` path the neighbouring blocks in this file use (for the skills that bundle it), keep the bundle dependency, and make a failure to run the script a distinct HALT from a resolver answer. Add a test that runs the delivered block from a consumer-shaped directory.'
    suggested_owner: dev
    status: open

