  future:
    - action: 'canonicalStage folds only `-1`, `-01` and `-001` to the bare marker. `review-task-02` and `review-task-2` give different markers (CR-3). The same holds on develop for `qa-gate-02` vs `qa-gate-2`, and the call sites reject leading zeros, so this is not new to this change. Normalise every numeric suffix in the engine.'
