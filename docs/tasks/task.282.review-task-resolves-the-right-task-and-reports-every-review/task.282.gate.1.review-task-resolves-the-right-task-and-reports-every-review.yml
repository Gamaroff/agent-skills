task_title: 'review-task resolves the right task and reports every review'
gate: CONCERNS
status_reason: 'Both behaviours work and every change has a committed test with a control that goes red when reverted. Three medium findings: resolve-bare-task.sh wraps an over-long digit string to a wrong task id (reproduced), the wall-time success criterion has no measurement, and the task document still describes the earlier marker design.'
reviewer: 'QA Engineer'
head: '92a259573bb83f889fe93027460aebabc69987cb'
updated: '2026-11-18T21:02:30Z'

top_issues:
  - id: 'T282-QA-1'
    severity: medium
    file: 'shared/resources/resolve-bare-task.sh'
    finding: 'The all-digits check does not bound the value, and `n=$((10#$n))` wraps. Reproduced: `resolve-bare-task.sh 18446744073709551617` prints `found docs/tasks/task.1.*` (exit 0), and 9223372036854775808 reads as negative and returns `none`, which sends the run down the issue-number route. Control: 5 and 0005 both resolve to task 5. Origin: code review CR-1, reproduced by QA (rule 5d); the script is new in this PR, so it is not pre-existing.'
    suggested_action: 'Strip leading zeros with string operations (keeping 0 when nothing is left) and refuse more than 9 digits with exit 2, instead of arithmetic. Add a test with both over-long inputs and the 5 / 0005 control.'
    suggested_owner: dev
    status: open
  - id: 'T282-QA-2'
    severity: medium
    file: 'docs/tasks/task.282.review-task-resolves-the-right-task-and-reports-every-review/task.282.qa.2.review-task-resolves-the-right-task-and-reports-every-review.md'
    finding: 'The success criterion "CI=true npm test wall time is within 10% of develop, median of five alternating runs with uptime beside each" has no measurement. Nothing in the evidence so far compares the branch with develop.'
    suggested_action: 'Run five alternating develop/branch runs of `CI=true npm run test:remote -- --run test` on the LAN server, record both medians and the uptime beside each in the next QA report, or have the owner amend the criterion.'
    suggested_owner: dev
    status: open
  - id: 'T282-QA-3'
    severity: medium
    file: 'docs/tasks/task.282.review-task-resolves-the-right-task-and-reports-every-review/task.282.review-task-resolves-the-right-task-and-reports-every-review.md'
    finding: 'The Target Architecture "Marker" bullet, the Phase 1 checkbox and the Breaking Changes line still say review 1 passes the bare key and only N>=2 passes `review-task-N`. The shipped design always passes `review-<kind>-N` and the engine maps `-1` to the bare marker (canonicalStage). A reader of the document gets the wrong call-site contract.'
    suggested_action: 'Reconcile those three places to the shipped design. Leave every Success Criteria line as it is: none of them depends on the old wording.'
    suggested_owner: dev
    status: open

