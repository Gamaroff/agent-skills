    - action: 'develop-bug, develop-story, review-story and review-pr carry the step-0 document, and with it the bare-number block, but not resolve-bare-task.sh. The document scopes the block to task pipelines and /review-task, and no other skill runs it, so nothing is wrong today; but no check enforces that every skill carrying the block ships the script or stays out of scope (CR-1, low severity, low confidence; anchor off by one, so unverified). Add a population check over skills/*/references, or move the block into the two skills that ship the script.'
      refs: ['shared/resources/develop-pipeline-step-0-resolve-and-prepare.md']
      remedy: unverified
    - action: 'Review-<kind> comments with no numbered report (an action-plan-only review in review-task and review-bug, a validate run in review-story) pass the next unused N, which nothing consumes, so a second such review of the same item computes the same N and its comment reads `already` (carried from cycle 2, CR-2). Key report-less reviews to a number that advances, or skip the comment when no report exists.'
      refs: ['skills/review-task/SKILL.md', 'skills/review-story/SKILL.md', 'skills/review-bug/SKILL.md']
      remedy: unverified
    - action: 'The `--json` output of tracker-comment.js reports the canonical stage, so a call with `review-task-1` reports `review-task` (carried from cycle 2, CR-3). Say so beside the `already` rule, or emit the stage as passed.'
      refs: ['shared/resources/tracker-comment.js', 'shared/resources/develop-pipeline-step-2-review.md']
      remedy: unverified
    - action: 'canonicalStage folds only `-1`, `-01` and `-001` to the bare marker; `review-task-02` and `review-task-2` give different markers. The same holds on develop for `qa-gate-02` vs `qa-gate-2`, and the call sites reject leading zeros. Normalise every numeric suffix in the engine.'
      refs: ['shared/resources/tracker-comment.js']
      provenance: pre-existing
      remedy: unverified
    - action: 'resolve-bare-task.sh step 3 uses `git log --all`, which also sees tags and stashes, then `git branch --contains`, which lists branches only: a task reachable only from a tag reads `none`; the newest commit touching the path may be a deletion. Neither was reproduced. Check the exit status of `git branch --contains` and add `--diff-filter=AM`.'
      refs: ['shared/resources/resolve-bare-task.sh']
      remedy: unverified

