  future:
    - action: >-
        Note in the scanner comment that the alias rule (`\*[A-Za-z0-9_]`) does not match an alias
        whose name starts with a non-alphanumeric (e.g. `*.d`). Not exploitable — a legal alias
        requires an anchor earlier in the file and `&[^[:space:]]` catches it first — but the
        narrowness is deliberate and should say so.
      refs: ['shared/resources/read-config.sh']
    - action: 'Re-indent the else-branch of the hoisted refusal to match its nesting'
      refs: ['shared/resources/resolve-platform.sh']

