nfr_validation:
  security:
    status: CONCERNS
    notes: >-
      The change closes a real and well-evidenced escalation class, and closes it in the fail-closed
      direction — including the tier-1 half (`__MAP__` vs `__NONE__`) that was never an awk problem.
      The refusal is unforgeable: it reads the scan verdict global rather than a reader's stdout, and
      `tracker: __UNSUPPORTED__` on a clean file is verified to stay DATA and fail enum validation.
      CONCERNS solely for TASK-60-QA1-1, which leaves one route of the same class open on tier 2.
  performance:
    status: PASS
    notes: >-
      Measured rather than asserted, and independently reproduced: awk invocations per `source` go
      8 -> 9 on the awk tier (the single scan pass) and 13 -> 13 on the python tier (the scan skips
      itself when tier 1 is authoritative). No added python spawns. The scan runs once at source
      time; §42e pins that it does not become per-read.
  reliability:
    status: PASS
    notes: >-
      A failed `awk` yields a refusal rather than a clean verdict — the task's own defect one layer
      down, caught by the mutation audit and witnessed. resolve-paths.sh keeps its never-fail
      contract (§26 green, `__UNSUPPORTED__` mapped to ""). Rollback plan present and unchanged.
  maintainability:
    status: CONCERNS
    notes: >-
      Comments are unusually good — every non-obvious decision carries its reason, and the
      local/non-local rule is stated where a future reader will meet it. Two deductions: the CI step
      in TASK-60-QA1-2, and the else-branch of the hoisted refusal in resolve-platform.sh is
      indented at the outer level, so the halt message reads as unconditional on a skim. That block
      is security-relevant; a misread is expensive.

recommendations:
