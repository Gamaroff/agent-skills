schema: 1
task: 'task.60.config-reader-strict-subset'
task_title: "Give the config reader's awk tier a grammar, or make it refuse"
gate: CONCERNS
status_reason: 'The subset, the refusal and its message are correct and well-witnessed, but one escalation of the same class the task exists to close survives on tier 2 — a duplicated `access:` key resolves first-wins to the permissive value while tier 1 halts. One CI robustness issue alongside it.'
reviewer: 'QA Engineer'
updated: '2026-08-18T12:35:00Z'

top_issues:
  - id: TASK-60-QA1-1
    severity: medium
    finding: >-
      A duplicate `access:` key (or a duplicated child beneath it) is not in the refused set, so the
      tier-2 scan reports the file clean and the block reader takes the FIRST match. With the
      permissive value written first, `access:\n  tracker: full\naccess:\n  tracker: manual`
      resolves to `full` at exit 0 on tier 2, while tier 1 halts on the duplicate. YAML itself says
      last-wins (`manual`), so tier 2 is the only tier that both accepts the shape and picks the
      permissive reading. read-config.sh:81 describes this exact shape ("a copy-pasted second
      `access:` block made the first one vanish, silently resolving a declared `manual` back to
      `full`") as the reason tier 1 rejects duplicates — the same hole remains open on the tier a
      stock macOS host actually runs.
    suggested_action: >-
      Add duplicate detection to _config_subset_scan for the guarded keys — a repeated top-level
      guarded key, and a repeated child under a guarded parent — and refuse. Add refusal-matrix
      fixtures for both shapes plus a mutation witness.
    suggested_owner: dev
  - id: TASK-60-QA1-2
    severity: medium
    finding: >-
      .github/workflows/test.yml runs `sudo apt-get install -y --no-install-recommends gawk mawk`
      with no preceding `apt-get update`. A stale package index on the runner fails the step, which
      fails the whole Test job before `npm test` runs — turning an unrelated infrastructure flake
      into a red build on every PR. This is also the step that makes §45 meaningful, so its
      reliability matters more than a convenience install.
    suggested_action: >-
      Add `sudo apt-get update` before the install, or make the step non-fatal so §45 degrades to
      its printed SKIP rather than failing the job.
    suggested_owner: dev

