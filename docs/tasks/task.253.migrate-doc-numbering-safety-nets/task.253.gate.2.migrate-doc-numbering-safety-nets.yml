    file: 'shared/resources/tests/migrate-doc-numbering.test.mjs'
    finding: 'The gap 3 regression guard asserts frontmatterField(text, key) is not null, but doc-id.js frontmatterField returns an empty string for a missing key and never null. The id, epic and prd_source checks cannot fail; only prd_number is really checked. Reproduced: frontmatterField on a document without epic returns "". Code review CR-1 (high confidence).'
    suggested_action: 'Assert a non-empty value and the expected value for each key; mutation-prove it by blanking one key and confirming the test goes red.'
    suggested_owner: dev
    bug_ref: 'task.253.bug.2.gap-3-guard-asserts-not-null-on-an-empty-string.md'
    status: open
  - id: 'T253-QA-3'
    severity: low
    file: 'shared/resources/migrate-doc-numbering.mjs'
    finding: 'maskedLinks closes a fence on any fence line, ignoring the opening marker character and length, so it disagrees with doc-links.js blankFences. Reproduced: a tilde fence holding a backtick fence line drops a later link from the warning list. Code review CR-5 (high confidence, low severity).'
    suggested_action: 'Track the opening marker character and length and close only on a match; add a test with the reproduction string.'
    suggested_owner: dev
    bug_ref: 'task.253.bug.3.masked-links-fence-tracking-ignores-marker-type.md'
    status: open

