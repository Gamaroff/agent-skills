top_issues:
  - id: 'QA-1'
    severity: low
    file: 'skills/session-handoff/scripts/handoff-verify.mjs'
    finding: 'Reviewer CR-1 (low/high), confirmed in-process: jest''s `-t` (`testNamePattern`, alias `t`, `type: string`, `requiresArg: true` — jest-cli 30.5.1) and vitest''s `-t <pattern>` are value-taking options declared bare, so `npx jest -t --ci` and `npx vitest -t --run x` are admitted and the following token is judged by the positional policy rather than by the flag. No bypass: yargs-parser errors "Not enough arguments following: t" on the dash token (confirmed with the installed jest), and cac sets `-t` true and still sees `--run` (vitest not installed — reviewer''s reading). The gap is consistency with the gate-7/16 mechanism, which mocha already follows for its own `-t`/`-g`.'
    suggested_action: 'Move `-t` into valueFlags with `patternFlags: ["-t"]` on jest and vitest; refused: `npx jest -t --ci`, `npx vitest -t --run x`, trailing `-t`; allowed: `npx jest --ci -t x`, `npx vitest --run -t x`.'
    suggested_owner: dev
    status: open
  - id: 'QA-2'
    severity: low
    file: 'skills/session-handoff/scripts/handoff-verify.mjs'
    finding: 'Reviewer CR-2 (low/high), confirmed in-process: `npx tsc --noEmit -p ./tsconfig.json` was admitted before the fix (bare `-p`, `./tsconfig.json` a positional) and is refused now — DATA_FILE requires every segment to start with `[A-Za-z0-9_-]`, so a leading `./` never matches, while the same prefix is admitted for a positional (`--noEmit ./src/x.ts`). The pre-existing data-kind rule (`prettier --config ./x.json` is refused the same way), surfaced by the fix on a spelling handoffs commonly use. Harmless tightening alongside: `-e SC2086,SC2046,` (trailing comma) is refused where shellcheck would accept it.'
    suggested_action: 'Admit an optional leading `./` in DATA_FILE (the `..` guard in VALUE_KINDS.data still applies); allowed: `npx tsc --noEmit -p ./tsconfig.json`, `npx prettier --check --config ./.prettierrc .`; refused: `-p .//x.json`, `-p ./../x.json`. Mutation: the prefix removed.'
    suggested_owner: dev
    status: open

