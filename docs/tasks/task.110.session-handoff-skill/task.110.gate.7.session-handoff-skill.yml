    finding: 'npm view / npm ls positionals are POS.ANY, and a package spec may be a URL: executed npm view http://127.0.0.1:8099/pkg.tgz → listener received GET /pkg.tgz; npm view git+http://127.0.0.1:8099/x/y.git → npm ran git ls-remote/fetch against the URL (GET /x/y.git/info/refs?service=git-upload-pack) — the gate-3 PRB-8 primitive through npm; a git+ssh spec would use the reader''s agent.'
    suggested_action: 'Hold npm view/ls positionals to a bare package-name pattern (optional @scope, name, optional @version; no :, no //, no git+/file: prefix); refused-list tests for the tarball, git+http and git+ssh spellings.'
    suggested_owner: dev
    bug_ref: 'task.110.bug.9.gh-and-npm-reach-any-host-through-repo-and-package-specs.md'
    status: open
  - id: 'QA-4'
    severity: medium
    file: 'skills/session-handoff/scripts/handoff-verify.mjs'
    finding: 'npxRule makes --no-install optional while the runner spawns non-TTY with CI=1, under which npm 11 installs a missing package without prompting (executed: CI=1 npx cowsay@1.6.0 probe </dev/null printed "will be installed" and ran); nine of the ten allow-listed tools are absent from this repo''s node_modules/.bin, so npx tsc --noEmit fetches and runs the registry package named tsc, which is not TypeScript.'
    suggested_action: 'Require the --no-install/--no prefix in npxRule, or inject --no into the spawned argv for the npx arm; refused-list test for a bare npx stylelint --version.'
    suggested_owner: dev
    bug_ref: 'task.110.bug.10.npx-installs-a-missing-tool-from-the-registry.md'
    status: open
  - id: 'QA-5'
    severity: low
