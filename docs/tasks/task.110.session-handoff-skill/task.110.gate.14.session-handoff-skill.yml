top_issues:
  - id: 'QA-1'
    severity: high
    file: 'skills/session-handoff/scripts/handoff-verify.mjs'
    finding: 'A positional an npx spec reads as a file is read by the tool as something else: TypeScript consumes a following `null` for any option (`--noEmit null` → unset → emit) and reads an `@`-prefixed positional as a RESPONSE FILE whose contents are argv (`--noEmit @tsargs.txt` with a repo file `--noEmit false zz.ts` → emit — every refused flag back through a data file, the bug.14 shape); jest''s yargs consumes a following true/false and jest-config sets updateSnapshot=new when ci is false (`--ci false` → snapshot files written, inline-snapshot test sources rewritten). All three executed through the CLI in the consumer-shaped project with typescript/jest declared. Reviewer CR-1/CR-2/CR-3 (high/high ×3), folded: one class, one rule.'
    suggested_action: 'One universal rule in npxRule after the tool spec passes: refuse any positional matching /^(true|false|null)$/i or beginning with `@` — fold the tsc-only positionalPattern into it. Refused-list tests: `npx tsc --noEmit null`, `--noEmit null src`, `--noEmit @x`, `npx jest --ci false`, `--silent false`, `npx vitest --run false x`, `npx prettier --check @x`; mutation = the rule removed.'
    suggested_owner: dev
    bug_ref: 'task.110.bug.19.npx-positionals-read-as-flag-values-and-response-files.md'
    status: open
  - id: 'QA-2'
    severity: medium
    file: 'skills/session-handoff/scripts/handoff-verify.mjs'
    finding: 'Reviewer CR-4 (medium/medium), confirmed by execution: defaultRunner sets `CI: process.env.CI ?? "1"`, so an inherited `CI=false` reaches the child; `npx jest --silent` under env -i CI=false wrote a snapshot through read mode with no flag in the handoff line. SKILL.md''s "the runner is non-TTY with CI=1" is conditional on the reader''s shell.'
    suggested_action: 'Force `CI: "1"` unconditionally in the child env; runner test that an inherited CI=false does not reach the child; mutation = the `??` restored.'
    suggested_owner: dev
    bug_ref: 'task.110.bug.20.runner-inherits-ci-false.md'
    status: open
  - id: 'QA-3'
    severity: low
    file: 'skills/session-handoff/tests/handoff-verify.test.js'
    finding: 'The cycle-13 cap test asserts the runner resolves within 10 s of the kill-at-cap; under the full suite at concurrency 4 it went red once at 20.2 s (the child''s linger) while passing 3/3 alone and 1/1 at concurrency 4 over four files. The bound is too tight for a loaded machine, not the mechanism (kill-on-cap mutation-proven red). QA drafted and reverted the widening — it is qa-fix''s edit.'
    suggested_action: 'Write 18 MB past the cap, linger 45 s, runner timeout 90 s, bound 40 s — the only way to resolve inside the bound is the kill at the cap, with slack for load.'
    suggested_owner: dev
    status: open
  - id: 'QA-4'
    severity: low
    file: 'skills/session-handoff/scripts/handoff-verify.mjs'
    finding: 'Reviewer CR-5 (low/medium): under a repository tsconfig with `incremental`/`composite`, tsc ≥ 4.0 writes `*.tsbuildinfo` even with --noEmit; `-p tsconfig.json` and the bare tsconfig-driven run reach it although `--incremental`/`--tsBuildInfoFile` are refused. Reviewer CR-6/CR-7 cleanups: bare `--jq`/`-q` in GH_API_FLAGS are dead after the valueFlags change; the tsc pattern''s /i over-approximates tsc''s case-sensitive compare (harmless; say so).'
    suggested_action: 'Document the tsbuildinfo residual in the SKILL.md tsc row as a known in-repo-config write; drop the dead entries; reword the comment.'
    suggested_owner: dev
    status: open

