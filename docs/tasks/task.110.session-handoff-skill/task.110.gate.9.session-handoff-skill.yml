    severity: high
    file: 'skills/session-handoff/scripts/handoff-verify.mjs'
    finding: 'The npx arm admits a module-loading flag value by path shape (relative, no ..): prettier --config=, eslint --config=/-c/--format=/-f, stylelint --config=/--formatter=, mocha --reporter=/-R, jest --reporters=, vitest --reporter=, markdownlint -c/--config=. The tool imports the module and its top level runs under the tool''s argv. Executed through read mode in a scratch clone: `npx prettier -l --config=shared/resources/generate-prd-epic-index.mjs skills/session-handoff/scripts/handoff-verify.mjs` against a consumer-shaped docs/prd/prd.zz/ tree rewrote prd.zz.md (index block added, md5 changed) and the line read `confirmed`. A canary module written to a file confirmed the import mechanism against this checkout; the static scan finds two tracked modules with an unguarded top-level main() (generate-prd-epic-index.mjs, registry-tick.js). This is the PRB-6 / CR-2 boundary accepted since gate 3; the handoff asked for an explicit decision and, on measurement, it does not stand — the cycle-8 identity principle applies to this arm too.'
    suggested_action: 'Fourth strike: replace the mechanism, not the list — a flag value the tool loads as code is held by KIND: --config=/-c/--ignore-path= to a data file (.json/.jsonc/.yaml/.yml/.toml or an extensionless dotfile), --format=/-f/--formatter=/--reporter=/-R/--reporters= to a bare name ([A-Za-z0-9_-]+, built-in or installed package), never a path to a .js/.mjs/.cjs/.ts; or drop the module-loading flags from NPX_TOOLS entirely. Refused-list tests for the executed spelling and each tool''s loader flag with a code-file value; allowed tests for --config=.prettierrc, --config=.eslintrc.json, -f json, -R spec; mutation = the kind check removed. Correct the SKILL.md npx row and retire the "accepted boundary" note wherever restated.'
    suggested_owner: dev
    bug_ref: 'task.110.bug.14.npx-config-and-formatter-values-load-in-repo-modules.md'
    status: open
  - id: 'QA-2'
    severity: medium
    file: 'skills/session-handoff/scripts/handoff-verify.mjs'
    finding: 'A positional under npx mocha / npx vitest is read by the tool as a SUBCOMMAND, and `init` scaffolds files: executed through the CLI (--cwd) in a consumer-shaped project with mocha installed, `npx mocha init out9` wrote out9/index.html, mocha.css, mocha.js (484 KB) and tests.spec.js; `npx mocha init .` overwrites the same four names at the root. `npx vitest init browser` (and watch/dev/bench/typecheck/related/list) is admitted by the same rule — not executed, vitest not installed. In this repository neither tool is installed so the cycle-7 --no-install injection refuses both (vitest → one 404 manifest GET, the documented residual); the write is nil here and real in any consumer with either devDependency. The --init FLAGS on jest/eslint/tsc are refused; the subcommand spelling of the same thing is not.'
    suggested_action: 'Drop mocha and vitest from NPX_TOOLS (this repo uses node --test; a consumer cites them through npm test), or add a positionalPattern on both that refuses the subcommand vocabulary and require --run on vitest as tsc requires --noEmit. Refused-list tests: `npx mocha init out`, `npx mocha init .`, `npx vitest init browser`, `npx vitest watch`; mutation = the pattern removed.'
    suggested_owner: dev
    bug_ref: 'task.110.bug.15.npx-subcommand-positional-selects-a-scaffolder.md'
    status: open
  - id: 'QA-3'
    severity: medium
    file: 'skills/session-handoff/scripts/handoff-verify.mjs'
    finding: 'Reviewer CR-1 (medium/high), confirmed by execution: tokenize() pushes a token only `if (cur)`, so an empty quoted token vanishes — `grep -c "" README.md` is approved and RUN as `grep -c README.md` (pattern README.md, stdin /dev/null) and `jq --arg x "" . f` as `jq --arg x . f`; an unterminated quote is swallowed silently. Through the CLI against a one-line README: `grep -c "" README.md; expect: 0` read `confirmed` with measured 0 — the correct command prints 1. The argv judged and the argv run are the same (safety holds); neither is the command recorded, and the verdict is about the wrong command.'
    suggested_action: 'Track a sawQuote flag per token in tokenize() and push when cur is non-empty OR a quote pair closed; refuse an unterminated quote (`unverifiable: unterminated quote`). Tests: tokenize of the three spellings expecting the empty token preserved, plus the CLI line reading stale against expect 0 / confirmed against expect 1.'
    suggested_owner: dev
    bug_ref: 'task.110.bug.16.tokenize-drops-empty-quoted-tokens.md'
    status: open
  - id: 'QA-4'
    severity: low
    file: 'skills/session-handoff/scripts/handoff-verify.mjs'
    finding: 'Reviewer CR-2 (low/medium), confirmed by execution: `jq -n env` is admitted (jq filter positional) and jq''s env builtin dumps the verifier''s own inherited environment into `measured` — executed under a stripped env with CANARY_SECRET set, the value appeared in the measured field of both the table and --json output. A new spelling of the CR-6 measured-echo class that needs no path knowledge; `$ENV` is already refused by the `$` rule, `env` is a bare word.'
    suggested_action: 'Refuse a jq positional that contains the bare word `env` (`/\benv\b/`) alongside the existing `$` refusal, or scrub the child environment to the variables the admitted binaries need; record the choice in the CR-6 note.'
    suggested_owner: dev
    status: open
  - id: 'QA-5'
    severity: low
    file: 'skills/session-handoff/scripts/handoff-verify.mjs'
    finding: 'Reviewer CR-3 (low/high), confirmed: run() guards only exists(file); a directory path (`handoff-verify.mjs skills/session-handoff --json`) throws EISDIR from readFileSync, the top-level await rejects, and the CLI exits 1 with a stack trace and no JSON object — against the header contract that every non-usage outcome is one JSON object with a reason.'
    suggested_action: 'Wrap the read in try/catch and return { reason: "missing" (or "unreadable"), file, detail, exitCode: 1 }; test with a directory path under --json.'
    suggested_owner: dev
    status: open
  - id: 'QA-6'
    severity: low
    file: 'skills/session-handoff/scripts/handoff-verify.mjs'
    finding: 'EVAL_LIVE_DRIVER (/:(cli|sdk)$/) excludes a live driver only as the LAST segment: `npm run eval:x:cli:y` and `eval:x:sdk:smoke` are admitted by construction (isAllowed ok). No such script exists in package.json today, so the executed impact is nil; the shape is one added script away from a billed live run through read mode (gate 6, QA-3).'
    suggested_action: 'Match `:cli` / `:sdk` as ANY segment (`/(^|:)(cli|sdk)(:|$)/`), or admit eval scripts by exact name from package.json the way NPM_SCRIPTS does; refused-list test for the mid-segment spelling.'
    suggested_owner: dev
