task: 'task.110.session-handoff-skill'
task_title: 'A session-handoff skill that writes the handoff and re-measures it on read'
gate: CONCERNS
status_reason: 'The allow-list mechanism holds: 0/73 corpus hostile accepted across all five sinks, a third fresh enumeration of 170 spellings (flag values, positional verbs, tokenizer edges) accepted nothing that mutates or executes from outside the repo — with one exception. Joined name=value flag values skip the no-..-no-absolute check that separate-token values get, so npx prettier --config=../evil.js (a .js config executes) reaches outside the cwd. Medium: it needs both a committed handoff line and an attacker file already on the reader'"'"'s disk, unlike the cycle-1/2 shapes which needed only the commit. No HIGH; no third strike.'
reviewer: 'QA Engineer'
updated: '2026-09-15T03:49:51Z'

top_issues:
  - id: 'PRB-6'
    severity: medium
    file: 'skills/session-handoff/scripts/handoff-verify.mjs'
    finding: 'checkArgs validates only the NAME of a name=value flag, so --config=../evil.js, --config=/abs/evil.js, --ignore-path=../x, -p=../x pass while the separate-token forms (-c ../evil.js) are refused by the positional policy; prettier/eslint/stylelint configs may be JavaScript, so this executes code from outside the cwd.'
    suggested_action: 'Validate the value of every name=value flag with the same rule as a positional (no .. segment; no leading / unless the spec allows absolute paths).'
    suggested_owner: dev
    status: open
  - id: 'PRB-7'
    severity: low
    file: 'skills/session-handoff/scripts/handoff-verify.mjs'
    finding: 'The async runner accumulates stdout/stderr without bound (the spawnSync maxBuffer went with the wrapper); a chatty command can grow two strings without limit.'
    suggested_action: 'Cap collected output (e.g. 64 MiB) and mark the run as truncated in measured.'
    suggested_owner: dev
    status: open
  - id: 'PRB-8'
    severity: low
    file: 'skills/session-handoff/scripts/handoff-verify.mjs'
    finding: 'git ls-remote accepts any positional, so a handoff can point the reader at an arbitrary remote URL (a network read with the reader'"'"'s SSH agent); npm run eval: with an empty suffix is admitted by the prefix rule (harmless: npm errors).'
    suggested_action: 'Restrict ls-remote positionals to remote names / patterns without a URL scheme; require a non-empty eval:<name>.'
    suggested_owner: dev
    status: open

