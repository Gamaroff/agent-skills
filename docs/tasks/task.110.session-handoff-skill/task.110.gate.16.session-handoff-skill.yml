  - id: 'QA-1'
    severity: medium
    file: 'skills/session-handoff/scripts/handoff-verify.mjs'
    finding: 'Reviewer CR-1 (high/high; held at medium — executed, but only under a repository directory literally named `--noEmit`): the tsc spec declares `-p` and `--project` as bare flags; tsc''s parseOptionValue (`case "string"`) consumes the following token unconditionally, so `npx tsc -p --noEmit` and `npx tsc --project --noEmit` pass checkArgs and requireFlag while tsc parses `project: "--noEmit"` with noEmit unset. Executed through the clone''s own verifier at 9cf723a6 against consumer9 (typescript 7.0.2) with `./--noEmit/{a.ts,tsconfig.json}` present: both `confirmed`, `./--noEmit/zzout/a.js` emitted through read mode. Without that directory tsc exits 1, no emit.'
    suggested_action: 'Move `-p`/`--project` to tsc valueFlags with valueKinds data; refused: `npx tsc -p --noEmit`, `--project --noEmit`, `--noEmit -p --noEmit`, `-p ../x.json --noEmit`; allowed: `-p tsconfig.json --noEmit`, `--project tsconfig.build.json --noEmit`. Mutation: `-p` back to bare. Audit every remaining bare flag on every tool against its parser''s value-taking set.'
    suggested_owner: dev
    bug_ref: 'task.110.bug.23.tsc-project-flag-declared-bare-consumes-noemit.md'
    status: open
  - id: 'QA-2'
    severity: low
    file: 'skills/session-handoff/scripts/handoff-verify.mjs'
    finding: 'Reviewer CR-2 (low/medium), confirmed by execution: prettier''s loadConfig parses an admitted data file (extensionless → YAML, `.json` → JSON) and, when the parsed value is a string, resolves it as a shareable-config module specifier via createRequire(configFile)/import(). A one-line `.zzrc` containing `./canary.mjs` under `--config .zzrc` imported it (CANARY-IMPORTED.txt written); a bare `canary.mjs` in a `.yml` did not resolve (exit 1). The `data` kind is therefore only as safe as the repository''s data files under prettier — the in-repo-config class already accepted for tsc''s tsbuildinfo. No tracked file of that shape exists here; the shape is prettier''s own shareable-config feature, so narrowing to prettier''s config names does not close it.'
    suggested_action: 'Document beside the tsbuildinfo residual in SKILL.md and the tsc/prettier spec comments: a data file whose entire content is a module specifier is a code load under prettier.'
    suggested_owner: dev
    status: open
  - id: 'QA-3'
    severity: low
    file: 'skills/session-handoff/scripts/handoff-verify.mjs'
    finding: 'Reviewer CR-3 (low/high), confirmed: tsc has no `--opt=value` syntax — `npx tsc --pretty=false --noEmit` is admitted and always exits 1 (`Unknown compiler option ''--pretty=false''`), a dead entry.'
    suggested_action: 'Drop `--pretty=` from the tsc flags.'
    suggested_owner: dev
    status: open

