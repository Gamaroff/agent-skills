top_issues:
  - id: 'QA-1'
    severity: high
    file: 'skills/session-handoff/scripts/handoff-verify.mjs'
    finding: 'interpreterRule admits every --test-mode positional as a POS.PATHS "pattern", but Node executes an explicitly named file under --test whatever its name, and npm test -- <file> reaches the same runner through testModeArgsOk. Executed through read mode in a scratch clone: `node --test scripts/generate-skill-dependencies.mjs` (isMain true in the runner child) re-created shared/resources/skill-dependencies.json after it was deleted — verdict confirmed; `node --test skills/loop-supervisor/scripts/run-loop.mjs` (default subcommand `run`) spawned two `claude -p` iterations against roadmap item T111 (runs.jsonl spawned:true ×2, two transcripts under ~/.claude/projects) — verdict confirmed, exit 0; each exited at turn 0 only because the clone had no .claude/skills link. isAllowed also admits `node --test node_modules`, `node --test .`, `npm run test -- skills/loop-supervisor/scripts/run-loop.mjs`.'
    suggested_action: 'Hold --test-mode positionals (in testModeArgsOk, so the node and npm-test arms move together) to a directory or a Node test-file name (*.test.{js,mjs,cjs}, *-test.*, *_test.*, test.*, under test/ or tests/); refused-list tests for both executed spellings, `npm test -- scripts/…` and `node --test node_modules/prettier/bin/prettier.cjs`; allowed tests for the test-directory and *.test.js shapes; correct the "patterns, not a script" comment. Third strike: this must be a mechanism change, a deletion or a documented waiver — not a patch — and the fix summary must say which.'
    suggested_owner: dev
    bug_ref: 'task.110.bug.11.test-mode-positional-runs-any-in-repo-file.md'
    status: open
  - id: 'QA-2'
    severity: medium
    file: 'skills/session-handoff/scripts/handoff-verify.mjs'
    finding: 'git remote show <name> positionals are POS.ANY and git resolves an unconfigured name as a URL alias and queries it — the PRB-8 primitive ls-remote was anchored against, one subcommand over. Executed against a local listener: `git remote show http://127.0.0.1:8099/x.git` → GET /x.git/info/refs?service=git-upload-pack; `git remote show 127.0.0.1:8099/x.git` → ssh invoked against 127.0.0.1:22 (the reader''s keys and agent); get-url unaffected. Reviewer CR-1 (high/high); severity held at medium for consistency with gate 7''s egress findings.'
    suggested_action: 'Apply ls-remote''s positionalPattern to remote show (and get-url), or drop remote show — `remote -v` / `get-url <name>` answer a handoff without a round-trip; refused-list tests for the http, https and scp spellings; allowed test for `git remote show origin`.'
    suggested_owner: dev
    bug_ref: 'task.110.bug.13.git-remote-show-resolves-a-url-positional.md'
    status: open
  - id: 'QA-3'
    severity: medium
    file: 'skills/session-handoff/scripts/handoff-verify.mjs'
    finding: 'The cycle-7 observation-log.js spec admits next-id under "read verbs only", but nextId() runs sweepResolved() (renameSync of every resolved entry into archive/) and writeIdFloor() (mkdirSync + write) and --dry-run is not admitted. Executed against a scratch workspace under $HOME: fresh empty dir → skill-observations/observation-log/archive/.id-floor created (three directories and a file at a path the document chose); with one status: actioned entry → archived: ["0001-x.md"], file moved, floor 2. doctor/scan/queue/families verified writer-free.'
    suggested_action: 'Remove next-id from positionalPattern (or require --dry-run the way tsc requires --noEmit); refused-list test for `node …/observation-log.js next-id --workspace /x --json`; correct the SKILL.md node row.'
    suggested_owner: dev
    bug_ref: 'task.110.bug.12.observation-log-next-id-is-a-write.md'
    status: open
  - id: 'QA-4'
    severity: low
    file: 'skills/session-handoff/scripts/handoff-verify.mjs'
    finding: 'Reviewer CR-7 (low/high, confirmed in-process): a prose line with an empty `; expect:` yields figures [""], which passes the no-figure guard and always reads `stale: moved:` (blank) — the table branch filters empty figures, the comment branch does not.'
    suggested_action: 'Filter empty strings out of [parseExpect(expect)] with the same normalise(f) !== "" test the table branch uses; test for the empty-expect line reading unverifiable: no figure.'
    suggested_owner: dev
    status: open
  - id: 'QA-5'
    severity: low
    file: 'skills/session-handoff/scripts/handoff-verify.mjs'
    finding: 'Reviewer CR-8 (low/high, confirmed in-process): a table row with fewer cells than the header leaves cells[headerCols.check] undefined, so `check` renders as "undefined" and is dropped from --json; the command and result cells already fall back to "".'
    suggested_action: 'Fall back to `row ${i + 1}` when the check cell is missing, as when the column is absent.'
    suggested_owner: dev
    status: open
  - id: 'QA-6'
    severity: low
    file: 'skills/session-handoff/scripts/handoff-verify.mjs'
    finding: 'PY_FLAG_PATTERN admits any -X<chars> value: `python3 -Xpycache_prefix=zzcache skills/create-skill/scripts/quick_validate.py skills/session-handoff` read confirmed and created zzcache/ in the tree; -Xperf writes /tmp/perf-<pid>.map. Cache bytes only, and Python writes __pycache__ beside quick_validate.py''s sibling import in the plain form regardless (reviewer CR-3 rated medium; held at low).'
    suggested_action: 'Enumerate the accepted -X values (utf8, dev, importtime, frozen_modules=…) instead of a character class, and inject -B into the running argv the way --no-install is injected for npx — or document the cache write as tolerated in the python3 row.'
    suggested_owner: dev
