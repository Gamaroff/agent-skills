top_issues:
  - id: 'QA-1'
    severity: medium
    file: 'skills/session-handoff/scripts/handoff-verify.mjs'
    finding: 'The `name` kind (`[A-Za-z0-9_-]+`) stands for "a built-in or an installed package", but a reporter name is not that on two tools. mocha''s `Mocha.prototype.reporter` falls back from `require.resolve(name)` to `require(path.resolve(name))`, so a bare name loads `<cwd>/<name>.js` / `<name>/index.js`: executed through the CLI (--cwd) in the consumer-shaped project with mocha installed, `npx mocha -R zzrep t.js` ran a root-level `zzrep.js` (canary file written) before mocha rejected it as a reporter; `-R index`, `--reporter=scripts`, `-R lib` admitted (reviewer CR-2). vitest''s built-in `html` and `blob` reporters write `html/` and `.vitest-reports/` by default and jest''s `--reporters=jest-junit` writes `./junit.xml`; `npx vitest --run --reporter=html x`, `--reporter=blob x`, `npx jest --reporters=jest-junit` admitted (reviewer CR-3, not executed — neither tool installed). Nil in this repository (no root-level module, mocha absent); real in a consumer with mocha and an `index.js`.'
    suggested_action: 'Replace the `name` kind on every reporter/formatter flag with a per-tool closed set of stdout-only built-ins (mocha spec/dot/nyan/tap/landing/list/progress/json/json-stream/min/markdown/xunit; vitest default/basic/verbose/dot/tap/tap-flat/github-actions/json/junit; jest default/summary/github-actions; eslint and stylelint their documented formatters) — the identity principle applied to the value. Refused: `-R zzrep`, `--reporter=index`, `-R lib`, `--reporter=html`, `--reporter=blob`, `--reporters=jest-junit`; allowed: `-R spec`, `--reporter=dot`, `--reporters=default`, `-f json`. Mutation: the set widened back to BARE_NAME.'
    suggested_owner: dev
    bug_ref: 'task.110.bug.17.reporter-name-kind-is-a-shape-not-a-closed-set.md'
    status: open
  - id: 'QA-2'
    severity: medium
    file: 'skills/session-handoff/scripts/handoff-verify.mjs'
    finding: 'The cycle-9 QA-4 fix refuses a jq positional containing the bare word `env` unless preceded by `.` or `/`; jq''s alternative operator is `//`, so `jq -n null//env`, `.//env`, `1//env`, `[.//env]` are admitted. Executed through the CLI under a stripped env with CANARY_SECRET set: `jq -n null//env; expect: canary-9-xyz` → `confirmed`, measured carries the whole inherited environment. Reviewer CR-1 (high/high); held at medium — nothing in this repository posts the report anywhere, and the class (CR-6 measured echo) has been judged advisory since gate 8 — but not low: the fix regressed on its own exemption.'
    suggested_action: 'Judge the jq filter (first positional; -f/--from-file are refused) with no `/` exemption at all, keeping the path exemption only for later file positionals; refused: `null//env`, `.//env`, `[.//env]`, `1//env`; allowed: `.env`, `. data/env.json`. Consider spawning children with a scrubbed environment as the mechanism that retires the class.'
    suggested_owner: dev
    bug_ref: 'task.110.bug.18.jq-alternative-operator-bypasses-the-env-refusal.md'
    status: open
  - id: 'QA-3'
    severity: low
    file: 'skills/session-handoff/scripts/handoff-verify.mjs'
    finding: 'Reviewer CR-4 (low/low): the `data` kind judges the name, not what the tool does with it — eslint 9 `-c <file>` import()s the file whatever its extension, so an extensionless dotfile (`-c .env`) is admitted and evaluated as a module (a syntax error for non-JS content, code for JS content); prettier treats a config whose parsed value is a single string as a shareable-config module specifier, so `--config=.nvmrc`-style dotfiles become a module lookup. Not executed; in this repository every tracked dotfile is data.'
    suggested_action: 'Narrow the extensionless-dotfile alternative of DATA_FILE to the tools'' own config/ignore names (.prettierrc .prettierignore .eslintrc .eslintignore .stylelintrc .stylelintignore .markdownlintrc .markdownlintignore .markdownlint-cli2 …) or document that `data` is only as safe as the repository''s data files.'
    suggested_owner: dev
    status: open
  - id: 'QA-4'
    severity: low
    file: 'skills/session-handoff/scripts/handoff-verify.mjs'
    finding: 'Cosmetic residue of the DATA_FILE regex: `--config=.js`, `--config=.mjs` (dotfiles named like an extension) and `x..json` / `x/..json` (a file literally named `..json`) are admitted as data. Executed: prettier does not import a dotfile named `.js` (no canary; extname is empty, YAML loader); the `..` guard holds for real traversal. Untidy, not unsafe.'
    suggested_action: 'Require at least one character before the dot in the dotfile alternative (`\.[A-Za-z0-9_-]+` → a name that is not itself a known code extension) and refuse a basename beginning with `..`.'
    suggested_owner: dev
    status: open

