    - action: 'Replace every deny-list with a per-binary ALLOW-list: for each binary an explicit set of permitted flags (exact and =value forms), a positional policy, and refusal of everything else — prefixes, joined forms and exec-shaped options are then refused by construction. This is a mechanism replacement, not a third patch.'
      refs: ['skills/session-handoff/scripts/handoff-verify.mjs']
    - action: 'Async runner: kill the process group on SIGINT/SIGTERM as well as on timeout.'
      refs: ['skills/session-handoff/scripts/handoff-verify.mjs']
    - action: 'Add the cycle-2 shapes (prefixes, -v bypass, --check on any script, --hostname, --write=., ls-remote --upload-pack, date positional, npx -o/--coverage) to the refused list; add an ALLOW-list property test: every accepted argv contains only allow-listed flags.'
