status_reason: 'Cycle-5 fix verified (CR-1/2/3 closed; mutation-proven). Executed boundary probes through the arms no previous cycle reached found the read-only invariant broken twice: the npm -- passthrough forwards any dash token and absolute positional, so npm run format:check -- --write rewrote the tree (HIGH, no precondition) and npm test -- -r /tmp/evil.js preloaded a module from outside the repo; and gh api accepts an absolute URL, so read mode requests any host (MEDIUM, no token sent). HIGH sequence across gates 4, 5, 6: 0, 0, 1 — third-strike does not fire.'
