top_issues:
  - id: 'TASK-250-CR5-1'
    severity: medium
    file: 'shared/resources/tests/security-probe.test.mjs'
    finding: 't250CodeOnly (line 8177) ends a template literal at the next backtick and ignores ${ … }. In a nested template, the outer one ends at the inner opening backtick, and the inner text is read as code. A comma there re-splits the argument list, while the call name stays visible and the list still closes, so masked, unparsed and the regex tripwire all miss it. Reproduced: cpSync(`${b ? `,` : ""}`, join(REPO_ROOT, "x")); gives found [], total 1, unparsed [], masked []. There is no nested template in the file today.'
    suggested_action: 'Track ${ } depth when scanning a template, or treat a template that contains ${ inside a write call''s argument list as unparsed. Add a nested-template calibration row.'
    suggested_owner: dev
    status: waived
  - id: 'TASK-250-CR5-2'
    severity: low
    file: 'shared/resources/tests/security-probe.test.mjs'
    finding: 'The tripwire (line 8258) fires only on a comma or bracket. A phantom regex holding a quote (after this.#of, which the "." rule does not cover) shifts the string boundaries, and a phantom string swallows the comma. Reproduced: cpSync(this.#of / ''/'' + x, join(REPO_ROOT, "x"), opts); followed by a line with a comma and a closing brace gives found [], total 1, unparsed [], masked [].'
    suggested_action: 'Include quotes and backticks in the tripwire''s class, or apply the tripwire to string and template blanks too.'
    suggested_owner: dev
    status: waived

