task: 'task.250.security-probe-scratch-out-of-tree'
task_title: 'Security-probe tests write no scratch files into the repository'
gate: CONCERNS
status_reason: 'Cycle 2''s fixes hold: all five go red when reverted, and the suite passes 277/277. The new regex-literal heuristic misreads a division after a string literal or a // comment as a regex start, which hides a REPO_ROOT write without failing the guard (CR3-1, reproduced). The calibration row meant to cover this cannot catch it (CR3-3).'
reviewer: 'QA Engineer'
head: '951f9cbe5e3fdc4ae3c4c1e3d20abe6d1e8e71e4'
updated: '2026-11-02T19:18:33Z'

top_issues:
  - id: 'TASK-250-CR3-1'
    severity: medium
    file: 'shared/resources/tests/security-probe.test.mjs'
    finding: 'regexAfter (line 8115) reads the blanked view, with ^ anchored to the start of a 16-character window. A / after a string literal or after a // comment is therefore taken as the start of a regex literal, and it blanks the code that follows up to the next / on the line. Reproduced in memory: `const z = "it''s" / c; mkdirSync(join(REPO_ROOT, "x")); const w = e / f;` gives found [] with masked ["1"]. The masked count stays under the cap of 8, so the guard passes.'
    suggested_action: 'Decide from the last significant character or word, scanning back past whitespace (a blanked comment is whitespace), and treat a closing literal delimiter as an operand; add both reproductions to the calibration sample.'
    suggested_owner: dev
    status: open
  - id: 'TASK-250-CR3-3'
    severity: low
    file: 'shared/resources/tests/security-probe.test.mjs'
    finding: 'The calibration row described as "division is not a regex" (line 8348) passes only because nothing on its line closes the phantom regex, so it cannot detect TASK-250-CR3-1.'
    suggested_action: 'Put a second division and a REPO_ROOT write on the same line, and assert the call is found and not masked.'
    suggested_owner: dev
    status: open

