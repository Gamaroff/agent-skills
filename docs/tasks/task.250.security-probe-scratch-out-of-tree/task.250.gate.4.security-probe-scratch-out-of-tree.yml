    severity: medium
    file: 'shared/resources/tests/security-probe.test.mjs'
    finding: 'After postfix ++/-- (last token "+"/"-", both in OPENS), or after a keyword-named property such as a.of, a "/" is read as a regex start. If a later "/" on the line closes it, the comma between arguments 0 and 1 is blanked. For cpSync, copyFileSync and symlinkSync with three arguments, argument 2 is then read as the write path. The call name stays visible, so masked is empty, and the call parses, so unparsed is empty. Reproduced: `cpSync(i++ / 2, join(REPO_ROOT, "d") / 1, opts);` gives found [], total 1, unparsed [], masked []. Not present in the file today.'
    suggested_action: 'Treat postfix ++/-- and a word after "." as operands. Close the class: mark a call unparsed when a regex literal blanked inside its argument list contains a comma or bracket. Add calibration rows for both causes.'
    suggested_owner: dev
    status: open

