status_reason: 'Cycle 1''s fixes hold: each was re-checked and the suite passes 277/277. The refute pass found the in-tree write guard can still be blinded: a comment containing a quote inside an argument list makes the call vanish from the scan (CR2-1, reproduced), and so does a backtick or /* inside a regex literal (CR2-2, reproduced).'
reviewer: 'QA Engineer'
