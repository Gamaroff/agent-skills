top_issues:
  - id: 'TASK-250-CR2-1'
    severity: medium
    file: 'shared/resources/tests/security-probe.test.mjs'
    finding: 'The guard reads the source with two parsers. Calls are matched on the t250CodeOnly view, but t250Args splits arguments on the raw source and does not know about comments. A comment containing a quote inside an argument list makes t250Args return null, and line 8157 (`if (!args) continue;`) silently skips the call: it is neither counted nor flagged. Reproduced in memory: mkdirSync(join(REPO_ROOT, "x") // it''s ⏎ , {…}) gives total 0, found [].'
    suggested_action: 'Split arguments on the code-only view, using the same indices to slice the target from the raw source, and fail the guard on any matched call whose arguments cannot be parsed.'
    suggested_owner: dev
    status: open
  - id: 'TASK-250-CR2-2'
    severity: low
    file: 'shared/resources/tests/security-probe.test.mjs'
    finding: 't250CodeOnly does not recognise regex literals. A backtick, or /*, inside a regex blanks the code after it up to the next backtick or */, hiding real REPO_ROOT writes (both reproduced in memory: total 0). The comment at line 8082 says otherwise. The total >= 150 floor is far below the 244 calls present, so a large silent drop would still pass.'
    suggested_action: 'Skip regex literals in t250CodeOnly, or pin the floor to the exact call count, so any drop fails the guard; correct the comment either way.'
    suggested_owner: dev
    status: open

