top_issues:
  - id: 'CR3-1'
    severity: medium
    file: 'docs/reference/troubleshooting.md'
    finding: 'The no-code-moved row (:252) says to commit an untracked fix and re-invoke. On no-code-moved the orchestrator restores the lock at Step 7 and runs /finalise straight away (resume contract :206-208). By then a re-invoke offers no "Re-enter QA at 5a", so a fix committed then is never gated.'
    suggested_action: 'State that the run continues to Step 7 by itself. If the refusal names an untracked file that belongs to the fix, stop the run before /finalise accepts, commit the file, and run a QA cycle on it, because a plain re-invoke will not re-enter QA.'
    suggested_owner: dev
    status: open
