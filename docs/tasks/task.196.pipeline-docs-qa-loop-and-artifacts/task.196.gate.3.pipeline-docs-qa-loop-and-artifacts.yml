    finding: 'The route 2c row (:201) and the S6half labels (develop-task/README.md:131, develop-story/README.md:138) omit the cycle floor. The engine declines below cycle 3 (qa-diminishing-returns.js:618-624).'
    suggested_action: 'Add "cycle 3 or later" to the row and to both labels.'
