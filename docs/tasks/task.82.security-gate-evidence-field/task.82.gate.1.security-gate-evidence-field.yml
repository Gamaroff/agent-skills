nfr_validation:
  security:
    status: PASS
    evidence: measured
    probes_executed: 15
    notes: 'The change set IS a security-adjacent boundary — the re-review trigger that decides whether a security surface is re-examined unscoped. It was probed by execution, not by reading: 10 adversarial gate fixtures run against the real extracted probe (hijacked first status slot, a later axis leaking its evidence key, quoted and comment-suffixed values, missing key, absent security block, legacy PASS and FAIL gates) plus 5 mutations, each reverting a specific behaviour and each confirmed to redden. Two real defects were found this way and both are now pinned. What this verdict does NOT cover: the probe was executed under bash only on this host; zsh was not exercised.'
  performance:
    status: PASS
    notes: 'The probe reads the gate once instead of piping awk into grep — one process fewer. Suite runtime 0.28s → 0.42s for 21 more tests.'
  reliability:
    status: PASS
    notes: 'The guard and </dev/null are preserved and still asserted. The fail-open half is deliberate and documented in three places; the fail-closed half is unchanged. A missing security block remains a non-trigger, asserted.'
  maintainability:
    status: CONCERNS
    notes: 'The probe grew from 5 lines to ~25 and now carries three separate "do not do this" constraints (no whole-record variable, no apostrophes, no GNU-only escapes), each held by its own test. That is the right structure, but the snippet is now near the limit of what should live as copied prose in two skill files. If a fourth constraint appears, extract it to a script.'

