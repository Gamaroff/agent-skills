top_issues:
  - id: 'TASK82-001'
    severity: high
    file: 'shared/resources/qa-re-review-scope.md'
    finding: 'The rewritten clause-1 awk program referenced the whole-record variable 8 times. This snippet ships as prose an agent copies and runs, and a harness that loads a SKILL.md with arguments substitutes that token with the invocation argument — observed live: qa-task/SKILL.md rendered as match(docs/tasks/task.82.../task.82....md, /^[[:space:]]*/). The block bounding then reads garbage, silently. The probe this replaced used the token zero times.'
    suggested_action: 'Use awk implicit forms only — bare /regex/, argument-less length, two-argument sub(). Pin with a test that greps the extracted program.'
    suggested_owner: dev
    status: closed
    fixed_date: '2026-09-09'
  - id: 'TASK82-002'
    severity: medium
    file: 'shared/resources/qa-re-review-scope.md'
    finding: 'The comment added to fix TASK82-001 contained an apostrophe ("AWK''S"). The awk program is single-quoted by its caller, so one apostrophe — including inside a comment — closes the quote early. 18 of 52 tests went red at once.'
    suggested_action: 'Remove the apostrophe; pin with a test asserting the extracted program contains none.'
    suggested_owner: dev
    status: closed
    fixed_date: '2026-09-09'

