    finding: 'A helper call in a block that sets BASH_ENV (inline or exported) classifies runnable; bash sources the unclassified file first. Reproduced: UNVETTED-RAN printed; develop refuses the same block. Exported SHELLOPTS+PS4 reaches the same through xtrace.'
    suggested_action: 'Refuse helper recognition when the block or a sourced helper sets/exports/prefixes BASH_ENV, ENV, SHELLOPTS, BASHOPTS or PS4; control test per shape.'
    suggested_owner: dev
    bug_ref: 'task.191.bug.1.helper-call-runs-the-file-bash-env-names.md'
  - id: 'CR-1'
    severity: high
    file: 'shared/resources/qa-execute-snippets.mjs'
    finding: 'Arguments to a sourced-helper function are never scanned: source newest-numbered.sh; newest_numbered docs dod -delete classifies runnable and runs find -delete.'
    suggested_action: 'Refuse a call to a sourced function that forwards positional parameters to an argument-sensitive command, or scan its arguments with that command''s deny rules; control test.'
    suggested_owner: dev
    bug_ref: 'task.191.bug.2.sourced-function-arguments-never-scanned.md'
  - id: 'CR-2'
    severity: high
    file: 'skills/qa-task/SKILL.md'
    finding: 'Step 4b / Phase 1.7 pass origin/<base> as --diff-base; git diff <rev> -- file is two-dot against the working tree, so develop''s later edits count as the PR''s changed blocks (qa-story/SKILL.md has the same line).'
    suggested_action: 'Pass $(git merge-base "$BASE" HEAD) in both callers and in §4a; extend the parity test.'
    suggested_owner: dev
    bug_ref: 'task.191.bug.3.diff-base-tip-is-two-dot-against-the-working-tree.md'
  - id: 'CR-3'
    severity: medium
    file: 'shared/resources/qa-execute-snippets.mjs'
    finding: 'Every name a sourced helper might define is trusted anywhere in the block: if false; then mv() {…}; fi makes mv a b runnable, before or after the source line.'
    suggested_action: 'Trust only top-level unconditional definitions, never a non-safe or runner name, and only after the source line; control tests.'
    suggested_owner: dev
    bug_ref: 'task.191.bug.4.sourced-helper-names-trusted-conditionally-and-out-of-order.md'
  - id: 'CR-4'
    severity: medium
    file: 'shared/resources/qa-execute-snippets.mjs'
    finding: 'changedLineRanges honours user git config: with color.diff=always parseDiffRanges returns [] for a 4-hunk diff, so the run reports no changed blocks and no finding.'
    suggested_action: 'git diff --no-color --no-ext-diff --no-textconv -U0; a non-empty diff with zero parsed hunks is bad-diff-base; test with -c color.diff=always.'
    suggested_owner: dev
    bug_ref: 'task.191.bug.5.git-diff-honours-user-config-and-reads-empty.md'
  - id: 'QA-2'
    severity: medium
    file: 'shared/resources/qa-execute-snippets.mjs'
    finding: 'The widened boundary (classifyBlock) returns {klass, reason}, which no probe-engine entry form can score, so the shell-exec corpus written for this classifier cannot be run against it.'
    suggested_action: 'Export a boolean predicate (isRunnableBlock) and record a probe run with --args-json carrying a helper root.'
    suggested_owner: dev
    bug_ref: 'task.191.bug.6.classifier-verdict-not-probeable.md'

