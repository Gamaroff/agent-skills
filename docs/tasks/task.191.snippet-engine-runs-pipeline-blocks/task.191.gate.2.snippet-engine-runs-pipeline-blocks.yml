recommendations:
  immediate:
    - action: 'Fix CR2-1..CR2-5. Before patching, consider the structural move (qa-fix Step 2.6, obs #276): the helper rule is a deny-list over a parser''s input. An allow-list of accepted helper-call shapes would refuse everything else. Every word in a block with a helper call must be a plain literal (no quote, backslash or expansion). A helper call takes no arguments, or only literal non-dash words. Such a block may contain no export/declare/set/PATH assignment and no export -f. Helper text may not hold a multi-line substitution.'
      refs: ['shared/resources/qa-execute-snippets.mjs']
  future:
    - action: 'CR2-6 (medium confidence): shadowsCommand reads the host PATH, but a block that assigns PATH can make an untrusted name resolve to a file in the copy; distrust defined names in a block that assigns PATH or runs hash.'
      refs: ['shared/resources/qa-execute-snippets.mjs']
    - action: 'CR2-7 (medium confidence, partly pre-existing): run each block in its own process group and kill the group on timeout.'
      refs: ['shared/resources/qa-execute-snippets.mjs']
    - action: 'CR2-8 (low): store the closing-fence line on the block rather than deriving it from the code''s line count (an empty fence spans one extra line).'
      refs: ['shared/resources/qa-execute-snippets.mjs']
    - action: 'Mutation spot check: removing --no-textconv reds no test (no-red-untested); the helper''s own forwardsTo seeding is absorbed by its fallback (absorbed).'
      refs: ['shared/resources/tests/qa-execute-snippets.test.mjs']
