top_issues:
  - id: 'T257-CR-1'
    severity: medium
    file: 'shared/resources/finalise-fix-and-recheck.mjs'
    finding: 'isPlainRelativePath checks the raw string but matchesAnyGlob normalises it (trim, backslash to slash, leading ./ and /), so the traversal and leading-slash guard is bypassed: touched skills\a\..\..\..\etc\passwd against skills/** is admitted, as are a leading-space or trailing-tab path (reproduced by the reviewer).'
    suggested_action: 'Run the guard on the string the matcher sees (normalisePath), or reject backslashes, leading or trailing whitespace and any non-canonical form; add `.` and empty segments to the rejected set (CR-5).'
    suggested_owner: dev
    status: open
  - id: 'T257-CR-2'
    severity: medium
    file: 'shared/resources/finalise-fix-and-recheck.mjs'
    finding: 'The `\s#\s` boundary in subjectNames admits TAP directives, so `not ok 1 - foo # TODO known` and `# SKIP` (an expected failure and a skipped test, neither a real red) satisfy mutation-proved for test foo (reproduced). The `:\d` boundary also applies to every test, not only the docs-link clause (CR-3, medium confidence).'
    suggested_action: 'Reject a red line whose directive is TODO or SKIP; allow the `:<digits>` boundary only for the docs-link `.md` proof.'
    suggested_owner: dev
    status: open
  - id: 'T257-BOUNDARY-1'
    severity: medium
    file: 'shared/resources/finalise-fix-and-recheck.mjs'
    finding: 'The change set delivers a boundary (the Files Summary scope predicate: path in, admit or refuse out; the criteria say "refused"), but the predicate is a closure inside evaluateFixAndRecheck, so the probe engine cannot reach it and probes_executed is 0. CR-1 is the kind of defect a probe finds.'
    suggested_action: 'Export a pure `pathInScope(path, filesSummary)` that evaluateFixAndRecheck calls, then probe it with security-probe.mjs (JS form, --args-json for filesSummary) and record the run.'
    suggested_owner: dev
    status: open

