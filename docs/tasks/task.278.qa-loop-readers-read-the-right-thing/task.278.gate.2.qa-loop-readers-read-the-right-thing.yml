  - id: 'T278-QA-2'
    severity: medium
    file: 'shared/resources/tests/accept-qa-residual.test.mjs'
    finding: 'Success criterion 3 says every other consumer passes its existing fixtures unchanged, but one pinned expectation changed (the nested-map case moved from the refuses list to the edits list). Cycle 1 recorded the deviation in the task Notes and the report; no approver has accepted it, so the criterion is still unmet as written.'
    suggested_action: 'Escalate for an approver (approved by <name>) on the recorded deviation. Do not reword the criterion and do not revert the test: the old expectation encoded the defect.'
    suggested_owner: po
    status: open
  - id: 'T278-QA-5'
    severity: medium
    file: 'shared/resources/ci-tree-equivalence.js'
    finding: 'fixPathTarget compares the normalised fix_path directory with workItemDir, which it never normalises. fixPathTarget("docs/tasks/t/a.md", "./docs/tasks/t"), "docs/tasks//t" and "docs/tasks/t/" all return null while "docs/tasks/t" returns the file (reproduced by QA). A legitimate fix_path is then silently dropped and the finding classifies on ref, the behaviour this feature replaces. The corpus and test only pass the canonical directory. Origin: code-review CR-2, reproduced by QA.'
    suggested_action: 'Normalise workItemDir with path.posix.normalize (and strip a trailing slash) inside fixPathTarget; add legitimate corpus cases with a ./-prefixed, a doubled-slash and a trailing-slash directory, and a unit assertion for each.'
    suggested_owner: dev
    status: open
  - id: 'T278-QA-6'
    severity: medium
    file: 'shared/resources/qa-diminishing-returns.js'
    finding: 'foldTestFilesIntoSubjects cuts a test stem back at every dash with no floor, so src/tests/user-service.test.ts folds onto src/user.ts. With globs [src/tests/**] and MEDIUMs on those two files QA got narrowing-residue ("every MEDIUM names src/user.ts") where the files are different subjects; the same pair with no globs reads medium-files-differ. The result is a false structural-move offer (advisory, never a route). Origin: code-review CR-1, reproduced by QA.'
    suggested_action: 'Fold only on the exact stem, or on a cut the fixtures document as a boundary (the motivating pair is open-coverage-differential onto open-coverage). Add a pair that must stay two subjects (a dash-prefix test stem sharing only a prefix with an unrelated production file) beside the pair that must fold.'
    suggested_owner: dev
    status: open

