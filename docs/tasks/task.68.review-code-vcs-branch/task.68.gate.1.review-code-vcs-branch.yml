status_reason: "The fix itself is correct, complete and well guarded — branch key, both platform arms, the rule statement and the dead pointer are all mutation-proved, and the sweep is thorough. One MEDIUM defect in the new test file: two tests read sibling skills, so the suite fails with ENOENT (2 of 12) wherever the skill ships without them, which packaging does allow."
reviewer: "QA Engineer"
updated: "2026-09-01T18:15:00Z"

top_issues:
  - id: "TASK68-001"
    severity: medium
    file: "skills/review-code/tests/review-code.test.js"
    finding: "Two tests read files outside the skill directory — `../review-pr/SKILL.md` and `../finalise/SKILL.md`. `package_skill.py` walks the whole skill dir and its EXCLUDE_DIRS is only {__pycache__, .git, node_modules, .DS_Store}, so `tests/` ships in the distributed zip. Run outside this repo the suite throws ENOENT and fails 2 of 12 — reproduced by copying SKILL.md + tests/ alone into a temp dir. The sibling this file was modelled on (review-pr/tests/review-pr.test.js) reads only within its own ROOT, so this is a new portability pattern, not an existing one."
    suggested_action: "Keep both cross-skill assertions — the drift guard is the point — but make them degrade instead of crash: read the sibling inside a try/catch (or check fs.existsSync) and skip via `t.skip()` when the file is absent, so the guard is enforced in this repo and inert in a standalone install."
    suggested_owner: dev
    status: open

