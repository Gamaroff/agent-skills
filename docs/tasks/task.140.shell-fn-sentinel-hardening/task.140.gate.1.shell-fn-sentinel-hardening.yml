    bug_ref: 'task.140.bug.1.library-trap-plus-errexit-scored.md'
  - id: 'CR-2'
    severity: medium
    file: 'shared/resources/security-probe.mjs'
    finding: 'The --fake-gh containment is still lexical while entry containment is now real-path, and its comment says they are the same; a symlinked fake-gh dir pointing outside the root is accepted and recorded (TASK-140-BUG-2; behaviour identical at base, attributed because the diff broke the stated invariant).'
    suggested_action: 'realpathSafe both sides at the fake-gh check, realpath root inside namesGh (CR-6), and add a symlinked fake-gh row expecting bad-fake-gh.'
    suggested_owner: dev
    bug_ref: 'task.140.bug.2.fake-gh-containment-still-lexical.md'
  - id: 'CR-3'
    severity: low
    file: 'shared/resources/security-probe.mjs'
    finding: 'The detector misses a quoted or backslashed gh ("gh" api, a single-quoted gh, \gh) because quote and backslash are not in the prefix class, and the new SOURCE_LINE follows only a line-initial source, not [ -f x ] && source x or set -e; source x.'
    suggested_action: 'Add the quote and backslash characters to the GH_COMMAND_WORD prefix class and let SOURCE_LINE match after &&, || or ;, with a row per shape.'
    suggested_owner: dev

