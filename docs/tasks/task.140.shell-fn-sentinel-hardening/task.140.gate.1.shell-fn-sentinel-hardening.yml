    file: 'shared/resources/security-probe.mjs'
    finding: 'Shadowing exit does not cover errexit: a library that installs its own trap … EXIT and then fails a top-level command under set -e ends the harness with 1 and is scored absent; for f(){…}; trap true EXIT; set -e; false this regressed 97 → 1 on bash 5.3 and zsh 5.9 (TASK-140-BUG-1).'
    suggested_action: 'Shadow trap for the duration of the source so EXIT/0 installations cannot displace the harness trap; unset -f trap before the harness trap - EXIT; add rows for both orderings.'
