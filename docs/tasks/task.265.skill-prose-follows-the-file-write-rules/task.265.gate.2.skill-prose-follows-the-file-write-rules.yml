top_issues:
  - id: 'T265-QA-6'
    severity: medium
    file: 'shared/resources/file-write-rules.md'
    finding: 'Recipe step 4 says git diff --stat -- <file> must print nothing after the line is edited back. That is false when the file holds an uncommitted fix (the normal case in qa-fix and after a fix cycle) and contradicts mutation-proving.md rule 1 (restore from the cp snapshot, version control only knows committed state). Following it fails a correct restore or invites git checkout, which deletes the fix. The same assertion is restated at mutation-proving.md:56 and skills/qa-task/SKILL.md:851. Reviewer CR-1 (medium confidence); QA verified the contradiction by reading both texts.'
    suggested_action: 'Verify the restore by comparing the file with the step-1 snapshot (cmp or diff prints nothing), keep git diff --stat only for a file with no uncommitted change, and make file-write-rules.md, mutation-proving.md and qa-task SKILL.md say the same.'
    suggested_owner: dev
    status: open
  - id: 'T265-QA-7'
    severity: medium
    file: 'shared/resources/tests/payload-heredoc-ratchet.test.mjs'
    finding: 'PAYLOAD_HEREDOC needs the delimiter directly after the operator. QA ran it: cat > f << EOF, cat > f << "EOF" and cat > f <<\EOF all return false, so a payload heredoc written with a space is not counted and the ratchet passes it. The unbounded scan after cat/tee is quadratic: 80,000 characters of repeated cat took 1.7 s. Reviewer CR-2 (low severity, medium confidence); QA reproduced both.'
    suggested_action: 'Allow optional whitespace and a backslash after the operator, bound the scan to a fixed width, add calibration cases for the spaced and backslash forms, and re-check the allowlist count.'
    suggested_owner: dev
    status: open

