    notes: "Improved this cycle. The header comment now explains why the value parsing must mirror and not just the order, and explicitly warns against 'correcting' the .env probe by deleting it — the exact wrong move a reasonable person would otherwise make. The CHANGELOG no longer claims more than the code delivers."

