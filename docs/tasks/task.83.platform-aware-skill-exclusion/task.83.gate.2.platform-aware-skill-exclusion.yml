task: "task.83.platform-aware-skill-exclusion"
task_title: "Platform-aware skill exclusion in setup-consumer.sh"
gate: CONCERNS
status_reason: "Both cycle-1 findings are closed and verified by re-running the differential and the end-to-end repro that found them. The refute pass found one new MEDIUM in cycle 1's own test helper — an incomplete environment scrub that lets an ambient SKILLS_CONFIG_FILE flip the parity guard protecting the HIGH fix."
reviewer: "QA Engineer"
updated: "2026-09-04T21:05:00Z"

top_issues:
  - id: "RF-001"
    severity: medium
    file: "shared/resources/tests/setup-consumer-skill-exclusion.test.mjs"
    finding: "The new runtimeTracker() helper deletes JIRA_URL and TRACKER from the test environment but not SKILLS_CONFIG_FILE, which resolve-platform.sh honours as an explicit override of which config file to read. An ambient value redirects all ten parity cases away from their fixture — demonstrated with a decoy file: fixture says jira, decoy says github, runtime=github while install=jira, so every parity case fails against correct code. callFn()'s own comment names this exact hazard ('so an ambient one in the developer's shell cannot silently flip a resolver assertion'); the new helper copied the list without extending it."
    suggested_action: "Add `delete clean.SKILLS_CONFIG_FILE` to runtimeTracker() and, for symmetry, to callFn(). Add a regression test that exports a decoy SKILLS_CONFIG_FILE pointing at a config with the opposite tracker and asserts the fixture still wins."
    suggested_owner: dev
    status: open
    bug_ref: "task.83.bug.3.test-env-scrub-incomplete.md"

  # Cycle 1 issues, closed this cycle — retained so the gate carries the history.
  - id: "CR-001"
    severity: high
    file: "scripts/setup-consumer.sh"
    finding: "Quoted and CRLF `tracker:` values resolved github at install and jira at runtime, pruning all 11 Jira skills from a Jira repo."
    suggested_action: "Normalise the token before the case; widen the awk pattern past [a-z]."
    suggested_owner: dev
    status: closed
    fixed_date: "2026-09-04"
  - id: "CR-002"
    severity: medium
    file: "scripts/setup-consumer.sh"
    finding: "The installer probes .env for JIRA_URL; resolve-platform.sh reads only the environment."
    suggested_action: "Keep the probe, correct the over-claiming comment and CHANGELOG, pin the asymmetry with a test."
    suggested_owner: dev
    status: closed
    fixed_date: "2026-09-04"

