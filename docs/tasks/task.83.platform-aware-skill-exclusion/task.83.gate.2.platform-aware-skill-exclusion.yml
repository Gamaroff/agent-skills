    notes: "The headline mode is closed and the guard is a parity assertion against the real resolver, so the two implementations cannot drift together and still pass. Two residuals keep this off PASS: the documented .env divergence for a config-less repo whose JIRA_URL is never exported (tested and argued, but its proper close — teaching resolve-platform.sh to read .env — is un-filed), and RF-001, by which the guard for all of this can be flipped by an ambient environment variable."
