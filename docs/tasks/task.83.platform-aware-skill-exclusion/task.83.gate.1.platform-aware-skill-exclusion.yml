nfr_validation:
  security:
    status: PASS
    notes: "No new network calls or credential handling. The resolver reads two local files and one env var; the .env read is a presence-only grep that never captures the value. grep -qxF (whole-line, fixed-string) means a skill name cannot be interpreted as a pattern — tested in both directions. The filter can only reduce what reaches disk."
  performance:
    status: PASS
    notes: "Two fixed-string greps per skill over lists of 11 and 6 lines; entirely local. Tarball still downloaded once as a whole archive, and --dry-run still returns before any network call."
  reliability:
    status: CONCERNS
    notes: "The grandfather rule is the centrepiece and it holds under two independent mutations — an existing install loses nothing on either tracker, directories are left untouched rather than replaced. --all-skills is a working escape hatch reachable from --help. The concern is CR-001/CR-002: a fresh install can silently receive the wrong skill set for a legal config, with no error at install and no error until a pipeline step reaches for a skill that is not there — the one direction grandfathering cannot cover."
  maintainability:
    status: PASS
    notes: "The hand-maintained classification lists are the obvious rot risk and are guarded: the drift test fails CI until a new tracker skill is classified (mutation-proven), and a second test keeps the test's mirrors and the script's constants from drifting apart. Comments explain why the ordering is what it is. set -e interactions ((( x++ )) || true, && assignment lists) verified correct."

recommendations:
  immediate:
    - action: "Normalise quotes and CR in _resolve_install_tracker so a quoted or CRLF tracker: resolves as it does at runtime; add the three shapes to the resolver tests (CR-001)."
      refs: ["scripts/setup-consumer.sh"]
    - action: "Reconcile the .env probe with resolve-platform.sh, which does not read .env; pin the chosen direction with a test (CR-002)."
      refs: ["scripts/setup-consumer.sh"]
  future:
    - action: "Refuse an unrecognised tracker: scalar at install time rather than silently defaulting to github, matching the runtime resolver's halt (CR-003, advisory)."
      refs: ["scripts/setup-consumer.sh"]
    - action: "Run shellcheck scripts/setup-consumer.sh on a host or CI lane that has it, and tick the outstanding Code Quality criterion."
      refs: ["scripts/setup-consumer.sh"]

