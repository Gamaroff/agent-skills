schema: 1
task: "task.83.platform-aware-skill-exclusion"
task_title: "Platform-aware skill exclusion in setup-consumer.sh"
gate: FAIL
status_reason: "All four phases delivered and the full suite is green, but the install-time tracker resolver re-derives the config parse instead of mirroring resolve-platform.sh — quoted and CRLF `tracker:` values resolve to the wrong platform and invert the filter, pruning every Jira skill from a Jira repo."
reviewer: "QA Engineer"
updated: "2026-09-04T19:55:00Z"

top_issues:
  - id: "CR-001"
    severity: high
    file: "scripts/setup-consumer.sh"
    finding: "_resolve_install_tracker extracts the config value with awk '{print $2}', which strips neither surrounding quotes nor a trailing CR. `tracker: \"jira\"`, `tracker: 'jira'` and a CRLF `tracker: jira` all miss the case arm and resolve to the `github` default, while resolve-platform.sh resolves all three to `jira` — so a Jira repo silently installs without any of its 11 Jira skills. Reproduced end-to-end against a fixture tarball."
    suggested_action: "Normalise the token before the case: strip a trailing $'\\r' and a surrounding single/double quote pair. Extend the resolution-order tests with the quoted and CRLF shapes, ideally as a table asserting installer and runtime agree."
    suggested_owner: dev
    status: open
  - id: "CR-002"
    severity: medium
    file: "scripts/setup-consumer.sh"
    finding: "The installer probes .env for JIRA_URL (setup-consumer.sh:819-820); resolve-platform.sh reads only the environment and never opens .env. A repo with no `tracker:` key and JIRA_URL in .env only resolves jira at install and github at runtime, pruning the 6 GitHub-only skills from a repo that resolves github."
    suggested_action: "Make the two agree — drop the .env probe, or keep it and correct the 'MIRRORS … cannot disagree' comment to state the asymmetry deliberately. Pin the chosen direction with a resolver-differential test."
    suggested_owner: dev
    status: open

waiver:
  active: false

quality_score: 70

evidence:
