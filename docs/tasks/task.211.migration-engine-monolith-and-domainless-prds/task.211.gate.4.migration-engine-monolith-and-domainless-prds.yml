top_issues:
  - id: CR-1
    severity: medium
    file: 'shared/resources/migrate-doc-numbering.mjs'
    finding: 'The non-literal loop skips a file whose lower-cased extension is a literal-pass type, but the literal loop selects by exact case, so notes/README.MD or .github/workflows/ci.YML holding ../docs/prd.md is read by neither and --apply answers ok; at 02d65ff4 both were stale-reference (reproduced). A regression from cycle 3.'
    suggested_action: 'Decide the extension the same way in both loops, through one helper, so every tracked file falls into exactly one; add an upper-case-extension case.'
    suggested_owner: dev
  - id: CR-2
    severity: low
    file: 'shared/resources/migrate-doc-numbering.mjs'
    finding: 'YAML_KEY accepts only bare word keys, so a real displaced block keyed "Last updated: 2024" or "\"title\": x" is now none and the migration stacks a second block over it; at 02d65ff4 it was displaced-frontmatter (reproduced). A regression from cycle 3.'
    suggested_action: 'Accept any key: line whose key is not a Markdown heading or list item, quoted, spaced and dotted keys included; add the shapes to the CR-4 row.'
    suggested_owner: dev
  - id: CR-3
    severity: low
    file: 'shared/resources/migrate-doc-numbering.mjs'
    finding: 'A variable quoted on its own (cat "$ROOT"/docs/prd.md) leaves a quote before the leading /, so the path is skipped as absolute and --apply answers ok over it (reproduced).'
    suggested_action: 'When a closing quote precedes the leading /, look back past the quoted span for $VAR, ${...} or $(...); add both spellings to the must-flag list.'
    suggested_owner: dev
  - id: CR-4
    severity: low
    file: 'shared/resources/migrate-doc-numbering.mjs'
    finding: 'Every dropped variable is read as the repository root or the file directory, so cp $HOME/docs/prd.md /tmp in a script is refused as stale-reference, a correct path with no remedy, while ~/docs/prd.md is not flagged (reproduced).'
    suggested_action: 'Treat well-known non-repository variables (HOME, TMPDIR, XDG_*, USERPROFILE) like ~ and add them to the must-not-flag list.'
    suggested_owner: dev

