status_reason: 'All phases delivered and every test green, but three medium defects reproduce: a BOM or a leading blank line gets a second frontmatter block, a relative non-link mention of the moved monolith is left stale while the run reports ok, and the new --name domain path boundary has no probeable entry. Each shape was refused by the deleted guard, so each is new to this change.'
