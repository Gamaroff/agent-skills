top_issues:
  - id: CR-1
    severity: medium
    file: 'shared/resources/migrate-doc-numbering.mjs'
    finding: 'frontmatterState classes a file whose fence follows a BOM or a leading blank line as "none", so editFrontmatter prepends a second block in front of the real one and --apply reports ok (reproduced: "﻿---\nname: prd.onb..." and "\n---\nname: prd.onb..." both migrate to two stacked blocks).'
    suggested_action: 'Treat a leading BOM as part of line 0 (or strip it before the fence test), and return a distinct state for a fence that appears after leading blank lines, raised as a blocker, so a block is created only for a file that truly has none.'
    suggested_owner: dev
  - id: QA-1
    severity: medium
    file: 'shared/resources/migrate-doc-numbering.mjs'
    finding: 'The prefilter admits a file that names an outside move source by a self-relative path, but only the link pass acts on it: a relative mention outside a link (scripts/x.js holding "../docs/prd.md", docs/guide/x.md holding `../prd.md`) is left stale while --apply answers ok. Re-pointed and left-stale reach the same result. Reviewer CR-2 (medium/medium), reproduced by QA.'
    suggested_action: 'After the link and literal passes, re-scan each file the prefilter admitted for a repo-relative or self-relative path to an outside move source and report each residual as a blocker (link-would-break or a new code) rather than passing silently.'
    suggested_owner: dev
  - id: QA-2
    severity: medium
    file: 'shared/resources/migrate-doc-numbering.mjs'
    finding: 'The --name <domain>/<slug> value is a caller-supplied path segment (P.join(root, domain, newStem)) whose only validation is an inline docId.format call in plan(); no exported predicate reaches it, so the boundary probe ran 0 cases and finalise''s zero-guard will fail the same record.'
    suggested_action: 'Extract the shape-and-validity check into one exported function (for example parseNameValue(value) returning {slug, domain} or a refusal) used by parseArgs and plan, and probe it with security-probe.mjs --sink path.'
    suggested_owner: dev
  - id: CR-3
    severity: low
    file: 'shared/resources/migrate-doc-numbering.mjs'
    finding: 'A named domain is honoured for an already-numbered PRD, so --name docs/prd/prd.1.x/prd.1.x.md=main/x moves it while its registry row keeps Folder "." and the post-check answers ok (reproduced).'
    suggested_action: 'Apply namedDomain only to a legacy PRD; for a numbered one, ignore it or raise a blocker.'
    suggested_owner: dev

