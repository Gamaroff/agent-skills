top_issues:
  - id: CR-1
    severity: medium
    file: 'shared/resources/migrate-doc-numbering.mjs'
    finding: 'outsideReferences skips any token that starts with "/", so a path built from a variable (`${ROOT}/docs/prd.md` in a .mjs, `$ROOT/docs/prd.md` in a .sh) is dropped as absolute: it is neither rewritten nor flagged and --apply answers ok (reproduced). For the .mjs case this is a regression: the substring test before 02d65ff4 blocked it with stale-reference.'
    suggested_action: 'Treat a token as absolute only when its "/" opens the text or follows whitespace, a quote, "(" or "="; resolve a "/" that follows "}", ")" or a $VAR against the repository root. Add both forms to the must-flag list.'
    suggested_owner: dev
  - id: CR-2
    severity: medium
    file: 'shared/resources/migrate-doc-numbering.mjs'
    finding: 'The non-literal loop skips every file in candidates, but candidates also holds non-literal files under the PRD root, which the main loop skips by extension; docs/prd/tools/cfg.json naming docs/prd.md is read by neither loop and the plan answers ok (reproduced).'
    suggested_action: 'Skip in the non-literal loop only the files the main loop actually scanned, so every in-scope tracked text file is read exactly once.'
    suggested_owner: dev
  - id: CR-3
    severity: low
    file: 'shared/resources/migrate-doc-numbering.mjs'
    finding: 'The main loop exempts frozen example copies from stale-reference, the non-literal loop does not: examples/demo/package.json naming docs/prd.md blocks the run and asks for a hand edit of a frozen copy, while examples/demo/README.md with the same text passes (reproduced).'
    suggested_action: 'Apply the isExampleCopy exemption in both loops, ideally through one shared predicate.'
    suggested_owner: dev
  - id: CR-4
    severity: low
    file: 'shared/resources/migrate-doc-numbering.mjs'
    finding: 'A body that opens with a blank line and a thematic break and has a second thematic break later ("\n---\n# Onb\n\nIntro\n\n---\n## Goals") is still displaced, so the cycle-2 CR-5 fix holds only for a document with one break; the advised remedy would make its body a bogus frontmatter block (reproduced).'
    suggested_action: 'Call a late fence displaced only when the lines up to the closing fence read as YAML (every non-blank line key-shaped); add the two-break case to the CR-5 row.'
    suggested_owner: dev
  - id: CR-5
    severity: low
    file: 'shared/resources/migrate-doc-numbering.mjs'
    finding: 'When an outside source exists, the non-literal loop reads every tracked non-literal file in full, images and archives included, before the NUL check discards a binary.'
    suggested_action: 'Skip known binary extensions or files above a size cap before the full read.'
    suggested_owner: dev

