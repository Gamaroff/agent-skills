  - id: "TASK-75-001"
    severity: medium
    file: "shared/resources/develop-pipeline-step-5-6-qa-loop.md"
    finding: "Fast-gate block numbered 0a. but placed before step 0."
    suggested_action: "Reorder to 0 -> 0a -> 1."
    suggested_owner: dev
    status: closed
    fixed_date: "2026-09-01"

  - id: "TASK-75-002"
    severity: medium
    file: "evals/shared/tests/ci-gate-parity.test.mjs"
    finding: "`workflowScripts()` and `workflowInvocations()` both document themselves as covering 'the workflow's `test` job', but they scan EVERY `run:` line in test.yml. The file happens to define one job today, so the two coincide by accident. Add a second job — a lint lane, a coverage lane, a matrix build — that invokes any npm script, and the parity assertion demands the `ci` composite contain that script too. The test then fails on a workflow CI itself is perfectly happy with, which inverts its whole purpose: it exists to predict CI, and here it would block a merge CI would pass."
    suggested_action: "Scope the scan to the steps of the `test` job specifically (parse from `jobs:` -> `test:` until the next same-indent job key), or rename the functions to say they cover the whole file and assert test.yml defines exactly one job so the assumption fails loudly instead of silently."
    suggested_owner: dev
    status: open

  - id: "TASK-75-003"
    severity: low
    file: "shared/resources/develop-pipeline-step-5-6-qa-loop.md"
    finding: "Step 0a says a red fast gate should neither commit nor HALT, but 'feed the finding back into this cycle's fixes, and re-run', and claims 'The MAX_ITER cap still bounds the loop'. MAX_ITER bounds QA *cycles*; this inner re-run happens inside a single cycle and increments no counter, so the bound named does not actually apply to it. In practice the agent surfaces an unfixable gate, but the sentence asserts a guarantee the machinery does not provide."
    suggested_action: "Either state honestly that the inner retry is bounded by agent judgement and the outer cycle, or give it an explicit small retry budget after which the cycle commits nothing and escalates."
    suggested_owner: dev
    status: open

