    notes: "The merge gate becomes slower by design — `eval:all` moves into it. This is the task's named and accepted trade, argued in Risk Assessment and recorded in CHANGELOG under Changed. Tiering keeps the per-iteration loop on the cheap tier, and the parity test asserts `ci:fast` is a strict subset of `ci` so the slow tier cannot silently leak into the loop."
