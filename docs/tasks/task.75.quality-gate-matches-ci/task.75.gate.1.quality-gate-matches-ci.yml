task_title: "Make the pipeline quality gate run what CI runs"
gate: CONCERNS
status_reason: "All 4 phases implemented and all success criteria verified; full `npm run ci` green at 2092/0 and the parity test mutation-proved 7x. One MEDIUM: the new fast-gate block in the qa-fix cycle is labelled `0a.` but placed *before* step `0.`, so it runs the gate before the no-change HALT it should follow."
reviewer: "QA Engineer"
updated: "2026-09-01T13:10:00Z"

top_issues:
  - id: "TASK-75-001"
    severity: medium
    file: "shared/resources/develop-pipeline-step-5-6-qa-loop.md"
    finding: "The fast-gate block is numbered `0a.` (line 506) but sits BEFORE step `0.` (line 533). `0a` reads as 'follows 0', so the label contradicts the position. Worse, the position is itself wrong: step 0 checks whether qa-fix changed anything and HALTs when it did not, so as written the cycle runs a full format+test gate before discovering there is nothing to test."
    suggested_action: "Move the fast-gate block to sit after the existing step `0.` no-change check and renumber so the sequence reads 0 -> 0a -> 1, or fold it into step 1 before the commit. The gate must still run before `/commit-changes`, which is the invariant that matters."
    suggested_owner: dev
    status: open

