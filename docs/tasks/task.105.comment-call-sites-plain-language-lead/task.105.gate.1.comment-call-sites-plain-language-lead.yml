nfr_validation:
  security:
    status: PASS
    evidence: measured
    probes_executed: 8
    notes: '8 hostile slot values executed against tracker-comment.js with a fake gh on PATH, capturing what reached the transport. 0 of 8 exploitable. Marker injection through `verdict` is impossible because verdict is MAPPED through GATE_MEANING rather than interpolated. No shell-injection surface: the engine spawns gh with argv and passes the body via --body-file, so `$(rm -rf /)` in a text slot renders literally. An unknown verdict renders "the results are recorded below" rather than unearned reassurance. Recorded not-a-finding: text slots are unsanitised by design; safe today because every call site supplies pipeline-controlled values.'
  performance:
    status: PASS
    notes: 'No runtime surface. Slots are argv on calls that already happen. The only added round-trips are the two closes that necessarily become two calls, as breaking change 5.2 documents.'
  reliability:
    status: CONCERNS
    notes: 'The seven converted sites give up the 3x exponential backoff of tracker_call_with_retry. The trade is correct — the engine owns the ACCESS_TRACKER deferral gate, so re-wrapping would double-defer — and it matches review-task, the reference implementation. It is documented at every converted site, in breaking change 5.1 and in the implementation report, and failure degrades to a logged warning rather than a silent drop. But it is a knowingly-accepted reduction in resilience on a network call. A retry that does not also defer would close it; recorded as future work.'
  maintainability:
    status: PASS
    notes: 'Reduces the ways a tracker comment can be posted from two to one, which the comment contract has claimed since task 55 and which was untrue until now. Guard B derives its expectations from stakeholder-summary.js rather than restating them, so "which slots does this stage read?" has exactly one answer in the repository.'

