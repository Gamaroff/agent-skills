top_issues:
  - id: 'T245-QA-1'
    severity: medium
    file: 'shared/resources/qa-re-review-scope.md'
    finding: 'The HALT/WARN classifier reads `git status --porcelain` lines, which C-quote a path containing a space or non-ASCII character (reproduced: ` M "d e/f g.txt"`, ` M "\303\251.txt"`). The quoted $p never equals a name from `git diff --name-only`, so a dirty changed file is classed as a warning and the review reads it as absent. Reviewer CR-1 (medium confidence). Reproduced here; regression against the old rule, which halted on all tracked dirt. The same block is in qa-task and qa-story.'
    suggested_action: 'Read the dirty list with `git status --porcelain -z` (handle the rename "new\0old" entry) or unquote the path, fix the shared source, re-bundle, and add a test with a spaced and a non-ASCII changed file (mutation-prove it).'
    suggested_owner: dev
    status: open

