top_issues:
  - id: 'T245-QA-2'
    severity: medium
    file: 'shared/resources/qa-re-review-scope.md'
    finding: 'The HALT/WARN loop reads a second `git status --porcelain -z` through process substitution whose exit status is never checked. If that call fails or returns nothing while the first call (DIRTY) was non-empty, HALTS and WARNS stay empty and the guard passes silently. Reviewer CR-1, high confidence; the reviewer anchored it at line 162, the line is 246 (location unverified). Same block in skills/qa-task/SKILL.md and skills/qa-story/SKILL.md.'
    suggested_action: 'Capture the -z output once into a temp file with its exit code checked, HALT when it fails or is empty while DIRTY is non-empty, and parse that single capture; fix the shared source, both skill copies and add a test.'
    suggested_owner: dev
    status: open
  - id: 'T245-QA-3'
    severity: medium
    file: 'skills/develop-batch/SKILL.md'
    finding: 'The develop-batch merge lane commits the `annotated` row without reading `stageReason`, unlike develop-next (which logs any reason other than staged/already-staged and does not commit). A failed staging (index lock, row-not-in-index) leaves nothing of this row to commit, and `already` with a clean index still ends in `ticked: true`. Reviewer CR-2 (medium confidence); verified by reading skills/develop-batch/SKILL.md lines 643-652 against skills/develop-next/SKILL.md lines 610-612.'
    suggested_action: 'Add the develop-next stageReason rule to the develop-batch merge lane: commit and mark ticked only when stageReason is staged or already-staged, otherwise log it verbatim and do not commit; add a shape test.'
    suggested_owner: dev
    status: open

