top_issues:
  - id: 'TASK-231-CR2-1'
    severity: medium
    file: 'scripts/test-tmpdir.mjs'
    finding: 'The signal handler forwards SIGTERM with child.kill(sig) to the direct child only (npm, then sh -c), so node --test and its workers keep running as orphans while the wrapper deletes their TMPDIR and reports "per-run directory removed" (reproduced: kill -TERM on the wrapper around sh -c ''node -e setInterval''; wrapper exit 143, grandchild still alive).'
    suggested_action: 'Spawn the suite detached (its own process group), forward each signal to the group with process.kill(-child.pid, sig), and remove the directory only after the child has exited; add a test whose fake suite spawns a grandchild and assert it is gone after the signal.'
    suggested_owner: dev
  - id: 'TASK-231-CR2-2'
    severity: low
    file: 'scripts/test-tmpdir.mjs'
    finding: 'INNER_RE requires an uppercase letter or digit, so an all-lowercase inner mkdtemp suffix is kept: prefixOf("eval-repeat-hang-qwerty-Ab12Cd") is "eval-repeat-hang-qwerty", a new prefix that trips the ratchet in roughly (26/62)^6 = 0.55% of runs that leak that directory.'
    suggested_action: 'Strip the inner six-character suffix for the known producer (the eval-repeat-hang scenario directory) regardless of case, with a prefixOf case using an all-lowercase inner suffix.'
    suggested_owner: dev

