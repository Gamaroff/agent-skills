    file: 'shared/resources/doc-links.js'
    finding: 'anchorsFor reads a tracked target with git show :<path>; for a symlink (index mode 120000) that blob is the link target path, so its anchor set is empty and every fragment link to it is reported [no-anchor] (reproduced: LINK.md -> REAL.md with "## Testing", [a](LINK.md#testing) fails while [b](REAL.md#testing) passes; this repository''s own CLAUDE.md is such a symlink).'
    suggested_action: 'Detect a symlink before reading (git ls-files -s mode 120000, or lstat when untracked), resolve it to its in-repository target and read that target''s index blob or disk text; add a doc-links.test.mjs case with a tracked symlinked target.'
    suggested_owner: dev
  - id: 'TASK-231-QA-1'
    severity: low
    file: 'scripts/test-tmpdir.mjs'
    finding: 'groupByPrefix counts into a plain {} object, so a leaked directory whose prefix is __proto__ vanishes from the count and one whose prefix is constructor counts as the string "function Object() { [native code] }1" (reproduced by calling groupByPrefix directly).'
    suggested_action: 'Count into Object.create(null) (or a Map converted with Object.fromEntries) and add a groupByPrefix case for __proto__ and constructor prefixes.'
    suggested_owner: dev

