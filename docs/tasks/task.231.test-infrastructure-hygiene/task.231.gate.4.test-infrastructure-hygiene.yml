    severity: medium
    file: 'tests/test-tmpdir.test.js'
    finding: 'spawnWrapper''s safety net reads suite.pid in a t.after hook, but scratch(t) registered its rmSync first and node:test runs after hooks FIFO, so the file is gone and only the wrapper''s group is killed. A failing signal test would orphan the suite in its own session, stopped indefinitely after a failed Ctrl-Z test. The FIFO order was also observed in this session (the removeDir test''s chmod restore ran after the scratch removal).'
    suggested_action: 'Capture the suite pid in memory when the test reads it, and have the hook kill that group.'
    suggested_owner: dev

