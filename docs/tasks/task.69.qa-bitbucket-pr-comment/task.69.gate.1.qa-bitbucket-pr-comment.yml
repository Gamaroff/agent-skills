schema: 1
task: 'task.69.qa-bitbucket-pr-comment'
task_title: 'Give /qa-story and /qa-task a Bitbucket PR-comment path'
gate: FAIL
status_reason: 'All four phases implemented and the Bitbucket arm is correct in both skills, but moving qa-story to a single-quoted heredoc stopped three real shell variables in its comment body from expanding — a silent regression on GitHub, the one platform the task promised to leave unchanged.'
reviewer: 'QA Engineer'
updated: '2026-09-01T19:05:00Z'

top_issues:
  - id: 'TASK69-001'
    severity: high
    file: 'skills/qa-story/SKILL.md'
    finding: "qa-story's PR-comment body uses real shell variables ($PR_NUMBER, $PR_TITLE, $PR_STATE) but is now written by a single-quoted heredoc, so they are emitted literally instead of expanding. qa-task is unaffected — its body uses {SLOT} placeholders."
    suggested_action: 'Convert the three variables to {PR_NUMBER} / {PR_TITLE} / {PR_STATE} placeholders, matching qa-task. Do NOT unquote the heredoc — the body contains a backtick pair that would become command substitution.'
    suggested_owner: dev
    status: open
  - id: 'TASK69-002'
    severity: medium
    file: 'skills/qa-story/tests/qa-story.test.js'
    finding: 'Neither suite asserts anything about the comment body content, so TASK69-001 is invisible to them — the tests are green with the defect present and with it fixed.'
    suggested_action: 'Add an assertion to both suites that the quoted-heredoc body contains no unescaped $VAR reference, and mutation-prove it.'
    suggested_owner: dev
    status: open

