nfr_validation:
  security:
    status: PASS
    notes: 'No secrets in the diff. Credential handling is delegated to the already-shipped bitbucket-auth.sh, sourced guarded in both skills. Moving off an inline --body to a quoted heredoc strictly REDUCES injection surface: backticks and $(…) in the body are no longer evaluated by the shell.'
  performance:
    status: PASS
    notes: 'Prose-and-tests change; no runtime path affected. The two new suites add 23 tests and ~190ms to a 2139-test run.'
  reliability:
    status: CONCERNS
    notes: 'The GitHub arm of qa-story now emits placeholder text where PR metadata belongs (TASK69-001). Delivery still succeeds, so the step BLOCKING check passes and nothing surfaces the fault — the failure is silent by construction.'
  maintainability:
    status: CONCERNS
    notes: 'Strong on the whole: the two skills are near-identical, the retry asymmetry and non-idempotent design are stated, and a cross-file drift guard exists with a companion test preventing it from silently skipping. But the two comment bodies still diverge in placeholder style, which is exactly the divergence Phase 2 set out to remove and exactly what caused TASK69-001.'

