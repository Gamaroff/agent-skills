top_issues:
  - id: 'TASK-240-QA-8'
    severity: medium
    file: 'shared/resources/open-coverage.js'
    finding: 'The comment-ends-the-value rule (line 351) covers block scalars only, so a wrapped plain value cut by a comment line, or by a ` #` on a wrapped line, keeps reading and prints 1 where PyYAML raises ParserError (reproduced; CR-1; 0 of 168 corpus blocks; severity kept, since review-pr is a model writer; bug report task.240.bug.6.comment-inside-wrapped-value-accepted.md).'
    suggested_action: 'Refuse deeper plain lines after a comment, or after a wrapped line holding ` #`; pin both shapes.'
    suggested_owner: dev
    status: open
  - id: 'TASK-240-QA-9'
    severity: medium
    file: 'shared/resources/open-coverage.js'
    finding: 'scalar() (line 103) refuses only `!`, `&` and `*` at the start of a key-level value. A value starting with a backtick, `@`, `%`, `, ` or `- ` is read as plain and counted (each prints 1), while PyYAML rejects each block (reproduced; CR-2; 0 of 168 corpus blocks; a backtick-led finding sentence is a likely review-pr output; bug report task.240.bug.7.indicator-leading-value-accepted.md).'
    suggested_action: 'Refuse them under category/provenance; under free text either refuse, or document a leniency and model it in lenientFreeText. A blanket refusal would halt real reviews.'
    suggested_owner: dev
    status: open
  - id: 'TASK-240-QA-10'
    severity: medium
    file: 'shared/resources/tests/open-coverage-differential.test.mjs'
    finding: 'The generator emits exactly one wrapped line (line 163), no indicator-leading value and no tab separator, so the suite is green while QA-8 and QA-9 reproduce by hand (CR-3; bug report task.240.bug.8.differential-generator-misses-shapes.md).'
    suggested_action: 'Widen the grammar to 1-3 wrapped lines with interleaved comments, indicator-leading values and a tab separator; mutation-prove the suite red on QA-8 and QA-9.'
    suggested_owner: dev
    status: open

