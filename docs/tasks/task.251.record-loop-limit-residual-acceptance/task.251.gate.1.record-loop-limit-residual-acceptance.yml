top_issues:
  - id: 'T251-QA-1'
    severity: medium
    file: 'shared/resources/accept-qa-residual.js'
    finding: 'waiveEntry treats any "{" on an entry first line as flow style, so a block-style entry such as `- id: "X {y}"` has "status: waived" spliced inside the quoted id, the real `status: open` line stays, and the writer still returns accepted because its read-back uses the same readTopIssues that misparses the brace (reproduced: gate WAIVED, entry id corrupted, status: open kept).'
    suggested_action: 'Take the flow branch only when the text after the dash starts with "{", and add a control test with a brace inside a block-style value; the read-back check should compare entry ids and statuses, not rely on the one reader alone.'
    suggested_owner: dev
    status: open
  - id: 'T251-CR-2'
    severity: medium
    file: 'shared/resources/accept-qa-residual.js'
    finding: '--approved-by is written raw into the Loop exit row and the Decisions Log bullet with no newline folding (--reason is folded), so an approver containing a newline forges extra report lines (reproduced: an injected "## Completion" heading inside the Decisions Log and the Loop exit row).'
    suggested_action: 'Fold CR and LF to a space in approvedBy once, in acceptResidual option normalisation, before it reaches the gate or the report, and add a hostile-approver test.'
    suggested_owner: dev
    status: open
  - id: 'T251-QA-2'
    severity: medium
    file: 'shared/resources/accept-qa-residual.js'
    finding: 'planGateEdit and planReportEdit signal refusal by state and carry no ok field, so the probe engine scores all 9 reproduced hostile cases as accepted (verdict absent, 15 executed, 0 escaped) and /finalise would hit the same result on its own probe.'
    suggested_action: 'Add `ok: false` to every refusal result of planGateEdit and planReportEdit (ok: true for edit and already), keep the existing state field, and re-run the probe so at least one hostile case is rejected.'
    suggested_owner: dev
    status: open

