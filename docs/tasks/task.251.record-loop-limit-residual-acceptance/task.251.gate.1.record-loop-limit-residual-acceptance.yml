status_reason: 'Writer, wiring and tests are in place and green. Three medium findings: a block-style gate entry containing a brace is waived wrongly while the writer reports accepted, an approver name with a newline forges report lines, and the plan functions return no ok field so the boundary probe scores every refusal as acceptance.'
