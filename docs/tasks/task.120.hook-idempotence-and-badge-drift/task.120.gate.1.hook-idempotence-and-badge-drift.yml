schema: 1
task: 'task.120.hook-idempotence-and-badge-drift'
task_title: 'The pause hook, the hook installer and the README badge each rely on a human remembering: make them idempotent, self-healing and generated'
gate: CONCERNS
status_reason: 'All three mechanisms are present, mutation-proven and green under the full fast gate; two open findings — a self-contradicting --dry-run report in the installer (low) and a second hand-typed skill count in README.md prose that the generator does not own (medium) — need a fix cycle before acceptance.'
reviewer: 'QA Engineer'
updated: '2026-09-16T09:40:00Z'

top_issues:
  - id: 'CR-1'
    severity: low
    file: 'shared/resources/develop-pipeline-install-hooks.sh'
    finding: 'Under --dry-run, heal_hook prints "removing duplicate spelling (X)" and then patch_hook — checking identities against the unhealed file — prints "already registered (X)" for the same entry, so the canonical add a real run performs is never shown and the two lines contradict each other; scripts/setup-consumer.sh _patch_hook mirrors the gap, and the run-block comment claiming the add "is shown against the unhealed file" is wrong.'
    suggested_action: 'In patch_hook (and _patch_hook) treat an identity-equal entry whose command is not exactly $cmd as absent when DRY_RUN is true — i.e. skip the entries heal_hook would have removed — so dry-run reports "would add" for the canonical spelling; fix the comment; extend the dry-run test scenario to assert the "adding" line appears.'
    suggested_owner: dev
    status: open
  - id: 'QA-1'
    severity: medium
    file: 'README.md'
    finding: 'README.md:7 still hand-states "126 skills covering …" two lines below the now-generated skills-128 badge, so the README contradicts itself and the prose count will drift exactly as the badge did — the defect class this task closes, in the same file (bug report task.120.bug.1).'
    suggested_action: 'Have update_readme_badge() (or a sibling called from main) also rewrite the "<N> skills covering" prose count from the same total, anchored on that literal phrase; add a generator test asserting both are rewritten and an unrelated number is not; regenerate and commit README.md.'
    suggested_owner: dev
    status: open

