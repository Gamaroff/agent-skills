nfr_validation:
  security:
    status: PASS
    evidence: measured
    probes_executed: 12
    notes: 'Boundary: hook_identity() — its equality decides whether a consumer settings entry is deleted. 12 hostile candidates executed (empty, bare bash, double-space, unquoted ${CLAUDE_PROJECT_DIR}, sh instead of bash, ../ traversal, trailing args, trailing "&& rm -rf /", ./-prefixed root, unicode skill name, node script, no interpreter): no input collapses onto a clean <skill>/scripts/<hook>.sh identity — every extra token or path segment is retained in the identity, so an injected or traversal spelling can never match and be removed as a "duplicate". The hook claim uses mv on a caller-supplied PIPELINE_LOCK path; no new secret handling; gh calls unchanged in shape and gated by tracker_write.'
  performance:
    status: PASS
    notes: 'Hook wall-clock 0.12–0.13 s across 3 runs (no PR/issue path) — one mv replaces one test -f; generate_catalog.py 0.16 s with and without --readme.'
  reliability:
    status: PASS
    notes: 'Concurrency test forces a real overlap (git shim sleeps 1 s inside the winner) and holds: one snapshot, one report block, one PR call, one issue call, loser exits 0 with the empty signal, no lock or claim left behind. Stale claim swept. All three mutation proofs reddened exactly their tests under QA re-execution. Advisory (CR-3, medium confidence): a harness kill in the microsecond window between the claiming mv and write_pause_snapshot leaves the state only under .pausing.<pid>, which no resume path reads — recorded under recommendations.future, not gating.'
  maintainability:
    status: PASS
    notes: 'One identity rule replaces two string-matching healers; the wizard mirror is labelled as a mirror; pause/hooks docs, configuration.md and CHANGELOG updated; two static #2e assertions re-pointed at the mechanism and assert the retired loop is gone. shellcheck clean, prettier clean, bundle --check 0 problems.'

