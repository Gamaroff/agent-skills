top_issues:
  - id: 'TASK-205-QA1-CR1'
    severity: high
    file: 'skills/sync-github-epic/SKILL.md'
    finding: 'The update path passes any differing current milestone as --rename-from, so an epic issue on a shared milestone renames it in place for every issue on it (TASK-205-BUG-1).'
    suggested_action: 'Pass --rename-from only when the current title is this epic''s own milestone (Epic <E> — or Epic <P.E> — ); otherwise resolve or create.'
    suggested_owner: dev
    status: open
  - id: 'TASK-205-QA1-CR4'
    severity: medium
    file: 'skills/ensure-task-github-issue/SKILL.md'
    finding: 'The Step T3 block defaults PRD_ROOT to docs/prd and never sources resolve-paths.sh, so a configured PRD root is ignored and the task falls back to the standalone milestone (TASK-205-BUG-2).'
    suggested_action: 'Source references/resolve-paths.sh inside the block.'
    suggested_owner: dev
    status: open
  - id: 'TASK-205-QA1-CR6'
    severity: low
    file: 'shared/resources/doc-id.js'
    finding: 'stripIdPrefix("story", …) no longer strips "Story 1.2.1 — Tap" or "[Story 1.2.3A] Tap", which the base regex in findChildStories''s label did, so the id renders twice.'
    suggested_action: 'Accept a sub-story letter and dash/em-dash separators in the id pattern.'
    suggested_owner: dev
    status: open

