    file: 'shared/resources/develop-pipeline-on-precompact.sh'
    finding: 'When bump_pause_count fails (line 293, "the comment will omit it"), PAUSE_COUNT is still read from the lock at line 310, so after the first pause at a step the comment states the previous pause number (pause N-1) as the latest pause. The stderr message claims the count is omitted, which is false after the first pause. origin: code-review (high confidence), found on the cycle 2 refute pass; same defect as cycle 1 advisory CR-2, now confirmed by reading the code path.'
    suggested_action: 'Have bump_pause_count report success (a BUMP_OK flag) and build PAUSE_NOTE from the count only when the bump landed, so a failed bump omits the count. Add a hook scenario that makes the bump fail after an earlier pause and asserts the comment names no stale count; mutation-prove it.'
