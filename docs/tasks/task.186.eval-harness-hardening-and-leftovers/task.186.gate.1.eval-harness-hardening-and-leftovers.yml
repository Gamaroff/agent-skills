status_reason: 'All four phases verified, npm run ci and the live eval green, every fix mutation-proven. The diff review found that repeat.mjs counts liveAssertions under replay, so a live-only scenario still scores 0/0 as a pass (CR-1, medium), and that the jq probe makes every fake-gh unit test error on a host without jq (CR-3, low).'
