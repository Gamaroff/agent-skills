top_issues:
  - id: 'CR-1'
    severity: medium
    file: 'evals/shared/repeat.mjs'
    finding: 'The no-assertions floor counts liveAssertions whatever the driver; under DRIVER=replay the runner never runs them, so a scenario with assertions: [] and only liveAssertions runs 0 assertions and passes (reproduced: 0/0, run 1/1 pass, exit 0), and repeat.test.mjs asserts that empty pass as correct.'
    suggested_action: 'Count only the assertions the resolved driver will run (liveAssertions only when the driver is not replay), refuse the rest as usage, and change the test to expect exit 2 under replay.'
    suggested_owner: dev
    status: open
  - id: 'CR-3'
    severity: low
    file: 'evals/shared/lib/fake-gh.mjs'
    finding: 'installFakeGh now throws without jq, and fake-gh.test.mjs sandbox() calls it in every test, so on a host without jq every fake-gh unit test errors and the skip on the -q test can never fire; the A5 runner test half that expects a pass also needs jq with no skip.'
    suggested_action: 'Gate the jq-dependent tests on hasJq (or give the unit-test sandbox a way to install without the probe), and skip the with-jq half of the A5 test when jq is absent.'
    suggested_owner: dev
    status: open

