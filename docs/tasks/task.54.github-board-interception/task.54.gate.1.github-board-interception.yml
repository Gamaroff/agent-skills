schema: 1
task: 'task.54.github-board-interception'
task_title: 'Intercept GitHub board mutations, and give gh-stage.js the credential-free plan its sibling already has'
gate: FAIL
status_reason: 'The interception itself is correct and well tested, but the three shell files that
  now depend on defer-mutation.js do not name it in a form the bundler can follow — so 17 installed
  skills lack it. In 11 of those the board helpers stop writing under `full` mode, a regression in
  behaviour that predates this task.'
reviewer: 'QA Engineer'
updated: '2026-08-19T11:35:00Z'

top_issues:
  - id: TASK-54-BUG-1
    severity: high
    finding: '`defer-mutation.js` is not bundled beside resolve-platform.sh or the two board helpers.
      17 of 35 skills lack it. The helpers exit before their graphql call when it is missing, and
      that branch does not check the access mode — so board Priority/Estimate writes silently stop
      under `full` in 11 installed skills. Separately, tracker_write cannot record a deferral in any
      of the 17, leaving the audit gap this sequence exists to close.'
    suggested_action: 'Name `shared/resources/defer-mutation.js` literally in a comment in each of
      the three files (the jira-sprint-lib.sh:32 precedent), re-run `npm run bundle`, and add a
      co-location assertion to jira-interception.test.mjs §12 so a later cleanup cannot silently
      delete the comment.'
    suggested_owner: dev
    bug_ref: 'task.54.bug.1.defer-writer-not-bundled.md'
  - id: TASK-54-BUG-2
    severity: medium
    finding: '`--print-plan` sits below the `if (!args.probeBoard)` block that validates --stage
      against MOMENTS and lowercases it, so --probe-board/--check/--init-workflow bypass both. A
      typo''d moment returns `enabled: false, targets: null` exit 0 — indistinguishable from a
      deliberately disabled moment, so the board move is silently dropped from a checklist.'
    suggested_action: 'Validate the moment on the --print-plan path itself; assert exit 2 for an
      unknown moment with --probe-board present, and lowercase canonicalisation on that path.'
    suggested_owner: dev
    bug_ref: 'task.54.bug.2.print-plan-skips-moment-validation.md'

