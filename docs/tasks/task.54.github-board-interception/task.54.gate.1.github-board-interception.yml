      written never falls through to performing the mutation. Redaction paths untouched. No new
      credential handling.'
  performance:
    status: PASS
    notes: '--print-plan is a single config-file read on a path that previously required a network
      round-trip. tracker_write adds one mode comparison per call on the full-mode path (the
      resolution already happened at source time) and one node invocation only when deferring.'
  reliability:
    status: FAIL
    notes: 'TASK-54-BUG-1. The bundled board helpers no-op under `full` in 11 skills — an unrelated,
      pre-existing capability broken by the change. The missing-writer branch is also
      disproportionate: it refuses the write before establishing that any restriction is in force.'
  maintainability:
    status: PASS
    notes: 'Comments explain the non-obvious constraints (gate placement, zsh word-splitting, why the
      alias must survive) rather than restating the code. 25 new tests, each of six invariants
      watched failing. The one deviation from "existing suite green unchanged" — the banner
      assertion — was a test asserting a fact the task deliberately changed, and was replaced with
      assertions in both directions plus a stale-claim guard.'

