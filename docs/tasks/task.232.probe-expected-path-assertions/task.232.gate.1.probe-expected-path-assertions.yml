status_reason: 'All 3 phases are delivered and 3 spot mutations go red on committed tests, but there are two high findings. The PR shellcheck check is red on a fixture with no shell directive (BUG-1). The path grammar accepts ./ and a/../, which resolve to the case directory and read as "was created" on every run (BUG-2). Three medium findings: a trailing slash skips the collision decline, lstat errors other than ENOENT/ENOTDIR crash the probe, and the grammar is unreachable by the probe.'
