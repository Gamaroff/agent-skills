top_issues:
  - id: 'TASK-232-QA2-1'
    severity: medium
    file: 'shared/resources/security-probe.mjs'
    finding: 'Cycle 1 wrote "a path the run left unreadable ... is a mismatch too, never a probe crash" into probe-boundary-rule.md and CHANGELOG, but a fence case whose input is `mkdir -p locked && chmod 000 locked` still ends runProbeSpec: the finally-block `rmSync(sandboxRoot, { recursive: true, force: true })` throws EACCES and every case result is lost. Reproduced on head; the teardown is unchanged from base, which crashes the same way. The defect predates this change, but the claim is new and false. The new test calls compareExpected directly and restores the mode itself, so it cannot see the runner. From diff review CR-1.'
    suggested_action: 'Make the sandbox teardown restore owner permissions on directories the run left unreadable (lstat walk, never following symlinks) before removing it. Add a runProbeSpec-level test whose case leaves a mode-000 directory and still returns its results.'
    suggested_owner: dev
    bug_ref: 'task.232.bug.6.sandbox-teardown-throws-on-mode-000-dir.md'
  - id: 'TASK-232-QA2-2'
    severity: medium
    file: 'shared/resources/tests/security-probe.test.mjs'
    finding: 'Cycle 1 made the fence scorer count an unreadable `absent` path as a side effect (`casePathState(...).state !== "missing"`, security-probe.mjs:3364). No test holds it: mutation Q5 (`!== "missing"` changed to `=== "present"`) leaves the suite green. A hostile fence case that plants a loop and then stops would score errored instead of reproduced, unseen.'
    suggested_action: 'Add a fence test: a hostile case that plants `ln -s loop loop` and then stops, with absent ["loop/x"], scores as reproduced on every shell. Confirm it goes red under Q5.'
    suggested_owner: dev
    bug_ref: 'task.232.bug.7.fence-unreadable-side-effect-untested.md'

