    severity: high
    file: 'skills/qa-fix/SKILL.md'
    finding: 'The boundary walk starts at dirname of each changed path and never tests the path itself. Reproduced by the reviewer and again by QA in bash and zsh: a changed path that is a nested repository root (smod, a tracked gitlink) holding an untracked file (smod/untrackedInSub) exits 0 with no output, as do smod/ and ../smod. git ls-files --others lists nothing for it, and neither the symlink test nor the .git test ever looks at smod. The longer spelling smod/x is refused, so the same state is refused or passed depending only on whether the path stops at the root of the nested repository.'
    suggested_action: 'Run the symlink test and the .git-strictly-below-TOP test on the path itself as well as on its parents (start the loop at the path, or test it before the dirname loop). Add gitlink and tracked-symlink scenarios with a mutant each, and a regression case for an absolute path through an external symlink that points back into the repository (CR-3).'
    suggested_owner: dev
    status: open

