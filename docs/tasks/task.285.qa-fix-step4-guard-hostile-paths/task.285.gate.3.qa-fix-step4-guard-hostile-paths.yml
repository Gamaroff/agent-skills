top_issues:
  - id: 'T285-QA-3'
    severity: high
    file: 'skills/qa-fix/SKILL.md'
    finding: 'The parent walk stops at the first prefix whose physical path equals TOP, without having checked the symlinks that come earlier in the path. Reproduced by the reviewer in bash and zsh: with sub/out -> ../.., the untracked path sub/out/<repo-name>/sub/new (and its absolute form) exits 0 with no output; with sub/self -> ../sub, sub/self/../real/new also exits 0. [ -e ] follows the link and git normalises .. lexically, so it lists nothing and the verdict is a false clean.'
    suggested_action: 'Do not stop early: visit every parent, refuse a symlink whose containing directory resolves inside the repository, and refuse a .git only when the directory lies strictly below the root. Add out-and-back and dotdot-after-symlink scenarios, each with a mutant.'
    suggested_owner: dev
    status: open
  - id: 'T285-QA-4'
    severity: high
    file: 'skills/qa-fix/SKILL.md'
    finding: 'A path with a trailing slash never has its final component examined: dirname of link/ is ".", so the walk body does not run, and git ls-files -- link/ lists nothing where link lists the untracked symlink. Reproduced: link -> real with untracked real/new, input link/ exits 0 with no output.'
    suggested_action: 'Strip trailing slashes from every path before any check. Add a trailing-slash scenario with a mutant.'
    suggested_owner: dev
    status: open
  - id: 'T285-QA-5'
    severity: medium
    file: 'tests/qa-fix-step4-guard.test.js'
    finding: 'The direct-run suite had a single refused scenario per root-stop clause (rootlink), so out-and-back links, a symlink followed by .., and a trailing-slash path passed every test.'
    suggested_action: 'Add the scenarios with matching mutants (done together with T285-QA-3 and T285-QA-4).'
    suggested_owner: dev
    status: open

