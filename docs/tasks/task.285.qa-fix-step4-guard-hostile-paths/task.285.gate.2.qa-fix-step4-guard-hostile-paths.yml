top_issues:
  - id: 'T285-QA-2'
    severity: high
    file: 'skills/qa-fix/SKILL.md'
    finding: 'The root stop (PHYS equals TOP, then break) runs before the -L test. A symlink inside the repo that points at the repo root (rootlink -> .) resolves to TOP, so the walk ends and the path is not refused. With untracked real/new, the input rootlink/real/new exits 0 with no output under bash and zsh, while real/new is refused. git --literal-pathspecs ls-files --others -- rootlink/real/new lists nothing (rc 0), so the clean verdict is wrong: the "could not look" read as clean failure the block exists to stop. Reproduced by this reviewer and by the QA engineer in a scratch repository.'
    suggested_action: 'Stop at the root only when the directory is not a symlink located inside the repository: when PHYS equals TOP and the directory is a symlink, refuse the path if the symlink''s own physical parent equals or sits under TOP, then break. Keep admitting an absolute path through a symlink whose parent is outside TOP. Add a rootlink scenario (refused) to the direct tests, with a mutant that removes the check.'
    suggested_owner: dev
    status: open

