top_issues:
  - id: 'TASK123-C4-CR-1'
    severity: medium
    file: 'shared/resources/grant-qa-cycles.sh'
    finding: >-
      The never-lower guard runs after the snapshot restore, so a refused grant (reproduced:
      snapshot qa_max_cycles 9, base 6, k=2) exits 1 but leaves a freshly restored lock carrying
      the snapshot's qa_phase 5b and no grant — the Stop hook names /qa-fix and the next resume
      sees an active lock instead of the halt snapshot.
    suggested_action: >-
      Evaluate the guard against the snapshot's qa_max_cycles before restoring, and remove a
      restored lock on any later refusal; suite row.
    suggested_owner: dev
    bug_ref: 'task.123.bug.11.refused-grant-leaves-a-restored-lock.md'
    status: open
  - id: 'TASK123-C4-CR-2'
    severity: medium
    file: 'shared/resources/develop-pipeline-resume-contract.md'
    finding: >-
      Step 4 says the set-qa-phase.sh 5a re-assert "holds on a resume that declined the grant",
      but after a HALT the lock exists only if the grant script restored it — on a declined grant
      the call noops; step 4, its next sentence and SKILL.md describe three different declined
      paths.
    suggested_action: >-
      A declined grant never reaches 5a: it returns to the halt's own options with no lock; the
      grant writes qa_phase 5a itself. State it once; align SKILL.md.
    suggested_owner: dev
    bug_ref: 'task.123.bug.12.declined-grant-path-claims-a-re-assert-that-cannot-run.md'
    status: open
  - id: 'TASK123-C4-CR-3'
    severity: medium
    file: 'shared/resources/develop-pipeline-resume-contract.md'
    finding: >-
      A loop-limit-via-review entry (PR Review REQUEST CHANGES, Action Escalating — loop limit
      reached) matches both the REQUEST CHANGES row (re-enter at 5b) and the escalation row with
      no precedence, so a mechanical reader re-runs qa-fix on an escalated run.
    suggested_action: >-
      State that an Escalating Action is checked first, qualify the REQUEST CHANGES row by its
      Action, and extend the parity row parse.
    suggested_owner: dev
    bug_ref: 'task.123.bug.13.substate-table-two-rows-match-a-loop-limit-via-review-entry.md'
    status: open
  - id: 'TASK123-C4-CR-4'
    severity: medium
    file: 'shared/resources/grant-qa-cycles.sh'
    finding: >-
      The ownership check compares strings after stripping ./ and trailing slashes only; an
      absolute <doc-dir> against the lock's relative task_or_story_directory for the same
      directory is refused as "for another document" (reproduced). Reviewer confidence medium; QA
      reproduced.
    suggested_action: >-
      Canonicalise both paths (cd && pwd -P) before comparing; suite rows in both directions.
    suggested_owner: dev
    bug_ref: 'task.123.bug.14.snapshot-ownership-check-refuses-absolute-doc-dir.md'
    status: open

