schema: 1
task: 'task.123.qa-loop-exits-and-re-entry'
task_title: 'The QA loop''s guards read only the HIGH count and the lock cannot go backwards'
gate: PASS
status_reason: 'Cycle 5 (the last budgeted cycle), scoped to the 16 files changed since gate 4. All cycle-4 findings FIXED and verified (bugs 11–14 Closed). No HIGH, no MEDIUM. Four LOW findings ride on this PASS (gate rule 5), all in the grant script''s refusal-message wording and path edge cases: a misleading clause in the never-lower refusal on the no-lock path (the reviewer rated it medium; QA rates it LOW — the same line already names the k that is needed, and the script''s behaviour is correct: it refuses and writes nothing), a foreign snapshot diagnosed by its budget before its ownership, a doc-dir of "./" under bash 5, and CDPATH leaking into canon(). HIGH 1, 1, 0, 0, 0 — the loop converged. Every suite green.'
reviewer: 'QA Engineer'
updated: '2026-09-19T09:01:35Z'

top_issues:
  - id: 'TASK123-C5-CR-1'
    severity: low
    file: 'shared/resources/grant-qa-cycles.sh'
    finding: >-
      On the no-lock path the never-lower refusal's clause "no grant is needed to run cycles up to
      EXISTING" is false — nothing restores the lock, so Loop Setup would read 5; the same line's
      "k must be at least N" is the correct remedy. Reviewer severity medium; QA severity LOW: a
      wrong clause in a message whose behaviour and adjacent remedy are correct.
    suggested_action: >-
      Emit the "no grant is needed" clause only when the budget was read from an existing lock;
      on the snapshot path say "grant k >= N to restore the lock and run cycles up to EXISTING".
    suggested_owner: dev
    status: closed
    resolution: carried to recommendations.future (route 2b)
  - id: 'TASK123-C5-CR-2'
    severity: low
    file: 'shared/resources/grant-qa-cycles.sh'
    finding: >-
      The never-lower guard reads the snapshot's budget before the ownership check, so a foreign
      snapshot with a higher budget is refused for its budget rather than diagnosed as "for
      another document"; the header's bullet order promises the opposite.
    suggested_action: >-
      Hoist the ownership comparison ahead of read_budget on the snapshot branch.
    suggested_owner: dev
    status: closed
    resolution: carried to recommendations.future (route 2b)
  - id: 'TASK123-C5-CR-3'
    severity: low
    file: 'shared/resources/grant-qa-cycles.sh'
    finding: >-
      platform-variance: canon() strips "./" to the empty string; cd "" fails on bash 5.x and
      succeeds on bash 3.2, so a doc-dir of "./" is falsely refused under bash 5 (reproduced on
      bash 5.3.9).
    suggested_action: >-
      Map an empty stripped string to "." before the cd (or strip the prefix only when something
      follows it).
    suggested_owner: dev
    status: closed
    resolution: carried to recommendations.future (route 2b)
  - id: 'TASK123-C5-CR-4'
    severity: low
    file: 'shared/resources/grant-qa-cycles.sh'
    finding: >-
      canon() runs a bare cd inside a command substitution; with an exported CDPATH bash prints
      the resolved directory to stdout, so a relative snapshot dir canonicalises to two lines and
      the comparison fails. Reviewer reproduced on bash 3.2 and 5.3 with CDPATH set; QA's probe
      with CDPATH=/tmp did not trigger it — kept as reported.
    suggested_action: >-
      Use (CDPATH= cd -- "$stripped" >/dev/null 2>&1 && pwd -P).
    suggested_owner: dev
    status: closed
    resolution: carried to recommendations.future (route 2b)

