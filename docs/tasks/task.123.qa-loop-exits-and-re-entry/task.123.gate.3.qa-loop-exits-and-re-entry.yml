top_issues:
  - id: 'TASK123-C3-CR-1'
    severity: medium
    file: 'shared/resources/develop-pipeline-step-5-6-qa-loop.md'
    finding: >-
      The C2-CR-4 "On continue" write overwrites cycle N's **PR Review** with "not reached" on
      every loop-limit path, but on the loop-limit-via-review path that gate DID reach 5c and the
      write destroys the recorded REQUEST CHANGES verdict the escalation template ("Step 5c
      returned REQUEST CHANGES on cycle(s) {list}") and the resume contract's escalation row read.
    suggested_action: >-
      Overwrite only the **Action** row on the loop-limit paths; leave **PR Review** as written;
      reword the Outcome-branching preamble; extend the parity pin to assert Action alone.
    suggested_owner: dev
    bug_ref: 'task.123.bug.9.loop-limit-write-clobbers-request-changes-verdict.md'
    status: open
  - id: 'TASK123-C3-CR-2'
    severity: medium
    file: 'shared/resources/grant-qa-cycles.sh'
    finding: >-
      The script's base is always the highest gate on disk, but the resume contract's
      negative-count rule resumes from the report entry count when that is higher; on that path a
      grant lands below the re-entry cycle (gate.3 highest, 5 entries, k=2 → qa_max_cycles 5,
      NEXT_CYCLE 6) and delivers zero cycles. Verified: it also silently lowers an existing
      qa_max_cycles (7 → 5). Reviewer confidence medium; QA reproduced both.
    suggested_action: >-
      Take max(highest gate, report entry count) as the base — pass the implementation report
      path — and refuse to write a budget lower than the lock's existing one; add both rows to
      the suite.
    suggested_owner: dev
    bug_ref: 'task.123.bug.10.grant-base-disagrees-with-the-contract-negative-count-rule.md'
    status: open
  - id: 'TASK123-C3-CR-4'
    severity: low
    file: 'shared/resources/grant-qa-cycles.sh'
    finding: >-
      A leading-zero k is octal in 0 and decimal in jq --argjson: k=010 prints
      qa_max_cycles=11 with 13 in the lock; k=08 prints a bash error and still exits 0. QA
      reproduced k=010.
    suggested_action: >-
      Reject a leading zero in the k guard and print the value back from the written lock rather
      than recomputing it in shell.
    suggested_owner: dev
    status: open

