      a REQUEST CHANGES verdict, qa-fix is handed HIGH findings that were deliberately waived, and
      works them. Same shape as TASK-99-007, different route.
      The falsehood predates this change set — the original sentence said the same thing — but cycle
      3 restated it in a note whose entire subject is what each route's gate carries, which is where a
      reader will now look for the answer.
    suggested_action: >-
      Correct the note: a PASS gate carries an empty top_issues[]; a WAIVED gate carries its HIGH
      entries with waiver.active: true, and those are not the fix target either. Three routes, one
      rule — only the review's findings are the work.
