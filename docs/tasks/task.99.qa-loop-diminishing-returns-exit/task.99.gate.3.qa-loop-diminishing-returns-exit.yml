top_issues:
  - id: "TASK-99-007"
    severity: medium
    file: "shared/resources/develop-pipeline-step-5-6-qa-loop.md"
    finding: >-
      5c's REQUEST CHANGES arm says "The ordinary 5b invocation passes the latest gate file, and on
      this path that gate reads PASS/WAIVED with an empty top_issues[]". Cycle 2 added a second route
      into 5c whose gate is CONCERNS with a deliberately NON-empty top_issues[], so that sentence is
      now false for route 2. The behavioural consequence is worse than the wrong sentence: on
      route 2 + REQUEST CHANGES, qa-fix receives a gate whose top_issues are exactly the machinery
      residue the Diminishing-returns exit declined to fix, and qa-fix's priority order will work
      them — the loop resumes refining the pins, through the back door, which is the one outcome this
      task exists to prevent.
    suggested_action: >-
      Qualify the sentence for both routes, and state that on route 2 the gate's machinery findings
      are NOT the fix target — only the review's findings are. The `pr_review=` argument already
      carries those, so no mechanism changes; what is missing is the instruction not to treat the
      carried-over residue as work.
    suggested_owner: dev
    status: open

