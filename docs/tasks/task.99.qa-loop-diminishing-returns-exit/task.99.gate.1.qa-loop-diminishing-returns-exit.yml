schema: 1
task: "task.99.qa-loop-diminishing-returns-exit"
task_title: "A diminishing-returns exit for the QA loop"
gate: FAIL
status_reason: "All 5 phases implemented and all 12 success criteria verified; `npm run ci:fast` green at 2936/0 and the exit mutation-proved eight ways. One HIGH: the glob matcher case-folds `file:` paths, so a consumer whose globs carry a capital letter can never take the exit — the deliverable is silently inoperative for them, and every fixture in the new suite is lowercase so the suite cannot see it."
reviewer: "QA Engineer"
updated: "2026-09-09T13:00:00Z"

top_issues:
  - id: "TASK-99-001"
    severity: high
    file: "shared/resources/qa-diminishing-returns.js"
    finding: >-
      `readKeysInto` lowercases every captured value, including `file:`, which is a filesystem path
      rather than an enumeration. `qa.testArtifactGlobs` is matched against the folded path while the
      operator wrote the glob against the real one, so any glob containing an uppercase character
      never matches and the exit never fires. Reproduced: `src/Components/Button/Button.spec.tsx`
      against glob `src/Components/**` returns `continue / non-test-finding`. The 32-test suite
      passes with the defect present because every fixture path and glob in it is lowercase — the
      anti-vacuity fixture included.
    suggested_action: >-
      Fold only `severity`, `category` and `status`; keep `file` verbatim. Add a regression test with
      a capitalised path and a correctly-cased glob, and mutation-prove it by restoring the
      unconditional `.toLowerCase()`.
    suggested_owner: dev
    status: open
  - id: "TASK-99-002"
    severity: medium
    file: "shared/resources/develop-pipeline-step-5-6-qa-loop.md"
    finding: >-
      The new section instructs writing the exit's reason into a `**Loop exit**` row of the
      `### QA Cycle {N}` entry, but the QA Cycle entry template earlier in the same file defines five
      rows and none of them is `**Loop exit**`. A reader following the template omits it; a reader
      following the exit section adds a row the template does not know about. Success criterion 8 —
      that a reader six months later can tell this exit from a stall — rests entirely on that row.
    suggested_action: >-
      Add `**Loop exit**` to the QA Cycle entry template with its default value, alongside the note
      that already explains who writes `**PR Review**` and when.
    suggested_owner: dev
    status: open
  - id: "TASK-99-003"
    severity: medium
    file: "shared/resources/develop-pipeline-step-5-6-qa-loop.md"
    finding: >-
      The invocation snippet consumes `$CYCLE`, `$HIGH_SEQUENCE_JSON`, `$LATEST_GATE` and
      `$TEST_ARTIFACT_GLOBS_JSON`, and the section never says how any of them is populated — in
      particular that `qa.testArtifactGlobs` is read from the consumer's `skills-config.yaml`. Every
      other config-consuming step in this corpus names its source at the call site. As written an
      orchestrator has a documented command and no documented way to run it.
    suggested_action: >-
      State the four bindings above the snippet: cycle counter from Loop Setup, the HIGH sequence
      from the `**HIGH findings**` rows in QA Iteration History, the gate path from the Loop Setup
      resolution, and the globs from `qa.testArtifactGlobs` in `skills-config.yaml` (default `[]`).
    suggested_owner: dev
    status: open

