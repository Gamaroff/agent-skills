task_title: "A diminishing-returns exit for the QA loop"
gate: FAIL
status_reason: "Cycle 1's three findings are all fixed and mutation-proved, and the fix is sound. The mandatory cycle-2 refute pass found what cycle 1's document-anchored reading did not: 5c's own entry condition excludes the very gate this exit hands it, so the deliverable's exit path is undefined in the document that defines it. Two further false claims in prose."
reviewer: "QA Engineer"
updated: "2026-09-09T14:00:00Z"

top_issues:
  - id: "TASK-99-004"
    severity: high
    file: "shared/resources/develop-pipeline-step-5-6-qa-loop.md"
    finding: >-
      The Diminishing-returns exit section says it hands to 5c "exactly as a `PASS` gate does". 5c's
      own opening sentence says "Perform this step after a gate exits 5a with `PASS` or `WAIVED`".
      A gate that takes this exit is by construction a `CONCERNS` gate — condition 2's premise is that
      `top_issues[]` is non-empty, and the deterministic gate rules make any MEDIUM finding CONCERNS.
      So 5c's stated precondition excludes precisely the gate the new exit sends it, and the two
      sections of one runnable document now disagree about whether a CONCERNS gate may reach 5c. An
      orchestrator reading 5c refuses; one reading the exit proceeds. The behaviour is undefined,
      which is the failure the task's own §3 comparison table exists to prevent.
    suggested_action: >-
      Widen 5c's entry condition to name both routes — a clean gate, and the diminishing-returns exit
      — and state that the second arrives with a CONCERNS gate carrying machinery-only residue. Keep
      "a gate that routes to 5b never reaches it": that sentence stays true, because this exit does
      not run 5b.
    suggested_owner: dev
    status: open
  - id: "TASK-99-005"
    severity: medium
    file: "shared/resources/develop-pipeline-step-5-6-qa-loop.md"
    finding: >-
      The `**Loop exit**` row added in cycle 1 defaults to `n/a — loop continued`. On the cycle where
      a clean `PASS` gate hands to 5c and 5c returns APPROVE, the loop did not continue — it exited,
      by the ordinary route. The default text would write a false statement into the one record a
      future reader consults to tell the two exits apart, which is the record's whole purpose.
    suggested_action: >-
      Default to `n/a — this exit not taken`, which is true on every cycle that did not take it,
      whatever else that cycle did.
    suggested_owner: dev
    status: open
  - id: "TASK-99-006"
    severity: medium
    file: "CHANGELOG.md"
    finding: >-
      "32 tests replay reconstructed gate sequences through it" — the suite is now 33, after cycle 1
      added the capitalised-path regression. The same stale count appears twice in the task document's
      current-state prose (implementation summary, testing results). These are claims about what is in
      the repository right now, not historical Change Log rows, and they are false. The task's own
      Motivation section records that four of the twenty-one findings on the run it was derived from
      were exactly this — "false claims in prose, a repair's stated rationale that measurement
      refuted" — so it is the defect class this work was filed against.
    suggested_action: >-
      Update the three current-state counts to 33. Leave the dated Change Log rows alone: they record
      what was true when written, which is what a change log is for.
    suggested_owner: dev
    status: open

