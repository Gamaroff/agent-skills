nfr_validation:
  security:
    status: PASS
    notes: 'No secrets in the diff. Bodies travel as argv arrays and files, never interpolated into a shell string. Credentials read from env, mirroring bitbucket-auth.sh. The access gate sits between local work and the first remote call, and restricted-mode tests inject throwing transports so a leak fails the test.'
  performance:
    status: PASS
    notes: 'The batched review is one API call and one notification instead of N. No hot paths touched.'
  reliability:
    status: PASS
    notes: 'Every path that can fail to anchor now degrades to the summary comment: 422, duplicate marker, unreadable comment list, stale anchor, and update failure. Each is covered by a test asserting the finding TEXT reaches the summary, and four mutation proofs confirm those tests fail when the behaviour is reverted.'
  maintainability:
    status: PASS
    notes: 'The test gap on the losing branch is closed and mutation-proven. The contract and the code now agree: the stale-anchor rule is implemented on GitHub, and the contract states plainly that Bitbucket cannot detect it. A new executable guard in both skill suites runs the documented jq against a fixture, so the wiring cannot silently rot again.'

