task: 'task.70.inline-pr-comments'
task_title: 'Build the inline PR comment primitive, on GitHub and Bitbucket'
gate: PASS
status_reason: 'Cycle 2 ran as a refute pass and found eight further defects, two of which would drop findings silently. All are fixed and mutation-proven, CI is green, and the suite is 47 unit + 65 skill-contract tests.'
reviewer: 'QA Engineer'
updated: '2026-09-02T22:40:00Z'

top_issues:
  - id: 'TASK70-C2-001'
    severity: high
    file: 'skills/review-code/SKILL.md'
    finding: 'Both call sites passed `id: .id` to the CLI as a cross-run identity, but the reviewer schemas define `id` as `CR-{n}` / `PC-{n}` and comment it "stable within this run" — a per-run ordinal. The CLI docstring asserted the opposite as fact, so the cycle-1 body-hash fix never engaged for the only two callers that exist. On run 2, CR-1 names a different finding: GitHub degrades the new one forever while a comment about an already-fixed bug stays on the PR; Bitbucket overwrote the wrong comment and reported `updated`.'
    suggested_action: 'Drop `id:` from both jq snippets; hash the body into the id even when a caller supplies one, treating the caller id as a namespace.'
    suggested_owner: dev
    status: closed
    fixed_date: '2026-09-02'
  - id: 'TASK70-C2-002'
    severity: high
    file: 'shared/resources/pr-inline-comment.js'
    finding: '`gh api --paginate` emits one JSON document PER PAGE, not a merged array — `JSON.parse` rejects the concatenation. With the default 30-per-page, any PR carrying more than one page of review comments threw in the marker scan, degraded every finding to `unverifiable`, and silently reverted the module to the summary-only behaviour it was written to replace. The stub returned a single array and structurally could not produce the failing shape.'
    suggested_action: 'Add `--slurp` and `per_page=100`, then flatten one level. Add a stub case returning two pages.'
    suggested_owner: dev
    status: closed
    fixed_date: '2026-09-02'
  - id: 'TASK70-C2-003'
    severity: medium
    file: 'shared/resources/pr-inline-comment.js'
    finding: 'The Bitbucket marker map stored only `{id, count}`, so the arm had no stale-anchor check and the cycle-1 fix was GitHub-only. The contract justified this with "Bitbucket has no equivalent of position: null", which is true and beside the point — the comparisons that actually fire are path and line, and Bitbucket returns `inline.path`/`inline.to` on every inline comment. Same state, two opposite reports, and the Bitbucket one was the misreport.'
    suggested_action: 'Capture `inline` in the scan and apply the same path/line comparison before the PUT; treat a marker on a comment with no inline block as moved.'
    suggested_owner: dev
    status: closed
    fixed_date: '2026-09-02'
  - id: 'TASK70-C2-004'
    severity: medium
    file: 'shared/resources/pr-inline-comment.js'
    finding: 'The batch→per-comment fallback treated every throw as "the batch was rejected", including a transport error on a request the server accepted. That posts a second comment per marker, and the NEXT run then sees count > 1 for every key and refuses to post or edit anything — permanently, with nothing to reconcile it. A five-cycle loop converges to "never comments again".'
    suggested_action: 'Fall back only when `isAnchorRejection` holds; degrade otherwise rather than risking duplicates.'
    suggested_owner: dev
    status: closed
    fixed_date: '2026-09-02'
  - id: 'TASK70-C2-005'
    severity: medium
    file: 'shared/resources/pr-inline-comment.js'
    finding: 'The run-level `unverifiable` branch was unreachable. Cycle-1 made every `unverifiable` site also push to `degraded` (correctly), which silently made the old `!degraded.length` test impossible to satisfy — so the reason documented in the contract could never be emitted and `--strict` could never report the one condition it exists for. A fix that quietly killed a neighbouring behaviour.'
    suggested_action: 'Compare against the results (`unverifiable === results.length`) so the branch can fire.'
    suggested_owner: dev
    status: closed
    fixed_date: '2026-09-02'
  - id: 'TASK70-C2-006'
    severity: medium
    file: 'skills/review-code/SKILL.md'
    finding: 'The jq program was fail-open in the wrong direction: `select(.file_line != null)` admitted any non-null value, then `split(":")[1] | tonumber` aborted the WHOLE program on the first entry that was not exactly `path:integer` — and string concatenation aborted on a missing `suggested_action`. jq is all-or-nothing inside `[ … ]` and the redirect truncates the file first, so one `src/x.ts:42-58` dropped every finding in the run.'
    suggested_action: 'Filter by shape with `test("^.+:[0-9]+$")`, make `suggested_action` optional, and check jq exit status before invoking the CLI.'
    suggested_owner: dev
    status: closed
    fixed_date: '2026-09-02'
  - id: 'TASK70-C2-007'
    severity: medium
    file: 'skills/review-pr/tests/review-pr.test.js'
    finding: 'The new guard fixture invented a `file_line` key on conformance findings. The conformance schema has no `file_line` — it has `ref`. So the fixture was not schema-shaped as its own header claimed, and it exercised a branch production never takes: against a real payload, `select(.file_line != null)` dropped every PC finding, making `.pr_conformance.findings[]?` dead code. `assert.ok(out.length > 0)` was satisfied by the code_review entry alone, so the test passed with the conformance arm entirely broken.'
    suggested_action: 'Use `ref` in the fixture, normalise both lenses onto one anchor key, and assert per-lens rather than on total length.'
    suggested_owner: dev
    status: closed
    fixed_date: '2026-09-02'
  - id: 'TASK70-C2-008'
    severity: medium
    file: 'shared/resources/pr-inline-comment.js'
    finding: 'The summary comment carries no marker and is never scanned for one, so the re-run rule is implemented for inline comments and absent for the degradation destination. Five qa-fix cycles leave five near-identical summary comments; and once two exist, handover-verify''s first-line heuristic returns ambiguous, so the deferred summary record can never be confirmed.'
    suggested_action: 'Prefix the summary with a marker and PATCH/PUT in place, as the inline path already does.'
    suggested_owner: dev
    status: open
    note: 'Deferred deliberately — see the QA report. It changes the summary comment''s identity semantics and is not a finding-loss defect.'

