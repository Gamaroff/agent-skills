top_issues:
  - id: 'T296-QA-5'
    severity: low
    file: 'scripts/remote-test/lockctl.sh'
    finding: 'The numeric check on a margin (and the older ones on the timeout and on unlock''s margin) is ^[0-9]+$, which accepts a leading zero and any length, and the staleness arithmetic then reads the value as bash octal or wraps it. Reproduced by the probe engine (task.296.qa.3.security.run.json, 18 executed, 4 reproduced in bash and zsh, 1 escaped): take with margin 08 prints "value too great for base" and no state, exit 10; take with margin 9999999999999999999999 wraps and reports state=live. The one escape is the lock take writes under the sandbox HOME once it accepts the input, so it should disappear when both are refused. Control: the other 7 hostile margins (-1, 1;touch, a substitution, 5 6, 1.5, 0x10, 1e3) are rejected with exit 2. Only a caller other than run.sh can send either value (run.sh caps at 4 digits and normalises with 10#), hence low. origin: QA probe, reproduced.'
    suggested_action: 'In lockctl.sh validate timeout and margin as ^[0-9]{1,4}$ (the cap run.sh already applies), read them with 10# in the arithmetic, apply the same check to the unlock margin, and add a committed test that take refuses 08 and a 22-digit margin and writes nothing.'
    suggested_owner: dev
    status: open

