top_issues:
  - id: 'T296-QA-3'
    severity: medium
    file: 'scripts/remote-test/run.sh'
    finding: 'The take call (run.sh line 258) does not pass the margin, so lockctl.sh describe falls back to its own default of 10 (lockctl.sh line 72) while --unlock does pass it. Reproduced against the real lockctl.sh: owner timeout 30, started 36 minutes ago, margin 0: take on the held lock prints state=live, unlock with margin 0 prints state=stale and removes it. Control: both agree at the default margin of 10, so the defect appears only when TEST_REMOTE_LOCK_MARGIN_MIN is set. The held message then names the wrong state and the wrong next step. origin: code-review, reproduced by QA (reviewer rated it low severity, medium confidence; QA rates it medium because a documented setting is ignored by one of its two consumers).'
    suggested_action: 'Pass LOCK_MARGIN_MIN to take as a sixth word (or in the remote command), read it in lockctl.sh take, and add a test: a held take with a non-default margin reports the state that margin gives. Update the anchored argv test in step.'
    suggested_owner: dev
    status: open
  - id: 'T296-QA-4'
    severity: medium
    file: 'docs/tasks/task.296.test-remote-per-run-lock-and-image-prune/task.296.implementation.1.test-remote-per-run-lock-and-image-prune-initial-run.md'
    finding: 'CI check link-check failed on 2c9fe694f76c (run 43264563618): the Issues Log line "Live acceptance on" followed by the host-at-address string autolinks as mailto:ci@192.168.1.249 and returns status 400. link-check is green on develop (run 43234081388), so the red is this branch''s.'
    suggested_action: 'Put the host-at-address string in backticks in the implementation report (and check the QA reports for the same shape), then confirm link-check green on the next head.'
    suggested_owner: dev
    status: open

