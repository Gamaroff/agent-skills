top_issues:
  - id: 'T296-QA-1'
    severity: medium
    file: 'tests/test-remote-runner.test.js'
    finding: 'The held-lock case asserts doesNotMatch /--unlock\b.*Clear it/ (line 707). In the stale message "Clear it" comes before "--unlock", and the live message says "then --unlock clears it", so the pattern matches neither and the assertion cannot fail. Reproduced: adding "Clear it with: npm run test:remote -- --unlock" to the live message leaves 45/45 green. origin: code-review, reproduced by QA (control: the stale-state case does assert the "Clear it with" line).'
    suggested_action: 'Assert the live-lock output does not match /Clear it with/ and does match /Wait for it to finish/.'
    suggested_owner: dev
    status: open
  - id: 'T296-QA-2'
    severity: medium
    file: 'tests/test-remote-runner.test.js'
    finding: 'The unlock staleness test never exercises the margin or the strict inequality: its live and stale cases (50 min against 60+5 and 30+5) land on the same side with or without the margin, and every later case passes margin 0. Reproduced: replacing (tmo + $2) with (tmo + 0) in lockctl.sh line 42 leaves 45/45 green. origin: code-review, reproduced by QA (control: removing the owner timeout does turn the existing case red).'
    suggested_action: 'Add boundary cases: timeout 30, margin 5, start 34 minutes ago is live and 36 minutes ago is stale; and one case that a lock exactly at the boundary is live.'
    suggested_owner: dev
    status: open

