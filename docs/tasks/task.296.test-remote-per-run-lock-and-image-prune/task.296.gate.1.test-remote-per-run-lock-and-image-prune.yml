gate: CONCERNS
status_reason: 'Behaviour verified (45/45 tests, ci:fast green on the server, live acceptance, validator probed 38 cases). Two guarding tests are weaker than they read: one assertion cannot fail and the staleness margin is held by no test. Both reproduced by mutation.'
