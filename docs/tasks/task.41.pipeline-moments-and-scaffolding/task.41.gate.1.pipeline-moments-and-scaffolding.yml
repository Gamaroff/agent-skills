schema: 1
task: "task.41.pipeline-moments-and-scaffolding"
task_title: "Two new pipeline moments, workflow-file scaffolding, and the develop-bug gap"
gate: FAIL
status_reason: "Both moments, both CLIs and the develop-bug parity fix are correct and well covered. The scaffolder is not: it infers 'file written' from an exit code that is deliberately 0 on write-nothing skips, so an unauthenticated gh leaves the consumer with no tracker-workflow.yaml while the wizard reports success."
reviewer: "QA Engineer"
updated: "2026-08-12T17:05:00Z"

top_issues:
  - id: TASK-41-BUG-1
    severity: high
    finding: "write_tracker_workflow() treats exit 0 from `gh-stage.js --init-workflow` as proof of a write. Both CLIs exit 0 on paths that write nothing (no-credentials, no-repo-context). The wizard then reports 'generated from your live board' and returns early, so the heredoc fallback never runs and NO tracker-workflow.yaml is written. Defeats success criterion F3 on the common case of an unauthenticated gh, which the wizard does not require."
    suggested_action: "Test for the artifact (`[[ -f tracker-workflow.yaml ]]`), not the exit code. Correct for every present and future exit-0 skip reason."
    suggested_owner: dev
    bug_ref: "task.41.bug.1.init-workflow-silent-noop-skips-scaffolding.md"

  - id: TASK-41-BUG-2
    severity: medium
    finding: "A generic Jira ladder is reported as 'generated from your live board'. The wizard invokes the CLI with `>/dev/null 2>&1`, discarding the deliberately loud 'this is a GENERIC ladder / fails SILENTLY' warning, and labels both outcomes identically."
    suggested_action: "Branch on the `fromRecord` field initWorkflow already returns in its --json payload; surface the warning and record_warning when false."
    suggested_owner: dev
    bug_ref: "task.41.bug.2.generic-ladder-mislabelled-as-board-derived.md"

  - id: TASK-41-BUG-3
    severity: medium
    finding: "The scaffolder's live-probe branch has zero test coverage — all five new setup-consumer tests run in a scratch dir with no .agents/skills/ tree, so `-f \"$_cli\"` is false and every test takes the heredoc path. This is why BUG-1 and BUG-2 shipped green at 1099/1099."
    suggested_action: "Add stub-CLI tests covering the three outcomes: exits 0 writing nothing; exits 0 writing a file; exits non-zero."
    suggested_owner: dev
    bug_ref: "task.41.bug.3.scaffolding-probe-branch-untested.md"

