  performance:
    status: PASS
    notes: "changes-requested is bounded by MAX_ITER=5, so ≤5 extra calls per run and only when opted in (P1 met). `--check --offline` issues zero network calls — asserted against the stub's full call log, not merely absence of writes (P2 met)."
  reliability:
    status: CONCERNS
    notes: "BUG-1 is a reliability defect of exactly the class this task set out to eliminate: a silent no-op reported as success. The engine and CLI paths themselves are sound — every documented skip exits 0 deliberately, the inverted --check exit is shimmed on both sides, and the write guards refuse to overwrite. The defect is in the wizard's inference about them, not in the contract."
  maintainability:
    status: PASS
    notes: "Shared validation lives in tracker-workflow.js and is not duplicated per CLI; checkDrift consumes the probe's own resolution rather than re-reading the board. The inverted exit code carries a single-line greppable marker in both CLIs plus tests asserting it. Bundles regenerated and verified in sync by the pre-commit hook."

