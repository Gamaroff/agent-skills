  performance:
    status: PASS
    notes: "No hot path. One extra `gh repo view` per invocation under full; negligible against the mutation it precedes."
  reliability:
    status: FAIL
    notes: "Two unterminated heredocs silently disable an issue close, an issue comment and a review comment. A missing mkdir loses an entire sync edit on a fresh clone. A deferred milestone/sub-issue record is unrunnable from the generated script. Each fails silently — the run reports success."
  maintainability:
    status: PASS
    notes: "The CLI is well-reasoned and heavily commented with the rationale for each non-obvious choice. Five hard-coded roster counts were replaced by derivations, reducing the cost of the next kind addition. Four minor cleanups noted (unused params, duplicated block)."

