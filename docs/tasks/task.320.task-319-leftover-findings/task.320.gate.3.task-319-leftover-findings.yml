    status: open
    bug_ref: 'task.320.bug.1.criteria-heading-narrows-the-search.md'
  - id: 'T320-CR-302'
    severity: low
    file: 'shared/resources/ci-tree-equivalence.js'
    finding: 'Line 560: `(.*)` stops at U+2028 and U+2029, so a line or paragraph separator at an end of the skipMarker row is dropped in silence (reproduced in three places; a no-break space there is refused).'
    suggested_action: 'Let the row pattern cross line terminators.'
    suggested_owner: dev
    status: open
  - id: 'T320-CR-303'
    severity: low
    file: 'shared/resources/ci-tree-equivalence.js'
    finding: 'Line 566: the test of the ends also reads the comment, so a valid row is refused for a no-break space at the end of its comment, or before a `#` in it (reproduced; both parse at the base; a no-break space elsewhere in the comment is accepted).'
    suggested_action: 'Cut the comment off the row before testing the ends.'
    suggested_owner: dev
    status: open
  - id: 'T320-CR-304'
    severity: low
    file: 'shared/resources/finalise-rerun-at-head.js'
    finding: 'Line 299: a line of prose that starts with When, Given or Then counts as a criterion, so an introduction (`When the list below passes, this is done.`) hides the command: none-named (reproduced; `Below.` is scan-broken).'
    suggested_action: 'Ask for a Then line with a Given or a When line.'
    suggested_owner: dev
    status: open
    bug_ref: 'task.320.bug.1.criteria-heading-narrows-the-search.md'
  - id: 'T320-CR-305'
    severity: low
    file: 'shared/resources/finalise-rerun-at-head.js'
    finding: 'Line 290: comment removal knows no fence, so a literal `<!--` in one removes every criterion after it and a document with criteria is refused (reproduced: scan-broken; without the opener none-named, as at the base).'
    suggested_action: 'Open no comment in a fenced line or a code span.'
    suggested_owner: dev
    status: open
  - id: 'T320-CR-306'
