    file: 'shared/resources/finalise-rerun-at-head.js'
    finding: 'Line 940, and 936: comments are removed after the document is split into sections, so a commented-out `## AC1` or `## Acceptance Criteria` counts as holding the criteria: none-named, where 5afd1ebd5 answered scan-broken (reproduced; with no `## ` line in the comment it is scan-broken). origin/develop answers none-named too.'
