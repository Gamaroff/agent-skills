      status: closed
      note: "The pipeline reset is now inside the shape-checked branch; a scalar falls through to the default."
    - id: CR-4
      status: closed
      note: "Bundled parser asserted equal to source modulo the single generated header line; diffed directly."

top_issues:
  - id: CR-5
    issue: "A byIssueType overlay replaces `statuses:` but inherits the base `pipeline:`, and an inherited target absent from the overlay ladder silently becomes an off-ladder side-state."
    severity: medium
    finding: "Verified live: for issue type 'IT / DevOps Task' (overlay ladder [Selected for Development, In Progress, In Review, Done]), `in-review` resolves to the base target 'Waiting for Review' with offLadder:true — a column that type's workflow does not have. validateWorkflow returns no warning because its byIssueType loop only checks moments the overlay itself declares. This is the cycle-1 defect one level down: nobody chose that target for this ladder."
    suggested_action: "Treat a target as inherited when it comes from the built-in default OR from the base pipeline applied to an overlay-replaced ladder, and resolve an inherited miss against the corresponding DEFAULT_LADDER rung's full alias list before falling back to off-ladder; extend validateWorkflow's byIssueType loop to check inherited moments against the per-type ladder."
    suggested_owner: dev

