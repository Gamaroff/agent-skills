  verified:
    - id: CR-1
      status: closed
      note: "DEFAULT_PIPELINE is name-based; no numeric branch survives in resolveMoment or validateWorkflow. For a no-file consumer the names resolve to rungs 1/2/5 and describeTarget returns the full rung list, confirmed byte-identical to IN_PROGRESS_CANDIDATES / REVIEW_CANDIDATES / DONE_CANDIDATES in order."
    - id: CR-2
      status: closed
      note: "byIssueType deep-copied; parseYamlSubset output is JSON-safe by construction so the round-trip is lossless."
