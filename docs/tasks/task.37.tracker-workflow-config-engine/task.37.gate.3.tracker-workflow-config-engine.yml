bug_resolution:
  bugs_fixed: 1
  bugs_remaining: 0
  fix_date: "2026-08-04"
  total_iterations: 2
  verification_method: "Re-ran the CR-5 reproduction; traced the new inherited/alias path and executed the module against adversarial overlay shapes."
  verified:
    - id: CR-5
      status: closed
      note: "in-review for 'IT / DevOps Task' now resolves to In Review at rank 2 instead of the base ladder's 'Waiting for Review' off-ladder. The alias gap closed with it, and the authored-target boundary is tested in both base and overlay forms. The concept is right; two implementation defects remain (below)."

top_issues:
  - id: CR-6
    issue: "`isInherited` and `ladderFor` disagree about when an overlay ladder is actually in play, so an authored base target can be silently alias-rerouted."
    severity: medium
    finding: "`isInherited` tests `overlay.statuses.length`, but `ladderFor` requires at least one rung that survives `normalizeRung`. An overlay whose `statuses:` is non-empty but wholly unusable therefore leaves the BASE ladder in play while still being flagged inherited. Verified: base ladder [In Progress, Closed] with authored `done: Ready for Showcase` — base resolves to the off-ladder side-state 'Ready for Showcase', while the overlay type resolves to 'Closed' at rank 1 off the identical ladder. That is exactly the silent reroute of an explicit choice that the fix's own comment forbids."
    suggested_action: "Resolve the ladder once and report whether the overlay was actually applied, then derive `inherited` from that single answer so the two cannot disagree."
    suggested_owner: dev
  - id: CR-7
    issue: "The new per-issue-type warning fires for moments that are off-ladder by design, contradicting the base loop's own classification of the same target."
    severity: medium
    finding: "The byIssueType inherited-miss loop warns on every off-ladder inherited moment, including `blocked` and `pr-merged`, which have no DEFAULT_RUNG_FOR_MOMENT entry precisely because they are side-states. Verified: an authored `blocked: Blocked` plus one overlay type emits both `info: pipeline.blocked … treating it as an off-ladder side-state` and `warn: blocked for issue type 'Ops Request' … declare it … or set it to ~`. The two messages describe the same target and disagree, and the warn tells the author to act on something correct."
    suggested_action: "Skip moments with no DEFAULT_RUNG_FOR_MOMENT entry in the per-type loop, so the warning fires only when the overlay's replaced ladder is what caused the miss."
    suggested_owner: dev

