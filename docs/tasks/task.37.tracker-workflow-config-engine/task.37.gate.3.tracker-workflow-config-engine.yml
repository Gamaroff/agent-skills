status_reason: "CR-5 is fixed and the inherited concept is the right abstraction, but the cycle-2 implementation has two defects of its own: `isInherited` and `ladderFor` disagree about when an overlay is in play, which reroutes an authored target on the base ladder; and the new per-type warning fires for side-states that are off-ladder by design."
reviewer: "QA Engineer"
updated: "2026-08-04T17:30:00Z"

