  total_iterations: 3
  verification_method: "Executed the module against adversarial overlay shapes; re-ran each prior reproduction; confirmed the default-ladder snapshot still derives from jira-sync.js's live constants."
  verified:
    - id: CR-6
      status: closed
      note: "resolveLadder returns {ladder, fromOverlay} from one decision; ladderFor is a thin wrapper. An unusable overlay now inherits nothing."
    - id: CR-7
      status: closed
      note: "Per-type loop no longer warns about deliberate side-states — but the guard chosen was too broad; see CR-8."

top_issues:
  - id: CR-8
    issue: "The CR-7 guard keyed on `DEFAULT_RUNG_FOR_MOMENT[moment] == null`, which also silenced genuine per-type inherited misses for `changes-requested`, `pr-merged` and `blocked`."
    severity: high
    finding: "Verified: a config with `pipeline.changes-requested: In Review` (on the base ladder) plus an `Ops Request` overlay omitting `In Review` warned correctly at the previous commit and emitted zero warnings after the fix, while the moment silently resolved off-ladder for that type. The guard was aimed at 'this moment is a side-state' but expressed as 'this moment has no default rung', and the two are not the same predicate."
    suggested_action: "Skip only when the BASE resolution is itself off-ladder — that is the actual discriminator for a deliberate side-state — rather than keying on the absence of a default rung."
    suggested_owner: dev
  - id: CR-9
    issue: "`fromOverlay` answered 'did the overlay supply rungs?' rather than 'is the ladder in play actually different?'"
    severity: medium
    finding: "Verified: an overlay restating the base ladder verbatim still marked base targets inherited, so an authored `done: Ready for Showcase` resolved to the correct off-ladder side-state for the base and was rerouted to `Closed` at rank 1 for that issue type — violating the invariant the diff's own CR-6 test asserts, reached by a different route."
    suggested_action: "Set `fromOverlay` only when the overlay's rungs actually differ from the base ladder's, comparing normalised name lists."
    suggested_owner: dev

