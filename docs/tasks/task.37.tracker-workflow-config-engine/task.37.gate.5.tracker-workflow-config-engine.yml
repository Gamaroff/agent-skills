nfr_validation:
  security:
    status: PASS
    notes: "No HTTP, no gh, no credential handling, no user input reaching a shell. The single execSync is a fixed `git rev-parse --show-toplevel` with no interpolation, asserted by test to be the only one. Independence from jira-sync.js asserted behaviourally via a clean child process's require cache, so a GitHub-only consumer cannot acquire the Jira client transitively."
  performance:
    status: PASS
    notes: "Parse cached per resolved path, asserted by intercepting fs.readFileSync. The ladder is now resolved once per resolveMoment and lazily, so the five moments disabled under the built-in default cost nothing; validateWorkflow memoises base resolutions across both its loops. develop-batch's 41 unit tests unchanged."
  reliability:
    status: PASS
    notes: "The defect class this review chased for four cycles — a target chosen against one ladder silently resolved against another — is closed at the root, and its boundaries are pinned in both directions: an inherited miss alias-resolves and warns; an authored miss stays a side-state and never reroutes. Swallow-everything holds; missing, unreadable, malformed and wrong-shaped inputs all yield defaults and nothing throws."
  maintainability:
    status: PASS
    notes: "Upgraded from CONCERNS. The meta-cause of cycles 2–4 was one truth computed in several places; the final structure has one ladder scan (rankIn), one overlay decision (resolveLadder), one base resolution per moment (memoised), and one representation for pipeline targets. Rationale is written down at each of those, naming the failure it prevents. 91 tests across the two suites, several of which assert boundaries rather than happy paths."

