schema: 1
task: "task.37.tracker-workflow-config-engine"
task_title: "tracker-workflow.yaml — a consumer-owned status ladder the pipelines read"
gate: CONCERNS
status_reason: "All 4 phases complete and 816/816 tests pass, but the diff review found that a file declaring `statuses:` without `pipeline:` inherits rung INDICES authored against the default ladder — silently disabling `done` on a custom ladder, unreported by validateWorkflow."
reviewer: "QA Engineer"
updated: "2026-08-04T16:35:00Z"

top_issues:
  - id: CR-1
    issue: "A file with `statuses:` but no `pipeline:` keeps DEFAULT_PIPELINE, whose values are rung indices authored against the built-in 6-rung ladder; applied to a consumer's custom ladder those indices are meaningless by construction."
    severity: medium
    finding: "Verified live on a 4-rung ladder [Backlog, In Progress, In Review, Done]: work-started→rung 1 and in-review→rung 2 resolve correctly only by coincidence of position, while done (index 5) resolves to null and never fires. validateWorkflow reports nothing because it unconditionally skips numeric targets."
    suggested_action: "Make DEFAULT_PIPELINE name-based so it resolves by name against whatever ladder is in play, and drop validateWorkflow's numeric-target skip so an unresolvable default moment is reported."
    suggested_owner: dev
  - id: CR-2
    issue: "cloneWorkflow assigns `byIssueType` by reference, so the cache-poisoning guard it documents does not hold for overlays."
    severity: low
    finding: "Verified: mutating wf.byIssueType.<type>.pipeline after one loadWorkflow makes every subsequent loadWorkflow in the process return the poisoned overlay. The function's own comment claims it is 'deep enough that no caller can mutate the cached entry'."
    suggested_action: "Deep-copy byIssueType in cloneWorkflow and extend the cache-poisoning test to cover an overlay."
    suggested_owner: dev

