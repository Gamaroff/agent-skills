nfr_validation:
  security:
    status: PASS
    notes: "Engine is pure — no HTTP, no gh, no shell beyond the single `git rev-parse --show-toplevel` fallback, asserted by a test that greps execSync call sites. No secrets, no user input reaching a shell. Purity from jira-sync.js asserted behaviourally via a clean child process's require cache."
  performance:
    status: PASS
    notes: "Parse cached per resolved path; a test intercepts fs.readFileSync and asserts exactly one read across three loadWorkflow calls. develop-batch scheduling unchanged — its 41 unit tests pass without modification."
  reliability:
    status: CONCERNS
    notes: "Swallow-everything contract holds and nothing throws on missing/unreadable/malformed/wrong-shaped input. But CR-1 means a plausible, well-formed consumer file silently disables the `done` moment with no warning — a silent wrong answer is worse than the throw the contract exists to avoid. CR-3 (advisory) compounds it: a wrong-shaped `pipeline:` block disables every moment while the warning says 'ignoring it' and the reference doc promises a fallback to defaults."
  maintainability:
    status: CONCERNS
    notes: "Code is clear, densely commented with rationale, and comprehensively tested (74 new tests across two suites). The default-ladder snapshot deriving from jira-sync's exported constants is a genuinely strong regression guard. Deduction is for CR-4: schedule.mjs now executes the bundled copy in-repo, and nothing asserts it matches the shared source — an edit to shared/resources without `npm run bundle` leaves develop-batch on a stale parser with every suite green."

