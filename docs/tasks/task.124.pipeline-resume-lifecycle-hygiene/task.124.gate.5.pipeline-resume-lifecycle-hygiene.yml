top_issues:
  - id: 'CR-1'
    severity: medium
    file: 'shared/resources/develop-pipeline-resume-contract.md'
    finding: 'The loop-limit|not-converging → do-not-restore exception is stated unconditionally for all three pipelines in the two shared sources develop-bug bundles (resume contract "Restore the lock (both resume paths)"; step-0 §0b, whose command line names develop-bug), while develop-bug/SKILL.md:69 now says it has no grant and restores on every snapshot — a develop-bug run that follows the shared text after its 5-cycle "not converging" HALT waits for a grant prompt that does not exist and fails at its first numeric advance.'
    suggested_action: 'Scope the exception to develop-task/develop-story in the same sentence that states it, in both shared sources, and name develop-bug as the pipeline that restores on every snapshot.'
    suggested_owner: dev
    bug_ref: 'task.124.bug.13.shared-sources-state-grant-exception-for-develop-bug.md'
    status: open
  - id: 'CR-2'
    severity: medium
    file: 'shared/resources/develop-pipeline-resume-contract.md'
    finding: 'The working-tree probe sets BASE_REF="origin/${BASE_BRANCH:-develop}" but no pipeline binds BASE_BRANCH (the Q1 base lives only as prose in Phase 0d, which a resume skips, and the lock carries no base field), so on a hotfix off main or an epic-integration branch an uncommitted file whose bytes equal develop is class (a) and discarded by git checkout HEAD, while a genuine overlay of the real base falls to (c) and HALTs.'
    suggested_action: 'Derive the base from recorded state — gh pr view --json baseRefName when the lock has pr_url, else record base_branch in the lock at Step 1 and read it — and never from an unbound shell variable with a develop default.'
    suggested_owner: dev
    bug_ref: 'task.124.bug.14.probe-base-branch-never-bound.md'
    status: open

