task_title: 'Resume trusts what it finds on disk'
gate: CONCERNS
status_reason: 'Cycle-4 findings CR-1..CR-4 verified FIXED in isolation (one restore statement in the contract; develop-bug exception dropped; two labels; Cost sentence). The narrowed cycle-5 review found no HIGH and no mechanism regression, but two MEDIUM defects remain in the executed prose: the develop-bug fix moved the contradiction one file over — the two shared sources develop-bug bundles (resume contract Phase 0a, step-0 §0b) still state the loop-limit exception for all three pipelines while develop-bug now says it has none; and the working-tree probe classifies against `origin/${BASE_BRANCH:-develop}` although nothing in any pipeline ever binds BASE_BRANCH, so a hotfix off main or an epic-integration branch is classified against develop. Reliability CONCERNS.'
reviewer: 'QA Engineer'
