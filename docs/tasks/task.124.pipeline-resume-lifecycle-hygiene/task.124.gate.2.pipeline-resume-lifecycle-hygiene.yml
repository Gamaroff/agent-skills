schema: 1
task: 'task.124.pipeline-resume-lifecycle-hygiene'
task_title: 'Resume trusts what it finds on disk'
gate: FAIL
status_reason: 'Cycle-1 findings CR-1..CR-4 verified FIXED (GNU coreutils container 43/43; staged-overlay reproduction; budget override; derived population). The cycle-2 refute pass found two new HIGH defects in the mechanisms themselves: the stale-snapshot rule fires on `status: accepted`, which finalise writes before Step 8, and the re-invocation resume path never restores the lock — so every re-invoked resume now fails at its first advance. Two MEDIUM on the fixes combination and porcelain parsing.'
reviewer: 'QA Engineer'
updated: '2026-09-19T14:15:01Z'

top_issues:
  - id: 'CR-1'
    severity: high
    file: 'shared/resources/pipeline-resume-detector-prompt.md'
    finding: 'The stale-snapshot rule deletes a same-document last-halt.json when the document reads `status: accepted` — a state finalise writes at Step 7 6a, before CI reading 2 and Step 8 — so a legitimate post-acceptance HALT or pause loses its resume record on the next invocation.'
    suggested_action: 'Key the deletion on evidence the run finished (PR MERGED) only; drop the `status: accepted` disjunct.'
    suggested_owner: dev
    bug_ref: 'task.124.bug.5.stale-snapshot-rule-fires-on-accepted.md'
    status: open
  - id: 'CR-2'
    severity: high
    file: 'shared/resources/develop-pipeline-resume-contract.md'
    finding: 'The re-invocation resume path (Phase 0b Resume) skips Step 1 and has no `--restore` step, so with the numeric advance now exit 1 every re-invoked resume at step ≥ 2 fails at its first transition.'
    suggested_action: 'Run `advance-pipeline-lock.sh --restore {doc-directory}` in Phase 0b when the detector source is halt_snapshot / orphaned_claim and the operator chooses Resume — step-0 §0b, the resume contract, the three orchestrators.'
    suggested_owner: dev
    bug_ref: 'task.124.bug.6.reinvocation-resume-never-restores-lock.md'
    status: open
  - id: 'CR-3'
    severity: medium
    file: 'shared/resources/advance-pipeline-lock.sh'
    finding: '`--restore` keeps a `waiting_on` captured in a PreCompact snapshot while `--clear` in the no-lock window is a no-op, so the rebuilt lock carries a stale wait that makes the Stop hook allow every stop until the budget elapses.'
    suggested_action: 'del(.waiting_on) in the restore jq; document and test the drop.'
    suggested_owner: dev
    bug_ref: 'task.124.bug.7.restore-carries-stale-waiting-on.md'
    status: open
  - id: 'CR-4'
    severity: medium
    file: 'shared/resources/develop-pipeline-resume-contract.md'
    finding: 'The probe parses porcelain with `p=${line:3}`, so a staged rename or quoted path becomes a no-match pathspec that is classed overlay, "discarded" without effect, and re-read clean by the same pathspec.'
    suggested_action: '`git status --porcelain --no-renames`; quoted paths → class (c); re-read the FULL porcelain and HALT on any survivor.'
    suggested_owner: dev
    bug_ref: 'task.124.bug.8.probe-mishandles-renames-and-quoted-paths.md'
    status: open

