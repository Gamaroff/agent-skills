top_issues:
  - id: 'CR-1'
    severity: medium
    file: 'shared/resources/develop-pipeline-resume-contract.md'
    finding: 'Phase 0b runs `--restore` at the Resume choice, before the grant prompt; on a loop-escalation snapshot a declined or refused grant then leaves a restored lock and a consumed snapshot, contradicting re-entry step 4 and the task.123 refusal-leaves-nothing-behind rule.'
    suggested_action: 'Branch on halt_reason before restoring: on loop-limit|not-converging the grant prompt comes first and the grant restores; a plain Resume restores directly; rewrite step 4.'
    suggested_owner: dev
    bug_ref: 'task.124.bug.9.restore-before-grant-defeats-refusal.md'
    status: open
  - id: 'CR-2'
    severity: medium
    file: 'shared/resources/develop-pipeline-resume-contract.md'
    finding: '`git diff --quiet $BASE_REF -- $p` is 0 for a path absent on both sides, so an uncommitted deletion of a branch-added file is classed overlay and `git checkout HEAD -- $p` re-creates it under a success line (reproduced).'
    suggested_action: 'Require `git cat-file -e "$BASE_REF:$p"` on the tracked arm before the diff test, mirroring the `??` arm.'
    suggested_owner: dev
    bug_ref: 'task.124.bug.10.probe-recreates-deleted-branch-added-file.md'
    status: open
  - id: 'CR-3'
    severity: low
    file: 'docs/tasks/task.124.pipeline-resume-lifecycle-hygiene/task.124.pipeline-resume-lifecycle-hygiene.md'
    finding: 'The Target Architecture block still says the detector refuses a snapshot whose document reads status: accepted or whose PR is merged — the rule cycle 2 reversed.'
    suggested_action: 'Rewrite the line: MERGED only; accepted alone never fires.'
    suggested_owner: dev
    status: open
  - id: 'CR-4'
    severity: low
    file: 'shared/resources/develop-pipeline-resume-contract.md'
    finding: 'Table row (a) and task.124.md:218 still say the re-read is "over those paths", while the snippet re-reads the whole tree and says why the scoped form is vacuous.'
    suggested_action: 'Change both sentences to the full `git status --porcelain --no-renames` re-read.'
    suggested_owner: dev
    status: open
  - id: 'CR-5'
    severity: low
    file: 'shared/resources/pipeline-resume-detector-prompt.md'
    finding: 'platform-variance: the MERGED check is `gh pr view`, so a Bitbucket pr_url makes the rule silently inert (a merged-work snapshot stays a candidate).'
    suggested_action: 'State the rule as GitHub-only (a Bitbucket snapshot is always an ordinary candidate) or branch on the URL host.'
    suggested_owner: dev
    status: open

