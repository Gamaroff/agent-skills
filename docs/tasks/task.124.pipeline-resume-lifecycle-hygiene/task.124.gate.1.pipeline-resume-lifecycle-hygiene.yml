schema: 1
task: 'task.124.pipeline-resume-lifecycle-hygiene'
task_title: 'Resume trusts what it finds on disk'
gate: FAIL
status_reason: 'All four phases implemented and green on macOS, but the --restore mtime read uses the BSD stat form, which on GNU coreutils is filesystem mode — the newest-candidate rule is not honoured on Linux and the lock-helper suite is red there (CI will fail). Three medium findings on the new waiting_on/probe mechanisms.'
reviewer: 'QA Engineer'
updated: '2026-09-19T13:50:10Z'

top_issues:
  - id: 'CR-1'
    severity: high
    file: 'shared/resources/advance-pipeline-lock.sh'
    finding: 'platform-variance: `stat -f %m || stat -c %Y` is filesystem mode on GNU coreutils, so $m is non-numeric and the first candidate (last-halt.json) always wins; advance-pipeline-lock.test.sh fails on Linux (orphaned-claim scenario).'
    suggested_action: 'Try `stat -c %Y` first, fall back to `stat -f %m`, and validate the result is all digits before comparing (non-numeric → 0 with a stderr warning).'
    suggested_owner: dev
    bug_ref: 'task.124.bug.1.restore-mtime-gnu-stat.md'
    status: open
  - id: 'CR-2'
    severity: medium
    file: 'skills/finalise/SKILL.md'
    finding: 'The Step 7 CI poll is marked with the 10-minute config budget but runs up to FINALISE_CI_MAX_WAIT (25 min); the Stop hook re-prompts for the last 15 minutes and the docs now call that a crashed dispatch.'
    suggested_action: 'Add `--budget-minutes N` to set-waiting-on.sh and pass the poll bound at the finalise site.'
    suggested_owner: dev
    bug_ref: 'task.124.bug.2.ci-poll-wait-outlives-budget.md'
    status: open
  - id: 'CR-3'
    severity: medium
    file: 'evals/shared/tests/qa-loop-lock-fields-parity.test.mjs'
    finding: 'Dispatch-site population is hand-listed (five files) and the pattern is case-sensitive; qa-task Step 3b and qa-story:566 dispatch inside 5a with no set-waiting-on call and the test cannot see them.'
    suggested_action: 'Enumerate sources from the directories the hooks doc names, widen the pattern, and mark the two QA-skill dispatches.'
    suggested_owner: dev
    bug_ref: 'task.124.bug.3.dispatch-population-hand-listed.md'
    status: open
  - id: 'CR-4'
    severity: medium
    file: 'shared/resources/develop-pipeline-resume-contract.md'
    finding: 'A staged overlay entry passes the working-tree test but `git checkout -- <path>` restores from the index, so it survives under an "overlay discarded" line and Step 3 commits it.'
    suggested_action: 'Discard index and worktree from HEAD (`git checkout HEAD -- <paths>`) and re-read porcelain afterwards, halting on any survivor.'
    suggested_owner: dev
    bug_ref: 'task.124.bug.4.staged-overlay-not-discarded.md'
    status: open

