schema: 1
task: "task.79.security-input-corpus"
task_title: "Write down the inputs that defeat each sink, once"
gate: FAIL
status_reason: >-
  Every success criterion verifies and CI is green on the head commit, but the
  non-restatement guard — the one mechanism Phase 4 exists to install — is
  vacuous against the exact restatement it names: run against the pre-change
  prompt it reports zero findings. Six further medium issues are factual errors
  in the corpus's own `why` fields, a documented import that cannot resolve, and
  two missing parity/purity assertions.
reviewer: "QA Engineer"
updated: "2026-09-06T21:20:00Z"

top_issues:
  - id: "CR-1"
    severity: high
    file: "evals/shared/tests/finalise-dod-prompt-contract.test.mjs"
    finding: >-
      The non-restatement guard requires verbatim containment of a WHOLE corpus
      input, but real restatement is fragmentary. VERIFIED by QA: run against
      `origin/develop`'s prompt — the axis table this change deletes, which is
      the defect the guard is named for — it reports 0 restatements and passes.
      The fragments actually present there (`g\h`, `g"h"`, `-o`, `--output`,
      `a; b`, `a && b`) are all substrings of corpus inputs and none match. The
      develop-run mutation proof passed only because it re-added two inputs in
      full, which is not the shape restatement takes.
    suggested_action: >-
      Assert on distinctive input fragments or a token-overlap threshold rather
      than full-string containment, and seed the guard with the deleted
      axis-table text as a fixture that MUST fail. Mutation-prove it against
      that fixture, not against a full-input re-insertion.
    suggested_owner: dev
    status: open

  - id: "CR-2"
    severity: medium
    file: "shared/resources/security-input-corpus.mjs"
    finding: >-
      `url-authority.userinfo-delimiter`'s `why` is wrong for the reference
      parser. VERIFIED: `new URL("postgres://u:p@ss@h/db")` yields password
      `p%40ss` and host `h` — WHATWG splits at the LAST `@`, so the connection
      is not re-pointed.
    suggested_action: >-
      Qualify the claim to naive first-`@`-splitting DSN parsers rather than
      stating re-pointing as unconditional.
    suggested_owner: dev
    status: open

  - id: "CR-3"
    severity: medium
    file: "shared/resources/security-input-corpus.mjs"
    finding: >-
      `url-authority.port-delimiter`'s `why` says the value is truncated at the
      colon "either way". VERIFIED: in the password position it is preserved —
      `new URL("postgres://u:pa:ss@h/db").password === "pa%3Ass"`.
    suggested_action: >-
      Name the position the truncation applies to and drop the "either way"
      generalisation.
    suggested_owner: dev
    status: open

  - id: "CR-4"
    severity: medium
    file: "shared/resources/security-input-corpus.mjs"
    finding: >-
      `url-authority.empty-host`'s `why` asserts `scheme://:5432/db` "parses".
      VERIFIED: `new URL("postgres://:5432/db")` throws ERR_INVALID_URL.
    suggested_action: >-
      Name the specific DSN parsers that accept it and default to localhost,
      instead of claiming the URL grammar accepts it.
    suggested_owner: dev
    status: open

  - id: "CR-6"
    severity: medium
    file: "shared/resources/finalise-dod-security-prompt.md"
    finding: >-
      The new fenced example imports from the bare specifier
      `"shared/resources/security-input-corpus.mjs"`. VERIFIED: that throws
      ERR_MODULE_NOT_FOUND, and so does the bundler's rewrite to
      `"references/…"`. The prompt's own step 3 tells the agent to run the
      script from a temporary directory, where it cannot resolve either. The
      same broken specifier appears in `security-input-corpus.md:258`. A corpus
      whose method ordering puts execution first ships an example that does not
      execute.
    suggested_action: >-
      Use a specifier that resolves from both locations. VERIFIED that a
      sibling-relative `./security-input-corpus.mjs` resolves against both
      `shared/resources/` and `skills/finalise/references/`, and survives the
      bundler rewrite untouched. For the temp-dir case, show an absolute path
      built from the repo root.
    suggested_owner: dev
    status: open

  - id: "CR-7"
    severity: medium
    file: "shared/resources/security-input-corpus.md"
    finding: >-
      The bundled copy keeps the source's `../../docs/...` provenance links,
      which from `skills/finalise/references/` resolve to `skills/docs/...`.
      VERIFIED: both targets are absent — the shipped artefact has two broken
      links, and CI's link-check did not catch them.
    suggested_action: >-
      Make the two provenance references path-free in the source (name the
      documents rather than linking them, as the file already does for
      `evals/shared/tests/...`), so no depth-sensitive link survives bundling.
    suggested_owner: dev
    status: open

  - id: "CR-8"
    severity: medium
    file: "evals/shared/tests/finalise-dod-prompt-contract.test.mjs"
    finding: >-
      Only `finalise-dod-security-prompt.md` has a bundled-copy-in-step test.
      VERIFIED: the three new bundled artefacts —
      `skills/finalise/references/security-input-corpus.{md,mjs}` and
      `mutation-proving.md` — have none, and `npm run ci:fast` never runs the
      bundler. A source edit that is not re-bundled ships a stale corpus to the
      agent, which is the failure the corpus exists to prevent.
    suggested_action: >-
      Extend the existing bundled-parity test to cover every reference the
      prompt pulls in transitively, not just the prompt itself.
    suggested_owner: dev
    status: open

  - id: "TASK79-001"
    severity: medium
    file: "shared/resources/tests/security-input-corpus.test.mjs"
    finding: >-
      Success criterion "the corpus contains inputs only — no execution, no side
      effects on import" has no assertion. VERIFIED that purity holds today
      (zero import/require statements; the only `process.` is inside a case's
      input string), but it is enforced only incidentally by two successful
      imports. An edit adding `node:child_process` or a top-level side effect
      would pass every existing test.
    suggested_action: >-
      Assert the module's own source carries no import/require statement and no
      reference to a side-effecting builtin outside string literals.
    suggested_owner: dev
    status: open

  - id: "CR-10"
    severity: low
    file: "shared/resources/tests/security-input-corpus.test.mjs"
    finding: >-
      The row-count regex matches any doc line beginning with a code span, so a
      future non-case table in the same document inflates the count and fails
      with a message blaming the corpus for a row it does not own.
    suggested_action: >-
      Count rows only inside the `#### Hostile` / `#### Legitimate` slices.
    suggested_owner: dev
    status: open

  - id: "CR-11"
    severity: low
    file: "evals/shared/tests/finalise-dod-prompt-contract.test.mjs"
    finding: >-
      The `length >= 8` filter exempts 14 cases, not only the ordinary
      punctuation the comment names — `p@ss`, `pa:ss`, `[::1]`, `a/b+c=d`,
      `O'Brien`, `50% off` are all exempt — while admitting generic strings
      (`cat README.md`, `.gitkeep`, `Tom & Jerry`) that an incidental future
      prompt example would trip as a false failure.
    suggested_action: >-
      Replace the length heuristic with an explicit per-case opt-out on the
      corpus, so exemptions are named and reviewed rather than inferred.
    suggested_owner: dev
    status: open

