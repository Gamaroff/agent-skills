nfr_validation:
  security:
    status: CONCERNS
    notes: >-
      The deliverable IS a security artefact, so the accuracy of its `why`
      fields is a security property: four url-authority cases describe failure
      modes the reference parser does not exhibit (CR-2/3/4, plus advisory
      CR-5). A probe comparing "expected silent truncation" against "actual
      throw" reports a false finding. The module itself is inert on import
      (verified empirically) and contains no executable payload.
  performance:
    status: PASS
    notes: >-
      Pure data, 2ms import, 73 frozen cases. `allCases()` rebuilds its array
      per call (CR-16, advisory) — immaterial at this size.
  reliability:
    status: PASS
    notes: >-
      Rollback verified: the §11 command
      (`node --test evals/shared/tests/finalise-dod-prompt-contract.test.mjs`)
      is green, and the two new files are inert until task.80 consumes them.
      `corpusFor` throws on every unknown key including `__proto__`,
      `constructor`, `toString`, `hasOwnProperty` and `""`.
  maintainability:
    status: CONCERNS
    notes: >-
      The guard installed to stop drift does not detect the drift it names
      (CR-1); three transitively-bundled artefacts have no parity test (CR-8);
      the doc's tables were produced by an uncommitted generator whose renderer
      is duplicated in the test (CR-15, advisory); two tests are vacuous or
      subsumed (CR-13/14, advisory).

