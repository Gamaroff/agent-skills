    notes: "Strong: the parser and lifecycle vocabulary are imported from select-next.mjs rather than restated, and every non-obvious decision carries its rationale. But TASK-103-002 and TASK-103-004 are both comments/test-names asserting more than the code does — the same overstatement class the task was filed to remove, reintroduced in its own implementation."

