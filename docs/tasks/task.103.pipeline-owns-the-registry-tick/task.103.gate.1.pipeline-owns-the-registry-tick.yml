schema: 1
task: "task.103.pipeline-owns-the-registry-tick"
task_title: "Nothing updates the task-registry row after a task is accepted"
gate: FAIL
status_reason: "Implementation is sound and thoroughly mutation-proven, but the drift check is row-driven only: an `accepted` task document with no registry row passes it, while finalise's reason table and the standard both promise CI will fail on exactly that case. Proven by probe."
reviewer: "QA Engineer"
updated: "2026-09-10T09:55:00Z"

top_issues:
  - id: "TASK-103-001"
    severity: high
    file: "evals/shared/tests/task-registry-drift.test.mjs"
    finding: "The check iterates registry ROWS only, so a task document with `status: accepted` and no row at all is invisible to it. Three shipped claims say otherwise: skills/finalise/SKILL.md:932 (`no-row` -> 'CI's drift check will fail on this'), skills/finalise/SKILL.md:1446 (DoD line), and docs/standards/task-registry.md ('a write that does not happen ... is loud rather than silent'). Verified: an accepted task.998 document with no row leaves the suite 3/3 green."
    suggested_action: "Add a fourth test that walks docs/tasks/*/task.{N}.*.md and asserts every task document has a registry row — the document-driven direction the row-driven tests structurally cannot see. Carry its own non-vacuity floor."
    suggested_owner: dev
    status: open
  - id: "TASK-103-002"
    severity: medium
    file: "shared/resources/tests/registry-tick.test.mjs"
    finding: "The test named 'cell padding is preserved so an aligned table stays aligned' asserts only /\\| accepted +\\|/ — that SOME trailing padding survives. The width actually shifts: ' planned              ' (22 chars) becomes ' accepted              ' (23). The test name, its docstring ('a whole-file diff') and the CLI's own comment ('so a column-aligned table stays aligned') all claim a property the code does not have and the test does not check."
    suggested_action: "Preserve total cell width by absorbing the length delta into the trailing padding when there is room, and strengthen the assertion to compare cell lengths exactly. Where the new value is longer than the cell, say so in the comment rather than claiming alignment."
    suggested_owner: dev
    status: open
  - id: "TASK-103-003"
    severity: low
    file: "shared/resources/registry-tick.js"
    finding: "Line 236: `original.replace(/^(\\s*)\\|/, \"$1|\")` before `.split(\"|\")` is a no-op — it replaces a leading pipe with itself. Confirmed by execution."
    suggested_action: "Delete the replace; split the original line directly."
    suggested_owner: dev
    status: open
  - id: "TASK-103-004"
    severity: low
    file: "shared/resources/registry-tick.js"
    finding: "The story-guard comment says 'Two independent signals must both say \"task\"', but the condition `(docType && docType !== \"task\")` lets an ABSENT `type:` through — a task document with no frontmatter type is accepted on the filename alone. The behaviour is the right one (legacy documents predate OKF `type`); the comment describes a stricter rule than the code implements."
    suggested_action: "Reword the comment: the filename stem is required, and `type` may only CONTRADICT it, not be missing. Say why absence is tolerated."
    suggested_owner: dev
    status: open

