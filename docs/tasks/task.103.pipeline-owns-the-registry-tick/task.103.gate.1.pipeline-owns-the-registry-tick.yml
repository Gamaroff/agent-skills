  performance:
    status: PASS
    notes: "Drift check adds ~0.2s to a ~107s suite. The tick is one file read plus one write, guarded by an early `already` short-circuit that makes a re-run free."
  reliability:
    status: PASS
    notes: "Every CLI outcome exits 0 by design so acceptance cannot be blocked; idempotent; --dry-run available; `ambiguous-row` refuses rather than guessing, which is the correct direction since a wrong row is worse than a stale one. All guards mutation-proven."
  maintainability:
