task: "task.200.tracker-side-effects-after-their-gate"
task_title: "Tracker side effects after their gate"
gate: FAIL
status_reason: "All 5 phases implemented, and ci:fast passes 6054/0. One HIGH: bash cannot parse the resolver guard line in any of the eight migrated GitHub sites, so every ensure/sync link block fails before it runs. No committed test executes those lines. Three MEDIUMs: an unbound relative path in three sync sites, a Step 2 halt message that can be false, and create-epic's unmigrated HEAD-derived link."
reviewer: "QA Engineer"
head: "4d50bbaa0b6cb40bdf2ca82c54386d790c17705c"
updated: "2026-10-20T18:38:08Z"

top_issues:
  - id: "TASK-200-001"
    severity: high
    file: "skills/ensure-task-github-issue/SKILL.md"
    bug_ref: "task.200.bug.1.guard-message-apostrophe-breaks-site-parse.md"
    finding: >-
      The guard line `: "${DOC_BRANCH:?… is the skill's bundled copy of it present?}"` in all eight
      migrated sites (ensure-{bug,epic,story,task}-github-issue, sync-github-{bug,epic,story,task})
      does not parse under bash. The apostrophe inside the double-quoted `${VAR:?word}` opens a quote
      that never closes, giving "unexpected EOF while looking for matching `''", exit 2. Reproduced by
      executing each site's two lines verbatim; a three-line script reproduces it too. Nothing in the
      suite executes these lines: the population test greps them, and Step 4b skips them as mutating.
    suggested_action: >-
      Remove the apostrophe from the guard message. Add a committed test that extracts the two site
      lines from each of the eight SKILL.md files and executes them under bash (and zsh where
      installed), asserting each prints a branch. Mutation-prove it by restoring the apostrophe.
    suggested_owner: dev
  - id: "TASK-200-002"
    severity: medium
    file: "skills/sync-github-task/SKILL.md"
    bug_ref: "task.200.bug.2.sync-sites-read-an-unbound-relative-path.md"
    finding: >-
      The update blocks in sync-github-task (line 110), sync-github-bug (111) and sync-github-story
      (157) pass `${TASK|BUG|STORY_RELATIVE_PATH}` to the resolver, and no writer exists in the file.
      The resolver exits 2 on an empty --doc, and the `:?` guard then stops the update path with a
      message blaming a missing bundled copy. On develop the same unbound read only degraded the URL.
    suggested_action: >-
      Bind the repo-relative path inside each block, or substitute a {placeholder}. Word the guard to
      cover a resolver usage error. Run the blocks in the BUG-1 test with only their named inputs.
    suggested_owner: dev
  - id: "TASK-200-003"
    severity: medium
    file: "skills/develop-bug/SKILL.md"
    bug_ref: "task.200.bug.3.step-2-halt-can-still-post-blocked.md"
    finding: >-
      The Step 2 halt rows say "nothing was pushed or posted". The terminal-HALT rule (SKILL.md:360)
      still signals Jira `blocked` whenever TRACKER_ISSUE is set, and Phase 0c binds it from an
      existing jira_key. A STALE or DUPLICATE bug that already has a card is therefore moved to
      Blocked before READY TO FIX.
    suggested_action: >-
      Exempt Step 2 fix-readiness halts from the `blocked` signal, or make the halt message name the
      signal when it fires. Pin the choice in develop-bug.test.js.
    suggested_owner: dev
  - id: "TASK-200-004"
    severity: medium
    file: "skills/create-epic/SKILL.md"
    bug_ref: "task.200.bug.4.create-epic-links-the-checked-out-branch.md"
    finding: >-
      create-epic builds its PRD link from `git rev-parse --abbrev-ref HEAD` with no work-item check.
      That is the obs #287 defect class the task's success criterion 2 names, and it is unmigrated.
      The population test cannot see it because it is keyed on the @{u} token. The defect predates
      this branch, but it is in the task's own scope.
    suggested_action: >-
      Route the link through doc-link-branch.js and widen the population test to link construction
      (`blob/${…}` in skills/*/SKILL.md). Alternatively, defer it to the task's Deferred Work and
      narrow the criterion's wording.
    suggested_owner: dev

