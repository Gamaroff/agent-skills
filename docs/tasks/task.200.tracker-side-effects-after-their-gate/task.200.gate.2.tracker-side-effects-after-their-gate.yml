updated: "2026-10-20T19:04:44Z"

top_issues:
  - id: "TASK-200-005"
    severity: high
    file: "skills/create-epic/SKILL.md"
    finding: "The PRD-link block passes --doc \"${PRD_SOURCE_PATH}\" (lines 164 and 167), but only the earlier parent-PRD block (line 131) assigns PRD_SOURCE_PATH. In a fresh shell the resolver exits 2 and the guard aborts the block on both VCS arms. The execute test supplies the binding itself, so it cannot see this (code review CR-1)."
    suggested_action: "Bind PRD_SOURCE_PATH in the block with a {placeholder} line before the if, and make the create-epic execute test take that binding from the block."
    suggested_owner: dev
    bug_ref: "task.200.bug.5.create-epic-prd-link-reads-an-unbound-path.md"
  - id: "TASK-200-006"
    severity: medium
    file: "skills/sync-github-story/SKILL.md"
    finding: "--explicit \"${DOC_BRANCH:-}\" (line 158) has no writer in the block. review-story and finalise pass DOC_BRANCH as a sub-skill input, so the durable-branch pin is always empty and is silently dropped. The read predates this branch, but its class (TASK-200-002) is in scope (code review CR-2)."
    suggested_action: "Bind the pin from a {placeholder} line (empty when none was passed), pass that to --explicit, and add an execute-test case with the pin set."
    suggested_owner: dev
    bug_ref: "task.200.bug.6.sync-github-story-pin-is-never-bound.md"
  - id: "TASK-200-007"
    severity: medium
    file: "shared/resources/doc-link-branch.js"
    finding: "branchNamesWorkItem (line 80) accepts {parent}.bug.{N} branches for every document of the parent. bugfix/task.67.bug.4.x names task.67.bug.3 and task.67 itself; bugfix/story.1.8.2.bug.1.x names story.1.8.2.bug.2 (reproduced; code review CR-3)."
    suggested_action: "After matching an id, reject a remainder starting .bug.<n> unless it is the document's own bug, and add sibling-bug and parent-card must-differ rows to the table."
    suggested_owner: dev
    bug_ref: "task.200.bug.7.a-sibling-bug-branch-names-the-wrong-work-item.md"
  - id: "TASK-200-008"
    severity: medium
    file: "tests/doc-link-branch-population.test.js"
    finding: "unresolvedLinks accepts a blob/${V} link when any resolver line assigns V, so a second assignment of V from the checked-out branch passes. A QA mutation adding DOC_BRANCH=$(git branch --show-current) before DOC_URL= in sync-github-task turned no test red (no-red-untested). TASK-200-004 asked for a link built 'any other way' to be caught."
    suggested_action: "Flag a link when any line assigns its variable without calling doc-link-branch.js, and add the reassignment shape to the control test."
    suggested_owner: dev
    bug_ref: "task.200.bug.8.link-scan-misses-a-reassigned-branch.md"

