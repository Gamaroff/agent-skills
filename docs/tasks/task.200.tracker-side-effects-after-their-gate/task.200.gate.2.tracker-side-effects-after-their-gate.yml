task_title: "Tracker side effects after their gate"
gate: FAIL
status_reason: "Cycle 1 fixed TASK-200-001 to 003; the fast gate passes 6060/0. TASK-200-004 is partial. The cycle-2 refute pass found one HIGH: create-epic's new PRD-link block reads a path it never binds, so the block aborts. It also found three MEDIUMs: sync-github-story drops the caller's pin, a sibling bug's branch names the wrong work item, and the link scan misses a reassigned branch variable."
