task_title: '[Task 51] Declare tracker access level in config, and reject an unrecognised one loudly'
gate: FAIL
status_reason: >-
  Cycle 5 found two HIGH — one a regression introduced by the cycle-4 fix (a duplicate inside an
  at-site merge source escalated a declared `manual` to `full`, silently), one pre-existing (NUL
  omitted from the transport refusal). Both are fixed and verified against every reported shape,
  with four mutations red and the suite at 166/166. The gate stays FAIL because this is the
  pipeline's fifth cycle: the fixes have targeted verification but no independent adversarial pass,
  and across five cycles every fix round has introduced at least one new defect. Self-certifying the
  last round against that base rate would be the one claim this task has repeatedly shown to be
  unsafe. Escalating to the user instead.
