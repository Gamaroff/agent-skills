top_issues:
  - id: TASK-51-BUG-13
    severity: high
    status: fixed-pending-independent-verification
    finding: >-
      Moving the duplicate scan before flatten_mapping (the cycle-4 fix for merge-key override) meant
      a merge source defined AT the merge site is never constructed in its own right and so never
      scanned. `access:\n  <<: {tracker: manual, tracker: full}` resolved to full, exit 0, silent —
      regression against 678a194, which rejected it. Four shapes reproduced plus a duplicated `<<`
      key. The existing dupe-under-merge fixture could not catch any of them: it places the duplicate
      in the local mapping, which was never the gap.
    fix: 'Scan recurses into merge-tagged value nodes (MappingNode, SequenceNode-of-MappingNode); a second `<<` in one mapping is rejected.'
    verified: 'All five shapes rc=1; legal override and multi-merge sequence still resolve; mutations 39 and 40 red.'

  - id: TASK-51-BUG-14
    severity: high
    status: fixed-pending-independent-verification
    finding: >-
      The cycle-4 refusal covered US and RS but not NUL — twelve lines below a comment naming NUL as
      the byte command substitution strips. `access.tracker: "\0"` arrived as an empty payload and
      read as unconfigured → full, exit 0, no warning, while the awk tier rejected the same file.
      Pre-existing rather than a regression, but it falsified the cycle-4 claim that the refusal was
      complete.
    fix: 'All three transport-hostile bytes refused; the comment corrected.'
    verified: 'Both tiers rc=1 for a NUL-only and an embedded-NUL value; mutation 41 red.'

  - id: TASK-51-LOW-13
    severity: low
    status: fixed
    finding: 'The refusal named no key, deviating from the standard every other rejection in the file meets. Halt-loop indices were positionally coupled to the spec list, so reordering a spec would silently drop a value out of the halt in the permissive direction.'
    verified: 'Message names the key; loop covers all six indices; mutation 42 red.'

