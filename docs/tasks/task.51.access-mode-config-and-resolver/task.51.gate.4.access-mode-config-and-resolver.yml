nfr_validation:
  security:
    status: FAIL
    notes: >-
      Downgraded from CONCERNS. A config value can forge a control record and silently grant a more
      permissive access mode than the operator declared. The threat model is narrow — whoever writes
      skills-config.yaml is the operator and could simply write `full` — so this is robustness rather
      than a crossed trust boundary. It is still the exact outcome the task names as the one it must
      never produce, and it regressed from a state that caught it.
  performance:
    status: PASS
  reliability:
    status: FAIL
    notes: 'Two silent value corruptions and one hard halt on a legal merge-key override.'
  maintainability:
    status: CONCERNS
    notes: >-
      The wire format is now simpler than the escaping it replaced, which was the right direction —
      it just shipped without the one validation that makes an unescaped framing safe.

