  - id: 'kind-from-provenance'
    status: closed
    verified: >-
      All six specs checked. No path found where a config value arrives as a signal or vice versa.
      `tracker: "__MAP__"` and `access: {tracker: "__MAP__"}` are now rejected where the baseline
      accepted them. This part genuinely works — it is the payload-spelling forgery that is closed,
      not the separator-injection one.

top_issues:
  - id: TASK-51-BUG-12
    severity: high
    finding: >-
      The encoder emits `<i> US <kind> US <payload> RS` with NO sanitisation of the payload, and
      `config_bulk_get` returns the FIRST record matching an index. Records are emitted in order, so
      a payload in record N is injected ahead of every real record N+1..6 and the forgery wins.
      `tracker: "jira\x1e5\x1fv\x1ffull"` with `access.tracker: manual` yields ACCESS_TRACKER=full,
      exit 0, no diagnostic. Also demonstrated: downgrade full→manual; forging record 4 to bypass the
      scalar-`access:` halt from cycle 1; injection from `vcs:`; under zsh; through a bundled copy.
      Regression against 7e0d2dd, which rejected the same file loudly. The code comment claiming a
      separator "could at worst truncate its own record" is the load-bearing false claim.
    suggested_action: 'Refuse any payload containing US/RS at the encoder and emit __ERR__ — YAML forbids the raw bytes and no legal value contains them, so refusing costs nothing.'
    suggested_owner: dev

  - id: TASK-51-MED-9
    severity: medium
    finding: >-
      A value containing a lone US is silently truncated into a different legal value rather than
      rejected: `tracker: "jira\x1fgithub"` → TRACKER=jira, exit 0. Baseline preserved the byte and
      validation caught it. No record injected — distinct from BUG-12, same root cause.
    suggested_action: 'Covered by the same encoder-side refusal.'
    suggested_owner: dev

  - id: TASK-51-MED-10
    severity: medium
    finding: >-
      `_no_dupes` scans node.value AFTER flatten_mapping, which prepends the merged pairs, so an
      inherited key plus a local key that overrides it reads as a duplicate — and overriding is the
      entire purpose of `<<`. `access:\n  <<: *d\n  tracker: github` is graded malformed and
      hard-halts. NOT a regression (7e0d2dd identical), but cycle 3's stated goal was merge-key
      support and it is half-delivered. The new test at tracker-access.test.sh:560-562 only exercises
      a merge that ADDS a key never present locally, so it passes while the common idiom stays broken.
    suggested_action: 'Scan the pre-flatten node for duplicates, then flatten and construct.'
    suggested_owner: dev

  - id: TASK-51-LOW-11
    severity: low
    finding: >-
      `config_bulk_get` compares the index numerically (both sides are awk strnums), so `01`, `1.0`,
      ` 1`, `+1` and `1e0` all match index 1 — confirmed end to end as an alternative spelling of the
      BUG-12 attack. Matters mainly because any index hardening that assumes a string compare will
      miss those. Also, a truncated stream yields kind `v` with an empty payload rather than nothing,
      so the caller degrades to `auto` instead of noticing.
    suggested_action: 'Force a string comparison on the index.'
    suggested_owner: dev

  - id: TASK-51-LOW-12
    severity: low
    finding: >-
      A new test label contains backticks — `assert_rc "merge key `<<:` → status 0"` — which bash
      parses as command substitution and then as a heredoc, so every suite run emits
      "warning: here-document at line 561 delimited by end-of-file". The assertion still runs, but
      the warning reads like a real failure. Introduced in this diff.
    suggested_action: 'Quote the label without backticks.'
    suggested_owner: dev

