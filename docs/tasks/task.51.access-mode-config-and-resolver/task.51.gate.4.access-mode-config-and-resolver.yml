schema: 1
task: 'task.51.access-mode-config-and-resolver'
task_title: '[Task 51] Declare tracker access level in config, and reject an unrecognised one loudly'
gate: FAIL
status_reason: >-
  Cycle 3 traded an encoder/decoder drift bug for an unescaped in-band framing bug. The wire format
  has no escaping AND no validation that a payload is separator-free, so `access.tracker` is
  forgeable from `tracker:` with a two-byte YAML escape — silently, exit 0, on both shells and
  through the bundled copies. That is a clean regression against 7e0d2dd, which caught the same file
  loudly. Separately the merge-key fix is half-landed: the `<<` OVERRIDE form, which is the common
  idiom, is still rejected, and the new test passes only because it exercises the other form.
reviewer: 'QA Engineer'
updated: '2026-08-17T19:10:00Z'

re_review_of: 'task.51.gate.3.access-mode-config-and-resolver.yml'

previous_issues:
  - id: 'BUG-9 merge keys'
    status: partial
    verified: 'Plain merge, multi-merge, nested merge and recursive anchors all work. The OVERRIDE form does not — see MED-11.'
  - id: 'BUG-10 sentinel containment'
    status: closed
    verified: 'resolve-paths.sh produces no sentinel on either tier for any fixture, including open flow maps and nulls.'
  - id: 'BUG-11 block scalars'
