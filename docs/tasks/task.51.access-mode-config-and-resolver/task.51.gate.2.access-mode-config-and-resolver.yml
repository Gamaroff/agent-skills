top_issues:
  - id: TASK-51-BUG-6
    severity: high
    finding: >-
      `config_bulk` promises one line per spec but emits one line per LINE of each value, and
      `_rp_line` addresses answers positionally via `sed -n "$1p"`. Demonstrated: three specs in,
      five lines out. With `tracker: "github\n\n\n"` and `access.tracker: manual`, the resolver
      returns rc=0 with ACCESS_TRACKER=full — a silent escalation with no warning, on the
      authoritative tier. Introduced by the cycle-1 performance fix.
    suggested_action: 'Index-prefix each answer and escape newlines; address by index, not line number.'
    suggested_owner: dev
    bug_ref: 'task.51.bug.6.bulk-protocol-line-shift.md'

  - id: TASK-51-BUG-7
    severity: high
    finding: >-
      The new awk flow-map rule strips to the first `}` then calls `next`, so a flow mapping spanning
      two lines is unreachable. `access: {\n  tracker: manual}` gives manual under python and full
      under awk — the tier-dependent escalation §13 was written to prevent, with §13 only covering
      the single-line form.
    suggested_action: 'Fail closed on an unclosed flow map rather than extending the awk parser.'
    suggested_owner: dev
    bug_ref: 'task.51.bug.7.multiline-flow-map-escalation.md'

  - id: TASK-51-BUG-8
    severity: high
    finding: >-
      YAML-null normalisation was added to `read_config_key` and not to `read_nested_config_key`.
      `access.tracker: null` halts every guarded call site on an awk-only host. Wider blast radius
      than access: `prdShardedLocation: null` yields PRD_ROOT=null, and
      `architectureShardedLocation: ~` yields ARCH_ROOT=~, which unquoted expands to $HOME.
    suggested_action: 'Normalise nulls once, in a place both readers share; extend §15 to nested keys and the path roots.'
    suggested_owner: dev
    bug_ref: 'task.51.bug.8.nested-null-not-normalised.md'

  - id: TASK-51-MED-5
    severity: medium
    finding: >-
      The `_RP_*` scratch vars and `_rp_line` are unset only on the success path, and the
      tier-1-unavailable branch resets only `_RP_STATUS`. After a failing source they persist in the
      caller's shell, and because `${_RP_ACC_T-...}` uses `-` (unset-only) a stale empty string
      suppresses the awk read entirely. Demonstrated across two repos in one shell: expected
      rc=0/github/manual, got rc=1/jira/full. The suite runs every case in a fresh `bash -c`, so it
      structurally cannot see this.
    suggested_action: 'Initialise all seven vars before the batch, and unset them on the failure paths too.'
    suggested_owner: dev

  - id: TASK-51-MED-6
    severity: medium
    finding: >-
      Making tier 1 authoritative turned a duplicated `access:` key — valid YAML, realistic
      copy-paste error — into a silent escalation. pyyaml last-wins makes access.tracker absent;
      the old fall-through let awk find the first block. Pre-fix `0/manual`, post-fix `0/full`. The
      same shape flips identity: `tracker: jira` plus a duplicate null `tracker:` gave jira before,
      github now.
    suggested_action: 'Reject duplicate keys in the tier-1 loader — the remedy is detection, not restoring the fall-through.'
    suggested_owner: dev

  - id: TASK-51-LOW-6
    severity: low
    finding: >-
      `resolve_access` stays defined in the caller's shell and its `*)` branch makes it look
      general-purpose, so attacker-controlled text can reach the `eval`. Execution not achieved (the
      uppercasing mangles payloads), but the guarantee should not rest on that.
    suggested_action: 'Whitelist the system argument: `case "$system" in tracker|vcs) ;; *) return 1 ;; esac`.'
    suggested_owner: dev

  - id: TASK-51-LOW-7
    severity: low
    finding: >-
      An unrecognised `config_bulk` spec returns `__NONE__`, which for an access read means "not
      configured" → full. A typo'd spec is indistinguishable from an absent key. `nested:P.C` also
      splits on the first dot, so a dotted key name is unaddressable.
    suggested_action: 'Return `__ERR__` for an unknown spec so a typo fails closed.'
    suggested_owner: dev

  - id: TASK-51-LOW-8
    severity: low
    finding: >-
      Mutation 16 (remove the tier-1 `__NONE__` short-circuit) stays green: the awk null handling
      independently covers the same inputs, so the "tier 1 is authoritative" invariant has no
      witness of its own. Defence in depth rather than a defect, but the invariant is unasserted.
    suggested_action: 'Assert it via a case where the tiers genuinely disagree — the duplicate-key rejection from MED-6 is the natural witness.'
    suggested_owner: dev

