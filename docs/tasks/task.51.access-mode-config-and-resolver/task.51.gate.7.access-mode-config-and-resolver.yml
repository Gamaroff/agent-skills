evidence:
  tests_reviewed: 285
  phases_verified: '10/10'
  suites: >-
    tracker-access 285/285 (was 166 at gate 6, 277 at commit 09b513c) · node 1287/1287 ·
    resolve-platform 6/6 · bitbucket-auth 35/35 · pipeline hooks 3/3 + 13/13 · verify-push-state 9/9 ·
    validate:all 115/115 · Prettier clean · bundle idempotent
  mutation_audit: >-
    9 mutations, each with a full-suite run, all CAUGHT. The five cycle-7 fixes (2, 10, 8, 7, 8
    failures respectively), the two in-cycle regressions (2 and 2), and two invariants that SURVIVED
    gate 6's audit and now do not: inverting access_rank so `command` outranks `read-only` (2
    failures) and widening the mode enum to a sixth value (2 failures).
  call_site_guards: >-
    15/15 executable call sites carry `|| exit 1`, and now 15/15 are ENFORCED. Gate 6's finding that
    the suite's dot-source regex matched ZERO lines repo-wide is closed: the pattern is anchored to
    line start, matched on whole lines rather than -o fragments (the guard sits after the closing
    quote, which a fragment ending at `.sh` can never contain), and backed by coverage FLOORS so a
    pattern that goes blind fails loudly instead of reporting "no unguarded call sites". Verified by
    deleting `|| exit 1` from skills/qa-story/SKILL.md:1371 — previously green, now red.
  tier_coverage: >-
    Gate 6's core test-integrity finding is closed. §2 asserts all five modes under BOTH tiers on the
    resolved VALUE; §34-38 assert values rather than exit codes; §39 pins the mode ordering
    behaviourally, each adjacent pair in both directions; §40 asserts the legal vocabulary as a whole
    line. Merge-key value assertions still force python — correctly, since the awk tier cannot see a
    merge key at all; that divergence is now pinned by §41 rather than hidden by a forced tier.
  independent_reproduction: >-
    all findings executed in main context; both regression claims diffed against parent commit 5f51973
  host_profile: >-
    Re-verified on three profiles — Homebrew python3 3.13 with pyyaml (-P), a shim rejecting -P (-I),
    a shim rejecting both (no flag, prologue only) — and on a genuine awk-only host (python shimmed to
    exit 127), under bash and zsh alike.
  bundle: 'idempotent — npm run bundle leaves git status clean'

nfr_validation:
  security:
    status: CONCERNS
    notes: >-
      Substantially improved, not clean. Five escalation routes closed and confirmed closed: the
      code-execution vector (BUG-25), the unreadable file (BUG-23), the env redirect (BUG-24), the
      key-spelling class on a malformed file (BUG-17 + BUG-30), and the nested-merge overlap this
      cycle introduced and then closed (BUG-29). The guarantee in read-config.sh's own header — that
      a stray env var can never loosen a config that restricts — now holds. What keeps this off PASS
      is LIMIT-1: on the tier a stock macOS consumer actually runs, three legal spellings of a
      declared restriction still resolve to `full` at exit 0. Nothing consumes ACCESS_TRACKER yet
      (task.52 and successors), so the live blast radius is a value that is wrong rather than
      credentials that are wrongly used — but that changes the day something reads it.
  reliability:
    status: PASS
    notes: >-
      Both false rejections closed. The documented `tracker: {workflowFile: ...}` form works on the
      default tier of a stock host (BUG-15), and the legal merge composition that regressed at
      cycle 5 resolves again (BUG-16), with the overlap protection intact and now covering
      non-adjacent, sequence and nested sources. Verified under bash and zsh and on an awk-only host.
  performance:
    status: PASS
    notes: >-
      The isolation flag adds at most two extra probe spawns at source time, once per shell, and only
      until one succeeds. The memoised single-probe design is unchanged.
  maintainability:
    status: PASS
    notes: >-
      Every fix carries a comment stating the defect it closes and why the obvious alternative was
      rejected — including the two this cycle's own fixes caused, which is the record most likely to
      stop cycle 8 repeating them. The known limits are written down with their options rather than
      left implicit. Raised from CONCERNS because the suite now holds the invariants: it went from
      11 surviving mutations at gate 6 to 0 across 9 tried here, and the call-site scan is no longer
      decorative.

