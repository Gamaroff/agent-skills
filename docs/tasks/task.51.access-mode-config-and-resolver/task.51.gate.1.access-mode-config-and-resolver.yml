nfr_validation:
  security:
    status: CONCERNS
    notes: >-
      yaml.safe_load holds — a hostile config cannot execute code. But SKILLS_CONFIG_FILE splicing
      into the python heredocs is a demonstrated new execution vector (TASK-51-MED-1).
  performance:
    status: CONCERNS
    notes: '10 python spawns per source; 1140–1458 ms vs 75–267 ms; ~+18 s per pipeline run.'
  reliability:
    status: FAIL
    notes: >-
      Three independent ways a legal config now fails: zsh (BUG-1), lint false positives (BUG-2),
      `tracker: null` (BUG-3). None covered by the 61 passing assertions.
  maintainability:
    status: PASS
    notes: >-
      Reader consolidation is a genuine win — one definition repo-wide, 28 bundled copies with no
      drift, and unusually good "why" comments. The awk lint is the least readable part and its rule
      order is load-bearing.

