    file: 'shared/resources/develop-pipeline-step-8-commit.md'
    finding: 'Two definitions of "the hold directory still holds files" now disagree. The Step 8 check (:276) reads ls -A output with stderr discarded, so an unlistable hold dir passes. --complete (advance-pipeline-lock.sh:190) treats the same directory as holding files and keeps both records. A pipeline run therefore prints "Step 8 post-conditions verified" with held files possibly still in /tmp, and the comments at :288 and in the script header say this cannot happen (diff review CR-1, reproduced: step8 passes, --complete keeps the record).'
    suggested_action: 'State the rule once: give advance-pipeline-lock.sh a read-only mode that reports clear or pending, have --complete and the Step 8 check both read it, and add an unlistable case to the Step 8 fixtures.'
    suggested_owner: dev
    status: open
  - id: 'TASK-227-QA3-2'
    severity: low
    file: 'shared/resources/advance-pipeline-lock.sh'
    finding: 'HOLD_REC_DIR comes from cat with stderr discarded, so a hold-dir record that exists but cannot be read gives the same empty value as no record. --complete then deletes both hold records without a warning (diff review CR-2, reproduced with chmod 000 on the record: both records gone, held.txt still in the hold dir).'
    suggested_action: 'In the same read-only rule, treat a record that exists but cannot be read as pending.'
    suggested_owner: dev
    status: open

