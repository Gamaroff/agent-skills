top_issues:
  - id: 'TASK-227-QA1-1'
    severity: medium
    file: 'shared/resources/tests/step-8-completion-checklist.test.mjs'
    finding: 'RM_WORD (/(^|[;&|({]\s*)rm\s/) misses `then rm`, `do rm`, `! rm`, `command rm`, `xargs rm`, `sudo rm` and `/bin/rm` (measured with node), so a checklist block written `if …; then rm -f x; fi` passes the guard and criterion 4 ("the guard test fails if one is added") does not hold. RM_WORD is module-private, so the probe cannot reach it (probes_executed 0). From CR-2.'
    suggested_action: 'Match rm as a command word after then/do/else/! and command/xargs/sudo/exec and as a path ending in /rm; add those forms to the RM_WORD control hits; export the matcher as a function and probe it (shell-exec sink) or record why the sink does not fit.'
    suggested_owner: dev
    bug_ref: 'task.227.bug.1.rm-word-misses-keyword-forms.md'
  - id: 'TASK-227-QA1-2'
    severity: medium
    file: 'shared/resources/advance-pipeline-lock.sh'
    finding: '--complete removes step4-hold-dir.txt in both arms with no condition; a no-lock --complete with the record naming a non-empty hold directory leaves held.txt in /tmp and deletes its only pointer (reproduced; the no-lock arm used to remove nothing), contradicting "No caller sees a different end state". From CR-1.'
    suggested_action: 'Keep step4-hold-dir.txt and warn on stderr when the directory it names exists and is not empty; add scenario 15 cases for both arms; correct the Breaking Changes and CHANGELOG wording.'
    suggested_owner: dev
    bug_ref: 'task.227.bug.2.complete-drops-hold-dir-pointer.md'

