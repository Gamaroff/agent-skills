task_title: 'Step 8 checklist block mixes rm with must-pass checks; host refuses the whole block'
gate: CONCERNS
status_reason: 'All 3 phases are delivered, CI is green and both mutations go red on committed tests. Two medium findings remain: the no-rm guard misses rm after then/do/!/command/xargs/sudo and by path, so criterion 4 does not fully hold (BUG-1); and --complete now drops the hold-dir record while held files are still held (BUG-2).'
