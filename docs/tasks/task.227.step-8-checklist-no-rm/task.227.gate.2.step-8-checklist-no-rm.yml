    finding: 'When --complete keeps step4-hold-dir.txt because its directory still holds files, it still deletes step4-held-paths.txt, the list of those same files (diff review CR-2, reproduced: hold-dir kept, held-paths gone). This combines the cycle-1 fix with the original removal.'
