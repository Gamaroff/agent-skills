  - id: 'TASK-227-QA2-2'
    severity: low
    file: 'shared/resources/advance-pipeline-lock.sh'
    finding: 'The keep test reads ls -A output with stderr discarded, so a hold directory that exists but cannot be listed reads as empty and its record is deleted (diff review CR-3, reproduced with chmod 000: record gone).'
    suggested_action: 'Keep the record, with the same warning, unless ls -A succeeds and prints nothing; add an unlistable-directory case.'
    suggested_owner: dev
    status: open
  - id: 'TASK-227-QA2-3'
    severity: low
    file: 'shared/resources/tests/lib/rm-invocation.mjs'
    finding: 'lineRunsNoRm accepts rm followed directly by a redirection (rm>/dev/null a, rm<<EOF), because the lookahead omits < and >. The control test is named "refuses every way a line runs rm". The reviewer rated this a cleanup. QA counts it as a residual miss of the guard: 0 occurrences of the shape across about 41 rm call sites in the shipped docs.'
    suggested_action: 'Add < and > to the lookahead class and both shapes to the control test hit list; optionally replace (?:\S*\/)? with a non-backtracking path form.'
    suggested_owner: dev
    status: open
  - id: 'TASK-227-QA2-4'
    severity: low
    file: 'docs/tasks/task.227.step-8-checklist-no-rm/task.227.step-8-checklist-no-rm.md'
    finding: 'Technical Background (:71), Scope (:85) and Success Criteria 1-2 (:183, :184) still say --complete removes step4-hold-dir.txt unconditionally; since cycle 1 it is kept while its directory holds files (only §5, the CHANGELOG and the script say so).'
    suggested_action: 'Amend those four lines to state the exception, citing the script header rather than restating it.'
    suggested_owner: dev
    status: open

