top_issues:
  - id: 'CR-1'
    severity: medium
    file: 'shared/resources/document-change-log.md'
    finding: 'New paragraph (line ~210) says every skill named in {develop|finalise} ships references/change-log.js "and no other does" — false: 24 skills outside the alternation carry it transitively via JS_SIBLING_RE (create-*, qa-*, review-*, sync-jira-*, bug skills, develop-*). Re-rendered into 42 bundled copies.'
    suggested_action: 'Reword: the alternation is the set of skills whose PROSE runs the engine; other skills may carry it transitively through a bundled .js that requires it.'
    suggested_owner: dev
    status: open
  - id: 'CR-2'
    severity: medium
    file: 'tests/change-log-engine-reachability.test.js'
    finding: 'RUNS_ENGINE = /through `change-log\.js`/ requires a literal single space; skills/develop/SKILL.md:589-590 carries the instruction wrapped across a line break ("Append through\n`change-log.js`") and is invisible to it — develop is in the population only because a second site (line 753) is on one line. A future writer whose only instance is wrapped is silently absent from the population and, if also absent from the alternation, reproduces the original MODULE_NOT_FOUND with all three tests green.'
    suggested_action: 'Match whitespace across the wrap: /through\s+`change-log\.js`/ — and prove it with a test that reads develop/SKILL.md line-wrapped instance.'
    suggested_owner: dev
    status: open

