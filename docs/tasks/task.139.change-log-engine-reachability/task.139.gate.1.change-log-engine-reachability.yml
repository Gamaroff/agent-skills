task_title: 'The Change Log engine is unreachable from a skill whose prose runs it: spell the writer alternation and pin engine reachability with a parity test'
gate: CONCERNS
status_reason: 'Implementation is complete and every phase verifies (3/3 tests green, bundle:check clean, ci:fast 3890/3890), but the diff code review found two high-confidence correctness defects: the contract paragraph asserts a population fact that is false for 24 skills, and the population regex misses the line-wrapped spelling of the instruction that develop/SKILL.md already carries.'
