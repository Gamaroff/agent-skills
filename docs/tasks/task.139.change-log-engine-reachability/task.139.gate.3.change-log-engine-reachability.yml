task: 'task.139.change-log-engine-reachability'
task_title: 'The Change Log engine is unreachable from a skill whose prose runs it: spell the writer alternation and pin engine reachability with a parity test'
gate: CONCERNS
status_reason: 'Cycle 3 reviews the obs #154 addition (doc-links engine, its tests, three skill edits) landed after 5c approved. The engine has three medium/high defects (a fence state machine that a line-initial backtick run desyncs — task.42 parses to 0 links and the corpus guard passes vacuously on it; cwd-relative git ls-files that reports 5 false dead links from a skill directory; process.exit after stdout writes, caught by the repo exit-after-write guard now that the file is tracked) and the two review-skill blocks read an unbound variable and address the engine by a path the repo rule forbids. Five entries promoted; the original task deliverable is unchanged since gate.2.'
reviewer: 'QA Engineer'
updated: '2026-09-22T06:49:01Z'

top_issues:
  - id: 'TQ-1'
    severity: medium
    file: 'shared/resources/doc-links.js'
    finding: 'Line 214 calls process.exit(main(...)) after writing to stdout — the bug.3 stdout-truncation-on-exit class; the repo guard "no NEW file adopts exit-after-write" is red under ci:fast (vacuously green pre-commit because the guard walks git ls-files and the file was untracked).'
    suggested_action: 'Set process.exitCode = main(...) and return; keep the CLI contract (0/1/2).'
    suggested_owner: dev
    status: open
  - id: 'CR-1'
    severity: medium
    file: 'shared/resources/doc-links.js'
    finding: 'FENCE_RE treats any line starting with three-plus backticks as a fence opener; a line-initial inline backtick run (task.42 doc line 315, a four-backtick code span) opens a fence that never closes, so the extractor returns 0 links for a 941-line document with 18 link sites — the corpus guard passes vacuously on it.'
    suggested_action: 'Per CommonMark: a backtick opener whose info string contains a backtick is not a fence; a closer is the marker plus optional trailing spaces only; report fence-open-at-EOF so a desynced document is a finding, not a clean pass.'
    suggested_owner: dev
    status: open
  - id: 'CR-2'
    severity: medium
    file: 'shared/resources/doc-links.js'
    finding: 'trackedSet runs git ls-files without --full-name, so paths are cwd-relative while rel is also cwd-relative; launched from skills/review-task the task.139 document reports 5 false dead links and exits 1.'
    suggested_action: 'Anchor to the repository: root = git rev-parse --show-toplevel (fallback --root/cwd outside a repo); git ls-files -z --full-name; compute rel against that root.'
    suggested_owner: dev
    status: open
  - id: 'CR-3'
    severity: medium
    file: 'skills/review-task/SKILL.md'
    finding: 'The new block reads $TASK_FILE (review-story twin reads $STORY_FILE); the skills bind $TASK_FILE_PATH / $STORY_FILE_PATH, so as written the call is --file "" → usage exit 2 with no ✖ line, and the promised "exits 1 with one ✖ per dead link" cannot happen.'
    suggested_action: 'Use the {resolved task file path} placeholder the other blocks substitute (or bind the variable in the same block); drop --json or say the dead links arrive in broken[].'
    suggested_owner: dev
    status: open
  - id: 'CR-4'
    severity: medium
    file: 'skills/finalise/SKILL.md'
    finding: 'All four new invocations address the engine as a bare node references/doc-links.js; create-skill: a helper a fenced block executes is addressed from the repository root as .agents/skills/{skill}/references/<file> — from the root the bare form is MODULE_NOT_FOUND (reproduced), from the skill dir it hits CR-2. The canonical engine calls in these same skills (tracker-comment.js, qa-cycle.sh) use the root-anchored form.'
    suggested_action: 'Spell each call node .agents/skills/{review-task|review-story|finalise}/references/doc-links.js --file "{document-path}" from the repository root.'
    suggested_owner: dev
    status: open

