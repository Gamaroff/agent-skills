task: "task.62.loop-supervisor-runner"
task_title: "Run each loop iteration in a fresh Claude process, and classify the outcome from the filesystem"
gate: CONCERNS
status_reason: "No high-severity issues; 5/5 phases and 7/8 success criteria verified against real execution. One medium correctness bug (LS-1): a config block silently overrides an explicit CLI flag whose value equals the default, which can point the progress oracle at the wrong ref and silently degrade every iteration to `idle`."
reviewer: "QA Engineer"
updated: "2026-08-28T12:20:00Z"

top_issues:
  - id: LS-1
    issue: "Config overrides an explicit CLI flag when the flag's value equals the built-in default"
    severity: medium
    category: correctness
    finding: "run-loop.mjs infers 'flag not supplied' by comparing the parsed value against DEFAULTS, so `--base develop` is indistinguishable from unset and a config `baseBranch: main` wins over it. --base drives the progress oracle, so a wrong ref makes tickCommitOracle never fire and every healthy iteration classify `idle`, ending the loop at --max-idle while reporting no progress. README and configuration.md both promise the opposite precedence."
    suggested_action: "Track explicitly-supplied flags in parseArgs (a Set of seen options) and apply config only to options absent from it. Add unit tests pinning 'explicit flag equal to the default still wins over config'."
    suggested_owner: dev
    refs:
      - "skills/loop-supervisor/scripts/run-loop.mjs"
    source: code-review
    confidence: high

