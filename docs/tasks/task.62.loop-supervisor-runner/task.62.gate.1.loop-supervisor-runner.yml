nfr_validation:
  security:
    status: PASS
    notes: "Pinned acceptEdits rather than --dangerously-skip-permissions, so an approval boundary survives an unattended run; force-push and rm -rf denied. Adapter config accepts path strings only — no mechanism to name a module for require(), closing the code-execution surface by construction. No credentials read, written or logged; the rendered log records tool-call names without inputs."
  performance:
    status: PASS
    notes: "Probe runs before spawn, so an empty frontier costs a script invocation not a model invocation, and is skipped entirely on resume. Budget ceilings checked before each spawn, not after. Measured per-iteration cost fell $0.089 -> $0.010 across two identical prompts, matching the documented prompt-cache expectation."
  reliability:
    status: CONCERNS
    notes: "Signal handling never interrupts mid-merge; PID lock enforces single-flight; the classifier fails safe in every unknown direction (unprovable halt file treated as stale, unknown outcome stops, empty probe output is an error) — all exercised. CONCERNS solely for LS-1: a misconfigured base ref degrades the oracle silently, which is the exact failure mode this component exists to detect."
  maintainability:
    status: PASS
    notes: "classify.js performs no I/O and interpretProbe takes a captured result, so the whole correctness surface sits behind pure boundaries and is tested without subprocesses. Comments explain why at each non-obvious decision. House style matches schedule.mjs. The mutation probe demonstrates the suite can actually fail."

