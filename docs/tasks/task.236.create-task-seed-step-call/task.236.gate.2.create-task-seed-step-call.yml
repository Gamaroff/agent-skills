  - id: 'QA2-1'
    severity: medium
    file: 'skills/create-task/SKILL.md'
    finding: 'CR-1, reproduced on the shipped block: `TASK_ID="{next-task-number}"` and `OBS_IDS="{observation-ids}"` are double-quoted, so bash expands what the agent substitutes before the node guard sees it. Ids `1,$(echo 2)` and `1,`echo 2`` exit 0 seeding [1,2]; `1"; touch <marker>; "` exits 0 seeding [1] and writes the marker; `$HOME` is refused as `not an observation id: /home/...`, naming the expansion, not the input. The block is new on this branch (base has no OBS_IDS).'
    suggested_action: 'Make the raw text reach a check before any shell reads it: single-quote both assignments and have the step refuse an input containing a single quote, or have the step check the task number (digits) and the ids (digits, commas, spaces) before substituting, with a committed test that substitutes `$(...)`, a backtick and a double quote the way an agent would.'
    suggested_owner: dev
    status: open

