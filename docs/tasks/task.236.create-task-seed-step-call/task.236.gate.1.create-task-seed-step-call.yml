top_issues:
  - id: 'QA-1'
    severity: medium
    file: 'skills/create-task/tests/seed-step-block.test.js'
    finding: 'platform-variance (CR-1): SCRATCH_ROOT is built under the checkout, and resolve-observation-workspace.sh refuses any path inside a linked git worktree, so both tests fail when the suite runs from a worktree (reproduced: 0 pass / 2 fail, "observation workspace refused: path is inside a linked git worktree"; from-observation.test.js passes 15/15 in the same worktree).'
    suggested_action: 'Build the scratch base under the main checkout (parent of `git rev-parse --path-format=absolute --git-common-dir`), as scratchRoot() in shared/resources/tests/observation-log.test.mjs does, and add the module-load SCRATCH_REFUSAL guard from-observation.test.js uses.'
    suggested_owner: dev
    status: open
  - id: 'QA-2'
    severity: medium
    file: 'skills/create-task/SKILL.md'
    finding: 'CR-2, reproduced by the fence probe: the block checks every observation id against /^[0-9]+$/ but never checks TASK_ID, so `task.236` and an unsubstituted `{next-task-number}` both exit 0 and print park conditions `task.task.236 merged to develop` and `task.{next-task-number} merged to develop`, which step 6 would write onto the entries.'
    suggested_action: 'In the node program, refuse a process.argv[1] that does not match /^[0-9]+$/ with a one-line message naming it, before calling seedFromObservations, and add a committed test case for it.'
    suggested_owner: dev
    status: open
  - id: 'QA-3'
    severity: medium
    file: 'skills/create-task/SKILL.md'
    finding: 'The block is a boundary (it refuses on repository state), but the fence: probe form takes the FIRST bash block under a heading, and the seed block is the second under § 1.1 (the scan block at line 190 is first), so the shipped-file probe declines with bad-slot and records probes_executed 0, which /finalise''s zero-guard will fail.'
    suggested_action: 'Give the seed block a heading of its own so `fence:skills/create-task/SKILL.md#<heading>` reaches it (a scratch copy with one inserted heading ran 9/9 id cases, 7 hostile refused, 0 escapes), and commit the probe cases so the next cycle can run them against the shipped file.'
    suggested_owner: dev
    status: open

