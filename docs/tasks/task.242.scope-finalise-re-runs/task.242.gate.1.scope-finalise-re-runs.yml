    severity: high
    file: 'skills/finalise/SKILL.md'
    finding: 'Step 3c merge block (SKILL.md:731) reads ${STEM} and $DOD_N but binds neither; each fenced block is its own shell, so --dod-n "" fails the CLI digit check (exit 2) and every story/task finalise run HALTs at Step 3c. The contract test pins the unbound text, so it cannot see this.'
    suggested_action: 'Bind STEM="{…}" and DOD_N="{Step 0''s DOD_N}" at the top of the block with the empty/placeholder HALT guard Step 3b.1 and 7.6a use, and add a test that runs the block (fence form) or asserts each block binds what it reads.'
    suggested_owner: dev
    status: open
  - id: 'TASK-242-CR-2'
    severity: high
    file: 'skills/finalise/SKILL.md'
    finding: 'Step 3a scope block (SKILL.md:495) reads ${STEM} and ${DOD_N} unbound, so the glob is ".dod.*.ac.json", no prior record ever matches, and every re-run reports full (no-prior-record) at exit 0 — the scoping never fires.'
    suggested_action: 'Bind STEM and DOD_N in the block as substituted inputs and HALT when either is empty or still a {…} placeholder.'
    suggested_owner: dev
    status: open
  - id: 'TASK-242-CR-3'
    severity: medium
    file: 'shared/resources/finalise-rerun-scope.js'
    finding: 'mergeReportedGap (finalise-rerun-scope.js:487) recomputes a reported-gap criterion to PASS whenever its counted members pass and both citations exist, overturning an agent FAIL that rests on a non-member reason such as test_runs_per_pr: false.'
    suggested_action: 'Keep the agent FAIL when test_runs_per_pr is false or the FAIL cites a non-member reason; override only when the FAIL is fully explained by carried or advisory members.'
    suggested_owner: dev
    status: open
  - id: 'TASK-242-CR-4'
    severity: medium
    file: 'shared/resources/finalise-rerun-scope.js'
    finding: 'A prior-PASS member listed for re-check that the agent omits keeps its prior PASS (finalise-rerun-scope.js:468), so a criterion can PASS on stale member evidence; an omitted whole criterion becomes FAIL, an omitted member does not.'
    suggested_action: 'Count an omitted re-check member as FAIL with a no-verdict-returned note.'
    suggested_owner: dev
    status: open
  - id: 'TASK-242-CR-5'
    severity: medium
    file: 'skills/finalise/SKILL.md'
    finding: 'The AC record was added to 7.6a staging and to the step-7 doc''s tracked-and-pushed claim, but 7.6b''s ARTIFACTS list (SKILL.md:1696) was not updated, so an unpushed record passes 6b.'
    suggested_action: 'Add the AC record to 7.6b''s story/task ARTIFACTS when it exists, and pin that 6a and 6b name the same artefacts.'
    suggested_owner: dev
    status: open

