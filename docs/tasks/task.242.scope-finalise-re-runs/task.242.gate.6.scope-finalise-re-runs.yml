    finding: 'resolveCitation (finalise-rerun-scope.js:158-160) widens a bare basename only when a gone path shares it. When a prior PASS cites "b.js:1" (meaning src/b.js), and since the prior head src/b.js was modified and lib/z/b.js was added, HEAD carries the basename twice and nothing is gone, so the token resolves to nothing. The criterion''s other, unchanged path then carries it as unchanged. Reproduced by execution: carry=[SC-2 unchanged] with changed=[lib/z/b.js, src/b.js]; the control without the addition gives evidence-changed. This breaks §3: a carried verdict is re-judged as soon as any cited path changes. Code-review CR6-1 (bug, medium, confidence high), promoted by code_review_blocking.'
    suggested_action: 'On the scope side only (prior-record citations; merge keeps the HEAD-alone rule from CR5-1), resolve a bare basename to every candidate whenever any changed path carries it (added, modified or gone), so an ambiguity that appears after the prior head fails toward re-judge. Add a scope test for "cited file modified plus a same-basename file added", with the modify-only control.'
