    suggested_action: 'Stop claiming exactness for a basename a gone path shares: when any file with that basename is gone since the prior head, resolve the bare citation to every candidate (HEAD and gone), so the criterion counts as changed and is re-judged. Replace the "unrelated same-basename deletion" and "two gone candidates" assertions with that rule.'
