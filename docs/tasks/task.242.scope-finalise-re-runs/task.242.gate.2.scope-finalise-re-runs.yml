task_title: 'Scope finalise re-runs to the gaps and the changed evidence'
gate: FAIL
status_reason: 'All eight cycle-1 findings are fixed and mutation-proved, but the cycle-2 refute pass found three high engine defects that let a re-run carry or restore a PASS it should not. Two come from the reported-gap merge rule: an omitted criterion, and an invented member on unchanged evidence. The third is a cited path that was deleted or renamed since the prior head.'
reviewer: 'QA Engineer'
head: '15185f81e9e4b80959b84604c9513defcb28f8b3'
updated: '2026-10-29T07:30:36Z'

top_issues:
  - id: 'TASK-242-CR2-1'
    severity: high
    file: 'shared/resources/finalise-rerun-scope.js'
    finding: 'mergeReportedGap (finalise-rerun-scope.js:501): when the agent omits a member-shaped reported-gap criterion, or returns it under an id the engine did not issue, agentFailed is false. If the prior FAIL had no failing member (for example an execution-rule FAIL) every member is carried as PASS, so the prior FAIL becomes PASS. The member-less branch at :439 already keeps it FAIL.'
    suggested_action: 'When agentAc is absent, keep the prior FAIL with a "no verdict returned" note, as the member-less branch does, and test both the omitted and the mis-identified case.'
    suggested_owner: dev
    status: open
  - id: 'TASK-242-CR2-2'
    severity: high
    file: 'shared/resources/finalise-rerun-scope.js'
    finding: 'explainedByMembers (finalise-rerun-scope.js:505) counts a new member on unchanged evidence as explaining the FAIL. An agent FAIL for a non-member reason that also lists one invented FAIL member therefore becomes PASS, and the agent''s note is overwritten. This contradicts the AC prompt''s Step 0 ("a FAIL that names no failing member stands"). The cycle-1 CR-3 fix introduced it.'
    suggested_action: 'Let the agent name a non-member FAIL in a structured field the engine reads (a note cannot be parsed), and keep its FAIL whenever that field is set. When the members do overturn a FAIL, keep the agent''s note as an advisory. The task.239 replay (G5 carried, G7 advisory → PASS) must still pass.'
    suggested_owner: dev
    status: open
  - id: 'TASK-242-CR2-3'
    severity: high
    file: 'shared/resources/finalise-rerun-scope.js'
    finding: 'resolveCitation (finalise-rerun-scope.js:145) keeps only paths tracked at HEAD, so a path deleted since the prior head drops out of the criterion''s evidence. git diff --name-only also reports a rename under its new name only, so a renamed citation is lost too. If any other cited path is unchanged, scope carries the PASS as "unchanged".'
    suggested_action: 'Resolve citations against the files tracked at HEAD plus the changed set, and diff with --no-renames so both old and new paths appear. A cited path that changed or vanished then sends the criterion to evidence-changed.'
    suggested_owner: dev
    status: open

