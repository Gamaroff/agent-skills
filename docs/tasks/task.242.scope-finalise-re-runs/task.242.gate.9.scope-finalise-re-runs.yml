status_reason: 'The cycle-8 fix (QA8-1, replace the ambiguity rule) is verified: restoring the old rule turns 6 tests red, dropping gone candidates turns 3 red and ignoring goneCandidates turns 2 red. No high finding. The independent reviewer found one more gap in the same rule, at high confidence, promoted under code_review_blocking and reproduced by execution: a slash-less token that also names a file at the repository root returns at the exact-path check before the basename rule runs, so it resolves to the root file alone. This is true for a HEAD file (CR-1) and, in merge, for a gone file (CR-2).'
