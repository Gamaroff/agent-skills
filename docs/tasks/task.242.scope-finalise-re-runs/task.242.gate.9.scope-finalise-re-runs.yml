  - id: 'TASK-242-QA9-1'
    severity: medium
    file: 'shared/resources/finalise-rerun-scope.js'
    finding: 'resolveCitation (finalise-rerun-scope.js:146) checks tracked.paths before the bare-basename rule, and a slash-less token equal to a repository-root path stops there. CR-1: with README.md and skills/f/README.md tracked and only the nested one changed, resolveCitation("README.md:12") returns ["README.md"], so the scope side carries a criterion whose cited file changed, and merge sends a new member to advisories instead of counting it. The same shape with no root file ("dup.js" over a/dup.js and b/dup.js, b changed) resolves to both. CR-2: evidenceIndex adds gone paths to paths even under goneCandidates: false, so in merge a bare "b.js:3" resolves to a deleted root b.js (changed, counted), while the same citation with old/b.js deleted resolves to lib/b.js (unchanged, advisory). Reproduced by execution with node -e against the engine. This repository tracks 40 README.md files including one at the root, plus package.json twice and skills-config.yaml three times. Source: code-review CR-1 and CR-2 (bug, medium, confidence high), promoted under code_review_blocking. They share one root cause.'
    suggested_action: 'A slash-less token resolves through the basename maps only: byBase (which already holds root files) plus goneByBase when present, never through the exact-path check. Add identity-pair tests with a candidate at the repository root, on the scope side (carry vs re-judge) and the merge side (counted vs advisory), and the root-level gone case in the merge index assertions.'
    suggested_owner: dev
    status: open

