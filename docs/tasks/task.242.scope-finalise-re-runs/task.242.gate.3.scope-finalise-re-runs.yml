top_issues:
  - id: 'TASK-242-CR3-1'
    severity: high
    file: 'shared/resources/finalise-rerun-scope.js'
    finding: 'evidenceIndex (finalise-rerun-scope.js:161) adds every changed path to the citation index, and the diff now runs with --no-renames. A same-basename directory move (git mv src/b.js lib/b.js) therefore puts two b.js paths in the index. The unique-basename rule then fails, so a bare "b.js:1" citation resolves to nothing, and a PASS criterion whose other citation is unchanged is carried as "unchanged". Reproduced in a real git repo: the cycle-2 head 15185f81 gives SC-2 evidence-changed; a43bee98 gives SC-2 unchanged. The CR2-3 fix introduced this regression, the identity-rule merge direction its test did not carry (its rename also changed the basename, and it cited a full path).'
    suggested_action: 'Resolve a bare basename against the HEAD-tracked paths first, falling back to the changed-only paths when HEAD has no match, or treat an ambiguous basename as changed when any of its candidates is in changed. Test a same-basename directory move cited bare, with an unchanged co-citation.'
    suggested_owner: dev
    status: open

