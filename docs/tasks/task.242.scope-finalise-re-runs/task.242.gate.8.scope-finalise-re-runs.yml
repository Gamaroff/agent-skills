    finding: 'memberEvidence (finalise-rerun-scope.js:218) returns "unresolved" for two different states: a citation that names nothing tracked, and a bare basename several HEAD files carry with no candidate changed, where the evidence is known to be unchanged. merge counts "unresolved", so a new member G9 citing "a.test.mjs:3" alone (tests/a.test.mjs and lib/z/a.test.mjs both tracked, neither changed) is counted and its FAIL stands (SC-3=FAIL), while "tests/b.test.mjs:1, a.test.mjs:3" in the same fixture reads unchanged, goes to advisories, and the FAIL is overturned (SC-3=PASS). Reproduced by execution in a scratch worktree with a temporary copy of the QA7-1 test. This repository tracks 335 basenames more than once (git ls-files), mostly bundled copies such as finalise-rerun-scope.js, so the task.239 shape (a finer member on unchanged evidence) is overturned only when the cited basename happens to be unique. Source: code-review CR-1 (bug, medium, confidence high), promoted under code_review_blocking.'
    suggested_action: 'Make an ambiguous bare basename with no changed candidate read as unchanged evidence, not unresolved: in merge, and on the scope side too if the same rule is wanted there (code-review CR-2, low). The reviewer suggests resolving an ambiguous basename to every candidate always. Note that the existing scope test "citations that resolve to no tracked path → evidence-unresolved; a unique basename resolves" pins today''s scope-side behaviour (cycle-7 mutation 2), so that test changes with it. Add the lone-token twin of the QA7-1 merge test (no candidate changed: expect PASS plus the advisory). Or take the structural option in recommendations.future.'
    suggested_owner: dev
    status: open

