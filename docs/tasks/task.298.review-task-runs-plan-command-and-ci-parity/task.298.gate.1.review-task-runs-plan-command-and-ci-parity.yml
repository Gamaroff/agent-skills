    finding: 'The test "the new check exists and is the last item of the Step 3 list" asserts item.number equals the highest number in the Step 3 list. Appending a check 32 to a scratch copy of review-task/SKILL.md (REVIEW_RUN_PARITY_ROOT) turns it red (6 pass, 1 fail); the real tree is green (7 pass). The next task to add a review-task check would fail CI on a test that has nothing to do with its change. Origin: code-review, reproduced by QA.'
    suggested_action: 'Keep the existence assertion and drop the "highest" equality: assert item.number is at least 31 and does not exceed the highest number, so a later check does not break it. Rename the test to match.'
