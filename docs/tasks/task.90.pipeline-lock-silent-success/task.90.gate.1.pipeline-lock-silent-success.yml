status_reason: 'The code fix is correct, complete and mutation-proved — but a 28 MB corrupted implementation report was committed and pushed to PR #313, and the task rationale repeated verbatim in CHANGELOG.md and the PR body is factually false on 6 of the 8 inputs it names.'
