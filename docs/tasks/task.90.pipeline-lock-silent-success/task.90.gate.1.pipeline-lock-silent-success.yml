top_issues:
  - id: 'T90-QA1-001'
    severity: high
    file: 'docs/tasks/task.90.pipeline-lock-silent-success/task.90.implementation.1.pipeline-lock-silent-success-initial-run.md'
    finding: 'The implementation report is corrupted: 480,884 lines / 28 MB, with the Step 3 retraction block duplicated 12,326 times and the original report structure destroyed. Committed in 293da69 and pushed to PR #313. Cause: a correction script computed s[start:end] where end preceded start, yielding an empty needle, and Python str.replace("", X) inserts X between every character. `prettier --check` passes on it, so no existing gate catches it.'
    suggested_action: 'Rebuild the implementation report from its real content (Pipeline Configuration, Pipeline Progress, Decisions Log, Issues Log incl. the bundler retraction, QA Iteration History, Completion) and amend or add a commit. Verify with `wc -l` before committing — the file should be a few hundred lines.'
    suggested_owner: dev
    status: open

  - id: 'T90-QA1-002'
    severity: medium
    file: 'docs/tasks/task.90.pipeline-lock-silent-success/task.90.pipeline-lock-silent-success.md'
    finding: '§2 claims 18 executed `current_step` values "all correctly preserve the lock and exit non-zero" and that the zero-byte case is "the single hole in an otherwise well-behaved validator". Executed: of the 8 values named, 6 (`null`, absent, `"abc"`, `-3`, `3.7`, `1e400`) ADVANCE and exit 0, rewriting the lock. Only malformed-JSON and non-JSON exit non-zero. The claim is shipped verbatim in CHANGELOG.md (user-facing) and in the PR #313 body.'
    suggested_action: 'Correct the claim in the task §2, CHANGELOG.md and the PR body to what actually holds: unparseable input fails closed; a parseable object with a garbage `current_step` advances to a valid step (defensible, and not what this task changes). Do not restate "single hole".'
    suggested_owner: dev
    status: open

  - id: 'T90-QA1-003'
    severity: medium
    file: 'shared/resources/advance-pipeline-lock.sh'
    finding: 'A lock file whose entire content is the 4 bytes `null` still reports `advance-pipeline-lock: step 0 → 5`, exits 0, and FABRICATES `{"current_step":5}` from a lock that held no object — the exact silent-success shape this task exists to close. Pre-existing (byte-identical behaviour on origin/develop) and outside the task''s stated §4 scope, but it is the counterexample that falsifies the "single hole" rationale, and the guard is one predicate away from covering it.'
    suggested_action: 'Either extend `require_parsable_lock` to reject a lock that is not a JSON object (`jq -e "type == \"object\"" >/dev/null`), adding a test scenario; or state the exclusion explicitly in §4 Out of scope so the residual is recorded rather than implied absent.'
    suggested_owner: dev
    status: open

