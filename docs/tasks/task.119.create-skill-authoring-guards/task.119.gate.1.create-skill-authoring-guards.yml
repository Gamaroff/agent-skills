    file: 'tests/fenced-bash-positional-params.test.js'
    finding: 'runnableLines() treats any bare closing fence as closing the current block, so a ```markdown template that embeds a ```mermaid/```bash block inverts fence state for the rest of the file — verified: mermaid-architect (1 real bash block, 0 scanned), create-epics-from-shards (2 → 0), create-parallel-stories (13 → 9), qa-story (16 → 15); a token injected after the nested template is not reported.'
    suggested_action: 'Track fence nesting explicitly (a fence line with a non-empty info string inside an open block opens a nested fence that its own bare closer pops; only the outermost bare closer ends the runnable block), add a §4 fixture case for a template block embedding a nested fence followed by a real bash block carrying a token, and confirm the live scan count rises to the naive opener count on all four affected files.'
