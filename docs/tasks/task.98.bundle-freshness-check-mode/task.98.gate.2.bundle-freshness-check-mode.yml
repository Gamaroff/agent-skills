    notes: >-
      Carried forward from cycle 1 — three hostile probes (symlink escaping the
      repo, symlink at its own source, banner declaring a traversal path), all of
      which report without following or writing. Cycle 2 re-probed the two new
      branches and found no new security surface: `_is_binary` and
      `_read_text_or_error` both only read, and UNREADABLE echoes only an
      exception class name.
  performance:
    status: CONCERNS
    notes: >-
      A non-UTF-8 file is now read in full three times per check — once by
      `_read_text_or_error` (which raises), once by `_is_binary`, and once by
      `_looks_bundled`. Bounded in practice (binary references are rare and
      small) but avoidable: `_is_binary` needs one byte, not the file.
  reliability:
    status: FAIL
    notes: >-
      The check can report a clean result over a file it could not open (see
      T98-QA-003). Everything else holds — read-only still mutation-proved, the
      degraded-input matrix still handled.
  maintainability:
    status: PASS
    notes: >-
      The cycle-1 fixes are well-factored and carry their reasons. The defect
      found here is a missed second call site, not a design problem.

