task: 'task.98.bundle-freshness-check-mode'
task_title: 'A per-file bundle-freshness assertion the regenerate-and-diff check cannot provide'
gate: FAIL
status_reason: 'The cycle-2 refute pass found that an orphaned copy which is also unreadable reports "0 problems" — a clean result from a read that failed. Cycle 1 fixed this exact conflation in the main loop and left it in the orphan scan, twenty lines away in the same function.'
reviewer: 'QA Engineer'
updated: '2026-09-09T22:30:00Z'

top_issues:
  - id: 'T98-QA-003'
    severity: high
    file: 'skills/create-skill/scripts/bundle_skill.py'
    finding: >-
      In the orphan scan, an unreadable file is skipped by `if text is None:
      continue`, which treats "could not read it" as "it makes no provenance
      claim". A copy whose source was deleted AND which cannot be read therefore
      produces the output "✅ bundle freshness: 1 skill(s) checked, 0 problems" —
      a clean result produced by a failed read. For a CI gate whose entire purpose
      is to catch staleness that is otherwise invisible, silently reporting
      success is the worst available failure mode, and it is the one this
      repository names as its central principle: an empty result is a claim about
      the instrument. Cycle 1 corrected precisely this conflation in the main loop
      and did not carry the correction twenty lines down into the orphan scan.
    suggested_action: >-
      Use `_read_text_or_error` in the orphan scan and report UNREADABLE when the
      read fails on a file that is not binary. A non-UTF-8 file must still be
      skipped silently — a banner genuinely cannot be read from it, which is
      residual 6 (documented, bounded), not a broken instrument.
    suggested_owner: dev
    status: open

