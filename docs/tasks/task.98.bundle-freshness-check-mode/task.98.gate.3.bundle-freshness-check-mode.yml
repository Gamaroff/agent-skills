nfr_validation:
  security:
    status: PASS
    evidence: measured
    probes_executed: 6
    notes: >-
      Six hostile probes across three cycles, all executed rather than reasoned
      about. Cycle 1 (3): a symlink escaping the repo — reported, target
      byte-intact, never followed; a symlink at its own shared source, where a
      write-through would clobber the source — reported, source hash unchanged; a
      banner declaring `shared/resources/../../etc/passwd` — classified
      MISDECLARED, the path echoed but never opened. Cycle 3 (3): an unreadable
      directory at a reference name; an unreadable subtree under references/; an
      unreadable references/ directory itself. The check performs no writes, opens
      no network connection, and echoes only exception class names rather than
      file content.
  performance:
    status: PASS
    notes: >-
      126 skills in ~2.8s. The cycle-2 `_is_binary` fix removed two full file
      reads per non-UTF-8 reference. The cycle-3 switch from `Path.rglob` to
      `os.walk` is equivalent in cost.
  reliability:
    status: PASS
    notes: >-
      The class of defect this cycle set closed — a failed read presented as a
      clean result — was found in three separate places in the same function and
      is now handled at all three, each with a test and a mutation proof in both
      directions where over-reporting was also possible. One pre-existing crash
      remains (see below) and fails safe.
  maintainability:
    status: PASS
    notes: >-
      Built on `expected_bytes` and the writer's own discovery, so the check
      cannot drift from the bundler. Every non-obvious decision carries its reason
      at the site, including the two "this mutation proved nothing" moments.

