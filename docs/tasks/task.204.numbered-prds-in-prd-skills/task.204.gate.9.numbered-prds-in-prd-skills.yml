top_issues:
  - id: CR-1
    severity: medium
    file: 'skills/review-prd/scripts/migration-guard.mjs'
    finding: 'outside-links flags every tracked file that mentions the basename prd.md, not only files that reference this PRD; in a consumer that commits .agents/skills the vendored review-prd and shard-prd prose always matches, so the docs/prd.md migration is always refused (reproduced). The gate-8 row hides it by gitignoring .agents/.'
    suggested_action: 'Count only real references (the repo-relative path, or a relative link that resolves to the PRD), exclude the vendored skills tree, and add a row that commits .agents/skills.'
    suggested_owner: dev
    status: open
  - id: CR-2
    severity: medium
    file: 'docs/reference/configuration.md'
    finding: 'configuration.md:21-22,25, quickstart-story.md (epic section), pipeline-artifacts.md:14 and story-development.md:115 still describe {domain}/{feature}/epics/epic.{N}, contradicting the corrected PRD path beside them and the layout create-epic writes (prd.{P}.{feature}/epics/epic.{P}.{E}). Pre-existing since task 205, but a8810b54 made the same paragraphs self-contradictory.'
    suggested_action: 'Rewrite every PRD-subtree path in those docs to prd.{P}.{feature}/epics/epic.{P}.{E}.{name}/stories/story.{P}.{E}.{S}.{name}/ in one pass.'
    suggested_owner: dev
    status: open
  - id: CR-4
    severity: low
    file: 'skills/review-prd/SKILL.md'
    finding: 'In the apply block''s refusal print, `,` binds tighter than `|`, so (.error // empty) is evaluated per blocker; a guard usage error prints the refusal heading with no reason (reproduced).'
    suggested_action: 'Parenthesise: (.blockers[]? | "..."), (.error // empty).'
    suggested_owner: dev
    status: open
  - id: CR-5
    severity: low
    file: 'skills/review-prd/scripts/migration-guard.mjs'
    finding: 'Only . is escaped in the basename put into git grep -E, so a PRD name with +, (, [ or ? does not match itself and outside-links passes over real links (reproduced with docs/prd+v2.md).'
    suggested_action: 'Search with fixed strings (git grep -F) and decide the reference in JS.'
    suggested_owner: dev
    status: open

