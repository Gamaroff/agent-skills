top_issues:
  - id: CR-1
    severity: medium
    file: 'skills/review-prd/SKILL.md'
    finding: 'Input Resolution promises that a directory path resolves to its {dir}/{dir}.md, but a numbered directory input (docs/prd/shop/prd.3.shop/) becomes the input prd.3.shop, which parses as neither a number nor a matching slug, so the block reports "No PRD found" (reproduced).'
    suggested_action: 'When PRD_INPUT is an existing directory, return {dir}/{basename}.md if that file exists; add a test row for directory input.'
    suggested_owner: dev
    status: open
  - id: CR-2
    severity: medium
    file: 'skills/review-prd/SKILL.md'
    finding: 'For a PRD outside ${PRD_ROOT} (the root-level docs/prd.md the block handles), the prefix filter uses docs/ as the PRD directory, so every finding of every other PRD under docs/prd is reported as this PRD''s Critical issue (reproduced: 3 findings for a monolith that owns 1).'
    suggested_action: 'When the PRD file is outside ${PRD_ROOT}, report only its own bad-shape finding and skip the corpus filter; add a test row for the monolith.'
    suggested_owner: dev
    status: open
  - id: QA-1
    severity: medium
    file: 'evals/shared/tests/prd-skill-numbering.test.mjs'
    finding: 'Two success criteria are held by prose only: "offers the migration only when --check reports no blockers" (no row runs the plan block against a tree with a blocker), and the Migration criterion for a consumer holding docs/prd.md (no row runs the numbering or plan block on a monolith, which is how CR-2 went unseen).'
    suggested_action: 'Add rows: the plan block surfaces a blocker (unplaced-prd for docs/prd.md without MIG_NAME) and clears it with MIG_NAME=docs/prd.md=<slug>; the numbering block reports exactly one finding for the monolith.'
    suggested_owner: dev
    status: open
  - id: QA-2
    severity: medium
    file: 'evals/shared/tests/prd-skill-numbering.test.mjs'
    finding: 'The Code Quality criterion says every assertion in the new test is mutation-proven; the implementation report records 7 proofs over 16 rows (rows 2, 3, 6, 6b, 8, 10, 11, the bad-slug row, the clean-PRD row and the legacy-resolve row have none).'
    suggested_action: 'Mutation-prove each remaining row (revert the behaviour it names, confirm it goes red, restore) and record one line per proof, or narrow the criterion with a recorded reason for any row that cannot be proven.'
    suggested_owner: dev
    status: open

