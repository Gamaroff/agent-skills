top_issues:
  - id: 'TASK-180-004'
    severity: high
    file: 'shared/resources/security-probe.mjs'
    finding: 'runFenceCase has no collision guard between expected.absent and fixture.files: a case whose absent list names a file its own fixture writes mismatches on every run, so every hostile case scores accepted and the verdict reads absent with a full count. runShellCase and runCliCase decline this shape (task.128 BUG-13). Code review CR-1 (high/high), reproduced by the reviewer.'
    suggested_action: 'Decline the case when an expected.absent name equals a fixture.files key or its first path segment; add a regression test.'
    suggested_owner: dev
    status: open
  - id: 'TASK-180-005'
    severity: medium
    file: 'shared/resources/security-probe.mjs'
    finding: 'isShellParseFailure covers syntax errors only: an input that makes the shell stop with another diagnostic about the script (fatal expansion ${x:?boom}, parameter not set, command not found) is still scored rejected, so an accept-all block with such a hostile case scores engages. An injected exit ("; exit 1; ") is the residual no classifier can see. Code review CR-2 (medium/high), reproduced.'
    suggested_action: 'Score any shell diagnostic about the generated script errored, and state the injected-control-flow residual where the rule is documented, pointing hostile cases at expected.'
    suggested_owner: dev
    status: open
  - id: 'TASK-180-006'
    severity: medium
    file: 'shared/resources/security-probe.mjs'
    finding: 'The parse-failure branch runs before expected is compared: when one line runs the injection and a later line fails to parse, a side effect in the case directory (expected.absent hit) is recorded as errored, and the sentinel does not watch the work dir. Code review CR-3 (medium/high), reproduced.'
    suggested_action: 'Compare expected.absent before scoring a diagnostic run errored; a side effect seen is a reproduction.'
    suggested_owner: dev
    status: open
  - id: 'TASK-180-007'
    severity: low
    file: 'shared/resources/security-probe.mjs'
    finding: 'A fence: run that resolveEntry declines carries slot null (base.slot is set after resolveEntry), so its record key lacks the slot and the corrected re-run leaves a stale unverifiable entry — the task.144 5c CR-1 shape. Code review CR-4 (low/high), reproduced.'
    suggested_action: 'In the resolveEntry decline branch, copy a non-empty string slot onto base for a fence: entry, as the cli: argv template is.'
    suggested_owner: dev
    status: open
  - id: 'TASK-180-008'
    severity: low
    file: 'shared/resources/security-probe.mjs'
    finding: 'platform-variance: extractFencedBlock splits on \n only, so on a CRLF checkout every heading carries \r and no fence: entry resolves. Code review CR-6 (low/medium).'
    suggested_action: 'Normalise CRLF to LF before reading headings and blocks; test with a CRLF doc.'
    suggested_owner: dev
    status: open

