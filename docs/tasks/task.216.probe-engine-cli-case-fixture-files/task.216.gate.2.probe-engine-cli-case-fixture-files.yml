    file: 'shared/resources/finalise-dod-security-prompt.md'
    finding: 'The new docs say a cli: case fixture serves a CLI that reads "a repository" (finalise-dod-security-prompt.md Step 4 cli: note and the repository-state paragraph after Step 1b''s list, probe-boundary-rule.md §5, the security-probe.mjs header, CHANGELOG), but fixture.files writes UTF-8 files only and cli: refuses --fixture-setup, so no commit or staged index can exist; a CLI that runs git log against fixture files .git/HEAD, config, objects and refs was still rejected (QA cycle 2 reproduction). Refute reviewer CR-1 (medium/medium), verified by QA.'
    suggested_action: 'Limit the cli: fixture claim to plain data directories in all five places, and state that a CLI reading committed or staged repository state is not yet reachable on cli: (shell-argv: with --fixture-setup is), beside the existing "directory too large to inline" caveat.'
    suggested_owner: dev
    status: open
  - id: 'TASK-216-QA2-2'
    severity: low
    file: 'shared/resources/security-probe.mjs'
    finding: 'CLI_INTERPRETER_ENV refuses PATH and NODE_OPTIONS as interpreter-steering, but fixture.env extends the sandbox allow-list freely, so LD_PRELOAD, LD_LIBRARY_PATH and the macOS DYLD_INSERT_LIBRARIES / DYLD_LIBRARY_PATH still reach node or python3 and can change how it loads or crashes. Refute reviewer CR-3 (low/low).'
    suggested_action: 'Add the dynamic-loader variables to CLI_INTERPRETER_ENV with a test that one of them is declined by name, and keep the docs'' wording in step.'
    suggested_owner: dev
    status: open

