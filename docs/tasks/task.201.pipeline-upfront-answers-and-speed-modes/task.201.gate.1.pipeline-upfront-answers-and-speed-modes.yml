status_reason: 'The §0d answer-resolution block cannot run as written: it reads PIPELINE_MODE and EPIC_BRANCH that no line of the block binds, so the :? guard aborts every story/task run and the epic-integration conflict is never checked. Resume does not reuse a persisted mode or skips, and branch flag values reach git unvalidated.'
reviewer: 'QA Engineer'
