top_issues:
  - id: 'CR-1'
    severity: medium
    file: 'shared/resources/pipeline-answers.js'
    finding: 'On resume the waiver is rebuilt from the resuming invoker; an unset user.name yields approved_by null with no refusal, and Step 1''s merge overwrites the lock''s original approver.'
    suggested_action: 'Keep the lock''s own waiver on resume (read it with the answers) and never overwrite an existing waiver.'
    suggested_owner: dev
  - id: 'CR-2'
    severity: medium
    file: 'shared/resources/develop-pipeline-step-0-resolve-and-prepare.md'
    finding: 'The skill''s arguments are pasted verbatim inside a double-quoted --args "…"; a quoted value (--skip "review, qa-depth") breaks the quoting and $ or backticks would be expanded by the shell.'
    suggested_action: 'Pass the arguments without shell interpolation — a single-quoted heredoc read by the CLI from stdin.'
    suggested_owner: dev
  - id: 'CR-4'
    severity: low
    file: 'shared/resources/record-reviewed-blob.js'
    finding: 'The writer''s frontmatter strip is narrower than the reader''s splitFrontmatter (quoted or spaced keys; a non-YAML --- block), so some stamped reports read ambiguous.'
    suggested_action: 'Locate frontmatter and its reviewed_blob key with the reader''s own splitFrontmatter.'
    suggested_owner: dev
  - id: 'CR-5'
    severity: low
    file: 'shared/resources/record-reviewed-blob.js'
    finding: 'A stamp line that also opens an HTML comment is deleted whole, exposing the commented lines below as prose.'
    suggested_action: 'Re-run the prose view after removal and refuse (or keep the rest of the line) when any other line''s view changed.'
    suggested_owner: dev
  - id: 'CR-6'
    severity: low
    file: 'shared/resources/pipeline-answers.js'
    finding: 'The resume skip comparison uses length plus one-way inclusion, so duplicates make different sets compare equal.'
    suggested_action: 'Compare de-duplicated sets both ways.'
    suggested_owner: dev

