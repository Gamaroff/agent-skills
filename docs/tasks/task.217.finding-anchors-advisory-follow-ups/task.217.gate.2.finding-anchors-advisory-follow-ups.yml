top_issues:
  - id: 'TASK-217-QA2-1'
    severity: medium
    file: 'skills/review-code/SKILL.md'
    finding: 'CR-1 (reproduced): the Step 5 apply-list block never checks TARGET, so the unfilled placeholder or a value such as `--staged` or `pr` disables both tree-diff skips — a staged file edited on top printed `apply: CR-1 (a.js)` where TARGET=staged prints `skipped`.'
    suggested_action: 'HALT on a TARGET outside worktree|staged|range as Step 2b does, with a block-test case; the fence: probe fills one slot, so keep the Step 5 control reachable another way (a second probe slot, or a case-level fill) rather than dropping the check.'
    suggested_owner: dev
  - id: 'TASK-217-QA2-2'
    severity: medium
    file: 'skills/review-code/SKILL.md'
    finding: 'CR-2 (reproduced): `git diff --quiet [HEAD] -- "$P"` exits 0 for a path that matches nothing, so the block run from a subdirectory treats every root-relative path as clean — TARGET=staged from sub/ printed `apply: CR-1 (a.js)` for a file whose working tree differs from the index; the comment says a git that cannot answer skips.'
    suggested_action: 'cd to `git rev-parse --show-toplevel` (HALT if that fails) at the top of the block, and skip a path that is not in the checked tree instead of trusting the diff exit code.'
    suggested_owner: dev
  - id: 'TASK-217-QA2-3'
    severity: low
    file: 'skills/review-code/SKILL.md'
    finding: 'CR-5 (reproduced): the shell selectors trim with jq `\s`, which does not strip U+FEFF, while the checker trims with JS trim(), which does — a BOM-prefixed `a.js:1` is verified as a.js but parsed as `﻿a.js`, so Step 5 skipped no tree check (`apply: CR-1 (﻿a.js)` on a dirty file) and the inline selectors would post to a path that does not exist.'
    suggested_action: 'Strip what JS trim() strips before the capture in all three selectors (review-code Step 4.2, Step 5, review-pr), or have the checker write the parsed path into the annotated finding so the shell never re-parses it.'
    suggested_owner: dev
  - id: 'TASK-217-QA2-4'
    severity: low
    file: 'CHANGELOG.md'
    finding: 'CR-3 (verified by reading): the task 217 entry says "The summary comment still posts" when the stamp guard HALTs, which holds for /review-pr (summary first) but not /review-code, whose Step 4.3 fallback fires only on no file_line or no-credentials; the task document Risk table repeats the claim.'
    suggested_action: 'Either add "or the Step 4.2 guard HALTs" to the Step 4.3 triggers, or scope both claims to /review-pr.'
    suggested_owner: dev

