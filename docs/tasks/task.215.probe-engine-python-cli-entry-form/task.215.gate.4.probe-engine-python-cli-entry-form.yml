top_issues:
  - id: 'TASK-215-QA4-1'
    severity: high
    file: 'shared/resources/security-probe.mjs'
    finding: 'PYTHON_BOOTSTRAP writes the crash token to whatever fd 3 is at crash time and the engine reads only its presence, so a script that runs os.closerange(3, N) loses the marker, or has it written into a file it opened afterwards; behind a quiet excepthook the crash is scored rejected. Reproduced by the cycle-4 probe (py-cli.crash-closes-fd3, overblocked) and by diff reviewer CR-1 (hostile cases rejected, verdict engages). (location unverified: shared/resources/security-probe.mjs:807 — the reviewer line_text differs from the source by one backslash escape; line 807 is the token write) Bug report: task.215.bug.7.closed-fd3-loses-crash-marker.md'
    suggested_action: 'Make the channel positive — a token on every exit the bootstrap controls, a missing token read as errored — and check fd 3 is still the engine pipe before writing; or have the maintainer scope SC4 to scripts that leave fd 3 open.'
    suggested_owner: dev
    status: open
  - id: 'TASK-215-QA4-2'
    severity: medium
    file: 'shared/resources/security-probe.mjs'
    finding: 'platform-variance: probePython checks python3 under the engine env (real HOME, PYTHON* variables) while every case runs under caseEnv, so an interpreter that starts only under the real HOME passes the probe and then scores every case rejected (rejects-every-input) instead of entry-not-probeable. Diff reviewer CR-2 (medium/high), reproduced with a HOME-dependent python3 shim. Bug report: task.215.bug.8.interpreter-probe-env-differs.md'
    suggested_action: 'Probe the interpreter as a case runs it (caseEnv-shaped env, PYTHON_FLAGS, a trivial -c body), or let a bootstrap start token turn a child that never started into errored.'
    suggested_owner: dev
    status: open

