top_issues:
  - id: 'TASK-215-QA1-1'
    severity: high
    file: 'shared/resources/security-probe.mjs'
    finding: 'isPythonCrash requires the LAST non-empty stderr line to be an exception line, so an uncaught crash with a multi-line message, an ExceptionGroup, or stderr output after the traceback (atexit) returns false and is scored rejected. 3 of 7 measured crash shapes; a fourth (add_note) passes by accident. SC4 says never rejected. Reviewer CR-1 rated this medium/high confidence. QA raises it to high on measurement: SC4 is unmet and the effect is a false pass (run record task.215.qa.1.security.run.json). Bug report: task.215.bug.1.python-crash-read-as-refusal.md'
    suggested_action: 'Anchor on the traceback, not the last line: a Traceback header plus a File frame is a crash whatever follows; a frame plus a SyntaxError-family line is a compile crash. Add the three shapes as test inputs or fixtures, and revisit the unit case asserting a traceback followed by a refusal line is false.'
    suggested_owner: dev
    status: open
  - id: 'TASK-215-CR-2'
    severity: low
    file: 'shared/resources/tests/security-probe.test.mjs'
    finding: 'The "-E -s -B, never -I" flags test asserts only inside a loop over r.cases and has no non-vacuity floor, so a run that declines with zero cases passes without checking any flag.'
    suggested_action: 'Assert r.executed > 0 and r.interpreter.name === "python3" before the loop.'
    suggested_owner: dev
    status: open

