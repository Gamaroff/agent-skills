top_issues:
  - id: 'TASK-215-QA2-1'
    severity: high
    file: 'shared/resources/security-probe.mjs'
    finding: 'isPythonCrash reads only what the default sys.excepthook prints, so an uncaught exception that exits 1 is scored rejected when the script replaced sys.excepthook (rich.traceback.install(), Typer pretty exceptions), set sys.stderr = sys.stdout, or set sys.stderr = None. Reproduced on python3 3.14 for a custom excepthook, stderr redirected to stdout and stderr None (exit 1, isPythonCrash false). An input-dependent crash of these shapes yields engages: a false pass. Diff reviewer CR-1 (high/high). Bug report: task.215.bug.2.crash-outside-default-excepthook.md'
    suggested_action: 'Detect the uncaught exception out of band, not from stderr: run the entry through a python3 -E -s -B -c bootstrap that sets sys.argv and sys.path[0], runs runpy.run_path(entry, run_name="__main__"), and catches BaseException other than SystemExit before any excepthook runs, then reports it on a channel the script cannot write (a reserved exit status or a dedicated fd). This also covers sys.tracebacklimit = 0.'
    suggested_owner: dev
    status: open
  - id: 'TASK-215-QA2-2'
    severity: medium
    file: 'shared/resources/probe-boundary-rule.md'
    finding: 'The rule names sys.tracebacklimit = 0 as the one undetectable crash and calls it unavoidable; a replaced excepthook and a redirected or None sys.stderr are scored the same false rejected, and all are detectable from the process. The documented limit understates the class. Diff reviewer CR-2 (medium/high). Bug report: task.215.bug.3.limit-note-understates-class.md'
    suggested_action: 'Close the class with TASK-215-QA2-1 and drop the limitation note; if any shape stays undetectable, list every one and say an input-dependent crash of that shape yields engages.'
    suggested_owner: dev
    status: open

