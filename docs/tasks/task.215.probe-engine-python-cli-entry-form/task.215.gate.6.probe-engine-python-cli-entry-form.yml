status_reason: 'Cycle 5 fix verified (the outside-the-main-frame shape is stated and pinned; crash-record precedence tested). The stated limit is not accurate: a crash at shutdown flush exits 120 after the answer record and scores rejected (verdict engages, a measured false pass), and a worker-thread refusal that exits 1 scores errored, not by its exit status as the text says.'
