top_issues:
  - id: 'TASK-215-QA6-1'
    severity: medium
    file: 'shared/resources/security-probe.mjs'
    finding: 'A .py CLI whose stdout flush fails at interpreter shutdown exits 120 after the bootstrap wrote its answer record; runCliCase scores it rejected, so a hostile case that crashes this way reads as a refusal (measured: verdict engages, both hostile cases rejected/120). probe-boundary-rule.md, the bootstrap comment and CHANGELOG all say a failure outside the main frame is never a pass. Diff reviewer CR-2 (low/medium), raised to medium on the measured false pass; the trigger is contrived, so not high. Bug report: task.215.bug.10.shutdown-flush-crash-scored-refusal.md'
    suggested_action: 'Score a .py exit 120 as errored (CPython reserves it for a failed flush at finalisation), with a fixture and test; narrow the limit wording to the shapes Python swallows with the exit status unchanged.'
    suggested_owner: dev
    status: open
  - id: 'TASK-215-QA6-2'
    severity: low
    file: 'shared/resources/probe-boundary-rule.md'
    finding: 'The sentence "a control that validates in a worker thread is probed through the exit status its main thread chooses" is false for the usual refusal pattern: the thread raises, threading.excepthook prints a traceback with frames, the main thread exits 1, the stderr signal fires and the case is errored (measured). Safe direction; inaccurate text. Diff reviewer CR-1.'
    suggested_action: 'Qualify it: an exit 1 after a worker-thread traceback is read as a crash (errored); the main thread''s status decides only when it is not 1 or nothing is printed.'
    suggested_owner: dev
    status: open
  - id: 'TASK-215-QA6-3'
    severity: low
    file: 'shared/resources/tests/security-probe.test.mjs'
    finding: 'The thread-crash test checks only hostile cases found in r.cases (floor of one), so a hostile case moved to r.declined is skipped silently, and nothing shows the worker thread raised — a fixture that accepts every input passes the same way. Diff reviewer CR-3 (cleanup).'
    suggested_action: 'Look up every hostile case in [...r.cases, ...r.declined] and assert evidence that the thread raised (the case stderr carries "Exception in thread").'
    suggested_owner: dev
    status: open

