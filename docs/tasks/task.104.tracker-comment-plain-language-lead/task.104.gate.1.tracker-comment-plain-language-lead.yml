      end-to-end. GATE_MEANING is safe, but by luck rather than design: verdictSentence uppercases the
      key and no Object.prototype member is all-caps. That should carry a comment saying the uppercase
      is load-bearing, or someone will simplify it away.
  performance:
    status: PASS
    notes: "Pure string concatenation, no I/O, no new dependency, no extra network call. A 10MB slot renders without error."
  reliability:
    status: CONCERNS
    notes: >-
      The guard itself fails closed and is proven to post nothing. Against that: T104-003 is a
      one-flag bypass of the standard, and T104-001 makes the engine assert the opposite of the
      caller's intent for a whole class of slot value.
  maintainability:
    status: CONCERNS
    notes: >-
      The imported-not-restated stage list is a genuine structural strength. Against it: help text
      that contradicts behaviour (T104-002), a test that asserts on its own construction (T104-006),
      12 argv arrays carrying a meaningless duplicate flag (T104-007), and a third looser copy of the
      cycle-suffix rule that disagrees with isKnownStage on "done-1".

