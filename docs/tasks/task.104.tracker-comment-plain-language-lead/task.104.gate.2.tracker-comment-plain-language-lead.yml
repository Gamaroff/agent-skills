task_title: "Every tracker comment opens with a plain-language summary — the engine primitive"
gate: PASS
status_reason: "Cycle 1's seven findings are closed and mutation-proven. The cycle-2 refute pass found four further defects — all of them in cycle 1's own fixes, three of them mine — and all are now closed and mutation-proven. Zero open findings; ci:fast 3123 pass / 0 fail; eval:all green."
