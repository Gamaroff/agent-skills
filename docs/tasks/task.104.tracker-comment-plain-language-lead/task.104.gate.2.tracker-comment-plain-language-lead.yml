updated: "2026-09-10T13:05:00Z"

top_issues:
  - id: "C2-001"
    severity: medium
    file: "shared/resources/stakeholder-summary.js:169"
    finding: >-
      The cycle-1 slot-coercion fix applied ONE falsey-string list to every slot, so a TEXT slot
      legitimately valued "No", "None" or "0" was silently dropped — `--slot title=None` rendered as
      though no title were given. This is the failure that fix's own commit message named ("coercion
      that swallowed real values would be the worse bug") and then shipped, and it is worse than the
      defect it replaced because it fails silently in the opposite direction.
    suggested_action: "Coerce per slot TYPE — done."
    suggested_owner: dev
    status: closed
    fixed_date: "2026-09-10"

  - id: "C2-002"
    severity: low
    file: "shared/resources/tracker-comment.js:258"
    finding: >-
      `.trim()` leaves U+200B/U+FEFF/U+2060, so a --summary-file holding only zero-width characters
      passed the empty check and posted an invisible lead — the same bypass T104-003 closed, wearing
      a different character. The identical hole was also still open on --body-file.
    suggested_action: "Shared isVisiblyNonEmpty() predicate applied to both flags — done."
    suggested_owner: dev
    status: closed
    fixed_date: "2026-09-10"

  - id: "C2-003"
    severity: medium
    file: "shared/resources/jira-sync.js:5383"
    finding: >-
      T104-004 was fixed on ONE ARM ONLY, and the gate that closed it did not notice. `desiredLine`
      is captured in run(), which feeds the pre-gate defer; the Jira arm's in-flight defer is built
      inside jira.addComment and still derived the label from the already-composed body. So the
      regression survived on the Jira path with a closed finding sitting on top of it. Found by the
      cycle-2 refute pass, which reproduced both arms and showed them disagreeing.
    suggested_action: "Thread `desired` through runJira into addComment, defaulting to firstLineOf(body) — done."
    suggested_owner: dev
    status: closed
    fixed_date: "2026-09-10"

  - id: "C2-004"
    severity: medium
    file: "shared/resources/tracker-comment.js:597"
    finding: >-
      The C2-002 fix stripped the zero-width set from the lead's CONTENT rather than only for the
      emptiness test, so U+200D was deleted from what actually posted — the joiner inside every ZWJ
      emoji sequence and load-bearing for Indic and Arabic shaping. "Shipped by 👩‍💻" posted as
      "Shipped by 👩💻". Closing an emptiness hole is no licence to rewrite a human's text.
    suggested_action: "Test emptiness against a stripped copy; post the original — done."
    suggested_owner: dev
    status: closed
    fixed_date: "2026-09-10"

  - id: "C2-005"
    severity: low
    file: "shared/resources/stakeholder-summary.js:243"
    finding: >-
      `typeof template !== "function"` was dead: the hasOwnProperty guard excludes every prototype
      key and the frozen catalogue admits no non-function own value. Harmless, but permanently
      uncoverable code that reads as a guard.
    suggested_action: "Deleted."
    suggested_owner: dev
    status: closed
    fixed_date: "2026-09-10"

  - id: "C2-006"
    severity: low
    file: "shared/resources/stakeholder-summary.js:169"
    finding: >-
      BOOLEAN_SLOTS / NUMERIC_SLOTS were hand-maintained key lists living apart from the templates
      that consume them, with nothing asserting they agree. A new template introducing a boolean slot
      would get text semantics by default — re-opening the cycle-1 HIGH for that slot. The
      enumeration-drift class this repository keeps paying for.
    suggested_action: >-
      TEXT_SLOTS added and a test now scans the template sources for `s.<name>` reads, asserting each
      is classified in exactly one list and that no classified name is unread — with a non-vacuity
      floor so a broken scan cannot pass silently. Done.
    suggested_owner: dev
    status: closed
    fixed_date: "2026-09-10"

