top_issues:
  - id: 'TASK-206-CR-1'
    severity: medium
    file: 'skills/sync-github-story/SKILL.md'
    finding: 'Step 5b edit block reads STORY_ID that only Step 3 binds; run as its own shell it renames the issue to "[Story ] {title}" (bug.1).'
    suggested_action: 'Re-derive STORY_ID with doc-id parse inside the block; refuse an empty id; test the block executed alone.'
    suggested_owner: dev
    status: open
  - id: 'TASK-206-CR-2'
    severity: medium
    file: 'skills/ensure-story-github-issue/SKILL.md'
    finding: 'Milestone (l.114) and S4 create (l.178) blocks read MILESTONE_TITLE set only in Step S1, so an unbound value silently creates the issue without a milestone; the S3 dedup block reads STORY_ID the same way (CR-3, advisory) (bug.2).'
    suggested_action: 'Bind STORY_ID and the milestone (doc-id parse + epic-meta) inside each block that reads them; HALT on an empty id before the dedup search.'
    suggested_owner: dev
    status: open
  - id: 'TASK-206-CR-4'
    severity: medium
    file: 'shared/resources/bug-doc.js'
    finding: 'story.1.2.3.bug.1.500-error.md now resolves as mode unknown: doc-id requires a letter-first slug, where the base regex accepted it — a regression (bug.3).'
    suggested_action: 'Parent id from doc-id, remainder read with the looser bug-slug rule; add a digit-led-slug test.'
    suggested_owner: dev
    status: open
  - id: 'TASK-206-CR-5'
    severity: medium
    file: 'skills/create-story/SKILL.md'
    finding: 'The assertUniqueStoryId one-liner readdirSyncs {epic-directory}/stories, which does not exist for an epic first story, so it throws ENOENT instead of passing (bug.4).'
    suggested_action: 'Treat a missing stories/ directory as empty; move the check into an executed, tested block.'
    suggested_owner: dev
    status: open
  - id: 'TASK-206-CR-8'
    severity: low
    file: 'shared/resources/review-pipeline-step-0a-branch-setup.md'
    finding: 'The 0a.3 auto-skip block reads STORY_STEM that only the 0a.2 block binds; unbound, the auto-skip silently never fires.'
    suggested_action: 'Re-derive STORY_STEM from DOC_FILE with doc-id inside the 0a.3 block.'
    suggested_owner: dev
    status: open

