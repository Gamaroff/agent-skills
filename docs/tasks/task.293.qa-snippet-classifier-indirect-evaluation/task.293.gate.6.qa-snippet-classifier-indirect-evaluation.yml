top_issues:
  - id: 'T293-QA-9'
    severity: high
    file: 'shared/resources/qa-execute-snippets.mjs'
    finding: 'A quoted substitution in a compound array assignment subscript runs under bash 5.3 and classifies runnable: a=([0 then a single-quoted dollar-paren touch W close-paren, close-bracket]=1); echo hi creates W. The backtick form and a letter in place of the digit behave the same. The quote follows the digit, not the bracket, so the quote-after-bracket rule misses it; the block has no evaluating word and no live expansion or name-bracket, because the bracket follows an open paren. The control with a plain number in the quotes stays runnable and writes nothing.'
    suggested_action: 'Refuse any substitution literal inside an unclosed bracket in a compound array assignment (name=( or name+=( ), and add the shape to the real-bash table and the decider table.'
    suggested_owner: dev
    status: open
    origin: 'code-review CR-1, reproduced by QA'

