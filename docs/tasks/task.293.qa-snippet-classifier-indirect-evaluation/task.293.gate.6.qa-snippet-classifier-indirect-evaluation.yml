status_reason: 'Gate 6 (one owner-granted extra cycle, scoped to routes that keep the substitution text in the source; the three documented residuals were excluded). The independent reviewer found one in-scope route: a quoted substitution inside an indexed-array compound-assignment subscript, where the quote follows a character after the bracket and the bracket follows an open paren, so the quote-after-bracket rule and the live-expansion rule both miss it. QA reproduced it under bash 5.3 with a clean control.'
