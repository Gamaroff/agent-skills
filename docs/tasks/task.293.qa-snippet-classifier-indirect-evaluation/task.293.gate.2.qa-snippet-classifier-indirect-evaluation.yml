task_title: 'QA snippet classifier refuses indirect evaluation'
gate: FAIL
status_reason: 'Cycle 2 (refute pass plus safety re-probe) reproduced two more bypasses of the same family under bash 5.3: a bare word joined to a quoted literal (x=a quote-open [$(cmd)] quote-close) and a literal piped into a later read. Both classify runnable and write; both controls stay clean. The cycle-1 fixes held.'
reviewer: 'QA Engineer'
head: 'c685463bcf8a91feea417dca85b393ea0c5ee2e2'
updated: '2026-11-10T10:42:21Z'

top_issues:
  - id: 'T293-QA-3'
    severity: high
    file: 'shared/resources/qa-execute-snippets.mjs'
    finding: 'The assigned-literal rule keys on the single character before the quote being an equals sign, so a value joined from a bare word and a quoted literal escapes it: x=a then single-quoted [$(touch W)] followed by echo $((x)) classifies runnable and creates W under bash 5.3 (also x="pre" then the single-quoted literal). Reproduced by QA by execution; the control x=a then single-quoted [5] stays runnable and writes nothing.'
    suggested_action: 'Decide assignment by the enclosing assignment word (name= or name[..]= whose value spans the quote), not by the character before the quote; add the joined-word shapes to the table, decider rows and differential atoms.'
    suggested_owner: dev
    status: open
    origin: 'code-review CR-1, reproduced by QA'
  - id: 'T293-QA-4'
    severity: high
    file: 'shared/resources/qa-execute-snippets.mjs'
    finding: 'The evaluating-word rule searches only the literal own command segment, and a pipe starts a new segment, so echo with a single-quoted a[$(touch W)] piped into a brace group running read x then echo $((x)) classifies runnable and creates W under bash 5.3 (printf is caught only because printf is itself an evaluating word). Reproduced by QA by execution; the control with a[5] stays runnable and writes nothing.'
    suggested_action: 'Refuse a quoted literal holding a substitution whenever the block also holds an evaluating read (read, $((..)), [[ -eq ]], unset, test -v), or treat a literal that reaches stdin or a here-string as the operand of a later read; add the shape to the table, decider rows and differential atoms.'
    suggested_owner: dev
    status: open
    origin: 'code-review CR-2, reproduced by QA'

