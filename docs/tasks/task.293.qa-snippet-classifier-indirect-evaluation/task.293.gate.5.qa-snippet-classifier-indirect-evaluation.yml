status_reason: 'Last permitted gate (5 of 5). Safety re-probe (unscoped, independent reviewer) found one more carrier: a substitution literal split across adjacent quote tokens, so no dollar-paren or backtick text exists in the source. A here-string to read, printf -v, and a mixed-quote split each classify runnable and write under bash 5.3; controls are clean. Cycle 4 default-deny on the loose literal held for every escaped and quoted form it names.'
