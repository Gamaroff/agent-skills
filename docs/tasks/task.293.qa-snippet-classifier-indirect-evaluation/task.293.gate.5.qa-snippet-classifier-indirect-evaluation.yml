    severity: high
    file: 'shared/resources/qa-execute-snippets.mjs'
    finding: 'A literal split across adjacent quote tokens never holds a dollar-paren or backtick in the source, so neither the quote-literal checks nor the loose-literal check fires. Under bash 5.3 these run touch W and classify runnable: read x <<< "a[$""(touch W)]"; echo $((x)) ; printf -v x "%s" "a[$""(touch W)]"; echo $((x)) ; read x <<< "a[$"(single-quoted open paren)"touch W)]"; echo $((x)). Reproduced by QA by execution; the controls with a plain number in place of the command stay runnable and write nothing. Only a plain assignment of the split text is caught, by the expanded-assignment rule.'
    suggested_action: 'Detect a dollar at the end of a quote or word immediately followed by a quote that opens with an open paren, backslash-paren or backtick; or stop reasoning about text and refuse any block that has an evaluating word or live expansion together with a dollar next to a quote boundary.'
