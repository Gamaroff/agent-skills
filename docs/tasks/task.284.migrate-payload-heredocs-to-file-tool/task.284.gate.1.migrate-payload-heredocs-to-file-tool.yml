status_reason: 'All 31 payload heredocs are migrated, the ratchet is empty and mutation-proven, CI-parity and PR CI are green, and the performance criterion is met. Two medium findings remain: the migration removed the guarantee that a posted body was written in the same run (create-issue and the tracker-comment post blocks).'
