top_issues:
  - id: 'TASK-284-CR-1'
    severity: medium
    file: 'skills/create-issue/SKILL.md'
    finding: 'The issue body moved from a fresh mktemp file written in the same block to the fixed path .claude/state/issue-body.md, written by the file tool in an earlier call. If that write is skipped or fails, the pre-flight token grep passes on the previous run''s body and the create posts it. The rm -f cleanup at line 382 runs only if a run reaches it.'
    suggested_action: 'HALT in the pre-flight block when the body file is absent or lacks the issue title, and delete it after the create.'
    suggested_owner: dev
    bug_ref: 'task.284.bug.1.create-issue-posts-a-stale-body.md'
    status: open
  - id: 'TASK-284-CR-2'
    severity: medium
    file: 'shared/resources/develop-pipeline-step-4-create-pr.md'
    finding: 'Every tracker-comment post block (pipeline steps 0, 2, 3, 4, 7; create-pr; finalise; review-bug, review-story, review-task) now posts .claude/state/comment-body.md in a later call than the write and cites fresh-body-post, but none asserts the body is this run''s. The old heredoc guaranteed it. A skipped write re-posts the previous comment.'
    suggested_action: 'In each post block, HALT when the body file is missing or empty, and remove it after the post.'
    suggested_owner: dev
    bug_ref: 'task.284.bug.2.tracker-comment-sites-post-a-stale-body.md'
    status: open

