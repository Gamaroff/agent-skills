    severity: medium
    file: 'shared/resources/wireframe-map.js'
    finding: 'Since decodeValue, two signature texts can mean the same value (v=é and v=%C3%A9, v=72% and v=72%25), but record finds the row to replace by raw text, so it adds a second row and match keeps returning the older answer (bug.16).'
    suggested_action: 'Compare parsed signatures (or one canonical encoded form) plus the label when finding the row to replace, and test recording over a hand-written row in the other encoding.'
    suggested_owner: dev
    bug_ref: 'task.243.bug.16.record-adds-a-second-row-for-an-equivalent-signature.md'
    status: open
  - id: 'TASK-243-CR13-2'
    severity: low
    file: 'shared/resources/tests/wireframe-map.test.mjs'
    finding: 'The no-merge check in the round-trip test passes whatever the encoding does, because each value sits under its own key (k0, k1, ...), so no two values are ever compared under one key.'
    suggested_action: 'Put the cross-check values under one shared key, or add same-key pairs such as 1,500 and 1, 72% and 72%25.'
    suggested_owner: dev
    status: open

