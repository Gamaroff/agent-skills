    severity: medium
    file: 'shared/resources/call-sites.js'
    finding: 'resolveRoot() also runs on an explicit --root, so a tree exported into a directory inside a git work tree (for example node_modules/.x) is silently replaced by the enclosing repo top level and the CLI reports the CURRENT tree with reason ok (reproduced: --root node_modules/.cs-probe → root=<repo>, count 12).'
    suggested_action: 'Resolve to the git top level only for the cwd default; use an explicit --root as given. Add a test that exports into a subdirectory of a repository.'
    suggested_owner: dev
    status: open
  - id: 'TASK-129-CR-2'
    severity: medium
    file: 'shared/resources/call-sites.js'
    finding: 'Shapes require the engine filename on the same line as node, so scripts/setup-consumer.sh:614 (_out=$(node "$_cli" …) with _cli set to gh-stage.js / jira-stage.js at :595/:597) is invisible; the newly added scripts/ root yields zero sites and an "all gh-stage call sites" list looks complete without it.'
    suggested_action: 'Collect in-file VAR=…<engine>.js assignments and match node "$VAR" / node "${VAR}" against them; add a fixture from the setup-consumer shape.'
    suggested_owner: dev
    status: open

