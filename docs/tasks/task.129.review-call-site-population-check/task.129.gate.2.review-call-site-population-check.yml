    file: 'shared/resources/call-sites.js'
    finding: 'hasRoots() accepts a bare top-level scripts/ directory, so a consumer install with its own scripts/ answers `empty` (exit 0) instead of `no-roots` (reproduced: a tree with scripts/build.sh and .agents/skills/ → reason empty), and a review there turns a correct document count into a false count-mismatch finding.'
    suggested_action: 'Base hasRoots on a marker only the source tree has: shared/resources/ present and at least one skills/*/SKILL.md.'
    suggested_owner: dev
    status: open
  - id: 'TASK-129-C2-CR-2'
    severity: medium
    file: 'shared/resources/call-sites.js'
    finding: 'Exit 1 is documented as no-roots, but a crash also exits 1 with nothing on stdout: `--engine toString` resolves through the prototype chain and throws a TypeError (reproduced), and a read error mid-walk throws uncaught.'
    suggested_action: 'Look engines up with Object.hasOwn; catch read errors and report them under their own reason so exit 1 can only mean no-roots.'
    suggested_owner: dev
    status: open

