nfr_validation:
  security:
    status: PASS
    notes: 'No credential reaches a record: buildRecord redacts before hashing, endpointOf drops the query string so a token in a URL cannot land in an intent, and no request body is ever journalled. The gate resolves ACCESS_TRACKER at require time, before loadDotEnv, so a dot-env file cannot escalate a restriction.'
  performance:
    status: PASS
    notes: 'One string compare and at most one regex per request under a restricted mode; in full mode one destructure per call. No measurable cost. Suite runtime unchanged (66s baseline).'
  reliability:
    status: FAIL
    notes: 'CR-1 and CR-3: a refused mutation is reported as a success and, on two paths, written to the local document as though it had happened. That is precisely the invisible drift the feature exists to remove, reintroduced one layer above the gate. CR-2 makes the two hand-rolled gates inert under their own documented invocation.'
  maintainability:
    status: CONCERNS
    notes: 'The layers are well commented and the roster change is pinned by tests at all five sites. But CR-4 shows a test asserting behaviour that is wrong, and CR-6 a require fallback the bundler rewrote into a duplicate of its own try branch — both are cases where the guard reads as protection but is not.'

