nfr_validation:
  security:
    status: PASS
    notes: >-
      No non-GET reaches the network under a non-full mode on any gated path, proven against a stub
      that throws on any write. No credential can reach a record — buildRecord redacts before hashing
      and endpointOf drops the query string. The mode is captured before loadDotEnv, and an injected
      access may now restrict but never escalate past the environment. The POST-as-search allowlist is
      by URL, not by heuristic. The stated boundary — config-declared restrictions need a shell that
      sourced the resolver — is documented in code, in the task, and in the CHANGELOG.
  performance:
    status: PASS
    notes: 'One string compare and at most one regex per request; one mode resolution per process. Suite runtime unchanged.'
  reliability:
    status: PASS
    notes: >-
      Every path that could report a refusal as a success is closed and watched failing: the
      transition chain, the write-back gate, the --json reason on all three scripts including the
      epic skip path, and both sprint scripts' success lines. A refused transition now records
      jira.transition with the target status rather than an escalated catch-all. full mode is
      unchanged on every path three independent reviews traced.
  maintainability:
    status: PASS
    notes: >-
      One access resolver rather than four copies. The 21st kind is pinned at six counting sites
      including the bundled copies. Every comment that described behaviour the code no longer had has
      been corrected, and two tests that passed vacuously — one matching a comment, one pinning an
      exact identifier a rename walked past — were tightened.

