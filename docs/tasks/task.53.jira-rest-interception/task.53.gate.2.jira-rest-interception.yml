schema: 1
task: 'task.53.jira-rest-interception'
task_title: '[Task 53] Intercept Jira REST mutations in two layers — a fail-closed net and a legible one'
gate: CONCERNS
status_reason: 'The task as specified is complete and green: both interception layers, the 21st kind, the sprint and epic-creator gates, and the deferral shapes have been stable since QA cycle 1. The open findings are all in ACCESS-MODE RESOLUTION — work added during QA to close a gap that pre-dates this task and that the task document never scoped.'
reviewer: 'QA Engineer'
updated: '2026-08-18T23:25:00Z'

qa_cycles: 5
loop_limit_reached: true

top_issues:
  - id: C5-CR1
    issue: 'The stage CLIs were not threaded with the captured config path'
    severity: high
    finding: >-
      jira-stage.js:432 and gh-stage.js:844 call resolveAccessTracker(accessEnv) with no
      opts, so the config tier reads process.env AFTER loadDotEnv — a .env line redirecting
      SKILLS_CONFIG_FILE walks around the pre-dotenv snapshot. gh-stage mutates via
      execFileSync("gh"), so it has no layer-1 net behind it.
    suggested_action: 'Pass the snapshot as the config-path source in both CLIs, and add SKILLS_CONFIG_FILE to each accessEnv literal.'
    suggested_owner: dev
  - id: C5-CR2
    issue: 'Three YAML shapes the parser silently drops still resolve to full'
    severity: high
    finding: >-
      The "declaration present but unreadable ⇒ manual" rule covers only shapes parseYamlSubset
      surfaces as a string/array/non-string. A duplicate access: block (last-wins), an access:
      preceded by a top-level block scalar, and a merge key under access: all yield undefined
      and read as absent. read-config.sh refuses all three.
    suggested_action: 'Probe the raw text for an access key before trusting an "absent" answer, mirroring _rp_access_may_be_declared.'
    suggested_owner: dev
  - id: C5-CR3
    issue: 'The most-restrictive answer is emitted silently'
    severity: medium
    finding: >-
      The `unusable` reasons built in findConfigFile are discarded, so a repo whose config has a
      quirk defers every write with no line naming the file or the cause. resolve-platform.sh
      prints an explicit refusal naming both.
    suggested_action: 'Return the reason and emit a one-line stderr warning, once per process.'
    suggested_owner: dev
  - id: C5-CR4
    issue: 'Both degraded no-writer tiers still answer full on a bad redirect'
    severity: medium
    finding: >-
      They probe ${SKILLS_CONFIG_FILE:-skills-config.yaml}, so a redirect that lands on nothing
      makes a present, restrictive ./skills-config.yaml invisible and both fall through to the
      env tier, whose default is full.
    suggested_action: 'Treat an unusable redirect as a refusal and fall back to probing ./skills-config.yaml.'
    suggested_owner: dev
  - id: C5-CR5
    issue: 'A typo in the CONFIG tier still throws, reproducing the shape cycle 4 removed'
    severity: medium
    finding: >-
      readConfiguredAccessTracker stopped throwing, but resolveAccessTracker still throws on the
      value it returns — so `access:\n  tracker: Manual` takes down --check/--print-plan/--probe-board
      and, in jira-sync, rejects the write with no deferral record.
    suggested_action: 'Apply one rule to the value as well as the shape: map an unrecognised CONFIG-tier value to the most restrictive mode, keeping the throw for env-tier values.'
    suggested_owner: dev
  - id: C5-CR6
    issue: 'The config tier is anchored to process.cwd() only'
    severity: medium
    finding: >-
      With the walk removed (deliberately, for read-config.sh parity) any invocation whose cwd is
      not the repo root resolves a declared restriction as absent. makeHttp's `cwd` option anchors
      the journal but not the decision.
    suggested_action: 'Pass the repo root the callers already compute into the resolver.'
    suggested_owner: dev
  - id: C5-CR7
    issue: 'jsm_defer''s last-resort access value is the literal full'
    severity: low
    finding: >-
      Unreachable today (jsm_curl always passes the mode), but a record stamped access: full
      without --retry-of misreports a policy deferral as a failed full-access mutation.
    suggested_action: 'Default to a refusal sentinel rather than full.'
    suggested_owner: dev

