nfr_validation:
  security:
    status: CONCERNS
    notes: >-
      The interception itself is sound and proven: no non-GET reaches the network on any gated path,
      no credential can reach a record, the mode is captured before loadDotEnv. The residual concern
      is narrow and named: three YAML shapes (C5-CR2) and one redirect case (C5-CR4) still resolve a
      declared restriction to `full`, and the stage CLIs are not threaded (C5-CR1). All three are in
      config-tier resolution, none in the interception.
  performance:
    status: PASS
    notes: 'One resolution per process, memoised. Suite runtime unchanged.'
  reliability:
    status: PASS
    notes: >-
      Every cycle-1 defect (a refusal reported as success, a false Change Log row, a sprint script
      claiming a move) is fixed and mutation-proven. full mode is unchanged on every path traced by
      three independent reviews.
  maintainability:
    status: CONCERNS
    notes: >-
      The access resolver is now one function rather than four copies, which is a real improvement.
      But it re-implements read-config.sh's semantics in a second language, and that duplication is
      what produced a high-severity finding in every review round from cycle 2 onward.

