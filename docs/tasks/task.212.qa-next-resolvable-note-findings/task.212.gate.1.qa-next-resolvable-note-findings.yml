status_reason: 'Parse, verify, count, check and the writer work as specified, and the --by boundary engages (12 probes). Three reproduced MEDIUM defects remain: an invalid marker cannot be repaired, "later" is not chronological across directories or for undated files, and duplicate finding numbers make the writer edit the wrong row.'
