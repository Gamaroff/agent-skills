top_issues:
  - id: 'T212-QA1-CR1'
    severity: medium
    file: 'skills/qa-next/scripts/uat-status.mjs'
    finding: 'cmdResolveFinding treats any existing marker as settled: the same evidence answers "already resolved" exit 0 and new evidence is refused, even when the existing marker no longer holds (deleted run, absent sha). The row stays open, --check stays red, and the only remedy is a hand edit the docs forbid. Reproduced: resolve by runs/zz.md, delete it, re-run → "already resolved", rc 0.'
    suggested_action: 'Verify the existing marker first. Same evidence + still valid → no-op exit 0; existing marker invalid → replace it with newly verified evidence (or refuse non-zero naming the reason) — never report success over a marker that does not hold. Add tests for both.'
    suggested_owner: dev
    status: open
  - id: 'T212-QA1-CR2'
    severity: medium
    file: 'skills/qa-next/scripts/uat-status.mjs'
    finding: 'verifyResolution reads "later" as listRunFiles index, which sorts by basename-with-sequence then path. Same-day runs in different function directories or envs are ordered arbitrarily (A.4/…-lan-02 counts as later than A.5/…-lan), and a run-dir file with no date prefix is accepted by name order (reproduced: runs/zz.md accepted as evidence for runs/A.4/2026-10-15-lan.md, rc 0). The README sentence about same-day cross-directory order is wrong when sequence numbers differ.'
    suggested_action: 'Decide "later" from the run file name: a strictly later date prefix, or the same date AND same directory AND same env with a higher sequence; anything else (undated name, same-day other directory/env) is run-not-later. Correct the README sentence; add tests for each case.'
    suggested_owner: dev
    status: open
  - id: 'T212-QA1-CR3'
    severity: medium
    file: 'skills/qa-next/scripts/uat-status.mjs'
    finding: 'When a run file has two Findings rows with the same number, --resolve-finding always edits the first; the second can never be targeted and the duplicate is never reported (reproduced: resolving n=1 again answers "already resolved by" the first row''s evidence).'
    suggested_action: 'Refuse non-zero, writing nothing, when more than one row carries finding n, naming the count. Add a test.'
    suggested_owner: dev
    status: open

