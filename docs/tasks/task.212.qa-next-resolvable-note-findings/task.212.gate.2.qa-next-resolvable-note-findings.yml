top_issues:
  - id: 'T212-QA2-CR1'
    severity: medium
    file: 'skills/qa-next/SKILL.md'
    finding: 'Step 5 now stages "any earlier run file this run resolved a finding in", but nothing records that set. STATE_FIELDS carries filedBug for exactly this resume case and nothing for resolved run files, so a run that crashes after phase recorded resumes at Step 5 and leaves the edited earlier run files unstaged — the resolution markers stay uncommitted and the next run''s clean-tree preflight trips on them.'
    suggested_action: 'Make Step 5 derive the set from the tree rather than memory: stage the tracked run files under runs/ that git reports modified (git status --porcelain / git diff --name-only -- <runs dir>), or record each edited run in the state file. Prefer the tree-derived form; hold it with a test or a doc-agreement check.'
    suggested_owner: dev
    status: open
  - id: 'T212-QA2-CR2'
    severity: low
    file: 'skills/qa-next/scripts/uat-status.mjs'
    finding: 'cmdResolveFinding writes without reading the row back. Evidence that verifies but contains a pipe or backtick (a run file name runPathFor does not refuse) writes a row that re-parses with no resolution, or splits the table cell, while the command reports success.'
    suggested_action: 'After building the new line, re-parse it with rowFinding and refuse (writing nothing) unless its resolution reads back as {date, evidence: by}; or refuse evidence containing a pipe, backtick or newline up front.'
    suggested_owner: dev
    status: open
  - id: 'T212-QA2-CR7'
    severity: low
    file: 'skills/qa-next/scripts/uat-status.mjs'
    finding: 'RUN_NAME accepts unreal dates: isLaterRun("runs/A/2026-13-45-lan.md", "runs/A/2026-10-16-lan.md") is true (reproduced), so a run file with an impossible date counts as later evidence.'
    suggested_action: 'Treat a run name whose date fails isRealDate as undated (never later); add the case to the verifyResolution test.'
    suggested_owner: dev
    status: open

