task_title: 'QA loop acts on the signals it already has'
gate: FAIL
status_reason: 'All cycle 4 findings (bug.5 to bug.9, CR4-8, CR4-9, CR-6) are verified fixed at 4ef29ed1. The unscoped safety re-probe found two more HIGH ways fast-gate-outcome.sh classes a head-only red as pre-existing: a test is keyed by its leaf name, which node''s spec summary shares across describes in one file (CR5-1), and node''s own non-test errors, such as a coverage threshold, are never looked for (CR5-2). Both reproduce on node 26.8.2. The probe engine found a third, MEDIUM: a second node summary resets the trailer check (PRB5-1).'
reviewer: 'QA Engineer'
head: '4ef29ed18b1167d3b357979bd495a28e17a9be36'
updated: '2026-10-28T05:42:39Z'

top_issues:
  - id: 'TASK-238-CR5-1'
    severity: high
    file: 'shared/resources/fast-gate-outcome.sh'
    finding: 'In spec mode a failing test is keyed by file and leaf name (:89), and node''s spec summary omits the parent describe. A head-only failure in describe POST > it "returns 200" collapses onto a base failure in describe GET > it "returns 200" in the same file and is classed pre-existing. Reproduced on node 26.8.2 with a real head log. bug.10'
    suggested_action: 'Key each failure on its file plus line:column (the test at / location: line carries both), so two tests that share a leaf name never match; a test whose line moved reads attributable, the safe direction.'
    suggested_owner: dev
    status: open
  - id: 'TASK-238-CR5-2'
    severity: high
    file: 'shared/resources/fast-gate-outcome.sh'
    finding: 'trailer() (:111) reads only what follows node''s results and accepts every # line in TAP mode, so a red node raises that is not a test failure passes: --test-coverage-lines prints ℹ Error: (spec, before the summary) or # Error: (TAP, after it). The plain base run never reproduces it, so a head-only coverage regression beside a base-red test is classed pre-existing. Reproduced on node 26.8.2 in both reporters. bug.11'
    suggested_action: 'Refuse (attributable) when the log holds a node diagnostic line (ℹ Error: or # Error:) anywhere, and accept only node''s own summary keys among # lines after TAP results.'
    suggested_owner: dev
    status: open
  - id: 'TASK-238-PRB5-1'
    severity: medium
    file: 'shared/resources/fast-gate-outcome.sh'
    finding: 'trailer() resets its first non-node line when a second ✖ failing tests: summary starts (:111), so a gate that runs node, then a failing lint step, then node again is classed pre-existing. Probe log-trailer-between-two-runs reproduced it (task.238.qa.5.security.run.json). This repository''s gate chains with && and cannot produce the log; a consumer gate that continues past a failure can. bug.12'
    suggested_action: 'Keep the first non-node line found after any node summary for the whole log; do not reset it when a later summary starts.'
    suggested_owner: dev
    status: open

