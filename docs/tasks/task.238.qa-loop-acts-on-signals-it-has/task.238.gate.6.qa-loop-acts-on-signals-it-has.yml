task_title: 'QA loop acts on the signals it already has'
gate: FAIL
status_reason: 'bug.10 to bug.12 are verified fixed at 8c43db0c, and each fix is held by a test that a mutation turned red. The unscoped safety re-probe found two more HIGH ways fast-gate-outcome.sh classes a head-only red as pre-existing. Tests generated at one position share a key, which sort -u folds into one (PRB6-1). A file load failure is compared without its cause (CR6-1). Both reproduce on node 26.8.2.'
reviewer: 'QA Engineer'
head: '8c43db0c261cd6588506eb665bf669681da86e88'
updated: '2026-10-28T06:11:43Z'

top_issues:
  - id: 'TASK-238-PRB6-1'
    severity: high
    file: 'shared/resources/fast-gate-outcome.sh'
    finding: 'Tests generated in a loop share file, line:column and leaf name, and the spec summary omits the describe, so their failures print one key. sort -u (:169, :245) folds them into one line, and one base failure at that key matches any number of head failures there: a head-only failure reads pre-existing. Reproduced on node 26.8.2 (describe(m) over GET/POST, head breaks POST: pre-existing in spec, attributable in TAP) and by probe log-same-key-twice. bug.13'
    suggested_action: 'Compare multiplicities (drop -u so comm pairs duplicates), and treat a key that names more than one test as ambiguous, so attributable (a TAP base run carries location: for passing tests too).'
    suggested_owner: dev
    status: open
  - id: 'TASK-238-CR6-1'
    severity: high
    file: 'shared/resources/fast-gate-outcome.sh'
    finding: 'A test file that fails to load is keyed as file, 1:1 and the file path, with no cause, and compared at :246, so a head-only load failure matches any base load failure whose cause the Cannot find module guard misses. Reproduced by QA: a head SyntaxError in an imported lib.mjs against a base ENOENT on a gitignored local.json gave GATE_OUTCOME=pre-existing (x.test.mjs;). bug.14'
    suggested_action: 'Do not compare a file-level failure on either side; when the head log names one, return unavailable (attributable).'
    suggested_owner: dev
    status: open
  - id: 'TASK-238-CR6-6'
    severity: low
    file: 'shared/resources/fast-gate-outcome.sh'
    finding: 'platform-variance: the head prefix is the logical $PWD (:169), but node resolves symlinks in TAP location: paths, so in a checkout reached through a symlink (macOS /var to /private/var, a symlinked home) the prefix is never stripped and pre-existing cannot fire; the tests build the fixture from realpathSync and so never meet it.'
    suggested_action: 'Strip $(pwd -P)/ as well as $PWD/ on the head and base sides, and add a test that runs from a symlinked cwd.'
    suggested_owner: dev
    status: open

