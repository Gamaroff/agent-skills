gate: CONCERNS
status_reason: 'The cycle 8 fix is verified at 51dc912e: bug.17 is closed. Its value allow-list refuses every shape gate 8 named, and each of its four guards turns its committed fixture red under QA mutation. The suite (6529), bundle check, validate and PR CI are green. Two MEDIUMs remain in the same 5c open-coverage check. A failing awk prints an empty OPEN_COVERAGE that takes the Otherwise exit (CR9-1, bug.18). A block key after a flow entry is read as that entry''s, so an invalid-YAML exemption reads 0 (CR9-2, bug.19).'
reviewer: 'QA Engineer'
