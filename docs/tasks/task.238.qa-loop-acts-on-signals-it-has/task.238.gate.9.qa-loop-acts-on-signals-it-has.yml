top_issues:
  - id: 'TASK-238-CR9-1'
    severity: medium
    file: 'shared/resources/develop-pipeline-step-5-6-qa-loop.md'
    finding: 'The 5c open-coverage check (:1589) prints OPEN_COVERAGE= (empty) at exit 0 when awk fails (syntax error, missing binary, a variant that rejects the program). That value is neither unreadable nor above zero, so the routing prose takes the Otherwise exit to Step 7: "could not look" reads as "found none". Reviewer CR-1 (medium, high confidence). QA reproduced it with an awk stub that exits 2. Present since the block was written (develop has no such block), and in scope because the task names this class. bug.18'
    suggested_action: 'After the awk pipeline, map any value that is not a count or unreadable (empty included) to unreadable, and add a fixture that runs the block with a failing awk on PATH.'
    suggested_owner: dev
    status: open
  - id: 'TASK-238-CR9-2'
    severity: medium
    file: 'shared/resources/develop-pipeline-step-5-6-qa-loop.md'
    finding: 'The 5c open-coverage check (:1582) leaves open set after a one-line flow entry, so a key line two columns deeper is read as that entry''s key. "- {id: PC-1, category: coverage}" followed by "    provenance: pre-existing" is invalid YAML (PyYAML: expected <block end>), and it prints 0 instead of unreadable. QA found it with the probe engine (oc9-flow-then-key-exempt, reproduced). The reviewer found it independently (CR-2, medium confidence). It reads the same at gate 8''s head. Measured plausibility: 1 of 184 tracked reports uses flow entries, and none uses this shape. Severity kept at medium for consistency with bug.16 and bug.17 (same class, measured 0), because the check''s documented guarantee is false either way. bug.19'
    suggested_action: 'Flag an entry opened from a flow line, and treat any deeper line after it as unreadable until the next entry opens; add a RAW_CASES fixture expecting unreadable.'
    suggested_owner: dev
    status: open

