  - id: 'T319-CR-1203'
    severity: low
    file: 'shared/resources/finalise-rerun-at-head.js'
    finding: 'Under core.ignorecase=true on a case-sensitive disk, an untracked SUB/x.js beside a submodule sub is not listed, and the engine answers ran (origin: code-review, reproduced by QA; control SUB2/x.js answers dirty-tree). git status hides the file too.'
    suggested_action: 'Count a case-sensitive-only path as untracked when a parent directory folds to a submodule entry and is not that directory.'
    suggested_owner: dev
    status: closed
    resolution: 'carried to recommendations.future (route 2b)'
  - id: 'T319-CR-1301'
    severity: low
    file: 'shared/resources/tick-pr.sh'
    finding: 'A tick whose PR conflict was resolved on the forge and squash-merged with its remote branch deleted reads resume, because no commit of the base takes the stale local tick without a conflict; the second tick PR that follows conflicts at its merge (origin: code-review, resume reproduced by QA, the second PR traced; control with the remote branch kept answers landed).'
    suggested_action: 'State the case as a limit in develop-next and the configuration reference, or ask the forge for a merged PR of the tick branch.'
    suggested_owner: dev
    status: closed
    resolution: 'carried to recommendations.future (route 2b)'
  - id: 'T319-CR-1302'
    severity: low
    file: 'shared/resources/push-held.sh'
    finding: 'A fetch that brought the commit and then failed at something else, such as a locked tracking ref, is answered "could not be fetched" (origin: code-review, reproduced by QA; control without the lock answers nothing held).'
    suggested_action: 'After the fetch, refuse only when the commit is still absent, and fetch without submodules.'
    suggested_owner: dev
    status: closed
    resolution: 'carried to recommendations.future (route 2b)'
  - id: 'T319-CR-1303'
    severity: low
    file: 'shared/resources/push-held.sh'
    finding: 'When the script is stopped past its bound, its watcher kills the push, the status is 137 and not 124, and the question to the remote that follows a timeout is skipped: a push that reached the server is answered as failed (origin: code-review, reproduced by QA with SIGSTOP; control without the stop answers pushed).'
    suggested_action: 'Answer 124 whenever the bound has passed and the command ended by a kill.'
    suggested_owner: dev
    status: closed
    resolution: 'carried to recommendations.future (route 2b)'
  - id: 'T319-CR-1304'
    severity: low
    file: 'shared/resources/tick-pr.sh'
    finding: 'Started in a subdirectory, the search for the commit that landed a conflicting tick reads its paths from there, finds none and answers resume (origin: code-review, reproduced by QA; control from the top answers landed).'
    suggested_action: 'Run the search from the top of the repository.'
    suggested_owner: dev
    status: closed
    resolution: 'carried to recommendations.future (route 2b)'

