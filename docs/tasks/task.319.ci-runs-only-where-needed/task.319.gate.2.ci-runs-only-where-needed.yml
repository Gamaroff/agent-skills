task_title: 'Pipelines spend a CI run only where a run can answer something'
gate: CONCERNS
status_reason: 'Both high findings of cycle 1 are closed and the suites are green. The full-diff refute pass found twelve medium and seven low defects, most of them in the repair of the tick path, the re-run record and the HALT pushes.'
