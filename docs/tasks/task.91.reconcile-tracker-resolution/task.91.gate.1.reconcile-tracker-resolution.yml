nfr_validation:
  security:
    status: PASS
    notes: 'No new vulnerabilities. The .env file is GREPPED, never sourced — correct, and explicitly reasoned about in the code comment. The subshell delegation contains the resolver rather than executing it in the installer shell. One low note: with _tmpdir unset the first glob is root-anchored, so a host with such a path would source a file from outside the repo; the readability test on an unmatched glob is a sufficient guard otherwise (no nullglob/failglob is set anywhere in the script — verified).'
  performance:
    status: PASS
    notes: 'The resolver is sourced twice on any failure path (a python3/pyyaml spawn plus a git call each time). Install-time only, once per run — not a regression worth blocking on. Noted as a cleanup.'
  reliability:
    status: FAIL
    notes: 'TASK-91-001 is an install-blocking regression on a config that is valid today: delegating to the resolver imported its whole failure surface, and every refusal is reported as a tracker error. TASK-91-005 compounds it with a failure path that prints no diagnosis at all. Blast radius was named as a first-class concern for this review and this is where it landed — not in the .env behaviour change, which is correctly gated behind config-key-wins and is opt-out-able, but in the error contract.'
  maintainability:
    status: CONCERNS
    notes: 'The change genuinely removes a duplicated decision and the code is unusually well commented. Two comments now describe deleted code: _config_skills_profile still says "Config-first, exactly like _resolve_install_tracker" (which no longer reads the config) and "Normalise the way _resolve_install_tracker does: CRLF checkouts leave a carriage return" (that normalisation is gone). _locate_resolver reads _tmpdir purely by dynamic scope from a caller local — an undeclared coupling, and precisely what makes the dry-run defect invisible.'

recommendations:
  immediate:
    - action: 'Stop conflating a non-tracker resolver refusal with a bad tracker value; do not abort the install for an access restriction, and never blame the tracker key for it.'
      refs: ['scripts/setup-consumer.sh']
    - action: 'Fix the .env probe spellings: accept an export-prefixed line, reject a CRLF-only and a quoted-empty value.'
      refs: ['shared/resources/resolve-platform.sh']
    - action: 'Stop the dry run previewing with a previously-installed resolver, or say that is what it did.'
      refs: ['scripts/setup-consumer.sh']
    - action: 'Do not print an unfiltered profile count under a "tracker NOT RESOLVED" banner.'
      refs: ['scripts/setup-consumer.sh']
    - action: 'Give the empty-TRACKER case its own message.'
      refs: ['scripts/setup-consumer.sh']
  future:
    - action: 'Pass _tmpdir into _locate_resolver as an argument rather than inheriting it by dynamic scope; guard the first candidate on a non-empty value so the glob is never root-anchored.'
      refs: ['scripts/setup-consumer.sh']
    - action: 'Prefer the tarball shared/resources copy — a single deterministic path the archive already ships and the file already reads two other tools from — over a glob across 38 bundled duplicates.'
      refs: ['scripts/setup-consumer.sh']
    - action: 'Skip the BASH_SOURCE candidate unless it names an existing regular file; under curl-piped-to-bash BASH_SOURCE[0] is the literal string bash, so dirname yields dot and the candidate becomes the parent of the consumer repo.'
      refs: ['scripts/setup-consumer.sh']
    - action: 'Source the resolver once and capture stderr on a separate fd rather than sourcing twice; surface the resolver could-not-be-parsed warning at install time, which the success path currently swallows.'
      refs: ['scripts/setup-consumer.sh']
    - action: 'Re-anchor the two comments that describe deleted code.'
      refs: ['scripts/setup-consumer.sh']
    - action: '_config_skills_profile and _config_skills_list are still hand-rolled awk YAML parsers with their own quote/CRLF normalisation — the same mirror-the-reader pattern just removed for tracker. Delegate them next.'
      refs: ['scripts/setup-consumer.sh']
    - action: 'SKILLS_JIRA_ONLY and SKILLS_GITHUB_ONLY remain mirrored in resolve-skill-set-cli.mjs. One duplicated decision was removed; this one is still there.'
      refs: ['scripts/setup-consumer.sh', 'shared/resources/resolve-skill-set-cli.mjs']

