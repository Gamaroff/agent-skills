schema: 1
task: 'task.91.reconcile-tracker-resolution'
task_title: 'Reconcile install-time and run-time tracker resolution'
gate: FAIL
status_reason: 'The stated goal is met — all 12 config shapes now resolve identically at install and run time. But delegating to the resolver imported its ENTIRE failure surface: any non-tracker refusal (e.g. access.vcs) now aborts the install blaming the tracker key, which is an install-blocking regression. The .env probe also misses an `export JIRA_URL=` line and false-positives on a CRLF empty value.'
reviewer: 'QA Engineer'
updated: '2026-09-05T06:41:47Z'

top_issues:
  - id: 'TASK-91-001'
    severity: high
    file: 'scripts/setup-consumer.sh'
    finding: 'rc 2 conflates every non-zero return from resolve-platform.sh with an unrecognised `tracker:` value. A valid `tracker: github` config plus AGENT_SKILLS_ACCESS_VCS=read-only aborts the install with "Fix the tracker: key", which is already correct. Reproduced end to end. Install-blocking regression — the old implementation never sourced the resolver, so such a repo installed fine.'
    suggested_action: 'Reserve rc 2 for a genuine tracker rejection; report the resolved value and the status separately so a non-tracker refusal is distinguishable. At minimum drop the "Fix the tracker: key" line so the message cannot contradict its own stderr.'
    suggested_owner: dev
    bug_ref: 'task.91.bug.1.rc2-conflates-every-resolver-refusal.md'
    status: open
  - id: 'TASK-91-002'
    severity: medium
    file: 'shared/resources/resolve-platform.sh'
    finding: 'The .env probe pattern misses an `export JIRA_URL=...` line (resolves github where a sourcing shell resolves jira — the original bug class), and false-positives on a CRLF-terminated empty `JIRA_URL=` and on `JIRA_URL=""` (both resolve jira for an emptied key). CRLF is the exact spelling task 83 existed to fix. All three verified by execution.'
    suggested_action: 'Normalise before testing — strip trailing CR, optional leading export, and surrounding quotes, then test for a non-empty value. Correct the adjacent comment, which claims an empty JIRA_URL= is not set on either side. Pin each spelling in the parity table.'
    suggested_owner: dev
    bug_ref: 'task.91.bug.2.env-probe-spelling-and-crlf.md'
    status: open
  - id: 'TASK-91-003'
    severity: medium
    file: 'scripts/setup-consumer.sh'
    finding: 'On the dry-run path _tmpdir is unset (it is a local of install_skills declared below that branch), so _locate_resolver falls through to the .agents/skills glob — the PREVIOUSLY INSTALLED resolver. Verified: returns .agents/skills/create-epic/references/resolve-platform.sh. Preview and real run can therefore still disagree, which relocates rather than removes the bug class this task closes. It also falsifies the new comment asserting rc 3 is the expected dry-run outcome.'
    suggested_action: 'Restrict the .agents/skills candidate to the real-install path and let dry-run report rc 3 as its comment claims, or state which copy the preview resolved against.'
    suggested_owner: dev
    bug_ref: 'task.91.bug.3.dry-run-previews-with-installed-resolver.md'
    status: open
  - id: 'TASK-91-004'
    severity: medium
    file: 'scripts/setup-consumer.sh'
    finding: 'On rc 3 the dry run announces "tracker NOT RESOLVED" and then passes an empty --tracker to resolve-skill-set-cli, which treats the empty string as falsy and filters nothing — so the very next line reports an UNFILTERED profile count, overstating the install by 11 or 6 skills with no label.'
    suggested_action: 'Skip the profile count on rc 3, or annotate it as unfiltered.'
    suggested_owner: dev
    bug_ref: 'task.91.bug.4.dry-run-unfiltered-profile-count.md'
    status: open
  - id: 'TASK-91-005'
    severity: medium
    file: 'scripts/setup-consumer.sh'
    finding: 'The empty-value case is folded into the rc-2 branch, whose error re-run only reprints stderr when the resolver actually failed. A resolver that sources cleanly but sets nothing (a truncated copy left by an interrupted install — _locate_resolver checks only readability) aborts the install with "see the message above" and no message above.'
    suggested_action: 'Split the conditions; on rc 0 with empty TRACKER name the resolver path that was used.'
    suggested_owner: dev
    bug_ref: 'task.91.bug.5.empty-tracker-reports-no-message.md'
    status: open

