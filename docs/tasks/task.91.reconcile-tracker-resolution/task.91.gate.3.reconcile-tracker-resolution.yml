task: 'task.91.reconcile-tracker-resolution'
task_title: 'Reconcile install-time and run-time tracker resolution'
gate: CONCERNS
status_reason: 'Every cycle-2 finding is fixed and re-verified, and the HIGH count reaches zero — the loop is converging. Two residuals remain, both reachable only through a corrupt or partial resolver copy: the installer trusts whatever string a located resolver prints without validating it against the legal set, which makes the filter inert; and a resolver that fails silently produces "see the message above" with nothing above.'
reviewer: 'QA Engineer'
updated: '2026-09-05T07:53:25Z'

top_issues:
  - id: 'TASK-91-009'
    severity: medium
    file: 'scripts/setup-consumer.sh'
    finding: 'The installer accepts whatever string the located resolver prints, without validating it against the legal set. `_locate_resolver` selects a file on READABILITY ALONE — it never establishes that the file is a resolver — so a stale or partially-written copy under `.agents/skills/*/references/` is trusted verbatim. Verified: a planted resolver setting `TRACKER=bitbucket` and returning 0 yields rc=0 tracker=[bitbucket], and `_skill_excluded_for_tracker` then KEEPS both `sync-jira-epic` and `sync-github-epic` — the filter is silently inert. Same failure mode as TASK-91-006, reached through a different door, and the same realistic trigger: a partial write from an interrupted install. The real resolver cannot produce this (validate_enum refuses), so the exposure is entirely in trusting the located file.'
    suggested_action: 'Validate `_t` against jira|github before returning 0. The installer already knows the legal set — it branches on it in `_skill_excluded_for_tracker`. One `case` closes the door, and it makes the existing "never emits a raw config token as a tracker" property hold end to end rather than only for config input.'
    suggested_owner: dev
    status: open
  - id: 'TASK-91-010'
    severity: low
    file: 'scripts/setup-consumer.sh'
    finding: 'The rc-not-zero twin of TASK-91-005. When the located resolver returns non-zero WITHOUT writing to stderr, the rc-2 branch replays its (empty) stderr and the caller then prints "No usable tracker could be resolved — see the resolver''s message above", pointing at nothing. Verified with a planted `return 1` resolver: rc=2, no message. TASK-91-005 fixed exactly this shape for the rc=0 case and left the rc-non-zero one.'
    suggested_action: 'After replaying stderr, if nothing was emitted, print the same style of message the rc=0 branch uses, naming the resolver path.'
    suggested_owner: dev
    status: open

