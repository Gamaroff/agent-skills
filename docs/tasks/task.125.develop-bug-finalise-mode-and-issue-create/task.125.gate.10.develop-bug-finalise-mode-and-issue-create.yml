    file: 'skills/finalise/SKILL.md'
    finding: 'The cycle-9 `case "$VERDICT_LINE" in *''{''*` HALT fires on any brace on the line, so `**Verdict**: PASS — the `{bug-prefix}` reader now accepts both shapes` HALTs a correct bug run with a misleading diagnostic (reproduced), while the first-word rule already refuses `{PASS / FAIL}` on its own (the cycle-9 mutation showed the arm absorbed); and the brace-less template remnant `PASS / FAIL` / `PASS/FAIL` publishes PASS at exit 0 (reproduced).'
    suggested_action: 'Drop the whole-line brace check; keep the first-word extraction as the single refusal path and also refuse a remainder beginning with `/` or `|`; add the trailing-prose-with-brace line to the accepted cases and `PASS / FAIL` to the refused ones.'
    suggested_owner: dev
    status: open
    bug_ref: 'task.125.bug.24.whole-line-brace-halt-refuses-a-correct-verdict-with-trailing-prose.md'
  - id: 'CR-3'
    severity: low
    file: 'skills/finalise/SKILL.md'
    finding: '"No **Verdict**: line at all" and "a line exists whose first word is not PASS/FAIL" reach one diagnostic, so the reader told to write a verdict does not learn one exists and was refused.'
    suggested_action: 'Branch the HALT text on whether $VERDICT_LINE is empty; echo the refused line and the extracted token when it is not.'
    suggested_owner: dev
