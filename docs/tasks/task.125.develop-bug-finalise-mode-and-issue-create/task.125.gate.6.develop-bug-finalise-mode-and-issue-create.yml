    finding: 'The 6a cycle-count block (the BUG-17 fix) reads `$IMPLEMENTATION_REPORT` "passed by develop-task/develop-story as an env var"; develop-bug passes nothing and the bug-mode find that locates the report lives in the NEXT block, so every bug run takes `CYCLES=0` and the QA Cycles line is silently omitted — the executed test proves the grep by injecting the path (the BUG-12 shape).'
    suggested_action: 'Bind STEM in that block and derive IMPLEMENTATION_REPORT there (both shapes, newest by number) when the env var is empty; run the test against a fixture directory.'
    suggested_owner: dev
    status: open
  - id: 'CR-3'
    severity: low
    file: 'skills/finalise/SKILL.md'
    finding: 'The three `[ -n "$STEM" ] && [ -n "$DOC_KIND" ] || HALT` guards (6a, 7.6b, 6b) refuse an EMPTY input but accept a placeholder left verbatim — `STEM="{story.{epic}.{story} | …}"` is non-empty — after which `ls …${STEM}.dod.*.md` yields an empty DOD_PATH at exit 0 (executed under bash + zsh).'
    suggested_action: 'Refuse a value containing `{` in each guard and HALT when DOD_PATH resolves empty; add the unsubstituted-placeholder case to the executed tests.'
    suggested_owner: dev
    status: open

