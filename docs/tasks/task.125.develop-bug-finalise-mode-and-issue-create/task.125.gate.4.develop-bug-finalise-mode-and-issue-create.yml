  - id: 'TASK-125-BUG-13'
    severity: high
    file: 'skills/finalise/SKILL.md'
    finding: '6b resolves the bug verdict from `ls {dir}/${STEM}.implementation.*.md` with STEM = the short bug prefix (bug.14, task.67.bug.3); develop-bug names the report `{bug-prefix}.implementation.{N}.*.md` where its runs bind {bug-prefix} to the FULL filename stem (bug.14.precompact-hook-bare-tracker-comment.implementation.1.*.md — bug.13/14/15, the three most recent, plus bug.1 and bug.8), so the glob matches nothing and the cycle-3 HALT ("no **Verdict**: line found") fires on a run that has a verdict. Executed: STEM=bug.14 → empty. bug-doc.js findRelatedBugDocs already matches on [bugStem, bugId] because both shapes exist. The fixture report in finalise-bug-mode.test.mjs is short-shape only.'
    suggested_action: 'Glob both shapes (`${STEM}.implementation.*.md` and `${STEM}.*.implementation.*.md`, or read bug_stem from bug-doc.js beside bug_id); apply the same to the Step 2 qa-reports marker and the <IMPL_REPORT> prose; add a full-stem fixture report to the 6b test so it goes red on the short-only glob; note the two shapes beside develop-bug SKILL.md:336.'
    suggested_owner: dev
    status: open
    bug_ref: 'task.125.bug.13.six-b-report-glob-short-id-vs-full-stem-report-name.md'
  - id: 'CR-2'
    severity: low
    file: 'skills/finalise/SKILL.md'
    finding: '6b re-binds DOC_KIND from `$*` alone, so a 6b shell with no argv bound (STEM bound, --bug not) resolves to task and silently publishes the story/task derivation on a bug — the BUG-12 symptom under a different unbound input. Reviewer rated medium; QA holds it LOW: the Document-kind block resolves the whole skill from the same `$*` and the test executes 6b with --bug on argv, so the residual is the missing basename-style hint 6b has and the kind block does not.'
    suggested_action: 'Cross-check the kind against the bound STEM — a STEM matching `(^|\.)bug\.[0-9]+($|\.)` with --bug absent from `$*` is a HALT naming the flag — and state in the 6b prose that --bug is a positional input the agent passes when running the block.'
    suggested_owner: dev
    status: open
  - id: 'CR-3'
    severity: low
    file: 'skills/finalise/SKILL.md'
    finding: '`awk ''{print $(2)}''` on the last `**Verdict**:` line publishes the raw token; 9 of 25 real verdict lines are `**Verdict**: **PASS**`, so FINAL_GATE reads `**PASS**` in the PR comment and tracker done comment (executed against docs/bugs/bug.12).'
    suggested_action: 'Normalise to the first PASS|FAIL token (`grep -oE ''PASS|FAIL'' | head -1`) and HALT when it is neither.'
    suggested_owner: dev
    status: open

