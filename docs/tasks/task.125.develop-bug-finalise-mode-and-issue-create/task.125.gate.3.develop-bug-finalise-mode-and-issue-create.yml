  - id: 'TASK-125-BUG-12'
    severity: medium
    file: 'skills/finalise/SKILL.md'
    finding: 'The 6b derivation branches on $DOC_KIND and reads ${VERIFY_VERDICT:-N/A}; DOC_KIND is assigned ~1400 lines earlier in another fenced block and VERIFY_VERDICT is assigned by no command at all (Step 2 says "bind" in prose) — in the 6b shell an unbound DOC_KIND takes the task branch and an unbound verdict reports N/A indistinguishably from a genuine N/A; the executed fixture test sets all three via env and passes vacuously on this gap.'
    suggested_action: 'Re-bind DOC_KIND in the 6b block from the invocation args and derive VERIFY_VERDICT in-block from the implementation report (last **Verdict**: line), HALT in bug mode on an empty verdict; rewrite the fixture test to run the block without injecting those variables and add the no-flag → task-branch case.'
    suggested_owner: dev
    status: open
    bug_ref: 'task.125.bug.12.six-b-bug-branch-inputs-unbound-in-block-and-test-injects-them.md'
  - id: 'CR-2'
    severity: low
    file: 'skills/finalise/SKILL.md'
    finding: 'The PR comment BODY after the DOC_KIND branch is unconditional: a bug run publishes "pushed acceptance head — the commit carrying `status: accepted`" and "All Definition of Done criteria verified. Story/task accepted." although bug mode (frontmatter-accepted: skip) writes no accepted.'
    suggested_action: 'Branch those two lines on DOC_KIND so the comment describes what the bug run committed (the DoD file and Status History row; closed by develop-bug Part B).'
    suggested_owner: dev
    status: open
  - id: 'CR-3'
    severity: low
    file: 'skills/qa-fix/SKILL.md'
    finding: 'A supplied-but-invalid fix_cycle ({N} unsubstituted, 0, "3 ") is cleared silently and the skip message reads "no fix_cycle arg" — "not supplied" and "supplied but malformed" resolve to one state, so a develop-bug call that fails to substitute {N} reproduces the obs #122 silence with nothing naming the rejected value.'
    suggested_action: 'Warn with the rejected value quoted in the invalid arms of both blocks, and word the skip message "fix_cycle absent or invalid".'
    suggested_owner: dev
    status: open

