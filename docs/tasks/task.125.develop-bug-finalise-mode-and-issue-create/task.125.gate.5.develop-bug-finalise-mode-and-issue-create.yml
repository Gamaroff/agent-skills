top_issues:
  - id: 'TASK-125-BUG-14'
    severity: medium
    file: 'skills/finalise/SKILL.md'
    finding: '6b (and develop-bug Step 0) resolve the report with `find … | sort | tail -1`, which orders by path: with both shapes on disk — a pre-task.125 full-stem `bug.14.{name}.implementation.1.*` beside a newer short `bug.14.implementation.2.*` — the OLDER full-stem report wins whenever `{name}` sorts after `i` (reproduced), and its verdict is published as the bug''s.'
    suggested_action: 'Order candidates by the `.implementation.{N}.` number (or mtime) at every site that picks a report; add an executed case with both shapes on disk and the short one newer.'
    suggested_owner: dev
    status: open
    bug_ref: 'task.125.bug.14.six-b-report-lookup-sorts-lexically-older-full-stem-report-wins.md'
  - id: 'TASK-125-BUG-15'
    severity: medium
    file: 'skills/finalise/SKILL.md'
    finding: '6b reads `${STEM}` on the comment "STEM is bound at 6a" — another fenced block — while its next comment states blocks share no variables (TASK-121-BUG-2, the reason DOC_KIND was re-bound in-block for BUG-12); with STEM unset the DoD glob is empty, the cycle-4 cross-check cannot fire, the task branch runs and the canonical comment posts with an empty DoD path and empty Final Gate at exit 0 (reproduced under bash + zsh); the executed test injects STEM through env and cannot see it.'
    suggested_action: 'Re-bind STEM in 6b as a substituted placeholder like 6a, HALT on an empty value (`[ -n "$STEM" ]`), and add the executed STEM-unset case.'
    suggested_owner: dev
    status: open
    bug_ref: 'task.125.bug.15.six-b-reads-stem-bound-in-another-block-empty-stem-publishes-silently.md'
  - id: 'TASK-125-BUG-16'
    severity: medium
    file: 'skills/finalise/SKILL.md'
    finding: '7.6a''s block runs `git add … "{document-directory}/sprint-review-summary.md"` and HALTs on a non-zero exit, and 7.6b''s block ends with `grep -q ''^status: accepted$'' || HALT`; the bug variants (a different artefact list; a REPLACED assertion on `$DOD_PATH`) live only in the `acceptance-commit` / `pushed-assertions` marker prose, so both blocks HALT verbatim on every correct bug run — "bound by prose, never bound at all", the class this diff''s own BUG-12 fix names.'
    suggested_action: 'Branch inside both blocks on the re-bound kind — the artefact list and the final assertion as variables — so the block runs unedited in either mode; add an executed bug-mode case for each.'
    suggested_owner: dev
    status: open
    bug_ref: 'task.125.bug.16.six-a-git-add-and-six-b-accepted-assertion-halt-verbatim-on-a-bug-run.md'
  - id: 'TASK-125-BUG-17'
    severity: medium
    file: 'skills/develop-bug/SKILL.md'
    finding: 'The cycle-4 contract "every reader of the report accepts both shapes" was applied at three sites by hand with nothing enumerating the readers; two were missed — finalise 6a''s cycle count greps `^### QA Cycle` while every bug report writes `### Verify Cycle` (25 real headings, 0 `QA Cycle`), so a bug''s canonical comment never carries its cycle count; and the verify loop''s `/commit-changes` `exclude=` names the short shape only (the `git reset` beside it covers both).'
    suggested_action: 'Add a test that enumerates every implementation.* glob/exclude and cycle-heading pattern across develop-bug and finalise with a non-vacuity floor and asserts each accepts both shapes / both heading names; widen the 6a grep and the exclude.'
    suggested_owner: dev
    status: open
    bug_ref: 'task.125.bug.17.both-report-shapes-contract-has-no-population-check-cycle-count-reads-qa-cycle.md'
  - id: 'CR-3'
    severity: low
    file: 'skills/finalise/SKILL.md'
    finding: '`case " $* "` (6b and the Document-kind block) is the only source of `--bug`, and no prose says how a fenced block run through the Bash tool receives positional parameters, so a conforming `/finalise --bug` run resolves DOC_KIND=task and the cycle-4 cross-check then HALTs telling the agent to pass a flag the skill never says how to pass. Reviewer medium/medium; QA holds LOW — the mechanism predates this diff (kind block, cycle 1) and the HALT is loud — but the BUG-15 fix (re-bind as a placeholder) is the same design and should carry the kind too.'
    suggested_action: 'Carry the kind as a substituted input placeholder re-bound per block (like STEM), or state the exact `bash -s -- --bug` invocation beside both blocks.'
    suggested_owner: dev
    status: open
  - id: 'CR-6'
    severity: low
    file: 'skills/finalise/SKILL.md'
    finding: 'The STEM cross-check is one-directional: `--bug` with a non-bug STEM (`task.67`, the parent) proceeds into the bug branch and publishes the parent task''s `task.67.implementation.*` verdict as the bug''s.'
    suggested_action: 'HALT symmetrically when DOC_KIND=bug and STEM does not match the bug-prefix pattern.'
    suggested_owner: dev
    status: open
  - id: 'CR-7'
    severity: low
    file: 'skills/qa-fix/SKILL.md'
    finding: '`$((10#$FIX_CYCLE_ARG))` wraps silently past 19 digits (`18446744073709551617` → 1, reproduced), passing `-gt 0` and keying `qa-fix-1`, while the sibling qa-cycle.sh caps a cycle at 9 digits to refuse exactly that; duplicated at lines 873 and 991.'
    suggested_action: 'Reject runs longer than 9 digits in the case pattern before the arithmetic, matching the helper.'
    suggested_owner: dev
    status: open

