top_issues:
  - id: 'TASK-136-BUG-2'
    severity: medium
    file: 'shared/resources/security-probe.mjs'
    finding: 'SHELL_FN_BODY: a top-level exit N in the sourced library terminates the harness shell before "|| exit 97" runs (bash + zsh: exit 1 library → rc 1, empty stdout), so every case mismatches and the verdict is a scored absent with a full count; and a library that sets set -e makes errexit fire on the non-zero subshell before rc=$? and the 97/98→99 remap run (set -e + return 97 → rc 97, read as source-failed). CR-1 + CR-3 of the refute pass.'
    suggested_action: 'Arm an EXIT trap around the source (trap "exit 97" EXIT; source "$1" || exit 97; trap - EXIT), snapshot errexit from $- and switch it off in the harness before the subshell while re-enabling it inside, so rc=$? and the remap always run; add rows for a library ending in exit 1 (→ entry-not-probeable) and set -e + return 97 (→ scored exit 99 ≠ 0). Verified under bash and zsh — see the bug report.'
    suggested_owner: dev
    status: open

