top_issues:
  - id: 'CR-1'
    severity: medium
    file: 'evals/shared/lib/bundled-parity.mjs'
    finding: 'isFreshBundledCopy() returns true whenever problems is empty and never consults ok, so if bundle_skill.py --check cannot run (python3 missing, ENOENT) or cannot resolve the skill, every banner-carrying copy is certified fresh and the MCP-comment allowlist in transition-protocol-parity.test.mjs fails open — the opposite of what bundleCheck() documents.'
    suggested_action: 'Destructure ok as well and return ok && !problems.has(rel) so a failed check reads as not-fresh; add a test that a non-executable bundler yields false.'
    suggested_owner: dev
    status: open

