task_title: 'The bundler copies depth-relative links verbatim, so every bundled references/ file carries broken links'
gate: CONCERNS
status_reason: 'Cycle-2 fixes verified (C2-CR-1..5, probes + tests). Scoped review of the changed files found one medium, high-confidence defect in the guard itself: the git pathspec shared/resources/**/*.md matches only nested files, so the 57 top-level shared sources were never walked (606 = 605 skills files + 1 fixture README). The sources hide no broken link (0/103 checked by hand), so this is a coverage hole in the checker, not corpus breakage — it enters top_issues under code_review_blocking.'
reviewer: 'QA Engineer'
updated: '2026-09-12T15:43:59Z'

top_issues:
  - id: 'C3-CR-1'
    severity: medium
    file: 'tests/bundled-links.test.js'
    finding: 'The pathspec shared/resources/**/*.md is a default (non-:(glob)) git pattern: ** is just * and the following / must match a literal slash, so it selects only nested files — 1 of 58 tracked shared/resources Markdown files is walked; the 57 top-level shared sources the header claims are covered are not.'
    suggested_action: 'Use shared/resources/*.md (default globs already cross slashes) and add a floor asserting that at least one top-level shared source was visited, so the walk cannot silently narrow again.'
    suggested_owner: dev
    status: open

