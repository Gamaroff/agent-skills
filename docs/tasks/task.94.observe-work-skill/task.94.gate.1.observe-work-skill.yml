    - action: 'Tolerate surrounding whitespace when counting `status: open`'
      refs: ['shared/resources/observe-work-session-start.sh']
    - action: 'Remove the six dangling relative links from the contract source'
      refs: ['shared/resources/observation-log-contract.md']
