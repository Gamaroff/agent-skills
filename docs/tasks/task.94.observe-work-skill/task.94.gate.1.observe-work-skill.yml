schema: 1
task: 'task.94.observe-work-skill'
task_title: 'Add the observe-work meta-skill'
gate: FAIL
status_reason: >-
  One HIGH: the Session Start Protocol branches on a `doctor` reason the engine never emits, so the
  log is never initialised and the next step reports it as cleanly empty. Two MEDIUM: the hook
  undercounts open observations against the engine, and the bundled contract ships six dangling links.
reviewer: 'QA Engineer'
updated: '2026-09-08T13:20:00Z'

top_issues:
  - id: 'TASK-94-001'
    severity: high
    file: 'skills/observe-work/SKILL.md'
    finding: >-
      Session Start step 1 tells the agent to branch on `doctor`'s `reason` and lists a
      "workspace missing" row, but the engine reports that condition through `healthy: false`
      plus a `checks[]` entry and returns `reason: "ok"`. `init` therefore never runs, and step 2's
      `scan` then returns `empty` against a workspace that does not exist.
    suggested_action: >-
      Branch on `healthy` and `checks[].workspace-exists.ok`, not on `reason`, for the missing-workspace
      case. Keep the `ephemeral-workspace` and `fork-detected` rows — those ARE reason values.
    suggested_owner: dev
    bug_ref: 'task.94.bug.1.doctor-reason-branch.md'
    status: open

  - id: 'TASK-94-002'
    severity: medium
    file: 'shared/resources/observe-work-session-start.sh'
    finding: >-
      `grep -l '^status: open$'` matches neither `status: open ` (trailing space) nor the statusless
      fallback, so such a file is counted as neither. The hook reported 1 open where the engine
      reported 2. It undercounts, and can fall fully silent on a log with outstanding work.
    suggested_action: >-
      Use `grep -lE '^status:[[:space:]]*open[[:space:]]*$'`, or count through the engine and keep the
      grep only as a fallback.
    suggested_owner: dev
    bug_ref: 'task.94.bug.2.hook-status-whitespace.md'
    status: open

  - id: 'TASK-94-003'
    severity: medium
    file: 'shared/resources/observation-log-contract.md'
    finding: >-
      Six relative links (`./tracker-comment.js`, `./change-log.js`, `./resolve-platform.sh`) resolve in
      shared/resources but not in the bundled copy this task is the first to ship. Invisible to CI —
      docs-link-check is path-filtered to docs/**, so nothing under skills/** is checked.
    suggested_action: >-
      Fix the source, not the bundled copy. Demote the six to plain backticked names rather than
      rewriting them to `shared/resources/<name>`, which would drag three unrelated engines into every
      consumer of observe-work.
    suggested_owner: dev
    bug_ref: 'task.94.bug.3.bundled-contract-dangling-links.md'
    status: open

