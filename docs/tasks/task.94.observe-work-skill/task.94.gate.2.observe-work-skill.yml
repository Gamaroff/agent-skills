task_title: 'Add the observe-work meta-skill'
gate: FAIL
status_reason: >-
  Cycle 1's three findings are all genuinely closed and were re-verified. The refute pass found two
  NEW defects introduced by those fixes: a catch-all row that blocks capture in every fresh install
  (HIGH), and an overcount left behind by the undercount fix (MEDIUM). Both are the shape this pass
  exists to find — a fix is new code, not the closure of a finding.
reviewer: 'QA Engineer'
updated: '2026-09-08T14:05:00Z'

top_issues:
  - id: 'TASK-94-004'
    severity: high
    file: 'skills/observe-work/SKILL.md'
    finding: >-
      The TASK-94-001 fix added a catch-all row — "`healthy: false` for any other failing check →
      do not write until it is resolved". `healthy` is false whenever `activation-configured` fails,
      which is the state of every project on first install. The rule therefore forbids capture in
      exactly the projects the skill most needs to work in, and step 4 (which suggests adding the
      activation instruction) runs AFTER step 1, so the protocol blocks before reaching its own remedy.
    suggested_action: >-
      Replace the catch-all with the four checks named explicitly. `workspace-exists` false → init;
      `activation-configured` false → note and CONTINUE (step 4 owns it); `anchor-durable` / `no-fork`
      are already carried by `reason`. State that `healthy: false` alone is not a reason to stop.
    suggested_owner: dev
    bug_ref: 'task.94.bug.4.healthy-false-blocks-fresh-install.md'
    status: open

  - id: 'TASK-94-005'
    severity: medium
    file: 'shared/resources/observe-work-session-start.sh'
    finding: >-
      The status probes match anywhere in the file, not just the frontmatter. A resolved observation
      whose body contains a line reading `status: open` is counted as open — hook reported 1 open
      where the engine reported 0. The cycle-1 fix closed the undercount and left this overcount;
      both have the same root cause, namely that the hook re-implements the queue rule with grep.
    suggested_action: >-
      Scope both probes to the frontmatter block, or count through the engine when node is available
      and keep the grep only as a fallback.
    suggested_owner: dev
    bug_ref: 'task.94.bug.5.hook-grep-not-frontmatter-scoped.md'
    status: open

