task: 'task.121.cycle-scoped-qa-tracker-comments'
task_title: 'QA tracker comments are keyed per stage, so every QA cycle after the first is silently dropped'
gate: CONCERNS
status_reason: 'All three phases delivered and mutation-proved; one MEDIUM defect in the new cycle derivation (a non-numeric gate name makes the fallback unreachable and the stage invalid) plus two LOW guard-hardening findings from the diff review.'
reviewer: 'QA Engineer'
updated: '2026-09-18T03:43:00Z'

top_issues:
  - id: 'TASK-121-BUG-1'
    severity: medium
    file: 'skills/qa-task/SKILL.md'
    finding: 'sed -E without -n/p prints the whole path when the newest gate filename has no numeric segment, so QA_CYCLE/FIX_CYCLE holds a path, the :-1 fallback never fires, and the stage qa-gate-/abs/path is rejected by both CLIs (exit 2), aborting the PR-comment block via || exit 1 — same derivation at skills/qa-story/SKILL.md (~:1863) and skills/qa-fix/SKILL.md (:820).'
    suggested_action: 'Use sed -nE ... p at all three sites so a non-match yields the empty string and the documented fallback to 1 is reached; add a check that the derivation is empty on a number-less name.'
    suggested_owner: dev
    status: open
    bug_ref: 'task.121.bug.1.cycle-derivation-unreachable-fallback.md'
  - id: 'CR-4'
    severity: low
    file: 'evals/shared/tests/transition-protocol-parity.test.mjs'
    finding: 'The parity test scans --stage\s+([a-z][a-z-]*), which does not match the quoted form --stage "qa-gate-${QA_CYCLE}" this diff introduced, so the six suffixed QA sites (and the precompact lead call) silently left that test population; they are covered only by comment-slot-coverage Guard C now.'
    suggested_action: 'Extend the parity regex with an optional opening quote (as comment-slot-coverage collectCallSites already does) so the quoted shell form stays in its population; confirm the site count rises.'
    suggested_owner: dev
    status: open
  - id: 'CR-3'
    severity: low
    file: 'shared/resources/tests/comment-slot-coverage.test.mjs'
    finding: 'The never-passed-bare guard accepts any suffix (baseStage(s) !== s), so a hard-coded literal such as --stage qa-gate-1 at a shipped site would pass while reintroducing the cycle-1 marker suppression the guard exists to catch.'
    suggested_action: 'Also fail a cycle-scoped stage whose captured suffix is a fixed number rather than a shell expansion (the collector leaves qa-gate- when it stops at $) or a {N} placeholder; mutation-prove with a literal.'
    suggested_owner: dev
    status: open

