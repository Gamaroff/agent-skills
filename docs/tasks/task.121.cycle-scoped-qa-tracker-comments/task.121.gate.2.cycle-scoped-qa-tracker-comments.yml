    finding: 'QA_CYCLE is derived in the Step 13 fenced block (:1275, block :1200-:1300) and consumed in the Step 13b block (:1352, block :1333-:1360); each block is its own Bash call, so the variable is unset at the tracker call, the stage is qa-gate-, both CLIs exit 2 and the || echo swallows it — same split in qa-story (:1865 vs :1941) and qa-fix (:820 vs :906). And with sed -n p in place, 1 keys a number-less newest gate to cycle 1 on every cycle — the bare-stage suppression wearing a suffix — which tests/qa-cycle-derivation.test.js:121 now pins as correct. (Reviewer CR-3 medium/medium and CR-1 rated high/high; QA records CR-1 at medium: no writer produces a number-less gate, the only instruction to is BUG-3.)'
    suggested_action: 'Derive the cycle in every block that uses it — preferably one shared helper shared/resources/qa-cycle.sh <dir> called from each block — and make a number-less (or absent) newest gate a refusal with a stderr warning and no post, never a guess of 1; retarget the test to assert the refusal and add a same-block guard over the three SKILL.md files.'
