top_issues:
  - id: 'TASK-121-BUG-4'
    severity: medium
    file: 'skills/qa-task/SKILL.md'
    finding: 'Tracker blocks (qa-task :1361, qa-story :1932, qa-fix :915) call bash references/qa-cycle.sh beside node .agents/skills/<skill>/references/tracker-comment.js — two cwd assumptions in one block; from the repo root the helper is not found (exit 127), || QA_CYCLE= empties it, and the post is skipped every cycle with a warning. (Reviewer CR-1 rated high/medium; QA records medium — the PR-lead blocks already carry the skill-dir assumption via node references/stakeholder-summary-cli.js, and the fix is a path-form alignment.)'
    suggested_action: 'Address the helper as .agents/skills/<skill>/references/qa-cycle.sh in the three tracker blocks; widen DERIVES_CYCLE to accept that prefix; add a same-block path-form guard; state which values a block inherits (CR-2).'
    suggested_owner: dev
    status: open
    bug_ref: 'task.121.bug.4.helper-path-form-differs-from-the-engine-call-beside-it.md'
  - id: 'CR-2'
    severity: low
    file: 'skills/qa-story/SKILL.md'
    finding: 'The "each block is its own shell" premise is applied only to the cycle: $STORY_DIR / $TASK_DIR / $STORY_FILE, $GATE_DECISION, $score and $QA_ISSUE still cross blocks, and the same-block guard checks only that the helper is called, not that its argument is bound.'
    suggested_action: 'State in the prose which values a block inherits from earlier blocks (inputs an agent re-binds) versus what must be derived in-block (computed values); no code change required beyond the sentence.'
    suggested_owner: dev
    status: open
  - id: 'CR-3'
    severity: low
    file: 'shared/resources/qa-cycle.sh'
    finding: '[ "$n" -gt "$best" ] is a 64-bit integer test — a gate numbered beyond that range prints "integer expected", skips the comparison, and the helper exits 0 with the lower number (a wrong cycle rather than a refusal).'
    suggested_action: 'Bound the digit count (e.g. reject a number longer than 9 digits as malformed → refusal) or compare length-then-lexical; treat a comparison failure as a refusal.'
    suggested_owner: dev
    status: open
  - id: 'CR-4'
    severity: low
    file: 'skills/qa-story/SKILL.md'
    finding: 'New comments at :1860 and :1928 say "Step 13b" / "Step 13" — those are qa-task step numbers; qa-story has Steps 6 / 6b.'
    suggested_action: 'Refer to the blocks by qa-story numbering or by name.'
    suggested_owner: dev
    status: open
  - id: 'CR-5'
    severity: low
    file: 'tests/qa-cycle.test.js'
    finding: 'INLINE_DERIVATION matches only the retired spelling (| sed -E / -nE); an inline re-derivation written with sed -En, sed -r, grep -oE or awk passes the no-second-definition guard.'
    suggested_action: 'Assert instead that no $(...) assignment in the three skills contains .gate. outside a call to qa-cycle.sh.'
    suggested_owner: dev
    status: open
  - id: 'CR-6'
    severity: low
    file: 'skills/qa-story/SKILL.md'
    finding: 'The redrawn co-located tree still places story.1.1.epic-name.md directly under [feature]/, while create-story and every story on disk use {epic-dir}/stories/story.{E}.{S}.{name}/; the helper whole-directory scan is correct only because each story has its own directory, which the example does not show.'
    suggested_action: 'Redraw the story branch as epics/epic.1.x/stories/story.1.1.x/ with the numbered qa/gate files beside the story file.'
    suggested_owner: dev
    status: open

