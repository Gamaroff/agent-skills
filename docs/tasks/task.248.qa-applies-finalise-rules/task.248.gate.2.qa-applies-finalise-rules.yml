task: 'task.248.qa-applies-finalise-rules'
task_title: "QA applies the finalise DoD's rules before finalise does"
gate: FAIL
status_reason: 'The cycle-2 refute pass found two HIGH defects: 6d reads an unbound STEM and now HALTs on every run, and criteria-drift.js takes a co-located bug review report as the base. It also found two MEDIUMs: a symlinked document path reads as new-document, and the read-back trusts the gate''s own drift block. Three were reproduced by execution.'
reviewer: 'QA Engineer'
head: '1da9f7f025b792ecbfc580350892973c5c05187f'
updated: '2026-11-01T18:47:39Z'

top_issues:
  - id: 'T248-QA2-1'
    severity: high
    file: 'skills/finalise/SKILL.md'
    finding: 'The 6d block reads $STEM, but no line in the block binds it; its comment says the value comes "from 6a", which is another shell. Empty, changelog-cites.sh exits 2, so 6d HALTs changelog-stem on every run, including repositories with changelog.enforce off. On the base the same unbound read skipped the check silently. Code review CR-1, high/high, promoted.'
    suggested_action: 'Bind STEM inside the 6d block from the work-item placeholder, with the unsubstituted-placeholder and empty-value guards the other STEM blocks in finalise use; add a test that runs the shipped 6d block with no STEM in the environment.'
    suggested_owner: dev
    status: open
  - id: 'T248-QA2-2'
    severity: high
    file: 'shared/resources/criteria-drift.js'
    finding: 'newestReviewBlob accepts any *.review.N.*.md in the directory, so the review report of a task bug filed beside the task (review-bug writes {BUG_PREFIX}.review.{N} into BUG_DIR) can become the base. Reproduced: with task.9.bug.1.review.2.y.md present, the base is that report, the reason is drift, and both criteria read as unapproved "added", which the DoD AC rule fails as amendment unapproved. Code review CR-2, high/medium; no such report is on disk in this repository today, but review-bug can write one.'
    suggested_action: 'Accept only reports named <the document''s own stem>.review.<N>.*.md, using doc-id.js for the stem; add a test with a co-located bug review at a higher index.'
    suggested_owner: dev
    status: open
  - id: 'T248-QA2-3'
    severity: medium
    file: 'shared/resources/criteria-drift.js'
    finding: 'platform-variance: the document path is relativised with path.resolve, but the repository root comes from git and is a real path. A document reached through a symlink therefore gives a ../ rel, the read at the base fails, and the engine reports new-document at exit 0, so "could not look" reads as clean. Reproduced through /proc/self/cwd, and with TMPDIR set to a symlinked directory (the macOS default): 3 CLI tests go red. Code review CR-3, medium/high, promoted.'
    suggested_action: 'Resolve the document with realpathSync before relativising; throw Usage when the rel leaves the repository.'
    suggested_owner: dev
    status: open
  - id: 'T248-QA2-4'
    severity: medium
    file: 'shared/resources/qa-read-back.js'
    finding: 'The read-back re-runs the boundary classifier but trusts the gate''s own criteria_drift block. A gate that omits the block, or drops an appended entry, passes, so the read-back cannot catch the task.234 shape it was added for. Code review CR-4, medium/medium, verified by reading answerProblems; the missing-block exemption was a deliberate development decision.'
    suggested_action: 'Re-run criteria-drift.js in the read-back and require an answered entry for each appended id the engine reports; keep the missing-block exemption only for a gate with no task.248 keys at all.'
    suggested_owner: dev
    status: open
  - id: 'T248-QA2-5'
    severity: low
    file: 'shared/resources/changelog-cites.sh'
    finding: 'Stem refusals (empty, two args, a path, an unreadable id) exit 2 before the opt-in is read, contrary to the header''s "the opt-in first", so a repository with enforcement off can HALT in 6d. Code review CR-5.'
    suggested_action: 'Read changelog-enforce.sh first and exit 3 on off before validating the stem; keep the usage exit for on.'
    suggested_owner: dev
    status: open

