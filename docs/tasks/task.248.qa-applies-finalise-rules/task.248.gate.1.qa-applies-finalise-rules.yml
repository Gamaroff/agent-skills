updated: '2026-11-01T18:34:05Z'

top_issues:
  - id: 'T248-QA-1'
    severity: medium
    file: 'shared/resources/criteria-drift.js'
    finding: 'resolveBase tries the review-commit fallback only when the newest review report carries a reviewed_blob stamp; with no stamp it drops to the merge-base, so the review step''s own edits to the criteria report as unapproved rewordings (reproduced: reason drift, base merge-base, #1 reworded approved false; with the stamp, clean). Code review CR-1, reviewer confidence medium.'
    suggested_action: 'Find the newest review report independently of its stamp and try the commit that added it before falling back to merge-base; add a test for the unstamped report.'
    suggested_owner: dev
    status: open
  - id: 'T248-QA-2'
    severity: medium
    file: 'shared/resources/criteria-drift.js'
    finding: 'diffCriteria classifies a change as appended by a bare string-prefix test, so "within 5" changed to "within 50 ms" reads as appended rather than reworded and escapes the automatic MEDIUM (reproduced). Code review CR-2, reviewer confidence medium.'
    suggested_action: 'Count a change as appended only when the old continuation is empty or the new text continues it after a whitespace or punctuation boundary; add the "within 5" case as a test.'
    suggested_owner: dev
    status: open
  - id: 'T248-QA-3'
    severity: low
    file: 'shared/resources/changelog-cites.sh'
    finding: 'A path-prefixed stem such as ../task.248 parses as task.248 (doc-id reads the basename) and exits 3 "not a task"; 6d''s rc-3 arm prints nothing for that text and continues, so the changelog check is skipped silently (reproduced by hand; the probe engine could not materialise the case).'
    suggested_action: 'Refuse a stem containing "/" with exit 2, and give 6d''s inner rc-3 case a default arm that HALTs on unrecognised text.'
    suggested_owner: dev
    status: open

