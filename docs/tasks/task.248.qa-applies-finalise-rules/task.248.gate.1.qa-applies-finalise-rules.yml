task_title: "QA applies the finalise DoD's rules before finalise does"
gate: CONCERNS
status_reason: 'All four rules are wired and 129 targeted tests pass, but criteria-drift.js misclassifies in two reproduced cases: a review report with no reviewed_blob stamp drops the base to merge-base, and a bound edited by extension reads as appended.'
