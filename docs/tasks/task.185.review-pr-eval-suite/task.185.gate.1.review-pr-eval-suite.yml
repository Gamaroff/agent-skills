task_title: 'review-pr eval suite'
gate: FAIL
status_reason: 'One high-confidence correctness bug: repeat.mjs counts a skipped runner exit (no claude binary) as a pass, so the live pass rate can read 5/5 with no agent run. Everything else verified: 5339 tests pass, replay 4/4, live N=5 20/20.'
reviewer: 'QA Engineer'
head: '59630a7c36085e7966ab6e0f81e6b5183bc6d9fb'
updated: '2026-10-05T16:00:31Z'

top_issues:
  - id: 'TASK-185-CR-1'
    severity: high
    file: 'evals/shared/repeat.mjs'
    finding: 'repeat.mjs treats every runner exit 0 as a pass, but the runner also exits 0 when it skips (claude not on PATH, or requiresLiveDriver under replay), so eval:review-pr:cli reports passed N/N with no agent run. Reproduced: PATH without claude, --runs 2 --min-pass 2 -> passed 2/2, exit 0.'
    suggested_action: 'Give a skip its own runner exit status when repeat.mjs asks for it (or a marker repeat reads), and have repeat.mjs refuse to count a skipped run as a pass — fail the run as could-not-run.'
    suggested_owner: dev
    bug_ref: 'task.185.bug.1.repeat-counts-skips-as-passes.md'
    status: open
  - id: 'TASK-185-QA-2'
    severity: low
    file: 'evals/shared/repeat.mjs'
    finding: 'A scenario live.minPass above --runs is a usage error (exit 2), so EVAL_RUNS=3 npm run eval:review-pr:cli cannot run 02 or 03 (minPass 5); the default min-pass is calibrated for 5 runs only.'
    suggested_action: 'When the min-pass comes from live.minPass (not --min-pass), cap it at --runs and say so in the output, or express it as a fraction of runs.'
    suggested_owner: dev
    status: open
  - id: 'TASK-185-QA-1'
    severity: low
    file: 'skills/review-pr/scripts/next-report-number.sh'
    finding: 'An {n} at or above 2^63 overflows bash arithmetic: a .pr-review.9223372036854775807. file makes the script print -9223372036854775808 with exit 0. No real directory reaches this, but the script prints a wrong number rather than refusing.'
    suggested_action: 'Refuse (exit 2) an {n} longer than 18 digits instead of computing with it.'
    suggested_owner: dev
    status: open

