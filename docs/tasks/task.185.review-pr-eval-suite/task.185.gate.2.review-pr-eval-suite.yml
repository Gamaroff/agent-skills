top_issues:
  - id: 'TASK-185-C2-CR-1'
    severity: medium
    file: 'package.json'
    finding: 'eval:review-pr:cli maps every non-zero repeat.mjs exit to rc=1, so could-not-run (3) reaches the caller as 1, the same as a pass rate below min; evals/review-pr/README.md says it exits 3.'
    suggested_action: 'Keep the strongest status across scenarios (3 if any scenario could not run, else 1 on a failure) and test the script with no claude on PATH.'
    suggested_owner: dev
    bug_ref: 'task.185.bug.2.cli-script-collapses-could-not-run.md'
    status: open
  - id: 'TASK-185-C2-CR-2'
    severity: medium
    file: 'evals/shared/repeat.mjs'
    finding: 'live.minPass stays an absolute count when --runs exceeds 5: --runs 10 with minPass 4 passes at 4/10 (reproduced: passed 10/10 (min 4)), and the must-pass-every-run scenarios 02/03 pass at 5/10.'
    suggested_action: 'Scale live.minPass as a rate calibrated for 5 runs (ceil(k * runs / 5)) and say so in the output.'
    suggested_owner: dev
    bug_ref: 'task.185.bug.3.min-pass-not-scaled-above-five-runs.md'
    status: open
  - id: 'TASK-185-QA-3'
    severity: medium
    file: 'evals/shared/runner.mjs'
    finding: 'A driver error (claude -p exits non-zero: credit balance, crash, timeout) makes the runner exit 1, which repeat.mjs counts as a run that executed and failed, so an infrastructure failure reports passed 0/N with the exit code of a real regression, against the README promise that no pass rate is reported for runs that did not happen.'
    suggested_action: 'Give a driver error its own opt-in exit code (EVAL_DRIVER_ERROR_EXIT, set by repeat.mjs as it sets EVAL_SKIP_EXIT) and have repeat.mjs stop with could-not-run on it.'
    suggested_owner: dev
    bug_ref: 'task.185.bug.4.driver-error-counted-as-failed-run.md'
    status: open
  - id: 'TASK-185-C2-CR-4'
    severity: low
    file: 'evals/shared/repeat.mjs'
    finding: 'A malformed scenario.json throws out of JSON.parse and exits 1 (reproduced), the pass-rate-below-min code, not the documented usage exit 2.'
    suggested_action: 'Catch the parse error and report it through usage().'
    suggested_owner: dev
    status: open
  - id: 'TASK-185-C2-CR-5'
    severity: low
    file: 'evals/shared/repeat.mjs'
    finding: 'A trailing --runs or --min-pass with no value is silently ignored and falls back to EVAL_RUNS / live.minPass / N (reproduced: --runs as last arg ran EVAL_RUNS=1, exit 0).'
    suggested_action: 'Refuse a value flag with no value as a usage error.'
    suggested_owner: dev
    status: open

