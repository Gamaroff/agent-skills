task_title: 'Pipeline, QA, finalise, and tracker sync write the Change Log'
gate: FAIL
status_reason: 'Implementation is sound and the two Critical risk areas verify clean, but the Phase 4 section replacement terminated inside a code fence and left an orphaned legacy block — duplicate heading, 2-column table, legacy marker and an unbalanced fence — in all six sync SKILL.md files, falsifying two success criteria.'
