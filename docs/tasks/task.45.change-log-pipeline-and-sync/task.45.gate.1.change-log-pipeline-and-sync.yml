updated: '2026-08-13T10:20:00Z'

top_issues:
  - issue: 'Orphaned legacy Change Log block left in all six sync SKILL.md files; code fences unbalanced'
    severity: high
    bug_ref: 'task.45.bug.1.orphaned-legacy-block-in-six-sync-skills.md'
    finding: >-
      The replacement regex used a next-H2 lookahead that matched a `## Change Log` heading
      inside the old fenced sample, so it stopped early. Every one of the six files went from
      even to odd code-fence parity, meaning the remainder of each renders as one code block.
      Falsifies the success criteria "All six sync skills use <!-- change-log-start --> only"
      (the legacy `-end` marker survives) and "No sync SKILL.md embeds a column list".
    suggested_action: >-
      Delete the surviving tail in each of the six files — from the duplicate `## Change Log`
      heading through the trailing "Entry rows are matched by a strict regex" sentence,
      including the stray fence. Re-verify with a check that greps `changelog-end` as well as
      `changelog-start`, counts `^## Change Log$`, and asserts even fence parity.
    suggested_owner: dev
    status: open

  - issue: '"Zero file writes" claim overstates the guarantee the code provides'
    severity: medium
    bug_ref: 'task.45.bug.2.zero-file-writes-claim-overstated.md'
    finding: >-
      `fs.writeFileSync` is unconditional in all three `updateXFile` functions, so a no-op sync
      does perform a write. The real guarantee — no Change Log row, no marker migration, content
      byte-identical, empty `git diff` — is verified and holds. Three code comments and one
      ticked success criterion assert the stronger, false claim.
    suggested_action: >-
      Reword the three comments and success criterion :463 to the accurate guarantee (no row, no
      migration, byte-identical content) rather than changing behaviour. Also correct the §8
      baseline sentence, which misdescribes the pre-change epic fast path.
    suggested_owner: dev
    status: open

