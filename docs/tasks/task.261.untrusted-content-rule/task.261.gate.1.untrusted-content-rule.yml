    severity: medium
    file: 'tests/untrusted-content-rule.test.js'
    finding: 'FORBIDDING matches the bare word "no" (and "don''t", "not allowed") anywhere on the line outside backticks, so markerLines() drops a genuine read such as `gh issue view 5 --json body  # no filter applied`. Probed: FORBIDDING.test(that line) is true. The filter is also applied inside fenced code, where a trailing comment is not a forbidding sentence. A read site with such a comment passes the test uncited. Today it drops 2 lines, both in an already-allowlisted file, so no current false pass.'
    suggested_action: 'Drop the bare "no" from FORBIDDING, apply the forbidding filter to prose lines only (outside fenced code blocks), and add a control case for a fenced read line carrying a comment that contains "no".'
    suggested_owner: dev
    status: open

