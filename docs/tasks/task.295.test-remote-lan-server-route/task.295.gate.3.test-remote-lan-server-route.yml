task_title: 'Run the test suite on the LAN server (test:remote)'
gate: FAIL
status_reason: 'Gate-2 findings are fixed and held by tests, but the fix itself has gaps: the per-directory lock is taken after the sync it was meant to protect (the docs claim the opposite), a dropped ssh leaves the container running, and a failing docker ps lets --reap delete a directory with a live run.'
reviewer: 'QA Engineer'
head: '12578cea0f47e884c85859c0ab4a7556b798d21b'
updated: '2026-11-10T16:17:30Z'

top_issues:
  - id: 'T295-QA-6'
    severity: high
    file: 'scripts/remote-test/run.sh'
    finding: 'The container-name lock is taken by `docker run`, which is the last step. The `rsync --delete` of the tree and of .git, and the image build, run before it, so a second run on the same branch rewrites and deletes files under a live run and only then fails on the name (exit 125). The docs (step 4) and the comment above REMOTE_CMD say the second run fails instead of syncing over a tree in use. Confirmed by reading: the first rsync is at run.sh:154 and `docker run` at :187. origin: code-review (CR-1, high/high), reproduced by QA by line order'
    suggested_action: 'Refuse before the first rsync when a container named $RUN_DIR exists (running or stale), with a message that names it and the command to remove it; keep the --name conflict as the atomic backstop; add a test that no rsync call precedes the refusal'
    suggested_owner: dev
    status: open
  - id: 'T295-QA-7'
    severity: medium
    file: 'scripts/remote-test/run.sh'
    finding: 'Only exit 124 or 137 kills the named container. A dropped ssh session (255) leaves it running for up to the full timeout, and a container left created or exited by a daemon or WSL restart blocks every later run on that directory with a bare docker name-conflict error. origin: code-review (CR-2, medium/high)'
    suggested_action: 'Kill the named container on 255 as well (not on 125, which means another run owns the name), and let the pre-run lock check name a stale container'
    suggested_owner: dev
    status: open
  - id: 'T295-QA-8'
    severity: medium
    file: 'scripts/remote-test/run.sh'
    finding: 'In the reap script a failing `docker ps` leaves `running` empty, the same value as "nothing is running", so --reap deletes directories that have live runs. Reproduced: with a docker stub that exits 1, a 40-day-old directory was removed; with a working docker that lists its name it is kept (gate-2 test). Separately, the directory is touched only by REMOTE_CMD, after the image build, so a reap during a first-use build can still read it as old. origin: code-review (CR-5), reproduced by QA'
    suggested_action: 'Abort the reap when docker ps exits non-zero; touch the directory right after the sync, before the image build; add a test for docker ps failing'
    suggested_owner: dev
    status: open

