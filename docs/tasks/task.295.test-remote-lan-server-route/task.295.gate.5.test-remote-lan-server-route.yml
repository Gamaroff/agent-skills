    finding: 'The guard documentation states the window wrongly. The window runs from the check until the container exists: the whole rsync of the tree and .git plus a first-use docker build, which is minutes, not "a few seconds". "The second fails on the name" is only true for the run that reaches docker run second; a later run''s rsync --delete can rewrite the tree under the earlier run''s container. The run.sh comment makes the same statement and points at the task''s Future Improvements item, which is a cross-repository lock, not a same-branch run lock. origin: code-review (CR-1 medium/high, CR-2 low/high)'
    suggested_action: 'Reword both places to say the window lasts until the container exists (minutes on first use), that the run reaching docker run second fails on the name, and that its sync can rewrite the tree under the earlier run; add a Future Improvements line for a per-run lock and cite that, not the cross-repository one'
