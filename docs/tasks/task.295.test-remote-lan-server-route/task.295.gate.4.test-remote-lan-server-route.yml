    severity: medium
    file: 'scripts/remote-test/run.sh'
    finding: 'The lock is a container name, and the container is created only after the rsync --delete and the image build. A run still syncing or building holds no lock, so a second run on the same branch passes the check and syncs over it; the `docker run --name` backstop fires only after that. The comments and docs call it a lock and an atomic backstop without this limit. origin: code-review (CR-1, medium/high)'
    suggested_action: 'Scope the claim rather than add a mechanism: describe the check as a best-effort guard that covers the running container, state the window before it, and point at the Future Improvements cross-repository lock for a real one. This is the third gate on the lock, so no further patching of it'
    suggested_owner: dev
    status: open

