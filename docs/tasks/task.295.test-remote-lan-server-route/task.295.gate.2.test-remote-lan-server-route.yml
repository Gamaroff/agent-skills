updated: '2026-11-10T16:11:15Z'

top_issues:
  - id: 'T295-QA-3'
    severity: high
    file: 'scripts/remote-test/run.sh'
    finding: 'The run timeout bounds only the local ssh client. After `timeout` fires (exit 124) the remote `docker run` keeps going: it has no --name, no in-container timeout and no tty, so a hung suite burns CPU on the shared server until someone notices. Reproduced on .249 with the real image: `timeout --foreground -k 1m 5 ssh ... docker run --rm --name qa295-probe ... sleep 120` returned 124 and `docker ps` still listed the container 3 seconds later (killed by hand afterwards; 0 left). The docs claim a bounded run. origin: code-review (refute pass, CR-1, high/high), reproduced by QA'
    suggested_action: 'Enforce the bound on the server: name the container per run directory and run the scripts under `timeout` inside it (or trap and `docker kill` the named container), add --init so the process tree is signalled; add a guard test that a timed-out run issues the kill'
    suggested_owner: dev
    status: open
  - id: 'T295-QA-4'
    severity: medium
    file: 'scripts/remote-test/run.sh'
    finding: 'The per-branch directory key is lossy and unlocked. `feature/foo`, `feature-foo` and `Feature/Foo` all map to agent-skills-test-feature-foo (reproduced), and on a detached HEAD `git rev-parse --abbrev-ref HEAD` prints `HEAD` with exit 0 (reproduced), so the `|| echo detached` fallback never fires and every detached checkout shares agent-skills-test-head. Two runs on one key rsync --delete over each other while the other container reads the tree. origin: code-review (CR-3, CR-4), reproduced by QA'
    suggested_action: 'Key on the slug plus a short hash of the full branch name (a commit sha or path hash when detached) and take a per-directory lock on the server for the run'
    suggested_owner: dev
    status: open
  - id: 'T295-QA-5'
    severity: medium
    file: 'scripts/remote-test/run.sh'
    finding: '--reap judges staleness by the top-level directory mtime, but `rsync -a` copies the source root mtime onto the remote directory (reproduced: a 40-day-old source root gave a 40-day-old destination root after a fresh sync), so a directory used today can read as weeks old and be removed, and nothing checks for a container that mounts it. Reviewer rated this high; re-rated medium because it needs an explicit operator `--reap` and removes only a re-creatable cache directory. The deletion itself was not executed (it would remove real directories on the shared server). origin: code-review (CR-2, high/medium), mechanism reproduced by QA'
    suggested_action: 'Touch a marker file on every run and reap by its mtime; skip any directory a running container has mounted'
    suggested_owner: dev
    status: open

