status_reason: 'Both cycle-1 findings are fixed, but the cycle-2 refute pass found and QA reproduced a high defect: the timeout kills only the local ssh client, so the remote container keeps running after exit 124. Three medium findings (branch-key collisions, --reap reading a stale directory mtime) came with it.'
