top_issues:
  - id: 'T154-QA4-1'
    severity: medium
    file: 'tests/test-clean-checkout.test.js'
    finding: 'entries() returns [] for a missing directory as well as an empty one, so the base-is-empty checks (and the created-base case) pass if the runner deleted the base; "never deletes the base" is untested for a base the runner created (CR-1).'
    suggested_action: 'Assert the base exists and is a directory before each empty check (or make entries() throw on a missing dir); add a created-base case to the never-deletes test.'
    suggested_owner: dev
    status: open
  - id: 'T154-QA4-2'
    severity: medium
    file: 'tests/test-clean-checkout.test.js'
    finding: 'The relative-base case runs from the repo top level, where "invoking directory" and "repo" coincide, and a missing rel-base also reads as empty, so a runner resolving it elsewhere would pass (CR-2).'
    suggested_action: 'Invoke from a subdirectory; assert <subdir>/rel-base exists and is empty and <repo>/rel-base does not.'
    suggested_owner: dev
    status: open
  - id: 'T154-QA4-3'
    severity: low
    file: 'docs/tasks/task.154.bundler-and-snippet-test-hygiene/task.154.bundler-and-snippet-test-hygiene.md'
    finding: 'Target Architecture (§3), the Phase 5 criterion and risk note 2 still say the runner removes the clone at start and on exit; the per-run design deletes nothing at start, and a killed run leaves a run.* directory (CR-3).'
    suggested_action: 'Rewrite those three places to the per-run design and state the interrupted-run residue and how to clear it.'
    suggested_owner: dev
    status: open
  - id: 'T154-QA4-4'
    severity: low
    file: 'tests/test-clean-checkout.test.js'
    finding: 'platform-variance: the scratch-base guard checks only the resolved spelling, while the runner also refuses the /private/var → /var spelling, so a macOS checkout under /var/tmp passes the guard and fails every positive case (CR-4).'
    suggested_action: 'Apply the same spelling set as the runner in the guard.'
    suggested_owner: dev
    status: open

