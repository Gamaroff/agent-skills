task_title: 'Bundler and snippet-test hygiene: attributed warning, symlink-free test run'
gate: CONCERNS
status_reason: 'Cycle 2 findings fixed (21-candidate by-hand re-probe safe; scan-size floor verified). The scoped review found the cycle-2 lock itself defective: stale-lock takeover is not atomic, and ownership is decided before the lock is consulted — the same shared-location subject for the third cycle running.'
reviewer: 'QA Engineer'
updated: '2026-09-28T22:35:18Z'

top_issues:
  - id: 'T154-QA3-1'
    severity: medium
    file: 'scripts/test-clean-checkout.sh'
    finding: 'Stale-lock takeover (rm -rf LOCK; take_lock) is not atomic: two runs finding one dead PID can both end up holding the location and delete each other''s clone (CR-1). Bug: task.154.bug.5.clean-checkout-lock-takeover-race.md'
    suggested_action: 'Remove the shared location: see QA report 3 structural note.'
    suggested_owner: dev
    status: open
  - id: 'T154-QA3-2'
    severity: medium
    file: 'scripts/test-clean-checkout.sh'
    finding: 'Ownership (marker/emptiness) is decided before the lock is consulted, so a live run''s mid-clone directory is reported "not created by this script — remove it by hand" (CR-2). Bug: task.154.bug.6.clean-checkout-ownership-before-lock.md'
    suggested_action: 'Remove the shared location: see QA report 3 structural note.'
    suggested_owner: dev
    status: open
  - id: 'T154-QA3-3'
    severity: low
    file: 'scripts/test-clean-checkout.sh'
    finding: 'A pid-less lock is both "a foreign directory" and "this script between mkdir and the pid write", reported as one (CR-3).'
    suggested_action: 'Publish the lock with its pid atomically, or remove the lock.'
    suggested_owner: dev
    status: open
  - id: 'T154-QA3-4'
    severity: low
    file: 'scripts/test-clean-checkout.sh'
    finding: 'git clone checks out the tree before the marker is written, so "marked before checkout" does not hold; a kill mid-clone still leaves an unmarked directory (CR-4).'
    suggested_action: 'clone --no-checkout, mark, then checkout — or remove the need for the marker.'
    suggested_owner: dev
    status: open
  - id: 'T154-QA3-5'
    severity: low
    file: 'scripts/test-clean-checkout.sh'
    finding: '<dir>.lock never passes the location decision yet is rm -rf''d on a dead numeric pid (CR-5).'
    suggested_action: 'Check the lock path like DIR, or remove the lock.'
    suggested_owner: dev
    status: open
  - id: 'T154-QA3-6'
    severity: low
    file: 'scripts/test-clean-checkout.sh'
    finding: 'fs.existsSync follows symlinks, so a dangling-symlink CLEAN_CHECKOUT_DIR reads as absent and is then rm -rf''d (CR-6).'
    suggested_action: 'Use lstat for existence; refuse a symlink at the final component.'
    suggested_owner: dev
    status: open

