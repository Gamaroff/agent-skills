    severity: low
    file: 'tests/key-lookup-single-statement.test.js'
    finding: 'The guard key matches r and l only when adjacent in one flag cluster, so grep -ril, grep -rEl, grep -r -l and grep --recursive -l restate the lookup undetected; the header claims "in either order".'
    suggested_action: 'Parse the grep flag tokens: a recursive flag (cluster with r/R, or --recursive) plus a lowercase-l cluster (or --files-with-matches), and add the four spellings to the restatement test.'
    suggested_owner: dev
    status: open
  - id: 'BND-1'
