status_reason: 'The new plan-reuse block in finalise Step 3b.1 reads DOC_DIR, STEM and DOD_N that no line in its own block binds, so reuse cannot run as written. The reuse check also answers reusable for an engine path that matches nothing, and the cases_file confinement predicate is not reachable by the probe engine.'
reviewer: 'QA Engineer'
