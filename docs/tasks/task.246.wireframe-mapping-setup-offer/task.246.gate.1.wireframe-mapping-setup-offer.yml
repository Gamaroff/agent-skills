top_issues:
  - id: 'TASK-246-CR-1'
    severity: medium
    file: 'shared/resources/wireframe-map.js'
    finding: 'jsonFile strips /* */ comments inside JSON strings, so a tsconfig with a "@x/*" alias and a "src/**/*.ts" include glob (or trailing commas) fails to parse and detect proposes no componentImport (BUG-1).'
    suggested_action: 'Strip comments with a string-aware scanner and drop trailing commas before JSON.parse; add tests for the /* alias, the ** glob and trailing commas, with the plain-alias control.'
    suggested_owner: dev
    bug_ref: 'task.246.bug.1.tsconfig-comment-strip-eats-path-globs.md'
    status: open
  - id: 'TASK-246-CR-2'
    severity: medium
    file: 'shared/resources/wireframe-map.js'
    finding: 'A ui: key written with no value is missing to detect (partial, offer setup) but present to configure (exists), so setup is offered on every wireframe and can never complete (BUG-2).'
    suggested_action: 'Have configure decide presence with presentKeys, replace an empty key line in place instead of inserting a second one, and test an empty wireframeMap: and an empty componentImport:.'
    suggested_owner: dev
    bug_ref: 'task.246.bug.2.empty-ui-key-detect-configure-disagree.md'
    status: open
  - id: 'TASK-246-PROBE-1'
    severity: low
    file: 'shared/resources/wireframe-map.js'
    finding: 'configure accepts a value holding NEL (U+0085) while refusing U+2028 and U+2029; yaml-subset reads it back verbatim, so it is inert in this repository, but it is a YAML 1.1 line break (probe case configure.nel).'
    suggested_action: 'Add U+0085 to LINE_TERMINATOR (it then also guards signatures and record fields) and a configure.nel test.'
    suggested_owner: dev
    status: open
  - id: 'TASK-246-PROBE-2'
    severity: low
    file: 'shared/resources/wireframe-map.js'
    finding: 'A value holding a double quote (or a backslash) is written escaped, which yaml-subset does not unescape, so configure restores the file and answers write-failed instead of a usage error naming the character (probe case configure.double-quote).'
    suggested_action: 'Refuse " and \ in configure values up front as a UsageError naming the flag and the character, and test it; keep write-failed for genuine read-back mismatches.'
    suggested_owner: dev
    status: open
  - id: 'TASK-246-QA-1'
    severity: low
    file: 'docs/tasks/task.246.wireframe-mapping-setup-offer/task.246.wireframe-mapping-setup-offer.md'
    finding: 'PR #793 body says "Breaking Changes: None", but the task § 5 lists two (false/off now decline; candidates carry source).'
    suggested_action: 'Edit the PR body Breaking Changes section to name both, with their migrations from § 5.'
    suggested_owner: dev
    status: open

