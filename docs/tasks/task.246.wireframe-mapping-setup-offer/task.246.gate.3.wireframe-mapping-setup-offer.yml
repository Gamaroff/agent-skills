    finding: 'When configure rewrites a blank path key, the loop removing the list under it stops at a blank line or a same-indent comment, which yaml-subset skips: "componentBarrel:" then a blank line then "- src/x.ts" leaves the list hanging off the new scalar, so configure answers write-failed on a valid file and setup cannot complete (BUG-5 reopened).'
