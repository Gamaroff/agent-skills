    finding: 'The `under` pattern matches comment lines indented below a blank key, so filling "componentBarrel:" deletes "    # set me later" beneath it, against the promise that configure keeps every other byte (reviewer confidence medium; QA reproduced).'
    suggested_action: 'Remove only list-item and nested-value lines under a blank key and keep comment lines; test that a comment under a filled key survives.'
    suggested_owner: dev
