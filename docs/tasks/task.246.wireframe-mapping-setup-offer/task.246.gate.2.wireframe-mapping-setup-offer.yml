task_title: 'Wireframe mapping setup offer and first-run candidates'
gate: CONCERNS
status_reason: 'All five cycle 1 findings are fixed and the configure value guard now engages on all 17 probe cases, but the cycle 2 refute pass found three more medium correctness bugs in new detect/configure code (wildcard alias, case of false, block-list path keys) and three low ones, two of them introduced by cycle 1 fixes.'
