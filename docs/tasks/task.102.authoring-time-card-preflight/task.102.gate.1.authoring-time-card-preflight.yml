top_issues:
  - id: 'T102-001'
    severity: medium
    file: 'shared/resources/card-preflight.js'
    finding: >-
      stripFrontmatter() is a second implementation of a parse the same library
      already exports as parseFrontmatter(). The two diverge on leading
      whitespace and on CRLF documents (lib strips leading newlines from the
      body, this one does not), so the authoring check and the sync check can
      read different bodies from the same file. No verdict differs across the
      177 real documents in this repo today, so the divergence is latent — but
      the file's own header says it defines nothing of its own precisely to stop
      this drift, and it does it anyway one function down.
    suggested_action: >-
      Delete stripFrontmatter() and use lib.parseFrontmatter(text).body, which
      is exported and already the source of truth for every sync path. Add a
      test asserting the authoring path and the --check-card path resolve the
      same body for a document with CRLF line endings and one whose body opens
      with a horizontal rule.
    suggested_owner: dev
    status: closed
    fixed_date: '2026-09-10'

