nfr_validation:
  security:
    status: PASS
    evidence: reasoned
    notes: >-
      No new network, auth or credential surface. card-preflight.js reads one
      file and writes nothing; it takes no shell input and spawns no process.
      The one execution path added to the create-* skills is a node invocation
      of a read-only CLI. Verdict reached by reading the diff and the CLI's
      surface, not by executing hostile candidates — hence reasoned, not
      measured.
  performance:
    status: PASS
    notes: >-
      Offline check, single file read, sub-100ms in every observed run. Adds one
      invocation per authoring session. The 12,714-line diff is almost entirely
      generated references/ copies; runtime cost is unchanged.
  reliability:
    status: PASS
    notes: >-
      Advisory by construction — exit 0 even with findings, so a preflight
      failure cannot break an authoring run. Unknown document kind, missing file
      and unparseable kind all return exit 2 with a message naming the fix
      rather than throwing. process.exitCode is set instead of process.exit(),
      so a piped --json payload cannot be truncated (bug.3).
  maintainability:
    status: PASS
    notes: >-
      Four spec definitions became one, and one parse definition stayed one.
      Held by three independent guards: a one-definition test with a non-vacuity
      floor, a bundle-drift test that catches a stale generated copy, and a
      parity test asserting the authoring and sync paths resolve the same body.

