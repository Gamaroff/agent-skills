status_reason: 'T102-001 fixed: card-preflight.js now takes its body from lib.parseFrontmatter, the same parser every sync path uses. Two regression tests added — one asserting the two paths resolve the same BODY (not merely the same verdict, which the divergence always matched), one forbidding a re-implementation. Both mutation-proved. Nine of nine success criteria verified by execution; 3049 tests, 0 failures.'
