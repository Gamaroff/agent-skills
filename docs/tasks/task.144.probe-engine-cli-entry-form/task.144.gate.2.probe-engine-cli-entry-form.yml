top_issues:
  - id: QA-1
    severity: medium
    file: 'shared/resources/security-probe.mjs'
    finding: 'controlKey includes the whole cli: argv template, so a re-run whose template differs only in a per-run operand (an absolute --cases-file or --root path) records a second control instead of replacing the first; reproduced: one control run twice with two temp paths gives 2 controls and totals.executed 4, which overstates probes_executed and leaves the stale verdict in --emit-block. Raised by the refute reviewer as CR-1 (medium/medium), confirmed by execution.'
    suggested_action: 'Key a cli: control on an identity that is stable across re-runs, namely the template shape with every absolute-path operand normalised, or better the guarded flag (the element before {input}) plus --name when given, and add a test where re-running with a different path operand replaces the entry.'
    suggested_owner: dev
    status: open
  - id: CR-2
    severity: low
    file: 'shared/resources/security-review-prompt.md'
    finding: 'The record-identity contract changed for cli: controls, but security-review-prompt.md:168, review-security SKILL.md (lines 82, 90 and 122) and the engine comments at security-probe.mjs 1644, 1795 and 1838 still say one entry per {sink, entry} and that a re-run of the same {sink, entry} replaces its own.'
    suggested_action: 'Update every site that states record identity to name the cli: key, using the identity chosen for QA-1.'
    suggested_owner: dev
    status: open

