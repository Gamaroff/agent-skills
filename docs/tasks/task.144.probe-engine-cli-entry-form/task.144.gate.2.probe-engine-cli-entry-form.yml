status_reason: 'Cycle 1 CR-1 is fixed and mutation-proved. The cycle 2 refute pass found that keying a cli: control on its whole argv template makes a re-run with any per-run path (a scratch --cases-file, a mkdtemp --root) add a second control: reproduced, 2 controls and executed 4 for one control run twice. Three sites also still state the old {sink, entry} identity.'
