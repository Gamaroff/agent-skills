top_issues:
  - id: 'QA-222-9'
    severity: medium
    file: 'shared/resources/dod-gap-count.sh'
    finding: 'The fence opener `/^[ \t]*(```|~~~)/` also matches a prose line that begins with an inline code span (task.42:315, task.85:204 carry one). CommonMark does not treat it as a fence, because a backtick fence''s info string cannot contain a backtick. The fence then stays open to the end of the file, and a valid current section after it HALTs. Reproduced: a prose line followed by a current section with 1 gap HALTs "no current section".'
    suggested_action: 'Open a fence only on a run of 3 or more backticks or tildes, where the rest of a backtick opener holds no backtick. Add the inline-span prose fixture.'
    suggested_owner: dev
    status: open
  - id: 'QA-222-10'
    severity: medium
    file: 'shared/resources/develop-pipeline-on-stop.sh'
    finding: 'The NEXT=7 COMPLETION_LINE says to advance to 8 and mark Step 7 ✅ once the document reads accepted. The Step 7 Completion Checklist (develop-pipeline-step-7-finalise.md "Step 7 Completion Checklist (MUST verify before marking ✅)"; develop-bug-step-7-close-bug.md Part B) keeps the row ⏳ until the tail and checklist pass, so a row ticked early defeats the step-8 resume rule (task.161 CR-1 shape). The reviewer anchored this at shared/resources/dod-gap-count.sh:271 (anchor_check out-of-range); QA located the quoted line at shared/resources/develop-pipeline-on-stop.sh:271.'
    suggested_action: 'On accepted: advance to 8, then name ${STEP7_TAIL} and the Step 7 Completion Checklist as what must pass before ✅. Extend scenario 5d to assert the tail is named and ✅ is not offered on accepted alone.'
    suggested_owner: dev
    status: open
  - id: 'QA-222-11'
    severity: medium
    file: 'skills/finalise/SKILL.md'
    finding: 'Step 8.5 extracts GAP_REPORT_BODY with the old prefix match and no fence handling (SKILL.md:2654), while the lead''s count now reads only the current section. On a re-run document the PR comment body merges the historical Missing Criteria under the current ones (lead 1, body 4 checkbox lines). This breaks the stated invariant that "the lead cannot count a different list from the body".'
    suggested_action: 'Make the counter the one reader of the section: a `--body` mode in dod-gap-count.sh that prints the current section''s lines, used by 8.5. Add a re-run fixture asserting the posted body excludes the historical section.'
    suggested_owner: dev
    status: open
  - id: 'QA-222-12'
    severity: low
    file: 'shared/resources/dod-gap-count.sh'
    finding: 'The closer is compared on its first 3 characters only, so a ```bash line closes a ```` fence. Reproduced: a ```` fence holding a ```bash line before a valid section HALTs.'
    suggested_action: 'Record the opener character and run length; close only on a run of that character at least as long, followed by whitespace only. Add a 4-backtick fixture.'
    suggested_owner: dev
    status: open

