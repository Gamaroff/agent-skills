    severity: medium
    file: 'shared/resources/dod-gap-count.sh'
    finding: 'The section match `/^## Definition of Done - Gaps Identified/` is a prefix match, so it also enters sections retitled `## Definition of Done - Gaps Identified — run N (historical, superseded)` (25 tracked documents carry that shape). Reproduced: a historical section with 3 closed items beside a current one with 1 gap reads 4, want 1; the repository''s task.173 document, which has only historical sections, reads 6 when it should HALT. A historical `### Missing Criteria` also sets `seen`, so the "no Missing Criteria" HALT cannot fire. In scope: the gap count is this task''s subject. The pre-task count had the same prefix match.'
    suggested_action: 'Match the current heading exactly (`/^## Definition of Done - Gaps Identified[ \t]*$/`), reset `m` when `s` drops, and add a re-run fixture with a historical section beside the current one, plus one with only historical sections (must HALT).'
    suggested_owner: dev
    status: open
  - id: 'QA-222-7'
    severity: medium
    file: 'shared/resources/develop-pipeline-on-stop.sh'
    finding: 'At lock 7 the Stop hook block reason is the generic one (line 269): "Only once finalise has actually completed: mark Step 7 ✅ … and advance the lock to 8", and line 277 adds "advance the lock yourself". A lock held at 7 is now the normal state during the gaps tail, so a stop in that window sends the orchestrator to the numeric 8 that the new Step 7 exception forbids. This is the fourth writer of the instruction; the diff qualified the other three, and no on-stop test covers lock 7.'
    suggested_action: 'Add a NEXT=7 branch: run Step 7''s completion check first, advance to 8 only when the document reads accepted (develop-bug: when /finalise --bug returned no gaps), otherwise follow the gaps HALT. Pin it with a lock-7 scenario in develop-pipeline-on-stop.test.sh.'
    suggested_owner: dev
    status: open
  - id: 'QA-222-8'
    severity: low
    file: 'shared/resources/dod-gap-count.sh'
    finding: 'Fence state is tracked only once the section has started, and a ``` line toggles a ~~~ fence. Reproduced: a fenced example of the gaps section earlier in the document (the shape task.222''s own plan carries) plus a real section with 2 gaps reads 1, want 2.'
    suggested_action: 'Track fences from line 1 whatever the section state, close a fence only on its own marker, and match headings only outside a fence. Add the fenced-example fixture.'
    suggested_owner: dev
