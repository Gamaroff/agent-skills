top_issues:
  - id: CR-1
    severity: medium
    file: 'skills/finalise/SKILL.md'
    finding: 'The zero-gap refusal sits at 8.5, after 8.1 has filled the DoD with GAPS (the helper refuses to re-decide it) and 8.3 has appended a Status History row. 8.3 also takes GAP_TOTAL and DOD_NAME as agent-supplied placeholders rather than deriving them. A run with no gap lines therefore leaves a GAPS DoD with no gaps and a row claiming N gaps, and every retry appends another row, because status-history.js never dedupes.'
    suggested_action: 'Count the Step 5 `- [ ]` lines and refuse zero in the 8.1 block before the fill. In 8.3, bind DOD_PATH and derive GAP_TOTAL (grep -c over Step 5) and DOD_NAME (basename) in the block. Keep the 8.5 check as a backstop.'
    suggested_owner: dev
    status: open
  - id: CR-2
    severity: medium
    file: 'shared/resources/finalise-fix-and-recheck.mjs'
    finding: 'finalise Step 7 writes `{document-directory}/sprint-review-summary.md` with no id prefix (112 tracked files). isCoLocatedArtifact requires an id-prefixed basename and the artifact corpus walk requires WORK_ITEM_RE, so neither sees these files, although CI docs-link-check reads them. The cycle-1 test asserts only the id-prefixed form, which the pipeline no longer produces (5 legacy files).'
    suggested_action: 'Admit the exact basename `sprint-review-summary.md` in the document directory, both in isCoLocatedArtifact and in the artifact corpus walk. Test it on the real filename and keep the stem and directory refusals.'
    suggested_owner: dev
    status: open
  - id: CR-3
    severity: low
    file: 'skills/finalise/SKILL.md'
    finding: 'finalise 8.3 and the status-history.js CLI header both advertise `reason: "unchanged"`, but the CLI cannot reach it (upsertStatusHistory always appends). A caller would expect a re-run to be idempotent.'
    suggested_action: 'State in 8.3 and in the CLI header that a repeated write appends a second row, and that `unchanged` is not produced by the current writer.'
    suggested_owner: dev
    status: open

