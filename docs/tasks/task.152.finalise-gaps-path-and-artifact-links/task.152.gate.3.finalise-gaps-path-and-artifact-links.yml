gate: CONCERNS
status_reason: 'All three cycle-2 findings are fixed, mutation-proved (G1–G4) and green in CI on 80ef8f8f. The scoped review found one medium defect: the fill helper prints its HALT reasons to stdout, so the 8.3 command substitution swallows them and a refusal exits silently. Three low findings come with it.'
reviewer: 'QA Engineer'
updated: '2026-09-26T22:20:00Z'

top_issues:
  - id: CR-1
    severity: medium
    file: 'shared/resources/fill-verification-complete.sh'
    finding: 'Every HALT reason is printed with a plain `echo` to stdout. finalise 8.3 captures the helper with `GAP_TOTAL=$(… count) || exit 1`, so on an unreadable or unbound DoD the reason is swallowed into GAP_TOTAL and the block exits 1 printing nothing.'
    suggested_action: 'Send every HALT message to stderr (`>&2`). The 7.1/8.1 calls and the tests still see it, and the 8.3 substitution captures only the count.'
    suggested_owner: dev
    status: open
  - id: CR-4
    severity: low
    file: 'shared/resources/fill-verification-complete.sh'
    finding: '`count` prints 0 both when the DoD has no `## Step 5: Acceptance Decision` heading (could not look) and when Step 5 has no gap line (none found). 8.3 does not refuse 0 before its append.'
    suggested_action: 'Make `count` (and `gaps`) halt when the Step 5 heading is absent, and make 8.3 refuse GAP_TOTAL=0.'
    suggested_owner: dev
    status: open
  - id: CR-6
    severity: low
    file: 'skills/finalise/SKILL.md'
    finding: '8.5''s bug branch counts the gap lines with its own inline awk + grep, a second definition of the count the helper now owns.'
    suggested_action: 'In bug mode take GAP_COUNT from the helper''s `count`, and keep the awk only to extract the body to post.'
    suggested_owner: dev
    status: open
  - id: CR-7
    severity: low
    file: 'shared/resources/tests/doc-links.test.mjs'
    finding: 'The walk comment says the walk and 8a admit the same files. In fact the walk is a superset: it also takes `.bug.` reports and any `sprint-review-summary.md`, which isCoLocatedArtifact refuses without a document beside it.'
    suggested_action: 'Say that the walk is a superset of what 8a admits, and why (CI reads them all).'
    suggested_owner: dev
    status: open

