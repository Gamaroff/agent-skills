task_title: "Jira: walk the status ladder, and stop the terminal fallback firing on a retargeted done"
gate: PASS
status_reason: >-
  Five QA cycles ran. Every blocking finding from all five is fixed and verified by executing the
  shipped code, not only by the suite. Cycle 5 settled the precedence area that cycles 2-4 kept
  re-opening, confirming across 105 executed combinations that no configuration fires a `done` the
  consumer did not ask for and none silently disables a stage they opted into. 888/888 tests pass and
  every pre-existing fixture assertion is unchanged. One success criterion remains unmet — a fixture
  needing live board access — disclosed rather than worked around.
