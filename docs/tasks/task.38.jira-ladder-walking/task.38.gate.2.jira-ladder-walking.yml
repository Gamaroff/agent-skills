nfr_validation:
  security:
    status: PASS
    notes: >-
      No new credential handling. --print-plan verified credential-free and network-free by a test
      injecting a throwing fetchImpl. No secrets in the diff.
  performance:
    status: PASS
    notes: >-
      1+2n met and asserted; the optional `transitions` parameter genuinely suppresses the second GET
      per hop. A one-rung walk that moves the card is at the historical baseline. The already-at-target
      case costs one GET more than before — measured, documented, outcome unchanged.
  reliability:
    status: PASS
    notes: >-
      The failure mode this task exists to prevent — a confident wrong transition into the board's real
      Done — was found and closed on four distinct routes across the five cycles: the retargeted-done
      fallback (the original bug), the unauthored-file fallback (CR-3/CR-4), the ignored per-type
      overlay (CR-11), the one-key overlay claiming all moments (CR-17), and the MCP fallback dropping
      --issue-type (CR-20). Each is now covered by a test.
  maintainability:
    status: PASS
    notes: >-
      Hop construction de-duplicated into one exported helper used by both the printed plan and the
      executed walk. Authorship resolved in one place, at the granularity the resolution uses.
      Commenting is a genuine strength — the "two rank scales, never mixed" and "authorship
      granularity" comments each pre-empt a class of error the review process actually hit.

