  performance:
    status: PASS
    notes: >-
      The 1+2n target is met and asserted: the optional `transitions` parameter suppresses the
      second GET per hop (verified by a test counting GETs), and a one-rung walk issues exactly one
      GET and one POST — the documented baseline.
  reliability:
    status: FAIL
    notes: >-
      Three confirmed correctness bugs in the primary path. CR-3 in particular causes an
      unrecoverable wrong transition into Done, which is the failure mode the task's own risk
      assessment rates Critical. CR-1 breaks the most common invocation.
  maintainability:
    status: CONCERNS
    notes: >-
      Hop construction is implemented twice — planHops in jira-stage.js and inline in walkLadder —
      and the two have already drifted on null-workflow handling. --print-plan prints one while the
      live run walks the other, which is the drift the parity test exists to prevent. Code comments
      and documentation are otherwise unusually thorough.

