    severity: medium
    file: 'shared/resources/develop-pipeline-step-3-develop-loop.md'
    finding: 'The bullet counts use `grep -c .`, which prints 0 but exits 1 on an empty region. Under a `set -e` caller a valid edit that touches only [Unreleased], against a base whose released region has no bullets, aborts with exit 1 and no output. Reproduced by execution in bash and zsh (no set -e: rc 0; set -e: rc 1, silent). The existing set -e test uses a base with a non-empty released region, so it never reaches this. Lower risk: a failed `git show` inside the pipe is not detected (no pipefail), though `git cat-file -e` has already confirmed the object; an `awk -v` escape garbles the added-bullet list in the HALT message only; the release-cut test asserts only exit 1.'
    suggested_action: 'Count with awk (`awk "END{print NR}"`) or append `|| true`; read the base into a variable before awk so a git failure HALTs; pass the base through ENVIRON, not -v; assert the HALT text in the release-cut test; add a set -e case with an empty released region.'
    suggested_owner: dev
    status: open

