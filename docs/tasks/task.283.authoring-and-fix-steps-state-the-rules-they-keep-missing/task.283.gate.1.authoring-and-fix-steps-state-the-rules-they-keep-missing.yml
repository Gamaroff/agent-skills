top_issues:
  - id: 'T283-QA-1'
    severity: medium
    file: 'CHANGELOG.md'
    finding: 'No [Unreleased] entry cites task 283; changelog-cites.sh answers "missing (task 283)" and /finalise 6d HALTs on it. The new Step 3 CHANGELOG block would also flag this repository only once an entry exists, so the entry is the first real use of it.'
    suggested_action: 'Add an entry under ## [Unreleased] citing (task 283) and run the Step 3 block against it.'
    suggested_owner: dev
    status: open
  - id: 'T283-QA-2'
    severity: medium
    file: 'skills/sync-github-task/SKILL.md'
    finding: 'The Migration criterion says the renderer is called only on ensure-task-github-issue''s create path, so no existing issue body changes. sync-github-task (the update path) now calls it too, which rewrites existing bodies on the next sync. The call site grep in the QA report shows both skills.'
    suggested_action: 'Revert the sync-github-task hunk and the bundled references it caused, and state in that skill that the renderer is out of scope for the update path. (A criterion edit needs a named approver; the pipeline has none.)'
    suggested_owner: dev
    status: open
  - id: 'T283-QA-3'
    severity: medium
    file: 'docs/tasks/task.283.authoring-and-fix-steps-state-the-rules-they-keep-missing/task.283.authoring-and-fix-steps-state-the-rules-they-keep-missing.md'
    finding: 'Performance criterion unverified: CI=true npm test wall time within 10% of develop (median of five alternating runs, uptime beside each, LAN server) has not been measured. Three full runs on the branch alone exist; none is paired with develop.'
    suggested_action: 'Run five alternating develop/branch pairs of CI=true npm run test:remote -- --run test with uptime beside each, record the table and median in the QA report (the task.282 QA-2 procedure).'
    suggested_owner: dev
    status: open
  - id: 'T283-QA-4'
    severity: medium
    file: 'skills/ensure-task-github-issue/SKILL.md'
    finding: 'The render block reads TASK_RELATIVE_PATH and DOC_URL, which an earlier fenced block assigns. A block is its own shell, so run alone the call exits 2 (usage) before any issue is created. Origin: code-review CR-2 (high confidence). The same shape in sync-github-task (CR-1) goes away with T283-QA-2.'
    suggested_action: 'Re-bind both inside the block, with a ":" guard that HALTs naming the variable.'
    suggested_owner: dev
    status: open
  - id: 'T283-QA-5'
    severity: medium
    file: 'shared/resources/develop-pipeline-step-3-develop-loop.md'
    finding: 'The CHANGELOG placement block fails open: when origin/{base} is not fetched, "git diff --quiet" exits 128, the "!" reads it as changed, awk reads nothing and the block exits 0. Reproduced by execution: base "nonexistent" gives rc 0 with no output; the control (base develop) gives rc 1 on the same misplaced entry. Origin: code-review CR-3 (medium), reproduced by QA (5d). The block is a boundary (it HALTs on repository state) and is covered by committed tests but was not run through the security-probe engine (probes_executed 0).'
    suggested_action: 'Verify the ref first and HALT when it is missing (distinguish exit 1 from exit above 1); add the unfetched-base case to the test; mutation-prove it. Run the fence probe, or record that the DoD needs an override.'
    suggested_owner: dev
    status: open
  - id: 'T283-QA-6'
    severity: low
    file: 'shared/resources/tests/render-task-issue-body.test.mjs'
    finding: 'The "control: the old \s* pattern" test exercises a regex defined inside the test and never calls the renderer, so it cannot fail on a renderer defect. Origin: code-review CR-4 (cleanup).'
    suggested_action: 'Replace it with a real control that renders a document whose description spans lines and asserts the 12h effort.'
    suggested_owner: dev
    status: open

