  - id: 'T283-QA-10'
    severity: medium
    file: 'shared/resources/develop-pipeline-step-3-develop-loop.md'
    finding: 'The CHANGELOG block takes `old` from the hunk header, which counts every removed line (heading, blank, prose), not only bullets. A new bullet that replaces a non-bullet line gets extra <= 0 and passes. Reproduced by execution: control (pure insertion below the first release heading) exits 1 with the HALT; replacing "### Fixed" plus the blank line with a bullet exits 0, and replacing a prose line with a bullet exits 0, both with no output. This is the third consecutive gate to name this block (QA-5, then QA-7 and QA-8, now this one): each fix to the hunk heuristic exposed the next edge. Origin: code-review CR-1 (high confidence), CR-2 and CR-3 (low), reproduced by QA.'
    suggested_action: 'Replace the hunk heuristic rather than patching it a fourth time: compare the number of bullets from the first release heading to the end of the file in the merge-base copy against the working copy, and HALT when the working copy has more, listing the added bullets from a diff of the two regions. A one-for-one edit keeps the count; any added bullet raises it, whatever lines it replaced. Diff against the merge-base so a base that has moved is not counted. Add tests for the three non-bullet-replacement shapes and a moved base; drop the string-presence "non-vacuity" test or make it assert behaviour; mutation-prove.'
    suggested_owner: dev
    status: open
  - id: 'T283-QA-3'
    severity: medium
    file: 'docs/tasks/task.283.authoring-and-fix-steps-state-the-rules-they-keep-missing/task.283.authoring-and-fix-steps-state-the-rules-they-keep-missing.md'
