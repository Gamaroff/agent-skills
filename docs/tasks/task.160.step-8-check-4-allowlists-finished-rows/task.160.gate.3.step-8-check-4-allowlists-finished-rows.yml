gate: FAIL
status_reason: 'Check 4 itself remains measured correct (probe engages 21/21; 78/78 tests; CI green on b30a5ef6). But the cycle-2 fix does not hold: the PreCompact hook commits and pushes the report, so a pause inside Step 8 leaves exactly the git state the new resume check reads as a finished Step 8, and resume skips the cleanup and checklist.'
reviewer: 'QA Engineer'
updated: '2026-09-27T11:36:56Z'

top_issues:
  - id: 'CR3-1'
    severity: high
    file: 'shared/resources/develop-pipeline-resume-contract.md'
    finding: 'The resume contract verifies a ✅ Step 8 with verify-push-state (clean tree, HEAD == remote, PR head == HEAD). The PreCompact hook commits and pushes the report itself (develop-pipeline-on-precompact.sh "Best-effort commit + push": git add, git commit, git push origin HEAD). A pause anywhere after Step 8 sets its row ✅ therefore leaves a state that verifies, and resume skips a Step 8 whose cleanup (step4 records, test logs, halt snapshot, lock removal) and Completion Checklist never ran. The git state cannot tell a finished Step 8 from a paused one.'
    suggested_action: 'Use the resume record as the evidence instead of git or the row. Step 8 removes the lock last, and a finished run leaves no halt snapshot for its document, so any lock, snapshot or orphaned claim at step 8 proves Step 8 did not finish. Such a resume re-runs Step 8 whatever the row reads or recommended_step says. Add a test that drives the hook''s own commit-and-push before the resume decision.'
    suggested_owner: dev
  - id: 'CR3-2'
    severity: medium
    file: 'shared/resources/tests/step-8-completion-checklist.test.mjs'
    finding: 'The resume tests cannot fail for the reasons they name. The gh stub answers headRefOid with git rev-parse @{u}, which repeats the local-vs-remote check. The "pause before the commit" fixture leaves the report uncommitted, a state the hook never leaves. Dropping --pr or --scope from the contract command keeps all three cases green.'
    suggested_action: 'Rebuild the resume tests around the resume-record rule (CR3-1), with a fixture produced by the hook''s commit-and-push block.'
    suggested_owner: dev

