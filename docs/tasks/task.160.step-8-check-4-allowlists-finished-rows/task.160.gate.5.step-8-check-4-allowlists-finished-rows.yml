status_reason: 'CR4-1..3 fixed and test-held. The refute found the step-8 rule overreaches in the other direction: /finalise moves the lock to 8 before Step 7 tail work finishes, so "re-run Step 8 whatever the rows read" can skip an unfinished Step 7. Wording fixes, no new mechanism.'
