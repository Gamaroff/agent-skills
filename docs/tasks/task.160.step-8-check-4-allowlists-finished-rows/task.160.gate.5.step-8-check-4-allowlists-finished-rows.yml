top_issues:
  - id: 'CR5-1'
    severity: medium
    file: 'shared/resources/develop-pipeline-resume-contract.md'
    finding: '/finalise advances the lock to 8 as its last action (finalise SKILL.md § Pipeline Lock Cooperation; advance-pipeline-lock.sh "finalise) NEXT=8"), before the orchestrator finishes Step 7''s tail (Post DoD Body to PR, Tracker Issue Update, Step 7 Completion Checklist). A pause there leaves a record at step 8, and the contract''s "re-run Step 8 … whatever the row reads" (and the three SKILL.md exceptions) skips the unfinished Step 7 work. Step 8''s report update then marks Step 7 ✅.'
    suggested_action: 'Scope the rule to the one row it overrides: a record at step 8 means the Step 8 row is not evidence, so resume from the first row that is not finished (rows 1–7 read as before) and otherwise Step 8. Never skip an unfinished Step 7.'
    suggested_owner: dev
  - id: 'CR5-2'
    severity: medium
    file: 'shared/resources/develop-pipeline-resume-contract.md'
    finding: 'The record is named as the restored lock, the halt snapshot or the orphaned claim; the SKILL.md exceptions name the restored lock or the snapshot. A lock that survived at step 8 (a crash, or the hook not installed; Step 0-lock prints "lock present — nothing to restore") is not covered as written, so the ✅ Step 8 row reads as done.'
    suggested_action: 'Name the lock''s current_step whether restored or surviving, in the contract and in the three exceptions.'
    suggested_owner: dev
  - id: 'CR5-3'
    severity: low
    file: 'shared/resources/develop-pipeline-step-8-commit.md'
    finding: '"A HALT anywhere in Step 8 leaves none either" is false for a HALT whose report fails lint: the HALT rule then skips its /commit-changes call, so the lock survives at 8 and the snapshot records step 8.'
    suggested_action: 'Narrow to HALTs whose commit ran /commit-changes; a lint-failed HALT keeps the record.'
    suggested_owner: dev
  - id: 'CR5-4'
    severity: low
    file: 'shared/resources/develop-pipeline-step-0-resolve-and-prepare.md'
    finding: 'The re-invocation path''s Shared Resume Logic still says "identify the last ✅ step … before skipping it" with no pointer to the step-8 rule, one of the resume entry points the rule has to reach.'
    suggested_action: 'Point Shared Resume Logic at the resume-contract step-8 rule.'
    suggested_owner: dev

