top_issues:
  - id: 'CR4-1'
    severity: medium
    file: 'shared/resources/develop-pipeline-step-8-commit.md'
    finding: 'The step doc says Cleanup removes the lock last, so a finished Step 8 leaves no record, and that a HALT inside Step 8 is caught by the record. Both overstate it. /commit-changes removes the lock at step 8 (advance-pipeline-lock.sh --skill commit-changes, the current_step >= 8 arm), so the record exists only from the start of Step 8 until that commit. A pause, crash or HALT during the push, Cleanup or a failing checklist leaves no record, exactly as on develop.'
    suggested_action: 'Scope the claim: state the real remover and the window the rule covers (Step 8 start until /commit-changes), and name the post-commit window as a known, pre-existing gap with its follow-up.'
    suggested_owner: dev
  - id: 'CR4-2'
    severity: medium
    file: 'skills/develop-task/SKILL.md'
    finding: 'The new Phase 0b rule (a record at step 8 re-runs Step 8 whatever recommended_step says) is stated only in the resume contract. Context Compression Recovery items 3–4 in skills/develop-{task,story,bug}/SKILL.md still say "continue from recommended_step", which is LOCK_STEP + 1 = 9 for a record at step 8, a step that does not exist.'
    suggested_action: 'Have each Context Compression Recovery cite the resume-contract rule for a record at step 8, and add a guard test over the three SKILL.md files.'
    suggested_owner: dev
  - id: 'CR4-3'
    severity: medium
    file: 'shared/resources/tests/step-8-completion-checklist.test.mjs'
    finding: 'The "Cleanup leaves no resume record" test seeds a lock at step 8 before running Cleanup. By the time Cleanup runs, /commit-changes has already removed that lock, so the test models a state the real sequence never has and holds nothing about the actual remover.'
    suggested_action: 'Model the real sequence: a lock at step 8, then advance-pipeline-lock.sh --skill commit-changes, which asserts the lock is gone at the commit, then Cleanup, which asserts this run''s snapshot is gone.'
    suggested_owner: dev

