status_reason: 'The cycle-3 fix holds for the window it covers: from the start of Step 8 until /commit-changes, a record at step 8 exists and a resume re-runs Step 8. But the step doc overstates it. /commit-changes removes the lock at step 8 (not Cleanup), so after the commit there is no record. That gap pre-dates this branch (a284dfdd, 2026-06-08) and routes to a follow-up, but the claim must be scoped and the other resume sites must carry the rule.'
