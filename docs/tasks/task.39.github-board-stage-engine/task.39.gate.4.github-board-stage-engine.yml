    severity: medium
    finding: "probeBoard was not updated alongside run(). Now that an unmatched --board can yield ambiguous-board with a SINGLE board, probeBoard's warning asserts a falsehood — `gh-stage --probe-board --issue 42 --board 999` on a one-board issue prints \"issue #42 is on several boards — pass --board\", when the issue is on one board and --board was already passed. Its emitted payload also drops unmatchedHint / unmatchedRule / partialRead, so under --json the partial-read explanation cycle 3 added is computed here but never surfaced."
    suggested_action: "Give probeBoard the same reporting branch run() has: name the unmatched hint and its rule, and carry partialRead into the payload."
