nfr_validation:
  security:
    status: CONCERNS
    notes: "The --issue numeric validation sits inside the `if (!args.probeBoard)` block, so the probe path interpolates an unvalidated --issue directly into the GraphQL document (CR-9). Local operator-supplied CLI input, so impact is limited, but the plan explicitly requires validating N before interpolation. No secrets handled; auth stays entirely in `gh`."
  performance:
    status: PASS
    notes: "Measured 3 gh api calls per move (1 board read + 1 mutation + 1 verify read) and 0 item-add without --add-to-board — exactly the stated Performance criteria. Net reduction against the inline block it replaces."
  reliability:
    status: FAIL
    notes: "CR-1 writes a status to an unnamed board on an unmatched explicit hint. CR-3 means a transient GraphQL mutation error is never retried, contrary to the task's own criterion. CR-7 (advisory) can report a stale `landed` value because the verify re-read has no propagation delay, inverting the silent-no-op detection it exists for. CR-10 (advisory): readBoard ignores doc.errors, degrading a real API error into a benign not-on-board skip."
  maintainability:
    status: CONCERNS
    notes: "Four of 51 tests pass vacuously or contradict their own names (CR-3/4/5/6), so the suite overstates coverage of the guard, the retry and the verify re-read — the three highest-risk behaviours. Module structure, comments and the documented dependency boundary are otherwise excellent, and the boundary is itself test-asserted."

recommendations:
