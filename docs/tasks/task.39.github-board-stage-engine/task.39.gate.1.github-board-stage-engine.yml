    - action: "Resolve or reject a title-valued board hint in boardHintNumber instead of substituting project.yml's number"
      refs: ["shared/resources/gh-stage.js:864"]
    - action: "Retry a mutation error envelope, per the task's own Integration Test criterion, and assert the attempt count"
      refs: ["shared/resources/gh-stage.js:428"]
    - action: "Repair the four vacuous/misnamed tests so they exercise the behaviour their names claim"
      refs: ["shared/resources/tests/gh-stage.test.mjs:345", "shared/resources/tests/gh-stage.test.mjs:459", "shared/resources/tests/gh-stage.test.mjs:514", "shared/resources/tests/gh-stage.test.mjs:657"]
  future:
