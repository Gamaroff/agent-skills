schema: 1
task: "task.39.github-board-stage-engine"
task_title: "gh-stage.js — a GitHub Projects board engine driven by the workflow ladder"
gate: FAIL
status_reason: "Board selection falls through an explicit --board that matches nothing and writes the status to a board the operator never named — the one outcome the never-fan-out rule exists to prevent. Four tests also pass vacuously, so the suite overstates its coverage of the guard and the verify re-read."
reviewer: "QA Engineer"
updated: "2026-08-12T12:15:00Z"

top_issues:
  - id: CR-1
    severity: high
    finding: "selectBoard ||-chains its hints, so an explicit --board (or github.projectBoard) that matches no board silently falls through to the next hint and acts on a board the user never named. Verified: selectBoard(twoBoards, {board:'999', projectYml:{boardNumber:'12'}}) returns Org Portfolio with rule 'project.yml project_board_number'."
    suggested_action: "Make the highest-precedence hint that is PRESENT authoritative — if supplied but unmatched, return ambiguous-board rather than trying lower-precedence hints."
    suggested_owner: dev
  - id: CR-2
    severity: medium
    finding: "boardHintNumber discards a non-numeric board hint and substitutes project.yml's project_board_number, so `--add-to-board --board \"Team Sprint\"` adds the issue to a different board than the one the status is written to."
    suggested_action: "Resolve a title hint to its board number from the read items, or skip the add, rather than falling back to an unrelated configured number."
    suggested_owner: dev
  - id: CR-3
    severity: medium
    finding: "A mutation error envelope is never retried — setOption wraps only the exec call in withRetry and an error envelope does not throw, so exactly one mutation is issued. This contradicts the task's own Integration Test criterion ('Mutation error envelope → retried, then a warning and exit 0'). Verified: 1 attempt, not 3."
    suggested_action: "Move the errors-envelope check inside the retried closure so a transient GraphQL error is retried, and assert the call count in the test."
    suggested_owner: dev
  - id: CR-4
    severity: medium
    finding: "The test 'run: moves the card and reports the option that landed' proves nothing about the post-mutation verify re-read: the queued verify fixture contains no item matching PVTI_unset_item, so `landed` falls back to r.match.name and the assertion passes even if the re-read were deleted."
    suggested_action: "Queue a verify fixture carrying the same itemId with a different current value and assert r.to equals that value."
    suggested_owner: dev
  - id: CR-5
    severity: medium
    finding: "The test named 'guard: refuses a lower-ranked target' asserts transitioned === true — it selects a board at Todo and moves forward, so it exercises the allow path and never a refusal. Its own inline comment admits this."
    suggested_action: "Rename to describe the forward-move allow case, or change the ladder so the target really is lower-ranked and assert reason === 'would-regress'."
    suggested_owner: dev
  - id: CR-6
    severity: medium
    finding: "The test 'guard: unranked either side means no opinion — allow' never reaches the guard: the card's current value matches the moment's only candidate, so resolveOption short-circuits to 'already' and run() returns before the rank comparison."
    suggested_action: "Point the moment at a different off-ladder column than the card's current value so the flow reaches the rank comparison, and assert transitioned === true."
    suggested_owner: dev

