task_title: "gh-stage.js — a GitHub Projects board engine driven by the workflow ladder"
gate: CONCERNS
status_reason: "All 12 cycle-1 findings verified fixed, including both blockers — an unmatched board hint now fails closed and board mutations are genuinely retried. Four new medium/low issues introduced by the fix itself: the fail-closed rule is applied between project.yml's two keys (making project_board_name dead), and the verify re-read now discards the observed value it was meant to surface."
reviewer: "QA Engineer"
updated: "2026-08-12T13:05:00Z"

cycle: 2
previous_gate: "task.39.gate.1.github-board-stage-engine.yml (FAIL, 60/100)"

fix_verification:
  verified_fixed: [CR-1, CR-2, CR-3, CR-4, CR-5, CR-6, CR-7, CR-8, CR-9, CR-10, CR-11, CR-12]
  method: "Each claimed fix traced in the code rather than taken from the commit message; CR-1, CR-2 and CR-3 additionally re-run against their original cycle-1 reproductions."
  evidence:
    CR-1: "selectBoard fails closed on the first SET-but-unmatched tier; the regression test populates every lower tier, so a fall-through fails it. Reproduction now returns ambiguous-board (was: Org Portfolio)."
    CR-3: "The errors check sits inside the retried closure; measured 3 attempts (was 1), and a second-attempt success is reported as transitioned."
    CR-4: "gh-status-verify reuses itemId PVTI_unset_item so the verify lookup hits; the test asserts verified === true and exactly 3 gh api calls."

top_issues:
  - id: CR2-1
    severity: medium
    finding: "Fail-closed is applied BETWEEN project.yml's two keys, so project_board_name is unreachable whenever project_board_number is set — which is the normal config. A stale number now refuses a move the matching name would have resolved. Verified: selectBoard(twoBoards, {projectYml:{boardNumber:'999', boardName:'Team Sprint'}}) → ambiguous-board, though Team Sprint is right there."
    suggested_action: "Treat the two project.yml keys as ONE tier — try number then name, and fail closed only if neither matches. Keep the hard stop for the operator-supplied --board and github.projectBoard tiers."
    suggested_owner: dev
  - id: CR2-2
    severity: medium
    finding: "The observed value from the verify re-read is now discarded entirely, so a genuine silent no-op and a merely lagging read produce byte-identical output (transitioned:true, to:<requested>, verified:false). The no-op detection the re-read exists for is no longer available to any consumer, though the code comment still claims it."
    suggested_action: "Keep the requested name in `to` but also emit the observed column as `observed`, so a caller can tell a lagging read from a mutation that did not stick. Drop the ✅ from the unconfirmed message."
    suggested_owner: dev
  - id: CR2-4
    severity: low
    finding: "boardHintNumber's `items` parameter is never supplied by its one production call site (:719, which runs before any board read), so the documented title→number resolution is exercised only by the unit test — `--add-to-board --board \"<title>\"` can never add."
    suggested_action: "Resolve the title after the first readBoard and perform the add then, or drop the parameter and the docstring paragraph describing it. Do not leave documented behaviour that cannot fire."
    suggested_owner: dev

advisory:
  - id: CR2-3
    severity: medium
    confidence: low
    finding: "readBoard throws on ANY doc.errors, including GitHub's partial-success envelope (usable nodes plus an error for one board the token cannot see), turning a movable card into board-unreadable. A read is not a mutation, where the same all-or-nothing check is correct."
    suggested_action: "Throw only when no usable nodes came back; otherwise warn with the messages and proceed with the nodes that did resolve."

