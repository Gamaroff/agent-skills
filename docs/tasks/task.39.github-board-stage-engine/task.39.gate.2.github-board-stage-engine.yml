    status: CONCERNS
    notes: "Upgraded from FAIL. The two blockers are gone: a wrong-board write is no longer reachable, and transient mutation failures are retried. What remains is the opposite failure direction — CR2-1 can refuse a legitimate move on a stale project.yml number, and CR2-3 may refuse on a partial-success read. Refusing to act is far safer than acting wrongly, which is why this is CONCERNS and not FAIL."
