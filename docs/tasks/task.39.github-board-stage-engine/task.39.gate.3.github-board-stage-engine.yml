task: "task.39.github-board-stage-engine"
task_title: "gh-stage.js — a GitHub Projects board engine driven by the workflow ladder"
gate: FAIL
status_reason: "The cycle-2 partial-read tolerance reintroduced the cycle-1 defect through a different door: a partially-failed read can leave one usable board, and selectBoard's only-board short-circuit then bypasses the hint check entirely, writing the status to a board the operator explicitly did not name — silently under --json. The CR2-4 title-hint fix also does not work, and its test passes vacuously."
reviewer: "QA Engineer"
updated: "2026-08-12T13:40:00Z"

cycle: 3
previous_gate: "task.39.gate.2.github-board-stage-engine.yml (CONCERNS, 80/100)"

fix_verification:
  verified_fixed: [CR2-1, CR2-2, CR2-3]
  not_fixed: [CR2-4]
  note: "CR2-1 and CR2-2 hold. CR2-3's implementation is as described but its consequence was not thought through — see CR3-1. CR2-4 is wired but cannot work: it resolves a title against boards the issue is ALREADY on."

top_issues:
  - id: CR3-1
    severity: high
    finding: "A partially-failed read now returns the boards that did resolve, and when exactly one does, selectBoard's `items.length === 1 → only-board` short-circuit returns it WITHOUT consulting any hint. So an explicit `--board 7` whose board the token cannot see silently moves the card on board 12 instead. Verified by execution: reason `transitioned`, board `Org Portfolio`, 1 mutation — where before CR2-3 the read threw and nothing moved. Under `--json`, which is how the pipelines call it, `output.warn` is suppressed and no payload field records the partial error, so the wrong-board write is completely silent. This is the cycle-1 CR-1 defect re-entering through the door CR2-3 opened."
    suggested_action: "Evaluate the hint tiers BEFORE the only-board short-circuit — the short-circuit is only valid when no hint is set. Also carry a `partial` flag out of readBoard so a fail-closed result can say the hinted board may simply have been unreadable."
    suggested_owner: dev
  - id: CR3-2
    severity: medium
    finding: "The CR2-4 second-pass add cannot fix what it claims: `boardHintNumber(..., items)` resolves a title only against `items`, which comes from `repository.issue.projectItems` — boards the issue is ALREADY on. So `--add-to-board --board \"<title>\"` still never adds the issue to a new board; it fires only in the case where the add is a redundant no-op, at the cost of a write call, a 3s sleep and a second full read. The new test passes vacuously because its fixture already contains the titled board."
    suggested_action: "A title cannot be resolved to a board number from an issue-scoped read. Either resolve it against the owner's project list, or accept that --add-to-board requires a NUMERIC hint — say so plainly, drop the dead `items` parameter, and delete the test that asserts the redundant case."
    suggested_owner: dev
  - id: CR3-3
    severity: medium
    finding: "When the verify re-read throws, or the item is absent from it, `observed` stays null and the message still asserts the board \"still shows (unset)\" — a claim about board state that was never read. The JSON emits `observed: null` for both 'read failed' and 'item missing', so a consumer cannot tell either from a real observation. This is the same conflation CR2-2 set out to remove, one level down."
    suggested_action: "Distinguish the three states: `observed: null` = not read, `observed: \"\"` = read and unset, `observed: \"X\"` = read and showing X. Word the message from whichever actually applies."
    suggested_owner: dev

