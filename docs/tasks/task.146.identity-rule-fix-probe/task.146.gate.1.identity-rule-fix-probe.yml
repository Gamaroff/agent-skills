top_issues:
  - id: 'QA-1'
    severity: medium
    file: 'shared/resources/code-review-prompt.md'
    finding: >-
      The cycle-2 section of the shared reviewer contract (line 236, and its bundled copies) describes
      what the refute pass probes as "the four transitions … teardown · in-flight · error path ·
      reconnect". The directive it describes now also carries the Identity rules paragraph, so the
      description is incomplete. This is the "what did this edit make false elsewhere?" defect that
      qa-fix Step 3.5's documentation table names (from code review CR-1, verified).
    suggested_action: >-
      Add one clause to that bullet naming the identity-rule pair (one pair that must be the same, one
      that must differ, for a key, normaliser or equality change). Then run `npm run bundle` so the
      copies match. Do not add the probe to the general reviewer's checks, which stays out of scope.
    suggested_owner: dev
  - id: 'QA-2'
    severity: medium
    file: 'tests/identity-rule-probe.test.js'
    finding: >-
      The "sits outside the four-transition list" test counts bullets only between "probe these four
      transitions" and the Identity rules paragraph. Adding a fifth `•` bullet after the paragraph,
      in both blocks, leaves all 6 tests green (QA mutation, restored). "four" becomes false and the
      assertion written to hold it passes (from code review CR-3, mutation-verified).
    suggested_action: >-
      Count every `•` bullet in the whole REFUTE PASS block and assert exactly four, keeping the
      ordering assertion. Mutation-prove it with a fifth bullet placed after the paragraph.
    suggested_owner: dev
  - id: 'QA-3'
    severity: low
    file: 'skills/qa-task/SKILL.md'
    finding: >-
      In both refute blocks, "Review the COMBINATION … at least one real defect of this shape" now
      directly follows the Identity rules paragraph, so "this shape" reads as referring to identity
      rules rather than the lifecycle transitions it was written about (from code review CR-2).
    suggested_action: >-
      Name the subject in both blocks (e.g. "of the lifecycle shape above"), applied by one script so
      the blocks stay byte-identical.
    suggested_owner: dev

