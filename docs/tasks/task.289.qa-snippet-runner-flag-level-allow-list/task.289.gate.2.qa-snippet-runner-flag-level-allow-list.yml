task: 'task.289.qa-snippet-runner-flag-level-allow-list'
task_title: 'QA snippet runner allows flags, not just commands'
gate: FAIL
status_reason: 'Cycle 1 fixes hold, but the cycle 2 refute pass found two more high bypasses of the flag table, both reproduced by execution: a sed # comment ending in a backslash-newline hides a command (sed runs it), and a command substitution splits the arguments before the flag check (sort writes a file).'
reviewer: 'QA Engineer'
head: '665db04349f9d2cc004c121a86fd3f987f7f9022'
updated: '2026-11-09T14:25:14Z'

top_issues:
  - id: 'T289-CR2-1'
    severity: high
    file: 'shared/resources/qa-execute-snippets.mjs'
    finding: "sedScan handles a `#` comment with toLineEnd, which treats backslash-newline as a continuation, but GNU sed ends a comment at the first newline. `sed '#c\\<newline>e echo PWNED' f` classifies runnable and sed 4.10 ran the `e` command (QA ran it: it printed PWNED); `sed '#c\\<newline>w out' f` is runnable too. Control `sed '#c<newline>w out' f` (no backslash) is refused and `sed '# a comment' f` stays runnable. origin: code-review, reproduced by QA"
    suggested_action: 'Scan a # comment to the first newline with no backslash handling (keep the continuation-aware scan for a/i/c text only); add gap rows with and without the backslash plus the plain-comment control.'
    suggested_owner: dev
    status: open
  - id: 'T289-CR2-2'
    severity: high
    file: 'shared/resources/qa-execute-snippets.mjs'
    finding: "commandInvocations rewrites `$(` into a segment break, so a table-governed command's arguments are cut at the first command substitution and flagViolation never sees them. `sort -$(echo o) out in` classifies runnable and sort wrote `out` (QA ran it: the file was created). `sort $(echo -o) out in`, `uniq in $(echo out)`, `tail $(echo -f) x` and `date $(echo -s) now` are runnable too. Controls: `sort -u f` and `sort f | uniq` stay runnable, and `grep -c x $(ls)` is already refused. origin: code-review, reproduced by QA"
    suggested_action: 'Refuse a SAFE_FLAGS command whose argument text holds `$(` or a backtick where a flag or operand may stand, or keep the full argument text through the segment split for flagViolation; add a row per table entry for `-$(echo X)` and `$(echo -X)` plus the controls.'
    suggested_owner: dev
    status: open

