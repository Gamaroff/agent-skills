task: 'task.289.qa-snippet-runner-flag-level-allow-list'
task_title: 'QA snippet runner allows flags, not just commands'
gate: FAIL
status_reason: 'The four cycle 1 and 2 bypasses hold. Cycle 3 (safety re-probe, unscoped) found two more high bypasses in the expansion reading, both reproduced under real bash: a ${1} or ${!X} word is not read as an expansion for any governed command outside the deny-list, and a brace expansion adds operands to uniq.'
reviewer: 'QA Engineer'
head: '20f03774694897ce0e86eae321bcba4826ddc90b'
updated: '2026-11-09T15:09:48Z'

top_issues:
  - id: 'T289-CR3-1'
    severity: high
    file: 'shared/resources/qa-execute-snippets.mjs'
    finding: "shellWord reads only `${NAME…}` as an expansion, so `${1}` and `${!X}` stay literal text and flagCapable never fires for sort, uniq, file, date or any other governed command outside the deny-list. `set -- -o; sort ${1} out in` and `X=Y; Y=--output=out; sort ${!X} in` classify runnable; under real bash each created `out` (QA ran the first). Controls: `sort -n in` stays runnable; `sort $1 out in` and `sort $X out in` are refused. origin: code-review, reproduced by QA"
    suggested_action: 'Stop enumerating expansion spellings: for a governed command, refuse any word that holds an unquoted `$`, backtick, brace or glob where a flag may stand, and add a table-driven test that runs every SAFE_FLAGS entry through one shared list of expansion forms.'
    suggested_owner: dev
    status: open
  - id: 'T289-CR3-2'
    severity: high
    file: 'shared/resources/qa-execute-snippets.mjs'
    finding: "The brace check refuses only an alternative that could start a flag, and uniq's maxOperands counts the unexpanded words. `uniq {in,out}` and `uniq in{,.out}` classify runnable; under real bash `uniq {in,out}` created `out` (QA ran it). Controls: `uniq in` is runnable and `uniq in out` is refused. origin: code-review, reproduced by QA"
    suggested_action: 'Refuse an unquoted brace expansion or glob in an operand of a command with maxOperands, or count each alternative as an operand.'
    suggested_owner: dev
    status: open

