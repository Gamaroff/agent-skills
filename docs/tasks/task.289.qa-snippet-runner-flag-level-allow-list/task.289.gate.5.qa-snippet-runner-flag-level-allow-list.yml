task_title: 'QA snippet runner allows flags, not just commands'
gate: FAIL
status_reason: 'The flag table and the masked reading hold against about 900 probes, but the masker counts parentheses without regard to quotes, so a quoted paren inside a substitution makes it fail, and the carve-out added in cycle 4 then lets a block with no governed command through. One high bypass, reproduced under real bash.'
