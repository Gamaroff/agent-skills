updated: '2026-11-09T15:41:42Z'

top_issues:
  - id: 'T289-CR5-1'
    severity: high
    file: 'shared/resources/qa-execute-snippets.mjs'
    finding: "maskSubstitutions counts parentheses without regard to quotes or escapes, so a quoted paren inside a substitution ends the mask early or returns null. The masked reading then fails to parse, and the cycle 4 carve-out skips the refusal when no governed word (sed, find, sort, uniq, file, date, diff, tail) is in the block. `X=$(echo ')') touch out`, `X=$(echo '(') python3 x.py`, `X=$(echo \")\") cp in out` and `X=$(echo \")\") rm in` classify runnable; under real bash `X=$(echo \")\") touch out` created `out` (QA ran it). Control: `X=$(true) touch out` is refused (unrecognised-command). The same inputs are runnable on develop's engine, so the hole pre-dates the branch, but cycle 4 claimed this case as closed and the carve-out is what leaves it open. origin: code-review, reproduced by QA"
    suggested_action: 'Fail closed whenever the mask returns null or the masked reading cannot be parsed and the block holds a substitution, for any word and not only a governed one; make the masker quote- and escape-aware, and measure the docs scan (the cycle 4 carve-out existed to keep three doc blocks runnable).'
    suggested_owner: dev
    status: open

