top_issues:
  - id: 'T289-CR-1'
    severity: high
    file: 'shared/resources/qa-execute-snippets.mjs'
    finding: "sedScan skips a `:`/`b`/`t`/`T` label to the next newline or `;`, but GNU sed ends a label at whitespace and parses the rest as a new command. `sed ':a e echo PWNED' f` and `sed ':a;ta e echo P' f` classify runnable; sed runs the `e` command (QA ran the first: it printed PWNED). Control `sed ':a;N;$!ba;s/\\n/ /g' f` stays runnable. origin: code-review, reproduced by QA"
    suggested_action: 'Parse a label as a whitespace-terminated word and require a command separator after it (or return unreadable when anything follows the label on the line); add a gap-table row and a control.'
    suggested_owner: dev
    status: open
  - id: 'T289-CR-2'
    severity: high
    file: 'shared/resources/qa-execute-snippets.mjs'
    finding: "shellWord keeps the `$` of an ANSI-C `$'...'` or locale `$\"...\"` word as literal text, so `sort $'-o' out in` and `sort $'-\\157' out in` have no leading dash, count as operands and classify runnable; bash writes `out` (QA ran the first: the file was created). The same hole exists for every table command, since a flag spelled this way is never seen as a flag. Control `sort -u in` stays runnable. origin: code-review, reproduced by QA"
    suggested_action: 'Make shellWord treat `$'"'"'` and `$"` as quoting: decode the escapes, or mark the word dynamic so the table refuses it; add a gap-table row per command class and a control.'
    suggested_owner: dev
    status: open

