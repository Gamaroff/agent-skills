top_issues:
  - id: 'T289-CR4-1'
    severity: high
    file: 'shared/resources/qa-execute-snippets.mjs'
    finding: "A process substitution splits a governed command's arguments, so what follows never reaches the flag table, and substitutionAfterWord deliberately leaves it out. `uniq <(echo a) out.txt` and `sort <(echo a) -oout` classify runnable and each wrote its output file under real bash (QA ran both). `sed -n <(echo a) -e '1w out' in.txt`, `file <(echo a) -C -m magic` and `date <(echo a) 01011200` are runnable too. Controls: `uniq in.txt`, `sort -u <(echo a) <(echo b)` and `diff <(ls a) <(ls b)` stay runnable; the plain `uniq in.txt out.txt` and `sort -oout in.txt` are refused. origin: code-review, reproduced by QA"
    suggested_action: 'Stop judging the cut arguments: mask each substitution with a one-word placeholder and run the governed commands in the masked text through the flag table.'
    suggested_owner: dev
    status: open
  - id: 'T289-CR4-2'
    severity: high
    file: 'shared/resources/qa-execute-snippets.mjs'
    finding: "A prefix assignment holding a substitution cuts the arguments before the table sees them, and substitutionAfterWord scans only text after the command word. `X=$(echo a) uniq in.txt out.txt` and `X=$(echo a) sort -oout in.txt` classify runnable; under real bash the first wrote `out.txt` and the second `out` (QA ran both). `X=$(echo a) date -s 2020-01-01` is runnable too. Controls: `X=$(echo a) uniq in.txt` stays runnable; the plain forms are refused. origin: code-review, reproduced by QA"
    suggested_action: 'Same replacement as T289-CR4-1: mask substitutions and judge the governed command in the masked text, whatever precedes it.'
    suggested_owner: dev
    status: open

