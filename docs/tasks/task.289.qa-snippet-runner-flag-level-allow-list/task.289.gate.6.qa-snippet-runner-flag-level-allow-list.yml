top_issues:
  - id: 'T289-CR6-1'
    severity: high
    file: 'shared/resources/qa-execute-snippets.mjs'
    finding: "A # after a backslash-escaped space is read as a comment by stripNonCode (it handles a backslash only inside double quotes) and by closingParen (it tests the previous character, which is the escaped space), but bash reads `a\\ #` as one word. `echo a\\ # ; touch out` classifies runnable and created `out` under real bash; `echo $(echo a\\ #) ; touch out`, a newline and `)` does the same. Control: `echo a # ; touch out` is a real comment and stays runnable. Identical on develop's engine (measured), so it is not caused by this diff and no cycle 1-5 claim covers it. origin: code-review, reproduced by QA"
    suggested_action: 'One rule for where a # starts a comment (word start, not after a backslash-consumed character), used by every scanner that skips comments.'
    suggested_owner: dev
    status: follow-up task.290
  - id: 'T289-CR6-2'
    severity: medium
    file: 'shared/resources/qa-execute-snippets.mjs'
    finding: 'closingParen recurses once per nested double-quoted $( so `echo ` + `"$(` x20000 + `")` x20000 makes classifyBlock throw RangeError instead of failing closed. Identical on develop. Control: the same shape at depth 1000 returns mutating.'
    suggested_action: 'Make closingParen iterative or bound the depth, and catch to a mutating verdict.'
    suggested_owner: dev
    status: follow-up task.290

