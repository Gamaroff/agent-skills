top_issues:
  - id: 'CR-1'
    severity: low
    file: 'evals/shared/tests/ci-gate-parity.test.mjs'
    finding: 'jobSteps() attributes a name only when name: is the first key of a list item: a step written `- uses: x` / `name: Y` (or `- run: |` / `name: Y`) is recorded with an empty name, so it can never be classified through the name maps and the stale-key guard reports the map entry as naming no step — a false red on a workflow CI itself accepts (verified: `- uses: some/lint-action@v1` followed by `name: Marketplace lint` is reported as unclassified/unnamed).'
    suggested_action: 'Open a current-step object on every `- ` list item and assign name:/run:/uses: to it regardless of key order, pushing the step at the next list item or end of block; add a fixture-style assertion for the uses-then-name order.'
    suggested_owner: dev
    status: open

