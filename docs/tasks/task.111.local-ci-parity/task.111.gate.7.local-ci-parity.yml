status_reason: 'Gate-6 entries all verified FIXED by the mechanism replacement (every cycle-6 shape reads correctly through PyYAML; real workflows unchanged at 20 steps). The new reader has one MEDIUM — an unquoted date-like scalar anywhere in a green workflow makes json.dumps raise, and the assertion misreports it as a missing interpreter — plus two LOW robustness points and three cleanups (a stale docstring that now contradicts the new reader, the dead regex jobBlock() path, and ~15 interpreter spawns per run). All small, all in one file; one fix cycle.'
