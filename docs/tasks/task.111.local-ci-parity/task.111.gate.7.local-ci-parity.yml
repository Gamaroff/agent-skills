top_issues:
  - id: 'CR-1'
    severity: medium
    file: 'evals/shared/tests/ci-gate-parity.test.mjs'
    finding: 'yaml.safe_load turns an unquoted date/timestamp scalar (e.g. env: RELEASE: 2026-01-01 — GitHub reads it as a string) into a Python date, json.dumps raises "Object of type date is not JSON serializable", python3 exits 1, and the assertion reports "python3 + PyYAML are required" — a false red with the wrong diagnosis (reproduced).'
    suggested_action: 'json.dumps(..., default=str) so non-JSON YAML scalars are stringified as GitHub sees them; make the assertion distinguish a spawn failure (res.error) from a parse failure (stderr).'
    suggested_owner: dev
    status: open
  - id: 'CR-2'
    severity: low
    file: 'evals/shared/tests/ci-gate-parity.test.mjs'
    finding: 'With python3 absent, spawnSync returns status null and stderr undefined (the ENOENT is in res.error), so the failure is loud but reads "…: undefined" (reproduced with PATH=/nonexistent).'
    suggested_action: 'Include res.error?.message, falling back to res.stderr, in the assertion message.'
    suggested_owner: dev
    status: open
  - id: 'CR-3'
    severity: low
    file: 'evals/shared/tests/ci-gate-parity.test.mjs'
    finding: 'A block scalar whose only command is one "npm run <script>" preceded by a shell comment line contains a newline after trim, so run is blanked and the step classifies by name only although GitHub executes that script (reviewer, medium confidence; consistent with the reader as written).'
    suggested_action: 'Reduce the body to its non-empty, non-comment lines and treat it as the command when exactly one remains.'
    suggested_owner: dev
    status: open

