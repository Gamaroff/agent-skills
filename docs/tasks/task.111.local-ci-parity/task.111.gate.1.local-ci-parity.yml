schema: 1
task: 'task.111.local-ci-parity'
task_title: 'One local command that runs every CI lane, and two coverage gaps the sweep found'
gate: CONCERNS
status_reason: 'All three phases are present and every new test is mutation-proven; three LOW correctness findings from the diff review, each verified by execution — a skip that falls through into a throw, a corpus measurement that over-counts block-scalar descriptions by two, and a missing-script guard that still reads one job of the three the test now claims to cover — need one fix cycle. Maintainability CONCERNS for the half-widened guard.'
reviewer: 'QA Engineer'
updated: '2026-09-16T09:55:00Z'

top_issues:
  - id: 'CR-1'
    severity: low
    file: 'evals/shared/tests/develop-pipeline-hook-wrappers.test.mjs'
    finding: 'In the per-wrapper pass-through test, `t.skip(...)` does not stop the test function, so when `execTargetOf()` returns null execution continues into `makeSandbox(..., null)` and `path.join(refs, null)` throws — the case that should skip is listed as a failure (verified: a test that calls t.skip() then throws is reported under failing tests).'
    suggested_action: 'Return from the test after the skip — `if (target === null) return t.skip(...)` — so a non-delegating wrapper is a clean skip in this test and a plain failure in the sibling "execs an existing target" test.'
    suggested_owner: dev
    status: open
  - id: 'CR-2'
    severity: low
    file: 'tests/skill-frontmatter.test.js'
    finding: 'The corpus cap test extracts `description:` with a regex that keeps a block-scalar indicator (`>` / `|`) in the captured text, so the six SKILL.md files using one measure 2 characters longer than quick_validate.py measures them (verified: explain-simply js=791 vs py=789, humaniser 435/433, mermaid-architect 816/814, markdown-wireframe 457/455, railway-postgres-crud 498/496, use-railway 459/457) — the two checks disagree at the 1,023–1,024 boundary.'
    suggested_action: 'Measure the same string the validator measures — strip a leading `[>|][+-]?` indicator before normalising, or parse the frontmatter with the existing PyYAML-backed `python([...])` helper — and add a block-scalar fixture at exactly 1,024 that must pass both.'
    suggested_owner: dev
    status: open
  - id: 'CR-3'
    severity: low
    file: 'evals/shared/tests/ci-gate-parity.test.mjs'
    finding: 'The "every npm script the workflow invokes actually exists" guard still reads only test.yml via workflowInvocations(), while greenScripts() silently drops an `npm run <typo>` step from validate.yml or shellcheck.yml — verified by mutation: appending `run: npm run validate:alll` to validate.yml leaves all 12 parity tests green, and CI would go red on it.'
    suggested_action: 'Iterate GREEN_JOBS in that guard — classify each step, collect kind === "script" names absent from package.json — and drop the test.yml-only workflowInvocations() path or keep it as a subset check.'
    suggested_owner: dev
    status: open

