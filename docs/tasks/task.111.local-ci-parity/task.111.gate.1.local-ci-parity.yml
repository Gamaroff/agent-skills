nfr_validation:
  security:
    status: PASS
    evidence: measured
    probes_executed: 7
    notes: 'Boundary: the description cap in quick_validate.py (accept/reject on length). 7 candidates executed against the real validator: 1,025 ASCII (reject), 1,024 ASCII (accept), 1,025 multibyte code points / 2,050 bytes (reject — characters, not bytes), 1,020 multibyte (accept), a folded `>` scalar of 1,100 raw chars normalising under the cap (accept), a folded scalar normalising to 1,026 (reject), whitespace-only (rejected by the earlier empty check). Every actual matched expected. No network, auth or secret handling in the change set; scripts/lint-shell.sh takes no input and its file list comes from git ls-files.'
  performance:
    status: PASS
    notes: 'The four added lanes cost 58 s (validate:all) + 5 s (check:generated) + 24 s (bundle:check) + 29 s (lint:shell) locally; the composite is dominated by npm test (~20 min on this host) and was already the slow tier. ci:fast unchanged, so the develop loop pays nothing.'
  reliability:
    status: PASS
    notes: 'lint-shell.sh keeps both of the workflow guards and skips loudly with exit 0 when the binary is absent (executed: PATH=/usr/bin:/bin → skip message, exit 0). Parity mutations red in all three directions; wrapper mutations red naming the wrapper. Advisory CR-4 (medium confidence): check:generated goes red on an unrelated uncommitted edit to README.md or the two generated files — the same command CI runs on a clean checkout; recorded under recommendations.future.'
  maintainability:
    status: CONCERNS
    notes: 'The parity test now names three green-defining jobs but one of its assertions (missing-script guard) still reads one — the widening is half-applied (CR-3). jobSteps() carries an unused `block` field and a comment describing a `run: |` lookahead the code does not perform, and the step name resets only on `- uses:` rather than on every list item (CR-5, advisory). Docs, CHANGELOG, releases checklist and CONTRIBUTING all updated; shellcheck clean on the new script; prettier clean; bundle --check 0 problems.'

