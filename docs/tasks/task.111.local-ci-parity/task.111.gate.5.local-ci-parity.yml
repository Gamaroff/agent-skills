    file: 'evals/shared/tests/ci-gate-parity.test.mjs'
    finding: 'jobStepsFromText() sets the key column to dash indent + 2, but YAML and GitHub accept any run of spaces after the dash (`-   name: X` with continuation keys at dash + 4); in that shape run:/uses: sit at a column != keyCol, are skipped, and flush() drops the step — a false green that hides a real gate step (verified by QA with a synthetic block and independently by the reviewer). *.yml is prettier-ignored, so nothing normalises the spacing.'
    suggested_action: 'Derive the key column from the match — keyCol = dash[0].length when an item opens, and a dash line''s own column is dash[0].length — and add a "-   name:" case to the synthetic-block test.'
