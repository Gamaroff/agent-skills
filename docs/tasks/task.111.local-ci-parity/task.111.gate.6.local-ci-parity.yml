top_issues:
  - id: 'CR-1'
    severity: medium
    file: 'evals/shared/tests/ci-gate-parity.test.mjs'
    finding: 'The inSteps gate bounds only the START of the steps sequence; job-level keys written after steps: (GitHub accepts any key order) are still parsed — needs: + defaults: run: after the sequence opens a phantom ["", null, ""] step (reproduced), and with the sequence at the same indent as steps: a following defaults: run: overwrites the last real step.'
    suggested_action: 'Replace the hand-rolled parser with a real YAML read (python3 + PyYAML, already a hard requirement of tests/skill-frontmatter.test.js and installed by test.yml) that returns jobs[job].steps[] as objects; classify from those.'
    suggested_owner: dev
    status: open
  - id: 'CR-2'
    severity: medium
    file: 'evals/shared/tests/ci-gate-parity.test.mjs'
    finding: 'The dash regex requires whitespace after the dash, so a bare "-" line with the step''s keys on the following lines (valid YAML) never opens a step and the whole step — run: included — is dropped (reproduced: []) — a false green.'
    suggested_action: 'Same as CR-1 — a real YAML parser has no such case.'
    suggested_owner: dev
    status: open
  - id: 'CR-3'
    severity: low
    file: 'evals/shared/tests/ci-gate-parity.test.mjs'
    finding: 'A flow-mapping item (- { name: X, run: npm test }) is opened and flushed unrecorded (false green); a trailing " # comment" on a plain name:/run:/uses: value is kept in the value (false red); a quoted uses: value keeps its quotes and misses the SETUP_ACTIONS prefix (false red).'
    suggested_action: 'Same as CR-1 — all three are consequences of reading YAML with regexes.'
    suggested_owner: dev
    status: open

