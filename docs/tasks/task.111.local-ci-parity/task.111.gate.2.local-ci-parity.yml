schema: 1
task: 'task.111.local-ci-parity'
task_title: 'One local command that runs every CI lane, and two coverage gaps the sweep found'
gate: CONCERNS
status_reason: 'Cycle-1 findings CR-1/CR-2/CR-3 all verified FIXED by re-execution. The refute pass found three new correctness findings in the tests themselves — the cap was measured on a normalised string a loader never sees (a folded fixture parsed to 1,026 and passed), a `uses:` gate step in any green job slipped the parity classifier, and the wrapper test could not tell exec from a plain call — plus two cleanups. All were verified by execution. Fixes for all five were applied in the working tree during this review (recorded as a process deviation); they enter the branch through 5b.'
reviewer: 'QA Engineer'
updated: '2026-09-16T11:20:00Z'

top_issues:
  - id: 'CR-1'
    severity: medium
    file: 'skills/create-skill/scripts/quick_validate.py'
    finding: 'The cap was measured on the whitespace-normalised string, not the parsed value a loader receives: a folded scalar whose continuation line begins with a space is a YAML more-indented line, YAML keeps its newline, and the at-cap-folded fixture that "passed at 1,024" parses to 1,026 (verified with PyYAML). The comment claiming the normalised string is "the same string a loader sees after YAML folding" was false.'
    suggested_action: 'Measure len(str(fm["description"]).strip()) — the parsed value with only outer whitespace (the clip newline) removed; make the corpus test read the same parsed value through skill_frontmatter.parse; build the folded fixture so no continuation line starts with whitespace, and add the more-indented case as a fixture that must be rejected.'
    suggested_owner: dev
    status: open
  - id: 'CR-2'
    severity: low
    file: 'evals/shared/tests/ci-gate-parity.test.mjs'
    finding: 'jobSteps() recorded only `run:` steps, so a gate added to a green job as a marketplace `- uses:` action was never classified and passed silently — verified by mutation: `- name: Marketplace lint / uses: some/lint-action@v1` appended to validate.yml left all 12 tests green — contradicting the header rule that an unclassified step fails.'
    suggested_action: 'Record `uses:` steps too; recognise unnamed setup actions by a SETUP_ACTIONS prefix list (actions/checkout@, actions/setup-node@, actions/setup-python@) and named ones through the existing maps; add "Set up Node" / "Set up Python" to SETUP_STEPS.'
    suggested_owner: dev
    status: open
  - id: 'CR-3'
    severity: low
    file: 'evals/shared/tests/develop-pipeline-hook-wrappers.test.mjs'
    finding: 'The header claimed dropping `exec` fails one of the three assertions; it does not — a wrapper that calls the target without exec still propagates argv, inherited stdin and the last command''s exit status (verified: a non-exec wrapper that still mentions exec in a comment passed all three), so the exec half of the wrapper contract was untested.'
    suggested_action: 'Have the stub print its own $$ and assert it equals the pid spawnSync started — under exec the wrapper''s process is the stub; reword the header to say which mutation each assertion catches.'
    suggested_owner: dev
    status: open

