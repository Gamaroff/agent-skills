top_issues:
  - id: 'T276-QA-1'
    severity: medium
    file: 'shared/resources/resume-prompt-check.sh'
    finding: 'The live lock is compared only on current_step, never on task_or_story_directory. A lock for another document at a later step makes a prompt for this document read "already complete" (exit 1), so the caller reports done and stops. Reproduced: lock {current_step:6, task_or_story_directory:"/other/dir"} with prompt "step 1" for a different doc dir prints "already complete: 1", rc=1. (origin: code-review CR-1, reproduced by QA; reviewer confidence medium, recorded unchanged.)'
    suggested_action: 'Canonicalise the lock directory and compare with the doc-dir as advance-pipeline-lock.sh does; ignore a lock for another document (fall through to the artefact checks), and add a test with a foreign lock.'
    suggested_owner: dev
    status: open
  - id: 'T276-QA-2'
    severity: medium
    file: 'CHANGELOG.md'
    finding: 'No [Unreleased] entry cites task 276. changelog-cites.sh task.276 prints "missing (task 276)", rc=1; /finalise 6d HALTs on it.'
    suggested_action: 'Add a Fixed entry under [Unreleased] citing (task 276): the HALT helper, the DoD-gaps restore guard, the distinct-cycle budget base, the resume-prompt check.'
    suggested_owner: dev
    status: open
  - id: 'T276-QA-3'
    severity: medium
    file: 'docs/tasks/task.276.halts-and-re-entries-leave-and-read-true-state/task.276.halts-and-re-entries-leave-and-read-true-state.md'
    finding: 'Success criterion "CI=true npm test wall time within 10% of develop, median of five alternating runs" is unverified: no measurement exists. The only datum is one remote run of 934 s with no develop counterpart.'
    suggested_action: 'Run the protocol (five alternating develop/branch runs on the LAN server, uptime beside each) and record the medians in the QA report, or escalate for an approver to amend the criterion.'
    suggested_owner: dev
    status: open
  - id: 'T276-QA-4'
    severity: low
    file: 'shared/resources/resume-prompt-check.sh'
    finding: 'The step-5 row pattern holds a multibyte en dash inside a bracket expression. Under LC_ALL=C the class matches single bytes and the row is not found: the check exits 3 "no Pipeline Progress row" where the default locale exits 1 "already complete". Reproduced by execution; control (default locale) finds the row. (origin: code-review CR-3, reproduced by QA; reviewer confidence low, recorded unchanged.)'
    suggested_action: 'Use a grep -E alternation, 5(–|-)6, which is byte-safe in every locale; add an LC_ALL=C case to resume-prompt-check.test.sh.'
    suggested_owner: dev
    status: open

