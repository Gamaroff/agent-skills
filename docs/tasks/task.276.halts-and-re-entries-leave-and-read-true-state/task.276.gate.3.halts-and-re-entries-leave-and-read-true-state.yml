top_issues:
  - id: 'T276-QA-6'
    severity: low
    file: 'shared/resources/resume-prompt-check.sh'
    finding: 'A lock whose task_or_story_directory is "./" (or any value that strips to an empty string) is called unresolvable: the strip leaves "" and cd -P -- "" fails, so the guard answers exit 3 "does not resolve" although "." is valid. The same lock written as "." goes on to the later checks. Reproduced from a repository cwd: lock {current_step:7, task_or_story_directory:"./"} gives rc=3; control "." gives rc=0 "proceed". No writer emits "./": a work-item directory is never the repository root. (origin: code-review CR-1, reproduced by QA; reviewer severity low and confidence medium, recorded unchanged.)'
    suggested_action: 'Map an empty result of the strip to "." in both the guard and canon(), preferably through one norm() helper (see T276-QA-7).'
    suggested_owner: dev
    status: closed
    resolution: 'carried to recommendations.future (route 2b)'
  - id: 'T276-QA-7'
    severity: low
    file: 'shared/resources/resume-prompt-check.sh'
    finding: 'A stale lock naming a relative directory that has since been deleted or moved now answers exit 3 every time, and the message blames the cwd ("run this from the repository root"); the same lock with an absolute path falls through to "another document" and proceeds. Reproduced: lock directory "gone/x" gives rc=3 with that message, "/gone/x" gives rc=0 "proceed". The user cannot tell that the lock is the stale part. Also: the strip expression is written twice (guard and canon()), and with the guard in place the canon() change is behaviourally inert (mutation reverting it reds no test). (origin: code-review CR-2 and CR-3, CR-2 reproduced by QA; reviewer severity low and confidence medium, recorded unchanged.)'
    suggested_action: 'Say in the message that the directory may no longer exist and the lock may be stale, naming the lock file; fold the two strip expressions into one helper.'
    suggested_owner: dev
    status: closed
    resolution: 'carried to recommendations.future (route 2b)'

