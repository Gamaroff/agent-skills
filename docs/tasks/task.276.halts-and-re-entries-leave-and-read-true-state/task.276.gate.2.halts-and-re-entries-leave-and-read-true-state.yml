  - id: 'T276-QA-5'
    severity: low
    file: 'shared/resources/resume-prompt-check.sh'
    finding: 'The new canon() falls back to the raw string when cd fails, and unlike advance-pipeline-lock.sh it does not strip ./ or trailing slashes. A lock holding a relative task_or_story_directory, read from another cwd, compares unequal to the absolute document directory, is taken for another document''s lock, and a step the run is already past gets "proceed". Reproduced: lock {current_step:7, task_or_story_directory:"docs/t"}, prompt "step 5" with the absolute document dir, cwd /, prints "proceed: 5"; from the repository root, with the relative dir, it prints "already complete: 5" (the control). (origin: code-review CR-1, reproduced by QA; reviewer severity low and confidence low, recorded unchanged.)'
    suggested_action: 'Strip ./ and trailing slashes as advance-pipeline-lock.sh does, and when the lock''s directory cannot be resolved with cd return exit 3 "cannot tell" instead of treating the lock as foreign; add a test for a relative lock directory read from another cwd.'
    suggested_owner: dev
    status: open

