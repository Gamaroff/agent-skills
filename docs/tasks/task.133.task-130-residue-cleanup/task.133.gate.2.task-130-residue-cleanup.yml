  - id: TASK-133-QA-4
    severity: medium
    file: 'shared/resources/develop-pipeline-resume-contract.md'
    finding: 'The Step 0-lock restore is now conditional on § Restore the lock, whose condition is phrased around the detector source and the Resume prompt. On the in-place continuation path neither exists, so a literal reading skips the restore (refute CR-2).'
    suggested_action: 'State in § Restore the lock that the in-place path evaluates the same halt_reason/pause_reason bullets from the snapshot on disk; pin it with a test.'
    suggested_owner: dev
    bug_ref: 'task.133.bug.3.restore-condition-unevaluable-on-in-place-path.md'
    status: open
  - id: TASK-133-QA-5
    severity: medium
    file: 'shared/resources/pipeline-resume-detector-prompt.md'
    finding: 'With legacy candidates now dropped, a legacy-only set reaches the no-candidate rule, which says source none and "treat this as a fresh start". SKILL.md says a legacy snapshot is never a fresh start (refute CR-3).'
    suggested_action: 'Give a legacy-only set its own blocking issue naming --restore --accept-legacy or delete; pin it at a marker.'
    suggested_owner: dev
    bug_ref: 'task.133.bug.4.detector-legacy-only-reads-as-fresh-start.md'
    status: open
  - id: TASK-133-QA-6
    severity: low
    file: 'shared/resources/change-log.js'
    finding: 'platform-variance: new-document is decided by matching English git stderr, so under a non-English locale an absent-at-rev document is usage exit 2 (refute CR-5).'
    suggested_action: 'Run git with LC_ALL=C in the execFileSync env, or use `git cat-file -e <rev>:<path>` after `git rev-parse --verify`.'
    suggested_owner: dev
    status: open
  - id: TASK-133-QA-7
    severity: low
    file: 'shared/resources/tests/report-lint-call-sites.test.mjs'
    finding: 'The nonLiteral regex also matches the declaration `function usage(msg)`, so the template-cause assertion runs unconditionally and cannot tell whether a non-literal usage( call exists (refute CR-6).'
    suggested_action: 'Exclude the declaration (require a non-`function` prefix, for example `return usage(`).'
    suggested_owner: dev
    status: open

