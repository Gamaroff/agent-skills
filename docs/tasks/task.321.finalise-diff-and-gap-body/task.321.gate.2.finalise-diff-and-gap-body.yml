top_issues:
  - id: 'T321-CR-201'
    severity: medium
    file: 'shared/resources/finalise-dod-ac-prompt.md'
    finding: 'The AC prompt (shared/resources/finalise-dod-ac-prompt.md:56) and the fix-evidence prompt (finalise-dod-fix-evidence-prompt.md:51) tell the agent whether <DIFF_FILE> holds the bundled copies by reading "Step 3a''s **PR diff:** line", but no agent receives that line: the Step 3b dispatch table (skills/finalise/SKILL.md:708, :711, :721) passes no DIFF_LINE substitution, and the running summary''s Step 2 block is written at Step 3d, after the agents return. The Append 1 template has no **PR diff:** slot either (code-review CR-2, advisory). Introduced by cycle 1''s CR-102 fix. Origin: code-review CR-1 (medium/high); confirmed by QA reading the dispatch table and the Append 1 template.'
    suggested_action: 'Pass the line to the agents as a <DIFF_LINE> substitution in the AC, docs and fix-evidence dispatch rows and have the prompts read that placeholder; put **PR diff:** {DIFF_LINE} in the Append 1 template so the record has one writer.'
    suggested_owner: dev
    status: open
  - id: 'T321-CR-202'
    severity: low
    file: 'shared/resources/finalise-diff.sh'
    finding: 'The merge-base patch (shared/resources/finalise-diff.sh:132) is written by porcelain git diff, so the host''s git config reaches it. Reproduced: with color.ui=always and diff.noprefix in GIT_CONFIG_GLOBAL the patch holds ANSI escapes and its headers lose the a/ and b/ prefixes; control, the same run with GIT_CONFIG_GLOBAL=/dev/null, is clean. The tests pin /dev/null, so they cannot see it. New to this change: the base read the forge first. Origin: code-review CR-4 (low/low), reproduced by QA.'
    suggested_action: 'Pass --no-color --no-ext-diff --no-textconv --src-prefix=a/ --dst-prefix=b/ to the patch diff, and add a test that runs with a hostile user config.'
    suggested_owner: dev
    status: open

