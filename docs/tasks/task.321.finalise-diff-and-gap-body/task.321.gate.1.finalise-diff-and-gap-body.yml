top_issues:
  - id: 'T321-CR-101'
    severity: medium
    file: 'skills/finalise/SKILL.md'
    finding: 'Step 3e (skills/finalise/SKILL.md:1359) runs rm -f "$DIFF_FILE" "$DIFF_FILE.names" in a block that never binds DIFF_FILE; each fenced block is its own shell, so it runs rm -f "" ".names" — reproduced in bash and zsh: ./.names deleted, .claude/state/pr-diff-*.diff and .names left. Control: with DIFF_FILE bound both state files go and ./.names stays. The base block (rm -f "$DIFF_FILE") had the same unbound read but deleted nothing; the .names deletion is new. Origin: code-review CR-1 (medium/high), reproduced by QA.'
    suggested_action: 'Bind DIFF_FILE in the Step 3e block from a path Step 3a records, use ${DIFF_FILE:?} so an empty value fails, and hold the block with an executed test in bash and zsh.'
    suggested_owner: dev
    status: open
  - id: 'T321-CR-102'
    severity: low
    file: 'shared/resources/finalise-diff.sh'
    finding: 'The forge arm (shared/resources/finalise-diff.sh:144) writes gh pr diff verbatim, so its patch carries bundled skills/*/references/ copies that the script header, SKILL.md Step 3a and the fix-evidence prompt say <DIFF_FILE> leaves out — reproduced: a merged PR changing shared/resources/tool.md and its copy gives source=forge with the copy in the patch; control, the same change on the merge-base arm, excludes it. Origin: code-review CR-2 (low/medium), reproduced by QA.'
    suggested_action: 'Filter the bundled-copy hunks out of the forge patch by the same source lookup (the names list keeps every path), or state in the header, SKILL.md and the prompts that the forge patch keeps them.'
    suggested_owner: dev
    status: open

