status_reason: 'The diff reader, the prompts and the gap-body rule are right, and each rule turns a named test red when reverted. One medium finding: the Step 3e cleanup block reads $DIFF_FILE with no writer in its own shell, so it deletes ./.names and leaves both state files. One low: the forge arm keeps the bundled copies the contract says the patch leaves out. Both reproduced by execution.'
