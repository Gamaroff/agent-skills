top_issues:
  - id: 'TASK-130-QA-1'
    severity: medium
    file: 'shared/resources/advance-pipeline-lock.sh'
    finding: 'The --restore flag parser stops at the first positional and checks only [ $# -ge 1 ], so `--restore <doc-dir> --which` (or a trailing --accept-legacy) drops the flag and performs a full consuming restore instead of the read-only query — reproduced: lock created, snapshot consumed, exit 0 (code review CR-1; bug 1).'
    suggested_action: 'After the flag loop require exactly one remaining positional ([ $# -eq 1 ] || usage) so a trailing flag is a usage error; add an advance-pipeline-lock.test.sh scenario for the trailing-flag spelling (exit 1, no lock, snapshot kept).'
    suggested_owner: dev
    bug_ref: 'task.130.bug.1.restore-trailing-which-flag-consumes.md'
    status: open
  - id: 'TASK-130-QA-2'
    severity: medium
    file: 'shared/resources/develop-pipeline-resume-contract.md'
    finding: 'The stale-snapshot delete loop (§ Consume Output) loses jq exit status behind the process substitution: an unset/empty DETECTOR_JSON emits nothing and a delta missing `concern` aborts jq (startswith on null) — both exit 0 with the snapshot still on disk, so "no stale snapshot" and "the reader is broken" report one value (code review CR-2, confidence raised to high by QA reproduction; bug 2).'
    suggested_action: 'Guard the input (: "${DETECTOR_JSON:?}"), extend the schema check to deltas_since_pause being an array, materialise the path list with jq exit checked and (.concern // "") so a missing key is a non-match, then loop; add stale-snapshot-delete.test.mjs cases for the unset variable and the missing-concern delta (exit 1).'
    suggested_owner: dev
    bug_ref: 'task.130.bug.2.stale-snapshot-delete-loop-silent-on-broken-input.md'
    status: open

