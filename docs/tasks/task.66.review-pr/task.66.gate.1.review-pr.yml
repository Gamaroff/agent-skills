top_issues:
  - id: CR-1
    severity: medium
    finding: 'Resolution rung 2 greps `pr_number: ${PR_NUMBER}` with no end anchor, so reviewing PR 28 matches a document whose frontmatter reads pr_number: 281 and anchors the whole review on the wrong work item.'
    suggested_action: 'Anchor the pattern to end-of-value: grep -rlE "pr_number: ${PR_NUMBER}[[:space:]]*$" docs/.'
    suggested_owner: dev
  - id: CR-2
    severity: medium
    finding: 'Rungs 1 and 3 use docs/**/ globs, but bash without globstar expands ** as a single level — the documented gate glob matches 0 of 110 gate files in this repo.'
    suggested_action: 'Replace the ** globs with recursive grep --include / find.'
    suggested_owner: dev
  - id: CR-3
    severity: medium
    finding: 'Step 8 consumes $BODY_FILE in three commands but no step assigns it, and Step 9 removes only $DIFF_FILE — the comment path is unrunnable as written and leaks the body file if improvised.'
    suggested_action: 'Assign BODY_FILE via mktemp and write the body before the platform branches; delete it in Step 9.'
    suggested_owner: dev
  - id: CR-8
    severity: low
    finding: 'The schema-mirror test assertion has a dead first alternative and a loose |parallel fallback, so it passes on the word "parallel" appearing anywhere in the file — a vacuous assertion.'
    suggested_action: 'Drop the backticks from the first alternative and remove the |parallel fallback so the assertion binds to the real sentence.'
    suggested_owner: dev

