    finding: 'The Bitbucket marker search reads only the first page of comments, defeating idempotency on a busy PR.'
  - id: CR-9
    severity: low
    confidence: medium
    finding: 'The eight-artifact-kinds test substring-checks generic tokens against the whole Step 3 block; it still passes if the globs are deleted.'
  - id: CR-10
