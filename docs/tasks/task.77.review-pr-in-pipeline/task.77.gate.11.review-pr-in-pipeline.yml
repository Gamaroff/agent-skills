# ── PROVENANCE — why this gate is not self-issued ─────────────────────────────
# I was dispatched with NO ACCOUNT of how any of these fixes were made, and did
# not ask for one. I did not write the code, the docs, or the commit under
# review, and I have no fix here to defend. Every claim in every repo artifact —
# the ef3a0c1 commit message and its seven-row mutation-proof block, the
# implementation report's post-gate-10 section, the task document's Change Log
# and QA tables, task.88.resume-guard-strength.md, task.77.dod.1, task.77.dod.2,
# and gates 1 through 10 — was treated as a HYPOTHESIS TO TEST by execution,
# never as evidence.
#
# This continues the rule that produced gates 5 through 10, which itself existed
# because Step 5c's finding PC-1 was that the agent writing this task's code had
# also written the gate clearing it.
#
# WHAT I WAS TOLD, AND WHAT EXECUTION FOUND.
#
# I was told as fact that six consecutive independent gates and two DoD runs had
# each found a defect; that gate 10 found a real guard hole in which a mention
# stood in for a mapping on the 5c verdict table; that this was the FIFTH such
# instance; and that my highest-value activity was to hunt a SIXTH and to try to
# defeat the new parsed-row mechanism.
#
# I did both. The mechanism HELD against every structural attack I could build:
# reordering rows, adding a decoy verdict row, merging two verdicts into one
# cell, moving the table out of 5c, truncating the parse with a mid-table blank
# line, and putting the right destination in the wrong verdict's row are all
# caught by name. Two of my ten attacks on it (reorder; delete the blank-line end
# marker) are green and BENIGN by construction — row order carries no contract
# meaning, and the widened slice absorbs only blockquote lines the parse filters.
# Three more (M8-M10) evade the NEGATIVE assertions by rephrasing; I record those
# as an inherent limit of regex-on-prose and deliberately DO NOT raise them,
# because the property is asserted, merely not exhaustively.
#
# THE SIXTH INSTANCE IS INSIDE THE FIX. Gate 9's CY9-3 enumerated SEVEN
# inversions of the resume contract and its suggested_action named the map to
# build, explicitly including `APPROVE`/`CONCERNS` -> /Step 7/. The new per-value
# destination block enumerates four values. The fifth — the loop's EXIT arm — is
# asserted nowhere. Gate 9's mutation 27 and gate 10's mutation 31 are the same
# edit and are still 20/0 GREEN, and I added a stronger one: the row DELETES
# clean. Four artifacts say otherwise, and ef3a0c1's mutation-proof block reports
# a substitute, red mutation under the `#31` label — so the single green member
# of the set it cites never reached the record. I diagnose that as a labelling
# error rather than fabrication (the substitute exists and genuinely fires, and
# #32 is reported correctly), but the effect is the same: the gap is invisible in
# the trail.
#
# WHAT I WOULD NOT MANUFACTURE. I was told six gates in a row each found a
# defect, which is exactly the pressure that produces a seventh finding whether
# or not one exists. Three of the surfaces I was pointed at came back CLEAN and I
# say so: advance-pipeline-lock.sh's stage arms are pinned by a test that RUNS
# the script and asserts the resulting step under both shells, not by a mention;
# the ingester contract is asserted on the ingester and renderer files
# themselves; and the tracker-workflow moment table is green exactly as gate 10
# already discloses. I also mis-targeted mutation 20 on my first attempt (hitting
# the 5b restatement at :301 rather than §5c) and kept that in the record rather
# than reporting gate 10 wrong.
#
# THIS GRADES THE POST-GATE-10 HEAD, NOT A QA CYCLE. The 5-cycle budget was spent
# at gate 5. Loop Escalation stands. This is the eighth post-escalation
# assessment and none of them restores it.

top_issues:
  - id: "CY11-1"
    severity: medium
    file: "evals/shared/tests/pr-review-loop-parity.test.mjs"
    finding: "CY9-3 is closed for FOUR of its five values; the fifth is the loop's EXIT arm and is asserted nowhere. The new PER-VALUE DESTINATION block at :723-762 enumerates `REQUEST CHANGES`, `review failed`, `pending — 5c not yet run` and `not reached`. The resume sub-state table's fifth row, `APPROVE` or `CONCERNS`, is parsed into subStateRows and receives ONLY the generic well-formedness check (key.length > 0 && action.length > 0); it is absent from the enumerated `claimedBy` loop as well. Executed at head, 20 tests / 20 pass / 0 fail on each of: (31) the action rewritten from `5c cleared — Step 5–6 is complete, go to Step 7` to `5c cleared — re-enter at **5a**`, which is gate 9's mutation 27 and gate 10's mutation 31 verbatim; and (N1) the entire row DELETED. The harm is specific — a resumed run whose 5c already returned APPROVE re-enters the QA loop at 5a, re-derives the gate that just passed, and burns cycles from a budget that reaches Loop Escalation. Gate 9 named this row explicitly: 'MINE 27. APPROVE/CONCERNS action -> re-enter at **5a**, inverting the LOOP'S EXIT'. Its CY9-3 suggested_action named the map to build and listed `APPROVE`/`CONCERNS` -> /Step 7/ as one of five entries. This is MEDIUM rather than LOW on the SAME two grounds gate 10 used to lift CY10-1 above CY9-3's band. First, the assertion set's own comment at :727-731 reads 'Each value resumes somewhere specific, so each is asserted specifically' — naming a property it does not hold for one of five. CY9-3 was LOW precisely because 8293765 claimed only 'a verb AND a destination', which is what it tested; that exculpation is gone. Second, the closure is asserted in three further artifacts: ef3a0c1's message ('The resume rows likewise now assert WHICH destination each value resumes at'), the implementation report's post-gate-10 table ('not merely that one is named'), and task.88.resume-guard-strength.md ('It is now genuinely closed … mutation-proved with gate 9's mutations 30-32'). THIRD, AND SEPARATELY: ef3a0c1's mutation-proof block lists the seventh row as `gate 9 #31 resume 'review failed' -> 5a -> red`, but gate 10's mutation table row 31 and gate 10's own mutations_executed entry both define #31 as the APPROVE/CONCERNS exit arm -> 5a. I verified the substitute independently — `review failed` -> 5a IS red — so this reads as a labelling error, not a fabrication. Its effect is that the one green member of 30-32 left no trace in the record. NOT a runtime defect: the prose on disk is correct today. Gate 10 could not have found this — all 47 of its mutations that touched the resume table were gate 9's three, and it did not re-derive CY9-3's enumeration."
    suggested_action: "Add the fifth entry to the destination map, beside the four already there. The row keys both verdicts together, so key on the row rather than the value: `const exit = subStateRows.find((r) => r.key.includes('`APPROVE`')).action;` then `assert.match(exit, /Step 7/)` and `assert.doesNotMatch(exit, /re-enter|Return to/)`, with a message naming the harm (an approved run re-entering the loop re-derives the gate that just passed). Also add `APPROVE` to the `claimedBy` enumeration so the row cannot be deleted or merged. Roughly six lines. MUTATION-PROVE with gate 10's mutation 31 (`5c cleared — re-enter at **5a**`) and with the row deleted outright — both 20/0 green today. Then correct the three artifacts that claim mutations 30-32 were all proved: ef3a0c1's message is immutable, so disclose in the implementation report and IN PLACE on task.88, as this task has correctly done twice before rather than amending silently."
    suggested_owner: dev
  - id: "CY11-2"
    severity: low
    file: "evals/shared/tests/pr-review-loop-parity.test.mjs"
    finding: "The test named 'ready-for-merge sits inside 5c, after the review clears' asserts an ORDERING, not a containment: `const s5c = loopDoc.indexOf('### 5c. '); const stage = loopDoc.indexOf('--stage ready-for-merge'); assert.ok(stage > s5c, 'ready-for-merge must sit INSIDE 5c…')`. §5c is the LAST section before `## Loop Escalation`, so 'after the 5c heading' and 'inside 5c' are not the same predicate — every byte downstream satisfies it. Executed: relocating the whole `jira-stage.js` / `gh-stage.js` `--stage ready-for-merge` fence out of §5c and into `## Loop Escalation` leaves the suite 20 tests / 20 pass / 0 fail. The mutated document signals a card merge-ready from the ESCALATION path — a run that failed to converge in five cycles — which is a stronger form of the exact harm the assertion's own message names ('advertised a card as merge-ready while the run could still loop back into qa-fix'). The sibling assertions do not save it: `never on REQUEST CHANGES` stays inside §5c, and the doesNotMatch on the outcome-branching slice is unaffected. LOW rather than MEDIUM because no artifact claims more than the assertion does, and because the guard is otherwise live — mutation 14 (re-add the call to 5a's branching), mutation 15 (remove it entirely) and my N3 (rename the stage to `in-qa`) all fail by name. Same class as CY11-1 and CY10-1: a proxy standing in for the relationship the test is named for."
    suggested_action: "One line: replace `loopDoc.indexOf('--stage ready-for-merge') > loopDoc.indexOf('### 5c. ')` with `assert.ok(section5c().includes('--stage ready-for-merge'), …)`. `section5c()` is defined 300 lines above in the same file, is already guarded on BOTH indices, and is the mechanism the rest of the suite uses. Mutation-prove by moving the fence into `## Loop Escalation` — 20/0 green today. Keep mutations 14 and 15 as the paired controls."
    suggested_owner: dev
