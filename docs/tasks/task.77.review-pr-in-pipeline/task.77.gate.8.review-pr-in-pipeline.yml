schema: 1
task: "task.77.review-pr-in-pipeline"
task_title: "Run the PR conformance review before a work item is finalised"
gate: CONCERNS
status_reason: "Grades the POST-GATE-7 REMEDIATION PASS (commit a0ced9b), NOT a QA cycle — the 5-cycle budget was spent at gate 5 and Loop Escalation stands; a third remediation pass does not restore it. This is the first pass in four whose headline mechanism is as strong as the sentence describing it. CY7-1 (HIGH) is genuinely closed: the guard was REPLACED rather than narrowed a third time, and it survives the adversarial test the trail did not publish — deleting each enumerated row while holding the parsed row count at 5 with a decoy goes red for ALL FOUR values, each naming its own value. CY7-2's impossible rationale was retired and its replacement is not merely plausible but SIMULATED TRUE (with the end marker removed, the row parse absorbs a later blockquote table's rows). CY7-7 is now held by three live assertions. CY5-4, PARTIAL for four consecutive assessments, is closed. Execution is green everywhere it can be measured: npm run ci exit 0, 2285 tests / 0 fail; parity 18/18; lock 14/14 under bash AND zsh; 4/4 PR checks on head SHA a0ced9b == local HEAD; 45/45 bundled copies content-identical at branch scope. It is not a PASS because CY7-4 is PARTIAL and asserted closed: the wrong count still stands in the PR #309 body (:43) and the task doc Change Log (:569), in a PR body that WAS edited in this same pass. Four narrow test-strength residuals found by attacking the guard from angles the trail did not try. No HIGH open; nothing is a runtime risk."
reviewer: "QA Engineer (independent subagent — see provenance below)"
updated: "2026-09-03T00:00:00Z"

# ── PROVENANCE — why this gate is not self-issued ─────────────────────────────
# I was dispatched with NO ACCOUNT of how any of these fixes were made, and did
# not ask for one. I did not write the code, the docs, or the commit under
# review. Every claim in every repo artifact — the a0ced9b commit message, the
# implementation report's post-gate-7 section and mutation matrix, the PR #309
# body's mutation table, the task doc's Change Log, and gates 5, 6 and 7 — was
# treated as a HYPOTHESIS TO TEST by execution, never as evidence. I made no
# fixes here and have none to defend.
#
# This continues the rule that produced gates 5, 6 and 7, which itself existed
# because Step 5c's finding PC-1 was that the agent writing this task's code had
# also written the gate clearing it.
#
# WHAT EXECUTION FOUND THAT READING WOULD NOT — in both directions this time.
#
# IN THE FIX'S FAVOUR: the published mutation matrix (delete each row, one at a
# time) is NOT the test that proves the new mechanism — every one of those four
# deletions fires the row-count canary `subStateRows.length >= 5`, not the
# first-cell keying the paragraph above the matrix describes. A guard that only
# counted rows would produce a byte-identical matrix. So I ran the sharp version
# the trail did not: delete a row AND add a decoy so the count stays 5. All four
# values go red, each naming ITSELF. The keying is real. After three rounds in
# which the mechanism was weaker than the claim, this one is not.
#
# AGAINST IT: a0ced9b says "CY7-4 … Corrected to six of eight" without
# qualification, and the implementation report repeats it. Gate 7 named three
# artifacts and its suggested_action said "and the PR body in place". The PR
# body still reads "Five of the seven were verified genuinely closed" at line 43
# — and that body WAS edited in this pass, gaining a gate-7 paragraph at line 44
# and a rewritten mutation row at line 32. The task doc's Change Log carries a
# fourth instance ("5 of 7") gate 7 had not enumerated, and the exact phrase
# CY7-3 named ("corrected in all three artifacts") still stands there too.
#
# I executed 27 mutations — 17 asserted somewhere in this trail, 10 of my own.
# Every trail-asserted proof holds, including the one the trail honestly records
# as NOT holding. Three of my ten found gaps; none is a false claim, all are
# residual coverage. That is a different failure profile from gates 5, 6 and 7,
# and the grade reflects it.
# ──────────────────────────────────────────────────────────────────────────────

top_issues:
  - id: "CY8-1"
    severity: medium
    file: "docs/tasks/task.77.review-pr-in-pipeline/task.77.review-pr-in-pipeline.md"
    finding: "CY7-4 is PARTIAL and is asserted closed in two artifacts. `a0ced9b`'s message says 'CY7-4 — \"Five of the seven\" was followed by a list of six; the count was wrong and the list was right. Corrected to six of eight, matching gate 6.' The implementation report (:543) repeats it unqualified. Gate 7's CY7-4 named THREE artifacts and its suggested_action said explicitly 'Correct the commit trail by note (not force-push) AND THE PR BODY IN PLACE.' On disk: the implementation report (:466-468) IS corrected, and well — it annotates what the earlier version said. The PR #309 body line 43 still reads 'Five of the seven were verified genuinely closed'. The task doc Change Log at `task.77.review-pr-in-pipeline.md:569` still reads '5 of 7 gate-5 findings verified closed' — a fourth instance gate 7 did not enumerate. Aggravating: the PR body was EDITED in this same pass (a gate-7 paragraph added at :44, the mutation row at :32 rewritten to 'third version of this guard'), so the sentence nine lines above was passed over, not unreachable. One of three named artifacts corrected, published as corrected — the axis this branch keeps failing on, now at its narrowest."
    suggested_action: "Edit the PR #309 body line 43 to 'Six of the eight items gate 5 left open were verified genuinely closed' and the task doc Change Log :569 the same way. Then reword the implementation report's :543 summary and any future commit note to say which artifacts were corrected, rather than asserting the correction is complete."
    suggested_owner: dev
    status: open
  - id: "CY8-2"
    severity: low
    file: "docs/tasks/task.77.review-pr-in-pipeline/task.77.review-pr-in-pipeline.md"
    finding: "The exact phrase CY7-3 named survives in the task doc's Change Log. CY7-3 quoted 'That claim is now corrected in **all three artifacts it appeared in**' and called it a false closure claim. The implementation report's row 492 was reconciled properly and honestly ('corrected in the two artifacts that can still be edited — this report and the PR body. The third, `741117f`'s commit message, is immutable; see the note below, which this row deliberately does not contradict'), and I verified the PR body does carry the disclosure. But `task.77.review-pr-in-pipeline.md:570` still ends '…orphaned colon fixed; the false claim corrected in all three artifacts'. `grep -rn 'all three artifacts'` over the task directory finds it in one line. CY7-3 as scoped (the implementation report) is closed; this is a fresh instance of the same class in the sibling artifact."
    suggested_action: "Amend the post-gate-6 Change Log row to '…the false claim corrected in the implementation report and the PR body; `741117f`'s message is immutable and keeps it by design'."
    suggested_owner: dev
    status: open
  - id: "CY8-3"
    severity: low
    file: "docs/tasks/task.77.review-pr-in-pipeline/task.77.implementation.1.review-pr-in-pipeline-initial-run.md"
    finding: "The published mutation matrix does not discriminate the new mechanism from a trivially weaker one. The implementation report puts the row-keying paragraph immediately above the matrix and offers the matrix as its proof; the PR body says 'The assertion now parses the table into rows and keys on the first cell… Proved on all four rows individually'. Executed: all four row deletions fire `expected the sub-state table to parse into at least 5 rows, got 4` — the vacuity canary, whose own message reads 'if this drops, the parse broke and every assertion below is vacuous'. The `subStateRows.find(r => r.key.includes(...))` assertion the paragraph describes is never reached by any published mutation. A guard that only counted rows and never looked at a key would produce a byte-identical matrix. IMPORTANT DIFFERENCE FROM CY6-1 AND CY7-1: the keying is NOT inert — I proved it holds with mutations that add a decoy row to hold the count at 5, and it goes red for all four values naming each one. So this is evidence weaker than the sentence it supports, not a false sentence. Recorded because it is the fourth consecutive pass in which that gap appears and a decoy row costs one line."
    suggested_action: "Replace the matrix's four deletion rows with substitution rows — 'replace row X with a decoy so the parsed count is unchanged' — which is the mutation that actually exercises the keying. Keep the plain deletions if you like, but label them as exercising the row-count canary."
    suggested_owner: dev
    status: open
  - id: "CY8-4"
    severity: low
    file: "evals/shared/tests/pr-review-loop-parity.test.mjs"
    finding: "The action-cell assertion is a mention-match, not a re-entry check, and three artifacts describe it as the latter. `a0ced9b`'s message, the implementation report and the PR body all say the guard 'requires the action cell to name where the run re-enters (5a/5b/5c, Step 7, or escalation)'. The predicate is `assert.match(row.action, /\\b5[abc]\\b|Step 7|escalat/i)`. Executed: replacing the `not reached` row's action with 'n/a — nothing to do here; see the 5c notes above' leaves 18 tests / 18 pass / 0 fail. A blank or `TBD` action IS caught (the trail's own mutation 5 holds); a meaningless one containing the token is not. Same shape as CY6-1/CY7-1 one cell further down, on a much smaller surface — hence low, not a repeat of the HIGH."
    suggested_action: "Anchor the action rather than searching it: require the cell to match `/re-enter at \\*\\*5[abc]\\*\\*|go to Step 7|escalate to Loop Escalation/`, which is the vocabulary the five real rows already use, and mutation-prove with the 'n/a — see the 5c notes above' string above."
    suggested_owner: dev
    status: open
  - id: "CY8-5"
    severity: low
    file: "evals/shared/tests/pr-review-loop-parity.test.mjs"
    finding: "Per-value resume routing can be destroyed with the suite green. Executed: merge all four enumerated values into ONE row key with one shared action — `> | \\`REQUEST CHANGES\\` / \\`review failed\\` / \\`pending — 5c not yet run\\` / \\`not reached\\` | All: re-enter at **5a** |` — and pad to five rows with four content-free decoys. Result: 18 tests / 18 pass / 0 fail. Yet `REQUEST CHANGES` no longer routes to 5b, `review failed` loses its once-only retry AND its second-consecutive escalation bound (the arm that stops an unattended driver looping forever), and `pending`/`not reached` lose their gate-conditional branch. `key.includes(value)` matches a merged key and the count canary is satisfied by the decoys. This sits OUTSIDE the sentence `a0ced9b` claims — a value named in another row's PROSE genuinely no longer satisfies the guard, which is what CY6-1 and CY7-1 were about — so it is a residual coverage gap, not a false claim. It is the strongest remaining hole in the contract's pinning."
    suggested_action: "Require exactly one row per value (`subStateRows.filter(r => r.key.includes('`'+v+'`')).length === 1`) and assert the DISTINCT action each value owes: `REQUEST CHANGES` → 5b; `review failed` → 5c plus an escalation clause; `pending`/`not reached` → the gate-conditional 5c-or-5a branch. Mutation-prove with the merged-key table above."
    suggested_owner: dev
    status: open
  - id: "CY8-6"
    severity: low
    file: "shared/resources/develop-pipeline-remaining-work-banner.md"
    finding: "CY7-7's fix pins one of the two renderings gate 7 named. Gate 7's CY7-7 named lines 59 and 116. Executed: reverting BOTH (gate 7's mutation I verbatim) is red; reverting :116 alone is red; reverting ONLY :59 — the generic `{optional short parenthetical: \"(1 cycle, PASS 100/100, PR review APPROVE)\"}` placeholder — leaves 18 tests / 18 pass / 0 fail. Minor, because :59 is the generic format illustration for every step rather than the Steps 5–6 exit specimen, and the field task 77 exists to add is pinned where it matters (:39 format line, :116 worked example, and 5c's own statement at qa-loop:816 — all three go red, verified individually)."
    suggested_action: "Either extend the existing `assert.match(banner, /QA LOOP ✅ complete \\([^)]*PR review [A-Z]+\\)/)` with a second match on the generic placeholder line, or accept it and drop :59 from the CY7-7 closure wording so the trail does not imply both are held."
    suggested_owner: dev
    status: open
  - id: "CY8-7"
    severity: low
    file: "docs/tasks/task.77.review-pr-in-pipeline/task.77.implementation.1.review-pr-in-pipeline-initial-run.md"
    finding: "An exhaustive closure claim published ahead of the verdict. PR #309 body line 44 ends 'A post-gate-7 pass closed all of it.' That is asserted before any independent verdict on the pass, and is contradicted by CY8-1 nine lines above it in the same document, where line 43 still carries the uncorrected count. The same shape appears in the task doc's Change Log post-gate-7 row ('Four trail errors corrected') — three of the four are corrected in the implementation report; CY7-4 is not corrected in the other two artifacts it was named in."
    suggested_action: "Reword to 'A post-gate-7 pass addressed all seven; its verdict, like gates 6 and 7, is not self-issued' — the same construction the report already uses correctly for the earlier passes."
    suggested_owner: dev
    status: open
  - id: "CY5-3"
    severity: low
    file: "docs/tasks/task.77.review-pr-in-pipeline/task.77.implementation.1.review-pr-in-pipeline-initial-run.md"
    finding: "CARRIED FORWARD — STILL PARTIAL, fifth consecutive assessment, but materially narrower. Its own stated close condition from gate 7 is 'Closes when CY7-3, CY7-4, CY7-5 and CY7-6 are corrected.' Verified closed: CY7-3 (in the file it named), CY7-5 (`grep -rn 'all four Steps|four Steps 5|four firing'` finds no surviving assertion of the count outside the historical gate/qa records), CY7-6 (the Completion block now names the post-gate-7 pass and its three neighbouring lines agree). NOT closed: CY7-4 (CY8-1). CY8-2 adds one fresh instance of the class. Two of the four remaining items are single-sentence edits in artifacts that are still editable."
    suggested_action: "Closes when CY8-1 and CY8-2 are corrected."
    suggested_owner: dev
    status: open

