status_reason: "Convergence stall. Cycles 1, 2 and 3 each returned 3 HIGH findings — the count has not strictly decreased, which is the condition the loop's own guard exists to detect. Nine of cycle 2's eleven closures are real; the three that are not cluster on one predicate, and two of this cycle's three HIGH findings were created by cycle 2's fix to it. Escalating rather than attempting a fourth correction."
reviewer: "QA Engineer"
