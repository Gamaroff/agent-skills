# ── PROVENANCE — why this gate is not self-issued ─────────────────────────────
# I was dispatched with NO ACCOUNT of how any of these fixes were made, and did
# not ask for one. I did not write the code, the docs, or the commits under
# review, and I have no fix here to defend. Every claim in every repo artifact —
# the a74962b and 3bbd506 commit messages, the implementation report, the PR #309
# body, the task document's Change Log and QA tables, task.77.dod.1,
# task.77.dod.2, and gates 1 through 9 — was treated as a HYPOTHESIS TO TEST by
# execution, never as evidence.
#
# This continues the rule that produced gates 5, 6, 7, 8 and 9, which itself
# existed because Step 5c's finding PC-1 was that the agent writing this task's
# code had also written the gate clearing it.
#
# WHAT I WAS TOLD, AND WHAT EXECUTION FOUND.
#
# I was told as fact that five consecutive independent gates and two DoD runs had
# each found the defect in the REPORTING rather than the pipeline change; that
# twice a defect was introduced by the very commit that closed the previous
# round's list, most recently a Change Log append-only breach anchored on a
# non-unique row prefix; and to attack the claims and the trail's internal
# consistency hardest.
#
# I did. On the claims, the trail holds. Twenty-nine trail-asserted proofs
# re-executed and not one failed. Every one of a74962b's five claims is true, and
# I verified each by reading disk or by running the command, never by reading the
# closure sentence. The Change Log reorder is real: `git show -U6 3bbd506` shows
# the two gate-9 rows inserted ABOVE the DoD row and the post-gate-8 row, and
# a74962b moves them below into true chronological order. dod.2's security
# number, which I could have taken on trust, I re-derived from scratch — checking
# STDERR and not $?, per the methodology trap dod.2 itself documents — and got
# the identical 25-file set on both sides of the diff.
#
# On internal consistency I found four LOW lapses, one of them (CY10-2) created
# by the commit under review: the §7 row that recorded the CIRCULAR triage dod.2
# diagnosed was left standing while the underlying files were fixed. That is the
# third time a closure commit has falsified a neighbouring row, and it is why
# this gate names the class rather than only the instance.
#
# THE FINDING THAT DECIDES THIS GATE was not available to gate 9. I built the
# mutations the published set would miss, as instructed, and pointed them at the
# VERDICT-BRANCHING table rather than the resume sub-state table where all 44 of
# gate 9's mutations landed. Four of five destination inversions of the routing
# arm this task exists to add are GREEN — including REQUEST CHANGES exiting to
# Step 7, which turns the blocking arm into a clean exit. The guard's own message
# claims the property it does not test. It is a mention-match standing in for a
# mapping: the same class as CY6-1, CY7-1, CY8-4 and CY9-3, at its fifth instance
# across four rewrites of this guard family, and the first one on the primary
# routing table.
#
# I record plainly that the reporting-defect pattern DID largely break here, and
# that grading CONCERNS on a MEDIUM I found myself is not a fifth strike against
# the trail. Forty-seven mutations were executed against this branch. The change
# is sound; the guard protecting it is not yet as strong as its own message says.
# ──────────────────────────────────────────────────────────────────────────────

top_issues:
  - id: "CY10-1"
    severity: medium
    file: "evals/shared/tests/pr-review-loop-parity.test.mjs"
    finding: "Per-verdict DESTINATION is unasserted in the verdict-branching table, so four of five inversions of the routing arm this task exists to add stay green. The guard at :137-152 matches the row with /\\|[^|\\n]*REQUEST CHANGES[^|\\n]*\\|[^|\\n]*5b[^|\\n]*\\|/, and the row's own explanatory clause — 'Do not increment the counter here — 5b's step 7 increments it on exit' — supplies the 5b the regex wants. Executed, all 18 tests / 18 pass / 0 fail on each of: (33) REQUEST CHANGES rewritten to 'Return to **5a**'; (34) REQUEST CHANGES rewritten to 'Exit the loop and proceed to Step 7', which turns the loop's only blocking arm into a clean exit; (35) APPROVE rewritten to 'proceed to Step 5a', inverting the loop's exit; (36) the failure row's '**HALT**' rewritten to '**proceed to Step 7**', the outcome the doc itself calls 'the one that must never happen'. Only the CONCERNS row's destination is caught. This is MEDIUM rather than LOW — the band gate 9 gave the analogous CY9-3 — on two grounds CY9-3 explicitly did not meet. First, the assertion's own message reads 'the REQUEST CHANGES table ROW must route back to 5b — not merely prose mentioning both', naming a property it does not test; CY9-3 was LOW precisely because 8293765 claimed only 'a verb AND a destination', which is what it tested. Second, the file's header comment at :10 and :61-62 sells this exact failure mode as one the current version closes — 'a regex like /REQUEST CHANGES.*5b/s matched prose there and would have passed even if the verdict table said the opposite'. It still would; the fix moved the decoy from the section into the row. A second instance of the same class: swapping the '# standard mode' and '# lite mode' labels so lite gets --effort medium and standard gets --effort low is also GREEN (mutation 45), because :300-304 asserts both strings appear in §5c and never which mode owns which — and §9's ticked criterion 'Lite mode degrades to --effort low and never skips' rests on it. NOT a runtime defect: the prose on disk is correct and the pipeline behaves as specified today. Gate 9's 44 mutations could not have found this — every one of them targeted the resume contract, the banner or the exit line."
    suggested_action: "Add a per-verdict expected-destination map beside the row match, keyed on the row's FIRST destination token rather than any 5b anywhere in the cell: `REQUEST CHANGES` → the action must OPEN with /^Return to \\*\\*5b\\*\\*/; `APPROVE` and `CONCERNS` → must contain /Step 7/ and must NOT contain /re-enter|Return to/; the failure row → must contain /\\bHALT\\b/. Mutation-prove with mutations 33, 34, 35 and 36, all green today. Do the same for the effort→mode mapping: assert the `# standard mode` comment is immediately followed by `--effort medium --comment` and `# lite mode` by `--effort low --comment` (mutation 45). Roughly thirty lines. Then stop widening regexes and enforce the generalisation mechanically — this is the fifth instance of a mention-match standing in for a mapping across four rewrites of this guard family, and a sixth regex will produce a sixth instance."
    suggested_owner: dev
    status: open
  - id: "CY10-2"
    severity: low
    file: "docs/tasks/task.77.review-pr-in-pipeline/task.77.review-pr-in-pipeline.md"
    finding: "§7 item 12 is false on disk, and the commit under review is what made it false. Line 349-350, under the heading 'Files Regenerated (commit them — CI checks freshness)', still reads: '12. ⬜ `docs/reference/skill-catalog.md` — **no change required**: no `description:` field changed, so `npm run generate-catalog` is a no-op and the file is absent from the diff'. All three clauses are false at a74962b: `git diff --name-only origin/develop...HEAD -- docs/reference/skill-catalog.md` returns the file; two `description:` fields changed on the branch (develop-story, develop-task); and generate-catalog was not a no-op — a74962b rewrites two catalog rows. dod.2 diagnosed the underlying triage as CIRCULAR in its own words ('the catalog was clean only because the stale source was never touched'), fixed the sources and regenerated the catalog — and left standing the §7 row that recorded that circular triage. The current wording was itself introduced deliberately in QA cycle 5 as finding PC-7's fix ('§7 item 12 corrected to \"no change required\"'), so it is a tracked row, not boilerplate. Same shape as gate 9's CY9-1 — a table row vouching for something the same branch reversed — and precedent exists for holding §7 rows to disk truth: DoD run 1's gap 5 was §7 item 16. LOW rather than MEDIUM because no §9 success criterion cites §7, and because the regeneration itself is machine-guarded by tests/skill-frontmatter.test.js:181, which regenerates the catalog and diffs it on every CI run."
    suggested_action: "One line: `12. ✅ docs/reference/skill-catalog.md — regenerated in the dod.2 pass: both orchestrator descriptions changed, so generate-catalog is no longer a no-op. (The earlier \"no change required\" was circular — see dod.2.)` Keep the disclosure rather than silently ticking the box, the way the implementation report's ruled-out table now handles its two reversed rows."
    suggested_owner: dev
    status: open
  - id: "CY10-3"
    severity: low
    file: "docs/tasks/task.77.review-pr-in-pipeline/task.77.implementation.1.review-pr-in-pipeline-initial-run.md"
    finding: "The implementation report's `## Completion` block is stale in five places, four of them contradicted by the commit under review. :659 reads '**DoD Summary**: not yet — Step 7 has not run', but /finalise has run TWICE — dod.1 and dod.2 are both on disk and the task doc's own Change Log carries two rows authored `finalise`. :655 reads '**Final Status**: … `dod.2` and a gate 10 outstanding', and dod.2 was committed by this very commit. :654 reads '**Finished**: … gates 5–8 remediated', omitting the gate-9 remediation 3bbd506 performed. :660 is an unfilled template placeholder, '**Tracker debt**: {populated after Step 7}', which dod.2 already resolved as 'no github_issue / jira_key — NOT_APPLICABLE'. :658 enumerates '4 post-escalation remediation passes, each graded independently (gate 6 FAIL 75, gate 7 FAIL 78, gate 8 CONCERNS 87)' — four passes, three gates, gate 9 missing from a parenthetical that claims to enumerate them. Same class as gate 9's CY9-2 (a present-tense status field contradicted by disk) in the sibling artifact, and the post-dod.2 pass did not sweep it. EXPLICITLY NOT A FINDING, checked before raising: the Pipeline Progress table's ⏳ on Steps 5–6, 7 and 8 is CORRECT — the loop escalated and neither DoD run accepted, and develop-pipeline-step-7-finalise.md:384 requires the row to stay ⏳ until every checklist item passes."
    suggested_action: "Five single-line edits in one file, in the same pass as CY10-2: 'gates 5–9 remediated'; 'Final Status: In Progress — gate 10 CONCERNS (90); dod.3 outstanding'; add 'gate 9 CONCERNS 91' to the QA Iterations parenthetical; 'DoD Summary: two runs, neither accepted — dod.1 (8 gaps) and dod.2 (blocked on the gate precondition)'; 'Tracker debt: none — no github_issue / jira_key, so issue close and board move are NOT_APPLICABLE'."
    suggested_owner: dev
    status: open
  - id: "CY10-4"
    severity: low
    file: "docs/tasks/task.88.resume-guard-strength/task.88.resume-guard-strength.md"
    finding: "CY9-3 is carried to nowhere, and the only place it could live says it is already done. The implementation report's post-gate-9 table ends CY9-3's row with 'Filing this rather than widening the guard again inside an escalated run' — but nothing was filed: docs/tasks/task-registry.md still reads 'Next Available Task Number: 89' and there is no task.89.*. The natural home is task 88, and task.88.resume-guard-strength.md:27 reads 'All three are fixed and mutation-proved there' with :32 adding 'do not implement it — it is already done.' That is false for CY8-5's second half. Task 88's own §2 at :63 states CY8-5 as 'Each value having a row is asserted; each value having *its own* row, with *its own* action, is not' — and only the first half was built. Verified by execution: inverting the REQUEST CHANGES resume action to 5c, the APPROVE/CONCERNS exit arm to 5a, and the `review failed` escalation bound all leave the suite at 18/18 (mutations 30-32, reproducing gate 9's 23, 27 and 28). A future reader following task 88's instruction skips work that is demonstrably outstanding — and CY10-1 has now widened the same gap onto the verdict table. LOW because the residual IS disclosed in gate 9 and in the implementation report's own row; what is missing is an owner."
    suggested_action: "Either file one task carrying CY9-3 AND CY10-1 together (they are the same defect on two tables and should be fixed in one pass), or amend task 88's '## 0. Superseded' section to name the residual precisely: 'CY8-3 and CY8-4 are closed inside task 77; CY8-5's *distinct action per value* half is NOT — see gate 9's CY9-3 and gate 10's CY10-1.' Do not leave 'do not implement it — it is already done' standing over an open gap."
