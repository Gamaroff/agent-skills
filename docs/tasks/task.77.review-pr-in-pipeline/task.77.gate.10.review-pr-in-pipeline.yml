    status: PASS
    notes: "Held at PASS. The pipeline contract on disk is correct on every arm I inverted, and thirteen of my twenty-two novel mutations were caught — including every wholesale row swap, the advisory-contract inversion, the ready-for-merge-on-REQUEST-CHANGES leak, deleting the failure row, and turning the shared budget into an additional one. The resume sub-state mechanism gate 8's CY8-3 attacked is genuinely fixed: a single-row deletion falls through to the keying and fails by name, exactly-one holds against deletion AND duplication, and both of gate 8's own green mutations are red. What is residual is GUARD STRENGTH, not behaviour: per-verdict destination is unasserted on the verdict-branching table (CY10-1, mutations 33-36) and per-value destination on the resume table (CY9-3, mutations 30-32), so the routing can be rewritten with the suite green. No runtime defect, no regression, and nothing introduced by this branch."
  maintainability:
    status: CONCERNS
    notes: "Held at CONCERNS, and for a different reason than at any previous gate — which is worth stating precisely, because five gates in a row held it for the same one. What improved genuinely and is not a repeat: every one of gate 9's PASS conditions was met and verified on disk rather than read off a closure sentence; all five of a74962b's claims are true; twenty-nine trail-asserted proofs re-executed and none failed; dod.2's security number reproduced exactly; dod.1 is byte-unchanged; and the Change Log breach 3bbd506 introduced was disclosed and correctly reordered rather than quietly fixed. The trail's HONESTY is not what holds this back. What does is (a) CY10-1, a MEDIUM in which a guard's own assertion message names a property it does not test — the fifth instance of a mention-match standing in for a mapping across four rewrites of this guard family, and the first on the primary routing table rather than the resume one; and (b) four LOW currency lapses across four documents, one of them (CY10-2) created by the commit under review, which makes it the third time a closure commit has falsified a neighbouring row. Eighth consecutive assessment in which an artifact a reviewer reads to check closure contains a statement disk contradicts — but for the third time running the CODE claim survives, and this time the statements are inventory rows and a status footer, not false proofs."

