# ── PROVENANCE — why this gate is not self-issued ─────────────────────────────
# I was dispatched with NO ACCOUNT of how any of these fixes were made, and did
# not ask for one. I did not write the code, the docs, or the commit under
# review. Every claim in every repo artifact — commit message 741117f, the
# implementation report's closure tables, the PR #309 body's mutation-proof
# table — was treated as a HYPOTHESIS TO TEST by execution, never as evidence.
#
# This continues the rule that produced gate 5, which itself existed because
# Step 5c's finding PC-1 was that the agent writing this task's code had also
# written the gate clearing it. That rule applies to the remediation of gate 5
# unchanged, and applies to this gate: I made no fixes here and have none to
# defend.
#
# WHAT EXECUTION CAUGHT THAT READING WOULD NOT: the trail claims, in three
# places, that deleting the `pending — 5c not yet run` row from the resume
# sub-state table turns the parity suite red. I deleted that row: 17/17 green.
# I then deleted the ENTIRE four-row table the test's own message names:
# 17/17 green. The guard is pre-satisfied by prose the same commit added
# elsewhere in the file, so it certifies the gap it was written to prevent —
# which is verbatim what gate 5's CY5-4 said before the remediation.
#
# Three of the other four mutation claims were re-executed and HOLD; the fifth
# is honestly recorded as not holding. The trail is not uniformly unreliable,
# which is what makes the one false row consequential rather than noise.
# ──────────────────────────────────────────────────────────────────────────────

