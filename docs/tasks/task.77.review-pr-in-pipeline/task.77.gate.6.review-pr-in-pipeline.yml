    suggested_action: "Assert against the sub-state table slice specifically — sectionBetween() on the table's markers, then includes(v) within that slice — or assert the row shape (/^> \\| `pending — 5c not yet run` \\|/m). Re-run the mutation, then correct the claim in the implementation report, the PR body, and (by amend or a follow-up note) the commit trail."
