waiver:
  active: true
  reason: >-
    Seven consecutive independent gates since Loop Escalation (5 FAIL 70, 6 FAIL 75, 7 FAIL 78,
    8 CONCERNS 87, 9 CONCERNS 91, 10 CONCERNS 90, 11 CONCERNS 90) and two DoD runs, none reaching
    PASS. Every finding across all of them has been in the artifact trail or in test strength.
    NONE has been a defect in pipeline behaviour: gate 11's own words are "every routing arm on
    disk is correct", and gates 8 through 11 each confirmed the change itself sound. Roughly half
    of what each gate found was staleness created by the previous remediation pass — a
    hand-maintained trail cannot converge against an evidence set that grows with every review,
    which makes further laps a poor use of the operator's budget rather than a path to a clean
    verdict. The operator was given three options (waive and finalise; one more gate; stop and hand
    back) together with an explicit statement that a further gate might well pass under the repo's
    own severity rule, and chose to waive.
    NOTE ON THIS FILE'S OWN HISTORY: its first draft claimed gate 11's five findings were all
    closed, and waived a LOW-only residual. dod.3 falsified both — CY11-4 was only partially
    closed, and the observed base rate includes MEDIUMs. Both are corrected below, before issue.
    This file is therefore itself an instance of the trail-currency pattern it waives.
  approver: "Operator (repository owner), 2026-09-04, in session"
  scope: >-
    Waives the standing likelihood that a further independent review finds more trail-currency or
    test-strength defects. STATED HONESTLY, because the first draft understated it and dod.3's
    compliance reviewer said so: the observed base rate is NOT low-severity-only. A MEDIUM was
    found by three of the last four independent gates — gate 8's residual, gate 10's CY10-1 and
    gate 11's CY11-1 — and CY11-1 sat inside the very commit that closed CY10-1. This waiver
    therefore covers LOW **and MEDIUM** findings of that class, which is what the evidence
    predicts, rather than the LOW-only residual first claimed.
    Does NOT waive any OPEN defect: gate 11's CY11-1, CY11-2, CY11-3 and CY11-5 were closed in
    18dd5b5, and CY11-4 — which that commit only partially closed — was closed before this waiver
    was issued. Does NOT waive anything in pipeline behaviour, security, or CI, all green and
    independently verified, with gate 11's finding that "every routing arm on disk is correct".
    If a future review finds a HIGH, or any defect in routing behaviour, this waiver does not
    cover it.

