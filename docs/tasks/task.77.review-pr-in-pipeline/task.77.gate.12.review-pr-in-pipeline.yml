status_reason: "OPERATOR WAIVER over the residual, recorded at commit 18dd5b5. This is NOT an independent assessment and must not be read as one — see PROVENANCE. The last independent grade is gate 11 (CONCERNS, 90), and it stands unaltered on disk; this gate does not re-grade it, dispute it, or improve on its score. What it does is exercise the one authority a reviewer does not have: deciding that a known residual is acceptable. Gate 11's five findings (CY11-1 MEDIUM, CY11-2..5 LOW) are all closed in commit 18dd5b5 and mutation-proved — the six mutations gate 11 found green are now red, control restores byte-identically at 22/22. The residual being waived is therefore not a list of open defects; it is the standing probability, evidenced by seven consecutive post-escalation gates, that an eighth independent review would find further LOW-severity trail-currency or test-strength items. That probability is high and the operator has judged it not worth further laps."
reviewer: "Operator waiver — authored by the fixing agent on the operator's explicit instruction. NOT an independent review."
updated: "2026-09-04T00:00:00Z"

# ── PROVENANCE — read this before treating this file as a gate ────────────────
# Gates 5 through 11 were each written by an independent reviewer dispatched
# with no account of how the fixes were made. THIS FILE IS NOT ONE OF THOSE.
# It was written by the agent that made the fixes, which is precisely the thing
# Step 5c's finding PC-1 identified as illegitimate and which every gate since
# has been structured to prevent.
#
# It is legitimate here for one reason only: a WAIVER IS NOT A GRADE. Grading
# one's own work substitutes the maker's judgement for a reviewer's. A waiver
# does the opposite — it ACCEPTS the reviewer's verdict as given and records a
# human decision to proceed in spite of it. The lifecycle
# (shared/resources/document-status-lifecycle.md:62) admits exactly two routes
# to `accepted`: a gate reading PASS, or one reading WAIVED. No PASS was ever
# earned across seven attempts, so this is the other route, taken deliberately
# and on the operator's authority rather than the agent's.
#
# The distinction is load-bearing, so it is stated plainly: NOTHING in this file
# should be cited as evidence that the work is good. The evidence for that lives
# in gates 5-11 and in dod.1/dod.2, all of which remain on disk unedited,
# including the four that read FAIL.
# ─────────────────────────────────────────────────────────────────────────────

