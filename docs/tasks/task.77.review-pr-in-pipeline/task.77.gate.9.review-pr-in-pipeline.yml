task_title: "Run the PR conformance review before a work item is finalised"
gate: CONCERNS
status_reason: "Grades the POST-GATE-8 PASS (commit 8293765) — DoD gaps 2-8 plus gate 8's CY8-3/4/5 residual — NOT a QA cycle. The 5-cycle budget was spent at gate 5; Loop Escalation stands and a fourth remediation pass does not restore it. This is the first pass in five whose published mutation matrix is exactly as strong as the sentence above it. All six published rows executed: every one fires the assertion the matrix names, and the four row-deletions each name their own value on the keying assertion at pr-review-loop-parity.test.mjs:596 — the `subStateRows.length >= 5` canary that made gate 8's CY8-3 available is gone, replaced by a well-formedness check, so a deletion falls through to the keying. CY8-4 and CY8-5 are closed against gate 8's own mutations 20 and 21 verbatim, both green then and red now. Ten further trail-asserted proofs from across the whole task re-execute correctly, including the one the trail honestly records as NOT holding. Gap 3's re-derivation is exact — one named plus seven found, eight rows across five files — and its surviving hit (task.41's own task document) is covered by a named category exclusion. Both halves of gap 8's out-of-scope admission verified: the `<fastGateCommand>` block fails under bash AND zsh, is byte-identical on origin/develop, and is untouched by this branch; the other 15 of 16 blocks parse under both. Execution green everywhere measurable: npm run ci exit 0, 2285 tests / 0 fail, no qa-execute-snippets flake; parity 18/18; lock 14/14 under bash AND zsh; 4/4 PR checks on head SHA 8293765 == local HEAD; 45/45 bundled copies content-identical at branch scope, and the branch NET-REDUCES repo-wide staleness from 8 to 4. It is not a PASS because two rows of the implementation report's `consciously ruled out` table still vouch for exclusions this same branch reversed (CY9-1), and the status header defers the residual to a task the same commit cancelled (CY9-2). Both are single-line edits in one file. Two further LOW residuals: per-value DESTINATION is still unasserted, so seven inversions of the resume contract stay green (CY9-3), and three counts under the section gap 7 refreshed are stale (CY9-4). No HIGH, no MEDIUM, nothing a runtime risk."
reviewer: "QA Engineer (independent subagent — see provenance below)"
updated: "2026-09-03T00:00:00Z"

# ── PROVENANCE — why this gate is not self-issued ─────────────────────────────
# I was dispatched with NO ACCOUNT of how any of these fixes were made, and did
# not ask for one. I did not write the code, the docs, or the commit under
# review, and I have no fix here to defend. Every claim in every repo artifact —
# the 8293765 commit message and its mutation matrix, the implementation
# report's post-gate-8 section, the PR #309 body, the task doc's Change Log,
# task.77.dod.1, and gates 5 through 8 — was treated as a HYPOTHESIS TO TEST by
# execution, never as evidence.
#
# This continues the rule that produced gates 5, 6, 7 and 8, which itself
# existed because Step 5c's finding PC-1 was that the agent writing this task's
# code had also written the gate clearing it.
#
# WHAT I WAS TOLD, AND WHAT EXECUTION FOUND.
#
# I was told as fact that this branch has failed four consecutive independent
# gates, that every time the defect was in the REPORTING rather than the
# pipeline change, that a mutation proof had been published three times and was
# weaker than its claim twice, and that gate 8's CY8-3 was exactly "the
# published matrix does not discriminate the mechanism it cites". I was told to
# attack the claims, and the matrix hardest.
#
# I did. The matrix holds. All six published rows were executed with the
# assertion message captured, not just the exit code, because "red" alone cannot
# distinguish the keying from the canary. Four row-deletions fire
# `expected exactly ONE sub-state row keyed on PR Review = "<value>", found 0`;
# the merged-key row fires the one-row-per-value assertion; the verb-less action
# fires the action-verb assertion. The mechanism was REPLACED, not narrowed a
# fifth time, and the replacement is what the matrix says it is.
#
# I then built the mutations the published set would miss, as instructed: a key
# with a plausible-but-wrong action, two actions swapped between rows, a right
# key naming the wrong destination, four backtick/whitespace forms of a key, the
# table moved, and the blockquote markers stripped. Twenty-one of my own devising,
# on top of twenty-three asserted or recorded somewhere in this trail and
# re-executed from across the entire task. Seven came back GREEN and are CY9-3 —
# all of them on the same axis: the guard is strong on WHICH values own a row and
# silent on WHAT each row's action says.
#
# I executed 44 mutations in total — 44 distinct edits, listed below as 38 rows
# because a few rows bundle the variants of one edit. One of the 44 (removing
# `, PR review {verdict}` from qa-loop:301 rather than :827) was a MIS-TARGET of
# gate 8's mutation 27; it is reported as mutation 42, its correct form as 16,
# and the mis-target is kept in the record rather than deleted because it found
# the unpinned third rendering. NOT ONE trail-asserted proof failed. The two
# findings I raise are stale sentences in tables — not false proofs, and not
# overstated closures. Four FAILs is not a reason to find a fifth. On the axis
# this branch has been failing on, the trail is now honest, and this gate says so
# plainly.
# ──────────────────────────────────────────────────────────────────────────────

