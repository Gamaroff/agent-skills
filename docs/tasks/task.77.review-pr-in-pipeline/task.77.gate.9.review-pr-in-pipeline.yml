  - id: "CY9-2"
    severity: low
    file: "docs/tasks/task.77.review-pr-in-pipeline/task.77.review-pr-in-pipeline.md"
    finding: "The status header defers the residual to a task the same commit cancelled. `task.77.review-pr-in-pipeline.md:517`, written BY 8293765, reads '**Gate Decision**: CONCERNS — residual deferred to task 88; acceptance needs a PASS/WAIVED gate or a recorded waiver', and the §QA Artifacts gate-8 row at :539 ends 'Residual → task 88'. The same commit sets task.88 `status: cancelled`, gives it a `## 0. Superseded` section, updates its registry row to 'superseded, closed inside 77', and closes CY8-3/4/5 here. §QA Testing Results is the field a reader consults for CURRENT status; it now defers work to a cancelled follow-up that this very commit performed. The :539 row is defensible as historical narrative of what gate 8 recommended; :517 is not — it is a present-tense status assertion, and gap 7 existed precisely because that header had gone stale before."
    suggested_action: "Edit :517 to '**Gate Decision**: CONCERNS — residual closed in the post-gate-8 pass (task 88 superseded); acceptance needs a PASS/WAIVED gate or a recorded waiver.' Optionally append '(later superseded — closed inside 77)' to :539 so the artifacts table does not read as a live pointer either."
    suggested_owner: dev
    status: open
  - id: "CY9-3"
    severity: low
    file: "evals/shared/tests/pr-review-loop-parity.test.mjs"
    finding: "Per-value DESTINATION is still unasserted, so seven inversions of the resume contract stay green. The rewritten guard requires each enumerated value to own exactly one row and that row's action to contain a verb AND a destination — it does not check the destination is the RIGHT one. Executed, all 18 tests / 18 pass / 0 fail: (A1) `REQUEST CHANGES` routed to 5c instead of 5b; (A2) the actions of `REQUEST CHANGES` and `review failed` SWAPPED; (A3) `not reached` routed unconditionally to Step 7, inverting the gate-conditional arm; (A4) an action reading 'no escalation needed; proceed to reading the 5c notes above' — verb and destination both present, meaning absent; (A5) the EXIT arm itself inverted, `APPROVE`/`CONCERNS` → 're-enter at **5a**'; (A6) `review failed` losing its once-only retry AND the second-consecutive escalation bound, the arm that stops an unattended driver looping forever; (A7) `pending` losing its PASS/WAIVED → 5c branch. This is NOT a false claim: 8293765 says only 'an action VERB and a DESTINATION', which is exactly what is asserted, and gate 8's CY8-5 finding — the merged-key table with decoy padding — is genuinely RED now (mutation T5, gate 8's mutation 21 verbatim). But gate 8's CY8-5 suggested_action asked for TWO things, exactly-one-row-per-value AND 'the DISTINCT action each value owes', and only the first was built. The harm CY8-5 described remains reachable by a slightly different route."
    suggested_action: "Add a per-value expected-destination map alongside the existing verb check — `REQUEST CHANGES` → /\\b5b\\b/; `review failed` → /\\b5c\\b/ AND /escalat/i; `pending — 5c not yet run` and `not reached` → both /\\b5c\\b/ and /\\b5a\\b/ (the gate-conditional branch); `APPROVE`/`CONCERNS` → /Step 7/. Mutation-prove with A1 (wrong destination), A2 (swapped actions) and A6 (dropped escalation bound), all of which are green today."
    suggested_owner: dev
    status: open
  - id: "CY9-4"
    severity: low
    file: "docs/tasks/task.77.review-pr-in-pipeline/task.77.review-pr-in-pipeline.md"
    finding: "Three stale lines survive inside the section gap 7 refreshed. 8293765 moved the §QA Testing Results header from gate 4/5 to gate 8, but the §Test Coverage Summary three lines below was not swept with it. :543 reads '**Tests Executed**: 17 parity tests (none vacuous)' — the suite is 18, and the task doc's own Change Log row for the post-gate-7 pass says 'suite now 18'. :545 reads '**Critical Issues**: 0 open HIGH in gate 4'. :546 reads '**NFR Status** (gate 5, independent): … Maintainability FAIL', where gate 8 records Maintainability CONCERNS. Same class as gap 7, in the adjacent subsection, missed because gap 7's finding cited a line range that stopped at :517."
