    severity: low
    file: "docs/tasks/task.77.review-pr-in-pipeline/task.77.implementation.1.review-pr-in-pipeline-initial-run.md"
    finding: "The `Phase 6 — files consciously ruled out` table still vouches for two exclusions this same branch reversed. Lines 150-151 are unchanged by 87e5bf9 and 8293765 and still read `docs/reference/configuration.md`, `tracker-workflow.md`, … | '…`ready-for-merge` semantics are unchanged (same stage, same off-by-default, only its firing point moved)' and `docs/concepts/architecture.md`, … | 'Checked line by line: no pipeline-shape restatement that 5c invalidates.' All three files were edited by 8293765 BECAUSE those exclusions were wrong: DoD gap 2 quoted :151 verbatim as 'contradicted' and gap 3 called :150's rationale 'self-refuting'. That table is the evidence artifact for an ACCEPTANCE-GATING criterion — task doc :455, 'The re-derivation greps return no un-triaged hit; ruled-out hits are named in the implementation report', ticked [x] — so a reader checking the sweep's scope is told these files were correctly excluded. LOW rather than MEDIUM because the reversal IS disclosed, unambiguously, in the same document's post-gate-8 gap table (rows 2 and 3), and no closure is asserted over the stale rows. But the report's own convention — row 492, which gate 8 singled out as the right way to do this — is to reconcile such a row IN PLACE, and that was not done."
