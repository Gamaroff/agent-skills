    file: 'skills/finalise/SKILL.md'
    finding: 'Step 8a.4 (fix-and-recheck) re-runs "the engine command the agent recorded"; under the new contract the agent records no command, so the step names a command that does not exist. Bug: task.189.bug.1.'
