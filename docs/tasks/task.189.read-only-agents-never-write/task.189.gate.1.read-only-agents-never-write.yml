    severity: medium
    file: 'shared/resources/security-probe-plan.mjs'
    finding: 'The runner drops the engine escapes[] (a probe that wrote outside its sandbox), and Step 3b.1 reads no escape field, so an escape reaches the DoD as a clean run. Bug: task.189.bug.2.'
    suggested_action: 'Carry escapes into runs[] and a top-level field; Step 3b.1 adds a FAIL check when non-empty; pin with a fixture test.'
    suggested_owner: dev
    status: open
  - id: 'QA-1'
    severity: medium
    file: 'shared/resources/security-probe-plan.mjs'
    finding: 'ownedFlagIn returns the offending flag (truthy) for a refused entry and null for an allowed one, so the probe engine reads every refusal as acceptance; the owned-flag boundary has no engine probe and finalise would hit the zero-guard on it. Bug: task.189.bug.3.'
    suggested_action: 'Export an accept-shaped predicate (argv when allowed, null when refused) and add each owned flag and its --flag=value form as fixture cases.'
    suggested_owner: dev
    status: open
  - id: 'QA-2'
    severity: low
    file: 'shared/resources/develop-pipeline-step-5-6-qa-loop.md'
    finding: 'The matrix write block runs mkdir -p before the non-empty check, so an empty marked block prints the warning and writes no matrix but leaves an empty .summaries directory (engine fence probe: t189.matrix.empty-block reproduced, 1 of 6 hostile).'
    suggested_action: 'Write the temp file outside the doc directory (or create the directory only after the non-empty check).'
    suggested_owner: dev
    status: open

