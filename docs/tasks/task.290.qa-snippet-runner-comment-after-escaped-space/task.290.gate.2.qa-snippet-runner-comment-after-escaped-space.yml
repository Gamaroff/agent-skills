task_title: 'QA snippet runner reads a # after an escaped space as a comment'
gate: FAIL
status_reason: 'T290-QA-1 is fixed, but the same backslash class still has one more member: commandInvocations joins a line ending in any run of backslashes to the next, so an even run (`echo a\\` then `touch out`) hides the write and classifies runnable.'
reviewer: 'QA Engineer'
