top_issues:
  - id: 'T290-QA-2'
    severity: high
    file: 'shared/resources/qa-execute-snippets.mjs'
    finding: 'commandInvocations joins a backslash-newline with `.replace(/\\\n/g, " ")`, which matches the last backslash of any run, so an EVEN run (an escaped backslash, then a real newline) is also joined. `echo a\\` followed by a newline and `touch out` classifies runnable, and bash creates out. A random-combination probe (40000 blocks, a writer on the next line) found 165 such writes and every one was this shape; none came from any other shape. Identical on develop; the task is about the scanners agreeing with bash on backslashes, and cycle 1 fixed the odd-run half in stripProse.'
    suggested_action: 'Join only an odd run: replace with a pattern that keeps the preceding pairs, for example `.replace(/(?<!\\)((?:\\\\)*)\\\n/g, "$1 ")`, so an even run leaves the newline as a command separator. Add gap rows (`echo a\\\\` + newline + `touch out`, and a four-backslash form), a control for a real odd continuation, and a differential context for each; re-run the docs scan.'
    suggested_owner: dev
    status: open

