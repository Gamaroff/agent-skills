task_title: 'QA snippet runner reads a # after an escaped space as a comment'
gate: FAIL
status_reason: 'T290-QA-2 is fixed, but startsComment and the old line scan test the previous character with a regex whitespace class that includes CR, FF, VT and Unicode spaces, none of which are blanks to bash, so `echo a<CR># ; touch out` classifies runnable and writes.'
reviewer: 'QA Engineer'
head: '4223cfac3ccd7aa30d2d042c82f4b09503e18f06'
updated: '2026-11-09T20:31:00Z'

top_issues:
  - id: 'T290-QA-3'
    severity: high
    file: 'shared/resources/qa-execute-snippets.mjs'
    finding: 'startsComment tests the character before a `#` with `/[\s;&|(]/`. In JavaScript `\s` also matches CR, form feed, vertical tab, NBSP and U+2028, which bash does not treat as word separators, so the `#` there is mid-word and `; touch out` runs. `echo a` + CR + `# ; touch out` (and the FF, VT, NBSP and U+2028 forms) classify runnable and bash creates out; a space or tab before the `#` is a real comment and writes nothing. Found by a random differential with CR and tab atoms (2 hits in 80000). Identical on develop (the old line scan used `\s` too).'
    suggested_action: 'Replace the class with the blanks bash uses: a space, a tab, a newline, or one of `;` `&` `|` `(`, for example `/[ \t\n;&|(]/`. Add gap rows for CR, FF, VT, NBSP and U+2028 before a `#`, keep the space and tab controls, add differential contexts, and re-run the docs scan.'
    suggested_owner: dev
    status: open

