top_issues:
  - id: 'T290-QA-1'
    severity: high
    file: 'shared/resources/qa-execute-snippets.mjs'
    finding: 'stripCommentQuoteAware does not read a backslash outside quotes, so the comment scan still disagrees with bash. (a) `echo \''a'' # ; touch out'' ; touch out2` has an escaped quote that bash treats as a literal, but the scan opens a single quote there, closes it at the next quote, then strips `# ; touch out'' ; touch out2` as a comment: classifies runnable, bash creates out2. (b) `echo a\<newline># ; touch out`: bash joins the lines, so `a#` is mid-word and `touch out` runs; the per-line scan sees a `#` at column 0 and strips it: classifies runnable, bash creates out. Both are identical on develop. The task lists "Handle a backslash outside quotes in stripNonCode" in scope; the implementation dropped it because a plain skip made one doc block newly runnable, and the differential generator has no escaped-quote or continuation context so it cannot see either.'
    suggested_action: 'Fail closed instead of skipping: when the scan meets a backslash outside quotes that is followed by a quote character or a newline, refuse the line or block (mutating, unparseable) rather than guess. Add both reproductions as gap rows, add escaped-quote and backslash-newline contexts to the differential generator, and re-run the docs scan against develop (must stay 0 newly runnable; a newly refused block must be listed).'
    suggested_owner: dev
    status: open

