schema: 1
task: 'task.46.relative-doc-links-and-fence-aware-sections'
task_title: 'Write relative document links, and stop a fenced `# ` truncating a Jira description'
gate: CONCERNS
status_reason: 'Both defects are fixed correctly and fully covered — no correctness bugs found. Gated on two maintainability issues: 96% of the two largest script diffs is an undeclared Prettier reformat that hides the 62 functional lines inside it, and an inline copy of the defective extraction regex survives unfixed in jira-epic-creator under a comment instructing maintainers to keep it in step with the canonical one.'
reviewer: 'QA Engineer'
updated: '2026-08-14T05:35:00Z'

top_issues:
  - id: TASK-46-BUG-1
    issue: 'Undeclared wholesale Prettier reformat inflates the diff ~5x and hides the functional change'
    severity: medium
    finding: >-
      sync-jira-task.js changes 647 lines of which 27 are functional (96% reformatting);
      sync-jira-story.js changes 788 of which 35 are functional (96%). Measured by
      normalising both sides of the diff with prettier@3 and re-diffing. The repo has no
      .prettierrc, no format script, and no format step in .githooks/pre-commit, so the
      reformat is neither enforced nor reproducible by the next editor of these files.
    suggested_action: >-
      Either split the reformat into its own commit ahead of the functional one so the PR
      diff reads, or declare it in the task Scope and add a prettier config + format script
      so the formatting is repo policy rather than one author's editor.
    suggested_owner: dev
  - id: TASK-46-BUG-2
    issue: 'The same fence-truncation regex survives unfixed in jira-epic-creator'
    severity: medium
    finding: >-
      skills/jira-epic-creator/scripts/jira-create-epic.js:120-122 carries an inline copy of
      the section-extraction pattern with the identical `(?=\n## |\n# |$)` lookahead, so a
      `# ` at column 0 inside a fenced block in an epic's Stories Breakdown truncates it the
      same silent way. The comment above it (lines 109-119) instructs maintainers that the
      pattern "must stay in step with the canonical one" — this change moves the canonical
      one and leaves the copy behind without updating that instruction. Not listed in the
      task's Out of Scope, which names only dropHeadingLines/firstTableIn and the GitHub
      sync equivalents.
    suggested_action: >-
      Fix the copy (it cannot import the shared module by design — inline a line-walking
      equivalent), or declare it out of scope in the task document and correct the stale
      "stay in step" comment so it does not mislead the next maintainer.
    suggested_owner: dev

