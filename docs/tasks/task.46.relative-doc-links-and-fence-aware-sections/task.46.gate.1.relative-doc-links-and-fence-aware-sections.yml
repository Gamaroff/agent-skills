nfr_validation:
  security:
    status: PASS
    notes: >-
      No auth, crypto, or credential path touched. No new dependencies. The change removes
      URLs from written documents rather than adding any, and every network call site is
      untouched.
  performance:
    status: PASS
    notes: >-
      extractSection replaces one regex match with a single line-walk per section — O(n) in
      body length, run a handful of times per sync against a network-bound operation. No
      measurable change; no hot path involved.
  reliability:
    status: PASS
    notes: >-
      Rollback plan is accurate and genuinely revertible (one commit + npm run bundle; no
      state, migration, or deployed artifact). Error paths are unchanged, including
      updateEpicFile's swallow-and-warn, which is now test-covered for the first time. The
      body link is no longer gated on a Bitbucket URL resolving, which strictly widens the
      set of repos that get a working link.
  maintainability:
    status: CONCERNS
    notes: >-
      Two issues, both in top_issues. The undeclared reformat makes the functional change
      practically unreviewable in the PR, and directly contradicts the task's own stated
      reason for leaving dropHeadingLines/firstTableIn alone ("so this card's diff stays
      reviewable"). The jira-epic-creator copy leaves a known defect in a sibling path under
      a comment that now instructs the opposite of what the code does. Offsetting these:
      write-back coverage went from zero to three suites, and every new function carries a
      comment explaining the failure it prevents.

