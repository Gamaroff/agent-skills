top_issues:
  - id: 'QA-2'
    severity: medium
    file: 'skills/loop-supervisor/references/adapters.js'
    finding: 'probeMissing tests fs.existsSync(path.resolve(cwd, script)), but runProbe spawns `node <script>`, which resolves the main module (extension and directory-index fallback). A configured probeScript "tools/select" with tools/select.js present ran before this change and now stops with "probe script not found: tools/select" (reproduced at a7e0c197). A directory override passes the check and spawns as before. This contradicts SC4 ("the probe runs as before") and the PR''s "no breaking change" claim.'
    suggested_action: 'Decide existence the way the spawn does: try require.resolve(path.resolve(cwd, script)) and treat only a resolution failure as missing, keeping the injectable exists seam for the unit tests; add unit tests for an extensionless override that resolves and for one that does not.'
    suggested_owner: dev
    status: open

