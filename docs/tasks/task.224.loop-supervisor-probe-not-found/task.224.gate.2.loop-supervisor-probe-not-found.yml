status_reason: 'QA-1 is fixed and mutation-proven. The cycle-2 refute pass found that probeMissing checks fs.existsSync while the spawn uses Node main-module resolution, so a configured extensionless probeScript that Node runs (tools/select -> tools/select.js) is now refused. Reproduced at a7e0c197; on base the same config ran.'
