top_issues:
  - id: 'QA-3'
    severity: low
    file: 'skills/loop-supervisor/references/adapters.js'
    finding: 'resolvesAsMain calls require.resolve, which keeps a hit in Module._pathCache and returns it later without touching the disk. runProbe runs on every loop iteration with the same adapter, so a probe script deleted mid-run (a branch checkout, a reinstall) still reads as present, and the spawn falls back to the "probe produced no output" message this task replaced. Reproduced at c67d9dc0 for both tools/select and tools/select.js; cycle 1 (existsSync) reported the deletion.'
    suggested_action: 'Confirm the resolved filename still exists on disk (fs.existsSync on what require.resolve returns), and add a test that resolves, deletes and probes again in one process.'
    suggested_owner: dev
    status: open

