status_reason: 'QA-2 is fixed and mutation-proven. One low-severity, high-confidence bug was promoted (QA-3): require.resolve caches a hit for the process, so in a long-running loop a probe script deleted after its first probe is still reported present and the spawn gives the old "probe produced no output" message. Reproduced at c67d9dc0.'
