    finding: 'The TLD-shape guard cannot tell a host from a user-namespaced branch prefix: `jane.doe/fix/issues/123` → kind=github-issue, `user.name/wip/pull/3` → kind=pr with no repo, `jane.doe/fix/issues/42-login-crash` → refused (exit 2). All were kind=branch on base. The CHANGELOG says only version-shaped segments were at risk.'
