    finding: 'The known-host list is matched against the host with its port still attached, so `acme.atlassian.net:443/…?selectedIssue=AB-2` stays a branch while the same URL without `:443` parses as jira AB-2.'
    suggested_action: 'Match the known-host list against the port-stripped host.'
    suggested_owner: dev
    status: open

