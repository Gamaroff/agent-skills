top_issues:
  - id: 'CR-1'
    severity: medium
    file: 'skills/review-pr/SKILL.md'
    finding: 'Step 0b .env parse: the leading-whitespace `s///` sets sed''s `t` flag, so the first `-e t` branches to the end even when no quote matched. `JIRA_URL= https://acme.atlassian.net   ` keeps its trailing spaces (base trimmed them, so this is a regression) and `JIRA_URL= https://acme.atlassian.net # prod` keeps its comment; both still warn falsely.'
    suggested_action: 'Reset the t flag after the leading trim (`-e ''t a'' -e '':a''` straight after it, or move the leading strip into the extracting sed), and add Step 0b tests with a space after `=`.'
    suggested_owner: dev
    status: open
  - id: 'CR-3'
    severity: medium
    file: 'skills/review-pr/scripts/parse-target.sh'
    finding: 'A dotted first segment is taken for a host even when it is a version: `v2.0/browse/x` is now refused as url-no-target and `5.x/fix/issues/12` parses as kind=github-issue, where base parsed both as branches. The `*.*/browse/*` marker needs no extra segment, so the task''s "every marker needs host/x/…" claim does not hold for it. The task names "a branch target resolving as a URL" as a Critical rollback trigger. Reviewer confidence medium; reproduced by QA under bash and zsh.'
    suggested_action: 'Require the first segment''s last label to be two or more letters (a TLD shape), so v2.0, 5.x and v1.2 stay branches; add `v2.0/browse/x` and `5.x/fix/issues/12` as branch cases.'
    suggested_owner: dev
    status: open
  - id: 'CR-2'
    severity: low
    file: 'skills/review-pr/scripts/parse-target.sh'
    finding: 'The known-host arm `*.atlassian.net/*` lets `*` cross `/`, so the branch `feature/foo.atlassian.net/x` becomes `https://feature/foo.atlassian.net/x` and is refused; the arm does not apply the first-segment rule its own comment states.'
    suggested_action: 'Test `${TARGET%%/*}` against `*.atlassian.net` in a nested case, as the marker arm does; add the branch as a test case.'
    suggested_owner: dev
    status: open

