schema: 1
task: "task.89.relationship-assertion-lint"
task_title: "Lint for prose-matching assertions that claim a relationship but test only co-occurrence"
gate: CONCERNS
status_reason: "The deliverable does what it claims and every numeric claim in it reproduces under independent re-derivation — 89 files / 2188 call sites counted three ways, 61 → 0 unsuppressed, and all six mutation proofs reproduce with the mutation confirmed applied before the result was read. The suite is genuinely non-vacuous: an always-flagging analyser turns 14 tests red, a broken corpus walk trips the >=60 guard, and a deleted fixture trips the completeness guard. ONE MEDIUM: the scanner's regex-literal detector rejects value positions it should accept (`>`, hence `=>`), so a regex literal there is scanned as code; an ODD number of quote characters inside it opens a phantom string that swallows the remainder of the file, and every later assertion becomes invisible. A full reachability sweep proves 0 of 89 files are affected today — the two live instances carry BALANCED backticks, which re-sync the mask — so no coverage is lost and the 0% figure stands. But the failure is SILENT, and silent under-detection in a lint built to catch silent under-detection is the one defect this task cannot ship with. The fix is small; the guard that keeps it fixed is the point."
reviewer: "QA Engineer"
updated: "2026-09-04T12:00:00Z"

top_issues:
  - id: "CY1-1"
    severity: medium
    file: "tests/lib/relationship-assertion-lint.js"
    finding: "`regexCanStartAfter` accepts only `(,=:[!&|?{};+-*%~^` as value positions. `>` is absent, so the extremely common `(l) => /re/.test(l)` idiom is parsed as division: the regex body is scanned as CODE. Any quote character inside it (`'` or a backtick) then opens a phantom string/template that runs until the next matching quote — and with an odd count, to EOF. Every assertion after that point is invisible to every rule, and the analyser reports zero findings for the file exactly as it would for a clean one. Verified by construction: `const f = (l) => /it's here/.test(l);` followed by a textbook rule-A defect yields NONE, while the same defect alone yields A. Also reproduces after a bare `>` comparison and with a backtick or an escaped slash in the regex. NOT currently costing coverage — a bait-assertion sweep appending a known-defective assertion to each of the 89 corpus files finds it in all 89, because the two live `=> /…/` regexes containing backticks (tracker-workflow.test.mjs:278, pr-inline-comment.test.mjs:255) carry them in balanced pairs and the mask re-syncs. It fires the first time somebody writes an apostrophe in such a regex, and it fires silently."
    suggested_action: "Two parts, and the second matters more than the first. (1) Add `>` to the value-position set in `regexCanStartAfter` so `=>` is handled; consider `return`/`typeof`/`case` too, though `>` covers the live idiom. (2) Add a REACHABILITY GUARD to tests/relationship-assertion-lint.test.js: for every file in the live corpus, append a known-defective bait assertion and assert the analyser finds it — `assert.match(doc, /ALPHA[^|]*BRAVO/, \"ALPHA must route to BRAVO\")` is sufficient and is what this review used. That converts a silent per-file blindness into a named failure and is the mechanism that stops it being reintroduced; the one-character fix alone would leave the next desync just as silent. Mutation-prove the guard by reverting the `>` addition and confirming the guard goes red on a file that has the odd-quote shape."
    suggested_owner: dev
    status: open

