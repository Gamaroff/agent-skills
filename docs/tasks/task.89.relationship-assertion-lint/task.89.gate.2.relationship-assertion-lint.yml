schema: 1
task: "task.89.relationship-assertion-lint"
task_title: "Lint for prose-matching assertions that claim a relationship but test only co-occurrence"
gate: PASS
status_reason: "CY1-1 is closed at the mechanism, not patched, and the closure was verified by attack rather than by reading the fix. Both arms are independently mutation-proved — reverting `>` reddens 5 tests, reverting the keyword arm reddens 3 — and critically the corpus-level reachability sweep was proved capable of failing at all: with `>` reverted AND a real odd-quote line injected into a live corpus file, it goes red and NAMES that file. That matters because a guard over a corpus where nothing currently triggers it is otherwise indistinguishable from a guard that cannot fire. Six regression probes confirm the `>`/`<` addition does not eat legitimate division, including `obj.return / 2`. Numbers re-derived once more at the new HEAD: 89 files, 2191 call sites, 4 raw findings (all four suppressed with written reasons), 0 blind. The cycle-1 fix also disclosed a defect in its OWN first guard — the probe's quotes paired up and re-synced the mask, leaving the keyword arm unproven — and corrected it by isolating each shape. That self-catch is the strongest evidence in the change set that the discipline this task exists to install is actually operating. One LOW, theoretical and non-silent, recorded rather than fixed."
reviewer: "QA Engineer"
updated: "2026-09-04T13:00:00Z"

top_issues:
  - id: "CY1-1"
    severity: medium
    file: "tests/lib/relationship-assertion-lint.js"
    finding: "`regexCanStartAfter` omitted `>`, so a regex literal after `=>` was scanned as code and an odd quote count inside it opened a phantom string that ran to EOF, silently hiding every later assertion in that file."
    suggested_action: "Accept `>` as a value position and add a per-file reachability guard."
    suggested_owner: dev
    status: closed
    fixed_date: "2026-09-04"

