    file: 'shared/resources/develop-pipeline-step-5-6-qa-loop.md'
    finding: 'The classify block''s tracked-and-clean test (line 1509) passes the ref to git as a pathspec while isDocsPath judged it as a literal filename. Under the default patterns, ":!*.md", ":(exclude)*.md" and ":^*.md" pass isDocsPath, and git resolves them to every tracked non-markdown file (2,256 here, bash and zsh), so the ref is cleared onto the eligible list and the stage block''s git add / restore / checkout (lines 1548, 1559, 1564) act on all code. Wildcards and directory refs widen one entry to many files in the same way. Promoted (bug, high/high). Bug: task.173.bug.3.'
    suggested_action: 'Make every git call in the classify and stage blocks literal (--literal-pathspecs), and require git ls-files to name exactly the one path given. Have isDocsPath refuse a path beginning with ":" or containing glob characters. Add a ":!*.md" case under the default patterns, run under bash and zsh, plus a unit case.'
