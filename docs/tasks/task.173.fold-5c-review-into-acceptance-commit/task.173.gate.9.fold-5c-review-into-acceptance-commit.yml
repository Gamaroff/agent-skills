top_issues:
  - id: 'CR9-2'
    severity: low
    file: 'shared/resources/develop-pipeline-resume-contract.md'
    finding: 'The classifier lists a cleared path raw (ls-files with core.quotePath=false), but the resume probe reads p from git status --porcelain with the default quotePath, which C-quotes a path with a space or non-ASCII character. A legitimately carried docs/my notes.md never matches the eligible list, so a resume after a pause HALTs as class (c). Promoted (bug, low/high).'
    suggested_action: 'Read status as git -c core.quotePath=false status --porcelain -z --no-renames (or unquote p the same way) so the classifier, the stage block and the probe spell a path the same way; add a spaced-path test.'
    suggested_owner: dev
    status: open
  - id: 'CR9-4'
    severity: low
    file: 'shared/resources/develop-pipeline-step-5-6-qa-loop.md'
    finding: 'The classify loop prints the untrusted ref with echo, and zsh''s echo interprets backslash escapes: a ref containing \n prints a fake second line such as "doc-only CR-10 src/evil.js", and \c truncates the line. The orchestrator reproduced this (bash literal, zsh split). The stage block still HALTs on an uncleared path, but only after the edit. Promoted (bug, low/high).'
    suggested_action: 'Print untrusted values with printf ''%s'' in the classify loop and in the HALT messages that echo a path.'
    suggested_owner: dev
    status: open

