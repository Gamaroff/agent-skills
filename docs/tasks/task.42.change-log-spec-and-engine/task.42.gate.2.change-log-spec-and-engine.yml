top_issues:
  - id: TASK-42-BUG-3
    severity: medium
    finding: "collapseOtherLegacyBlocks sweeps only LEGACY marker pairs, never the current change-log-* pair. A document holding a legacy block AND a current block therefore ends with two Change Logs — both now in canonical format, but two. Verified reachable: legacy-before-current yields 2 blocks. NOT a regression (the pre-fix engine produced 2 blocks here as well, and additionally left the legacy markers live), and outside the literal Success Criterion, which concerns the two legacy pairs and now passes in both orderings. But the spec states a document ends with exactly one Change Log, and this is the remaining path to violating it."
    suggested_action: "Include the current pair in the collapse sweep so the invariant is unconditional rather than legacy-only. The primary block is already excluded by construction (both sides are scanned around it)."
    suggested_owner: dev
    bug_ref: "task.42.bug.3.duplicate-current-block-never-collapsed.md"

