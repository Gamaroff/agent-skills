schema: 1
task: "task.42.change-log-spec-and-engine"
task_title: "Canonical Change Log spec and shared engine"
gate: FAIL
status_reason: "Two high-confidence correctness bugs in the new engine, both in the guard the task itself introduced. The heading-block end scan ignores fences (structurally corrupts the document and detaches a Change Log row); dual-legacy collapse works in only one of two document orderings, failing a stated Success Criterion while its test passes."
reviewer: "QA Engineer"
updated: "2026-08-12T18:20:00Z"

top_issues:
  - id: TASK-42-BUG-1
    severity: high
    finding: "findChangeLog() applies the fence guard when locating the heading (change-log.js:296) but not when computing the block end (:305-309). A fenced ##/### line inside a Change Log section terminates the block early, consuming the opening fence and leaving an orphaned closing fence plus a Change Log row stranded outside the block."
    suggested_action: "Filter the end-scan through protectedRanges() — already computed at :266 — advancing past any nextRe match that falls inside a protected range. Add a regression test."
    suggested_owner: dev
    bug_ref: "task.42.bug.1.heading-block-end-scan-ignores-fences.md"
  - id: TASK-42-BUG-2
    severity: high
    finding: "Dual-legacy collapse is order-dependent. findChangeLog() iterates LEGACY_MARKER_PAIRS in array order (:275) ignoring document position, and collapseOtherLegacyBlocks() only scans content.slice(found.end) (:371). With the github block before the jira block, both blocks survive and the github legacy markers remain — failing the Success Criterion 'both legacy marker pairs migrate in place with no duplication'. The existing test only covers the passing ordering."
    suggested_action: "Make findChangeLog positional (lowest start index wins) and scan the whole document in the collapse pass. Parameterise the dual-pair test over both orderings."
    suggested_owner: dev
    bug_ref: "task.42.bug.2.dual-legacy-collapse-is-order-dependent.md"

