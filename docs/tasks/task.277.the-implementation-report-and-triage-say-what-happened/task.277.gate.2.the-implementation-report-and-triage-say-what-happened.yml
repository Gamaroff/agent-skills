top_issues:
  - id: 'T277-5'
    severity: low
    file: 'shared/resources/report-lint.js'
    finding: 'origin: code-review, reproduced by QA (reviewer confidence medium, recorded unchanged). The qa-cycle-heading-suffix check runs on every `### QA Cycle N` heading, not only those under `## QA Iteration History`, so in a marked report a Decisions Log note `### QA Cycle 2 — qa-fix choice` gets a false qa-cycle-heading-suffix (reproduced on a copy of the task.118 fixture with the history body replaced). Control: the same report without the note lints clean, and the same note in an unmarked report lints clean. The same note headed `### QA Cycle 1` beside the real entry gives qa-cycle-duplicated, but that code predates this change, so it is recorded as pre-existing and not a finding.'
    suggested_action: 'Gate the suffix check on `inHistory` as the traceability collection is, and add a test with a marked report that has a Decisions Log `### QA Cycle N — qa-fix` heading.'
    suggested_owner: dev
    status: open
  - id: 'T277-6'
    severity: low
    file: 'shared/resources/report-lint.js'
    finding: 'origin: code-review, reproduced by QA (reviewer confidence low, recorded unchanged). `marked` is read during the single pass, so a marker line placed after the first cycle headings enables the traceability check and not the suffix check: a suffixed H3 with a late marker gives only traceability-missing (reproduced). Control: with the marker in the header block both rules apply. The template writes the marker in the header block only, so this needs a hand-edited report.'
    suggested_action: 'Read the marker only before the first `## ` heading (the header block), or detect it in a pre-pass, so both rules use one value.'
    suggested_owner: dev
    status: open
  - id: 'T277-4'
    severity: low
    file: 'docs/tasks/task.277.the-implementation-report-and-triage-say-what-happened/task.277.the-implementation-report-and-triage-say-what-happened.md'
    finding: 'Still open from gate 1. The performance criterion (CI=true npm test wall time within 10% of develop, median of five alternating runs) was not measured as written; one full run takes about 679 s on the LAN server. Proxy: the report-lint suite alone is 0.5-1.1 s on base and head. Cycle 1 added no code outside the lint and its test, so the proxy still stands.'
    suggested_action: 'Owner decides: waive or amend the criterion with an approver (the proxy supports waiving), or run the ten-run measurement.'
    suggested_owner: po
    status: open

