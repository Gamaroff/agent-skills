  - id: 'T277-3'
    severity: low
    file: 'shared/resources/report-lint.js'
    finding: 'origin: code-review, reproduced by QA (reviewer confidence low, recorded unchanged). The traceability loop reads every `### QA Cycle N` heading in the file, so a marked report with a `### QA Cycle 11` heading under the Decisions Log gets a false traceability-missing at that line (reproduced on a copy of the task.118 fixture: line 49 flagged). Control: the same report without that heading flags only the history cycles. Not pre-existing: the base lint has no such code.'
    suggested_action: 'Scope the traceability loop to cycle headings inside `## QA Iteration History`, as qa-report-cycles.sh does, and add a test with a Decisions Log cycle heading in a marked report.'
    suggested_owner: dev
    status: open
  - id: 'T277-4'
    severity: low
