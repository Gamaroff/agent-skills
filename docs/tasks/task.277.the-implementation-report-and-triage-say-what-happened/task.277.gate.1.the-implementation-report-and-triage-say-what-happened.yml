    finding: 'Performance criterion (CI=true npm test wall time within 10% of develop, median of five alternating runs) was not measured as written; one full run takes about 679 s on the LAN server, so ten runs would hold it for hours. A proxy was measured instead: the report-lint suite alone runs in 0.5-1.1 s on both base and head, which bounds the added cost at well under 0.1% of a full run.'
    suggested_action: 'Owner decides: waive or amend the criterion with an approver (the proxy supports waiving), or run the ten-run measurement.'
    suggested_owner: po
    status: open

