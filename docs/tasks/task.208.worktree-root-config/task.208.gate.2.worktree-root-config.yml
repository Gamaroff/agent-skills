top_issues:
  - id: 'QA-208-3'
    severity: medium
    file: 'skills/develop-batch/SKILL.md'
    finding: 'Step 0.3a writes the raw root into .git/info/exclude before Step 1 validates it, so a newline, .. or symlinked root leaves exclude lines behind, one per retry (TASK-208-BUG-2).'
    suggested_action: 'Validate and normalise the root first (selector --check-root) and write the exclude line from the normalised value.'
    suggested_owner: dev
  - id: 'QA-208-4'
    severity: medium
    file: 'skills/develop-batch/SKILL.md'
    finding: 'git check-ignore exit 128 (git cannot answer) is read as exit 1 (not ignored), so a junk pattern is written and the report says the root was ignored (TASK-208-BUG-2).'
    suggested_action: 'Branch on the exit status: 0 ignored, 1 append, anything else halt with git stderr.'
    suggested_owner: dev
  - id: 'QA-208-5'
    severity: low
    file: 'shared/resources/qa-execute-snippets.mjs'
    finding: 'isLinkedWorktree parses the .git file with a regex that is quadratic in whitespace (40k spaces: 19 s), run on every nested .git file --copy walks.'
    suggested_action: 'Parse the first line with indexOf/trim, no backtracking regex; add a timing test at growing N.'
    suggested_owner: dev

