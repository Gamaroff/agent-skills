schema: 1
task: 'task.65.registry-aware-selection'
task_title: 'Derive the selection frontier from the registries, so an outstanding bug or task cannot be invisible to /develop-next'
gate: CONCERNS
status_reason: 'All four cycle-1 findings verified FIXED and independently mutation-proved; H1 became an executable constraint rather than a corrected value. One new MEDIUM defect introduced by the M2 fix — the header-column state is never reset when a table ends, so any second table in a registry document is parsed as registry data and pollutes --lint. Held by no test; QA-verified one-line remedy.'
reviewer: 'QA Engineer'
updated: '2026-08-29T22:05:00Z'
qa_cycle: 2
previous_gate: 'task.65.gate.1.registry-aware-selection.yml'
pr: 'https://github.com/Gamaroff/agent-skills/pull/281'

top_issues:
  - id: N1
    issue: 'parseRegistry never resets column state, so a second table in the document is parsed as registry data'
    severity: medium
    introduced_by: 'the M2 fix (8f701cc)'
    finding: '`cols` is assigned when a header is promoted and never cleared; `pendingHeader` is reset when a non-table line ends the table but `cols` is not. Once any header has been seen, every later table row in the document is treated as data. A `## Notes` key/value table yields 2 spurious "malformed row" entries; a second registry section''s own header row is reported as `id cell "#" is not a number`. Cannot cause a wrong selection (malformed rows never become candidates) but pollutes the --lint report SC6''s visibility guarantee depends on — the mirror image of the bug it came from. Does not fire in this repo today: both real registries hold exactly one table and parse with 0 malformed, 0 warnings.'
    suggested_action: 'Reset `cols = null` alongside `pendingHeader` where a non-table line ends the table, AND add a test for a registry document containing a second table. QA verified the remedy against 6 probe scenarios, both real registries and the full unit suite; without the test the invariant is unheld, since the suite is green 113/113 both with and without it.'
    suggested_owner: dev
    status: open
    mutation_proven: false
    mutation_note: 'This is the finding: the suite stays green whether or not the remedy is present, which is why the fix cycle missed it.'

low_issues:
  - id: L5
    issue: "SC11's wording is now unsatisfiable by construction"
    finding: 'SC11 asserts a fresh --dry-run "selects from a registry rather than reporting a stop". It now reports roadmap-complete, because after the H1 fix the only outstanding item in this repo is task 65 itself, at ready-for-review and therefore correctly excluded. The criterion was only satisfiable before BECAUSE of the H1 defect. The mechanism is genuinely reachable — QA flipped one accepted task document to ready-for-development and the live selector returned selected/source:task-registry/T59, then restored it.'
    suggested_action: 'Reword SC11 to assert the mechanism is reachable (demonstrated by a controlled check) rather than asserting a particular live selection, so it does not depend on the repo''s momentary backlog.'
    suggested_owner: dev

