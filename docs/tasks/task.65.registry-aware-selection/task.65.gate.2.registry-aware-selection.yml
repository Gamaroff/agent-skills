    severity: high
    status: closed
    fixed_date: '2026-08-29'
    bug_ref: 'task.65.bug.1.ready-for-review-selected-but-undispatchable.md'
    verification: 'Floor narrowed to {ready-for-development, in-progress}; a ready-for-review task is rejected with the correct reason. The fix exceeded the finding: rather than correcting a value it made the rule executable, parsing develop-task''s and develop-bug''s own status tables from git-tracked paths. QA re-proved non-vacuity two ways — putting ready-for-review back reddens 3 tests including the structural one on the exact regression it names, and renaming the parsed section so the table yields nothing makes the test FAIL rather than pass on an empty set.'
    mutation_proven: true
  - id: M2
    severity: medium
    status: closed
    fixed_date: '2026-08-29'
    verification: 'The header/typo distinction works — a `| T65 | … |` row is now reported and reaches --lint. Introduced N1 in doing so.'
    mutation_proven: true
  - id: M3
    severity: medium
    status: closed
    fixed_date: '2026-08-29'
    verification: 'Verified against the REAL registries rather than fixtures: docs/bugs/bug-registry.md 2 rows and docs/tasks/task-registry.md 65 rows, both 0 malformed and 0 warnings. A swapped-column registry now reads priority correctly and orders by it.'
    mutation_proven: true
  - id: L4
    severity: low
    status: closed
    fixed_date: '2026-08-29'
    verification: 'One shared isWorkItemHref(); a preceding non-work-item link no longer wins over the work-item one.'
    mutation_proven: true

