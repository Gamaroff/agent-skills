low_issues:
  - id: LR-1
    issue: 'A table split by a blank line loses its column mapping'
    finding: 'With a non-standard column order, rows after a blank line fall back to documented positions, so priority can read the wrong cell. This follows from scoping the mapping to one table and is the correct reading — a blank line ENDS a markdown table, so the continuation is a new headerless table, and headerless tables fall back to positions by design. Requires both a non-standard column order and malformed markdown.'
    action: 'None. Documented behaviour, recorded so it is not rediscovered as a surprise.'
  - id: LR-2
    issue: 'Two tables with no blank line between them report the second header as a malformed row'
    finding: 'Without an intervening non-table line there is nothing to end the first table. A markdown renderer treats that input as one table too; reporting the row is arguably more honest than silently ignoring it, and the input is not valid markdown.'
    action: 'None. Fixing it would mean special-casing markdown that is already malformed.'

