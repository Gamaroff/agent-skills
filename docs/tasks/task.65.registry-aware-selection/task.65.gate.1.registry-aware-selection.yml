schema: 1
task: 'task.65.registry-aware-selection'
task_title: 'Derive the selection frontier from the registries, so an outstanding bug or task cannot be invisible to /develop-next'
gate: FAIL
status_reason: 'The task eligibility floor admits `ready-for-review`, a status `develop-task` Phase 0c is contractually guaranteed to HALT on — so the frontier nominates work the dispatcher will refuse, stopping an unattended loop that then cannot self-recover. Everything else is strong: coverage proved non-vacuous under six independent mutations, and roadmap/batch parity is byte-identical to origin/develop.'
reviewer: 'QA Engineer'
updated: '2026-08-29T21:20:00Z'
qa_cycle: 1
pr: 'https://github.com/Gamaroff/agent-skills/pull/281'

top_issues:
  - id: H1
    issue: '`TASK_ELIGIBLE_STATUSES` includes `ready-for-review`, which `develop-task` Phase 0c HALTs on'
    severity: high
    bug_ref: 'task.65.bug.1.ready-for-review-selected-but-undispatchable.md'
    finding: 'The registry frontier can nominate a task the named `/develop-task` command is guaranteed to refuse. `ready-for-review` is the normal state of any task between development and merge, so this is common rather than exceptional. Reproduces live on this branch: the selector picks T65, whose own document is `ready-for-review`.'
    suggested_action: 'Drop `ready-for-review`, leaving {ready-for-development, in-progress} — a strict subset of what develop-task proceeds on, matching what the bug side already does. Add a test asserting the subset relation for both kinds, and correct the task document § Scope and SC5. Do NOT widen develop-task instead.'
    suggested_owner: dev
    status: open
  - id: M2
    issue: 'A registry row with a non-numeric `#` cell is silently invisible'
    severity: medium
    finding: 'The header-skip guard `!/^\d+$/.test(cells[0])` cannot tell a header from a typo, so a row written `| T65 | ... |` is neither parsed, counted, nor listed in --lint. Contradicts SC6 and Phase 3 ("out of the frontier, but never invisible") in exactly the place a human typo lands.'
    suggested_action: 'Identify the header explicitly (first cell `#`, or the row preceding the `| --- |` separator) and route any other non-numeric-id row to malformed[] with a reason. Add a test.'
    suggested_owner: dev
    status: open
  - id: M3
    issue: 'Column positions are assumed with no header validation'
    severity: medium
    finding: 'Status/severity/priority are read at fixed indices; the column contract is documented in roadmap-selection.md but never checked. A consumer registry with Priority and Category swapped parses priority as "infra". Cannot cause a wrong selection (the document decides eligibility) but silently breaks the ordering SC4 claims is deterministic.'
    suggested_action: 'Map header column names to indices, falling back to documented positions; or emit a --lint warning when the header does not match the expected shape.'
    suggested_owner: dev
    status: open

low_issues:
  - id: L4
    issue: '`parseRegistry` takes the first `.md` href where `workItemPath()` takes the first work-item href'
    finding: 'A nested or preceding markdown link in a title resolves to the wrong path. Fails conservatively (row rejected as "document missing"), but makes work invisible for an unobvious reason.'
    suggested_action: 'Reuse the sibling function''s `(?:story|task|bug)\.[^/]*\.md$` filename test.'
    suggested_owner: dev

