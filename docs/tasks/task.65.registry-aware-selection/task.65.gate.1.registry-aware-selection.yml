nfr_validation:
  security:
    status: PASS
    notes: 'No credentials, network calls or process execution; reads two repo-local markdown files and the documents they name, parsing only a `status:` scalar. Nothing written. No new dependencies.'
  performance:
    status: CONCERNS
    notes: 'Selection short-circuits at the first eligible row. `--lint` reads one document per registry row — 67 (~40 ms) here, linear and unbounded; a 500-task consumer repo pays 500 reads per lint. Recorded as a known limitation with a defensible reason for not caching; should be measured before a much larger repo adopts it.'
  reliability:
    status: PASS
    notes: '8 hostile registry inputs — none threw, none halted, and a malformed row never suppressed its neighbours. The halt path (unparseable roadmap) returns before the fallback; the loader is never called. Rollback plan is accurate about the one thing a revert does not undo (Phase 6).'
  maintainability:
    status: CONCERNS
    notes: 'Small purposeful exported surface; comments explain why rather than what, and the stop-precedence rationale should stop a future editor moving the call. Deductions: the column contract is prose rather than an executable check (M3), and H1 shows the eligibility floor and the dispatcher''s accepted set are coupled with nothing holding them together.'

