nfr_validation:
  security:
    status: PASS
    notes: "No credentials or secrets involved. The new subprocess call passes arguments as a bash array, so no config value reaches a word-splitting context. The CLI reads two JSON files from the extracted tarball — a boundary the installer already crosses when it copies tarball content — so no new trust assumption. TASK-84-008 is a robustness defect, not a security one: the input is a committed file and the wizard's own prompt, not untrusted input."
  performance:
    status: PASS
    notes: "~115ms per resolution over 120 nodes against a <1s criterion. Tarball download unchanged. The dry-run path stays offline."
  reliability:
    status: CONCERNS
    notes: "The headline failure directions are right — node absent, and a shadowed node emitting help text, both fall back to the unfiltered install rather than an empty one, and the grandfather branch is correctly ordered against the rm -rf. But FOUR reachable inputs silently produce a full unfiltered install while reporting success or blaming the wrong cause: a typo'd include (001), an exclude list that empties the profile (002), a trailing comment after `skills:` (003), and a `$`-prefixed profile name (009). For a feature whose entire purpose is to not install things, 'silently installs everything' is the wrong direction to fail in even though it is the safe one."
  maintainability:
    status: CONCERNS
    notes: "The resolver is pure, injected and well tested, and non-obvious decisions carry their rationale in-file — including the measurement behind the graph redesign. Against that: two comments added to validate.yml state incorrect premises (ubuntu-latest does ship Node; the drift check does not read skill-profiles.json), the conflict dedupe in the resolver is dead code while real duplicate conflicts go unmerged, and the two config parsers disagree on quote handling. A plan that documents unimplemented behaviour (007) is the same class of problem."

