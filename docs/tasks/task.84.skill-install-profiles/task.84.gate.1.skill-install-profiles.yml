schema: 1
task: "task.84.skill-install-profiles"
task_title: "Skill install profiles with dependency closure"
gate: CONCERNS
status_reason: "Cycle 1 found eleven defects — ten from an independent adversarial review, one from the repo's own stdout-drain guard. Four silently installed every skill in reachable configurations, one broke both CI drift checks on legal YAML, two misreported what the installer did. ALL ELEVEN ARE FIXED, each with a regression test, and six are mutation-proven. This gate records cycle 1's findings and their resolution; the re-review writes gate 2."

bug_resolution:
  bugs_fixed: 11
  bugs_remaining: 0
  fix_date: "2026-09-04"
  total_iterations: 1
  verification_method: "16 new regression tests (one per defect); six fixes mutation-proven by reverting each and confirming red; end-to-end re-verification of every fixed path against a simulated tarball install"
  note: "TASK-84-007 was resolved by correcting the PLAN rather than the code — the resolver does not exist at prompt time, so the counts it documented were not implementable without adding a network request to a prompt that must not make one."
  found_after_first_ten: "TASK-84-011 — process.exit() after a stdout write in resolve-skill-set-cli.mjs, caught by the pre-existing stdout-drain-on-exit guard. setup-consumer.sh pipes this CLI's stdout, so the ~64KB truncation applies; 120 names sit under it today, which is why it would have surfaced only once the library grew."
reviewer: "QA Engineer"
updated: "2026-09-04T22:05:00Z"

top_issues:
  - id: "TASK-84-001"
    severity: medium
    file: "shared/resources/resolve-skill-set-cli.mjs"
    finding: "`include` entries are echoed to stdout verbatim without being validated against the known skill set. Verified: `--include Create-PR,NotARealSkill` emits both names. Those lines then fail the bash name-shape guard, which rejects the WHOLE batch, so a single typo in the wizard's extras answer downgrades to a full unfiltered install — blamed on node/PATH by the warning text."
    suggested_action: "Validate `include` against `allSkills` in the CLI and exit 2 naming the unknown entry, so a bad name never reaches stdout. Also strip quotes per element in `_config_skills_list`, matching `_config_skills_profile`."
    suggested_owner: dev
    status: closed
    fixed_date: "2026-09-04"

  - id: "TASK-84-002"
    severity: medium
    file: "scripts/setup-consumer.sh"
    finding: "`[[ -n \"$_out\" ]] || return 1` conflates a legitimately-empty resolved set with a resolver failure. Verified: `--profile minimal --exclude <all five minimal seeds>` resolves to 0 skills and exits 0; bash then reads empty stdout as failure and installs EVERY skill. The user asked for almost nothing and got the maximum."
    suggested_action: "Discriminate on the CLI's exit code, not on emptiness: capture `_rc=$?` and treat rc==0 as authoritative even with empty output. If an empty set still warrants a guard, warn explicitly ('profile resolved to 0 skills — check your exclude list') rather than silently inverting intent."
    suggested_owner: dev
    status: closed
    fixed_date: "2026-09-04"

  - id: "TASK-84-003"
    severity: medium
    file: "scripts/setup-consumer.sh"
    finding: "Both awk parsers open the skills block only on `/^skills:[[:space:]]*$/`, so nothing may follow `skills:` on that line. The very next rule `/^[^[:space:]#]/ { inblock=0 }` then matches that same line. Verified: `skills:  # which skills` followed by `  profile: minimal` yields an empty profile, falls back to `full`, and installs everything — with NO warning at all, since this path never reaches the 'could not resolve' branch."
    suggested_action: "Match `/^skills:[[:space:]]*(#.*)?$/`, or gate the close rule with `!/^skills:/` so the header cannot re-close its own block. Apply to `_config_skills_profile` and `_config_skills_list` alike."
    suggested_owner: dev
    status: closed
    fixed_date: "2026-09-04"

  - id: "TASK-84-004"
    severity: medium
    file: "scripts/generate-skill-dependencies.mjs"
    finding: "`parseInvokes` checks `raw.endsWith(']')` without stripping a trailing YAML comment. Verified: `invokes: [create-branch, develop]  # steps 1-2` throws \"unterminated 'invokes:' list — missing ']'\" — for a line where the bracket is plainly present. Both CI drift checks then fail with a misleading message, blocking the release."
    suggested_action: "Strip a trailing ` #...` before the bracket checks (`raw = raw.replace(/\\s+#.*$/, '')`), mirroring the awk parsers."
    suggested_owner: dev
    status: closed
    fixed_date: "2026-09-04"

  - id: "TASK-84-005"
    severity: medium
    file: "scripts/setup-consumer.sh"
    finding: "The profile grandfather branch runs BEFORE the tracker-exclusion branch, and the resolver has already removed tracker-excluded skills from `_RESOLVED_SET`. So whenever a profile is active, every tracker-excluded skill is consumed by the profile branch: `_kept` is always 0, the tracker-specific warning (with its `--all-skills` and prune guidance) is unreachable, and Jira-only skills are mis-reported as 'outside profile'."
    suggested_action: "Evaluate `_skill_excluded_for_tracker` first, or test it inside the profile branch, so tracker-driven keeps land in `_kept` with the tracker message and only genuine profile keeps land in `_outside`."
    suggested_owner: dev
    status: closed
    fixed_date: "2026-09-04"

  - id: "TASK-84-006"
    severity: medium
    file: "scripts/setup-consumer.sh"
    finding: "The profile branch increments `_skipped` for every not-yet-installed skill outside the profile, but the summary renders `_skipped` as `skipped (${_tracker})`. On a fresh `pipeline` install that reads as '85 skipped (github)' — telling the user 85 skills do not apply to GitHub when only ~11 do."
    suggested_action: "Use a separate counter for profile skips and report it as `N not in profile '<name>'`, leaving `_skipped` to mean tracker skips only."
    suggested_owner: dev
    status: closed
    fixed_date: "2026-09-04"

  - id: "TASK-84-007"
    severity: medium
    file: "docs/tasks/task.84.skill-install-profiles/task.84.plan.skill-install-profiles.md"
    finding: "Plan Phase 3 shows the menu printing `~${_full_tokens} tokens for all ${_full_count}` and states these come from a `--count` call before the menu. The shipped `select_skill_profile()` makes no such call and prints no counts."
    suggested_action: "Implement the count (preferred — it is what makes the choice concrete), or correct the plan."
    suggested_owner: dev
    status: closed
    fixed_date: "2026-09-04"

  - id: "TASK-84-008"
    severity: low
    file: "shared/resources/resolve-skill-set.mjs"
    finding: "`graph[name] ?? []` is an unguarded prototype-chain lookup assuming an array. Verified: `--include toString` reaches `Object.prototype.toString`, throws 'function is not iterable' uncaught, and the installer falls back to a full install. A hand-edited graph with a string value iterates its characters as skill names."
    suggested_action: "`Object.hasOwn(graph, name) && Array.isArray(graph[name]) ? graph[name] : []`, and wrap `main()` in try/catch exiting 2."
    suggested_owner: dev
    status: closed
    fixed_date: "2026-09-04"

  - id: "TASK-84-009"
    severity: low
    file: "shared/resources/resolve-skill-set.mjs"
    finding: "The unknown-profile guard filters `$`-prefixed keys out of the error message but not out of the lookup. Verified: `--profile '$comment'` returns an empty set and exits 0 instead of 'Unknown profile' — which the installer then reads as a failure and turns into a full install."
    suggested_action: "Reject `profile.startsWith('$')` in the same guard."
    suggested_owner: dev
    status: closed
    fixed_date: "2026-09-04"

  - id: "TASK-84-010"
    severity: low
    file: "scripts/setup-consumer.sh"
    finding: "The dry-run count invokes the CLI with only `--profile` and `--tracker`, never the config's `--include`/`--exclude`, so the number previewed is not the number the real run would produce. Previewing the real run is the entire purpose of `--dry-run`. `_dry_n` is also assigned without `local`, leaking into global scope from inside `install_skills`."
    suggested_action: "Factor the arg assembly out of `_resolve_skill_set` into a helper both paths call; declare `local _dry_n`."
    suggested_owner: dev
    status: closed
    fixed_date: "2026-09-04"

  - id: "TASK-84-011"
    severity: medium
    file: "shared/resources/resolve-skill-set-cli.mjs"
    finding: "Four `process.exit(2)` calls after stdout writes. Caught by the repo's pre-existing `stdout-drain-on-exit.test.mjs` guard, not by review: `process.exit()` truncates a piped write at the pipe buffer (~64KB), and setup-consumer.sh consumes this CLI's stdout through a pipe. 120 skill names sit under 64KB today, so this would have stayed invisible until the library grew past it — the same class as bug.3.stdout-truncation-on-exit."
    suggested_action: "Use `process.exitCode = 2` and return, never `process.exit()`."
    suggested_owner: dev
    status: closed
    fixed_date: "2026-09-04"

