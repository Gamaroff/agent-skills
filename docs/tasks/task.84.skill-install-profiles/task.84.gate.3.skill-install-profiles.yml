    notes: "C3-001 is the most severe defect found in this task and it was introduced by a fix. The trend in blast radius is downward — installs everything, then one skill's edges, then an aborted install on a failure path — but three consecutive cycles have each found the previous cycle's repairs defective, and every one of those repairs was mine. The convergence (11 -> 5 -> 5) is real but not yet demonstrated to have converged."
  maintainability:
    status: CONCERNS
    notes: "Two more vacuous tests found, one asserting on a code comment. The pattern across three cycles is consistent and worth stating plainly: tests that assert on SOURCE TEXT rather than behaviour have not caught a single one of the seventeen defects in this task, and have twice given false confidence about the specific line the defect was on. Where behaviour is testable, assert behaviour; where it is not, say so in the comment rather than implying coverage."

