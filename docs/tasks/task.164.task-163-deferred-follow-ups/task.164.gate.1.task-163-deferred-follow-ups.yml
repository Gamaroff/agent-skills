top_issues:
  - id: 'QA-164-1'
    severity: medium
    file: 'shared/resources/develop-pipeline-remaining-work-banner.md'
    finding: 'The derivation rule contradicts itself. The re-prompt clause is introduced as "One exception" and ends "Every other firing point, including the ordinary Step 7 → 8 transition, follows this rule", but the HALT rule after it makes HALT blocks a second exception: at lock 8 a Step 7-tail HALT prints Step 7, not current_step. The old clause said "and a Step 8 HALT"; dropping that phrase left the two statements in conflict (code review CR-1).'
    suggested_action: 'Make the carve-out exclude HALT blocks explicitly, or state both deviations as one list of exceptions. Pin the new wording in the banner test in place of the "the ordinary Step 7 → 8 transition, follows this rule" phrase.'
    suggested_owner: dev
  - id: 'QA-164-2'
    severity: low
    file: 'shared/resources/develop-pipeline-remaining-work-banner.md'
    finding: 'The HALT rule is shared by all three pipelines but gives one literal rendering, `Step 7/8 — FINALISE ❌ halted`. develop-bug names Step 7 "FINALISE & CLOSE" (develop-pipeline-on-stop.sh:183), so the example is wrong for develop-bug, and the HALT pin hard-codes it (CR-2).'
    suggested_action: 'Mark the example as the develop-story/develop-task rendering or write it as `Step 7/8 — {STEP-NAME} ❌ halted`, and align the pin test phrase.'
    suggested_owner: dev
  - id: 'QA-164-3'
    severity: low
    file: 'shared/resources/tests/step-8-completion-checklist.test.mjs'
    finding: 'The no-restatement check reads only the captured exception span. A restatement of the hook fragments placed in the HALT sentence, or anywhere else in the doc, would pass, and those are the second copies that drift (CR-3).'
    suggested_action: 'Run the derived-fragment check over the whole whitespace-collapsed banner doc.'
    suggested_owner: dev
  - id: 'QA-164-4'
    severity: low
    file: 'shared/resources/tests/advance-pipeline-lock-4b-setup.test.mjs'
    finding: 'spawnSync blocks the event loop, so node:test''s per-case timeout cannot fire; the spawnSync timeout is the real limit, and when it kills the child runLockTests returns status null and drops r.signal / r.error, so a timeout reads as a bare "null !== 0" (CR-4).'
    suggested_action: 'Return r.signal and r.error from runLockTests and put them in the assertion messages; drop the node:test timeout option or state that the spawnSync timeout is the one that applies.'
    suggested_owner: dev

