nfr_validation:
  security:
    status: FAIL
    notes: 'Two confirmed arbitrary-command-execution paths in the COMMITTED shell script (BUG-3, BUG-3b), both firing during the dry run the documentation presents as safe. Residual redaction holes (BUG-11): object keys, non-string scalars, sub-8-char env values and URL userinfo. Positives that do hold: the env sweep and prefixed shape matchers catch real configured secrets; the gates were verified to attempt NO network call under all four restricted modes with a full credential set present; the gate fails closed if defer() throws; an unrecognised access mode is refused rather than defaulted.'
  performance:
    status: PASS
    notes: 'Roster parsed once and memoised; journal append is one sub-4KiB write; the gate is a string comparison ahead of any I/O. nextOrder() is O(n) per append and topoSort recursion is unbounded (LOW — 15k-record chain overflows the stack), neither reachable at run scale.'
  reliability:
    status: FAIL
    notes: 'BUG-4 silently drops a record whose argv matches another — the precise invisible-drift failure the task exists to remove. BUG-5 makes the committed script unrunnable under `command` mode. BUG-1 duplicates checklist entries. BUG-7 means nothing renders the journal in a bundled skill at all. Genuinely strong elsewhere: malformed lines skipped with distinct warnings, crash leaves a readable prefix, future schema versions refused rather than guessed at, topoSort never drops or double-pushes a record, cycles and dangling edges warn and still render.'
  maintainability:
    status: CONCERNS
    notes: 'The single-sourced roster and the mutation ledger are real strengths, and conventions match the surrounding modules. But parseRoster fails silently on a reformatted row (BUG-9), three dead artifacts remain (unused stack parameter, unused argvLine export, an unreachable startsWith("$") guard), and the test suite has demonstrated blind spots: every one of the seven HIGH defects sits in code the suite covers, and none was caught.'

