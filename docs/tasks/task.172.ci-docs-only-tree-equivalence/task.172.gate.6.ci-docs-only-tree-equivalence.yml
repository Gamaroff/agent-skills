top_issues:
  - id: 'CR6-1'
    severity: medium
    file: 'shared/resources/ci-tree-equivalence.js'
    finding: 'consumedRows counts one row per list element plus every key of a map element, but a map element is one source row per key (the dash shares the first key row), so every list of maps over-counts by one per element and parseConfig refuses the file with exit 2. Reproduced on the documented developBatch.resources (17 rows, parse accounts for 19) and retrospective.identities (6 vs 7) shapes, and on the minimum (7 vs 8); the cycle 4 engine accepted all of them. Fails closed (the three callers read any non-zero exit as not tree-equivalent), so the loss is the shortcut for every consumer that configures those documented keys. A regression introduced by cycle 5.'
    suggested_action: 'Do not compare counts over the whole file: check completeness only for the rows of the ci block (mappings and lists of scalars, which count exactly), or count a map element as its keys only; test the documented developBatch.resources and retrospective.identities shapes parse to the defaults.'
    suggested_owner: dev
    status: open
  - id: 'CR6-2'
    severity: medium
    file: 'shared/resources/ci-tree-equivalence.js'
    finding: 'The completeness check is an equality, so a row the parse dropped is hidden by any row it counted twice. With a list of maps elsewhere in the file a duplicated opt-out under ci.docsOnly is accepted (reproduced: enabled true then enabled false parses to enabled false; the reverse order silently turns the rule on against the first line). Without the list of maps the same duplicate is refused, which is the case cycle 5 tested. Same root cause as CR6-1.'
    suggested_action: 'Fix with CR6-1: a count that is exact for the rows it covers cannot be offset by rows elsewhere; test the offset shape in both orders.'
    suggested_owner: dev
    status: open

