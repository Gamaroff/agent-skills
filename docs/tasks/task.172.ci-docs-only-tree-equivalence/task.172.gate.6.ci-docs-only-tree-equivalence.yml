task_title: 'One docs-only CI rule at every pipeline CI wait'
gate: CONCERNS
status_reason: 'Cycle 6 scoped review of the cycle 5 fix commit: the three cycle 5 findings are fixed and mutation-proven (re-run by this cycle); no HIGH. Two reproduced MEDIUM findings, both in the completeness check that fix added: its row count over-counts every list-of-maps element, so a valid documented configuration is refused (a regression), and the same over-count lets a dropped row pass when it offsets one.'
reviewer: 'QA Engineer'
