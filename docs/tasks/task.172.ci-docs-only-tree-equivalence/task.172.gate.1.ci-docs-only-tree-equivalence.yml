  - id: 'CR-2'
    severity: high
    file: 'shared/resources/ci-tree-equivalence.js'
    finding: 'reduceChecks counts skipped/neutral as SUCCESS, so an ancestor whose only checks were skipped is a green ancestor. Reproduced by QA (reviewer confidence medium, raised to high by reproduction). Bug: task.172.bug.2.all-skipped-ancestor-reads-green.md'
    suggested_action: 'An ancestor whose checks are all skipped/neutral is NONE; skipped/neutral still pass alongside at least one real success; test both.'
    suggested_owner: dev
    status: open
  - id: 'CR-3'
    severity: medium
    file: 'skills/finalise/SKILL.md'
    finding: 'The Step 7 canonical comment prints reading 1 with a CI_TREE_EQ expansion bound in another shell and reading 2 with no tree-equivalent suffix, so a tree-equivalent reading can be recorded as plain SUCCESS. Bug: task.172.bug.3.step7-comment-drops-tree-equivalent.md'
    suggested_action: 'Add the CI_TREE_EQ_2 suffix to the reading 2 line, state both as re-bound inputs, extend finalise-publish-boundary.test.mjs to assert reading 2.'
    suggested_owner: dev
    status: open

