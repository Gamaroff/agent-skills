task_title: 'One docs-only CI rule at every pipeline CI wait'
gate: FAIL
status_reason: 'Cycle 2 refute pass and safety re-probe: two HIGH ways around the fail-closed property (a red docs ancestor is walked past; an ancestor with a paths-filter success plus skipped jobs reads green) and six MEDIUM gaps. Cycle 1 fixes verified.'
