top_issues:
  - id: 'CR4-1'
    severity: medium
    file: 'skills/finalise/SKILL.md'
    finding: 'The 6c poll latches code-changed, which the engine also returns after walking past a not-yet-green ancestor. The engine returns code-changed after walking past a nearer ancestor that was PENDING, NONE, CANCELLED or (since cycle 3) green but not yet settled. Reproduced: B (code, green 1 h ago), C (code, green 60 s ago), H (docs) gives code-changed, exit 1; the same repository with C 400 s old gives tree-equivalent, exit 0. The poll latches code-changed as final, so the settle window turns a five-minute delay into a permanent loss of the rule for that poll. Bug: task.172.bug.19.poll-latches-a-code-changed-that-is-not-final.md'
    suggested_action: 'The engine reports code-changed only when no nearer ancestor was walked past undecided (so it is final for a pinned head); otherwise it reports no-green-ancestor naming the undecided ancestor and the code path, which the poll re-asks.'
    suggested_owner: dev
    status: open
  - id: 'CR4-2'
    severity: medium
    file: 'shared/resources/ci-tree-equivalence.js'
    finding: 'A config blob that parses to no mapping, or is not a regular file, is treated as not configured. skills-config.yaml committed as a symlink (mode 120000) to a file holding `enabled: false`: git show returns the link text, the YAML subset yields nothing and the owner opt-out is ignored (reproduced, exit 0). `parseConfig("ci docsOnly\nenabled false")` and a top-level list also give the defaults. Empty file and unparseable file report one value. Bug: task.172.bug.20.config-blob-that-parses-to-nothing-gets-the-defaults.md'
    suggested_action: 'parseConfig refuses text with significant lines that does not parse to a mapping; readConfigAtCommit refuses a blob that is not a regular file (modes 120000 and 160000).'
    suggested_owner: dev
    status: open

