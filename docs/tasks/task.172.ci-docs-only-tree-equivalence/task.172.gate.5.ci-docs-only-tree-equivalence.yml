top_issues:
  - id: 'CR5-1'
    severity: medium
    file: 'shared/resources/ci-tree-equivalence.js'
    finding: 'A UTF-8 BOM defeats the configuration parse whenever anything precedes the ci key. The YAML subset counts the BOM as one column of indent on the first row, so ci at column 0 ends the mapping and is never read. Reproduced: BOM, then version: 2, then ci with docsOnly.enabled false, gives enabled true; the same file without the BOM gives false. A BOM followed by a --- marker is refused as does not parse to a mapping (fails closed, rejects an ordinary file). The cycle 4 BOM test puts ci first, which hides it. Bug: task.172.bug.21.bom-defeats-the-config-parse.md'
    suggested_action: 'Strip a leading U+FEFF once in parseConfig before the significance check and the parser; test a BOM with another key before ci, and a BOM with a --- marker.'
    suggested_owner: dev
    status: open
  - id: 'CR5-2'
    severity: medium
    file: 'shared/resources/ci-tree-equivalence.js'
    finding: 'Rows the parse does not consume are dropped silently. The subset ends a block at a dedent without an error. Reproduced: enabled indented to sit beside docsOnly (a key directly under ci) gives enabled true; a first row indented deeper than a later ci row drops ci. Each is an opt-out the owner wrote and the engine ignores; this is the class cycles 1 to 4 closed one spelling at a time. Bug: task.172.bug.22.unconsumed-config-rows-are-dropped.md'
    suggested_action: 'Fail closed on the class: refuse any key under ci other than docsOnly, and refuse a configuration whose parsed structure does not account for every significant row.'
    suggested_owner: dev
    status: open
  - id: 'CR5-3'
    severity: medium
    file: 'shared/resources/ci-tree-equivalence.js'
    finding: 'The cycle 4 mode check runs git ls-tree relative to the working directory while the unchanged git show read is relative to the repository root. With --workspace-root set to a subdirectory the ls-tree finds nothing and the defaults apply, so a root configuration holding enabled false is not seen (reproduced; before cycle 4 the read used the root). Latent: no skill passes --workspace-root, but the option is in the usage text. A regression introduced by the previous cycle fix. Bug: task.172.bug.23.config-ls-tree-anchored-to-cwd.md'
    suggested_action: 'Anchor both reads to the same place (run them with the repository top level as the working directory, or --full-name with a :/ pathspec); test --workspace-root on a subdirectory with the config at the root.'
    suggested_owner: dev
    status: open

