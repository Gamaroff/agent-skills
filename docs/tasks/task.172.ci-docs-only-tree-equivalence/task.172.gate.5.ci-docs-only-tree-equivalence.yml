status_reason: 'Cycle 5 scoped review: cycle 4 fixes verified (both reproduced findings fixed, mutation-proven); no HIGH. Three reproduced MEDIUM findings, all in reading skills-config.yaml: a leading BOM defeats the parse when anything precedes ci, rows the parse does not consume are dropped silently, and the new mode check is anchored to the working directory while the read is anchored to the repository root.'
