top_issues:
  - id: 'CR8-1'
    severity: low
    file: 'shared/resources/ci-tree-equivalence.js'
    finding: 'checkCommand is spawned detached so its whole process group can be killed when it ends or times out, but a detached child is in its own session, so a SIGINT sent to the engine process group (Ctrl-C, a host killing the group) no longer reaches it: reproduced with a real spawnSync, where a foreground sleep in the check survived the group SIGINT in detached mode and died in the same-group mode. The group kill only runs after spawnSync returns, and spawnSync blocks the event loop, so a JS signal handler cannot run during the wait. The engine own check timeout fires first in normal use (570 s against a 600 s tool limit); the residual is an interrupt or an external kill during the wait.'
    suggested_action: 'Document the residual in configuration.md, or run the check through an async spawn with SIGINT/SIGTERM handlers that call killProcessGroup (the injected spawn is synchronous today, so that is a wider change).'
    suggested_owner: dev
    status: closed
    resolution: 'carried to recommendations.future (route 2b)'

