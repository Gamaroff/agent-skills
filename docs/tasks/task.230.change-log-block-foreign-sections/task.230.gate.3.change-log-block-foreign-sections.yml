top_issues:
  - id: 'TASK-230-CR3-1'
    severity: medium
    file: 'shared/resources/change-log.js'
    finding: 'With a heading and no table in the log''s own section, runs.find(logShaped) takes the first run whose header has Date plus any one LOG_HEADER_CELLS entry, so a DoD sign-off table headed "| Date | Reviewer | Author | Result |" becomes the log: its row "| 2026-05-05 | qa | dev | PASS |" is written as history and the DoD heading is lifted bare (reproduced).'
    suggested_action: 'Rank candidates rather than take the first log-shaped run: prefer a header naming Date and Version or Description, so Date plus Author alone no longer qualifies; add a K-test with a Date/Author sign-off table under the DoD section.'
    suggested_owner: dev
  - id: 'TASK-230-CR3-2'
    severity: medium
    file: 'shared/resources/change-log.js'
    finding: 'In a headingless block, a log-shaped table under a foreign heading beats an own-section table that holds entry rows: an own "| When | Version | What | Who |" log loses to a "## QA Sign-off" table headed "| Date | Author | Verdict |", whose PASS row is written as history (reproduced; the cycle-2 head 2b36cf52 chose the own-section run).'
    suggested_action: 'In the headingless branch, consider own-section runs (log-shaped, then entry rows) before any run under a foreign heading.'
    suggested_owner: dev
  - id: 'TASK-230-CR3-4'
    severity: low
    file: 'shared/resources/change-log.js'
    finding: 'The repeated-heading drop matches a Change Log heading at any level, so a deeper "### Change Log" subsection under an H2 log loses its heading line on the first write (reproduced), against the module rule that a machine write never deletes human text.'
    suggested_action: 'Drop only a repeated Change Log heading at the log''s own level; keep a deeper one as a nested heading.'
    suggested_owner: dev

