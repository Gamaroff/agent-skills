task: 'task.155.qa-results-section-engine'
task_title: 'QA Testing Results section: one write engine, one placement, refused when duplicated'
gate: PASS
status_reason: 'The PR review 1 fixes hold: CR-1 and CR-2 are each mutation-proven by a committed test, and pr_number is set. A 1,837-document corpus dry run and the story-template ### Change Log shape found no deletion. Three new low findings remain: whitespace growth, a stale tail from a section carrying a Change Log subheading, and stacking under an unclosed fence. None occurs in any document these skills write.'
reviewer: 'QA Engineer'
head: '182367eee7dcef174a391b3a0b77afd14a3ed14b'
updated: '2026-09-30T20:00:28Z'

top_issues:
  - id: 'REL-009'
    severity: low
    status: closed
    resolution: carried to recommendations.future (route 2b)
    file: 'shared/resources/qa-results.js'
    finding: 'Code-review CR-1 (rated medium, high confidence). The CR-2 trailing-break strip removes the break but leaves the blank line before it. A section ending \n\n---\n therefore grows the document by one blank line per replace, measured at EOF and before an anchor. A following Change Log write absorbs it (0 growth over 5 cycles in the task-marker, story ## and story ### shapes). H2 counts only ---, so it cannot see this. Whitespace only, nothing deleted, and no Step 12 template renders a trailing ---.'
    suggested_action: 'Trim trailing whitespace again after removing the break, and make H2 assert the exact bytes between the section and the next heading across cycles.'
    suggested_owner: dev
  - id: 'REL-010'
    severity: low
    status: closed
    resolution: carried to recommendations.future (route 2b)
    file: 'shared/resources/qa-results.js'
    finding: 'Code-review CR-2 (rated medium, high confidence), a regression from 182367ee. The new marker-less bound uses findChangeLog, which returns the first Change Log heading. When the document has no marker block and the section precedes the real log or there is none, a section carrying its own ### Change Log subheading becomes the log, and each replace keeps the old tail (3 writes left 3 tails; 6bf14169 left 1). Duplication, not deletion. 0 of 155 corpus sections carry the subheading, and neither Step 12 template renders one.'
    suggested_action: 'Return bad-section from normaliseSection when the body contains an unprotected change-log RE_HEADING, so the section content can never set the bound.'
    suggested_owner: dev
  - id: 'REL-011'
    severity: low
    status: closed
    resolution: carried to recommendations.future (route 2b)
    file: 'shared/resources/qa-results.js'
    finding: 'When an unclosed fence runs to the end of the document and no change log or anchor lies outside it, created appends the section inside the fence. findQaResults cannot see it, so every write creates another copy (3 writes, 3 copies) and multiple never fires. The same happens at 6d6c166d. The corpus has 2 such documents, a story plan and a task bug report; neither is a Step 12 target, and no story, task or epic work item has this shape.'
    suggested_action: 'After inserting, re-run findQaResults and refuse (for example reason unplaceable) unless exactly one section is found, writing nothing.'
    suggested_owner: dev

