task_title: 'QA Testing Results section: one write engine, one placement, refused when duplicated'
gate: CONCERNS
status_reason: 'All five cycle-1 fixes hold and are mutation-proven, and the engine replaces all 155 tracked corpus sections cleanly, but the REL-002 fix introduced a regression (a legitimate section after a finished change log that quotes a Date|Version table is relocated and leaves a stale tail behind) and does not cover legacy log headers, which still lose every row.'
reviewer: 'QA Engineer'
head: '99838ae868c4793d572e028dbbfec6b18ed929e6'
updated: '2026-09-30T19:18:04Z'

top_issues:
  - id: 'REL-004'
    severity: medium
    file: 'shared/resources/qa-results.js'
    finding: 'The REL-002 rule `logFollows = block || (changeLog && changeLog.start < start)` fires for any section placed after the change log, including after a finished marker-less table and after a closed marker block (hasMarkers is never checked). A legitimate section that quotes a `| Date | Version |` table is cut at that table and reported `relocated`, and its stale tail stays behind the log, under `## Change Log` when there are no markers. Reproduced on the fixed engine; the engine at 6d6c166d returned `replaced` cleanly on both shapes, so this is a regression from cycle 1 (CR-1).'
    suggested_action: 'Treat a marker-less section as misplaced only when the change-log heading has no table of its own before the section (the heading''s body up to the section is blank), and never when markers exist and the section is outside every block; add F4 variants with a quoted Date|Version table for both the marker-less and the closed-marker shape.'
    suggested_owner: dev
    status: open
  - id: 'REL-005'
    severity: medium
    file: 'shared/resources/qa-results.js'
    finding: 'RE_LOG_HEADER matches only `| Date | Version |`, so the REL-002 layout over a log with a legacy header (`| Date | Change | Author |`) is still classed `replaced`, and the write deletes every Change Log row. Reproduced: 2 rows before, 0 after. The REL-002 fix is incomplete for headers change-log.js already accepts (CR-2).'
    suggested_action: 'End the misplaced span at the first unprotected log table row, using change-log.js''s header vocabulary (Date|Version|Description|Author|Change) or its exported RE_ENTRY_ROW, rather than the single canonical header; add a legacy-header twin of F2.'
    suggested_owner: dev
    status: open
  - id: 'REL-006'
    severity: low
    file: 'shared/resources/qa-results.js'
    finding: 'In a genuine REL-002 layout where the misplaced section itself quotes a `| Date | Version |` table, the span is cut at the section''s own table rather than the log''s header, so relocation moves only the section''s head and leaves its remaining stale lines inside the Change Log above the real rows (CR-3, reproduced; the pre-fix engine deleted the rows instead, so this is better but not correct).'
    suggested_action: 'Cut at the header that starts the log''s own entry rows (the last matching header before the other end candidates), not the first match after the section heading.'
    suggested_owner: dev
    status: open

