top_issues:
  - id: 'REL-015'
    severity: medium
    status: open
    file: 'shared/resources/qa-results.js'
    finding: 'RE_LOG_HEADING accepts only \d+\.? numbering, while change-log.js RE_HEADING accepts \d+(?:\.\d+)*[.)]? (### 1.5 Change Log, ### 2) Change Log). Deletion (code-review CR-1): a section with a hand-written stray fence, closed by a later ```bash block, above a marker-less ### 1.5 Change Log with no H2 between returns replaced and deletes the heading and its rows. Placement (CR-2): with ### 1.5 or ## 12) Change Log directly above the markers, created still lands between heading and marker (the REL-013 stranding). 0 tracked task/story/epic documents have a dotted- or paren-numbered log heading (only the onboarding PRD, which QA never writes), and the first Step 12 upsertChangeLog wraps a marker-less log in markers, which the guard catches. The reviewer rated CR-1 high/high; QA re-rated the merged finding medium on these measurements.'
    suggested_action: 'Build the log-heading check from change-log.js RE_HEADING numbering grammar at every heading level and use that one predicate in both removesStructure and canonicalOffset; add J-tests with ### 1.5 Change Log for the deletion and placement cases.'
    suggested_owner: dev
  - id: 'REL-016'
    severity: low
    status: open
    file: 'shared/resources/qa-results.js'
    finding: 'False refusal (code-review CR-3): because the guard ignores fences, a fenced "# comment" line (bash or yaml) in a new section is bad-section, and an existing section with one makes every later write unbounded, so Step 12 halts. Nothing is deleted. 0 of 155 tracked sections contain a fence, and neither Step 12 template renders one. The Deferred Work and CHANGELOG describe the trade as a fenced "## Example", which understates it.'
    suggested_action: 'Name fenced # comment lines in the Deferred Work trade and in the Step 12 templates (no fenced blocks in the section), or exempt # lines inside a fence the section itself opens and closes.'
    suggested_owner: dev
  - id: 'REL-017'
    severity: low
    status: open
    file: 'skills/qa-task/SKILL.md'
    finding: 'Stale prose (code-review CR-4): qa-task SKILL.md:1365 and qa-story SKILL.md:1887 still say unbounded means an unclosed fence. Since 3056978c it also means the text a write would remove carries a change-log marker, an H1/H2 or a log heading, and the halt message carries no detail, so an operator is pointed at the wrong repair.'
    suggested_action: 'Update both Step 12 descriptions, and return the offending line or a sub-reason with unbounded and bad-section so the halt message can name it.'
    suggested_owner: dev

