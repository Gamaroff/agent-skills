task: 'task.155.qa-results-section-engine'
task_title: 'QA Testing Results section: one write engine, one placement, refused when duplicated'
gate: FAIL
status_reason: 'CR-1 is closed only for a fence that runs to the end of the document. A stray fence in the section that a LATER fenced block closes still deletes the Change Log block and every section up to the next heading after that block, reported as replaced, because checked() counts sections and never compares what surrounds them (REL-012, high).'
reviewer: 'QA Engineer'
head: '07e0d85412e934a286a439a0a29de474c0712053'
updated: '2026-09-30T20:32:02Z'

top_issues:
  - id: 'REL-012'
    severity: high
    status: open
    file: 'shared/resources/qa-results.js'
    finding: 'unclosedFence() only flags a fence that runs to EOF. When an existing section holds a stray fence and any later fenced block in the document closes it (the later block''s own closing ```), the fence range is closed, so the section is not unbounded. Every heading and change-log marker inside that range is protected, rawEnd moves to the first heading after the later block, and replace (or relocate) deletes the whole Change Log block and the sections between. The result reports replaced, and checked() passes because it only counts sections. Reproduced: marker doc -> change-log-start/end, the dated row and ## Dev Notes lost; marker-less doc -> the ## Change Log table lost; a section inside the log -> the markers and the original row lost. Corpus: a stray fence injected under the heading of each of the 155 tracked sections gives 153 unbounded and 2 replaced, and the 2 replaced delete content: task.90 loses 8,092 bytes and task.96 loses 16,657 bytes including its Change Log. The trigger needs a hand-written stray fence (0 of 155 sections have one today, and the engine now refuses to write one), which is the same trigger class PR review 2 rated HIGH as CR-1(b).'
    suggested_action: 'Treat as unbounded any fence that opens inside the section and whose range covers a line the span would otherwise have ended at (an H1/H2, a change-log marker, a marker-less log heading, found without that fence''s protection). Also make checked() compare the change-log marker lines and dated rows outside the old and new section spans before and after the write, refusing unplaceable on any difference. Add a two-block regression test: a stray fence in the section plus a later fenced block, red before the fix.'
    suggested_owner: dev
  - id: 'REL-013'
    severity: medium
    status: open
    file: 'shared/resources/qa-results.js'
    finding: 'Code-review CR-1 (medium, high confidence). When a document puts ## Change Log directly ABOVE <!-- change-log-start --> (6 tracked tasks: 58, 127, 134, 137, 138, 168), canonicalOffset returns the marker offset, so created and relocated place the section between the heading and the marker. The following upsertChangeLog then writes its own heading inside the block, leaving an empty orphan ## Change Log above the QA section. Reproduced on task.168 over 3 cycles: 2 Change Log headings, rows 1 -> 4, none lost. Layout only, nothing deleted.'
    suggested_action: 'When the marker block is preceded (blank lines only) by an unprotected Change Log heading, place the section above that heading; add a heading-above-marker fixture to the unit and wiring tests.'
    suggested_owner: dev
  - id: 'REL-014'
    severity: low
    status: open
    file: 'shared/resources/qa-results.js'
    finding: 'A setext H1/H2 (a line underlined with --- or ===) or an ATX heading indented 1 to 3 spaces after a section is not a boundary, because RE_H1_H2 only matches ATX at column 0. A replace deletes that heading and its body up to the next column-0 heading (reproduced: Setext/------ and "  ## Indented" each lost with their body). 0 of 155 tracked section spans contain either shape. The one near-miss is task.118''s trailing setext underline, which is the gate 4 CR-3 cosmetic.'
    suggested_action: 'Bound the span on setext underlines and 0 to 3-space-indented ATX headings too, or refuse (unbounded) when either appears unprotected in the span.'
    suggested_owner: dev

