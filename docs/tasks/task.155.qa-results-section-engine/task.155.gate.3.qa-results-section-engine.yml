    severity: low
    file: 'shared/resources/qa-results.js'
    finding: 'Code-review CR-1, which the reviewer rated medium with high confidence and QA downgraded to low because it is not plausible in the corpus. A misplaced section that quotes a Date-headed table is cut at its own table in two places: inside a marker block after the log rows (the obs #178 position), and directly under a marker-less log with no table (the task.19/task.22 H3 bullet-log shape). The write reports relocated but leaves the quoted rows and the tail in the log, where change-log.js reads them as entries. Reproduced as P1 and P6. P1 is already present at 6d6c166d, and P6 first appears in cycle 1 (99838ae8). Of the 155 tracked QA sections, 0 quote a Date-headed table, and neither the qa-task nor the qa-story Step 12 template renders one.'
    suggested_action: 'Apply the table cut only when no Date-headed table of the log lies between the log start (block.start or changeLog.start) and the section, and treat a section with no log table after it as a whole-section relocation. Add G-style tests for both positions.'
    suggested_owner: dev
    status: closed
    resolution: carried to recommendations.future (route 2b)
  - id: 'REL-008'
    severity: low
    file: 'shared/resources/qa-results.js'
    finding: 'This regression comes from the REL-006 fix, which changed the table cut from first to last. When a misplaced section precedes a log that holds two Date-headed tables (for example a canonical table plus a legacy | Date | Change | table), the cut lands at the last table, so the first table and its rows go with the section and are deleted (P2: 2 rows became 1, where 99838ae8 kept 2). In the same class, a log whose header is not Date-first (| Date (UTC) |, | Change | Date |) or has no header still loses its rows under a misplaced section (P4, P5; pre-existing since 6d6c166d). There are 0 corpus logs with two Date tables, 0 misplaced sections, and the non-Date-first headers occur only in a PRD and in quoted task prose.'
    suggested_action: 'Cut at the first Date-headed table that starts after the section''s own content rather than the last one in the span. Alternatively, end the span at the first line change-log.js RE_ENTRY_ROW recognises, and add a two-table fixture.'
    suggested_owner: dev
    status: closed
    resolution: carried to recommendations.future (route 2b)

