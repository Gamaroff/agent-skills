task: 'task.155.qa-results-section-engine'
task_title: 'QA Testing Results section: one write engine, one placement, refused when duplicated'
gate: CONCERNS
status_reason: 'The PR-review-3 carry works for every tracked Bug Reports list (11 of 11 kept verbatim through 4 writes) and CR-6/CR-7 changed no behaviour, but the carry takes only the first `### Bug Reports` heading, so a second list in the same section is silently dropped while the write reports `replaced` (REL-020, medium). Three low findings: stale QA fields ride along with the carried list (REL-021), a replace still deletes a create-task template comment that sits inside an old span (REL-022), and a rendered or near-miss heading drops the list with no signal (REL-023).'
reviewer: 'QA Engineer'
head: 'a89f20feb0891fd5e2f4d79963ae403eb65454e7'
updated: '2026-09-30T22:08:13Z'

top_issues:
  - id: 'REL-020'
    severity: medium
    status: open
    file: 'shared/resources/qa-results.js'
    finding: 'Code review CR-1 (bug, medium, high confidence; promoted under code_review_blocking). carriedSubsections (line 137) carries only the FIRST `### Bug Reports` in the old span, and that block ends at the next H1-H3 heading, which is the second `### Bug Reports`. So a section holding two lists loses the second on every replace, and the write reports `replaced`. Reproduced: two lists, then cycles 2-3, left bug.1 and lost bug.2. create-bug-report task-mode Step 5 checks for `## Bug Reports` (H2) but writes `### Bug Reports` (H3), so a literal reading adds a new heading on each call. 0 of the 11 tracked lists have two headings.'
    suggested_action: 'Carry every unprotected `### Bug Reports` block in the removed span, or merge them under one heading. Add a test with two separate headings, and one with a `### Key Findings` after the list; mutation M4 (no end-at-heading stop) reds no test today.'
    suggested_owner: dev
  - id: 'REL-021'
    severity: low
    status: open
    file: 'shared/resources/qa-results.js'
    finding: 'Code review CR-2 (medium/medium). The carried block runs from `### Bug Reports` to the next H1-H3 heading or to the end of the span, so text after the list that is not a heading is carried on every cycle. Repro: with the list directly under `## QA Testing Results`, the previous render''s `**QA Status**` and `**Quality Score**: 10/100` stayed below the current `30/100` through cycles 2-3. This is the obs #92 shape, where stale fields look current. Nothing is deleted. 0 of 11 tracked lists sit above QA fields: 7 are followed by `### Key Findings`, and 4 run to the span end (task.45 carries its change-log lead-in comment, which keeps it).'
    suggested_action: 'End the carried block at the end of the list: the first blank line followed by a line that is neither a list item, a table row nor an H4/bold sub-label. Add the list-under-heading repro as a test.'
    suggested_owner: dev
  - id: 'REL-022'
    severity: low
    status: open
    file: 'shared/resources/qa-results.js'
    finding: 'Found by the inside-the-span measurement. When an old section was hand-placed above the template separator, the span also holds text the create-task template owns, and a replace deletes it. task.117 (tracked, accepted): a replace deletes `---` and the 6-line `<!-- Append-only ... -->` change-log lead-in comment between the section and `<!-- change-log-start -->`. trimSeparator trims only blanks and one break, and the structural guard ignores HTML comments. task.45 has the same shape and survives only because its Bug Reports list is last, so the carry takes the comment along. Engine-created sections land after the comment, so new writes cannot create this shape. The comment does not render.'
    suggested_action: 'In trimSeparator, treat a trailing HTML comment block (plus the break above it) directly before the terminator as separator, not span. Or add it to what the guard refuses, and add a task.117-shaped test.'
    suggested_owner: dev
  - id: 'REL-023'
    severity: low
    status: open
    file: 'shared/resources/qa-results.js'
    finding: 'Code review CR-3/CR-4 (low/medium). The carry keys on one exact line, `^###[ \t]+Bug Reports[ \t]*$`. Two cases lose the list with no signal. (1) `### Bug Reports (1)`, `### Bug reports`, `#### Bug Reports` or a bold `**Bug Reports**` label: reproduced, each dropped on replace. (2) A render that includes its own `### Bug Reports` counts as taking the list over, so a render that lists only this cycle''s bugs drops every earlier link. Test L2 asserts that drop, and neither SKILL.md note warns the renderer. All 11 tracked lists use the exact heading, and neither Step 12 template renders one.'
    suggested_action: 'Match the heading case-insensitively at H3-H4 with an optional trailing count, and merge the old and new lists by link target instead of letting the new one take over. At minimum, state in both Step 12 notes that a rendered `### Bug Reports` must list every earlier bug.'
    suggested_owner: dev

