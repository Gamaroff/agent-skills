    severity: medium
    file: 'shared/resources/qa-results.js'
    finding: 'normaliseSection accepts a rendered section that also carries another H1/H2 (e.g. qa-story''s ## QA Completion Summary); the next write replaces only up to that H2, so it stacks one more copy per cycle (CR-1, reproduced).'
    suggested_action: 'Return bad-section unless the section span in the normalised body reaches the end of the body (no unprotected H1/H2 or change-log marker after its heading); add a unit test.'
    suggested_owner: dev
  - id: 'REL-002'
    severity: medium
    file: 'shared/resources/qa-results.js'
    finding: 'insideChangeLog requires markers, so a section written between a marker-less ## Change Log heading and its table counts as outside the log, its span swallows the table, and replaced deletes every Change Log row (CR-2, reproduced by QA).'
    suggested_action: 'Treat a section directly under a marker-less change-log heading as inside the log (relocate it) or apply the log-header cutoff to every span; add the marker-less twin of unit test D1.'
    suggested_owner: dev
  - id: 'REL-003'
    severity: low
    file: 'shared/resources/qa-results.js'
    finding: 'insideChangeLog is judged against the earliest change-log marker block only, so a section inside a later block (legacy pair plus current pair) is replaced past that block''s end marker, deleting <!-- change-log-end -->.'
    suggested_action: 'Test containment against every unprotected marker block, not only the one findChangeLog returns.'
    suggested_owner: dev

