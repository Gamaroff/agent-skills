    file: 'docs/tasks/task.155.qa-results-section-engine/task.155.qa-results-section-engine.md'
    finding: 'Code review CR-2 (low/high) plus QA. The PR review 3 CR-1 bullet (line 468), edited in 5322ba05, still says task.141''s `### Deferred Work` is QA-owned and replaced whole. The gate 9 bullet (line 470) says it would be replaced on a further QA write. Both contradict the code and the PR review 4 bullet. Two more items: the qa-story SKILL.md insertion (line 1894) lost its 3-space list indentation, and test N2 is named "in document order" although the engine appends in CARRIED_SUBSECTIONS order (probe: Deferred Work before Bug Reports comes back reordered). Effect: cosmetic.'
    suggested_action: 'Rewrite both task.141 sentences to say the block has been carried since PR review 4. Re-indent the two qa-story lines. Rename N2, or assert the fixed order.'
