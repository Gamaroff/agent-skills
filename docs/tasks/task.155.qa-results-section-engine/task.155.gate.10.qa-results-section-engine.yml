  - id: 'REL-029'
    severity: low
    status: waived
    resolution: 'waived by operator rule 2026-10-01 (refuses; 0 corpus instances)'
    file: 'shared/resources/qa-results.js'
    finding: 'Code review CR-3 (low/medium), measured. The new refusal (normaliseSection, line 465) matches any `###`/`####` heading that starts with a carried name, in any case and with any suffix. So a QA render with its own heading, such as `### Bug Reports filed this cycle`, `### Deferred work items considered` or `#### Deferred Work (none this cycle)`, is refused as bad-section and Step 12 halts. The halt has no hint that names this cause, which widens REL-019. Effect: refuses, never deletes. Corpus: 0 QA-owned headings of this shape in the 155 tracked sections. 12 of 155 tracked sections are refused if re-rendered verbatim (the 11 Bug Reports lists and task.141): that is the intended rule, but an agent that keeps the list will halt with no hint. Both Step 12 templates are accepted.'
    suggested_action: 'Refuse only the exact carried heading, with an optional numeric suffix. Add a bad-section hint to both Step 12 HALT messages that names a carried block in the render as one cause.'
    suggested_owner: dev
  - id: 'REL-030'
    severity: low
    status: waived
    resolution: 'accepted by explicit operator decision 2026-10-01 (deletes a bold Deferred Work label inside the section; 0 instances); fix moved to source in a follow-up task'
    file: 'shared/resources/qa-results.js'
    finding: 'PC-1 residue, the Deferred Work analogue of REL-027. The route-2/2b step says to record ids "on the work item under **Deferred Work**" and names no heading or position. A bold `**Deferred Work**:` label inside the QA section is not carried, so a replace deletes the record while the write reports `replaced` (probe). Effect: deletes. Corpus: 0 bold Deferred Work labels inside a tracked QA section. Both halves of the trigger are observed separately: task.140 recorded route 2b as a bold label (in `## Implementation Summary`), and task.141 recorded it inside its QA section (as `###`, now carried). Not a regression: before 5322ba05 every Deferred Work block in the section was deleted.'
    suggested_action: 'Name a heading and a position outside the QA section in develop-pipeline-step-5-6-qa-loop.md routes 2/2b (for example `## Deferred Work` after Rollback), or carry a bold label as well as a heading.'
