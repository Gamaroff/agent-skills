    severity: low
    status: waived
    resolution: 'waived by operator rule 2026-10-01 (duplicates, 0 corpus instances)'
    file: 'shared/resources/qa-results.js'
    finding: 'Code review CR-1 (medium/high; promoted and re-rated low on evidence) and CR-4 (low/high). trimSeparator (line 248) treats any trailing HTML comment as a separator, not only a template lead-in before the log. A render ending in `<!-- qa-results-end -->` gains one copy per cycle (4 copies after 4 writes; not idempotent). An old section''s own trailing comment is left behind, stale. When the last line ends in `-->`, the scan walks back to an earlier unrelated comment line, and the content between them stays after the new section. Effect: duplicates, never deletes. Corpus: 0 of 156 tracked sections hold a comment line after the peel, 0 end in `-->`, and neither Step 12 template renders a comment. Regression from the gate-8 engine.'
    suggested_action: 'Peel only a comment that directly precedes the change-log block or its heading, and only when the lines from `<!--` to `-->` form one comment. Add a replace-twice test with a trailing comment.'
    suggested_owner: dev
  - id: 'REL-025'
    severity: low
    status: waived
    resolution: 'waived by operator rule 2026-10-01 (duplicates, 0 corpus instances)'
    file: 'shared/resources/qa-results.js'
    finding: 'Code review CR-2 (medium/high; promoted and re-rated low). collectBlocks (line 149) ends a block only at a heading of level 1 to 3 or a template field line. So a `#### Bug Reports` block carries QA''s own later `####` subsections, such as stale `#### Recommendations` text, on every cycle. The REL-021 residue has the same effect: a non-template field line or paragraph after a list at the end of the section is carried. Effect: duplicates stale text, never deletes. Corpus: 0 tracked `#### Bug Reports` headings, and 0 of 11 tracked lists carry non-list text.'
    suggested_action: 'End a carried block at the next heading at or above its own level, and at the end of the list.'
    suggested_owner: dev
  - id: 'REL-026'
    severity: low
    status: waived
    resolution: 'waived by operator rule 2026-10-01 (deletes link-less structure lines only when a render brings its own Bug Reports list, which no Step 12 template does - 0 plausible instances)'
    file: 'shared/resources/qa-results.js'
    finding: 'Code review CR-3 (medium/medium) and CR-5 (cleanup). When the render brings its own `### Bug Reports`, mergeCarried (line 197) keeps only old lines that name a link the render lacks. Old lines with no link are dropped: `#### Open Bugs`, `- None`, a table header, bold group labels. A multi-link old line is re-added whole when any one of its links is missing, which duplicates an entry the render already has. Table rows are spliced under a bullet list. Effect: deletes structure and linkless lines and duplicates entries; no bug link is lost. Corpus: 0 on the path, because neither Step 12 template renders a Bug Reports list. With a rendered list, tasks 116, 42, 76 and 94 would lose 12 structure lines, and task.120''s two-link line would duplicate.'
    suggested_action: 'Key an entry by its first link and carry the old block''s unmatched remainder whole, or state in both Step 12 notes that a render must not include a Bug Reports list.'
    suggested_owner: dev
  - id: 'REL-027'
    severity: low
    status: waived
    resolution: 'waived by operator rule 2026-10-01 (deletes only under a non-standard label no writer produces - 0 corpus instances)'
    file: 'shared/resources/qa-results.js'
    finding: 'REL-023 residue. The heading pattern (line 138) matches `### Bug reports`, `#### Bug Reports` and `### Bug Reports (1)`. It does not match the bold `**Bug Reports**` label that gate 8 named, `### Bug Report` (singular) or `### Bugs`. In those three cases the list is dropped while the write reports `replaced` (probe). Effect: deletes. Corpus: 0 lists that create-bug-report wrote use these shapes (it writes the exact `### Bug Reports`). There is 1 QA-owned bold label, in task.83''s `### QA Reports`.'
    suggested_action: 'Match a bold label and the singular form, or make the exact `### Bug Reports` heading a stated contract in create-bug-report Step 5.'
    suggested_owner: dev

