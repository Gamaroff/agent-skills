      is why the boundary was probed rather than assumed: every extracted span still passes through
      `classifyBlock`, and the whitespace bound fails toward running less.
  performance:
    status: PASS
    notes: >-
      Extraction is a single O(lines) pass plus one fence mask; measured across 182 corpus files in
      well under a second in one process. Execution cost scales with runnable blocks, and the corpus
      measurement shows the change adds 2 runnable blocks in total across the whole tree.
  reliability:
    status: PASS
    notes: >-
      Rollback plan present, tested in substance: the change is additive (a second extractor merged
      into one stream, plus one field), and reverting the merge was performed three times during the
      mutation proof — each revert restored fenced-only behaviour and turned the expected tests red.
      Malformed input degrades rather than throws: a header with no delimiter row is not a table, a
      short body row is skipped, an unterminated fence masks conservatively.
  maintainability:
    status: PASS
    notes: >-
      Every non-obvious rule carries its reason in a comment tied to the incident that produced it
      (the pipe escape, the whitespace bound, the fence mask, the two disagreement channels). Rule doc
      §1a and §3 updated in the same change. Two cleanups noted below, neither structural.

