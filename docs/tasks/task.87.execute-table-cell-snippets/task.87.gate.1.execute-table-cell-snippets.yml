task: 'task.87.execute-table-cell-snippets'
task_title: 'Shell commands in table cells escape the snippet-execution gate'
gate: CONCERNS
status_reason: 'All 4 phases complete, 117/117 tests green, mutation-proved three ways, and the full CI tier passes. One demonstrated defect: a command is silently dropped when a sibling cell in the same row carries an unescaped pipe — the same silent-skip shape this engine exists to eliminate, reached through a different door.'
reviewer: 'QA Engineer'
updated: '2026-09-09T19:15:00Z'

top_issues:
  - id: 'TASK87-001'
    severity: medium
    file: 'shared/resources/qa-execute-snippets.mjs'
    finding: >-
      A runnable command in a well-formed command-column cell is silently dropped when ANOTHER cell in
      the same row contains an unescaped pipe inside a code span. Reproduced by execution:
      `| `a|b` | `echo shifted` |` splits to ["`a", "b`", "`echo shifted`"], so the command column
      index (1) reads "b`" and `echo shifted` is never extracted. The file reports zero blocks, zero
      findings and no note — indistinguishable from a document with no commands in it. GFM does split
      an unescaped pipe this way, so the behaviour is spec-conformant for RENDERING; it is wrong for
      this engine, whose entire purpose is to stop a command escaping the gate unseen.
    suggested_action: >-
      Track backtick state in `splitTableRow` so a pipe inside an open code span is content, not a
      delimiter. Header and body rows go through the same splitter, so column indices stay consistent;
      the change can only ever extract MORE, never mis-target, because a code span's text is exactly
      what the author wrote. Add a test using the reproduced row above.
    suggested_owner: dev
    status: open

