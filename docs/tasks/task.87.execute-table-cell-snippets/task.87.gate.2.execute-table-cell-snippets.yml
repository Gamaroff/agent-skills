nfr_validation:
  security:
    status: PASS
    evidence: measured
    probes_executed: 14
    notes: >-
      Seven probes in cycle 1 plus seven refute-pass probes in cycle 2, all EXECUTED. Cycle 2 covered
      the four transition classes the refute directive names, translated to a pure text extractor:
      end-of-input (a span left open at end of line), in-flight state (spanLen carried across
      characters and never leaking between rows), the error path (six pathological inputs including a
      2000-backtick string and a bare pipe — none threw, none hung), and re-entrancy (two calls
      byte-identical). Also probed for scale: 5000 rows extracted in 22ms. The safety boundary itself
      is still untouched by this diff; SAFE_COMMANDS, COMMAND_RUNNERS, the deny-list and the sandbox
      sentinel are unchanged and their pre-existing tests all pass.
  performance:
    status: PASS
    notes: >-
      5000-row document extracted in 22ms; 182 corpus files scanned in under a second in one process.
      The code-span tracking adds one integer of state and consumes each character once.
  reliability:
    status: PASS
    notes: >-
      Six pathological inputs probed for throw and hang: a bare pipe, four consecutive pipes, fifty
      repetitions of a pipe-backtick pair, a 2000-character backtick run, a 999-backtick cell, and a
      row of bare backslashes. None threw; the longest took 4ms. Two independent fallbacks are in
      place — the unclosed-span fallback in the splitter and the naive-split path behind it — and
      both are mutation-proven.
  maintainability:
    status: PASS
    notes: >-
      Both cleanups from gate 1 were done rather than deferred. Every rule that diverges from GFM
      carries the incident that produced it. The rule doc now documents the code-span rule, the
      escaped-backtick guard, the fallback, and the two accepted limitations.

