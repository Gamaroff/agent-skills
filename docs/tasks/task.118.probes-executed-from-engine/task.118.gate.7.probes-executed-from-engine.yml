status_reason: 'The cycle-6 mechanism replacement is verified: no lock code remains, three concurrent runs converge to three entry files, four mutation proofs covered. The scoped cycle-7 review found one real edge in the new code — emit mode rewrites the snapshot outside its try, so a read-only snapshot directory throws out of main with exit 1 and no block (reproduced) — plus a legacy-snapshot silence (reproduced: snapshot with no entry directory reads as no record) and a fold that does not dedupe by key, and five cleanups (stale docstrings and test residue from the lock era). First cycle whose findings are about the new mechanism rather than the lock.'
