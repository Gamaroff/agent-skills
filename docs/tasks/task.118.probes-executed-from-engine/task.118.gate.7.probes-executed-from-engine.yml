top_issues:
  - id: 'CR7-1'
    severity: medium
    file: 'shared/resources/security-probe.mjs'
    finding: 'In --emit-block mode writeSnapshot sits outside the try/catch that guards readRecord; on a read-only snapshot directory writeAtomic throws out of main, Node prints a stack trace, exit 1 (the "does not engage" code) and no block is printed although every entry was readable. Reproduced (chmod 500 the record dir → exit 1, stack trace).'
    suggested_action: 'The snapshot is a reader convenience: in emit mode catch the write failure, warn on stderr, and still print the block with exit 0.'
    suggested_owner: dev
    status: open
  - id: 'CR7-2'
    severity: low
    file: 'shared/resources/security-probe.mjs'
    finding: 'readRecord returns null when <path>.d is absent without looking at <path>, so a snapshot with no entry directory — any record written before the cycle-6 layout, or one whose entry directory was removed — reads as "no record" (reasoned / 0) and is silently overwritten by the next --record. Reproduced. Contradicts the stated rule that a record which exists but cannot be read is a finding, not an empty one.'
    suggested_action: 'When the entry directory is ENOENT but <path> exists, throw a "snapshot without entries — re-run the probes" error so it fails loudly at exit 2.'
    suggested_owner: dev
    status: open

