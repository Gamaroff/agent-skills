top_issues:
  - id: 'CR3-1'
    severity: medium
    file: 'shared/resources/security-probe.mjs'
    finding: 'yamlStr emits a value ending in ":" bare (":" is in the safe class and not an indicator START); `name: foo:` is a YAML syntax error in both js-yaml and yaml, so --name x: or --call-site x.ts: (line omitted) renders a security_review block no gate can parse.'
    suggested_action: 'JSON-quote when the string ends with ":" (and, to be safe, when it contains ": " or " #"), and add the case to the quoting test.'
    suggested_owner: dev
    status: open
  - id: 'CR3-3'
    severity: low
    file: 'shared/resources/security-probe.mjs'
    finding: 'LOCK_TIMEOUT_MS (20 s) is shorter than LOCK_STALE_MS (30 s): a waiter arriving less than 10 s after a holder dies times out with exit 2 before the lock becomes reclaimable — the reclaim path is unreachable in the window it exists for.'
    suggested_action: 'Make the wait timeout exceed the stale window by at least one retry interval, or re-check staleness once before throwing.'
    suggested_owner: dev
    status: open
  - id: 'CR3-4'
    severity: low
    file: 'shared/resources/security-probe.mjs'
    finding: 'YAML_TYPED_SCALAR integer branch is (?:0|[1-9][0-9]*), so a leading-zero scalar such as 007 or 0123 is emitted bare and resolves to an integer in both js-yaml (octal) and yaml — the --name stays-a-string guarantee is broken for that form.'
    suggested_action: 'Use the YAML 1.2 core-schema forms ([-+]?[0-9]+ for int; the matching float form) and add 007 to the typed-scalar test.'
    suggested_owner: dev
    status: open

