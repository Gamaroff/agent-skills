top_issues:
  - id: 'CR-1'
    severity: medium
    file: 'shared/resources/security-review-prompt.md'
    finding: 'The review-security probe command (§4 Command block; bundled as `node references/security-probe.mjs …`) omits --repo-root, so from an installed copy defaultRepoRoot() is the skill dir, every repo-relative entry fails to import, and the engine records unverifiable / executed: 0 for every control — the exact consumer --repo-root was added for.'
    suggested_action: 'Add --repo-root "$(git rev-parse --show-toplevel)" to the §4 command and to review-security SKILL.md step 5, matching the finalise / qa-task / qa-story sites, and guard it with a test.'
    suggested_owner: dev
    bug_ref: 'task.118.bug.1.review-security-command-omits-repo-root.md'
    status: open
  - id: 'CR-2'
    severity: low
    file: 'shared/resources/security-probe.mjs'
    finding: 'emitBlock dereferences record.totals.executed while readRecord validates only version and controls, so a version-1 record without totals throws an uncaught TypeError (exit 1, not the documented 2); and a record whose totals.executed is hand-edited to 12 with controls: [] renders evidence: measured, which the forged-case test comment claims is impossible.'
    suggested_action: 'Derive evidence and the block totals from totalsOf(record.controls) rather than trusting the file, and have readRecord reject a record whose totals is missing or not an object.'
    suggested_owner: dev
    status: open
  - id: 'CR-3'
    severity: low
    file: 'skills/review-security/tests/review-security.test.js'
    finding: 'The --repo-root test, finalise-dod-security-prompt.md:138, CHANGELOG and the task docs say a repo-relative entry is "declined as an escape" from a nested copy, but resolveEntry returns ok: true for the contained-but-nonexistent path and the unverifiable comes from entry-not-probeable — the test passes for a reason other than the one its message asserts.'
    suggested_action: 'Assert without.reason === "entry-not-probeable" alongside the verdict, and reword the four "declined as an escape" claims to "resolves under the skill dir and cannot be imported".'
    suggested_owner: dev
    status: open

