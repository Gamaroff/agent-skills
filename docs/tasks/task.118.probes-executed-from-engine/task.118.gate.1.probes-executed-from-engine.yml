status_reason: 'Engine, readers and population test are in place and mutation-proven; the code review found the review-security probe command itself omits --repo-root (inoperable from an installed copy), emitBlock trusts a record totals field it could recompute, and the --repo-root test passes for a different reason than its message states. All three are bug + high-confidence under code_review_blocking; none is HIGH.'
