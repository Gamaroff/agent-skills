status_reason: 'Cycle-1 fixes verified (CR-1..3 FIXED, each mutation-proven). The cycle-2 refute pass found the record merge is last-writer-wins under concurrent --record runs (reproduced: 3 runs → 1 control), a null control element crashes emit-block with exit 1, and yamlStr leaves YAML-typed scalars bare. No HIGH; one MEDIUM and two LOW, all high-confidence, gating under code_review_blocking.'
