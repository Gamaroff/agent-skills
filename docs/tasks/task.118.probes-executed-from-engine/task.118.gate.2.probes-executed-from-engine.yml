top_issues:
  - id: 'CR2-1'
    severity: medium
    file: 'shared/resources/security-probe.mjs'
    finding: 'recordRun is an unlocked read-filter-push-rename, so concurrent engine invocations sharing one --record each read the pre-existing file and the last rename drops the others — reproduced with 3 parallel runs yielding 1 control; --emit-block then undercounts probes_executed and omits a probed control.'
    suggested_action: 'Serialise the merge with an exclusive lock file (O_EXCL create, bounded retry) around read → merge → rename, and add a test that runs N probes concurrently against one record and asserts N controls.'
    suggested_owner: dev
    bug_ref: 'task.118.bug.2.record-merge-last-writer-wins.md'
    status: open
  - id: 'CR2-2'
    severity: low
    file: 'shared/resources/security-probe.mjs'
    finding: 'readRecord validates only that controls is an array, so {controls:[null]} passes and totalsOf throws an uncaught TypeError from emitBlock, which main calls outside the try that maps corrupt records to exit 2 (verified: exit 1 with a stack trace); a control whose executed is a string renders probes_executed via concatenation.'
    suggested_action: 'Validate each control in readRecord (plain object; Number.isInteger(executed) >= 0; integer reproduced) and reject the file with the existing not-a-record error.'
    suggested_owner: dev
    status: open
  - id: 'CR2-3'
    severity: low
    file: 'shared/resources/security-probe.mjs'
    finding: 'yamlStr leaves values YAML types as non-strings bare — --name 123 renders name: 123 and --call-site true renders call_site: true (verified), so a YAML consumer reads an int/bool for a string the agent passed.'
    suggested_action: 'JSON-quote any value matching the YAML core-schema scalar forms (integer, float, true/false/yes/no/on/off, null/~) in addition to the indicator-start rule.'
    suggested_owner: dev
    status: open

