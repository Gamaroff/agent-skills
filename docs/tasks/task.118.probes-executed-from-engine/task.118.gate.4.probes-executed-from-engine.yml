top_issues:
  - id: 'CR4-1'
    severity: low
    file: 'shared/resources/security-probe.mjs'
    finding: 'reclaimStaleLock renames whatever is at the lock path without confirming it is the stale file the caller observed: if waiter A reclaims, removes and re-creates a fresh lock between waiter B''s statSync and B''s renameSync, B renames away A''s live lock, returns true, and both enter the critical section. Verified by code reading (QA); the window is a few syscalls after a crashed holder with two waiters.'
    suggested_action: 'Pass the observed mtimeMs into reclaimStaleLock; after the rename, statSync the claimed file and if its mtime is not the observed stale one, rename it back to the lock path and return false. Test: rename a fresh (non-stale) lock in via the observed-mtime mismatch path and assert it is restored and the call returns false.'
    suggested_owner: dev
    status: open
  - id: 'CR4-5'
    severity: low
    file: 'skills/review-security/tests/review-security.test.js'
    finding: 'The fail-fast test asserts the corrupt --record run returned in under 3000 ms; under load (the QA mutation run) it took 5118 ms and failed although the preflight fired first. Wall-clock is not the property — "the probe did not run" is.'
    suggested_action: 'Assert the property directly: stdout is empty (no verdict line was printed) and stderr carries only the cannot-use message; drop the elapsed-time bound.'
    suggested_owner: dev
    status: open

