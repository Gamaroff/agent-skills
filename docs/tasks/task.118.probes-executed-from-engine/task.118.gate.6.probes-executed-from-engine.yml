    finding: 'If writeFileSync(fd, pid) throws after the O_EXCL openSync succeeded (ENOSPC/EIO), the catch rethrows without closing the fd or removing the just-created lock; the empty-body lock reads as alive to lockHolderAlive, so every other engine stalls for LOCK_STALE_MS. Verified by reading: the write sits inside the try whose catch handles only EEXIST.'
