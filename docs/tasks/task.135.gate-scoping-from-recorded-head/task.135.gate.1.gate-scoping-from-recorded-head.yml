top_issues:
  - id: 'CR-1'
    severity: high
    file: 'shared/resources/tests/gate-head-freshness.test.mjs'
    finding: 'Existence and ancestry are asserted for every schema-2 gate in docs/, but develop-batch rebases items before merge and mergeStrategy allows squash/rebase, so a rewritten branch leaves gates naming unreachable heads and the test is red on develop for good. qa-re-review-scope.md also says the pipeline never rebases.'
    suggested_action: 'Judge existence/ancestry/author-time only for gates changed vs the merge-base with the base branch (plus uncommitted ones); keep format checks for all; correct the never-rebases sentence. Bug: task.135.bug.1.'
    suggested_owner: dev
  - id: 'CR-2'
    severity: medium
    file: 'shared/resources/qa-re-review-scope.md'
    finding: 'The Step 3b scope block reads $LATEST_GATE, which only the Phase 0 block binds; in its own shell it is empty, so the block prints "prior gate carries no head: (schema 1)" and runs unscoped. Reproduced under bash and zsh. Same block in skills/qa-task and skills/qa-story Step 3b.'
    suggested_action: 'Bind LATEST_GATE in each Step 3b preamble via qa-cycle.sh --path gate; HALT on cycle 3+ when the gate is not a readable file. Bug: task.135.bug.2.'
    suggested_owner: dev
  - id: 'CR-3'
    severity: medium
    file: 'skills/qa-task/SKILL.md'
    finding: 'Phase 0 CODE_MOVED counts commits only under apps packages shared skills evals, so scripts/, tests/, package.json or a consumer src/ change reads as no movement and a clean PASS gate skips re-review.'
    suggested_action: 'Count every path except docs/ (-- . :(exclude)docs) and treat uncommitted tracked changes outside docs/ as movement. Bug: task.135.bug.3.'
    suggested_owner: dev

