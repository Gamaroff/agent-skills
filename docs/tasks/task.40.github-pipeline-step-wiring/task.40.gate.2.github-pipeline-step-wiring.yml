re_review_context:
  previous_gate: 'task.40.gate.1.github-pipeline-step-wiring.yml (CONCERNS, 90/100)'
  issues_verified:
    - id: 'TASK-40-QA1-01'
      severity: medium
      status: FIXED
      verification: >-
        All 13 reasons reachable from a plain --stage call are now documented
        (transitioned, already, stage-disabled, would-regress, no-option,
        no-options, no-status-field, ambiguous-board, board-unreadable,
        no-repo-context, no-credentials, not-on-board, mutation-failed), each
        individually confirmed present. A catch-all row was added so a reason
        introduced later cannot be undefined. The four reasons that cannot occur
        at this call site (probe, write-failed, exists, dry-run) are explicitly
        named as impossible rather than silently omitted, which is the stronger
        fix. Exactly one table header remains — the first patch left a duplicate
        table and it was removed before commit.
    - id: 'LOW-1 (guard file-scoped)'
      status: FIXED
      verification: >-
        Guard rescoped from file to the fenced block holding the mutation.
        Re-verified in BOTH directions on a second file (step-4): a Status
        mutation inside a code block fails the suite; prose mentioning "Status"
        does not. This closes the exact false-positive class that the
        --allow-regress guard hit during development.
    - id: 'LOW-2 (Priority propagation retry)'
      status: FIXED
      verification: >-
        Ordering requirement documented — the Priority query must run after the
        work-started call, since it carries no item-add or propagation retry and
        relies on ensureOnBoard having already added and read back the item. The
        silent-no-op failure mode is named explicitly.
    - id: 'LOW-3 (not-on-board escalation untested)'
      status: ACCEPTED
      verification: >-
        Not fixed, deliberately. Consistent with how every other escalation in
        finalise is handled (documented branch, no executable assertion), so
        fixing only this one would be inconsistent rather than safer.

