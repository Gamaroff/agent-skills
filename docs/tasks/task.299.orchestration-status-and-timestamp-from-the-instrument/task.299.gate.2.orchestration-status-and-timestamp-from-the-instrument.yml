top_issues:
  - id: 'T299-QA-4'
    severity: medium
    file: 'tests/orchestration-instrument-reads.test.js'
    finding: 'The redirect test is a bare includes(">") over the echo arguments, so `cmd; echo "a > b $?"` passes as redirected. Reproduced by execution; control `cmd; echo "rc=$?"` is flagged and `cmd > l 2>&1; echo "TEST_EXIT=$?" >> l` passes.'
    suggested_action: 'Blank the content of quoted strings before parsing, and treat only a real redirect token as a redirect.'
    suggested_owner: dev
    origin: 'code-review CR-1, reproduced by QA'
    status: open
  - id: 'T299-QA-5'
    severity: medium
    file: 'tests/orchestration-instrument-reads.test.js'
    finding: 'The argument capture stops at the first `;`, `&` or `|` even inside quotes, so `cmd; echo "a || b $?"` and `cmd; echo "x & $?"` lose the `$?`; a single `&` or `|` before the echo is not an operator in the set (`cmd & echo "rc=$?"`). Reproduced by execution.'
    suggested_action: 'Blank quoted content first (same step as T299-QA-4) and widen the leading operator to a single or double `&` or `|`, with a fixture for each.'
    suggested_owner: dev
    origin: 'code-review CR-2, reproduced by QA'
    status: open

