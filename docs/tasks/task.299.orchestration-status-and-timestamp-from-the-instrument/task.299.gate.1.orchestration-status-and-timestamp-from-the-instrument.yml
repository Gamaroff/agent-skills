top_issues:
  - id: 'T299-QA-1'
    severity: medium
    file: 'tests/orchestration-instrument-reads.test.js'
    finding: 'WRAPPED_STATUS misses shapes the header claims or implies: quoted bare `; echo "$?"`, `; echo "exit $?"`, `; echo "EXIT=$?".`, `; echo "rc=$?"; true`, and a trailing comment. Reproduced by running the regex; the control `cmd; echo "rc=$?"` is flagged.'
    suggested_action: 'Allow optional quotes around bare $?, accept [=: ] after the name, and replace the (`|)|$) tail with a check that no redirect follows the echo.'
    suggested_owner: dev
    origin: 'code-review CR-1'
    status: open
  - id: 'T299-QA-2'
    severity: medium
    file: 'tests/orchestration-instrument-reads.test.js'
    finding: 'The status rule needs a literal `;` before the echo, so `cmd && echo "rc=$?"` and `cmd || echo "rc=$?"` are not flagged. Reproduced by execution (control flagged); reviewer confidence medium, promoted under 5d.'
    suggested_action: 'Widen the leading operator to (;|&&|\|\|), or name the restriction in the header list of unseen shapes.'
    suggested_owner: dev
    origin: 'code-review CR-2, reproduced by QA'
    status: open
  - id: 'T299-QA-3'
    severity: medium
    file: 'tests/orchestration-instrument-reads.test.js'
    finding: 'No non-vacuity floor for the status rule on shipped text: the only shipped-text status assertion expects zero hits, so a broken WRAPPED_STATUS or a population with no echo stays green. The time rule has a strip-and-rescan; the status rule has none.'
    suggested_action: 'Take the step-3 doc, strip the `>> "$TEST_LOG"` redirect, and assert scan() returns a status hit.'
    suggested_owner: dev
    origin: 'code-review CR-3'
    status: open

