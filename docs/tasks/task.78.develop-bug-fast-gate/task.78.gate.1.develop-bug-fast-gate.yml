status_reason: "The gate lands at the correct seam and the parity test is mutation-proved on all three loop documents. Three MEDIUM findings, none of them in the gate's behaviour: an ambiguous cross-reference the port introduced, a failure output directed at a template with no slot for it, and three consumer-facing docs that still describe the gate as running in two places."
