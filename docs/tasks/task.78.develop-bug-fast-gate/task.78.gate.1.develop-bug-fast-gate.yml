top_issues:
  - id: "TASK-78-001"
    severity: medium
    file: "skills/develop-bug/references/develop-bug-step-5-6-verify-loop.md"
    finding: 'Line 173, "Triage per the step-3 pattern", is ambiguous in this document. The phrase was ported from the qa-fix loop, where the local sub-steps are numbered 0/0a/1/2 so "step-3" can only mean the pipeline''s Step 3. This document''s 5b HAS its own step 3 — the no-change check — and the same added block refers to it in that local sense twice (lines 153 and 189). An agent following the prose literally resolves the wrong referent, and the one it lands on is a HALT check with no triage in it.'
    suggested_action: "Name the target instead of numbering it: \"Triage per the develop loop's test-failure triage (`develop-pipeline-step-3-develop-loop.md` §Test Failure Triage)\". The task document warned that this file's cycle shape differs and that the gate must adapt rather than be copied; that warning applies to the block's prose references too."
    suggested_owner: dev
    status: open
  - id: "TASK-78-002"
    severity: medium
    file: "skills/develop-bug/references/develop-bug-step-5-6-verify-loop.md"
    finding: "The gate's failure output is directed to \"the Verify Cycle entry\", but that entry is a fixed five-field template (lines 60–66: Regression test / Suite + lint / Code review / Verdict / Action) with no slot for a gate result — as is the tracker-comment template at lines 71–77 that mirrors it. The qa-fix loop's equivalent points at the free-form QA Iteration History, so the instruction survived the port while the place it names did not. An agent would either invent a field or drop the output, and a twice-red gate that leaves no trace in the cycle record is the failure this whole step exists to make visible."
    suggested_action: "Add a `**Fast gate**: {pass / fail — log path}` line to both templates. Recording it every cycle rather than only on failure is what makes a green gate auditable instead of merely assumed."
    suggested_owner: dev
    status: open
  - id: "TASK-78-003"
    severity: medium
    file: "docs/reference/configuration.md"
    finding: "Three live consumer-facing sites still describe the fast gate as running in two places, which this change makes wrong: `docs/reference/configuration.md:96` (\"fast gate run in the develop loop and each qa-fix cycle\"), `docs/reference/configuration.md:178` (the reference table row, same wording), and `skills/develop-next/SKILL.md:200` (\"run per iteration and per qa-fix cycle\"). The task's §7 Files to Modify listed three files and included no doc sweep. `ci-gate-parity.test.mjs` already reads configuration.md, but only asserts the default VALUE, so it passes over the stale prose."
    suggested_action: "Update all three to name the third site. Historical records — the roadmap change log and task 75's own artifacts — are correct as written and must not be edited: they describe what was true when written."
    suggested_owner: dev
    status: open

