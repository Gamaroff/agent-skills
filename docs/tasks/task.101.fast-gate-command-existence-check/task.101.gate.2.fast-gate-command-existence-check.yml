top_issues:
  - id: 'T101-002'
    severity: medium
    file: 'shared/resources/develop-pipeline-step-3-develop-loop.md'
    finding: >-
      The precondition is at line 153, under `## Test Failure Triage (both orchestrators —
      applies inside /develop)`. The document's control flow reaches `## Develop Loop — Run
      Until Complete (Bounded)` (line 88) and `### LOOP` (line 92) first, and nothing there
      points forward to the precondition. A reader executing the loop therefore consults the
      Test Failure Triage section only WHEN A TEST FAILS — by which point the loop has already
      died mid-iteration, which is precisely the failure this task exists to remove. The block
      is correct and its own text says "run this once, before the loop's first iteration"; what
      is missing is anything at the loop's entry that makes that happen. The sibling documents
      (qa-fix cycle, develop-bug verify cycle) now assert "the develop loop checks the named
      script resolves before its first iteration", a claim that inherits the same weakness —
      one root cause, not two findings.
    suggested_action: >-
      Add a forward pointer at the top of `## Develop Loop — Run Until Complete (Bounded)`,
      before `### LOOP`, directing the reader to run the precondition once before iteration 1.
      Then close the regression hole: extend
      evals/shared/tests/fast-gate-precondition.test.mjs to assert the loop section references
      the precondition, so this cannot silently revert.
    suggested_owner: dev
    status: open

  - id: 'T101-001'
    severity: medium
    file: 'docs/tasks/task.101.fast-gate-command-existence-check/task.101.fast-gate-command-existence-check.md'
    finding: 'Cycle 1: §8 asserted qa-task Step 4b as the verification route; execution disproved it.'
    suggested_action: 'Corrected in cycle 1 — §8 now names the dedicated test and records why Step 4b cannot be the route.'
    suggested_owner: dev
    status: closed
    fixed_date: '2026-09-10'

