status_reason: 'Cycle 1 finding verified fixed and its replacement claims survive refutation. The mandatory cycle-2 refute pass found one new MEDIUM in the ORIGINAL change, not in the fix: the precondition sits under `## Test Failure Triage`, a section a reader reaches only after a failure, while nothing at the loop entry point directs them to run it first. Cycle 1 passed this because its placement check used the wrong reference point.'
