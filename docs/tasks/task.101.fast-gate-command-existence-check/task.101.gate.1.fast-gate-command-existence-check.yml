top_issues:
  - id: 'T101-001'
    severity: medium
    file: 'docs/tasks/task.101.fast-gate-command-existence-check/task.101.fast-gate-command-existence-check.md'
    finding: >-
      Section 8 (Testing Strategy) states "The snippet is runnable prose, so `qa-task` Step 4b
      will execute it under `bash` and `zsh`." Executed, Step 4b classifies the block
      `mutating` with reason `unrecognised-command: npm (fail-closed)` and SKIPS it — `npm`
      is deliberately absent from the engine's SAFE_COMMANDS allow-list. The stated
      verification route does not exist. The coverage itself is real and stronger than the
      claim (evals/shared/tests/fast-gate-precondition.test.mjs executes the block in both
      shells against fixture projects, in CI), so this is a false statement about HOW the
      deliverable is verified, not a coverage gap.
    suggested_action: >-
      Correct §8 to attribute the both-shells coverage to the dedicated test, and state that
      Step 4b cannot execute this block because `npm` is not on the snippet engine's
      allow-list — recording the reason so the next author does not re-plan around Step 4b.
    suggested_owner: dev
    status: open

