    suggested_owner: dev
    bug_ref: 'task.241.bug.4.finalise-6d-test-leaks-temp-dirs.md'
    status: open
  - id: 'TASK-241-CR2-1'
    severity: low
    file: 'skills/finalise/SKILL.md'
    finding: '6d (and Step 3b) treat any resolver answer other than on as "not enabled": a missing or unrunnable changelog-enforce.sh (bash exit 127, empty stdout) prints "6d: changelog checks not enabled" and continues, so an opted-in repository loses its HALT on a broken install. It is loud on stderr, unlike BUG-1. The reviewer rated it medium/medium; QA rated it low because bash prints the missing-file error.'
    suggested_action: 'Accept only an exact on or off from the resolver in 6d and Step 3b, and HALT naming the resolver when the answer is anything else.'
    suggested_owner: dev
    status: open
  - id: 'TASK-241-CR2-2'
    severity: low
    file: 'skills/finalise/assets/bug-dod-template.md'
    finding: 'The bug DoD template Step 4b (line 76) still asks for a "CHANGELOG.md entry under [Unreleased] citing (bug N), or the reason none is needed" and points to "Step 2 → Documentation", which never lists CHANGELOG; the text predates this branch, but after BUG-2 the answer comes only from agent 4, gated on the opt-in, and the template does not say so. The enumeration test covers only the dispatched prompts. The reviewer rated it medium/medium; QA rated it low because it is a placeholder filled from agent results, not a read instruction.'
    suggested_action: 'Reword the placeholder to take agent 4 CHANGELOG.md item (NOT_APPLICABLE "changelog checks not enabled" when off), and widen the enumeration test to skills/finalise/assets/.'
    suggested_owner: dev
    status: open
  - id: 'TASK-241-CR2-3'
    severity: low
    file: 'shared/resources/changelog-enforce.sh'
    finding: 'The header claims the same answer under every tier for a single-line value, but `changelog:` / `rules:` / `enforce: true` resolves on under awk and off under python (measured), because the awk nested reader matches the child at any depth under the parent (pre-existing reader behaviour; the claim is this branch).'
    suggested_action: 'Name the deeper-nesting case beside the block-scalar exception in the header and pin it in the test under both tiers, or restrict the awk match to the first child indent.'
    suggested_owner: dev
    status: open
  - id: 'TASK-241-CR2-4'
    severity: low
    file: 'evals/shared/tests/finalise-publish-boundary.test.mjs'
    finding: 'The enumeration test counts only upper-case CHANGELOG, so a lower-case reword of a real read ("check the project changelog", "grep changelog.md") passes as zero mentions.'
    suggested_action: 'Match case-insensitively and allow-list only the `changelog.enforce` spelling explicitly.'
    suggested_owner: dev
    status: open

