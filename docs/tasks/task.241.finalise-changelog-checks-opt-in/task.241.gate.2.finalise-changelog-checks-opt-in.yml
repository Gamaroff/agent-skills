    file: 'evals/shared/tests/finalise-publish-boundary.test.mjs'
    finding: 'CI check test failed on f530a532 (https://github.com/Gamaroff/agent-skills/actions/runs/40673829397/job/122767043241); green on develop (run 40664077358). All 7086 tests pass; scripts/test-tmpdir.mjs fails the run because prefix "finalise-6d" is over its ratchet (20 > 10): runSixD creates a temp dir per call and never removes it, and this branch added 6d cases that CI runs under bash and zsh.'
