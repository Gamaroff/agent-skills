task_title: 'Doc numbering enforcement and sweep'
gate: CONCERNS
status_reason: 'Both guards and the sweep work and full CI is green, but four MEDIUM defects hold: the review-epic auto-skip reads variables bound in another block, the chokepoint comment stripper silently drops lines, the review-epic report glob still uses the flat number, and the title shape misses literal-space parsers.'
reviewer: 'QA Engineer'
head: '9b36097f21cc671724a6dcd52111bd2aee855b04'
updated: '2026-10-16T17:13:23Z'

top_issues:
  - id: 'TASK-207-BUG-1'
    severity: medium
    file: 'shared/resources/review-pipeline-step-0a-branch-setup.md'
    finding: 'review-epic 0a.3 reads PRD_NUM, EPIC_NUM and CURRENT_BRANCH bound only in other blocks, so the auto-skip pattern collapses to feature/epic..* and never fires; the §4 test joins the blocks and cannot see it (CR-1).'
    suggested_action: 'Re-derive the ids and CURRENT_BRANCH inside the 0a.3 block, as review-story does; run each block in its own shell in §4.'
    suggested_owner: dev
    status: open
  - id: 'TASK-207-BUG-2'
    severity: medium
    file: 'tests/doc-id-chokepoint.test.js'
    finding: 'stripCodeComment searches for /* before handling a // line comment, so a // comment quoting a glob opens a phantom block comment and silently drops following lines from the scan (CR-2).'
    suggested_action: 'Handle // line comments first, or reuse a quote-aware stripper; add a MUST_HIT row for the shape.'
    suggested_owner: dev
    status: open
  - id: 'TASK-207-BUG-3'
    severity: medium
    file: 'skills/review-epic/SKILL.md'
    finding: 'The Step 9 numbering glob epic.{epic-number}.review.*.md and the save template epic.[N] still name one number, so REVIEW_N is always 1 for an epic.P.E report; other epic.[N] / README residues remain outside the §7 grep (CR-3, reviewer confidence medium, verified by QA).'
    suggested_action: 'Rewrite to epic.{P}.{E}; sweep the residues; add a residual-placeholder population test.'
    suggested_owner: dev
    status: open
  - id: 'TASK-207-BUG-4'
    severity: medium
    file: 'tests/doc-id-chokepoint.test.js'
    finding: 'The title shape matches only an escaped \s, so parsers written with a literal space (backfill-story-issues.sh:52 and :56) escape the guard (CR-4, reviewer confidence medium, verified by QA).'
    suggested_action: 'Widen the title shape to a literal space or [[:space:]]; route or allowlist the backfill parsers; add a MUST_HIT row.'
    suggested_owner: dev
    status: open
  - id: 'TASK-207-CR-5'
    severity: low
    file: '.agents/scripts/backfill-story-issues.sh'
    finding: 'The story-title strip still removes only Story E.S, so a Story 1.2.3 title becomes [Story 1.2.3] .3: X, and the bracket form is never stripped.'
    suggested_action: 'Strip both Story N(.N)*: and [Story N(.N)*] prefixes.'
    suggested_owner: dev
    status: open
  - id: 'TASK-207-CR-6'
    severity: low
    file: 'docs/concepts/quickstart-story.md'
    finding: 'Option B still tells the reader to mark registry rows CANCELLED, contradicting the rewritten option A.'
    suggested_action: 'Reword to the new numbering model.'
    suggested_owner: dev
    status: open

