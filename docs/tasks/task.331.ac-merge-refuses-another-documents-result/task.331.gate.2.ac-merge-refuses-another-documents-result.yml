top_issues:
  - id: 'T331-CR-1'
    severity: medium
    file: 'skills/finalise/SKILL.md'
    finding: 'origin: code-review (refute pass, confidence high). Step 3c merges with --scope .claude/state/finalise-rerun-scope-${DOD_N}.json, which is still keyed by DOD_N alone (SKILL.md:637, :1054). Another item finalised in the same checkout can overwrite it between Step 3a and 3c. Then merge answers result-document-mismatch for this item''s CORRECT answer ("--result is for task.9…, not task.8…"), and the HALT arm (:1064) offers only re-extract or hand-copy, which reproduce the same mismatch, so no retry can succeed.'
    suggested_action: 'Before calling merge, check that the scope file''s .document is this item''s document and HALT with a distinct message naming the remedy (re-run Step 3a); keep result-document-mismatch for a result that names another document. Hold the new check with a test in the eval blocks suite.'
    suggested_owner: dev
    status: open
  - id: 'T331-CR-2'
    severity: low
    file: 'CHANGELOG.md'
    finding: 'origin: code-review (confidence high). "A run resumed across the upgrade finds no file at the new path and re-runs Step 3c" does not hold for a run that finished Step 3c before the upgrade: its record exists, the merged file sits at the old path, and Step 6 action 2a HALTs on "record exists but merged result missing".'
    suggested_action: 'Rewrite the CHANGELOG sentence to name what a resumed run actually meets (Step 3c re-run, or the Step 6 action 2a HALT and its remedy)'
    suggested_owner: dev
    status: open
  - id: 'T331-CR-3'
    severity: low
    file: 'skills/finalise/SKILL.md'
    finding: 'origin: code-review (confidence high). The Step 6 action 2a prose (:1642) still says the merged-result file "is keyed by `DOD_N`", contradicting the renamed path and the rewritten comment inside the block.'
    suggested_action: 'Say it is keyed by stem and DOD_N and never removed, and that a stem is not a whole document name; grep for any other stale description of these paths'
    suggested_owner: dev
    status: open

