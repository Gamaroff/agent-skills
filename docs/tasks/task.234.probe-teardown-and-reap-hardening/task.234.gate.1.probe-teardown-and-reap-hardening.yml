top_issues:
  - id: 'TASK-234-QA-1'
    severity: high
    file: 'shared/resources/security-probe.mjs'
    finding: 'On Node 22.23.4 (CI test.yml node-version 22; package.json engines >=22) the first rmSync of a sandbox nested past PATH_MAX throws ENAMETOOLONG, not EACCES; removeSandbox rethrows it before the chmod -R fallback runs, so runProbeSpec crashes and the task.234 A test fails (reproduced: `mise exec node@22 -- node --test --test-name-pattern "task.234|QA2-1" shared/resources/tests/security-probe.test.mjs` → A not ok, code ENAMETOOLONG). Green on Node 24.21.0 and 26.8.2.'
    suggested_action: 'Handle a deep tree on Node 22 too: treat ENAMETOOLONG like EACCES/EPERM and remove by relative path after chmod -R (for example `rm -rf -- root`, which descends relatively), then re-run the A test on Node 22, 24 and 26.'
    suggested_owner: dev
    status: open
  - id: 'TASK-234-QA-2'
    severity: low
    file: 'shared/resources/tests/security-probe.test.mjs'
    finding: 'Both D tests pass whenever the marker is absent, with no committed positive control that the grandchild started; a case that was declined, or a grandchild that never ran, also passes (the reap-removal mutation proved them in development, but nothing in the committed test holds it).'
    suggested_action: 'Have the grandchild write a started file before it sleeps and assert that file exists, beside the absent-marker assertion.'
    suggested_owner: dev
    status: open

