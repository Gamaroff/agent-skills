task_title: 'Probe sandbox teardown and process-group reap'
gate: CONCERNS
status_reason: 'The cycle-2 fixes hold (QA-3 to QA-6 verified by test and mutation). The leash they added changes two things a case can observe: argv0 becomes the resolved path, so a fence-script launch failure no longer reads as one, and the leash shell runs under the case environment, so SHELLOPTS reaches it.'
reviewer: 'QA Engineer'
head: '7646e7bec20602c5bc4632f26d8c3354a97396db'
updated: '2026-10-31T09:49:53Z'

top_issues:
  - id: 'TASK-234-QA-7'
    severity: medium
    file: 'shared/resources/security-probe.mjs'
    finding: 'leashed() hands env the PATH-resolved absolute path as the program, so bash runs with argv0 /usr/bin/bash and a script it cannot open prints "/usr/bin/bash: <script>: No such file or directory" (measured), which isLaunchFailure''s ^(?:bash|<script>): pattern no longer matches: a launch failure is scored as a real run instead of errored.'
    suggested_action: 'Pass the caller''s command name to env (execvp resolves it on the case''s own PATH exactly as before) and use the resolved path only to decide whether to leash; add a test that a fence case whose script cannot be opened is errored.'
    suggested_owner: dev
    status: open
  - id: 'TASK-234-QA-8'
    severity: medium
    file: 'shared/resources/security-probe.mjs'
    finding: 'The leash /bin/sh is spawned with the full case environment, so SHELLOPTS=xtrace (or PS4, BASHOPTS) in a fixture env makes the leash script trace "+ p=1" and "+ exec ..." onto the case''s stderr before the exec (measured with SHELLOPTS=xtrace under bash-as-sh); the environment also reaches ARG_MAX twice.'
    suggested_action: 'Spawn the leash shell with a fixed minimal environment (PATH=/usr/bin:/bin only), since env -i passes the case its own environment; add a test with SHELLOPTS=xtrace that asserts the case stderr is the case''s own.'
    suggested_owner: dev
    status: open

