top_issues:
  - id: QA-12
    issue: "The child-environment token strip is proved by no test"
    severity: medium
    finding: "M5 deleted `delete childEnv.LOOP_SUPERVISOR_DASHBOARD_TOKEN` from run-loop.mjs and the suite stayed fully green — 32/32. The code fix is correct on inspection, but nothing holds it in place: the strip sits inline in main(), which no test can reach, so a future refactor of the spawn options removes the protection silently. Cycle 1's headline finding was a security mitigation asserted by a test that could not fail; shipping its replacement with no test at all is the same defect wearing different clothes."
    suggested_action: "Extract the child environment into an exported pure function (e.g. childEnvFor(env)) and assert it drops LOOP_SUPERVISOR_DASHBOARD_TOKEN while preserving the rest of the environment."
    suggested_owner: dev
    ref: "skills/loop-supervisor/scripts/run-loop.mjs (spawn options in main())"

