top_issues:
  - id: 'T268-QA-6'
    severity: high
    file: 'skills/qa-fix/SKILL.md'
    finding: 'The Step 4 guard expands $CHANGED_PATHS unquoted into git ls-files. Bash splits it into pathspecs; zsh does not, so "d e" stays one pathspec that matches nothing. Reproduced: with an untracked file in e/, bash prints e/x and zsh prints nothing, so under zsh the guard admits exactly the untracked files it exists to catch. A whitespace-only value also passes the empty check. Absent on the PR base. (CR-1.)'
    suggested_action: 'Split the slot explicitly in both shells (an array built with read -r -a, or ${=VAR} under zsh), refuse a value that is blank after trimming, and add a multi-path case and a whitespace-only case to the fence probe and the committed test.'
    suggested_owner: dev
    status: open
  - id: 'T268-QA-7'
    severity: medium
    file: 'tests/qa-fix-step4-guard.test.js'
    finding: 'Every case passes a single-token path, so the suite never exercises the documented multi-path slot, which is the input that breaks under zsh; the legitimate case uses a gitignored path and would also pass a guard whose pathspec matched nothing. (CR-2, CR-3.)'
    suggested_action: 'Add a two-path case whose second path holds the untracked file (refused), a whitespace-only case, and make the clean case a real tracked file.'
    suggested_owner: dev
    status: open

