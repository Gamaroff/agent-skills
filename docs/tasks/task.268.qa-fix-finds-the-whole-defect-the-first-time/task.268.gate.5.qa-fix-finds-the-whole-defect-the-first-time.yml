top_issues:
  - id: 'T268-QA-10'
    severity: medium
    file: 'skills/qa-fix/SKILL.md'
    finding: 'The slot is substituted into a double-quoted assignment, so a path holding a command substitution, a backtick or a variable reference is executed or expanded by the shell. Reproduced: an assignment whose value contains a command substitution ran it and created a file. A bare double quote is a syntax error (fails closed). The prose excludes only spaces and braces. (CR-1.)'
    suggested_action: 'Substitute the slot into a single-quoted heredoc or extend the case guard and the prose to refuse dollar, backtick, double quote and backslash, with a hostile case in the probe and the test.'
    suggested_owner: dev
    status: open
  - id: 'T268-QA-11'
    severity: medium
    file: 'skills/qa-fix/SKILL.md'
    finding: 'A path inside a nested repository, or behind a symlinked directory, exists on disk so the existence check passes, and the outer git ls-files lists nothing for it, so the guard exits 0: "found nothing" and "could not look" give the same result. Run by the reviewer; not re-run by me. (CR-2.)'
    suggested_action: 'Refuse a path whose parent leaves this repository tree (a .git boundary or a symlink), or document the limitation and add a probe case.'
    suggested_owner: dev
    status: open

