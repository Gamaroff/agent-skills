    file: 'skills/qa-fix/SKILL.md'
    finding: 'The Step 4 guard hands each path to git ls-files as a pathspec, so magic is interpreted: a path written as an exclude pathspec for d, followed by d, prints nothing while d/a is untracked, and a glob character is read as a pattern. Reproduced under zsh. Absent on the PR base. (CR-1.)'
    suggested_action: 'Run the listing with --literal-pathspecs so every changed path is matched as written, and add a magic-pathspec case to the fence probe and the committed test.'
    suggested_owner: dev
    status: open
  - id: 'T268-QA-9'
    severity: medium
    file: 'skills/qa-fix/SKILL.md'
    finding: 'A path that does not exist makes git ls-files exit 0 with no output, so a mistyped path reads as clean, although the HALT text promises a bad path is caught. "Found nothing" and "path does not exist" give the same result. Reproduced. (CR-2.)'
    suggested_action: 'HALT on any listed path that does not exist before the listing, and add a nonexistent-path case to the probe and the test.'
    suggested_owner: dev
    status: open

