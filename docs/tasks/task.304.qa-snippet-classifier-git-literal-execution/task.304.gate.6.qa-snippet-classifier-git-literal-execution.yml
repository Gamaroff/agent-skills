task: 'task.304.qa-snippet-classifier-git-literal-execution'
task_title: 'QA snippet classifier refuses git literal execution'
gate: FAIL
status_reason: 'The cycle 5 finding is fixed and re-verified: a git line whose two readings of the subcommand disagree is refused, and switching that check off turns the quoted --namespace row red. The safety re-probe found one more way into the same boundary. The scan splits a command line on whitespace before either reader sees it, so a backslash-escaped space inside the operand of a global flag (`git --namespace a\ log fetch --upload-pack=./hook.sh .`) becomes two tokens. Both readers skip the first as the operand and read `log` as the subcommand, so they agree, and the agreement check passes. Real git takes `a log` as the operand and runs `fetch --upload-pack`, which writes under bash (git 2.56). This is the sixth gate; the budget was extended once by the owner and is spent again.'
reviewer: 'QA Engineer'
head: 'b18ea7e479db30b0bb5d58485d152711024612c9'
updated: '2026-11-11T07:34:49Z'

top_issues:
  - id: 'T304-QA-11'
    severity: high
    file: 'shared/resources/qa-execute-snippets.mjs'
    finding: "commandInvocations splits the git line on whitespace before gitSubcommand and scanGitArgs read it, so `a\\ log` (a backslash-escaped space) is two tokens for both readers and one word for bash. `git --namespace a\\ log fetch --upload-pack=./hook.sh .` classifies runnable as `git:log` (the develop engine too) and bash writes the marker under git 2.56: git takes `a log` as the --namespace operand and runs `fetch`. Reviewer also lists `--git-dir`, `--work-tree` and `-C` forms (`-C`/`--super-prefix` need an existing directory or error before running, so no write was measured for them) and `status clone -u`, `show submodule foreach`, `rebase --exec` behind the same split. Reproduced by QA under bash with a planted hook; controls (`git --namespace 'a b' log -1`, `git log -1`) behave."
    suggested_action: 'Stop reading an operand at all. A global flag that takes a separate operand is the one construct that makes the subcommand depend on how a word is split, and every cycle since the fourth has been a new way to split it. Refuse any git line that has an operand-taking global flag before the subcommand, except `-C` with one plain word (the form the documentation uses), and keep a bash-verified row for each of --namespace, --git-dir, --work-tree, --super-prefix with an escaped space. Refusing the construct needs no tokenizer to agree with bash.'
    suggested_owner: dev
    status: open

