task: 'task.304.qa-snippet-classifier-git-literal-execution'
task_title: 'QA snippet classifier refuses git literal execution'
gate: FAIL
status_reason: 'The cycle 4 finding is fixed and re-verified: an unknown git global flag before the subcommand is now refused, and switching that refusal off turns 3 tests red. The safety re-probe found a different hole in the same boundary: the scan finds the git subcommand twice, in gitSubcommand (on the raw words) and again in gitArgsHazard (on the unquoted words), and a quote or backslash inside the spelling of an operand-taking global flag makes the two disagree. `git --names"pace" log fetch --upload-pack=''touch M'' .` is admitted as the allow-listed `git:log` while real git unquotes the flag, consumes `log` as its operand and runs `fetch --upload-pack` (writes under bash, git 2.56). This is the fifth gate in the budget, so the loop ends here and the finding goes to a human.'
reviewer: 'QA Engineer'
head: '58a018327387172e25fb3c961f35f2bc5b06a270'
updated: '2026-11-11T07:07:41Z'

top_issues:
  - id: 'T304-QA-10'
    severity: high
    file: 'shared/resources/qa-execute-snippets.mjs'
    finding: "gitSubcommand (line 2536) reads the raw words and gitArgsHazard (line 2634) reads the unquoted words, so a quote or backslash inside an operand-taking global flag hides it from the first and not the second. `git --names\"pace\" log fetch --upload-pack='touch M' .`, `git --\"namespace\" status fetch --upload-pack='touch M' .` and `git --work-\"tree\" log fetch --upload-pack='touch M' .` classify runnable as `git:log` / `git:status` (the develop engine too) and bash writes M under git 2.56: git unquotes the flag, takes the next word as its operand and runs `fetch`. gitArgsHazard skips the operand the same way, reaches `fetch`, finds no ls-remote and returns null, because it never compares its subcommand with the one the allow-list admitted. The bare `--namespace log fetch ...` is refused correctly, which shows the quote is what defeats it. Reproduced by QA under bash with a planted marker; the control (bare spelling) and `git log -1` behave."
    suggested_action: 'Do not unquote in one more place. Parse the git words once: compute the subcommand and the option list from the unquoted tokens in a single function, and make that one result the only input to the allow-list check and to the argument hazards, so the two readers cannot disagree. As a backstop, refuse when the subcommand the hazard scan finds is not the `git:<sub>` word the allow-list admitted. Add bash-verified rows for `--names"pace"`, `--"namespace"` and `--work-"tree"` and `-\C`, with the bare-spelling control.'
    suggested_owner: dev
    status: open

