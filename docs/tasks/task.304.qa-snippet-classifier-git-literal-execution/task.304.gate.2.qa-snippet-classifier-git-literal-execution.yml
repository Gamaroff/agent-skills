task: 'task.304.qa-snippet-classifier-git-literal-execution'
task_title: 'QA snippet classifier refuses git literal execution'
gate: FAIL
status_reason: 'The three cycle 1 bypasses are fixed and re-verified. The refute pass found the same class in a new spelling: bash brace expansion rebuilds --upload-pack, --exec and --config-env after the classifier has read the text, so six brace spellings classify runnable and write a file under real bash. The matcher compares literal text, which a shell word is not.'
reviewer: 'QA Engineer'
head: 'ea72576dfd31d68d53c2ba0f6e63afbc908732fe'
updated: '2026-11-11T05:33:40Z'

top_issues:
  - id: 'T304-QA-4'
    severity: high
    file: 'shared/resources/qa-execute-snippets.mjs'
    finding: "Brace expansion hides the ls-remote option from the literal-text prefix match. `git ls-remote --upload-pa{ck,ck}='touch W' .` classifies runnable and bash writes W. The same holds for `--{upload-pack,upload-pack}=`, `--upload-pack{,}=` and `--exe{c,c}=`. The unbraced spelling is refused (control) and a brace in a read-only format string (`git log --format={%h,%s} -1`) writes nothing and stays runnable (control). The develop engine also classifies all of them runnable, but the task names this class, so it is the task's unfinished work. origin: code-review (CR-1), reproduced by QA."
    suggested_action: 'Do not match option text on a word the shell can still rewrite. Refuse any argument of a git invocation that holds an unquoted brace (or other unexpanded expansion), instead of adding a spelling per case; the control `git log --format={%h,%s}` needs a quoted-brace allowance or an accepted false refusal that the docs scan measures.'
    suggested_owner: dev
    status: open
  - id: 'T304-QA-5'
    severity: high
    file: 'shared/resources/qa-execute-snippets.mjs'
    finding: "The same gap defeats --config-env. `X='touch W' git --config-e{nv,nv}=core.sshCommand=X ls-remote ssh://h/x` and `X='touch W' git --config-env{,}=core.sshCommand=X ls-remote ssh://h/x` classify runnable and bash writes W. The X= prefix is not a GIT_ name, so the GIT_NAME rule does not see it. `git --config-env=...` unbraced is refused (control). Reproduced by QA, same result on the develop engine. origin: code-review (CR-2), reproduced by QA."
    suggested_action: 'The same brace refusal on every git argument covers this, including the -c and --config-env tests.'
    suggested_owner: dev
    status: open
  - id: 'T304-QA-6'
    severity: medium
    file: 'shared/resources/qa-execute-snippets.mjs'
    finding: "The comment above gitArgsHazard says --exec-path runs nothing for the safe subcommands, and that is false for ls-remote: with an executable git-upload-pack in the named directory, `git --exec-path=$PWD ls-remote .` classifies runnable and bash runs it. The block cannot create that file itself, so exposure is low, but the stated measurement is wrong and the form is the task's class. Reproduced by QA. origin: code-review (CR-3, rated low/medium by the reviewer), reproduced by QA under item 5d."
    suggested_action: 'Refuse a non-empty --exec-path value (or --exec-path on ls-remote), correct the comment, and add the form to T304_FORMS with a planted git-upload-pack as the bash proof.'
    suggested_owner: dev
    status: open

