task: 'task.304.qa-snippet-classifier-git-literal-execution'
task_title: 'QA snippet classifier refuses git literal execution'
gate: FAIL
status_reason: 'The cycle 2 findings are fixed and re-verified: every brace spelling of --upload-pack, --exec and --config-env, and --exec-path=<dir>, is now refused. The safety re-probe found the same class one step away: the GIT_ name is judged as text, so an export operand whose name bash assembles from braces, empty quotes or a backslash classifies runnable and writes a file under real bash. This is the third consecutive cycle with a HIGH in the same file and the same kind of mechanism (a matcher over text a shell word is not).'
reviewer: 'QA Engineer'
head: 'ad5d8660eaaa1854be7d0b7748cbb75c021a1233'
updated: '2026-11-11T05:55:27Z'

top_issues:
  - id: 'T304-QA-7'
    severity: high
    file: 'shared/resources/qa-execute-snippets.mjs'
    finding: "Brace expansion hides the GIT_ name in an export operand. `export GIT_{SSH_COMMAND,X}='touch W'; git ls-remote ssh://h/x` and `export G{IT_SSH_COMMAND,X}='touch W'; git ls-remote ssh://h/x` classify runnable and bash writes W. The GIT_NAME rule needs GIT_ followed by a name character, and the export operand check needs ^GIT_..., so neither sees a name that only exists after expansion; hasBraceExpansion is applied to git's own arguments only. Controls: the unbraced `export GIT_SSH_COMMAND=...` is refused, `export FOO=1; git log -1` stays runnable. The develop engine also classifies these runnable, but the task names GIT_ environment forms, so this is its unfinished work. origin: code-review (CR-1), reproduced by QA."
    suggested_action: 'Do not judge the name as text. In a block that runs git, refuse an export, declare, typeset, readonly or local operand whose name part is not a plain literal identifier (no quote, backslash, brace or dollar), and refuse allexport (set -a, set -o allexport) beside git, since it makes every assignment live; that closes the whole class at the one place an assignment reaches the environment, instead of widening the name pattern.'
    suggested_owner: dev
    status: open
  - id: 'T304-QA-8'
    severity: high
    file: 'shared/resources/qa-execute-snippets.mjs'
    finding: "A GIT_ name split by quote or backslash fragments is not matched. `export GI''T_SSH_COMMAND='touch W'; git ls-remote ssh://h/x`, `export GI\"\"T_SSH_COMMAND=...` and `export GIT\\_SSH_COMMAND=...` classify runnable and bash writes W. The GIT_NAME regex runs on text, so it never sees the joined name; the export operand check unquotes its operands but is anchored on ^GIT_ with the quote already removed only in some spellings. Controls as for T304-QA-7. Reproduced by QA, same result on the develop engine. origin: code-review (CR-2), reproduced by QA."
    suggested_action: 'The same refusal covers it: a non-literal variable name on an assignment-making command is refused, whatever it spells.'
    suggested_owner: dev
    status: open

