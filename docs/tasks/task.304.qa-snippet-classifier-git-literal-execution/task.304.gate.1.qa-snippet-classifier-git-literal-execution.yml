task: 'task.304.qa-snippet-classifier-git-literal-execution'
task_title: 'QA snippet classifier refuses git literal execution'
gate: FAIL
status_reason: 'Three high-confidence bypasses of the new git refusal reproduce under real bash: a wholly quoted --upload-pack/--exec word, a quoted export operand, and a GIT_ name filled by read or printf -v and exported by name. Each classifies runnable and writes a file. The unquoted forms the task lists are all refused.'
reviewer: 'QA Engineer'
head: 'a32ecec7bca816f96f021c84210dae4a1fab2ed7'
updated: '2026-11-11T04:44:30Z'

top_issues:
  - id: 'T304-QA-1'
    severity: high
    file: 'shared/resources/qa-execute-snippets.mjs'
    finding: "unquoteToken deletes the masked-quote placeholder, so a wholly quoted word such as '--upload-pack=touch W' or \"--exec=touch W\" becomes empty and the ls-remote check never sees it. `git ls-remote '--upload-pack=touch W' .` classifies runnable and writes W under real bash; the unquoted spelling is refused (control). Reproduced by QA, same result on the develop engine. origin: code-review (CR-1), reproduced by QA."
    suggested_action: 'Unmask the placeholders (restore the quoted text) before matching in unquoteToken, and add the single-quoted and double-quoted spellings to T304_FORMS.'
    suggested_owner: dev
    status: open
  - id: 'T304-QA-2'
    severity: high
    file: 'shared/resources/qa-execute-snippets.mjs'
    finding: "The export-style check reads the same placeholder-stripped token, so `export 'GIT_SSH_COMMAND=touch W'; git ls-remote ssh://x/y` and the double-quoted spelling classify runnable and write W under real bash; the unquoted export is refused (control). Reproduced by QA, same result on the develop engine. origin: code-review (CR-2), reproduced by QA."
    suggested_action: 'Match the GIT_ name against the unmasked token (the same unquoteToken repair as T304-QA-1), and add the quoted export spellings to the test table.'
    suggested_owner: dev
    status: open
  - id: 'T304-QA-3'
    severity: high
    file: 'shared/resources/qa-execute-snippets.mjs'
    finding: "Only a literal GIT_*= token is refused, so a GIT_ variable filled by another builtin and then exported by name is not seen: `read GIT_SSH_COMMAND <<< 'touch W'; export GIT_SSH_COMMAND; git ls-remote ssh://x/y` and the `printf -v GIT_SSH_COMMAND 'touch W'` form classify runnable and write W under real bash; the same without the export does not write (control). Reproduced by QA, same result on the develop engine. origin: code-review (CR-3), reproduced by QA."
    suggested_action: 'Refuse export, declare, typeset, readonly and local of any bare GIT_ name even with no assignment, and refuse a GIT_ name as the target of read, printf -v or mapfile; add these spellings to the test table.'
    suggested_owner: dev
    status: open

