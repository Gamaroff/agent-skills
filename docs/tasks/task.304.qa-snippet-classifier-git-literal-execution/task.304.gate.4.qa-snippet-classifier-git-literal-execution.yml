task: 'task.304.qa-snippet-classifier-git-literal-execution'
task_title: 'QA snippet classifier refuses git literal execution'
gate: FAIL
status_reason: 'The cycle 3 findings are fixed and re-verified: every spelling of an exported GIT_ name the shell assembles (brace, empty quotes, backslash) is now refused at the assignment site, and the name-rule mutation turns a test red. The safety re-probe found a different hole in the same boundary: git has global flags that take a separate operand, the operand table lists only eight of them, and an unlisted one (--attr-source) makes the scan read the next word as the subcommand, so `-c` and `ls-remote --upload-pack` behind it classify runnable and write a file under real bash.'
reviewer: 'QA Engineer'
head: 'f13b57a8d32cf71d2ebcabea092f440c83717c4a'
updated: '2026-11-11T06:47:21Z'

top_issues:
  - id: 'T304-QA-9'
    severity: high
    file: 'shared/resources/qa-execute-snippets.mjs'
    finding: "An unlisted git global flag that takes an operand hides the subcommand from the scan. `git --attr-source log -c core.sshCommand='touch M' ls-remote ssh://x/y` and `git --attr-source log ls-remote --upload-pack='touch M' .` classify runnable (the develop engine too) and bash writes M under git 2.56. GIT_FLAGS_WITH_OPERAND lists -C, -c, --git-dir, --work-tree, --namespace, --exec-path, --config-env and --super-prefix; --attr-source is not there, so the scan reads `log` (the operand) as the subcommand and returns before it sees the real one. Reproduced by QA under bash; control `git log -1` stays runnable. Probe engine: 3 reproduced of 63, 0 escaped (c4-attr-source-c, c4-attr-source-upload-pack, c4-attr-source-unknown-flag). Reviewer finding CR-1, high/high, reproduced by QA."
    suggested_action: 'Do not add --attr-source to the list: git adds global flags over time (this is the fourth cycle on one closed list of spellings). Invert it. Before the subcommand, accept only an allow-list of known global flags (the zero-operand ones such as --no-pager, -p, --paginate, --bare, --no-optional-locks, --literal-pathspecs, and the operand ones the engine already knows), and refuse a git whose pre-subcommand words include any other word that starts with a dash. Bash-verified rows for --attr-source and an invented flag, a differential atom, and a mutation proof.'
    suggested_owner: dev
    status: open

