task_title: 'QA snippet classifier refuses git literal execution'
gate: PASS
status_reason: 'The cycle 6 finding is fixed and re-verified. The scan no longer reads git global-flag operands: the only separate-operand flag kept is -C with one plain word, every other operand-taking flag is refused, and every flag token ahead of the subcommand must be plain text, so no tokenizer has to agree with bash. The safety re-probe (about 250 inputs by the reviewer, 78 executed probes by QA) found no way left to make a block run a literal string or write a file; the escaped-space, quoted-flag, unknown-flag, name-assembly and reader-disagreement forms are all refused and three mutation proofs turn tests red. The accepted cost is that a documented block using another operand-taking global flag is now refused (none exists in the docs corpus).'
