top_issues:
  - id: 'TASK-166-CR2-1'
    severity: medium
    file: 'skills/review-task/SKILL.md'
    finding: 'The CR-2 fix changed only the check 4 rule. The Step 6 Issues to Flag line still says Important for "no numeric bound or no stated measurement", the test pins that wording verbatim, and CHANGELOG.md and task SC 3 say "no numeric bound or measuring command" — all still flag a bound a planned per-PR test asserts.'
    suggested_action: 'Reword every statement of the rule (Issues to Flag line, its pin, CHANGELOG, task SC 3) to "no planned test, and no numeric bound with a measuring command"; list each site in the fix summary.'
    suggested_owner: dev
  - id: 'TASK-166-CR2-2'
    severity: medium
    file: 'skills/review-task/SKILL.md'
    finding: 'CR-6 sends an unbounded criterion down the behaviour path, where a test passes it; the bound rule still raises Important for "Missing the bound" whether or not a test is planned, so it flags a criterion finalise would pass.'
    suggested_action: 'State the rule as: a non-functional criterion is held by a planned per-PR test, or by a numeric bound plus measuring command; neither → Important. Pin the missing-bound case.'
    suggested_owner: dev
  - id: 'TASK-166-CR2-3'
    severity: medium
    file: 'CHANGELOG.md'
    finding: 'CHANGELOG ("an unbounded criterion stays FAIL") and task SC 1 ("An unbounded criterion is FAIL") claim an unconditional FAIL; the prompt as shipped fails an unbounded criterion only when no per-PR test holds it.'
    suggested_action: 'Reword both to "an unbounded criterion is not a measured criterion, and fails unless a per-PR test holds it".'
    suggested_owner: dev
  - id: 'TASK-166-CR2-4'
    severity: low
    file: 'tests/review-task-measured-criterion.test.js'
    finding: 'The kind-label match normalises the two sides differently (labels keep backticks; asProse strips them) and uses a bare includes(), so a code-formatted kind never matches and an embedded word ("unmeasured criterion") does.'
    suggested_action: 'Normalise the label with asProse, strip a leading A/An, match on word boundaries.'
    suggested_owner: dev
  - id: 'TASK-166-CR2-5'
    severity: low
    file: 'tests/review-task-measured-criterion.test.js'
    finding: 'The count-word regex misses digits and more than one qualifier ("the 3 test-free kinds", "three such test-free kinds") and refuses "both kinds of evidence".'
    suggested_action: 'Accept digits and up to three qualifiers; drop "both" from the review-task check.'
    suggested_owner: dev
  - id: 'TASK-166-CR2-6'
    severity: low
    file: 'tests/review-task-measured-criterion.test.js'
    finding: 'The test header comment says "one of three test-free kinds" — the unpinned count CR-1 removed from check 4.'
    suggested_action: 'Name the list without a number.'
    suggested_owner: dev

