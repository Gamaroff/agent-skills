    status: open
  - id: 'TASK-174-QA-2'
    severity: low
    file: 'docs/examples/ci/bitbucket-pipelines/classify-changes.test.js'
    finding: 'The cross-variant is_docs test spreads process.env back over its cleaned env, so a DOCS_PATTERNS set in the runner''s environment leaks into the default-patterns case. From code review CR-2 (cleanup, low/high).'
    suggested_action: 'Pass the cleaned env to spawnSync directly, without re-spreading process.env.'
