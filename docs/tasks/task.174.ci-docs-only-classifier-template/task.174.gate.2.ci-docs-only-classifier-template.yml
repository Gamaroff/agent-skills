top_issues:
  - id: 'TASK-174-QA-3'
    severity: medium
    file: 'docs/examples/ci/github-actions/changes-job.test.js'
    finding: 'The concurrency guard only checks substrings: `github.ref_name` passes the `\bgithub\.ref\b` check, so a group that shares one group per branch for base-branch pushes passes both tests, and a job-level concurrency block is never read (code review CR-1, bug/high, promoted; reproduced). Bug: task.174.bug.2.concurrency-guard-passes-on-broken-group.md'
    suggested_action: 'Pin the whole group value as an exact string and assert that no job-level concurrency key exists.'
    suggested_owner: dev
    status: open
  - id: 'TASK-174-QA-4'
    severity: medium
    file: 'docs/runbooks/ci-docs-only-skip.md'
    finding: 'The guide says a base-branch run must always finish and presents PR-only cancellation as what ensures it, but the push path (classify-changes.sh:225) skips any docs-only diff without evidence, so a code merge run that is red, cancelled by hand, timed out, lost or still running still leaves a green docs merge over untested code (code review CR-2, bug/medium/medium; QA verified against the code and raised it). Bug: task.174.bug.3.guide-overstates-base-run-guarantee.md'
    suggested_action: 'Scope the claim: say the push path checks no evidence, list the cases concurrency does not cover, and say what an adopter should watch for.'
    suggested_owner: dev
    status: open
  - id: 'TASK-174-QA-5'
    severity: low
    file: 'docs/examples/ci/github-actions/changes-job.yml'
    finding: 'Concurrency groups are repository-wide and `ci-pr-N` names no workflow, so a second workflow that copies the block cancels this one on the same PR push (code review CR-3, bug/low/medium).'
    suggested_action: 'Put github.workflow in the group and update the pinned test value and the guide to match.'
    suggested_owner: dev
    status: open

