schema: 1
task: 'task.57.readonly-verification-and-reconcile'
task_title: '[Task 57] Read-only verification, and /tracker-reconcile so the checklist is a ledger rather than a receipt'
gate: FAIL
status_reason: >-
  All eight cycle-1 findings verified FIXED, but the adversarial pass over the fixes themselves
  found three high-severity defects the fixes introduced: single-format renders write sh/json
  content into a .md filename (breaking reconcile discovery), the satisfied-clearing fix revokes
  ticks on unverifiable re-reads (re-running executed mutations under --apply), and ttyConfirm
  interpolates record text into bash -c (shell injection).
reviewer: 'QA Engineer'
updated: '2026-08-20T07:35:00Z'

top_issues:
  - id: CR2-1
    severity: high
    finding: >-
      Per-mode FORMAT_FLAGS emits a single --format while --out stays .md, and the renderer
      substitutes the extension only when >1 format is requested — `command` writes a shell
      script and `read-only` writes the JSON sidecar into a .md file, which tracker-reconcile's
      *.handover.*.json discovery then never finds.
    suggested_action: Always substitute the extension per format in the renderer; single-format renders must land on the correct {md,sh,json} filename.
    suggested_owner: dev
  - id: CR2-2
    severity: high
    finding: >-
      Unconditionally recomputing `satisfied` also revokes the tick when the fresh read is
      unverifiable (UNRELIABLE kinds, auth/network failure) or pending-because-no-recipe, so an
      already-executed action returns to outstanding and is re-run by --apply and the .sh — the
      duplicate-mutation risk the original short-circuit prevented.
    suggested_action: Revoke only on positive evidence (a real read showing pending/divergent); keep a prior tick when the fresh state carries no evidence.
    suggested_owner: dev
  - id: CR2-3
    severity: high
    finding: >-
      ttyConfirm builds bash -c script text via JSON.stringify of a prompt containing the
      record's intent — `$(…)` and backticks in a committed record execute in the shell when the
      prompt renders.
    suggested_action: Pass the prompt as data (env var referenced as "$PROMPT" inside a fixed script), never interpolated script text.
    suggested_owner: dev
  - id: CR2-4
    severity: low
    finding: >-
      The --verify .catch is chained after .then, so a render failure is misreported as a
      verification failure and triggers a second unannotated render over already-written files.
    suggested_action: Catch around verifyRecords only; let render failures propagate.
    suggested_owner: dev
  - id: CR2-5
    severity: low
    finding: >-
      The case fallback emits --format md for `full`, whose renderersForMode selection has no
      file format — committing an artifact the mode table forbids.
    suggested_action: full → no file artifact (summary only); keep md only for genuinely unknown modes.
    suggested_owner: dev

