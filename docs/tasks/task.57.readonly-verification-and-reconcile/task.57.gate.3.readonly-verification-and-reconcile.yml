    severity: medium
    finding: >-
      The retention keeps `satisfied: true` through an unverifiable fresh read, while
      tracker-reconcile SKILL.md's state table and "never coerced" invariant read as if any
      unverifiable state renders unticked — contract and code disagree.
    suggested_action: >-
      Keep the semantics (a tick backed by earlier positive evidence survives silence; a
      never-ticked action never gains a tick without evidence) and update SKILL.md + the task's
      Decisions wording to state the retention exception; mark retained ticks in the annotation.
    suggested_owner: dev
  - id: CR3-2
    status: closed
    fixed_date: '2026-08-20'
    severity: medium
    finding: >-
      The Tracker-debt template and §4 PR-comment instruction hardcode `{prefix}.handover.{n}.{name}.md`,
      which single-format `command`/`read-only` runs no longer write.
    suggested_action: Name the artifacts by glob `{prefix}.handover.{n}.{name}.*` in both places.
    suggested_owner: dev
  - id: CR3-3
    status: closed
    fixed_date: '2026-08-20'
    severity: medium
    finding: >-
      `full`'s no-artifact path cannot satisfy the accept-gap checklist item or §4's "committed
      *.handover.* files" wording — a gate full can never pass as written.
    suggested_action: Add the full/no-artifact carve-out to §4 and the checklist item.
    suggested_owner: dev
  - id: CR3-4
    status: closed
    fixed_date: '2026-08-20'
    severity: low
    finding: >-
      A retained tick renders under "verified already in the desired state" with the fresh
      pass's timestamp — asserting a verification that did not happen.
    suggested_action: Render retained ticks distinctly ("ticked previously; this pass could not confirm — {detail}").
    suggested_owner: dev

