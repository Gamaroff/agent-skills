status_reason: 'The cycle-2 refute pass found that two git-name `correct` texts misstate what isDocsPath refuses; QA ran isDocsPath on each claim and confirmed it false. Three further case and comment texts are inaccurate. Two isDocsPath gaps it exposed are identical on develop and are routed to a follow-up.'
