top_issues:
  - id: 'T329-QA-4'
    severity: medium
    file: 'shared/resources/security-input-corpus.mjs'
    finding: 'git-name.dotfile correct: presents its list of .git spellings as complete, but isDocsPath("docs/.git::$INDEX_ALLOCATION/x.md", ["**"]) and isDocsPath("docs/.git:x/y.md", ["**"]) both return true (QA ran both). The list is not what isDotGitSegment refuses in full, and git treats `.git:` as the repository on NTFS. (origin: code-review CR-1, reproduced by QA)'
    suggested_action: 'Reword so the list is not claimed to be complete (name the spellings isDocsPath refuses today, and say the NTFS `.git:` stream form is a known gap tracked for follow-up)'
    suggested_owner: dev
    status: open
  - id: 'T329-QA-5'
    severity: medium
    file: 'shared/resources/security-input-corpus.mjs'
    finding: 'git-name.non-ascii correct: "only control characters are refused" is false both ways. isDocsPath refuses "docs/a.md " (trailing space, normalisePath trims it) and "docs/a<U+2028>.md" (** does not cross a line terminator), and accepts "docs/a<U+0085>.md", a C1 control (QA ran all three). (origin: code-review CR-2, reproduced by QA)'
    suggested_action: 'State the narrow rule the case tests: a byte above 0x7F is not refused for being non-ASCII. Do not claim this is the only refusal'
    suggested_owner: dev
    status: open
  - id: 'T329-QA-6'
    severity: low
    file: 'shared/resources/security-input-corpus.mjs'
    finding: 'The GIT_NAME header says each hostile case is admitted by a copy with one refusal line removed. leading-slash and dot-slash need two (segment and normalise), as GIT_NAME_MUTATIONS records. (origin: code-review CR-3, confirmed against the test table)'
    suggested_action: 'Say one or more refusal lines, and name the two cases with two defences'
    suggested_owner: dev
    status: open
  - id: 'T329-QA-7'
    severity: low
    file: 'shared/resources/tests/security-probe.test.mjs'
    finding: 'The IS_DOCS_LINES comment says hasPathFormDefect exists "since task.325". It exists only on the unmerged task-325 branch. (origin: code-review CR-4, confirmed: absent on develop and on this branch)'
    suggested_action: 'Say the second spelling anticipates the unmerged task-325 refactor'
    suggested_owner: dev
    status: open
  - id: 'T329-QA-8'
    severity: low
    file: 'shared/resources/security-input-corpus.mjs'
    finding: 'git-name.plus-signs why: describes a matcher building a regex from the name. A glob matcher compiles the pattern, not the name, and globMatch (glob-match.js:77) builds no regex at all. (origin: code-review CR-5, confirmed by reading glob-match.js)'
    suggested_action: 'Describe the real risk: a matcher that compiles the pattern to a regex without escaping its literal parts, or one that treats the name as a pattern'
    suggested_owner: dev
    status: open

