    suggested_action: 'Have resolve-ci re-grade every entry that carries ci_reading as well as DEFERRED-CI ones, so each reading replaces the last, with a test that runs FAILURE then SUCCESS on one merged file.'
    suggested_owner: dev
    status: open
  - id: 'T249-QA-4'
    severity: medium
    file: 'skills/finalise/SKILL.md'
    finding: 'The Step 6 action 2a block guards only against an unsubstituted {placeholder}; an empty STEM, DOD_N or DOC_DIR makes both -f tests miss, and the block skips silently with AC_OVERALL short of PASS, the could-not-look state the cycle 1 CR-3 HALT exists to name (code review CR-2, verified: the Step 3a/3c blocks at lines 498-499 and 773-774 carry these guards).'
    suggested_action: 'Add the Step 3c guards to the block: non-empty STEM, numeric DOD_N, non-empty DOC_DIR, each a HALT naming the input; cover one with a fence test.'
    suggested_owner: dev
    status: open
  - id: 'T249-QA-5'
    severity: medium
    file: 'skills/finalise/SKILL.md'
    finding: 'Step 3b.1 item 3a adds an inline case with no spec_ref as a FAIL check, which item 6 folds into a security FAIL, while finalise-dod-security-prompt.md:192 promises the case is not counted against security; a plan-shape omission no code commit can fix then blocks acceptance (code review CR-4, verified).'
    suggested_action: 'Treat a missing spec_ref the way item 5 treats a refused entry — re-dispatch once for a corrected plan — and if it is still missing, report it as a non-gating advisory, so the prompt and the DoD agree.'
    suggested_owner: dev
    status: open
  - id: 'T249-QA-6'
