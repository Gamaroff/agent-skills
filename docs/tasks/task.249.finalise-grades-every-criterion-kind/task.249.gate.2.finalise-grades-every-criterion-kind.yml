    finding: 'The cycle 1 HALT names "state cleaned on resume" as a cause and says to re-run Step 3c''s merge, but that merge reads the scope and agent-result files from the same .claude/state directory, so the named recovery cannot run in the named case (code review CR-3).'
    suggested_action: 'Name a recovery that works: re-run Step 3a, the AC agent and Step 3c with this run''s own record moved aside first.'
