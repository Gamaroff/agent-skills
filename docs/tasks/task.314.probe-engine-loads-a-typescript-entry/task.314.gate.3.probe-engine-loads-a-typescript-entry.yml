    file: 'shared/resources/security-probe-ts-hook.mjs'
    finding: 'The hook bounds the located tsconfig path to PROBE_TS_ROOT, but ts.parseJsonConfigFileContent also follows that config''s extends chain, so a tsconfig inside the repo that extends a file above the root inherits its options. Reproduced with the compiler API: a repo tsconfig extending ../outer.json (target ES5) parses to target 1 (ES5); control: the same config extending a file inside the repo gives the same result, as it should. Same class as T314-CR-1 and T314-CR2-2, for the extended file. Reviewer confidence medium, recorded unchanged.'
    suggested_action: 'Parse with a ParseConfigHost whose readFile and fileExists refuse paths outside the root (or check the extended file list against the root and drop the config), and add a test with a repo tsconfig extending a file in the parent of the repo root, plus a control extending a file inside it.'
