  - id: 'T314-CR-1'
    origin: 'code-review, reproduced by QA'
    severity: medium
    file: 'shared/resources/security-probe.mjs'
    finding: 'checkTypeScriptRuntime resolves typescript with createRequire(entryPath).resolve("typescript"), which walks up past the repo root (and consults the parent process NODE_PATH and global folders). Reproduced: a repo root with no compiler of its own, inside a parent directory that holds node_modules/typescript, is probed (verdict engages, executed 2) instead of declined typescript-unavailable. Control: a repo with its own node_modules/typescript engages as it should. The header, probe-boundary-rule.md and the task say the TARGET repository''s own compiler; reviewer confidence was medium and is recorded unchanged.'
    suggested_action: 'Realpath the resolved compiler and decline typescript-unavailable unless it lies inside the realpath of the repo root; add a test with the compiler only in a parent directory.'
    suggested_owner: dev
    status: open

