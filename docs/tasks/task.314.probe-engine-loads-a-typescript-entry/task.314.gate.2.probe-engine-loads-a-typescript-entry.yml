task: 'task.314.probe-engine-loads-a-typescript-entry'
task_title: 'The security probe engine loads a TypeScript entry'
gate: CONCERNS
status_reason: 'Cycle 1 fix T314-CR-1 verified (mutation proof covered). The refute pass found three new defects, each reproduced by QA: the load hook defaults to ES5 when no target is set, so a thrown Error subclass fails instanceof; the tsconfig lookup climbs past the repo root; and the repo-root bound fails for a root of /.'
reviewer: 'QA Engineer'
head: '3dc1df67dd4a9ccdbdce97b3a7ea5f5dea5e08d6'
updated: '2026-11-20T17:12:00Z'

top_issues:
  - id: 'T314-CR2-1'
    origin: 'code-review, reproduced by QA'
    severity: medium
    file: 'shared/resources/security-probe-ts-hook.mjs'
    finding: 'The hook never sets `target`, and the no-tsconfig default sets none either, so TypeScript defaults to ES5 and downlevels classes. Reproduced: transpileModule with module ESNext only, then importing the output, gives `e instanceof E` false for `class E extends Error`; control with target ES2022 gives true. A guard that tests instanceof on its own error type is scored on altered code. The fixture tsconfig sets a target, so no committed test sees this. Reviewer confidence high, recorded unchanged.'
    suggested_action: 'Default target to ES2022 whenever the options leave it unset (both the no-tsconfig default and a tsconfig without a target) and add a fixture asserting instanceof on a thrown Error subclass, with one tsconfig that sets no target.'
    suggested_owner: dev
    status: open
  - id: 'T314-CR2-2'
    origin: 'code-review, reproduced by QA'
    severity: medium
    file: 'shared/resources/security-probe-ts-hook.mjs'
    finding: 'ts.findConfigFile climbs to the filesystem root, so a repository without its own tsconfig inherits one from an ancestor. Reproduced: a tsconfig.json placed in the parent of the repo root is returned for an entry under the repo. Same class as cycle 1 T314-CR-1, for the config instead of the compiler. Reviewer confidence medium, recorded unchanged.'
    suggested_action: 'Bind the repo root for the child (a second fixed binding set by the engine) and treat a config found outside it as no config; add a test with the tsconfig only in a parent, and a control with it inside.'
    suggested_owner: dev
    status: open
  - id: 'T314-CR2-3'
    origin: 'code-review, reproduced by QA'
    severity: low
    file: 'shared/resources/security-probe.mjs'
    finding: 'The bound `dir.startsWith(root + sep)` is false for every directory when the repo root is `/`, because root + sep is `//` (checked: "/a".startsWith("//") is false). A container repo rooted at / is declined typescript-unavailable although it has the compiler. Reproduced at the primitive, not through the engine; reviewer confidence medium.'
    suggested_action: 'Use isWithin(root, dir), which resolveEntry already uses, and add a root-of-/ case to the unit test of the helper.'
    suggested_owner: dev
    status: open

