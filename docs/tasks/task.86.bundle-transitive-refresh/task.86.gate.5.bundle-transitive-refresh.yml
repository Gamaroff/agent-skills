gate: CONCERNS
status_reason: >-
  Cycle 5 is the last in the 5-cycle budget. It found two HIGH findings, both defects introduced by
  cycle 4 — continuing the pattern where each cycle's fix creates the next cycle's finding. Both are
  fixed and mutation-proven, and the more serious one is a straight REVERT of a cycle-4 change rather
  than new work. The gate is CONCERNS rather than PASS because the loop has reached its limit with the
  churn still live, and rather than FAIL because every finding is closed, the deliverable is sound, and
  all evidence is recorded for the handover.
reviewer: 'QA Engineer'
updated: '2026-09-08T14:30:00Z'

top_issues:
  - id: 'C5-003'
    severity: high
    file: 'skills/create-skill/scripts/bundle_skill.py'
    finding: >-
      Cycle 4's pass-3 FENCE EXEMPTION was a functional regression, reverted here. The reasoning behind
      it — "a fenced block is an example" — is false for this repo: skill docs use fences for the
      commands the agent runs. 75 lines across 24 SKILL.md files invoke
      `source references/resolve-platform.sh`, `node references/tracker-issue.js` and the like inside
      ```bash blocks, and they hold the `references/` form BECAUSE pass 3 rewrote them. Under the
      exemption, the next author writing the `shared/resources/` form inside a fence ships a path that
      exists in no install — with `--check` reporting green. That is the exact failure this task exists
      to eliminate, introduced while fixing it. No live breakage (the tree is already rewritten), so it
      would have bitten a future author silently.
    suggested_action: >-
      Revert the fence exemption; keep the URL exemption, which covers the 404 case cycle 4 actually
      had evidence for.
    suggested_owner: dev
    status: closed
    fixed_date: '2026-09-08'

  - id: 'C5-004'
    severity: high
    file: 'skills/create-skill/scripts/bundle_skill.py'
    finding: >-
      Cycle 4's C4-006 guard went on the WRONG READ, and its comment overstated what it fixed. It
      claimed `discover_needed`'s `f.read_text()` was "the only unguarded read in the file"; it was
      not. Pass 3's read is the one that actually crashes, and it stayed unguarded. Because the
      check-side equivalent WAS already guarded, `--check` reported green for a skill on which
      `npm run bundle` died with a raw UnicodeDecodeError — green-CI-but-broken-bundler, the same split
      this task exists to close. With multiple targets it also aborted before later skills bundled.
    suggested_action: 'Guard pass 3''s read too; correct the "only unguarded read" claim.'
    suggested_owner: dev
    status: closed
    fixed_date: '2026-09-08'

  - id: 'C5-001'
    severity: medium
    file: 'skills/create-skill/scripts/bundle_skill.py'
    finding: >-
      A 0444 source is self-locking: run 1 writes the copy and mirrors the mode, and run 2 dies with an
      uncaught PermissionError before it can update it after a source change. Found by direct probe.
      **Attribution corrected by the cycle-5 reviewer**: this is PRE-EXISTING, not a cycle-4 regression
      — `write_if_changed`'s unconditional `chmod` is present verbatim at e14bccae, and cycle 4 only
      removed a vestigial `if True:` wrapper in `check_skill` (a verified no-op). No live exposure:
      every file under `shared/resources/` is 0644 or 0755.
    suggested_action: 'Restore write permission on the destination before writing.'
    suggested_owner: dev
    status: closed
    fixed_date: '2026-09-08'

