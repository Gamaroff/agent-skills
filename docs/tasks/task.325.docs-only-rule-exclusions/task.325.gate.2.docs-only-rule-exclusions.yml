task_title: 'The docs-only CI rule can exclude a path'
gate: CONCERNS
status_reason: 'Cycle 1''s fix holds: every prose reader now states the exclusion rule. One new medium finding, reproduced by execution: readConfig accepts an exclusion spelled so that it can never match (`! docs/x.md`, `!./docs/x.md`, `!/docs/x.md`, ` !docs/x.md`), and that entry silently excludes nothing.'
reviewer: 'QA Engineer'
head: '0dfb1981117f2164cb1bd6ae71f9c360e85d43ca'
updated: '2026-11-26T11:31:43Z'

top_issues:
  - id: 'T325-CR-101'
    severity: medium
    file: 'shared/resources/qa-docs-only-review-prompt.md'
    finding: 'Prose route readers did not mention exclusions. Fixed in 0dfb19811 at all four sites, plus finalise/SKILL.md and configuration.md; re-read at this head.'
    suggested_action: 'None.'
    suggested_owner: dev
    status: closed
    fixed_date: '2026-11-26'
  - id: 'T325-CR-201'
    severity: medium
    file: 'shared/resources/ci-tree-equivalence.js'
    finding: 'The bare-`!` refusal (ci-tree-equivalence.js:783) catches only the exact string `!`. readConfig accepts `- "! docs/catalogue.md"` (probe in a scratch repo: accepted, patterns ["docs/**","! docs/catalogue.md"]). isDocsPath("docs/catalogue.md", ["docs/**", X]) is true for X = "! docs/catalogue.md", "!./docs/catalogue.md", "!/docs/catalogue.md" and " !docs/catalogue.md", and false only for "!docs/catalogue.md" (control). isDocsPath refuses a path that is not in normalised form before it matches, so an exclusion written that way can never match: the file the owner meant to keep as code stays documentation and its CI can be skipped. A leading space makes the entry an inclusion. Origin: code-review CR-1 (medium/medium), reproduced by QA by execution (step 5d: gates at any confidence).'
    suggested_action: 'In interpretConfig, refuse an entry whose trimmed text starts with `!` when the raw text does not, and an exclusion whose remainder is empty, starts with `!`, or is not already in normalised form (normalisePath(rest) !== rest). Hold each spelling in a readConfig test, and keep "!docs/catalogue.md", "!docs/**", "!**/*.sh.md" and "!secret/**" accepted.'
    suggested_owner: dev
    status: open
  - id: 'T325-CR-202'
    severity: low
    file: 'shared/resources/ci-tree-equivalence.js'
    finding: 'isDocsPath''s non-array branch `return matchesAnyGlob(file, globs)` always returns false (verified: isDocsPath("docs/x.md", "docs/**") is false). Correct, but it reads as if a string were matched.'
    suggested_action: 'Return false directly for a non-array.'
    suggested_owner: dev
    status: open

