task: 'task.325.docs-only-rule-exclusions'
task_title: 'The docs-only CI rule can exclude a path'
gate: CONCERNS
status_reason: 'Cycle 2''s refusal covers only the form normalisePath rewrites. isDocsPath also refuses a path with an empty, `.` or `..` segment before it matches, so `!docs/generated/` (a gitignore habit), `!docs//x.md` and `!docs/./x.md` are still accepted and exclude nothing. Reproduced by execution. `!!x.md` is refused although it matches a file named `!x.md`.'
reviewer: 'QA Engineer'
