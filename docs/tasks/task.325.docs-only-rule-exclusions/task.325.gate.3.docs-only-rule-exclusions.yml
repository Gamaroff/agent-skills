  - id: 'T325-CR-301'
    severity: medium
    file: 'shared/resources/ci-tree-equivalence.js'
    finding: 'interpretConfig (ci-tree-equivalence.js:798) checks an exclusion''s remainder against normalisePath only, but isDocsPath refuses more path forms before it matches: control characters and empty, `.` or `..` segments (:175-178). An exclusion in one of those forms can only match a path isDocsPath already refused, so it excludes nothing. Probe at 1beeadf88: isDocsPath(f, ["**", X]) is true for X = "!docs/generated/" (f = docs/generated/a.md), "!docs//x.md" and "!docs/./x.md" (f = docs/x.md), and parseConfig accepts each. Control: "!docs/generated/**" is false. The trailing-slash form is what an owner used to .gitignore would write. Origin: code-review CR-1 (medium/high) and CR-2 (low/high), reproduced by QA by execution. This is the second consecutive gate naming this mechanism, a deny-list that copies part of isDocsPath''s refusals.'
    suggested_action: 'Consolidate: define isDocsPath''s path-form refusals (control characters, empty/./.. segments, normalisePath) once, call it from isDocsPath and on an exclusion''s remainder in interpretConfig, so the two cannot drift. Have the message suggest `!dir/**` for a directory.'
    suggested_owner: dev
    status: open
  - id: 'T325-CR-302'
    severity: low
    file: 'shared/resources/ci-tree-equivalence.js'
    finding: '`!!x.md` is refused as "can never match", but isDocsPath("!x.md", ["**/*.md","!!x.md"]) is false: it excludes a file literally named `!x.md`. Fail-closed and rare, but the refusal and its message are wrong.'
    suggested_action: 'Allow a remainder that starts with `!`; it names a path beginning with `!`.'
    suggested_owner: dev
    status: open

