  - id: 'T325-CR-401'
    severity: medium
    file: 'shared/resources/ci-tree-equivalence.js'
    finding: 'Reproduced by execution at 3cffeb926. With the list ["docs/**","!docs/{catalogue,index}.md"], isDocsPath returns true for both docs/catalogue.md and docs/index.md. isDocsPath("docs/a.md", ["docs/**","!docs/[ab].md"]) is also true. glob-match''s only wildcards are `*`, `**` and `?`; every other character matches itself, so `{` and `[` are literal (matchesAnyGlob("docs/{a,b}.md", ["docs/{a,b}.md"]) is true). A gitignore or minimatch user who writes a brace or class exclusion gets one that silently excludes nothing, and the docs never state the grammar. This is the third consecutive gate naming the exclusion check: it keeps closing one shape at a time. Origin: code-review CR-1 (medium/medium).'
    suggested_action: 'State the grammar in the reference and the runbook: only `*`, `**` and `?` are wildcards, and every other character matches itself. Refuse `{`, `}`, `[` and `]` in an exclusion with a "not supported" message, not "can never match", since such a pattern can match a file literally named that way. Keep the refusal claim scoped: the docs should not imply that every non-matching exclusion is refused.'
    suggested_owner: dev
    status: open

