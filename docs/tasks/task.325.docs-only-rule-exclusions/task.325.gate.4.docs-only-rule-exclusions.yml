task_title: 'The docs-only CI rule can exclude a path'
gate: CONCERNS
status_reason: 'Cycle 3 consolidated the path-form refusals, and isDocsPath agrees with origin/develop on 216 path and pattern cases with no `!` entry. One medium, reproduced: an exclusion written in another glob dialect is accepted, and it excludes nothing. Examples are braces (`!docs/{catalogue,index}.md`) and a character class (`!docs/[ab].md`). glob-match treats `{` and `[` as literal characters, and no doc says so.'
