schema: 1
task: "task.43.change-log-templates-and-creation"
task_title: "Templates and creation skills emit the canonical Change Log"
gate: CONCERNS
status_reason: "All five phases implemented and verified; full suite, both evals and CI green, every byte-lock holds through bundling. One real defect in the new authoring guidance: create-epic is instructed to keep frontmatter `updated:` in step with the seeded row, but the epic frontmatter contract has no `updated:` field, so the instruction cannot be satisfied."
reviewer: "QA Engineer"
updated: "2026-08-12T20:10:00Z"

top_issues:
  - id: CR-2
    severity: medium
    finding: "create-epic's new Change Log guidance requires frontmatter `updated:` to match the seeded row's date, but the epic frontmatter contract (docs/templates/epic-template.md:17-28, the block create-epic emits at SKILL.md:149-161, and the required-field list at SKILL.md:347) has no `updated:` field — the instruction is unsatisfiable as written."
    suggested_action: "Reword the epic-side guidance so it does not assert a field the epic schema lacks, and record the missing-`updated:`-on-epics gap as a follow-on rather than changing the epic frontmatter contract inside this task."
    suggested_owner: dev
  - id: CR-3
    severity: low
    finding: "create-epic seeds the row with `{{today}}` (SKILL.md:268) while its own validation bullet (SKILL.md:350) and all five sibling create-* skills use `{today}`; `{{today}}` appears nowhere else in the repo outside this task's plan file."
    suggested_action: "Use `{today}` in both places in create-epic, matching the five sibling skills."
    suggested_owner: dev
  - id: CR-4
    severity: low
    finding: "The byte-locked epic-template copies carry the literal comment path `shared/resources/document-change-log.md`, which does not resolve inside a bundled skill because bundling deliberately skips `references/` — an agent reading the bundled copy follows a dead pointer even though a live `references/document-change-log.md` sits beside it."
    suggested_action: "Name both path forms in the template comment so the pointer resolves in-repo and in a bundled skill without breaking byte-equality."
    suggested_owner: dev

