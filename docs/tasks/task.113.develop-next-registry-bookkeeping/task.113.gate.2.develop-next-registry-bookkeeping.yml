    severity: low
    file: 'shared/resources/registry-tick.js'
    finding: 'The notes cell IS the Depends on cell the selector parses: parseDepCell("… · PR #381 merged") yields a dependency on task 381 (verified on rows 100 and 106), so an annotate on a NOT-accepted row would inject a phantom dependency that can block its selection; accepted rows are inert only because eligibility skips them first.'
    suggested_action: 'Refuse annotate unless the ROW already reads accepted (finalise has ticked it before Step 4 runs) — reason not-accepted; keep the document-status independence.'
    suggested_owner: dev
    status: open
