    severity: low
    file: 'skills/develop-next/SKILL.md'
    finding: 'Step 4 branches on item.source "recorded at Step 1", but the run-state schema carries no source field, so a resume into Step 4 has nothing to branch on.'
    suggested_action: 'Add source to the run-state JSON written at selection and name it as what Step 4 reads on resume.'
    suggested_owner: dev
    status: open
  - id: 'QA-10'
    severity: low
    file: 'shared/resources/registry-tick.js'
    finding: 'findHeader requires -{3,} in the separator while the selector accepts any GFM delimiter row (| - |, |:--|), so a registry the parser reads fine answers no-cell with "no table header above it".'
    suggested_action: 'Accept hyphens with optional colons, any count, when walking up to the header.'
    suggested_owner: dev
    status: open
