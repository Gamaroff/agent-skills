top_issues:
  - id: 'QA-1'
    severity: medium
    file: 'skills/develop-next/SKILL.md'
    finding: 'Step 4 registry arm passes the optional --issue via ${ISSUE_REF:+--issue "$ISSUE_REF"}, which zsh expands as ONE word — registry-tick.js exits 2 (unknown argument) on exactly the case the Issue cell exists for.'
    suggested_action: 'Build ISSUE_ARGS=() / ISSUE_ARGS=(--issue "$ISSUE_REF") and expand "${ISSUE_ARGS[@]}"; shape-assert the :+ form absent.'
    suggested_owner: dev
    status: open
  - id: 'QA-2'
    severity: medium
    file: 'shared/resources/registry-tick.js'
    finding: '--issue is written verbatim: a missing value writes the literal "undefined", an empty value blanks the cell, "|" adds a cell and a newline splits the row — all reported as written.'
    suggested_action: 'Reject missing/empty --issue and any value containing "|", CR or LF as a usage error (exit 2, nothing written); fixture each case.'
    suggested_owner: dev
    status: open
  - id: 'QA-3'
    severity: medium
    file: 'shared/resources/registry-tick.js'
    finding: 'The no-cell guard (dataCells < 5) is unreachable — parseRegistry already drops such rows — and a 6-column registry with no notes column gets its last DATA cell annotated (verified: Created cell rewritten).'
    suggested_action: 'Resolve the notes cell from the header the walk already finds; answer no-cell when the last header names a known data column; fixture a 6-column registry → no-cell, byte-identical.'
    suggested_owner: dev
    status: open
  - id: 'QA-4'
    severity: medium
    file: 'skills/develop-next/SKILL.md'
    finding: 'The matrix row "accepted | WAIVED | no → merge" is unreachable: qa-gate keeps waived findings in top_issues[] with no status field and the new open-entry rule reads an absent status as open, so every WAIVED gate HALTs.'
    suggested_action: 'State that under gate: WAIVED with waiver.active: true, entries without a status are waived, not open — in both develop-next and develop-batch; shape-assert the clause.'
    suggested_owner: dev
    status: open
  - id: 'QA-5'
    severity: low
    file: 'shared/resources/develop-pipeline-step-2-review.md'
    finding: 'GITHUB_ISSUE is assigned before the null normalisation on the re-read, so github_issue: null leaves the compatibility variable holding the literal "null" (Phase 0c resets both).'
    suggested_action: 'Move the GITHUB_ISSUE assignment after the null reset.'
    suggested_owner: dev
    status: open
  - id: 'QA-6'
    severity: low
    file: 'shared/resources/registry-tick.js'
    finding: 'The header walk uses a private separator regex that diverges from the selector TABLE_SEPARATOR_RE, matches a bare --- rule, and does not stop at prose — it can read an earlier unrelated table header (cleanup, advisory).'
    suggested_action: 'Export TABLE_SEPARATOR_RE / a findHeader() helper from select-next.mjs and reuse it, stopping at the first non-table line.'
    suggested_owner: dev
    status: open

