task_title: "develop-next's Step 4, merge gate and Step 1→2 signal still assume a roadmap-sourced, PASS-gated item"
gate: CONCERNS
status_reason: 'All phases implemented and green (3221/0, 9 mutations proven); four MEDIUM defects — a zsh word-split in the Step 4 snippet, unvalidated --issue input, an unreachable no-cell guard, and an unreachable WAIVED→merge matrix row — each with a bounded fix.'
