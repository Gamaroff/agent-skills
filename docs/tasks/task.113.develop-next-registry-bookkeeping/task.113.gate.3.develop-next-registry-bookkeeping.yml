top_issues:
  - id: 'QA-12'
    severity: medium
    file: 'skills/develop-next/SKILL.md'
    finding: 'The QA-7 recovery uses git diff --quiet -- <registry>, which compares the working tree to the INDEX only; a crash after git add but before git commit leaves the edit staged, the check reads clean, ticked: true is written and the edit is never committed — the exact window the branch exists to close (mirrored in develop-batch). Verified in a scratch clone.'
    suggested_action: 'Use git diff --quiet HEAD -- docs/tasks/task-registry.md in both skills so staged and unstaged edits are both caught; update the two pinned shape regexes.'
    suggested_owner: dev
    status: open
  - id: 'QA-13'
    severity: low
    file: 'shared/resources/registry-tick.js'
    finding: 'In --annotate mode the shared early exits (no-registry, engine-unavailable, no-row, not-a-task) emit ticked: false and no annotated field, so a --json consumer branching on annotated sees undefined for four documented annotate reasons.'
    suggested_action: 'Emit the mode-appropriate key uniformly from one place (annotated: false whenever opts.annotate is set).'
    suggested_owner: dev
    status: open
  - id: 'QA-14'
    severity: low
    file: 'shared/resources/registry-tick.js'
    finding: 'isEmptyCell accepts blank/—/-/– while the selector DEP_EMPTY_RE reading the same cell also treats none, n/a, na, tbd as empty — a notes cell reading none becomes "none · PR #n merged" and an Issue cell reading TBD is kept rather than filled.'
    suggested_action: 'Align isEmptyCell with the selector spellings (mirror DEP_EMPTY_RE) so both readers of the cell agree on empty.'
    suggested_owner: dev
    status: open

