task_title: '/qa-next <id> — target a specific registry item'
gate: CONCERNS
status_reason: "Cycle 3's append rule holds — all four writers of the note cell were enumerated and no path bypasses it. Five residual findings, none HIGH: the append makes a pre-existing pipe-corruption irrecoverable on a kept row, and makes the payload's single bug link ambiguous."
reviewer: 'QA Engineer'
updated: '2026-09-22T22:30:00Z'

top_issues:
  - id: 'TASK-141-BUG-9'
    severity: medium
    file: 'skills/qa-next/scripts/uat-status.mjs'
    finding: "renderRow joins cells with an unescaped `|`, so a raw pipe in a --note splits the row and --check reports a cell-count error (a /qa-next Step 0 HALT). The CORRUPTION is pre-existing — renderRow is byte-identical on origin/develop and base's cmdSet wrote the raw note too — but the append rule makes it IRRECOVERABLE on a kept ✅: --clear-note is refused there and every later --set appends onto the already-split cell, so the only repairs are a demotion (which destroys the sign-off) or a hand edit."
    suggested_action: "Escape `|` as `\\|` once inside renderRow, the single writer for every cell the tool emits; splitCells already honours it via its (?<!\\\\) lookbehind, so the round-trip is closed."
    suggested_owner: dev
    status: open
  - id: 'TASK-141-BUG-10'
    severity: medium
    file: 'skills/qa-next/scripts/uat-status.mjs'
    finding: "describeRow.bug takes the FIRST bug-shaped link in Notes / bug, and the append rule makes that cell multi-valued on a kept ✅, so an older bug link wins over a newer one — while SKILL.md Step 4.2 tells the skill to re-link precisely that value as 'the open bug'. Verified: the cell `[bug.1.old](…) · accepted … · [bug.7.new](…)` reports bug.1.old."
    suggested_action: 'Take the LAST bug match so the newest link wins on an appended cell, and say so in the field comment.'
    suggested_owner: dev
    status: open
  - id: 'TASK-141-CR4-3'
    severity: low
    file: 'skills/qa-next/scripts/uat-status.mjs'
    finding: 'The append has no duplicate suppression and no cap: a ✅ row blocked nightly by the same missing credential grows its cell forever, and --clear-note is refused there so it cannot be trimmed without demoting the row.'
    suggested_action: 'Skip the append when the new segment equals the cell last segment, which keeps the operation an append while bounding the cell.'
    suggested_owner: dev
    status: open
  - id: 'TASK-141-CR4-4'
    severity: low
    file: 'skills/qa-next/scripts/uat-status.mjs'
    finding: "`kept` is a hand-listed subset of STATES, so the replacement for two failed flag-enumerations is itself an enumeration in the other direction: a seventh state would default to kept-on-accepted with nothing forcing the re-check. cmdSet holds two more such lists (['pass','fail'] needs --run, ['na','blocked'] needs --note) and the population Object.keys(STATES) is listed at none of the three sites."
    suggested_action: 'Add a test that enumerates Object.keys(STATES) and asserts every state is classified by each of the three rules, so a new state cannot be added silently.'
    suggested_owner: dev
    status: open
  - id: 'TASK-141-CR4-5'
    severity: low
    file: 'skills/qa-next/README.md'
    finding: "The new paragraph says a pass, blocked or n/a against an accepted row 'updates Last run', but --run is only required for pass/fail and the cell is written under `if (run)` — a blocked or n/a re-run keeps ✅, appends the note and leaves the stale Last run link untouched."
    suggested_action: "Qualify to 'updates Last run when the verdict carried one'."
    suggested_owner: dev
    status: open

