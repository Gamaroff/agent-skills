gate: CONCERNS
status_reason: "No HIGH for the eighth consecutive gate. 0c0ed980's Step 6 reordering holds for priorRuns, but the rule it relies on (line 84: 'every later step reads priorRuns and bug from the state file') is too broad for bug: the state file's bug is the row's bug at selection, so Step 6's 'the bug (if any)' prints nothing on a first failure and the old closed bug on a repeat one. The new rule wording also says 'letter' where JS \\b means an ASCII letter."
reviewer: 'QA Engineer'
updated: '2026-09-23T13:28:29Z'

top_issues:
  - id: 'TASK-141-BUG-23'
    severity: medium
    file: 'skills/qa-next/SKILL.md'
    finding: "SKILL.md line 84 says every later step reads priorRuns AND bug from the state file, but the state file's bug is the row's link at selection. The bug this run files or re-links in Step 4.2 is never saved there, so Step 6's 'the bug (if any)' prints no bug after a first failure and the previous (closed) bug after a repeat failure. The rule introduced by the cycle-10 CR-2 fix is correct for priorRuns and over-broad for bug."
    suggested_action: "Scope the rule: the state file's bug is the row's pre-run bug, used only by Step 4's reuse decision. Save the bug this run filed or re-linked to the state file (e.g. filedBug) at Step 4.2 and have Step 6 print that."
    suggested_owner: dev
    status: closed
    fixed_date: '2026-09-23'
  - id: 'TASK-141-CR12-2'
    severity: low
    file: 'skills/qa-next/scripts/uat-status.mjs'
    finding: "BUG_LINK_RULE says 'not preceded by a letter, digit or underscore', but \\b without the u flag treats only ASCII as word characters: [ébug.9](x) and [Ωbug.9](x) match and are validated (probed)."
    suggested_action: "Say 'an ASCII letter, digit or underscore' in the rule (constant and README), and add a clause row with a non-ASCII letter that pins the \\b behaviour."
    suggested_owner: dev
    status: closed
    fixed_date: '2026-09-23'
  - id: 'TASK-141-CR12-4'
    severity: low
    file: 'skills/qa-next/scripts/uat-status.mjs'
    finding: "The comment above BUG_LINK_RE still says '`bug.` must START A WORD', and the clause-test label still says '`bug.` must start a word', after the rule wording changed."
    suggested_action: 'Reword the comment and the test label to match the rule.'
    suggested_owner: dev
    status: closed
    fixed_date: '2026-09-23'

