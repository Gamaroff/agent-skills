    severity: high
    file: 'skills/qa-next/scripts/uat-status.mjs'
    finding: "renderRow escaped `|` but splitCells never unescaped it, so parse and render were not inverses and every --set re-escaped an already-escaped pipe: an authored `a \\| b` gained one backslash per rewrite, with --check green throughout and the backslashes handed to the skill in --item --json. Introduced by cycle 4; no accumulation on origin/develop, where renderRow does not escape."
    suggested_action: 'Unescape in splitCells so the two are inverses, and assert idempotence of the whole round trip rather than either half.'
    suggested_owner: dev
    status: closed
    fixed_date: '2026-09-22'
  - id: 'TASK-141-BUG-12'
    severity: medium
    file: 'skills/qa-next/scripts/uat-status.mjs'
    finding: "checkRegistry validated the FIRST bug link while describeRow (cycle 4) returns the LAST, so --check proved a different file exists from the one SKILL.md Step 4 opens to append a re-test section."
    suggested_action: 'Validate every bug link in the cell, which is strictly stronger and removes the divergence.'
    suggested_owner: dev
    status: closed
    fixed_date: '2026-09-22'
  - id: 'TASK-141-BUG-13'
    severity: medium
    file: 'skills/qa-next/scripts/uat-status.mjs'
    finding: "appendNote's duplicate suppression both over- and under-suppressed, because ` · ` is the registry's separator AND legal inside a note: no string comparison can tell a tail SEGMENT from a compound note's tail. Three formulations were tried and each dropped a genuinely new note in one direction or another."
    suggested_action: 'Remove the suppression rather than approximate it; a dropped note is silent data loss, a repeated segment is visible noise. Record the growth as an accepted limitation.'
    suggested_owner: dev
    status: closed
    fixed_date: '2026-09-22'
