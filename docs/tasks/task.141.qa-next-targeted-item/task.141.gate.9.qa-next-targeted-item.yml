task: 'task.141.qa-next-targeted-item'
task_title: '/qa-next <id> — target a specific registry item'
gate: CONCERNS
status_reason: "No HIGH for the fifth consecutive gate. Cycle 8's value-sharing fix holds: wherever --check exits 0, the published `bug` is the string `exists` was called on. But `bug` is registry-relative and `--bug` takes a repo-relative path, so the documented repeat-failure flow (read `bug`, re-link it with `--set … fail --bug`) writes a broken link; that defect has been there since the original feature commit, and eight gates missed it. The new BUG_LINK_RULE also names the wrong base: it says 'repo-relative', and a link written that way fails --check."
reviewer: 'QA Engineer'
updated: '2026-09-23T05:16:52Z'

top_issues:
  - id: 'TASK-141-BUG-20'
    severity: medium
    file: 'skills/qa-next/scripts/uat-status.mjs'
    finding: "BUG_LINK_RULE, which the skeleton writes into every registry and the README quotes verbatim, says the target is 'a repo-relative path'. The checker resolves it against the registry's own directory (join(root, registryDir, p); the file header says 'relative to the registry's own directory'). A link written the way the rule says, `[bug.1.real](docs/bugs/bug.1.real.md)`, fails --check with 'bug file not found' (measured: rc 1). The rule-once test pins the wrong word with `/repo-relative/` and ties the constant to behaviour only through keyword regexes."
    suggested_action: "Say 'a path relative to the registry file', and replace the keyword regexes with a table-driven test that feeds --check one link per clause of the rule (the resolving base, #fragment, scheme, //host, anchor-only), so the words are held to the behaviour and not only to the constant."
    suggested_owner: dev
    status: closed
    fixed_date: '2026-09-23'
  - id: 'TASK-141-BUG-21'
    severity: medium
    file: 'skills/qa-next/scripts/uat-status.mjs'
    finding: "The payload's `bug` is relative to the registry (`../bugs/bug.1.real.md`), but `--set … --bug` takes a repo-relative path and re-relativises it. SKILL.md Step 4 says a repeat failure reads `bug` and links the same bug again, and following it literally writes `[bug.1.real](../../../bugs/bug.1.real.md)`, turns --check red and HALTs at the verification step. Measured on HEAD, on c5efbe9b and on the original feature commit 9efe0d22, so it has been present since the field was introduced and is not from cycle 8's fix. Rated MEDIUM, not HIGH: it fails loudly (--check catches it before commit), and only the repeat-failure path is affected, not re-testing in general."
    suggested_action: "Publish `bug` in the same coordinate system `--bug` accepts (repo-relative: join the registry directory with the verified path), so that the payload round-trips; state that in SKILL.md; and add a test that feeds payload.bug back through `--set fail --bug` and requires --check to stay green."
    suggested_owner: dev
    status: closed
    fixed_date: '2026-09-23'

