updated: '2026-09-23T00:30:00Z'

top_issues:
  - id: 'TASK-141-BUG-14'
    severity: medium
    file: 'skills/qa-next/scripts/uat-status.mjs'
    finding: "Validating EVERY bug-shaped link on a fail row turns a non-file link into a hard --check error: a note reading `[bug.1.real](../bugs/bug.1.real.md) — see [bug.99 discussion](https://example.com/issues/99)` gives `bug file not found: https://example.com/issues/99`, exit 1, which /qa-next Step 0 treats as HALT registry-invalid. The identical fixture is exit 0 on origin/develop, so this is a regression introduced by cycle 5, not pre-existing."
    suggested_action: 'Skip links that are not repo-relative file paths before the exists check, so only links the tool itself could have written must resolve.'
    suggested_owner: dev
    status: open
  - id: 'TASK-141-BUG-15'
    severity: medium
    file: 'skills/qa-next/scripts/uat-status.mjs'
    finding: "describeRow publishes `bug` for a row in ANY state, but checkRegistry validates bug links only when the state is fail — so a ⏸ blocked or ✅ accepted row carrying a stale link passes --check at exit 0 while --item --json hands the skill that path and SKILL.md Step 4 opens it to append a re-test section. The same class cycle 5's own fix claimed to close, left open on four of the six states."
    suggested_action: 'Validate every bug-shaped repo-relative link on every row; keep the "a bug link is required" rule as the fail-only extra.'
    suggested_owner: dev
    status: open
  - id: 'TASK-141-CR6-3'
    severity: low
    file: 'skills/qa-next/scripts/uat-status.mjs'
    finding: "appendNote's header comment still describes the duplicate suppression cycle 5 removed, contradicting the body comment three lines below it and the observed behaviour. The fifth cycle in which one statement of a rule was updated and its twin was not — this time both inside the same function."
    suggested_action: 'Delete the stale header lines; the in-body comment already states the rule and its accepted cost.'
    suggested_owner: dev
    status: open
  - id: 'TASK-141-CR6-4'
    severity: low
    file: 'evals/qa-next/unit/uat-status.test.mjs'
    finding: "The STATES population test's non-vacuity floor is the literal 10. It does catch a skipped state (verified), but a sixth state added to BOTH STATES and RULES — the correct extension the test exists to force — reds on the floor with a message pointing at the wrong thing."
    suggested_action: 'Derive the floor from the RULES table so the skipped-state protection survives without the false red on a legitimate new state.'
    suggested_owner: dev
    status: open

