task_title: '/qa-next <id> — target a specific registry item'
gate: CONCERNS
status_reason: "Cycle 5's round-trip fix verified clean under adversarial input — the HIGH is genuinely closed. Two MEDIUMs, both in cycle 5's every-bug-link change and both closed by one correction: validate every repo-relative bug link on every row, rather than every link on fail rows only."
