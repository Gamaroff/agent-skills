top_issues:
  - id: 'TASK-141-BUG-3'
    severity: high
    file: 'skills/qa-next/SKILL.md'
    finding: 'CI `validate` fails — `qa-next — Description cannot contain angle brackets (< or >)`. The frontmatter description gained `/qa-next <id>` when the positional argument was documented; `quick_validate.py` refuses angle brackets and no local gate the pipeline runs executes it.'
    suggested_action: 'Replace `<id>` in the description with a concrete example id, and run `npm run validate -- skills/qa-next/` before the next push.'
    suggested_owner: dev
    status: open
  - id: 'TASK-141-BUG-4'
    severity: medium
    file: 'skills/qa-next/SKILL.md'
    finding: 'Two sentences still assert "Only a `fail` moves it, and it moves it from any state" (Step 4) and "Only a failure moves an accepted row" (never-does list) — both made false by the cycle-1 fix, which lets `untested` move an accepted row deliberately.'
    suggested_action: 'Amend both to name the demotion beside the fail, as README.md § Registry states already does.'
    suggested_owner: dev
    status: open
  - id: 'TASK-141-BUG-5'
    severity: medium
    file: 'skills/qa-next/scripts/uat-status.mjs'
    finding: 'The kept-✅ sign-off guard is defeated through a different door: --clear-note is refused on that cell, but --set <id> blocked|na --note replaces it, keeps ✅, and leaves --check green. The cycle-1 test asserts the state cell in those legs, never the note cell.'
    suggested_action: 'Refuse --note on a kept ✅ for the same reason --clear-note is refused, and assert the note cell in the blocked/na legs.'
    suggested_owner: dev
    status: open
  - id: 'TASK-141-BUG-6'
    severity: medium
    file: 'skills/qa-next/scripts/uat-status.mjs'
    finding: 'normaliseId is applied in cmdItem and cmdRunPath only; updateRow compares the raw id, so --set, --accept, --items and --automated reject a lowercase id. The finding is the missing population check over every id-taking command, not the four sites.'
    suggested_action: 'Normalise once in updateRow, the single writer, and add a test enumerating all six id-taking commands.'
    suggested_owner: dev
    status: open
  - id: 'TASK-141-CR2-5'
    severity: low
    file: 'skills/qa-next/scripts/uat-status.mjs'
    finding: 'A bare --item resolves to an empty id and exits 4, conflating "you named no row" with "you named a row that is not there"; Step 1 maps exit 4 to STOP unknown-item, the wrong stop for a malformed call. The cycle-1 contract test enshrines the conflation.'
    suggested_action: 'Exit 2 for a missing or flag-shaped value; keep exit 4 for a well-formed id with no row, and correct that assertion.'
    suggested_owner: dev
    status: open
  - id: 'TASK-141-CR2-3'
    severity: low
    file: 'skills/qa-next/scripts/uat-status.mjs'
    finding: 'cmdRunPath calls mkdirSync before runPathFor validates --env, so a refused ambiguous label still creates an empty runs/<id>/ — a refusal that writes.'
    suggested_action: 'Compute the path before creating the directory: read `existing` via existsSync, call runPathFor, then mkdirSync on the success path only.'
    suggested_owner: dev
    status: open

