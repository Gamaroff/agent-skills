  - id: 'TASK-141-BUG-16'
    severity: medium
    file: 'skills/qa-next/scripts/uat-status.mjs'
    finding: "checkRegistry learned to skip scheme-qualified links; describeRow did not, and still published the last bug-shaped link regardless of shape. The exact fixture cycle 6's own test declares legal was --check green while --item --json handed the skill `https://example.com/issues/99`, which SKILL.md Step 4 opens. The same skip also let a fail row satisfy 'requires a bug link' with a URL alone and existence-check nothing, where the base exited 1."
    suggested_action: 'One predicate used by both sites, so validated and published cannot diverge again.'
    suggested_owner: dev
    status: closed
    fixed_date: '2026-09-23'
  - id: 'TASK-141-BUG-17'
    severity: medium
    file: 'skills/qa-next/README.md'
    finding: "README still stated the pre-change rule — '❌ carries a bug link that resolves' — while the code requires a resolvable tool-written link on EVERY row and requires one to be present only on ❌. An owner reading it could not know a stale link on a ⏸/➖/✅ row now exits 1."
    suggested_action: 'Restate it, and check the other statements of the same rule in the same edit.'
    suggested_owner: dev
    status: closed
    fixed_date: '2026-09-23'
  - id: 'TASK-141-CR7-3'
    severity: low
    file: 'skills/qa-next/scripts/uat-status.mjs'
    finding: "The prose-link exemption covered a scheme and a leading # but not a #fragment on a repo-relative path, so `../bugs/bug.1.real.md#repro` errored naming a file that does exist; protocol-relative `//host/x` did the same. Neither is a shape linkTo emits, so only hand-written notes are affected."
    suggested_action: 'Strip the fragment before the exists check; treat // as prose.'
    suggested_owner: dev
    status: closed
    fixed_date: '2026-09-23'

