top_issues:
  - id: 'TASK-141-BUG-7'
    severity: high
    file: 'skills/qa-next/scripts/uat-status.mjs'
    finding: "`blocked` and `na` REQUIRE --note (earlier guard) and --note is now REFUSED on a kept ✅ (cycle-2 guard), so both verdicts are impossible against an accepted row — while SKILL.md:181/185 and README:99 all still state they leave ✅ and update the note. Step 2's two documented early exits are dead ends on an accepted row."
    suggested_action: "On a kept ✅ append to the note cell rather than replacing it, so the documented behaviour becomes true and the sign-off survives; keep --clear-note refused."
    suggested_owner: dev
    status: open
  - id: 'TASK-141-BUG-8'
    severity: medium
    file: 'skills/qa-next/scripts/uat-status.mjs'
    finding: "The cycle-2 guard enumerates `clear || note` and omits `bug`, so `--set <id> pass --run <p> --bug <b>` on a ✅ row takes the kept branch and silently replaces the owner's `accepted <date> — <why>` with the bug link, --check green. This is the same one-door-closed-another-open class the guard's own comment claims to have eliminated — committed inside the fix for it."
    suggested_action: "Stop enumerating flags: make the kept path APPEND to the note cell by construction, so no future flag can reopen the door."
    suggested_owner: dev
    status: open
  - id: 'TASK-141-CR3-3'
    severity: low
    file: 'skills/qa-next/README.md'
    finding: "README § Registry states still says a pass, blocked or n/a against an accepted row leaves ✅ and updates Last run and Notes / bug — made false for blocked and na by cycle 2, and cmdSet's own comment cites this section as the authority for the demotion rule."
    suggested_action: 'Update in the same edit as BUG-7 so code, SKILL.md and README state one rule.'
    suggested_owner: dev
    status: open
  - id: 'TASK-141-CR3-4'
    severity: low
    file: 'skills/qa-next/scripts/uat-status.mjs'
    finding: "requireIdValue was applied to the two readers only, so `--accept` with no id gives the subjectless `uat-status: : no registry row` and `--accept --force` reports `--FORCE: no registry row`; cmdAccept's and cmdCell's messages echo the un-normalised string while updateRow matched the normalised one."
    suggested_action: 'Route the writers through requireIdValue too and have their messages use the normalised id.'
    suggested_owner: dev
    status: open

