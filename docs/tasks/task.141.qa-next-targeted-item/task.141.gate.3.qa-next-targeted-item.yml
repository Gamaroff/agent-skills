gate: FAIL
status_reason: "Cycle 2's sign-off guard enumerated the doors into the note cell and missed one (--bug), and closed a legitimate path entirely (blocked/na on an accepted row are now impossible, which SKILL.md and README both still say is allowed). The defect class is the guard's own shape, not the missing flag."
