nfr_validation:
  security:
    status: PASS
    notes: >-
      No shell-out, no eval, no network anywhere in the engine; the only local require is
      yaml-subset.js, asserted by a test. `repoWorktrees()` was deliberately written against the
      filesystem rather than invoking git, preserving that property. The resolver refuses ephemeral
      anchors. No secrets in the change set.
  performance:
    status: PASS
    notes: >-
      `scan` reads only to the closing `---`: a 5,000,029-byte file costs 8,192 bytes, asserted in
      bytes rather than seconds. Baselines 90.3 / 108.0 / 152.7 ms for 1 / 100 / 1000 observations.
  reliability:
    status: PASS
    notes: >-
      The workspace is deterministic across worktrees, archival cannot destroy data, the health
      check reports accurately in both directions, and the two path encoders are now pinned to each
      other end to end.
  maintainability:
    status: PASS
    notes: >-
      Every non-obvious rule carries the failure it prevents, at the site where a reader would
      otherwise simplify it. The test file names the mutation that catches each guard, and where a
      cheap test would prove nothing it says so — the real-worktree requirement, the eight-alignment
      sweep, the both-directions fork pair, and the no-reimplementation encoder check.

