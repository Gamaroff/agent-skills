top_issues:
  - id: "TASK-93-004"
    severity: high
    file: "shared/resources/observation-log.js"
    finding: >-
      The cycle-1 fix for TASK-93-002 sweeps every directory under `~/.claude/projects/`, so ANY
      other project's legitimate workspace reads as a fork of this one. Demonstrated on this machine,
      which has 12 project directories: planting a `skill-observations/` under an unrelated project's
      directory makes `doctor` report `fork-detected`, exit 1, naming that unrelated path. The moment
      a second project adopts the observation log, doctor fails in BOTH projects, permanently, on
      every run. That is worse than the blindness it replaced: an alarm that always fires is one
      nobody reads, which is this repo's own recorded lesson (`bug.7` — an ignored check is a check
      that does not exist). Introduced by a fix that was correct in isolation.
    suggested_action: >-
      A fork is a second workspace for THIS project, not any workspace anywhere. Restrict the sweep
      to the plausible encodings of this project only: the main worktree plus every linked worktree
      from `git worktree list --porcelain` (path separators replaced by hyphens), excluding the
      resolved workspace's own path. That set is exactly the fork TASK-93-001 used to create, so it
      catches the real case with no false positives. Cover it with a test that plants a workspace
      under an UNRELATED project directory and asserts `no-fork` stays true, alongside the existing
      test that plants a same-project one.
    suggested_owner: dev
    status: open

  - id: "TASK-93-006"
    severity: high
    file: "shared/resources/tests/observation-log.test.mjs"
    finding: >-
      The cycle-1 regression test for TASK-93-002 plants a directory in the developer's REAL
      `~/.claude/projects` on every `npm test` run, and its `mkdirSync(..., { recursive: true })`
      creates `~/.claude` and `~/.claude/projects` themselves if absent and leaves them behind; the
      `finally` removes only the planted leaf. Four further tests — every `doctor` invocation — READ
      the real home, because `forkCandidates()` probes `~/skill-observations` and
      `~/.claude/skill-observations` and no test passes an `env`. So the suite both mutates the
      user's data directory and returns results that depend on what happens to be in it: a developer
      with a stray `~/skill-observations` gets spurious failures. Found when a verification script
      for TASK-93-004 was stopped by the operator for containing an unguarded `rm -rf "$PJ/$ENC"`
      that would have deleted every session transcript and the memory directory had the preceding
      command substitution failed.
    suggested_action: >-
      Redirect `HOME` to a temp directory for every `doctor` invocation, using the repo's existing
      env allow-list shape (`{ PATH: process.env.PATH, HOME: <temp> }`) with the temp home
      substituted. `cli(args, opts)` already spreads `opts` into `spawnSync`, so no helper and no
      production-code change is needed. Isolate by redirection rather than by careful paths under
      the real home — a temp home is discarded wholesale, so there is no cleanup step to get wrong.
      Add a before/after `find ~/.claude` diff to the verification routine.
    suggested_owner: dev
    status: open

  - id: "TASK-93-005"
    severity: medium
    file: "shared/resources/observation-log.js"
    finding: >-
      `sweepResolved()` archives with `fs.renameSync`, which silently overwrites an existing file of
      the same name in `archive/`. Demonstrated: an archived `0001-dup.md` was destroyed by an active
      file of the same name being swept, with `reason: "ok"` and the file listed as archived. This
      directly contradicts the engine's own posture elsewhere — `write` uses `wx` precisely so a
      create can never truncate — and the task's Rollback Plan claims "nothing is destroyed, only
      misfiled". Reachable whenever an active and an archived file share a name: an observation
      restored from the archive to be reopened, a `git checkout` of a deleted active file, or a
      corrupted `.id-floor` allowing id reuse.
    suggested_action: >-
      Refuse rather than overwrite. Check `fs.existsSync(dest)` before the rename (or use
      `fs.linkSync` + `unlinkSync`, which fails on an existing destination) and, on collision, leave
      the file in place and report it in the sweep's `skipped[]` with a reason of `collision` — the
      vocabulary already has that value. Cover it with a test asserting the archived file's contents
      survive.
    suggested_owner: dev
    status: open

