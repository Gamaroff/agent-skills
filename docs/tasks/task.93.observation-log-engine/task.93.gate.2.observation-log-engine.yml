status_reason: >-
  All three cycle-1 findings verified FIXED and mutation-proven. Cycle 2 was a refute pass over the
  whole branch diff and found two more: the cycle-1 fork-detection fix false-positives on every
  other project's legitimate workspace, and `archive` silently overwrites an existing archived file.
  One of the two was introduced by a cycle-1 fix — which is the case the refute pass exists for.
