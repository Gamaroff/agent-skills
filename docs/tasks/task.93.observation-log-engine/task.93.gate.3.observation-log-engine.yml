task_title: "Observation-log engine, workspace resolver and contract"
gate: CONCERNS
status_reason: >-
  All three cycle-2 findings verified fixed, each re-reproduced against the fixed code and
  mutation-proven. No HIGH findings this cycle — the loop is converging (HIGH counts 1, 2, 0). One
  MEDIUM remains: the cycle-2 fix introduced a SECOND path encoder (JS, beside the existing bash
  one), and nothing asserts the two agree. They do agree today, verified across six cases including
  a trailing slash and non-ASCII — but that is the exact "two derivations of the same path that
  drift" hazard this task's own risk register names, now with no guard.
reviewer: "QA Engineer"
updated: "2026-09-08T11:10:00Z"

top_issues:
  - id: "TASK-93-007"
    severity: medium
    file: "shared/resources/tests/observation-log.test.mjs"
    finding: >-
      There are now TWO implementations of the project-path encoding — `_ow_encode_project_path` in
      `resolve-observation-workspace.sh` (which decides where the workspace IS) and
      `encodeProjectPath` in `observation-log.js` (which decides where `doctor` LOOKS for forks) —
      and no test asserts they agree. Verified by hand this cycle that they do, across six inputs
      including `/`, a trailing slash, embedded spaces and non-ASCII. But if they ever diverge,
      `doctor` silently stops recognising the resolver's own workspace and the fork check goes quiet
      — a guard failing silently, which is the failure mode this entire component exists to
      eliminate. The task's own Low Risk Areas §1 predicted precisely this and prescribed a test;
      the cycle-2 fix created the second encoder without adding one.
    suggested_action: >-
      Add a test that runs both encoders over the same input set (at minimum: a normal absolute path,
      `/`, a trailing slash, embedded spaces, non-ASCII) and asserts equality — invoking the shell
      one through `spawnSync` on the real script rather than reimplementing it, since a
      reimplementation would be a third encoder and would prove nothing. Mutation-prove by changing
      one encoder and confirming the test goes red.
    suggested_owner: dev
    status: open

