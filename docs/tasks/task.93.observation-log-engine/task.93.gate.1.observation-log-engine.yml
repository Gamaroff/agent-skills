      resolver refuses ephemeral anchors. No secrets or credentials anywhere in the change set.
  performance:
    status: PASS
    notes: >-
      `scan` reads only to the closing `---`; cost is flat in body size (a 5,000,029-byte file
      costs 8,192 bytes read) and asserted in bytes rather than seconds. Baselines recorded:
      90.3 / 108.0 / 152.7 ms for 1 / 100 / 1000 observations.
  reliability:
    status: CONCERNS
    notes: >-
      Guards are thorough and mutation-proven, and the archival gate is correct in all four
      cases tested. But TASK-93-001 makes the workspace itself non-deterministic across
      worktrees, and TASK-93-003 silently corrupts data on a boundary — both are reliability
      properties, and both are silent when they fail.
  maintainability:
    status: PASS
