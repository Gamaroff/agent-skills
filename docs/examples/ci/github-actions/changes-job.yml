# changes-job.yml — SNIPPET, not a workflow. Copy the `changes` job and the gate into your own
# `.github/workflows/<ci>.yml`. Optional consumer template (agent-skills task.174); guide:
# docs/runbooks/ci-docs-only-skip.md in agent-skills.
#
# Copy classify-changes.sh into your repository (here: scripts/ci/classify-changes.sh). It needs
# bash, git, jq and curl on the runner. It does not need node or gh.

on:
  pull_request:
    # `synchronize` is the event the docs-only increment rule reads; keep the default types.
  push:
    branches: [main, develop]

# Optional, and independent of the classifier: a newer push to the same PR cancels the older run.
# A cancelled run is not a success, so it never grants a skip; a later green run of the same head
# does.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    # `actions: read` lets the classifier read the previous head's pull_request runs of THIS
    # workflow. A job-level block REPLACES the token's defaults, so `contents: read` (checkout) is
    # listed too. Without `actions: read` every lookup fails — and fails safe: the suite runs.
    permissions:
      contents: read
      actions: read
    # A stalled API call must not hold a runner for the 360-minute default.
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          # REQUIRED. With the default `fetch-depth: 1`, `origin/<base_ref>` is absent and the
          # three-dot diff has no merge base to measure from. Every failure fails safe (the suite
          # runs), so a shallow clone never skips anything — it just never skips at all.
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          GITHUB_TOKEN: ${{ github.token }}
          # REQUIRED: this workflow's own path. Its successful pull_request runs are the evidence.
          # Unset or empty runs the full suite on every push.
          CI_WORKFLOW_PATH: .github/workflows/ci.yml
          # Optional: space-separated shell `case` patterns (`*` matches `/`). Default `*.md docs/*`.
          # DOCS_PATTERNS: "*.md docs/* .agents/*"
          # Never set CI_OK_LOOKUP_FILE here: it replaces the API lookup and exists for tests only.
        run: bash scripts/ci/classify-changes.sh

  # Every heavy job gates on the output. An unset or empty output reads as "skip", which is why the
  # classifier writes `code` on every exit path.
  tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm test

  # The required check. It must PASS when the heavy jobs were skipped and FAIL when any of them
  # failed — a skipped job is `skipped`, not `success`, so test for failure, not for success.
  ci-ok:
    needs: [changes, tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate
        run: |
          case "${{ needs.changes.result }}:${{ needs.tests.result }}" in
            success:success|success:skipped) echo "ok" ;;
            *) echo "changes=${{ needs.changes.result }} tests=${{ needs.tests.result }}"; exit 1 ;;
          esac
