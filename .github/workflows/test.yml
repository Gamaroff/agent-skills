name: Test

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # tests/skill-frontmatter.test.js shells out to the Python frontmatter
      # parser and asserts the strict (PyYAML-backed) path is active.
      - name: Install PyYAML
        run: pip install pyyaml

      # shared/resources/read-config.sh reads skills-config.yaml through an awk tier when pyyaml is
      # absent, and awk is three implementations. tracker-access.test.sh §45 runs the subset scan
      # under each: a regex or an octal escape that works on the macOS BWK awk but not on mawk would
      # refuse a clean config on Debian, or accept a merge key on macOS — a divergence in the
      # permissive direction, on the tier a stock consumer host actually runs. The section skips
      # with a printed notice when a variant is missing, so without this step it silently covers one.
      - name: Install awk variants
        # `apt-get update` first, and deliberately: this step runs BEFORE the suite, so a stale
        # package index on the runner would fail the whole job for a reason unrelated to the change
        # under test. The install is a prerequisite for §45, not the thing being verified.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gawk mawk

      - name: Install dependencies
        run: npm ci

      # Ahead of the suite deliberately: a formatting failure should cost
      # seconds, not a full test run plus the replay evals. Fix with
      # `npm run format` — prettier is already a devDependency.
      - name: Formatting
        run: npm run format:check

      - name: Hermetic test suite (L1–L4)
        run: npm test

      - name: End-to-end replay evals (L4)
        run: npm run eval:all
