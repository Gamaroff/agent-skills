name: Test

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # tests/skill-frontmatter.test.js shells out to the Python frontmatter
      # parser and asserts the strict (PyYAML-backed) path is active.
      - name: Install PyYAML
        run: pip install pyyaml

      - name: Install dependencies
        run: npm ci

      - name: Hermetic test suite (L1–L4)
        run: npm test

      - name: End-to-end replay evals (L4)
        run: npm run eval:all
