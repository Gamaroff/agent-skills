name: Secret scan

# A secret-shaped string in a tracked file, a commit message or a PR body fails
# the build (task 229). The false positive task 228 removed was found by a
# downstream repository's scan, not here; this lane is what keeps the tree
# clean after that one-off fix.
#
# Deliberately NOT path-filtered, and deliberately a workflow of its own — the
# same two reasons shellcheck.yml gives: a path filter would miss a secret in
# any file outside it, and a step inside test.yml would force the gitleaks
# install into `npm run ci`, because evals/shared/tests/ci-gate-parity.test.mjs
# holds CI and the composite equal in both directions.
#
# LOCAL TWIN: scripts/lint-secrets.sh (`npm run lint:secrets`, part of
# `npm run ci`). The scan step below calls it, so the file set, the self-check
# and the PR text scan are defined once, in the script. The absent-binary case
# is the one place they differ: the script skips loudly, this lane installs the
# pinned binary.
#
# NOT a release gate yet. scripts/release-ci-verdict.mjs lists this workflow
# under WORKFLOWS.notGating: making release.sh require it is a follow-up once
# the lane has a green record (task 229, Out of Scope).
on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — the commit-message scan reads <base>..<head>, and the
      # default depth of 1 holds no base commit to read from.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # PINNED, for the reason shellcheck.yml pins its linter: an unpinned
      # scanner's new rule fires on untouched text and turns every PR red for a
      # reason unrelated to the PR. The version is printed so a bump's fallout is
      # attributable to it.
      #
      # Bumping this: change GITLEAKS_VERSION, run `npm run lint:secrets` with
      # that version, and reword (or `gitleaks:allow` with a reason) whatever the
      # new version adds — in its own commit. The opt-in pre-commit hook in
      # .pre-commit-config.yaml pins its own, older version; this pin is the
      # authority.
      - name: Install gitleaks (pinned)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "$url" | tar -xzf - -C /usr/local/bin gitleaks
          gitleaks version

      # The PR text scan's inputs go in through env:, never as ${{ }} inside
      # run: — a PR body is text anyone opening a PR controls, and interpolating
      # it into the script is script injection. On a push event the body is
      # empty and the range is before..after; a new branch's all-zeros `before`
      # is skipped by the script.
      - name: Scan tracked files for secrets
        env:
          SECRET_SCAN_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.event.after) }}
          SECRET_SCAN_PR_BODY: ${{ github.event.pull_request.body }}
        run: npm run lint:secrets
