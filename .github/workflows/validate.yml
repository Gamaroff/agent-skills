name: Validate Skills

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'scripts/generate-skill-dependencies.mjs'
      # `skill-dependencies.json` is the file the drift check regenerates and
      # diffs — without it here, a hand-edit of the graph would not even trigger
      # this workflow. `skill-profiles.json` is listed so a profile edit re-runs
      # the catalog and bundle checks; the drift step does not read it (its seed
      # validation lives in skill-dependencies-drift.test.mjs, run by test.yml).
      - 'shared/resources/skill-dependencies.json'
      - 'shared/resources/skill-profiles.json'
      - 'docs/reference/skill-catalog.md'
      - '.github/workflows/validate.yml'
  push:
    branches: [main, develop]
    paths:
      - 'skills/**'
      - 'scripts/generate-skill-dependencies.mjs'
      - 'shared/resources/skill-dependencies.json'
      - 'shared/resources/skill-profiles.json'
      - 'docs/reference/skill-catalog.md'
      - '.github/workflows/validate.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # setup-python provides a bare interpreter. Without PyYAML the validator
      # falls back to a regex parse that cannot detect malformed frontmatter,
      # which is exactly what this job exists to catch.
      - name: Install PyYAML
        run: pip install pyyaml

      # The catalog and bundle checks below are pure Python; the
      # skill-dependencies generator is Node. `ubuntu-latest` does ship a Node,
      # so this is not about availability — it pins the same major that
      # release.yml's drift check runs on, so the two cannot disagree about the
      # generated file and produce a PR that is green here and red at tag time.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate all skills
        run: |
          failed=0
          for skill_dir in skills/*/; do
            [ -d "$skill_dir" ] || continue
            echo "Validating $skill_dir..."
            python skills/create-skill/scripts/quick_validate.py "$skill_dir" || failed=1
          done
          exit $failed

      - name: Catalog up-to-date check
        run: |
          # generate-catalog is a pure Python script — no Node setup needed.
          python3 skills/create-skill/scripts/generate_catalog.py
          if ! git diff --quiet docs/reference/skill-catalog.md; then
            echo "::error::Skill catalog is out of date."
            echo "Run 'npm run generate-catalog' locally and commit the diff."
            git --no-pager diff docs/reference/skill-catalog.md | head -100
            exit 1
          fi

      - name: Skill dependency graph up-to-date check
        run: |
          # The graph is generated from each SKILL.md's `invokes:` frontmatter.
          # A stale graph means install profiles resolve the wrong closure — a
          # consumer gets a pipeline missing a step, and finds out mid-run.
          node scripts/generate-skill-dependencies.mjs
          if ! git diff --quiet shared/resources/skill-dependencies.json; then
            echo "::error::skill-dependencies.json is out of date."
            echo "Run 'npm run generate-skill-deps' locally and commit the diff."
            git --no-pager diff shared/resources/skill-dependencies.json | head -100
            exit 1
          fi

      # A shared/resources/ edit committed without re-bundling ships skills whose
      # references/ copies are stale — or, worse, that reference a file which is
      # not in their bundle at all. Until now only scripts/release.sh caught this,
      # long after review. bundle_skill.py is pure Python, like the catalog check.
      - name: Bundle freshness check
        run: |
          python3 skills/create-skill/scripts/bundle_skill.py --all >/dev/null
          if ! git diff --quiet -- 'skills/*/references/*'; then
            echo "::error::Bundled references/ are out of date."
            echo "Run 'npm run bundle' locally and commit the regenerated files."
            git --no-pager diff --stat -- 'skills/*/references/*'
            exit 1
          fi
