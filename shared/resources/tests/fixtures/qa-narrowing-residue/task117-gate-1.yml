    status: PASS
    evidence: measured
    probes_executed: 161
    notes: '73 corpus cases from all five sinks fed raw and wrapped as **label** + list through summariseSection and checkCardSections, plus 15 classifier-specific shapes (200k-char bold lines, 100k stars, alternating bold ×20k, ****, **:**, CRLF, unicode, indented, bold-in-list, null, **Ready?**). No throw; every probe under 50 ms (RE_BOLD_LABEL is linear — the character class excludes *, so no backtracking). 3 deviations, none introduced by this diff: **** with a list beneath is refused as heading-only rather than passed (safe direction); CRLF lists were never detected as lists because RE_BULLET (.*)$ cannot cross \r (pre-existing, untouched). No untrusted input reaches a shell — the classifier only decides what text reaches an ADF/markdown body.'
  performance:
    status: PASS
    notes: 'One extra regex test per non-fence line in dropHeadingLines, linear. Probed with a 200,000-character bold line and 100,000 asterisks: < 50 ms each.'
  reliability:
    status: PASS
    notes: 'The corpus test carries a non-vacuity floor (≥ 100 documents) and the 29 → 0 → 28 sequence was measured, not asserted. The rollback is one revert plus bundle, and the test names the state it would leave.'
  maintainability:
    status: CONCERNS
    notes: 'The affected-document count is stated four ways across the change (26 / 15 / 29 of 120 / 28 of 120) with no single definition (CR-5), and the heading-only message says "nothing under it" even when the summariser stopped in front of content (CR-4). Both are cleanups, both cheap; recorded so qa-fix takes them with the property rewrite rather than leaving two figures to drift.'

