schema: 1
task: 'task.117.card-preflight-heading-only'
task_title: 'The card preflight passes a Success Criteria block that renders as a bold label with nothing under it — 15 of 106 task docs'
gate: CONCERNS
status_reason: 'All five phases delivered and the corpus proof holds (29 → 0, mutation-proven red at 28). CONCERNS on three reproduced medium defects in the new heading-only property: its list-item half is inert because it reads post-collapse text (CR-1), terminator-less prose is taken as a label (CR-3), and the epic transform runs before the bold-label drop so epic cards are not fixed at all (CR-2). All three are in the queue for qa-fix.'
reviewer: 'QA Engineer'
updated: '2026-09-16T21:03:56Z'

top_issues:
  - id: 'CR-1'
    severity: medium
    file: 'shared/resources/jira-sync.js'
    finding: 'The no-list-item half of isLabelOnly is inert: it receives the summariser prose text whose newlines were already collapsed to spaces, so a lead-in ending in a colon with bullets directly beneath ("The task is done when all of:\n- a\n- b") raises a Critical heading-only finding.'
    suggested_action: 'Evaluate the property against the pre-collapse section lines (return a hasListItems flag from summariseSection, or pass the dropped-heading lines), and add a fixture for lead-in colon + bullets with no blank line.'
    suggested_owner: dev
    bug_ref: 'task.117.bug.1.label-property-overbroad.md'
    status: open
  - id: 'CR-2'
    severity: medium
    file: 'shared/resources/jira-sync.js'
    finding: 'EPIC_CARD_SECTIONS.Summary.transform rewrites **Label:** to Label: BEFORE summariseSection, so the bold-label drop never sees an epic standalone label — the epic card still publishes "Existing System Context:" and stops, and the preflight now reports it as heading-only plus no-body although a list sits under the label.'
    suggested_action: 'Drop standalone label lines before the transform (run dropHeadingLines on the raw section first, then transform), so the transform only sees mid-paragraph bold; add an epic fixture beside C2.'
    suggested_owner: dev
    bug_ref: 'task.117.bug.2.epic-transform-precedes-label-drop.md'
    status: open
  - id: 'CR-3'
    severity: medium
    file: 'shared/resources/jira-sync.js'
    finding: 'No sentence terminator alone is taken as proof of a label: a one-line Summary without a full stop, a Breaking Changes reading None, or a truncated paragraph ending in … becomes a heading-only finding that the review-* skills escalate to Critical (QA-promoted: reviewer confidence medium, all four shapes reproduced by QA).'
    suggested_action: 'Tighten the property to describe a label rather than unpunctuated prose — trailing colon, or short and with omitted content beneath — and add fixtures for the one-line summary and None shapes.'
    suggested_owner: dev
    bug_ref: 'task.117.bug.1.label-property-overbroad.md'
    status: open

