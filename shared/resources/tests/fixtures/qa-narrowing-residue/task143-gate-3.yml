status_reason: 'TASK-143-BUG-3 and QA2-2 fixed, but the replacement file-name date rule ignores the phase (drops a same-day prior run before this run wrote anything) and uses the earlier of UTC/local dates, wrong east of UTC; it also cannot see the env label. All three are in the legacy (v0.51.0, runFile null) derivation only.'
