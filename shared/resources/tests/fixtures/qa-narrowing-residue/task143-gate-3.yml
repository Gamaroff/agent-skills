top_issues:
  - id: 'TASK-143-BUG-4-PHASE'
    severity: medium
    file: 'skills/qa-next/scripts/uat-status.mjs'
    finding: 'The legacy date exclusion ignores phase: at selected/resolved this run has written no file, so a same-day prior run is dropped from priorRuns and the resumed run is recorded as the 1st (CR-1, bug + high confidence).'
    suggested_action: 'Apply no exclusion before executed; test a same-date prior file read at selected/resolved.'
    suggested_owner: dev
    bug_ref: 'task.143.bug.4.legacy-date-rule-phase-and-timezone.md'
  - id: 'TASK-143-BUG-4-TZ'
    severity: medium
    file: 'skills/qa-next/scripts/uat-status.mjs'
    finding: 'platform-variance: startDate takes the earlier of the UTC and local dates, too early east of UTC; v0.51.0 named files by the local date, so TZ=Asia/Tokyo excludes a genuine previous-local-day run (CR-2, bug + high confidence).'
    suggested_action: 'Use the local calendar date only; add a UTC+ TZ test that keeps the previous-local-day file.'
    suggested_owner: dev
    bug_ref: 'task.143.bug.4.legacy-date-rule-phase-and-timezone.md'
  - id: 'TASK-143-BUG-4-ENV'
    severity: low
    file: 'skills/qa-next/scripts/uat-status.mjs'
    finding: 'v0.51.0 wrote one file per date AND env label; the date-only match also drops a same-day run under another label, which the tool cannot distinguish (CR-3).'
    suggested_action: 'Flag the from-executed derivation as unverifiable rather than presenting it as exact.'
    suggested_owner: dev
    bug_ref: 'task.143.bug.4.legacy-date-rule-phase-and-timezone.md'

