task: 'task.117.card-preflight-heading-only'
task_title: 'The card preflight passes a Success Criteria block that renders as a bold label with nothing under it — 15 of 106 task docs'
gate: CONCERNS
status_reason: 'All three cycle-1 findings verified fixed from a clean process and their bugs closed. The refute pass found one medium defect in the cycle-1 fix itself — a dot anywhere in the line (a filename, a version) disqualifies a bold label, so the original defect survives through that shape — plus three low bugs and three cleanups in the same area. One more fix cycle.'
reviewer: 'QA Engineer'
updated: '2026-09-16T21:24:48Z'

top_issues:
  - id: 'CR2-1'
    severity: medium
    file: 'shared/resources/jira-sync.js'
    finding: 'RE_BOLD_LABEL ([^*\n.!?]+) and isLabelOnly (/[.!?]/ anywhere) treat a dot anywhere in the line as a terminator, so **Changes to jira-sync.js**: followed by a list is neither dropped nor reported and the card publishes the label and stops — the task.117 defect through a filename.'
    suggested_action: 'Test for a TRAILING terminator only: forbid [.!?] immediately before the closing ** in RE_BOLD_LABEL, and use /[.!?]\s*$/ in isLabelOnly; fixtures for **jira-sync.js changes**: (label) and **None.** (content).'
    suggested_owner: dev
    bug_ref: 'task.117.bug.3.dot-anywhere-disqualifies-label.md'
    status: open
  - id: 'CR2-2'
    severity: low
    file: 'shared/resources/jira-sync.js'
    finding: 'The heading-only omitted count is paras.length - 1, which counts blocks ABOVE the label and fences beneath it, so for **Before** (GitHub): + a fence the message promises content beneath will reach the card if the label becomes ###, when it would yield empty instead.'
    suggested_action: 'Count only summarisable (prose/list) paragraphs after the label for the stopped branch; fall back to the nothing-under-it wording when what remains is all tables or code.'
    suggested_owner: dev
    status: open
  - id: 'CR2-3'
    severity: low
    file: 'skills/create-task/SKILL.md'
    finding: 'create-task, create-story and create-epic re-derive the heading-only remedy as put a sentence or list under the label rather than deleting it — wrong for the stopped form the code now distinguishes, and against the contract rule not to re-derive the fix.'
    suggested_action: 'Say only that heading-only means present-and-useless and that the tool Fix: line names the remedy for each of its two forms.'
    suggested_owner: dev
    status: open
  - id: 'CR2-4'
    severity: low
    file: 'shared/resources/jira-sync.js'
    finding: 'RE_BOLD_LABEL makes the colon optional, so a bold-only line that IS the whole section (**None** as a Breaking Changes body) is dropped and reported heading-only, while the isLabelOnly comment promises None is content.'
    suggested_action: 'A bare bold line is a label when content follows it and content when it is the whole section; pin both with fixtures and say so in the comment.'
    suggested_owner: dev
    status: open

